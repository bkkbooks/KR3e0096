body:
  text: 續名醫類案卷二十八錢塘魏之琇撰跌撲陸養愚治沈華南原有濕熱痰積五旬時因乘馬墜地傷其左脅痛不可忍外科以膏散敷治之而愈然每疾走脅間一點微痛少息半日痛即止矣周甲偶患滯下小腹痛引左脅手不可按裏急後重或與香連檳榔利止而痛不止發熱便時後重尤劇飲食全不思脈之沈弦有力左關尤甚曰痛者積瘀也治法云瘀血穢腐下焦令人不食則飲食不思者亦瘀也當急下之痛隨利減矣用潤字丸加桃仁泥合丸之紅花湯送下二錢出稠痰碗許而腹脅抽痛更甚此瘀積動而未出故也再投二錢半日許又出稠痰碗許內有黑色如泥者一二塊痛仍不減脈尚沈弦而堅又投三錢半日許出泥色塊并稠痰數碗而痛頓減腹脅即可按漸思飲食其脈亦和後以達氣養榮湯加人參數劑而安陸肖愚治寧見源年近古稀偶登舟失足墮水足大股挫氣作痛左脅亦引痛服藥已愈三月矣忽左股內髀樞作痛或謂此乃肝經所絡之地髙年肝血不足虛而作痛或謂溫痰流注或謂肝經久鬱或謂崑崙氣逆遍治疼腫日甚憎寒作熱脈之六部洪數而左關尺帶弦因詢其曾有所傷否乃述前墮水之由曰此必瘀血未盡留而成毒也視痛處已有膿在內令延外科教以針破之出膿血數碗服大料參蓍托裏散數十劑而痊一人因墜馬腰痛不止日輕夜重瘀血締矣與四物去地加肉桂桃仁泥紅花蘇木四服大便下黑而痊湖廣有胡氏子五六嵗時因升髙為戲墜地拗其頭骨稍長竟不能伸朱守真者同里也一日相見戲挈其頭有聲戛然置地溘然死矣朱懼而逸胡氏子頃許復蘇頭項復直歸家家人驚喜謀尋朱謝之説頤張子和治張仲溫因登露臺髙四尺許下臺肭一足外踝腫起熱痛如火一醫欲以扉針刺腫出血張急止之曰肭已痛矣更加針二痛俱作何以忍也乃與神祐丸八九十丸下二十餘行禁食熱物夜半腫處發癢痛止行步如常張曰吾之此法十治十愈不誑後人一小兒七八嵗膝被肭行行則痛數月矣張曰小病耳以舟車丸通經散溫酒調而下之夜半涌泄齊行上吐一碗下泄半缶既上牀其小兒謂母曰膝臏癢不可任來日使服烏金丸壯其筋骨一月疾愈而走矣德宗時有朝士墜馬傷足國醫為針腿去針有氣如煙出朝士困􅉵將至不救國醫惶懼有道士詣門云某合治得視針處責國醫曰公何容易生死之穴乃在分毫人血脈相通如江河針灸在思其要津公亦好手但誤中孔穴乃令舁牀就前於左腿氣滿處下針曰此針下彼針跳出當至簷板言訖遂針入寸餘舊穴之針沸然躍出果至簷板氣出之處泯然而合疾者當時平愈朝士與國醫拜謝以金帛贈貽道士不受啜茶一甌而去逸史石城尉戴堯臣試馬損大指血出淋漓用蔥新折者煻火煨熱剝皮其間有涕使將罨損處仍多煨蔥續易熱者或搗爛敷之而痛止翌日洗面不見痕迹宋推官鮑縣尹皆得此方每有殺傷氣未絶者亟令用此活人甚衆本草綱目龔子才治一男子墜馬腹有瘀血服藥下之遂發熱盜汗自汗脈浮澀此重劑過傷氣血所致也投以十全大補湯益甚時或譫語此藥力未及而然以前藥加炮附子五錢服之即睡覺來頓安再劑而愈張三錫云曾見一人因踢門用力遂小腹痛不止湯藥亂投臨死小腹腫青方悟往日受病之因也孫文垣治一人梅瘡後偶遭一跌環跳脫出不能復入科臼疼痛殊甚兩足長短不齊此蓋瘀血流入科臼占滿故竅致骨不得復入也今但消去瘀血以行氣活血之藥主之佐以下行嚮導之劑庶可復元用陳年窖中磚瓦洗淨煅過四兩生地杜仲牛膝骨碎補丹參赤芍各一兩五錢自然銅三兩蒲黃車前子蘇木各一兩鹿角二兩元明粉五錢各為末以茅草根一斤紅花四兩煎膏拌晒前藥煉蜜為丸梧子大每空心及食前酒送下八九十丸初足長出二寸餘服藥後只差半寸設再製久服必能全愈惜素畏藥中道而止李克齋家一鶴飛來馴熟不去以為祥瑞未幾鶴折其脛私心殊不喜因問有能接其脛骨者乎一人對曰家藏接骨祕方想人禽一理或可接也急命修製之方用土鱉新瓦焙乾半兩錢醋淬七次自然銅乳香沒藥菜瓜子仁各等分為細末每服一分半酒調灌之鶴脛如故但人上體傷食後服之下體傷空心服之李公乃以其方傳于人續金陵瑣事張三錫云南京下浮橋梁回回丹藥每用二三釐瓜仁搗泡酒下極驗逺近患損傷者競覔之要皆不外土鱉自然銅第製法精耳四川提督總兵官吳英説昔得祕方治撲打跌損傷極效雖重傷瀕死但一絲未絶灌下立蘇往在福建為副將時軍中有二辨相鬬皆重傷其一則死矣吳聞馳往視之惟心頭氣尚微暖亟命以藥灌入覺胸間喀喀有聲不移時張目索食翌日遂能起行自後屢著神效云其方以十一月采野菊花連枝葉隂乾用時每野菊花一兩加童便無灰酒各一碗同煎熱服又一方未退胎毛小雞一隻和骨生搗如泥作餅入五加皮敷傷處接骨如神居易録馮楚瞻于五十嵗由欒城回都適有鄉人伐一大樹時風沙蔽目騎至樹撲人騎俱為壓倒正在腰脊間脊骨脫縫瘀如腰斬胸骨扇動腰膚青紫下體俱冷頭汗如雨因憶跌撲傷損門中有一絲血入心即死之語以酒沖童便服之頓覺臍下極冷氣逆上奔乃思急固陽氣為主以人參一兩炒白术六錢製附子三錢煎服日二劑有外科老醫勸用破血行瘀之藥馮曰傷在上者宜消瘀滯傷在下者宜補氣血此正法也遂早晚用八味丸之加牛膝杜仲五味者各五錢隨進參术附湯各一劑緣右腎連脊受傷腎經祖氣無根故不能寐併不能言一言一寐即逆氣上奔欲絶憑仗藥力之猛得以接納藥後必進乾餅以壓之腸中如火乾餅多進亦易消化八日始便並無點瘀外以豬油熬化頭髮入十全大補加減煎膏以乳末收之遍貼傷處七日後氣逆少緩半日後漸可寐言月餘始能憑几而坐兩月餘始能扶立而脊骨突起半寸終成痼疾自是精力大衰膝踝筋脈之間時有痰痛然幸知破格為治得以全生李南公知長沙縣有鬬者甲強乙弱各有青赤南公召使自以指揑之乙真甲偽也詰之果服蓋方有櫸枊以葉塗膚則青赤如毆傷者剝其皮橫置膚上以尉之則如倍傷者以水洗不落南公曰毆傷者血聚而硬閲偽者不然故知之司馬洓水紀聞葉南巖刺蒲時有羣鬨者訴于州一人流血被面經重創腦幾裂命懸旦夕公見之惻然時家有刀瘡藥公即起入內自搗藥令舁至幕廳委一謹厚廳子及幕官曰宜善視之勿令傷風此人死汝輩責也其家人不令前乃略加審核呈狀收其仇家于獄餘皆釋之友人問其故凡人爭鬬無好氣此人不救死矣則償命者一人寡人之妻孤人之子者幾人干證連係者幾人破家者幾人此人愈特一鬬毆罪耳且人情欲訟勝雖于骨肉亦甘心焉無所恤忿懥故也未幾傷者果平復而二家之訟遂息刀瘡藥方端午取韭菜搗汁和石灰杵熟為餅隂乾用以治諸傷敷創處即止雖骨破亦合有竒效韓貽豐攝永寧篆有部民被毆死已逾夕即單騎往驗則遍身重傷僵挺無生氣矣因念死者父母年老貧病惟此子死則二老必不能生不得已因取針針其百會亦冀萬一非謂其必活也時天氣甚寒令村人各解衣輪尉尸身又熬水令極熱探湯揉尸手足無何尸得人氣體頓柔針至十四針匆喉中作響口鼻微有氣診其脈脈忽動乃喜曰有救矣針至二十一針則喉間大出聲痛哭手足能屈伸口稱遍體痛不可忍則皆其被毆處也乃呼酒來以藥飲之傷處糝之以藥痛處以針針之責令凶首保辜調養如限內死仍抵償後傷者全愈求和息乃杖凶首而遣之薛立齋治一男子墜馬傷頭并臂令蔥搗爛炒熱罨患處以熱手尉之服末藥降聖丹而愈本草云蔥大治傷損小兒張子和治一小兒約五六嵗同隊小兒以􅀢黍秸相擊逆芒倒刺於咽中數日不下粥藥腫大發其家告張張命取水依道經咒法以左手屈中指及無名指作三山印坐水盞於其上右手搯印文是金鎗印腳踏字立望太陽或燈火取氣一口次在淨水盞中咒曰吾取老君東流順老君奉敕攝去毒水五托大帝尊所到稱吾者各各現帝身急急如律令攝七遍吹在盞中虛攪卓三次為定其兒咽水下咽曰我可也三五日腫散乃知法亦有不可侮者夷堅志云小兒誤吞稻芒著咽喉中不能出者名曰榖賊惟以鵝涎灌之即愈蓋鵝涎化榖相制耳一兒誤吞一錢在咽中不下諸醫不能取亦不能下戴人熟思之忽得一䇿以淨白表紙令卷實如箸以刀縱橫亂割其端作鬅鬙之狀又别取一箸縛針鉤於其端令不可脫先下咽中輕提輕抑一探之覺鉤入錢竅然後以紙卷納之咽中與鉤尖相抵覺鉤尖入紙卷之端不礙肌肉提之而出方雪瓢偶在鮑緑飲處談及名醫類案中以南硼砂治誤吞金及羊脛骨灰治法皆神驗座客有言麵筋灰治誤吞銅錢甚異者方默識之歸適鄰家小兒誤吞銅錢哽喉間不能上下危急之際方即以法教之才下咽錢自口中出其巧值如斯殆有鬼神使之耶因附記之其法以麵筋置新瓦上燒作炭研末用滚湯調溫服錢未下咽者即從口出已下咽者必從便出近又傳以生大蒜塞鼻中其錢立出尤為簡便第未之試耳張子和曰昔過株林見一童子誤吞銅鐵之物成疾而羸足不勝身會六七月淫雨不止無薪作食過飢數日一旦鄰牛死聞作葵羮粳飯病人乘飢頓食之良久注㵼如傾覺腸中痛遂下所吞之物余因悟內經中肝苦急急食甘以緩之牛肉大棗葵菜皆甘物也故能寬緩腸胃且腸中久空又遇甘滑之物此銅鐵所以下也近有稚子戲以線錘置口中誤吞之有胡僧啖以餳糖半斤即於榖道中隨穢而下僧云凡誤吞五金者皆可啖也近峯聞略續醫説舊案有僧用餳糖出眼中箭頭甚捷張景嶽治王氏子甫周嵗其母以一鐵釘與之玩弄吞入喉間往視之見其母倒提兒足以冀其出口鼻皆血因曉之曰此豈倒懸可出者乎速令抱正遂聞啼聲蓋針以下咽不在喉矣因閲本草鐵畏朴硝遂得一法用磁石一錢朴硝二錢並研為末令以熬熟豬油加蜜和調藥末與服下午吞之至三鼓時解下一物瑩如蓴菜潤滑無稜藥護其外撥視之則釘在其中矣乃京中釘鞋所用蘑菰釘也立方之意以硝非磁石則不能使藥附釘磁石非硝則不能逐釘速出非油則無以潤非蜜則未必滑吞合是四者則著者著逐者逐潤者潤同功合力裹護而出矣嘗按物理小識亦載小兒誤吞鐵針以乳香荔枝朴硝為末以犬豕脂入鹽和之吞下自愈若碎鐡則用皂莢硇砂雷斆曰鐵遇神砂如泥似粉神砂應即硇砂也一吏部無子妻極妒妾方坐蓐乃盤腸生妻暗將針刺於腸上妾後覺腸有時刺痛難忍穩婆私告于妾妾與吏部言之諸醫束手一全真曰我能治之用磁石大塊從痛處引之引至于臍針從臍出妾竟無恙黃蟄南公談續金陵瑣事劉浴德號壺隱知醫洞庭葉雅南之細君五七日前偶因事不順意意欲自斃遂吞布針十餘根因請箕仙降筆云吾乃碧雲仙使始問曾吞針否又曰果則果矣事則無事仙方不書凡方可治復問明書凡方良久乃書問壺隱子因造劉問方劉教以櫟炭末三錢用井水調服可下如未下可再服之乃曰愚意欲餌磁石未審何如劉曰叵叵叵叵猶言不可不可也宜取磁石一大塊置肛門外或庶幾焉如法治之針果出也續金陵瑣事百一選方以淨器盛新汲水一盞捧之面東默念云謹請太上東流順水急急如南方大帝律令敕一氣念七遍即吹一口氣入水中如此七吹以水飲患人立下或用此呪水可以食針併竹刺較子和案中呪頗簡易諸骨哽喉用清水一碗以手指向水面虛寫天上金雞呌地下草雞啼兩雞并一雞九龍下海喉嚨化如滄海二十五字口誦七七遍飲之立愈又一法以清水一碗用手指向水面虛寫鳥飛龍下魚化丹邱八字飲之立效並酉陽雜俎劉浣鄰人馬湘生兒數月偶遺金網巾圈子案上兒誤吞之哀泣不已湘求救於醫醫適出湘伺於門坐立不定或詢其子何疾驚惶如是湘以前事告或教以急買韭數莖熟而不斷與蠶豆同咽之不過二次從大便出矣此法方書所不載故表之北壕紀言李奎治一人誤吞指爪喉哽幾殆奎令剪人指爪燬服之立愈疑其古方奎曰不然此內經所謂衰之以屬者也聞者歎服寧波府志張子克治當塗郭祥正子患咳嗽肌骨如削醫多以為勞張曰是不足憂就坐飲以藥忽大吐使視涎沫中當有物也視之得魚骨宿疾皆愈新安志一富家子被雞骨哽百方莫治家人驚惶忽一叟至自云我有巧術但行手法取之不勞藥餌也許以千緡厚謝叟乃以絲綿裹白糖如梅大令其咽下入喉間留一半於外時時以手牽掣俾喉中作癢忽然痰涎涌出其骨黏於綿上遂如約酬之續醫説孫文垣治查良本內人怒後偶食魚頭骨哽於喉中即以饅頭粽肉等壓之骨雖下隨覺胸膈不快又服銷骨藥二帖已七日矣胸膈脹痛殊甚飲食悉從背下惡寒發熱脈之兩手弦數蓋骨哽之後用哽物壓之傷其胃脘必有瘀血停畜膈間將食管逼向後故飲食覺從背下也但銷去瘀血使食管復原胸膈之痛可瘳矣以五靈脂為君山查延胡索桃仁枳殼為臣赤芍丹皮香附山梔為佐柴胡石菖蒲為使臨服入韭汁一酒杯服後胸膈寬快大便㵼一次痛減大半飲食乃從右下右邊胸膈略痛吞物甚艱吐出痰皆血腥氣改以山梔赤芍歸尾桃仁劉寄奴五靈脂丹皮穿山甲入韭汁服之二帖全瘳張景嶽曰凡諸物哽於喉中或刺或骨必有鋒芒之逆所以棘而不下凡下而逆者反而上之則順矣故治此者當借飲食之勢涌而吐之使之上出則如拔刺之捷也若芒刺既深必欲推下非唯理勢不能必且遲延或飲食既消無可推送以致漸腫而害非細矣又曰凡諸骨哽或以餳糖一大塊滿口吞而咽之或用韭菜煮略熟勿切吞下一束即裹而下亦妙高坡纂異載洪洞韓肅即忠定公之父也三嵗時誤吞一釘家人皆驚哭殆盡其祖以神醫名視之曰無恙必待三年釘乃得出人莫之信遂定時日書壁間以俟但每作腹痛必絶而復蘇久漸黃瘦骨立及期謂家人曰兒將瘳勢必大作雖絶勿懼宜先煮粥飲以俟之既而腹果大痛一叫而絶良久吐出釘鋭盡刓又復絶逾時始蘇嵗餘獲安夀七十一卒金陵秣陵鄉中一人姓李號守泉符水絶妙逺近求無不立效其法命哽者坐自己佛堂中佛前放一盂淨水令親屬往求燒符用法訖徐以小筊卜之云已愈矣其人歸看淨水中所哽之物在內隨愈乃親見者治法彚景德鎮湖田市張婆女名婆兒因喫糍糕被噎而死氣尚未絶須明日方斂守尸悲哭忽聞擊户聲問為誰曰我是河裏住人陳曾二也張曰何故夜深相過曰知道婆兒不幸但扶䇿起坐將笤帚拍打背三下糍便落腹可活矣張啓門稱謝了無所見試用其法不食頃女腹如雷鳴即時安好逮曉尋訪陳曾二蓋七年前溺河而死者鬼未受生猶懷惻隱存心如是張乃命僧為薦拔之夷堅志續名醫類案卷二十八
