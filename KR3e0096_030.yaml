body:
  text: 續名醫類案卷三十錢塘魏之琇撰邪祟舒氏子為素衣女子所憑掩捕不得意緒恍惚如癡家人具狀請符於朱彥誠法師朱讀狀大駭曰必鱗介之精邪毒入脾肝裏病深矣非符水可療當躬往治之乃假巨鑊煎油二十斤焚符檄拘之乃大白鱉也鑊油正沸自投其中糜爛而死朱戒其家俟油冷以斧破鱉剖骨并肉曝日中須極乾入人參茯苓龍骨末成丸託為補藥命病者晨夕餌之勿使知之如其言丸盡病愈豔異編宋人王纂精針術元嘉中縣人張方女日暮宿廣陵廟門下夜有物假作其壻來女因被魅惑而病纂為治之下一針有獺從女被內走出病因而愈劉潁叔異苑顧歡隱於㑹稽素有道風有病邪者以問歡歡曰君家有書乎曰唯有孝經而已歡曰可取仲尼居置病人枕邊恭敬之當自差如言果愈問其故曰善禳惡正勝邪此病者所以差也吳均齊春秋北史黃帝灸法療神邪鬼魅及癲狂病語不擇尊卑灸上唇裏面中央肉弦上一壯如小麥大又用鋼刀將唇裏面弦上割令其斷更佳也秦承祖灸狐鬼神邪及癲狂諸般醫治不瘥者以并手兩大拇指用軟絲繩急縛之灸三壯其炷著四處半在甲上半在肉上四處盡一處不燒其病不能得愈神效不可量小兒胎癎妳癎一依此法灸一壯炷如小麥大東垣十書李士材治章氏女在閣時昏暈不知人蘇合丸灌醒後狂言妄語喃喃不休左脈七至大而無倫右脈三至微而難見兩手如出兩人此祟憑之脈也線帶繫定二大拇指以艾炷灸兩甲界鬼哭穴至七壯鬼即哀詞求去服調氣平胃散加桃奴數日而祟絶喻嘉言治楊季登次女病多汗食減肌削診時手間筋掣肉顫身倦氣怯曰此大驚大虛之候冝從溫補于補劑中多加茯神棗仁十餘劑全不應因思症非外感也內傷也雜症也虛汙振掉不寧能受補藥而病無增減且閨中處子素無家難其神情渾似喪敗之餘此曷故也忽悟曰此必邪祟之病而其父何不言往診問其面色曰時赤時黃因謂此症必有邪祟吾有神藥可以驅之季登才曰此女每夕睡去口流白沫戰栗而絶以薑湯灌至良久方蘇挑鐙侍寢防之亦不能止因見用安神藥甚當兼恐壻家傳聞故不敢明告也曰何不早言吾一劑可愈乃以犀角羚羊角龍齒虎威骨牡蠣粉鹿角霜人參黃蓍等藥合末令以羊肉半斤煎取膿汁三盞盡調其末一次服之果得安寢竟不再發相傳以為神異蓋以祟附于身與人之神氣交持亦逼處不安無隙可出故用諸多靈物之遺形引以羊肉之羶俾邪祟轉附骨角移從大便而出仿上古遺精變氣祝由遺事而充其義耳又熊去疾髫齡患一奇症食飲如常但脈細神呆氣奪色夭乃翁曰此何病也喻曰病名殗殜左傳所謂近女室晦即是此病彼因近女又遭室晦故不可為令郎受室晦而未近女是可為也即前方少加牛黃丸服旬日而安今壬午去疾已舉孝亷矣狐之迷人先用口向女子隂户一展其人即昏迷不省或男子則向陽物一展亦令昏迷方用真桐油抹於隂户陽物上其狐即大嘔而去妙不可言祕之本草綱目朱丹溪治一婦人如癎或作或輟恍惚不省人事一日略蘇醒診視忽聞牀上有香氣繼又無所知識朱曰氣因血虛亦從而虛邪因虛入理或有之遂以秦承祖灸鬼法灸治病者哀告曰我自去我自去即愈徐秋夫療鬼穴凡有病著鬼邪須針鬼穴鬼去病除其應如神一針名鬼宫人中是也針入三分二針名鬼信少商是也針入三分三針名鬼節隱白是也針入三分四針名鬼心太陵是也針入三分五針名鬼路行間是也針入三分六針名鬼枕風府是也針入三分七針名鬼關頰車是也針入三分八針名鬼門承漿是也針入三分九針名鬼臂間使是也針入五分十針名鬼額正髮際是針入二分十一針名鬼㑹正乳是也針入一分十二針名鬼腿陽陵是也針入三分十三針名鬼身異名舌縫是也針入舌縫中間一分出紫血治身腫難言心經邪熱微出血便效陳自明治一女子為邪所交腹作痞與太乙丹一錠服之隨下惡物其邪仍至又服半錠每夜更爇二三錠使烟氣盈屋遂不再至方見蠱門金劒峯之子患妖症吐舌數寸許每以足居上首居下顚倒而行劒峯偶送一道士出門復入中堂目見一婦人在户內走入屏風中乃碎屏風火之魅不復見而其子亦瘥雲間雜志蔡石户抱病三年耳中日聞鬼嘯凡有所往鬼必相隨初甚怖久之習聞殊不為怪病愈鬼嘯亦息同上臨海章安鎮有蔡木匠者一夕手持斧斤自外道遊東山東山衆所殯葬之處蔡沉醉中將謂抵家捫其棺曰是我榻也寢其上夜半酒醒天且昏黑不可前未免坐以待旦忽聞一人髙呌棺中應云喚我何事彼云某家女病損症蓋其後園葛大哥淫之耳郤請法師捉鬼我與你同行一看如何棺中云我有客至不可去蔡明日詣主人曰娘子之疾我能愈之王人驚喜許以厚謝因問屋後曽種葛否曰然蔡遍地翻掘內一根甚巨且有血煮啖女子病即痊輟耕録唐同州刺史孟詵云婦人夢與鬼交者鹿角末三指一撮和清酒服即出鬼精又古今録驗療妖魅猫鬼病人不骨言鬼方鹿角屑搗散以水服方寸七即言實也本草王教授云有婦人患赤白帶淋得豫針灸經初為灸氣海穴未效次日為灸帶脈穴有鬼附患身云昨日灸亦好只灸我未著今灸著我我今去矣可為酒食祭我其家如其言祭之其病如失此實事也豫初怪其事因思晉景公膏肓之病蓋有二鬼焉以其虛勞甚矣鬼得乘虛而居之今此婦人之疾亦有鬼者豈其用心而虛損故有此疾鬼亦乘虛而居之歟灸既著穴其鬼不得不去雖不祭之可也自此有來覔灸者必為按此穴莫不應手痠痛豫知是正穴也令歸灸之無有不愈其穴在兩脅季肋之下一寸八分有此疾者速宜灸之婦人患此疾而喪生者甚多切不可忽若更灸百㑹尤佳此疾多因用心使然故也資生經何百庸診西山道者素無疾病寢不能興曰六脈純隂為鬼所盜當午刻死竟如其言又嘗為劉某診曰尺脈有怪徴後嗣其有厄乎是夕其孫果溺水死雲南志錢國賓治土橋張林巡司書役也其妻勞怯已三年服藥無效卧牀不起矣脈沈大至骨數十至中一鼓或𨼆或現形色蒼脫所居暗室曰此非勞怯乃隂邪之症但不知名非藥可治先當移房再禳解之更語其母以好言相問見何惡祟婦只不答及移室褥上有毛數莖長寸半許迹露狐交即延道士及挂天師符印禳退至夜多人圍繞邪來反更頻煩因迫問婦曰但覺冷風吹面身即寒禁胸如石壓則昏不知人矣因再求救為思久之猛悟人交陽交也狐交舌交也密語其夫少製毒藥無聞六耳塗隂户四圍孤來果中毒而死乃元狐間生白毛肥壯多肉林乃剝其皮而刴之其婦服藥經年乃可奇疾穆吏部深者山東濟南人壬辰進士罷官里居忽患異疾耳中聞車馬之聲則疾大作一日聞耳內議曰今日且遨遊郊坰即有裝䭾驢馬鱗次而出其恙頓除至晚復聞遊者回䭾馬盡返耳中則所苦如故屢治不痊一日忽灑然若失敝帚軒剩語一人卧於牀四肢不能動只進得食好大言說喫物謂之失說物望病治法如說食猪肉時便云爾喫猪肉一頓病者聞之即喜遂置肉令病人見臨要却不與喫此乃失他物望也當自睡涎出便愈萬病回春有富家子年十七八病遍體肌肉折裂召黃子厚治子厚偕門生四五輩往診視各以所見陳論皆未當子厚乃屏人詰病者曰童幼時曽近女色犯天真乎曰當十三四曽近之已子厚曰得其說矣褚澄云精未通而御女則四體有不滿之處後日有難狀之疾在法為不可療後果惡汗淋漉痛楚而死其論抑或未然江南逆旅中一老婦啖物不知飽余德占以炊餅啖之盡一竹簀猶稱饑不已日飯一石米郁滄浪吳攟醴泉主簿蔡繩豫友也亦得饑疾食稍遲則頓仆悶絶繩有美行博學有文為時聞人竟以饑死無能知其疾者每為哀傷同上中琇按此恐即消病也豫嘗至候潮門外觀潮見一人丐食者一手掌倍大五指各長尺餘但伸而不能屈嘆其賦形之奇其人曰豫病也曩業織縑足以糊口客夏病傷寒當發汗時此手在被外獨不汗病愈而此手痛不已漸痛漸長以至于此今手不能作故乞食耳同上邱汝誠治一女子缺伸臂不下邱命其母裸女上身以單裙著之曰俟吾揭簾即去下裳母如命邱揚聲而入女羞縮臂即復故揮塵新談陸道光治一兒染奇症四肢堅不屈光曰此非藥可療舉傘覆之繞牀焚安息沉檀兒即平復少間又發屑沈香飲之遂瘳平湖縣志髙陽民家子方十餘嵗忽臂上生宿瘤痛癢不可忍醫皆不辨何症一日忽自潰中有圓卵墜出尋化為石劉工部霖以一金售之治膈病如神池北偶談江寧有蕭生者食香菌則死又有王生者飲茶則死必二三日始蘇醫無能識其故者志於此俟明醫或知之居易録桐城友人姚文燮字經三順治己亥進士詩畫皆有名年六十餘忽病不識字即其姓名亦不自知醫不知為何症也竟以是終按夢溪筆談記松滋令姜愚者忽不識字者數年後稍稍復舊信奇疾也同上劉進士祖向言潁州一少年為邪所侵疾入膏肓家人謂不可活置之路傍忽一道士過之自言善醫命取鐡鎚重數十斤鎚病者頭面父母泣謂病已至此鐡鎚下首立碎矣道士笑曰無傷也鎚下病者若無所知輒有一美婦人長二寸許自口中躍出而滅凡百鎚口出百婦人大小形狀如一少年立愈道士亦不復見池北偶談宋元嘉末有長廣人病瘥即能食却不得卧每飯輒覺其身增長數日頭遂出屋時假究為刺史令人度之已長三丈後復漸縮如舊乃死異苑醫書言瘦人驟肥肥人驟瘦皆不久同年薛為學登進士時體甚肥及為御史忽爾瘦削未幾公幹鄖陽一夕而殁聞殁時身軀縮小如十餘嵗小兒此尤可異也覽餘漫抄陶九成云都下一兒患頭痛不可忍有回回醫官用刀割開割上取一小蟹堅硬如石尚能活動頃焉方死痛亦遄止當求得蟹至今藏之輟耕録宋史載吕夏卿舉進士厯知制誥典滁州年五十二得奇疾身體縮小卒時才如小兒菽園雜記載御史薛惟覽餘漫抄作為學身體甚肥忽爾瘦削一疾而殁殁時縮小如十餘嵗兒自得語廣陵有田婦患泄㵼下惡如油鄰童以紙撚蘸然與油無異醫不能療孫滋九先生聞而往視令買補中益氣湯十劑天王補心丸四兩以煎劑下丸服訖而愈衆醫問之曰人驚恐則氣下大腸脹損所致此婦必受驚後得此疾也問之果力作于場見幼子匍匐赴火驚而急救得免遂得此疾此方書所未載奇疾方錢國賓治鎮江錢青藜中年無病一日足跟偶響聽之有聲自覺怪異數月漸響至頭竟如雷聲醫者症名不一七年懷生死之憂矣錢過京口甘露寺尋蒼耳草治毒㑹于涼亭偶言此症以骨雷告之邀至家候其脈五部皆和獨腎芤大舉之始見按之似無乃腎敗也自下響者足少隂腎經之脈起於小指之下斜走足心出然谷之下循內踝後别入跟中以上腨內出膕內臁上股入後臁貫脊且腎主骨腎虛則髓空髓空則鳴所以骨響自腳至頭即雷從地起響于天上也以六味丸加紫河車膏虎骨膏猪髓枸杞杜仲方示之彼謝曰公論破七年之迷良方起終身之病矣長揖而别至次年冬錢復之京口問已全愈癸亥冬山海天行時疫病者頭痛發熱惡心口渴神昏欲寐四肢不舉其肉推之則一堆平之則如故醫有作傷寒者有作時氣者投以發散藥無不加重死者數百時督師閣部孫及贊畫各傷一僕至乙丑春錢之關門謁太師談次問及曰此症天行時疫名肉行也人肉屬土土燥則崩土濕則流其邪感于血脈肌肉不比傷寒同治也古今醫集不載止于官邸便方見此異症一款因人血枯而感天時不正之氣當大補血用首烏枸杞歸地等味少加羌活風藥足以應病矣若經發散立死無疑湖州塢阿二織絲人也偶然兩膊紅十數條其紅條頭粗尾尖腹大長尺許濶寸許此青蛇氣異毒也急治之不然蛇形入腹而死或生大小腿如頭向上攻入腹者亦死以針挑破頭尾使其不走流出惡血又研明雄黃唾調搽患處內服清涼敗毒散防風荆芥白芷羌活黃連黃芩連翹金銀花槐子甘草當歸生地各一錢二三帖愈吳橋治吕廷充年二十五得奇疾作則衆竅氣坌出瞑而垂絶家人為之閉口鼻塞兩耳握小溲抵大溲乃稍回氣蒸蒸出毛孔中良久始定逆橋治橋曰病得之內而受驚隂陽兩脫橋不能往苐以大溫補劑投之持方藥歸三月而愈太函集金節年如廷充始病潮熱夢遺面頳而咳血醫而少間已復愈奇疾作作則如束薪爇涌泉由脛及股直達如貫梨傾耳而聽轆轆有聲至則堅强不仁膚革一如木石噴嚏不通水漿不內良久忽發一歎身柔緩如常以日計之凡六七作諸醫斂手橋視之脈數而浮不任按病得之荒淫不節以故隂虛火炎此其甚也為之正治則以一杯而熄輿薪無已則從治之主以甘溫佐以清涼可也日一劑皆有驗迄于旬日而新疾平其父以故疾未除則挾一方士自九華至乃悉屏前藥日烹一鴨餉之葅以人參和以大棗無何火症後作中膈膨脹乃復逆橋診之則六脈浮取加弦弦為木旺蓋以啖鴨而傷脾氣故肝木乘虛而克之將變而為中滿矣急以溫補為劑治之兩月乃安同上飛尸即鬼疰薛立齊治錦衣楊永興舉家避眚有僕沉醉失避者既而神思昏昧遍身青傷令煎金銀湯灌之即愈一婦人忽昏憒發譫語自云為前謀賴某人銀兩某神責我將你起解到城隍理問兩腳腂膝臀處皆青腫痛不可忍口稱苦楚次日方蘇痛尚不止用金銀藤兩許水煎服即愈一婦人入古墓患前症以紫金錠灌之即蘇通政余子華太常汪用之皆因往弔而卒死喪家想即是症謝士泰删繁方治尸疰或見尸或聞哭聲者取死人席斬棺內餘棄路上者一虎口長三寸水三升煮一升服立效按此即用死人枕之遺意也本草綱目庚申豫家一婦人夢中見二蒼頭一前一後手中持一物前者云到也末後應云到也擊下爆然有聲遂魘覺後心一㸃痛不可忍昏悶一時許豫忽憶神精丹有此一症取三粒令服之少頃已無病矣云服藥覺痛止神醒今如常矣日後相識稍有邪氣與一二服無不應驗方在千金中治中風之要藥但近世少曽青磁石為難合耳醫藥綱目竇材治一婦人因心氣不足夜夜有少年人附著其體診之六脈皆無病令灸上脘穴五十壯至夜鬼來離牀五尺不能近服薑附湯鎮心丹五日而愈一貴人妻為鬼所著百法不效有一法師書天醫符奏玉帝亦不效竇令服睡聖散三錢灸巨闕穴五十壯又灸石門穴三百壯至二百壯病人開眼如故服薑附湯鎮心丹而愈一婦人病虛勞真氣將脫為鬼所著竇用大艾火灸關元彼難忍痛乃令服睡聖散三錢復灸至一百五十壯而醒又服又灸至三百壯鬼邪去勞病亦瘥越民髙十二歉嵗無食挈妻兒至德清雇妻於秀州倉官李深家為乳媪髙得錢還越而死李僕許八隨直在秀以幹歸德清及再來之日媪患恍惚譫語作厥夫聲責罵故妻不為資薦李問何以得至此曰我隨許僕船便是以得來李命巫逐未至漫燒蒼术烟熏燎鬼遽云我怕烟氣不敢更留遂無語媪病亦瘥今人衝惡者必爇木蓋邪鬼所畏也類編說出醫李行簡外甥女適葛氏而寡次嫁朱訓忽得疾如中風狀山人曹居白視之曰此邪疾也乃出針刺其足踵上二寸許至一茶久婦人醒曰疾平矣始言每疾在時夢故夫引行山林中今早夢如前而故夫為棘刺刺足脛間不可脫惶懼宛轉乘間乃得歸曹笑曰適所刺者八邪穴也脞說詐病張景嶽向寓榆關客邸一友忽黃昏叩户張皇甚問之則所狎之妓忽得急症勢在垂危倘遭其厄禍不可解因求救隨往視之見其口吐白沫僵仆于地口鼻四肢俱冷氣息如絶狀殊駭人及診之則氣口和平與症不應沉思久之復診脈如故始悟其詐也乃以仲景法試之遂大聲言曰此病危矣使非火攻必不可活非用如棗如栗之艾亦不可活又非灸人中眉心小腹數處亦不可活吾寓有艾可速取來然火灸尚遲姑先與一藥倘能咽咽後稍有聲息則生意已復即不灸亦可若口不咽或咽後無聲速灸可也即與一藥囑其服後即來報我彼聞言已驚惟恐大艾著體藥到即咽少頃即哼聲出而徐動徐起矣次日問其由乃知為喫醋而然也曲中奸狡有如此者景嶽在都時有金吾畜二妾其一則燕姬也有母隨之一日二妾相競燕姬理屈若母助其跳踉遂致氣厥若死乃令一婢抱持而坐自暮達晨絶無蘇意延治初入室見其肉厚色黑面青目瞑手撒息微診其脈則伏渺若脫亦意其真危也而治法難施溫補則慮其氣逆未散開導則慮其脈絶難勝躊躇間乃請復診則以十指交叉抱腹仰坦婢懷因疑其前已撒手今能義手豈他人之所為乎及診之似有嫌拒意拽之不能動乃出其不意猛拽之則頓脫有聲力强且徑此非欲脫真病明矣因思其脈若此或以肉厚氣滯此北人稟賦多有之也或以兩腋緊夾此奸人狡詐亦有之也若其面青色微則怒氣使然自不足怪識見既定因聲言其危使聞灸法遂先投一劑下咽即活金吾因詢其病真耶假耶若假何以竟夕如是且形症畢肖若真何以藥下即瘳抑果藥之元祕乎曰元祕乃在言耳不過借藥為名但使彼懼病即去矣經曰憂可勝怒正此謂也然其狡詐一至于此使非再診亦幾為所誑可不審哉一士子為宦家所毆遂卧病旬日吐血盈盆因喧傳人命連及多人延醫數輩見其危劇之狀皆束手逺避防為所纍也最後張視之察其色則絶無蒼苦之况診其脈則皆和緩如常始而疑繼而悟乃潛語之曰他可欺也余亦可欺耶此爾之血抑家禽之血也其人愕然凂豫勿言遂與調和銜感而罷一鄰婦以妒妾詬誶與夫反目因而病劇咬牙瞪眼僵厥不蘇若命在呼吸間者其夫驚惶無措其妾幾遭不堪求張救之則脈非其病遂用前法治之愈後其夫感謝而不知為其所愚也若此二人則又人事中之常態使不有以鑒别則此中變幻有以假病而延成真病者有以小忿延成大禍者故并記之以資聞見九針形鑱針平半寸長一寸六分其頭大末鋭其病熱在頭身宜此員針其身員鋒如卵形長一寸六分肉分氣滿宜此匙針鋒如黍粟之鋭長三寸五分脈氣虛少宜此鋒針兩三隅長一寸六分㵼熱出血發泄痼病宜此䤵針一名鈹針末如劒鋒廣二寸半長四寸破癰腫出膿血圓利針尖如毫且圓且利中身微大長一寸六分調隂陽去暴痺毫針法象毫尖如蚊芒長三寸六分調經絡去疾病長針鋒如刺長七寸痺深居骨解腰脊節腠之間者宜此燔針一名焠針長四寸風虛合于骨解皮膚之間者宜此禁刺病與相逆者皆不可刺大渴大飽大饑新內大怒大勞大醉大驚大風大雨大寒大熱大虛大困大竭濃雲色脈不順大患危疾漉漉之汗熇熇之熱渾渾之脈身熱甚隂陽交爭五行刑制如心病遇癸日餘倣此望不補晦不㵼弦不奪朔不濟禁針穴腦户囟㑹神庭絡郤玉枕角孫􅀈囟承泣承靈神道靈臺膻中水分神闕㑹隂橫骨氣衝箕門承筋青靈三陽絡手五里凡二十二穴合谷三隂交二穴孕婦不宜針石門女子忌之如針之令無子雲門鳩尾缺盆客主人四穴不宜針深肩井此穴針深令人悶倒三里補之禁灸穴承光啞門風府天柱素窖臨泣睛眀攢竹迎香未窖顴窖絲竹空白環俞頭維下關脊中肩貞心俞天牖人迎乳中周榮天府中衝陽關陽池隱白漏谷地五㑹隂陵泉條口犢隂市伏髀關委中殷門申脈承扶凡四十五穴傷寒灸之可否內經云脈之所見邪之所在脈沉者邪氣在內脈浮者邪氣在表世醫只知脈之說不知病症之禁忌若表見寒症身汗出身常清數栗而寒不渴欲覆厚衣常惡寒手足厥皮膚乾枯其脈必沈細而遲但有一二症皆宜灸之陽氣下陷故也若身熱惡熱時見躁作或面赤面黃咽乾嗌乾口乾舌上黃赤時渴咽嗌痛皆熱在外也但有一二症皆不冝灸其脈必浮數或但數亦不可灸灸之災害立生若有鼻不聞香臭鼻流清涕眼臉時癢或缺或嚏惡寒其脈必沈是脈症相應也或輕手得弦緊者是隂伏其陽也雖面赤宜灸之不可拘于面色赤而禁之也劉純辨傷寒五十九刺五十九刺者為頭上五行以尅越諸陽之熱也大杼膺俞缺盆背俞此八者以㵼胸中之熱也氣衝三里巨虛上下亷此八者以㵼胃中之熱也雲門髃骨委中髓空此八者以㵼四肢之熱也針灸用針八法用針八法者迎隨一也轉針二也手指三也轉針頭四也虛實五也隂陽六也提按七也呼吸八也補㵼損益虛實在此八法針用五門分主客針用五門者井榮俞經合也春刺井夏刺榮秋刺經冬刺合季月刺俞以有五門一月亦同一日亦有五門同年賓客為邪氣主人乃正氣知者刺之無不效也定刺象木針刺可曲可斜可直可正故定刺以象木性之曲直也口藏比火凡用針先以針含口內令溫調補榮衛以火性炎上即升降旋轉左右而下也常山閻氏曰口溫針暖不惟滑利而少痛亦借己之和氣與患人榮衛無寒溫之爭便得相從若不先溫針暖與血氣相逆寒溫交爭而成瘡者多矣灸刺分午前卯後離左酉南午前卯後者乃卯辰巳三時也陽中之老陽可灸刺萬病之虛寒離左酉南者乃午未申三時也陽中之少隂可灸刺萬病之煩躁熏蒸之勞熱而㵼之灸以吹之灸時丈夫用室女婦人用童男吹之呵之反作清涼之氣也呵吹者灸之㵼法也接氣通經法凡欲取偏枯久患榮衛諸疾多是愈而復作者由氣不接而其經不通流雖有暫時之快客氣勝真病當未愈也當此乃令上接而下引呼吸多少經脈長短各有定數立法手三陽接而九呼過經四寸手三隂接而七呼過經五寸足之三陽接而一十四呼過經四寸足之三隂接而一十二呼過經五寸重者倍之吸亦同數此接氣通經呼吸長短之法也閻廣明灸分隂陽上下多少凡灸當先陽後隂言從頭向左而漸下次後從頭向右而漸下先上後下明堂云先灸于上後灸于下先灸于少後灸于多皆宜審之王執中醫料即叔權針灸須藥千金云病有須針者即針刺以補㵼之不宜針者直爾灸之然灸之大法其孔穴與針無忌即下白針或溫針訖乃灸之此為良醫其腳氣一病最宜針灸並施若針而不灸灸而不針非良醫也針灸而藥藥而不針灸亦非良醫也但恨下里間知針者鮮爾所以學者須解用針燔針白針皆須妙解知針知藥固是良醫此言針灸與藥之相須也今人或但知針而不灸知灸而不針或惟用藥而不知針灸者皆犯孫真人所戒也今世所謂醫者則但知有藥而已針灸則未嘗過而問焉人或告之則曰是外科也業貴精不貴雜也否則曰富貴之家未必骨針灸也皆自文其過耳吾故詳著千金之說以示人云避人神說千金云欲行針灸先知行年宜忌及人神所在不與禁忌相應即可故男忌除女忌破男忌戊女忌已有日神忌有每月忌有十二時忌有四季人神有十二部人神又有所謂血支血忌之類凡醫者不能知此避忌若逢病人厄㑹男女氣怯下手至困通神達士豈拘此哉若遇急卒暴患不拘此法許希亦云若病卒暴宜急灸療亦不拘此一日之間止忌一時是也灸又云癰疽疔腫喉痺客忤尤為急凡作湯藥不可避凶日覺病須臾即宜便治又云凡人卒暴得風或中時氣凡百所苦須急灸療漸久後皆難愈此論甚當夫急難之際命在須臾若必待吉日後治已淪于鬼録矣此所以不可拘避忌也惟平居治病于未形選天德月德等日服藥針灸可也論灸有補㵼不可輕議大率沉結寒冷之度施之為宜蓋隂寒濕氣凝留血脈湯劑尉引不能獨治方是時唯火艾足以爍其勢豈非火能運行陽氣驅逐隂邪其效有速于藥石者耶老壯不同强弱異稟灼治之法夫豈一端故多有逾于數百壯少或止于三五七九之數要皆詳審而行之若夫陽病灸之則為大逆是以論傷寒者謂微數之脈既汗之後脈浮熱甚三者悉不可灸惟少隂背惡寒吐利脈不足與夫脈從手足厥之類三者為可灸焉通明乎此觸類以往又安有灸焫之妄也故曰不須灸而强與之灸者令人火邪入腹干錯五臟重其煩躁須灸而不與之灸者使冷結重凝久而彌固氣上衝心無地消散可不鑒哉論刺其病攣痺其治宜微針形樂志苦病生于脈治以灸刺明九針之用經絡補㵼之法也故榮衛異刺以分血氣之虛實井榮異刺以分五行之子母募俞異刺以分背腹之隂陽春夏異刺以分人氣之淺深大抵虛補實㵼無過不及之傷以輔其平者刺法之大要也然有病勢未深可刺而即愈者所謂病之始起可刺而已或痺不仁腫痛可灸刺而去之是也有病傳諸經必上下俱刺者所謂刺熱刺瘧病甚為五十九刺是也然刺之為言同于擊刺之刺以為利也害在其中黃帝謂徐人安靜手巧而心審諦者可使行針艾張機謂針能殺生人不能起死人凡以用之不可不慎也况九針異體取病有殊十二節異法用有輕重必明日月星辰四時八正之在天寒暑燥濕經水盈虛之在地肥瘠壯弱虛實盛衰之在人然後呼吸補㵼出入迎隨惟意之從豈特知募俞部分皮肉筋骸饑飽勞逸而已哉故曰見微得過用之不殆論砭石上古針法垂布于天下制砭石有小大者乃隨病所宜用石代針一曰針石二曰砭石三曰鑱石其實一也破堅决肉砭射腫熱者則决之以砭石良由邪氣暴戾則微針不能及况又病有氣血盛實逆于肉裏畜結癰腫之類非砭石則不能射之此所謂血實宜决之又形樂志樂病生于內者治之以砭石東方之民多病癰瘍其治宜砭石砭石之來始自于此扁鵲有云病在血脈者治之砭石是故一切腫疾悉宜鎌割足小指下橫紋間腫在左則割左在右則割右血少出則差以至疔腫癰瘍丹毒瘭疽伐指㾫病氣痛流腫之類皆須出血者急以砭石砭之大抵砭石之用其法必㵼若在冬時人氣閉塞則用藥而少針石所謂少針石者非癰疽之謂也癰疽不得傾時倘苟緩于針石則毒氣內攻腐壞筋骨穿通腑臟矣治石疔瘡則忌瓦礫磚石之類治刀鎌疔瘡則忌鐡刃傷割若是者可以藥治也素問又曰人病頸癰或石治之或針灸治之而皆已此蓋同病異治也夫癰疽之氣息者宜針開除去之氣盛血聚者宜石而㵼之若然則砭石九針之用各有所利善治血脈之變癰腫之病者當審輕重而制之並聖濟總録自王執中下色診洛陽孫伯英因誣獄妻子被繫逃於故人是夜覺胃脅痛託故人求藥故人曰有名醫張戴人在焉當與公同往時戴人酒未醒强呼之故人曰吾有一親人病欲求診戴人隔窗望見伯英曰此公伏大驚恐故人曰何以知之戴人曰面青脫色膽受怖也後㑹赦乃出方告戴人儒門事親華他傳鹽瀆嚴昕與數人共候他適至他謂昕曰君身中佳否昕曰自如常他曰君有急病見于面莫多飲酒坐畢歸行數里昕卒頭眩墮車人扶將還載歸家中宿死三國志有士人病顔面青而光其氣哽哽錢乙曰肝乘肺此逆候也若秋得之可治今春不可治其家祈哀强之與藥明日曰吾藥再㵼肝而不少却三補肺而益虛又加唇白法當三日死然安穀者過期不安穀者不及期今尚能粥五日而絶宋史公亦仿倉傳汪石山曰伏涇脈最難求如積熱之久脈反沉細而外症又寒苟非兼望聞問切何可得也世俗諱言試醫醫復諱情妄臆而豪貴婦女往往不得望聞豈不大錯續名醫類案卷三十
