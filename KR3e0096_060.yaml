body:
  text: 續名醫類案卷六十錢塘魏之琇撰杖瘡張子和治一男子被杖瘡痛焮發毒氣入裏驚涎堵塞牙噤不開粥藥不下前後月餘百治無功甘分於死先以三聖散吐青瘡驚涎約半大缶次以利膈丸百餘粒下臭惡燥糞又一大缶復煎通聖散數錢熱服之更以酸辣蔥醋湯發其汗斯須汗吐交出其人活矣此法可以救寃人鄭金曜有杖丹一方用水蛭為末和朴硝少許以水調傅瘡上屢施於人良驗志雅堂雜抄崇禎庚辰黃公石齋解公石帆葉公潤山被杖士夫皆謀蚺蛇膽愚謂此大寒令人絶嗣不如三七無名異地龍蠟丸酒服則杖不知痛如不即得則白蠟一兩蟅蟲一枚酒服亦妙壬午則熊公魚山薑公卿墅復以直言拜杖矣智急白如須用之中州集曰貞祐中髙琪柄國士夫被箠辱醫家以酒下地龍散投以蠟丸則受杖失痛范中歌曰嚼蠟誰知味最長一杯卯酒地龍香年來紙價長安貴不重新詩重藥方偶書及此為之一歎痕痏青腫用菜蔔爛罨之即消或用菉豆粉調敷客中間集薛立齋治文刑部用晦伏闕諫南巡受杖瘀血已散壞肉不潰用托裏之藥稍潰而膿清此血氣虛也非大劑參蓍不能補文君亦善醫以為恐腹滿強之飲食稍思遂加大補劑飲食日進肉潰膿稠而愈嘗治江翰林姚王鄭三吏部李薑陳三禮部南吳二刑部皆與文同事者先散其瘀血漸用排膿托裏之藥俱愈夫叫號則傷氣痛忍則傷血此氣血之虗明矣况脾主肌肉脾氣受傷飲食必減血一氷則肌肉不旺故必理脾脾健肉自生若非參术歸蓍之類培飬脾土則肌肉何由而生然又須分病人虗實及有無瘀血停積蓋打撲墜墮皮肉不破肚腹作痛者必有瘀血在內宜以復元活血湯攻之老弱者四物湯加紅花桃仁穿山甲補而行之若血去多而煩躁此血虗也名曰亡血以獨參湯補之有損傷稍輕别無瘀血等症但疼痛不止者惟和血氣調經脈其痛自止更以飬氣血健脾胃無有不效亦有痛傷胃氣作嘔或不飲食者以四君子湯加藿香砂仁當歸治之若有瘀血不先消散而加補劑則成實實之禍沒無瘀血而妄行攻利則致虗虗之禍夏鳯北京人因杖瘡臀膝通潰膿瘀未出時發昏憒此膿毒內作而然也急與開之昏憒愈盛此虗也以八珍湯一服少可數服死肉自腐頓取之令用豬蹄湯洗淨以神效當歸膏塗貼再以十全大補湯兩月而愈若更投破血之劑則危矣大抵杖瘡一症皆瘀血為患治療淺者砭之深者針之更以活血流氣藥和之內潰者開之有腐肉取之以壯胃生血藥托之可保無虞有傷筋骨而作痛者以沒藥降聖丹治之若牙關緊急或腰背反張者以玉真散治之並效杖瘡血脫煩躁薛立齋治一人兩脅脹悶欲咳不咳口覺血腥遍身臀腿脹痛倦怠不食煩渴脈大此血脫煩躁也與童便酒及砭患處出死血糜肉甚多忽發熱煩躁汗出投以獨參湯三劑少止又用補氣血清肝火之藥數劑飲食少進後用獨參湯間服諸症悉退飲食頓加但不能多寐以歸脾湯加山巵竹茹四劑而熟睡因勞心遂煩渴自汗脈大無力以當歸補血湯二劑而安又以十全大補去川芎加麥冬五味牡丹地骨麻黃根炒浮麥數劑而汗止死肉且潰又二十餘劑而新肉生血虛發躁一人煩燥靣赤口乾作渴脈洪大按之如無此血虛發躁也以當歸補血湯二劑即止後日晡發熱更以四物加柴胡牡丹地骨知柏治之熱退而瘡斂東垣云發熱惡寒大渴不止其脈大無力者非白虎湯症此血虛發躁宜用當歸補血湯治之裴先生云肌熱躁熱目赤靣紅其脈洪大而虛此血虛也若誤服白虎湯輕則危重則斃氣虛血熱一人頭額出汗熱渴氣短煩躁骨痛瘀肉不潰遂割去之出血服芩連之藥益甚其脈洪大而微此氣血俱為虛邪火熾盛所致以四物加參蓍术草少用柴胡炒苓二劑頭汗䪺止又加麥冬五味肉桂二劑諸症悉退後用參蓍歸术炒芍熟地麥冬五味十餘劑瘀血潰而膿水稠矣但新肉不生以前藥倍用白术而斂瘀血泛注一人瘀血流注腰膂兩足俱黑隨飲童便酒砭出瘀血糜肉投以小柴胡湯去半夏加山巵芩連骨碎補以清肝火用八珍茯苓以壯脾胃死肉潰而新肉生後瘡復潰得靜調治年餘而痊一人瘀血攻注隂囊潰而成漏膿水清稀所服皆寒涼之劑診其肝脈短澀餘脈浮而無力此肝木受肺金尅制又元氣虛不能收斂遂用壯脾胃生氣血之方元氣少復後終殁于金旺之日瘀血作痛一人腫痛發熱作渴汗出此隂血受傷也先砭去惡穢以通壅塞後用四物柴苓山巵丹皮骨碎補以清肝火而愈一人傷處揉散惟腫不消此瘀血在內宜急砭之不從乃以蘿蔔自然汁調山梔末敷之破處以當膏貼之更服活血之劑而瘥數年後但遇天隂仍作癢痛始知不砭之失一人臀腿黑腫而皮不破但脹痛重墜皆以為內無瘀血惟敷涼藥可以止痛診其尺脈澀而結此因體肥肉厚瘀血畜深刺去即愈否則肉潰有爛筋傷骨之患乃入針四寸漂黑血數升腫痛遂止是日發熱惡寒煩渴頭痛此氣血俱虛而然也以十全大補之劑遂痊肝火作痛一人瘀血肉脹焮痛發熱口乾作渴飲食不甘四肢倦怠此肝火熾盛脾土受制故患前症喜其稟實年壯第用降火清肝活血之劑而愈肝火忿怒一人患處脹痛悲哀忿怒此厥陽之火為七情激之而然耳遂砭去瘀血以小柴胡湯加山巵黃連桔梗而安後用生肝血飬脾氣之藥瘡潰而斂肝火脅脹一人患處脹痛發熱欲嘔兩脅熱脹肝脈洪大此肝火之症也但令飲童便并小柴胡湯加黃連山巵歸尾紅花諸症果退此症若左關脈浮而無力以手按其腹及不脹者此血虛而肝脹也當以四物參苓青皮甘草之類治之若左關脈洪而有力胸脅脹痛者按之亦痛此怒氣傷肝之症也以小柴胡芎歸青皮白芍桔梗枳殼主之蓋此症不必論其受責之輕重問其患處去血之曽否但被人扭按甚重努力恚怒以傷其氣血瘀血歸肝多致前症甚則胸脅脹滿氣逆不通或血溢口鼻多致不救肝膽虛症一人愈後口苦腰脅脹痛服補腎行氣等藥不效按其肝脈浮而無力此屬肝膽氣虛而然耳用參蓍芎歸地黃白术麥冬五味治之而愈血虛腹痛一人杖後服四物桃仁紅花大黃等劑以逐瘀血腹反痛更服一劑痛益甚按其腹不痛此血虛也故喜按而不痛宜溫補之劑遂以歸身白术參蓍炙甘二劑痛即止氣虛不潰一人瘀血已去飲食少思死肉不潰又用托裏之藥膿稍潰而清此血氣虛也非大補不可彼不從乃強與大補之劑飲食進而死肉潰但少寐以歸脾湯加山巵二劑而寐因勞心煩躁作渴脈浮洪大以當歸補血湯二劑而安寒凝不潰一人受刑太重外皮傷破瘀血如注內肉糜爛黯腫上自胸背下至足指昏憒不食隨以黑羊皮熱貼患處灌以童便酒薄粥更以清肝活血調血健脾之劑神思稍蘇始言遍身強痛又用大劑飬血補氣之藥腫消食進時仲冬瘀血凝結不能潰膿又用大補之劑壯其陽氣其膿方熟遂砭去洞見其骨塗以當歸膏及服前藥百餘劑肌肉漸生脾虛不斂一人潰而不斂以內有熱毒欲寒涼藥此氣血俱虛而不能斂耳非歸术參蓍之類培飬脾土則肌肉何由而生豈可復用寒涼尅伐消散之藥重損氣血耶遂用前藥而愈血虛筋攣一人腹脹嘔吐眩暈用柴胡黃芩山巵紫蘇杏仁枳殼桔梗川芎當歸赤芍紅花桃仁四劑而定後又出血過多昏憒目黑用十全大補等藥而蘇時肌肉潰爛濃水淋漓筋攣骨痛切其脈浮而澀沈而弱此因氣血耗損不能飬筋筋虛不能束骨遂用飬氣血之藥治之而愈腎虛氣逆一人杖瘡愈後失于調理頭目不清服袪風化痰藥反眩暈服牛黃清心丸又肚腹疼痛杖痕腫癢發熱作渴飲食不思痰氣上升以為杖瘡餘毒復作診之左尺脈洪大按之如無此腎經不足不能攝氣歸源遂用人參黃蓍茯苓陳皮當歸川芎熟地山藥山茰五味麥冬炙草服之尋愈後因勞熱渴頭痛倦怠少食用補中益氣加麥冬五味而痊溫熱乘肝一人愈後腿作痛意膿血過多瘡雖愈肝經血尚未充乃至濕熱乘虛也遂以八珍加牛膝木瓜蒼术黃柏防已炙草以袪濕熱飬隂血痛漸止乃去防已黃柏服之遂瘳肝經鬱火一人瘀血失砭脹痛頭渴縱飲涼童便脹頓止以蘿蔔細搗塗之血漸散已而患處作癢仍塗之癢止後口乾作渴小腹引隂莖作痛小便如淋時出白津此肝經鬱火也遂以小柴胡湯加大黃黃連山巵飲之諸症悉退再用飬血藥而安夫小腹引隂莖作痛等症往往誤認為寒症投以熱劑則諸竅出血或二便不通以及危殆輕亦損其目矣凡肝鬱病誤用熱藥皆貽大患痛傷胃嘔一人痛甚發熱嘔吐少食胸膈痞滿用行氣破血之劑益甚口乾作渴大便不調患處色黯此痛傷胃氣所致遂以四君當歸炒芩軟柴胡藿香二劑諸症漸愈又用大補之劑潰之而瘳藥傷胃嘔一人發熱焮痛服寒涼藥更加口乾作渴肚腹亦痛自以為瘀血欲下之按其肚腹不痛脈微細而遲飲食惡寒此涼藥傷胃而然也急用六君加白芍當歸炮附子各一錢服之前症益甚反加譫語靣赤意其藥力未至耳前藥再加附子五分非明眼不能服之即睡覺來諸病頓退而安氣血不損一人瘀血雖去飲食形氣如故但熱渴焮痛膈間有痰以小柴胡湯加花粉貝母桔梗山巵二劑少愈又加生地歸尾黃芩柴胡山巵花粉而愈凡治百餘人其杖後血氣不虛者惟此一人耳治者審之行氣之非一人服行氣之劑胸痞氣促食少體倦色黯膿清此形氣俱虛之症也先用六君桔梗二劑胸膈氣和後用補中益氣去升麻加茯苓半夏五味麥冬治之元氣漸復而愈若用前劑戕伐元氣多致不救下血之非一人去其患處瘀血用四物柴胡紅花治之焮痛頓止但寒熱口乾飲食少思用四物白术茯苓柴胡黃芩花粉四劑寒熱即退用六君芎歸藿香而飲食進腐肉雖潰膿水清稀以前藥倍用參蓍歸术茯苓二十餘劑腐肉俱潰膿水漸稠誤服下藥一鍾連㵼四次患處色黯喜其脈不洪數乃以十全大補倍加肉桂麥冬五味數劑肉色紅活新肉漸生喜在壯年易于調理又月餘而愈否則不救凡杖瘡跌撲之症患處如有瘀血止宜砭去服壯元氣之藥蓋其氣血已損切不可再用行氣下血之藥復損脾胃則運氣愈難營逹于下而反為敗症怯弱者多致夭枉寒藥之非一人腫痛敷寒涼之藥欲內消瘀血反致臀腿俱冷瘀血併胸腹痞悶急去所敷之藥以熱童便酒洗患處服六君木香肉桂四劑瘀血解乃刺之更以壯脾胃飬氣血得痊蓋氣血得溫則凝寒極生熱變化為膿腐潰深大血氣既敗肌肉無由而生欲望其生難矣不砭之非一人發熱煩躁用四物黃芩紅花軟柴胡山巵花粉煩熱已清瘀血深畜欲針出之不從忽牙關緊急患處作痛始針去膿血即安用托裏飬血新肉漸長忽患處瘙癢此風熱也用祛風消毒之劑而痊不補之非一人臀腿脹痛發熱煩躁刺去死血脹痛少寬熱躁愈甚此血脫邪火旺而然也急用獨參湯補之少愈又以健脾飬氣血藥治之腐漸潰遂愈大抵此症宜預調補以顧收斂切勿伐其氣血不行補益致不能收斂破傷風表症一人仲夏誤傷手腰背發張牙關緊急脈浮而散此表症也遂用羌活防風湯一劑即解此症若在秋冬腠理緻密之時須用麻黃之類以發汗此乃暴傷氣血不損治法也破傷風裏症一人杖處略破而患痛脈洪大而實此裏症也用大芎黃湯一劑大便微行一次悉退若投表藥必死宜急分表裏虛實而治之庶無誤也膿內焮類破傷風一人寒熱口乾用四物參蓍白术柴胡炒芩麥冬五味四劑少退欲砭去瘀血不從後怔忡不寐飲食少思牙關牽緊頭目疼痛惡寒發熱此膿內焮也遂砭去之即安以八珍棗仁麥冬五味二十劑前症漸愈又用前藥及獨參湯瘀肉漸潰後因勞又少寐盜汗以歸脾湯麥冬五味逺志而痊後牙關脹悶靣目焮赤又似破傷風仍以為虛用八珍等藥亦安膿潰類破傷風一人腹脹喘促作渴寒熱臀腿糜爛與死血相和如皮囊盛糊用童便煎四物桃仁紅花柴胡黃芩麥冬花粉服之頓退彼用黑羊皮貼之益甚後砭去膿血甚多氣息奄奄唇口微動牙關緊急患處色黯或欲用破傷風藥曰此氣血虛而變症也用參蓍芎歸白术并獨參湯人乳元氣復而諸症愈乃用十全大補調理而安此症若膿瘀內焮者宜針之若潰後口噤遺尿類破傷風等症者乃氣血虛極也急用大補之劑若素多痰患風症者宜清痰降火若因怒而見風症者宜清肝降火若不慎房勞忽患前症此由腎水不足心火熾甚宜滋隂補氣血為主若誤作風症治之即死內虛變痙一人內潰針出膿三五碗遂用大補之劑翌日熱甚汗出足冷口噤腰背反張衆欲投發散之劑曰此氣血虛極而變痙也若作風治誤矣用十全大補等藥而愈此症或傷寒汗下過度與産婦潰痬氣血虧損所致但當調補氣血為善若服尅伐之劑多致不救一人兩月餘瘡口未完因怒發痙瘡口出血此怒動肝火而為患耳用柴胡芩連山巵防風桔梗天麻鉤藤甘草治之頓愈劉宗厚云痙有屬風火之熱內作者有因七情怒氣而作者亦有濕熱內盛痰涎壅遏經絡而作者惟宜補虛降火敦土平木清痰去濕一男子杖瘡瘀肉不腐以大補之劑漸腐更以托裏健脾藥而斂一男子風入杖瘡牙關緊急以玉真散一服少愈再服而安小渠袁三因強寇入家傷其兩胻外臁作瘡數年不已膿汁常涓涓然但飲冷則瘡間冷水浸淫而出延為濕瘡求治張曰爾中焦當有緑水二三升涎數掬袁曰何也張曰當被盜時驚氣入腹驚則傷膽病在少陽經也兼兩外臁皆少陽之部此膽之甲木受邪甲木色青當有緑水少陽在中焦如漚既伏驚涎在中焦飲冷水咽為驚涎所阻水隨經而旁入瘡中故飲水則瘡中水出乃上涌寒痰汗如流水次下緑水果二三升一夕而痂乾真可怪也王涇以髙宗疾奉御無狀鞭背都市流逺方後歸自言不曽受杖嘗袒而示某以背完瑩無疵初不解其如何也後見他醫言杖皆有瘢唯噬膚之初傅以金箔則瘢立消意金木之性相制耳桯史載嶽珂金瘡蜀志關雲長常為流矢所中貫其左臂創雖愈每至隂雨骨常瘀痛醫曰矢鏃有毒入骨當破臂刮骨去毒乃除雲長便伸臂令劈時方請諸將飲食相對臂血流離盈于盤器而割炙飲酒言笑自若隋末髙開道被箭鏃入骨命一工拔之不得開道問之云畏王痛開道斬之更命一醫云我能拔之以一小斧當刺下瘡際用小棒打入骨一寸以鉗拔之開道飲啖自若賜醫工絹三百匹槎菴小乘劉涓子於丹陽郊外較射忽有一物髙二丈許因射而中之走如電激聲若風雨夜不敢進明日率數十人尋其蹤迹至山下見一小兒問曰何往答曰主人昨夜為劉涓子所射取水以洗瘡因問主人是誰答日是黃父鬼乃將小兒還未至聞搗藥聲遙見三人一人卧一人閲書一人搗藥即齊聲叫突而前三人並走遺一帙癰疽方一臼藥時涓子得之從宋武帝北征有被創者以藥塗之隨手而愈涓子用方為治千無一失演為十卷號鬼遺方龔慶先鬼遺方敘宋元泰中青州劉􅖓射一鹿剖五臟拾青草塞之蹶然而起􅖓怪而拔草復倒如此三度􅖓録此草種之多主傷折俗呼劉􅖓草亦曰天名精此草亦寄奴之類槎庵小乘琇按前劉涓子及此則皆脫胎宋祖荻洲事要其藥皆寄奴也裴旻山行有山蜘蛛垂絲如匹布將及旻旻引弓射殺之大如車輪因斷其絲數尺收之部下有金瘡者剪方寸貼之血立止南部新書夏侯鄆為閬州有人額上有箭痕問之云從馬侍中征田悅中箭侍中與一藥乃用巴豆微炒同蜣蜋搗塗斯須痛定微癢忍之待極癢不可忍乃撼動拔之立出後以生肌膏傅之乃愈因以方付鄆云凡諸瘡皆可療後鄆至洪州逆旅主人妻患瘡呻吟用此立愈本草綱目蜣蜋巴豆同塗癢不可當以雄磁石挾之即出象牙牡鼠肝腦栗屑烏雞尾灰白梅仁爪仁齒嚙和黑虱皆能出箭頭及針錢在肉者張子和儒門事親方端午取莨菪作丸黃丹衣之置臍而箭頭自出劉薦叔曰近日行伍惟以乾莧菜與沙糖塗之能出箭頭與鉛炮子此常驗者則古方所未載也昔有人肩髀中創血如涌出醫用原蠶沙為細末傅之血立止一云用真降香煆存性為末貼之尤效吹劒續録續醫説王肻堂云余近得一金瘡方大有神效功在三日長肌肉以黃牛膽煆存性為細末敷之此實一竒方也續醫説布智兒從太祖征回回身中數矢血流滿體悶仆幾絶太祖命取一牛剖其腹納之牛腹中浸熱血中移時遂蘇又李庭從伯顔攻郢州炮傷左脅矢貫于胸幾絶伯顔命剖水牛腹納其中良久而蘇何孟春云豫在職方問各邊將無知此術者非讀元史弗知也故書于此以備緩急本草綱目孫法宗苦頭創夜有女人至曰我天使也事不關善人使者誤及耳但取牛糞煮敷之即驗如其言果瘥宋書本草綱目張禧身中十八矢一矢貫腹悶絶世祖即取血竭遣人往療之元史蒙古中有墨爾根綽爾濟者精岐黃有正白旗先鋒鄂碩與蒙古戰中流矢殆甚濟為拔鏃傅以藥遂愈又都統吳拜交戰時身被三十餘矢已昏絶濟令剖白槖駝腹置拜其中遂蘇又黃冠苗君稷之徒臂屈不伸濟先以熱鑊熏蒸次用斧椎其骨手揑有聲使骨穴對好即愈餘文莭録常撫軍宦逰茟記薛衣道人祝巢夫名堯民洛陽諸生也少以文名明亡遂棄制舉藝為醫自號薛衣道人得仙傳瘍醫凡諸惡瘡傅其藥少許即愈人或有斷脛折臂者請治之無不完好若刳腹洗腸破腦濯髓則如華陀之神里有被賊斷頭者頭已殊其子知其神謂家人曰祝巢夫仙人也速為我請來家人曰郎君何妄也頸不連項矣彼即有返魂丹烏能合既離之形骸哉其子因強之既至祝撫其胸曰頭雖斷身尚有暖氣暖氣者生氣也有生氣則尚可以治急以銀針紉其頭于項既合塗以末藥一刀圭尉以炭火少頃煎人參湯雜他藥啓其齒灌之須臾則鼻微有息矣復以熱酒灌之逾一晝夜則出聲矣又一晝夜則呼其子而語矣乃進以糜粥又一晝夜則可舉手足矣七日而創合半月而如故舉家作謝願産之半酬之堯民不受後入終南山修道不知所終無子其術不傳虞初新志載陳㝎九薛立齋治大尹劉國信金瘡出血發熱煩躁屬隂虛為患用聖愈湯治之虛火熄而血歸經矣梁閣老姪金瘡腫痛出血不止寒熱口乾此氣虛血無所附而血不歸經也用補中益氣五味麥冬主之陽氣復而愈舉人余時正金瘡焮痛出血不止惡寒發熱用敗毒等藥愈甚此亡血過多氣無所附而然耳遂以四物加知柏軟柴胡人參五味麥冬治之即愈淮西總管趙領衛名禹殿巖密之子云取箭鏃法仇防禦方張循王屢求不得因奏知德夀宣取以賜之有竒效以天水牛一個獨角者尤緊以小瓶盛之用碙砂一錢細研水少許化開浸天水牛自然成水後以藥水滴箭鏃處當自出也是齋方凡刀刃傷用石灰不以多少端午日午時取百草搗汁濾過和作餅子入韭菜汁尤妙隂乾遇有傷即以末糝之如腸胃出桑白皮縫罨之帛繫吳內翰父少保守南雄州有刀傷人腸潰者以此藥治之全二人之命一方只用韭汁和石灰端午日合又治刃刃傷用五培子為末乾貼神效亦名小血竭同上回回田地有年七八十嵗老人自願捨身濟衆者絶不飲食惟澡身啖蜜經月便溺皆蜜既死國人殮以石棺仍滿用蜜浸鐫志嵗月於棺蓋瘞之俟百年後啓封則成蜜窖凡人損折肢體食少許立愈雖彼中亦不多得俗曰蜜人畨言本乃伊輟耕録杭州赤山之隂曰宵箕泉黃大癡所嘗結廬處其徒弟沈生狎近側一女道姑同門有欲白之于師沈懼引厨刀自割勢幾死衆救得活而瘡口流血經月餘不合偶問諸閹奴教以燬所割勢搗粉酒服如其言不數日而差同上閩萬夫長陳君臨陳為刀砟其靣瘡已愈而痏與鼻不能合甚惡時時仰泣日吾靣無完膚生何以見妻子死何以見父母乎乃拜項彥章求治項命壯士按其靣膚肉盡熱腐施之以法即靣赤如頳盤左右賀曰復故也九靈山房集湯火傷薛立齋治一男子孟冬火傷臂作痛喘咳發熱此火毒剋肺金之症用人參平肺散治之喘咳乃止因勞又惡寒發熱此氣血虛也以八珍湯加桔梗白蕊治之而退再加薄桂三分以助藥勢溫氣血壞肉潰之而愈若初起焮赤作痛用神效當歸膏敷之輕者自愈重者自腐生肌神效或用側柏葉末蠟油調敷亦效若發熱作渴小便赤色其脈洪數而實者用四物茯苓木通生甘草炒黃連脈雖洪數而虛者用八珍若患處不潰而色黯者四君芎歸黃蓍之類若肉死已潰而不生肌者用四君黃蓍當歸炮薑若愈後而惡寒陽氣未復也急用十全大補湯切勿用寒涼反傷脾胃一男子因醉被湯傷腿潰爛發熱作渴飲水脈洪數而有力此火毒為患用生地當歸芩連木通葛根甘草十餘劑諸症漸退却用參蓍术草芎歸芍藥白芷木瓜新肉將完因勞忽寒熱此氣血虛而然也仍用參蓍之藥加五味棗仁而安又月餘而瘡斂一男子火傷兩臂焮痛大小便不利此火毒傳於下焦用生地當歸白芍黃連木通山巵赤苓甘草一劑二便清利其痛亦止乃以四物參蓍白芷甘草而壞肉去又數劑而新肉生一婦人湯傷胸大潰兩月不斂脈大而無力口乾發熱日晡益甚此隂血虛火毒乘之而為患耳用四物湯加柴胡丹皮熱退身涼更用逍遙散加陳皮以養隂血壯脾胃腐肉去而新肉生凡湯蕩火燒痛不可忍或潰爛或惡瘡用松樹皮剝下隂乾為細末入輕粉少許生油調稀傅如傅不住少絹帛縛定即生痂神妙不可言然宜預先合下以備急自剝落而薄者尤妙李謨安撫方用牛皮膠入少湯于火上溶稠狗毛剪碎以膠和毛攤軟帛封之直至痂脫不痛吳內翰家婢夜炊米釡翻傷腿膝以夜不敢白比曉已潰爛用此治之而愈百乙方立齋治馮氏子患火瘡驟用涼藥敷貼更加腹脹不食以人參敗毒散加木通山巵治之外以柏葉炒為末麻油調搽漸愈嘗用煮火汁上浮脂調銀硃塗之更效若用涼藥逼火毒入內多致不救王洪緒治一婦小腿經燙醫用氷片研雪水敷之不一刻腿腫如斗痛極難忍曰幸在小腿若腰腹間遏毒入內難挽回矣以地榆研細調油拂上半刻痛止再拂數次全愈一使女炭火燙足背爛一孔以伏龍肝散乳調敷不三日而愈一孩被滚湯澆腹因痛􅎲破皮麻油拂上一次痛止以地榆末乾糝破處次日肌生未破者全愈錢國賓曰余欲之遂昌宿旅次聞隔房人呼痛夜不安枕次日問店主對曰小價提滚水一桶上樓與客洗靣其子拿盆後上舊桶底脫滚水灌子之頭今腫如斗靣目皆平七日不食矣余即往視滿室皆臭用夏枯草一斤為末以香油調腫處厚厚敷上即時此痛止臭三日消腫八日痂落切忌食醬靣有黑斑店主如言藥治而愈後余回其子叩謝曽世榮曰元貞乙未春有王千户來自廣西安船河下一子僅二周患頭疼服藥針灸不效召曽診視色脈俱好惟額上微紅以手法驗之大哭淚下其母怒而見紿曽亦置之勿論但究心以病為事再問當時得病之因千户云初在靜江時大風吹篷撲著便不快曽曰此疾若令細揣頭上便知其症彼諾之遂遣家人出外探親其父自抱曽揣之果有小篾簽刺在囟上皮下即篷簽也以酥油潤透用鏑鑷取出痛定即安若以匹婦饒舌而退則及幼之心不漙矣後之醫流倘見嬰兒色脈好而病者用藥不應必有他故宜推心推原切忽拘泥可也幼幼心書富次律云治竹木刺出聖惠方曽用救一莊僕極妙其人有一腳心刺痛楚瀕死黃昏傅藥痛尤甚至四更視之刺已出遂安用烏羊糞爛搗水和罨傷處厚傅之為佳百乙方蟲獸傷張薦員外住劒南張延賞判官忽被蜘蛛咬頭上一宿咬處有二道赤色細如筋繞項上從胸前下至心經兩宿頭腫疼大如數升碗肚漸腫幾至不救張公出錢五百千并薦家財又數百千募能療者忽一人應召云可治張公甚不信之欲驗其方其人云不諸方但療人性命耳遂取大藍汁一碗以蜘蛛投之至汁而死又取藍汁加麝香雄黃更以一蛛投入隨化為水張公因甚異之遂令點于咬處兩日悉平作小瘡而愈本草綱目字林云睩聽形如蜥蝪出魏興居樹上見人則跳來囓之囓已還樹垂頭聽哭聲乃去即千歲蝮也其狀頭尾一般大如搗衣杵俗名合木蛇長一二尺談野翁方名斫木蛇又名望板歸救之用嫩黃荆葉搗爛敷之本草綱目處士劉易隱居王屋山嘗於齋中見一蜂冒於蛛綱蛛摶之為蜂所螫墜地俄頃蜘蛛鼓腹欲裂徐行入草囓煙根微破以瘡就囓處磨之良久腹漸消輕躁如故自後人有被蜂螫者煙梗傅之則愈筆談蚯蚓糞能治蜂螫余少時摘黃柑為蜂所毒急以井泉調蚯蚓糞塗之立止聞之昔人納涼簷際見巨蜂為蜘蛛所冒蛛出取蜂受螫而墮少蘇爬沙牆角以後足抵蚯蚓糞掩其傷須臾健行卒啖其蜂於網信乎物亦有知也沈存中筆談亦記一事與此相類但謂以煙梗耳姑識之客中間集麻知幾材行為犬所囓舁至家脛腫如罐堅若鐵石毒氣入裏嘔不下食頭痛而重往問戴人急求治法隨即給以檳榔丸下之見兩行不瘥適戴人自舞陽回調麻曰脛腫如此足之二隂三陽可行乎麻曰俱不可行如是何不大下之乃命夜臨卧服舟車丸百五十粒通經散三四錢比至夜半去十四行腫立消作胡桃紋反細於不傷之脛屬其慎勿貼膏紙當令毒氣出流膿血水常行又一日恐毒氣未盡又服舟車丸百餘粒濬川散三四錢見六行病人曰十四行易當六行反難何也曰病盛則勝藥病衰則不勝其藥也六日其濃水盡又囑其濃水行時不畏風盡後畏風也乃以愈風餅子日三服之又二日方與生肌散一傅之而成痂嗚呼用藥有多寡使差别相懸向使不見戴人則利減之言非也以此知醫之難用醫尤難戴人即張子和凡風狗毒蛇咬傷者只以人糞塗傷處新糞尤佳諸藥不及此楮記室載出簷曝偶談江懷禪師為驢所咬傷鼻一僧用髮入罐子鹽泥固臍煆過為未急以鼻蘸灰綴定以軟絹縛定效用此擦落耳鼻亦效醫學綱目薛立齋治一男子被犬傷痛甚惡心令急吮去毒血隔蒜灸患處數壯痛即止更貼太乙膏服玉真散而愈一男子風犬所傷牙關緊急不省人事急針患處出毒血更隔蒜灸良久而醒用太乙膏封貼用玉真散二服少愈更以解數散二服而痊若患重者須先以蘇合香丸灌之後進湯藥針灸經云外邱穴治猘犬即風犬所傷發寒熱速灸三壯更灸患處立愈春末夏初狂犬咬人痛過百日得安終身禁犬肉蠶蛹食此則發不可救也宜先去惡血灸咬處十壯明日以後灸一壯百日乃止忌酒七日搗韭汁飲一二盞又方治狂犬傷令人吮去惡血灸百壯神效治蛇入七竅急以艾灸蛇尾又法以刀破蛇尾少許入花椒七粒蛇自出即用雄黃硃砂末煎人參湯調灌之內毒即解山居人被蛇傷急用溺洗咳處拭乾以艾灸之立效又方用獨頭大蒜切片置患處以艾于蒜上灸之每三壯換蒜多灸為妙立齋治陳鑑居庸關人蝎螫手疼痛徹心傾刻焮痛至腋寒熱拘急頭痛惡心此邪正二氣相摶而然以飛龍奪命丹塗患處及服止痛之藥俱不應乃以隔蒜灸法灸之遂愈薛母及薛皆嘗被螫如前炙之痛即止薛母又嘗為蜈蚣傷指亦用前法而愈凡蛇毒之類所傷依此療之並效本草謂蒜療瘡毒有回生之功一獵户腿被狼咬痛甚治以乳香定痛散不應思至隂之下血氣凝結藥力難達令隔蒜灸至五十餘壯疼痛悉去仍以托裏藥及膏藥貼之而愈王生被門犬傷腿頃間焮痛至股翌日牙關緊急以玉真散治之不應亦隔蒜炙三十餘壯而蘇仍以玉真散及托裏消毒藥而愈立齋父嘗睡間有蟲入耳痛瞀將生薑擦貓鼻尿自出取尿滴耳內蟲即出而愈又百户張錦自謂耳內生瘡不時作痛痛而欲死痛止如故診其脈皆安靜謂非瘡也話間忽痛作度其有蟲入耳令回急取貓尿滴耳果出一臭蟲遂不復痛或用麻油滴之則蟲死難出或用炒芝麻枕之則蟲亦出但俱不及貓尿之速也此案耳門亦收之非重出也恐患此者不知是蟲便翻閲耳華他傳彭城夫人夜之厠躉螫其手呻呼無賴他令溫湯近熱漬手其中卒可得寐但旁人數為易湯湯令暖之其旦即愈三國志一僧為蛇傷一腳潰爛百藥不愈一逰僧以新水數洗淨腐敗見白筋挹乾以白芷末入膽􅈨麝香少許糝之惡水涌出日日如此一日平復竒疾方蘇韜光寓婺州城外魁星館有人書一方于壁間曰此方治諸蟲咬神妙韜光屢以救人皆驗其方用貝母為末酒調令病者量飲之飲不得即止頃之酒自傷處為水流出水盡為度却以貝母塞瘡口即愈雖傷已死但有微氣可以下藥者即活神效不可言集成崇寧末年隴西兵士暑月中無事一卒跣立廳下為蚯蚓所中遂不救後數日又有人被其毒博識者教以先飲鹽湯一杯次以鹽湯浸足乃愈談氏方治蜘蛛咬遍身瘡子以蔥一枚去尖頭作孔將蚯蚓入蔥葉中緊揑兩頭勿泄氣頻搖動即化為水點咬處差本草孫真人以武德中六月得蠼螋尿疾經五六日覺心悶不佳以他法治不愈又有人教畫地作蠼螋形以刀子細細盡取蠼螋腹中土就以唾和成泥塗之再塗即愈方知天下萬物相感莫曉其由矣千金方立齋治一男子犬傷青腫作痛以蘿蔔汁調巵子末敷之以四物湯加柴胡黃芩花粉川山甲二劑少愈更以托裏散加生地柴胡紅花數劑而潰再以托裏健脾藥而愈馬銘鞠傳治蜈蚣傷取蜒蝣塗上其痛立止屢試神效又一法用舊竹筋火中將頭上燒黑取下少許研細敷患處立愈廣筆記破傷風官使明光祖向任統制官被重傷患破傷風牙關緊急口噤不開口靣喎邪肢體弛緩用土虺蛇一條去頭尾腸皮骨醋炙地龍五條去泥醋炙天南星八錢重一枚炮碎為末醋炙麵糊為丸菉豆大每服三丸至五丸生薑酒下仍食稀蔥白粥取汗即瘥普濟方出本草綱目萬密齋治一婦人年四十餘形黑而瘠性躁急先患左腿發內癰潰後起坐萬曰瘡口未合當禁風其婦自恃強健不聽忽一日眩仆目眨口喎身反張手足攣曲亟求治曰此破傷風痓病也用桂枝湯加熟附子黃蓍防風一劑而病減再服十全大補湯三劑而安胡念菴曰一人因莖髭一拔忽然腫起不食有友人詢余余曰此破傷風也速炙為妙瘍醫認作髭疔治以寒涼不數日發痓而死醫林指目有男子年六十一腳腫生瘡忽食豬肉不安醫以藥利之稍愈時出外中風汗出頭靣暴腫起紫黑色多睡耳輪上有浮泡小瘡黃汁出乃與小續命湯加羌活一倍服之遂愈醫説續編薛立齋云一男子背瘡未斂以膏藥剪孔貼之患破傷風症而殁此先失于內補外邪襲其虛耳余見此症貼膏藥剪孔欲其通氣而反患破傷風搽斂藥生肌欲其收口而反助其餘毒以致殁者多矣可不慎哉一男子風襲瘡口牙關緊急腰背反張以玉真散一服而愈仍以托裏藥而斂薛立齋治一婦人臀癰將愈患破傷風發熱搐搦脈浮數以當歸地黃湯治之不信乃服發散敗毒藥果甚始信服數劑而痊是症須分表裏别虛實不可概治原病式云破傷風因瘡熱甚鬱結營衛不得宣通怫熱遍身故多白痂是時瘡口閉塞氣難通泄熱甚則生風也不已則表傳於裏但有風熱微甚兼化故殊異矣大凡風熱燥甚怫鬱在表而裏氣尚平者善伸數欠筋脈拘急時或惡寒或筋惕而搐脈浮數而弦者宜以幸熱治風之藥開衝結滯是與傷寒怫鬱而以麻黃湯辛熱發散者同也凡用辛熱宜以寒藥佐之則免致藥中病而風熱轉甚也如治傷寒發熱用麻黃桂枝加黃芩石膏知母之類是也或以甘草滑石蔥豉寒藥發散甚妙若表不已漸入裏裏又未甚而脈在肌肉者宜以退風熱開結滯之寒藥調之或微加治風辛熱亦得猶傷寒半表半裏以小柴胡和解之意也若裏熱已甚舌強口噤項背反張驚搐愓搦涎唾稠粘胸腹滿塞或便溺閉結或時汗出脈洪數而弦此由風熱鬱甚於裏而表熱稍罷則腠理踈泄而心火熱甚故汗出也法宜除風散結寒藥下之後以退風熱開鬱滯之寒藥調之熱退結散則風自愈矣凡治此亦宜按摩導引及以藥幹開牙關勿令口噤使粥藥不得下也治破傷風及金刃傷打撲傷損方名玉真散本事必用兩方皆有但人不知張叔潛知府云此方極竒居官不可闕是齋宰清流日以授直廳醫救欲死者數人竒甚用天南星防風二味等分為末破傷風以藥敷貼瘡口然後以溫酒調下一錢如牙關緊急角弓反張用藥二錢童子小便調下或因鬬毆相打內有傷損以藥二錢溫酒調下打傷至死但心頭微溫以童子小便灌下二錢併進三服天南星為防風所製服之不麻是齋方按衛生寶鑑以此方兼治狂犬所傷并諸犬咬神效續名醫類案卷六十
