body:
  text: 續名醫類案醫家類提要臣等謹案續名醫類案六十卷國朝魏之琇撰之琇既校刋江瓘名醫類案病其尚有未備因續撰此編雜取近代醫書及史傳地志文集説部之類分門排纂大抵明以來事為多而古事為瓘書所遺者亦間為補苴故網羅繁富細大不捐如疫門神人教用香蘇散二條猶曰存其方也至脚門載張文定患脚疾道人與緑豆兩粒而愈一條是斷非常食之緑豆豈可録以為案又如金瘡門載薜衣道人接已斷之首使人囘生一條無藥無方徒以語怪更與醫學無闗如斯之類往往而是殊不免蕪雜义蟲獸傷門於薛立齋蚊蟲入耳一條註曰此案耳門亦收之非重出也恐患此者不知是蟲便檢閲耳云云而腹疾門中載金臺男子誤服乾薑理中丸發狂入井一條隔五六頁而重出又是何義例乎編次尤未免潦草然採摭既博變證咸備實足與江瓘之書互資參考又所附案語尤多所發明辨駁較諸空談醫理固有實徴虚揣之别焉乾隆四十六年十二月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:95cd2d3fd909e6691815109b988bc3a4c5f2bf465cc32261825dd556c4d7ff66
