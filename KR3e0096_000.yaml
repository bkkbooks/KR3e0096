body:
  text: 續名醫類案醫家類提要臣等謹案續名醫類案六十卷國朝魏之琇撰之琇既校刋江瓘名醫類案病其尚有未備因續撰此編雜取近代醫書及史傳地志文集説部之類分門排纂大抵明以來事為多而古事為瓘書所遺者亦間為補苴故網羅繁富細大不捐如疫門神人教用香蘇散二條猶曰存其方也至腳門載張文定患腳疾道人與緑豆兩粒而愈一條是斷非常食之緑豆豈可録以為案又如金瘡門載薜衣道人接已斷之首使人回生一條無藥無方徒以語怪更與醫學無關如斯之類往往而是殊不免蕪雜義蟲獸傷門於薛立齋蚊蟲入耳一條注曰此案耳門亦收之非重出也恐患此者不知是蟲便檢閲耳云云而腹疾門中載金臺男子誤服乾薑理中丸發狂入井一條隔五六頁而重出又是何義例乎編次尤未免潦草然採托既博變證咸備實足與江瓘之書互資參考又所附案語尤多所發明辨駁較諸空談醫理固有實徴虛揣之别焉乾隆四十六年十二月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:ec66fad532d6a10d3a7253323d6f8f6ddac2cd35398883e5a80d7f6225d5ed5f
