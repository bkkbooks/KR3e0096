body:
  text: 續名醫類案卷二十七錢塘魏之琇撰驚張子和治衛得新之妻旅中宿于樓上夜值盜劫人燒舍驚墮牀下自後每聞有響則驚倒不知人家人輩躡足而行莫敢冒觸有聲歲餘不痊諸醫作心病治之人參珍珠及定志丸皆無效張見而斷之曰驚者謂陽從外入也恐者隂從內出也驚者謂自不知故也恐者自知也足少陽膽經屬肝木膽者敢也驚怕則膽傷矣乃命二侍女執其兩手按髙椅之上當面前置一小几張曰娘子當視此一木猛擊之其婦大驚張曰我以木擊几何以驚乎伺少定擊之驚又緩又斯須連擊三五次又以杖擊門又遣人畫背後之窗徐徐驚定而笑曰是何治法張曰內經云驚者平之平者常也平常見之必無驚是夜使人擊門窗自夕達曙夫驚者神上越上從下擊几使其下視所以收神也一二日雖聞雷亦不驚德新素不喜至是終身厭服如有人言張不知醫者執戈以逐之張謂卜曰汝妻亦當病卜曰太醫未見吾妻何以知之曰爾感此驚幾年矣卜曰當被火時我正在草堂中熟寐人驚喚我睡中驚不能言火已塞門我父拽出我火中今五年矣張曰汝膽伏火驚甲木乘脾土是少陽相火乘脾脾中有熱故能食而殺榖熱雖能化榖其精氣不完汝必無子蓋敗經反損婦人汝妻必手足熱四肢無力經血不時卜曰吾妻實如此亦已五年矣他日門人因觀內經言先㵼所以勝次㵼所勝之論其法何如以問張張曰且如膽木乘脾土此土不勝木也不勝之氣尋救于子已土能生庚金庚為大腸味辛者為金故大加生薑以伐木然不開脾土無由行也遂用舟車丸先通其閉塞之路是先㵼其所不勝後用薑汁調濬川散大下之次㵼其所勝也大抵陽干尅陽干腑尅腑臟尅臟卜氏子年二十八嵗病身弱四肢無力面色蒼黃左脅下身側上下如腎狀每發則痛無時食亦減大便如常小便微黃已二三載矣諸醫窮救張治之視其部分乃足厥隂肝經兼足少陽膽經也曰甲膽乙肝故青其黃者脾也診膽脈小此因驚也驚則膽受邪腹中當有驚涎緑水病人曰昔曽屯軍被火自是而疾作乃夜以舟車一百五十丸濬川散四五錢加生薑自然汁平旦果下緑水四五行或問大加生薑何也曰辛能尅木也下後覺微痛令再下之比前藥減三之一又下緑水三四行痛止思食反有力張路玉治吳昭如室年壯體豐而素有嘔血腹脹脾約便難之恙兩遭回祿憂恚頻仍近于失血之後忽然神氣憒亂口禁目瞪診其氣口數甚而促弦大而芤形神不能自主似有撮空之狀或謂症犯條疑不出五日當斃張謂不然若是撮空必然手熱散漫今拈著衣被儘力撲摘定為夾驚夾怒無疑爪者筋之餘非驚怒而何況脈來見促當是氣中結殊非代脈之比詢其病因驚怒俱有遂用鈎藤一兩煎成入竹瀝半盞薑汁五匙連夜製服服後即得安寐六脈亦稍平但促未退仍用前方減半牛黃一分其夕大解三度去結屎五六十枚腹脹頓減脈靜人安數日平復如常老僧悟菴心悸善恐遍服補心養血之藥不應天王補心丹服過數斤驚悸轉增面目四肢微有浮腫之狀求張治察其形肥白不堅診其脈濡弱而滑此氣虛痰飲浸積于膈上也以導痰湯稍加參桂通其陽氣數服而悸恐悉除更以六君子加桂水泛作丸調補中氣而安吳孚先治王兵憲患驚悸時或煩躁夜更靡寧右關虛弱左寸尤甚與加味歸脾二十劑全愈龔子才治一童子因用心過度少寐驚悸怔忡惡寒先用補中益氣湯茯苓棗仁逺志惡寒漸止又用加味歸脾湯驚悸稍安再用養心湯而安杜某治林學士子居常喜食海蛤飲食之頃未嘗不設至十八年忽面色頓青形體瘦削夜多驚悸皆謂勞瘵之疾百療不瘳杜脈之曰非病何以知之雖瘦削面青精神不減問學士子秀才好食甚物曰多食南海中味杜曰但多服生津液藥病當自愈如是經兩月面色漸有紅潤意夜亦無驚悸林問所以然杜曰王冰素問云鹽發渴乃勝血之症海味加鹽物既多食使心血漸衰則夜驚悸今既去鹹用生津液之藥人且少壯血津易生故疾去乃安矣薛立齋治一婦人勞則心跳怔忡寒熱往來用歸脾湯為主佐以八珍湯諸症悉愈又用加味逍遙散寧志丸而安後復作服歸脾寧志藥即愈一婦人患驚悸怔忡日晡發熱月經過期飲食少思用八珍湯加逺志山藥棗仁三十餘劑漸愈佐以歸脾湯全愈後因勞發熱食少體倦用補中益氣湯又因怒適月經去血不止前症復作先以加味逍遙散熱退經止又用養心湯治之而痊一婦人驚悸怔忡自汗盜汗飲食不甘怠惰嗜卧用歸脾湯而愈至年餘懷鬱結患前症兼衄便血仍用前湯而愈許紳者京師人嘉靖初供事御藥房受知于世宗纍遷太醫院使歷加工部尚書領院事二十年宫婢楊金英等謀逆以帛縊帝氣已絶紳急調峻藥下之辰時下藥未時忽作聲去紫血數升遂能言又數劑而愈帝德紳加太子太保禮部尚書賜賚甚厚未幾紳得疾曰吾不起矣曩者宫變吾自分不效必殺身因此驚悸非藥石所能療也已而果卒賜諡恭僖官其一子恤典有加明太醫者官最顯止紳一人明史金陵瑣事亦載此則其藥乃大黃桃仁紅花等馬元儀治一人患心悸症肢體倦怠或以隂虛治之不效診其脈浮虛無力蓋得焦勞思慮傷心也內經云心痺者脈不通煩則心下鼓又原病式云水衰火旺心胸躁動據此則是隂虛矣且後面于二句又無發明又何必勉強攔入其言脈不通者正以焦勞太過心臟之脈鬱而不通也鬱則傷血而動君火故悸動不寧也心之下脾位脾受心病鬱而生涎精液不生清陽不布故四肢無氣以動而倦怠也法宜大補心脾乃與歸脾湯二十劑即以此方作丸服之全愈章氏婦因失恃于歸勞心悒鬱形志倍傷遂心悸恍惚身體如在舟車雲霧中或與降氣理痰之劑不應診之兩脈虛微尺脈倍弱曰夏勞過度則脾損脾虛必盜母氣以自救故心虛而悸心藏神為十二官之主虛則無所聽命而恍惚不安也宜大培土氣則脾自復不仰結于心而心亦安神亦守矣與人參附子理中湯一劑而安四劑神氣大復脈和而愈仲氏女因驚恐即發熱神昏語言錯妄脈之右結澀左浮弦此雖驚恐而得實先因悒鬱所傷也凡鬱則肺金必虧肝脈因之寡畏而妄行腎水因之失養而不足加以驚恐則腎益傷而肝愈擾其發熱者風木內甚也神昏者火熱上騰也宜舒通肺氣以制肝生腎用瓜仁紫菀枳殼桔梗杏仁蘇子秦芁膽星二劑右脈透神氣清加生首烏黃連二劑熱亦退再以生地三錢首烏五錢逺志一錢牛膝知母膽星一錢貝母橘紅茯神各一錢甘草五分而愈蓋金氣治則木受制而水得所養一舉而三善備矣若泥驚恐所致而用金石腦麝之品不幾延寇入室乎髙逢辰表姪嘗遊惠山暮歸遇一巨人醉卧寺門驚悸不解自是便溺日五六十次李氏云心小腸受盛腑也因驚而心火散心虛腎冷而然其傷心之驗歟醫説續編按經云驚則心無所倚恐則傷腎是為水火不交二臟俱病臟既受病腑欲専為其可得乎此受盛職廢運化無權而滲泄不禁矣原注長山徐嫗遘驚痰初發手足顫掉褫去衣裳裸而奔或歌或哭或牽曳如舞木偶粗工見之吐舌走以為鬼魅所惑周漢卿獨刺其十指端出血已而安續文粹同上繆仲淳治顧太學叔夏內人舟中為火所驚身熱羸弱幾成勞瘵症醫誤投參茋勢危甚以清肌安神之劑與之戒以勿求速效凡十數劑而安麥冬青蒿子銀柴胡桑皮枇杷葉各二錢炙鱉甲苡仁各三錢五味白芍生地各一錢施沛然治呂孝亷沈僕患驚悸三月聞響則甚遇夜則恐恐甚則上屋踰垣旋食旋飢日啖飯無算咸謂心偏失神用補心湯益甚脈之右關洪數無倫兩尺浮大按之極濡病得于酒且內腎水枯渴客熱犯胃經云腎主恐又曰胃熱亦令人恐又曰消榖則令人飢又曰足陽明病聞木音則惕然驚甚則踰垣上屋此病在胃與腎脾合胃心屬火是脾之母補心則胃益實火盛則水益涸故藥之而病反甚也但病本在腎而標在胃也先治其標用㵼黃散後治其本用腎氣丸一病而寒熱並用補㵼兼施第服㵼黃散三日當不飢矣服腎氣丸十日當不恐矣已而果然一儒者苦學久困場屋得疾吐衄盈盆尫羸骨立夜卧交睫即夢鬭敗爭負恐怖之狀不可形容如是十載每勞則發用正心安神不效一日讀藏氣法時論乃知人魂藏于肝肝又藏血作文既苦衄血又傷則魂失養故交睫若此知非峻補不奏㓛乃以酒鎔鹿角膠空腹飲之五日而睡卧安半月而肌肉生一月而神氣復始能出户朱氏選張景嶽治一強壯少年遭酷吏之恐病似脹非脹似熱非熱絶食而困衆謂痰火宜清中焦診之曰此恐懼內傷少陽氣索而病及心腎大虧之症也遂加溫補兼治心脾一月而起愈後雖氣健如初而陽寂不舉告之曰根蒂若斯腎傷已極非少壯所宜之兆速宜培養心腎庶免他虞彼反以恐嚇為疑全不之信未及半載竟復病而殁惜哉未入選顛狂孫兆治相國寺僧充患癲疾經半年遍服名醫藥不效僧俗兄潘氏家富召孫療之孫曰今夜睡著明後日便愈也潘曰且告投藥報恩不忘孫曰有鹹物但師喫待渴却來道至夜僧果渴孫至遂求溫酒一角調藥一服與之有頃再索酒與之半角其僧遂睡兩晝夜乃覺人事如故潘謝孫問治法曰衆人能安神矣而不能使神昏得睡此乃靈苑方中硃砂棗仁乳香散也人不能用耳辰砂一兩光明有牆壁者棗仁半兩微炒乳香半兩光瑩者右量所患人飲酒幾何先令恣飲沉醉但勿令吐至靜室中以前藥都作一服溫酒調下作一盞調之令頓飲如飲酒素少人但以隨取醉服藥訖便安置牀枕令卧病淺者半日至一日病深者三兩日令家人潛伺之鼻息勻調但勿喚覺亦不可驚觸使覺待其自醒即神魂定萬一驚悟不可復治正肅吳公少時心病服此一劑五日方寤遂瘥醫藥綱目浙江一婦人顛狂不止醫以瓜蒂半兩為末每一錢重井花水調滿一盞投之隨得大吐吐後熟睡勿令驚動自此無恙同上竇材治一人得風狂已五年時發時止百法不效竇為灌睡聖散三錢先灸巨闕三十壯醒時再服又灸心俞五十壯服鎮心丹一料竇曰病患已久須大發一回方愈後果大發一日全好又一婦人産後得此症亦如前灸服薑附湯而愈張子和治一叟年六十值徭役煩擾而暴發狂口鼻覺如蟲行兩手爬搔數年不已兩手脈皆洪大如絙繩斷之曰口為飛門胃為賁門口者胃之上源也鼻者足陽明經起于鼻交頞之中旁納太陽下循鼻柱交人中環唇下承漿故其病如是夫徭役煩擾便屬火化火乘陽明經故經言陽明之病登髙而歌棄衣而走罵言不避親疏又况肝主謀膽主決徭役迫遽則財不能支則肝屢謀而膽不能決屈無所伸怒無所泄心火磐礴遂成陽明金然胃本屬土而肝屬木膽屬相火火隨木氣而入胃故暴發狂乃命置燠室中涌而汗出如此三次內經曰木鬱則達之火鬱則發之良謂此也又以調胃承氣湯半斤用水五升煎半沸分作三服大下二十行血水與瘀血相雜而下數升乃康以通聖散調其後大下則是土鬱奪之也一男子落馬發狂起則目瞪狂言不識親踈棄衣而走罵言涌出氣力加倍三人不能執縛燒符作醮問鬼跳巫殊不知顧丹砂牛黃犀珠腦射資財散去室中蕭然張以車輪埋之地中約高二丈許上安中等車輪其輞上鑿一穴如作足盆之狀縛病人于其上使之伏卧以軟裀襯之令一人于上坐機一枚以棒攪之轉千百遭病人吐出青黃痰沫一二斗許繞車輪數匝甚病人曰我不堪可解我下從其言而解之索涼水與之冰水飲數升狂乃罷矣范純佑女喪夫發狂閉之室中夜斷窗櫺登桃樹上食桃花幾盡及旦家人接下自是遂愈按此亦驚恐傷肝痰挾敗血遂致發狂偶得桃花利痰飲散滯血之功與張仲景治積熱發狂用承氣湯畜血發狂用桃仁承氣湯之意相同蘇鶚杜陽編本草綱目一婦人顛狂十年至人授以真鬱金七兩明礬三兩為末薄糊為丸梧子大每服五十丸白湯下初服心胸間有物脫去神氣灑然再服而蘇此驚憂痰血絡聚心竅所致鬱金入心去惡血明礬化頑痰故也本草綱目龔子才治一人顛狂亂打走叫上屋用瓜蒂散吐出其痰數升又以承氣湯下之而愈一人患心風即是痰迷心竅發狂用真花蘃石煅黃酒淬一次為細末每服一錢黃酒下一婦人發狂棄衣而走踰屋上垣不識親踈狂言妄語人拿不住諸醫束手龔令家人將涼水亂潑不計其數須臾倒仆脈之六部俱弦數有力此熱極生風也用防風通聖散加生地黃黃連桃仁紅花丹皮三劑而安後服祛風至寶丹全愈凌漢章治金華富家婦少寡得狂疾至裸形野立凌視曰是謂喪心吾針其心心正必知耻蔽之帳中慰以好言釋其愧可不發乃令二人堅持用涼噴而針之果愈明史孫文垣治吳某以績學勞心有星士決其發解適以瘧作不能終場遂抑鬱而成顛狂或悲或歌或鼓掌或頓足甚則罵詈不避親踈診之面白而青兩寸短澀左關弦右關滑兩尺平此心肺之神不足志願髙而不遂鬱結不舒津液生痰而不生血又攻痰尅伐太過心神不得養故昏亂無所攝持經云主不明則十二經危按此則宜補養收斂精神兼之清痰可萬全也用棗仁人參茯仁甘草丹參當歸以補心安神黃連竹茹以清肝膽之火元參佐之外以龍齒珍珠羚羊角牛黃膽星天麻青黛辰砂全蝎冰片黃連甘草膏為丸金箔為衣調理而愈張路玉治黃文學讝妄顛仆數月來或六七日一發或一日二三發發則大吐涎水血沫或一日半日而蘇狀同癎症晝夜恆見亡婢僕婦二鬼纒綿或時昏憒不省或時妄言妄見精神氣不時下脫不能收攝服二冬二地連柏金櫻石蓮之屬反作㵼不食診之寸盛尺微前大後小按之忽無舉之忽有知為神氣浮散之候因與六君子加龍齒菖蒲逺志送養正丹間續而進前後共六七服是後讝妄顛仆絶不復發邪祟亦不復見惟夢泄而為平時痼疾更與平補鎮心丹兩月而愈此與前孫案症治大同一婦人狂言叫罵歌笑不常似祟憑依一邊眼與口角弔起或作狂治或作心風治皆不效乃是舊有頭風之病風痰使然用芎辛散加防風服之頓愈婦科鄭青山因治病不順沉思徹夜兼受他醫諷言心甚懷憤天明病者霍然憤喜交集病家設酌酬之而諷者已遁憤無從泄忽然大叫發狂即是觀之業醫者亦可憐哉有志之士慎勿為此彼云不可不知醫者非聖人之言也同道治之罔效一日王道來往候索已服未服等方視之一併毁棄曰此神不守舍之虛症豈豁痰理氣清火藥所克效哉遂令覔上好人參二兩一味煎湯服之頓安三啜而病如失更與歸脾湯調理而愈醫通李士材治張少椿女以喪子悲傷忽當雷雨交作大恐苦無所避旦日或泣或笑或自語或罵詈如見鬼祟診其心脈浮滑餘皆沈細此氣血兩虧憂恐傷心心傷則熱熱積生風也以滚痰丸用桔梗延胡索陳皮杏仁煎湯送下出痰積甚多而愈醫通龔子才治一女子年二十歲未婚患每見男子咬住不放後昏倒隂戶流出冷精頃間即醒其厥隂肝脈弦出寸口乃隂盛思男子不可得也令其父母用棍痛責使之思痛而失欲也後服抑青丸而愈韓貽豐治永和一少年患風狂百治不效其父兄縛送求治為針百會二十針升堂公坐呼少年前來命去其縛豫杖者十杖畢而醒問以前事茫然不知也神針心法一婦因夫病垂危心患之乃夫病愈婦即病風狂晝夜不思眠食白日裸身狂走或登髙阜或上窑房莫能禁也乞韓治將至其家其婦正在祖裼狂跳中忽自覔衣覆體斂容屏息若有所俟者鄰媼訝之初不解其何意俄而韓至令之跪則跪因跪而受針時韓為本邑宰為針其百會一穴鬼眼二穴各二十一針針畢即叩頭謝曰吾今不敢為祟矣願乞饒命吾去矣言畢而醒柴嶼青治少京兆傅嘉言夫人忽患顛症診知胸有鬱結投以逍遙散加鬱金香附兩劑而癡象頓愈惟神氣尚呆不語即用前方為散服三兩用靈苑方服之而瘥靈苑方見孫兆案薛立齋治一婦人素清苦因驚而顛或用風痰等藥愈甚薛用參茋歸术濃煎佐以薑汁竹瀝三斤餘方愈王海藏治許氏陽厥狂怒罵詈親踈或哭或歌六脈舉按無力身表如冰石發則叫呼聲髙潔古云奪其食即已因不與之食乃以大承氣湯下得臟腑積穢數升狂稍寧數日復發復下如此五七次行大便數斗疾緩身溫脈生良愈此易老奪食之法也大還收綱目亦一人病顛脈喘且搏承氣湯數下而安病機沙篆陳良甫治一女人眼見鬼物言語失常循衣直視衆醫多用心藥治之無效乃投養正丹二貼煎乳香湯送下以三生飲佐之立愈又一男子亦常病此症亦用此藥收效養正丹與百一方抱膽丸無異抱膽丸內無硫黃有乳香也自合方見效良方王執中治一士狂妄異常且欲打人病數日矣意其自心疾為灸百會百會治疾故也又疑是鬼邪用秦承祖灸鬼邪法併兩手大拇指用軟帛繩急縛定當肉甲相接處灸七壯四處皆著火而後愈更有二貴人子亦有此患有醫生亦為灸此穴而愈張子和治一狂人隂不勝其陽則脈流薄厥陽并乃狂難經曰陽極則狂隂極則顛陽為腑隂為臟非陽熱而隂寒也熱并于陽則狂狂則生寒并于隂則顛顛則死內經曰足陽明有實則狂故登髙棄衣而走無所不為是熱之極也以調胃承氣大作湯下數十行三五日復上涌一二升三五日又復下之凡五六十日下百餘行吐亦七八度如吐時暖室置火以助其熱兩汗少解數汗方平醫説續編廣筆記風顛病神方好犀角四兩銼末每用一兩加清水十碗入砂鍋內熬至一碗濾淨再加水十碗熬至二酒杯加淡竹葉四兩水六碗煎二碗渣去加犀角汁同服盡四劑即愈汪石山治一人縣差拿犯人以鐡索頂所犯行至中途投河而死犯家告所差人索騙威逼致死所差脫罪未免費財憂憤成病如醉如癡謬言妄語無復知識診之曰此以費財而憂必得喜乃愈藥豈能治哉令其鎔錫作銀數錠置其側病者見之果喜握視不置後病遂愈此以喜勝憂也劉宏璧治一富室女正梳洗間忽見二婦相拘方奔逸復擠至遂大叫叫後乃大哭哭已即發狂寒熱相繼目眩不眠以為鬼祟召巫符呪而病益困診之肺脈直上魚際肝亦雙弦知所見者即本身之魂魄也蓋肺藏魂肝藏魄因此小柴胡湯去甘草而外加羚羊角龍骨牡蠣清肺肝鎮驚怯一服而安癎竇材治一人病癎三年餘灸中脘五十壯即愈又一婦病癎已十年灸中脘五十壯愈凡人有此疾惟灸法取效最速藥不及也張子和云一婦病風癎自六七歲因驚風得之後每三二年間一二作至五七年五七作逮三十嵗至四十歲則日作甚至一日十餘作遂昏癡健忘求死而已值歲大飢采百草而食于水濵見草若蔥狀采歸蒸熟食之至五更忽覺心中不安吐痰如膠連日不止約一二斗汗出如洗甚昏困三日後遂輕健病去食進百脈皆和以所食蔥訪之乃憨蔥苗也即本草藜蘆是也龔子才治王大參子年十八患癎每發即仆地吐涎不省人事少頃復蘇或一月一發或兩月發四五次已七年遍醫不效診之六脈滑數人迎緊盛此氣血虛而有寒痰壅併也以追風祛痰丸加人參當歸黃連各一兩安神丸二藥兼服未及半年而痊後有數人俱如此治而愈馮楚瞻治金氏子年十四患癎病羣醫不效針灸繼之消痰鎮墜其發更甚且頻診脈洪弦有力惟兩尺俱弱此隂虧之極孤陽斂火性上炎僵仆諸候乃發理所然也消痰鎮墜不更耗隂分乎乃令空心淡鹽湯吞加味八味丸四五錢以使真陽藏納然陽無隂斂何能久藏火無水制難免浮越隨以重濁大料壯水之劑繼之以助其封蟄之勢則水火得其所矣下午乃服調補氣血養心清肺和肝之膏滋一丸如是調理兩月精神補長癎症不治而愈楊乘六治翁姓病癎症每日至子時必僵仆手足徑硬兩目直視不能出聲其狀若死必至午後方蘇蘇則言動依然飲食如故别無他病如是者三年略無虛日遍治不痊楊視其氣色晦滯口眼呆瞪面若失神上下眼胞黑暈舌狀如無皮脈則右關虛大而滑右寸若有散意曰此非癎症也乃痰厥也必因驚而得蓋為君主驚則心胞氣散君火受傷致脾土不生中州虧損不能攝水因而生痰夫痰隨氣升降者也天地之氣升于子而降于午人身亦然當子時一陽生其氣上升痰亦與之俱升逢虛則入迷于包絡之中故不省人事僵仆若死也至午時一隂生其氣下降痰亦隨之同降包絡得清虛而天君泰然百體從令矣詢之數年前果受驚幾死今因驚致損因損致痰然鎮驚消痰皆益也惟有補其君火篐其包絡俾其氣不散則痰不能侵擾而為害且君火漸旺則能生土以攝水其痰不消而自消矣養榮湯去逺志倍棗仁五味白芍一劑是晚即不發五日連服十劑皆貼然安卧至晚留一方而别薛立齋診鴻臚王之室人素有癎症遇勞役怒氣則發良久自醒一日因飲食勞役失宜發而半日方醒不能言語或以為風中于臟用祛風化痰順氣之劑及牛黃清心丸病益甚六脈浮大兩寸虛而不及本部且進飲食曰此脾胃之氣傷也若風中于臟禍在反掌彼不信仍用風藥後果卒劉宏璧治一女年方及筓忽染怪病醫莫能識邀視牙關緊閉手足抽搐目睛上瞪晝夜兩發非癎而何蘇後腹內攪痛欲吐不得冷汗淋漓皆肝木為祟察其邪不在表裏在上下上部有熱下部有寒胸胃互異寒熱交戰投以黃連湯勢漸殺再數劑輒頌更生蓋連以治熱薑以治寒桂枝半夏祛風化痰參棗甘草輔心和中使正氣建立邪氣分散而心應手矣琇按癎症多由肝病兼挾痰火方中薑夏以豁痰連桂以平肝甘草緩肝而和脾參棗補脾而壯肺肺盛則木亦自平劉用此獲愈當矣然目之為怪疾而曰上熱下寒逮知其然而未知其所以然者也笑哭張子和次子自出妻之後日瘦語如甕中此病在中也常撚第三指失笑此心火也約半載日飲冰雪更服涼劑張曰惡雪則愈矣其母懼其太寒張罵曰吾用藥如鼓之應桴尚惡寒涼藥宜乎世俗之謗我也至七日厭水不飲病日解矣邱汝誠一女子恆笑不止求診問生平所愛何衣令著之母與對飲故滴酒沾其裙女大怒病遂瘥先達李其姓歸德府鹿邑人也世為農家癸卯獲售于鄉伊父以喜故失聲大笑及春舉進士其笑彌甚歷十年擢諫垣遂成痼疾初猶間發後宵旦不能休大諫甚憂之從容與太醫院某因得所授命家人紿乃父云大諫已殁乃父慟絶幾殞如是者十日病漸瘳佯為郵語云大諫治趙大夫絶而復蘇李因不悲而笑症永不發矣蓋醫者意也喜則傷心濟以悲而乃和技進乎道矣簮雲樓雜記見説鈴戴原禮治姑蘇朱子明之婦病長號數十聲暫止復如前人以為厲所憑莫能療戴曰此鬱病也痰閉于上火鬱于下故長號則氣少舒經云火鬱發之是已遂用重劑涌之吐痰如膠者數升乃愈兩浙名賢録吳孚先治宋小泉發熱自汗肢體搖振或時自利嘔噦間作倐爾喜笑倐爾悲哭語言錯亂六脈沉澀微弱此隂盛陽虛四君子加炮薑茯苓一劑知二劑已管先生治一婦妊娠四五個月臟燥悲傷遇晝則慘切淚下數次象若神靈如有所憑醫與巫皆無益與仲景大棗湯一投而愈醫學綱目孫文垣表嫂孀居二十年矣右癱不能舉動不出户者三年今則神情恍惚口亂言常悲泣詰之答曰自亦不知為何故也兩寸脈短澀以石菖蒲逺志當歸茯苓人參黃茋白术附子晚蠶沙陳皮甘草服四帖稍愈但悲泣如舊夜更泣因思仲景大棗小麥湯正與此對與兩帖而瘳方用大棗十二枚小麥一合大甘草炙三寸水煎飲此憂傷肺肺臟寒故多泣也憂傷肺二語本經文第參茋术附實溫肺藥服之更泣大棗小麥甘草實心脾藥服之而瘳何也喻嘉言謂為肺臟燥而然似較肺臟寒有理錢仲陽治小兒哭叫又謂金木相擊亦有見解馬元儀治吳氏婦兩寸浮數餘脈虛澀時悲哀不能自禁喉間窒塞火升痰喘此悒鬱過多肺金受病也金病則火動痰生火痰相搏氣湊于上故喘促不寧而氣道不利也法當舒通肺鬱則火降痰清而悲哀喘促諸症自已用紫菀乾葛枳殼桔梗半麯橘紅杏仁蘇子一劑而神氣清再劑而悲哀息繼以人參白术炙草補其心氣逺志茯神寧其神志半麯廣皮導其痰涎肉桂黃連以交心腎數劑而神復脈和再以歸脾湯調理全愈王執中母久病忽泣涕不可禁知是心病也灸百會穴而愈執中凡遇憂愁悽愴亦必灸此有疾者不可不知信也吳橋治胡有濡母中年親酒而踈榖忽心亂恍惚日夜啼泣如不欲生橋始診之曰脈無他但此病非歲月可已假令用藥即積寒涼而他病生但勿藥聽其自愈顧語不入遍謁諸醫治踰年病益深逆橋復診橋曰脈稍損于前然不為害第勿藥而聽其自愈耳母敬諾每月橋視之橋持議如初勿藥踰年而愈太函集不眠張子和治一富家婦人傷思慮過其二年不寐無藥可療其夫求張治之張曰兩手脈俱緩此脾受之脾主思故也乃與其夫以怒激之多取其財飲酒數日不處一法而去其婦大怒出汗是夜困眠如此者八九日不寤自是食進脈平王思中治周氏患發熱咳嗽以隂虛內傷治愈劇經月不得眠王診之曰此謂懸飲乃鬱氣所致氣不升降則液停積漸成飲囊法當開鬱行氣每劑用荷葉蒂七枚一服而鼾睡數日平復吳江縣志張漣水名康忠嘗治董尚書潯陽不眠用百部一兩半夏一兩董即得美睡酬之百金董既睡夢為役夫牽船行赤日中甚疲勞忽見涼樹美蔭甚樂大叫而寤人謂張君二味藥即得百金董公百金乃得役夫一息識小録徐樹丕孫文垣治潘景宇內人後半夜不眠肝火浮入包絡兩太陽及眉稜骨痛肝火上逆支絡面黃肌瘦大便溏稍勞則體熱四肢無力皆肝陽盛而脾隂虛其脈左寸洪滑肝脈上溢自春至秋皆然此由脾虛肝心二經火盛然也當云肝盛脾虛先用四君子加酒連柴胡扁豆澤㵼滑石調理夜與錢仲陽安神丸燈心湯下服八日得睡兩太陽亦不痛黃連之功居多繼用六君子加黃茋秦芁柴胡澤㵼當歸白芍黃柏全安盧不逺治聞子將母冬月心忽然如散而沉下便不得睡幾三月矣脈之獨左關弱不能應指以為肝虛須補其母當立春始安用熟地為君茯苓棗仁當歸人參防風逺志佐之防風逺志宜酌服二十帖至期愈子將問散不寐似屬心經何反以肝腎藥效而立春日應曰此得之脈也經曰肝不足則恐恐則氣下故先其令而疾作補水生木待時而元氣復也其沈下若散乃肝氣不得腎養認為心病者誤矣李士材治張侗初善怒善鬱且酬應繁劇痛膈中痛甚夜不成寐醫用菖蒲枳朴木香豆蔲殊不知此症屬虛虛則濁隂不降神氣失守故痛且寤也遂以歸脾湯倍用人參當歸不十劑而胸次快然安寢醫通張玉路治一少年因恐慮兩月不卧服安神補心藥無算與以溫膽湯倍半夏柴胡一劑頓卧兩晝夜竟爾霍然一人遺精煩擾不得卧與六味丸料加棗仁數服而安寢如常一人㿉瘍久不收斂而不得卧瘍醫不能療令與大劑十全大補而安陸養愚治沈翰撰虹臺年近五旬體肥善酒而厚味常露卧秋末冬初忽酒後煩躁不得寐或以安神養血不效惟服清火清痰稍應後每易一方間瘥數日即復如故惟大醉後得吐始熟寐一二時然日間則倦不能起且飲食無味延至仲夏偶煩躁身癢以熱湯澡浴是夜睡至天明由是臨卧必浴即不能長睡而或一二更安寢若間日浴即不寐至立秋浴亦不應八月間竟全不睡矣診之六脈沉澀兩寸尤甚自言平日天氣稍暖即畏熱多汗自病後但煩悶而不畏熱暑月竟無汗因思內經每有論無方獨不寐一條兼有其方何今人不知用及用亦無效也經言不寐之因則曰衛氣行于陽不得入于隂行于陽則陽氣盛不得入于隂則隂虛故目不瞑又曰陽明逆不得從其道故不得卧又曰胃不利則卧不安其言治療之法調其虛實以通其道而去其邪又曰決瀆壅塞經絡大通隂陽和得其方以千里水揚之萬遍炊以葦薪用秫米半夏煎飲其汁病新發者覆杯則卧汗出則已久者三飲而已今得吐則睡是內壅塞須決也澡浴則睡是外之經絡須通也因用子和法以獨聖散三日約涌其涎飲盆許是夜身雖困倦然已得睡禁其厚味酒醴惟進稀粥五日後令密室中置沸湯數鍋使熱氣熏蒸中設一桶深湯澡浴之拭乾就寢用麻黃蘇葉乾葛防風威靈仙半夏各一兩照內經煎法熱服後覆之汗微微而來是夜睡始沈又將息二日再以此法大汗之自此睡卧如常身體輕快精神清爽六脈皆起且流利而病去矣一人煩燥發熱肌體骨立目不得瞑已三年矣醫與清熱養隂化痰安神之藥及千劑勿效一刻不得安卧診之肝脈獨沉而數此怒火久伏而木鬱宜達用柴胡四錢白芍二錢丹皮梔子各二錢五分甘草五分桂枝四分藥進熟寐至一晝夜後逍遙散加人參丸服而愈大還李季虯庶母因兒痘驚苦積勞虛煩不得卧心膽虛怯觸事驚悸百藥不效家弟長文偶于友人所聞興化陳丹崖療一女人甚竒其症與母類叩其方乃溫膽湯也試之數劑而效半夏七錢竹茹枳實各三錢陳皮四錢半茯苓甘草各二錢二分半分二劑薑棗煎服外加棗仁五錢後因虛極加人參二錢質之仲淳曰此必有痰而善飯者也果然廣筆記顧太學叔夏內人患隂虛火症徹夜不眠者兩月飲食俱廢形體日削中外疑其必無救矣李為之診視決其必無大害第要多需時日耳用大劑人參棗仁茯神逺志生地當歸五味麥冬因虛甚氣怯佐以琥珀辰砂金銀器之類約百餘劑而瘳後友人詢其故李謂此病雖屬虛幸臟腑無損心經雖有火幸不至爍肺多服補隂收斂之劑則水火自然升降所云壯水制陽光正此謂耳至于久病脈調身不發熱豈有他虞哉錢國賓治陜西俞少川久以開氊店居杭體厚剛健偏嗜炙􅏼性燥多動肝氣年逾五旬終夜不寐者六年用痰火氣血之藥多矣早晨診候寸關洪浮有力若堅實之筋惟兩尺脈大熟思之以脈論肥人當沉今六脈洪浮有力以症論上身怕熱足反畏冷以藥論清補俱已盡服難經曰人之安睡神歸心魄歸肺魂歸肝意歸脾志藏腎五臟各安其位而寢且夜屬隂主靜日屬陽主動隂陽和平安然寤寐此六年不睡乃陽亢症也當大泄其陽使隂氣漸復則寐矣用大承氣湯加大黃二兩泄十餘行其人昏倦睡一日方醒進以粥食愈續名醫類案卷二十七
