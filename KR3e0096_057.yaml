body:
  text: 續名醫類案卷五十七錢塘魏之琇撰膿疥蘇頌曰黔人治疥癬遍體諸藥不效者生取白花蛇截斷以磚燒紅沃醋令氣蒸置蛇于上以盆覆一夜如此三次去骨取肉芼以五味令爛頓食之瞑睡一晝夜乃醒瘡疕隨皮便退其疾便愈本草綱目張子和曰貨生藥焦百善云有蕘夫來買苦參欲治疥不識藥性緩急但聞人言可治濃煎一碗服之須臾大吐涎一盆三二日疥作痂矣潘塤曰豫蔓孫患膿疥三年身無完膚下體尤甚內治外治百無一效乃自製一方名和中固氣湯以蒼术一錢燥濕白术一錢固脾黃茋一錢實腠理升麻八分柴胡一錢引清氣元參八分散上焦火芩連各七分清中焦火黃柏七分伏下焦火歸身一錢養心血甘草陳皮人參各五分調中氣煎服存查加白蒺藜金銀花煎洗十數劑全愈楮記室姚應鳯診一人遍體發小疥如粟應鳯曰是名淨海瘡不治生治死其人不信治之死錢塘縣志元希聲侍郎治卒發疥祕驗方石灰隨多少和醋漿水調塗隨手即滅一法用石灰炒紅出火氣香油調敷薛立齋治稽勳李龍岡患疥腿足為甚日晡益焮口乾作渴小便頻赤此腎經虛熱用補中益氣湯六味丸而痊一儒者善嚏患疥以為內有濕熱腠理不密外邪所搏也與補中益氣湯加白芷川芎治之不從自服荆防敗毒散痛處發腫小便赤澀此肺腎隂虛用補中益氣湯加五味麥冬而愈一儒者患疥誤用攻伐之劑元氣虛而不能愈用補中益氣湯加茯苓其瘡頓愈又因調養失宜日晡益甚用八珍湯加五味麥冬五十餘劑而愈一男子患疥色黯作癢出黑血日晡益甚其腿日腫夜消以為氣血虛而有熱朝用補中益氣夕用加味逍遙而愈一男子時疫愈後所患如前用前藥補養而愈有同患用砭法出血而死此因隂虛血熱色黑作癢也何乃反傷隂血哉一婦人疥久不愈食少體倦此肝脾虧損而虛熱先用補中益氣湯加川芎炒梔元氣漸復更以逍遙散而愈若復間譫語此熱入血分用小柴胡湯加生地治之血虛者四物合小柴胡湯熱退却用逍遙散以補脾胃生隂血或有寒熱如瘧亦治以前藥一婦人患疥作癢膿水不止脈浮無力以消風散四劑少愈更以四生丸月餘而平一男子癢少痛多無膿水以芩連荆防山巵薄荷白芍歸梢治之而愈一男子焮痛發熱脈浮數以人參敗毒散四劑少愈更以當歸飲服數劑而愈一男子焮痛寒熱便祕脈數有力以防風通聖散二劑少愈更以荆防敗毒散加黃芩山巵四劑而愈一婦人作癢午後尤甚以當歸飲服數劑少愈更以人參荆芥散數劑而安一男子久不愈搔起白屑耳作蟬聲以四生散白附子黃芪獨活蒺藜數服癢止更以當歸飲服數劑而痊一男子下體處多焮痛日晡尤甚腿腕筋紫而脹脈洪大此血熱而然也就于紫處刺去瘀血以四物湯加芩連地骨丹皮柴胡四劑而安患在上體若臂腕筋紫脹亦宜刺去其血以前湯加柴胡黃芩即愈一男子搔癢成瘡日晡痛甚以四物加芩連荆防數劑而止更以四物加蒺藜首烏黃茋二十劑而愈智化寺一僧患瘡疥自用雄黃艾葉等藥燃于被中熏之翌日遍身焮腫皮破水出飲食不入投以解藥不應而死蓋藥毒熏入腹內而散真氣其禍如此丁丑豫舉家生瘡家人亦用此方熏之瘡不愈未幾鑾兒出痘症極凶藥不能下咽而歿逮亦受其毒耳一男子患瘡疥搔破出膿水面赤作渴大便堅實脈洪數左關寸為甚此木火相搏也先用瀉青丸料煎服熱勢頓減又用梔子柴胡散加味逍遙散而瘡愈一儒者遍身生瘡瘙癢膿水淋漓自知醫服八珍荆防之類益甚脈洪大按之無力謂此氣血虛熱也用八珍湯加丹皮治之而愈繼娶後兩足生瘡久不愈尺脈數而無力用地黃丸八珍湯而痊一男子時疫愈後遍身發㿔作癢服補中益氣湯而愈因人言不信乃用砭法出血而死此因隂虛血熱色黑作癢也何乃反傷隂血哉一男子患㿔乾癢作痛以苓連荆防山梔薄荷白芍歸梢治之而愈蔣仲芳治一僧初患疥自以水銀蘄艾熏之遂喘息胸滿遍身浮腫或投五皮飲而不效投椒目大黃等喘腫愈甚曰氣道皮膚肺氣熱也復以火熏火毒傷肺遂失降下之令氣道塞水道閉喘息溺澀浮腫之所由來也今復推蕩隂血又傷若非童真難免于死矣以麥冬黃芩山梔桑皮花粉滑石木通燈草與之四劑而愈薛案有一僧亦用熏法致死胡氏子年二十餘生膿窠已一年服藥無算長卧牀席二三日間昏暈數次其室穢氣盈溢膿血痛苦仰卧不能轉側兩手皆瘡不能診候問其飲食惡心否云尚可飲食曰胃氣在可生也即以黃茋白术當歸甘草廣膠為主佐以銀花浮沒煎之以酒六劑瘡愈大半二十劑而全愈姚氏婦有子而自乳肥瘡如桃背及下半身俱滿異痛異癢膿血淋漓已經三月不時寒熱漸作惡心蔣曰病急矣但喜其日未久因乳子而血氣驟虛因多卧而飲食不運也亦以前方加黃柏連翹陳皮香附外以大黃朴硝松香東丹為末少加飛鹽麻油調敷亦不久而愈此二人者胡子清熱消運之品俱為日久虛弱者設也若初起壯實者粒如小粟而多癢曰疥瘡風熱為勝理以苦參黃柏荆芥防風為君膿泡如痘而多痛曰膿窠濕熱居多理宜蒼术秦艽銀花連翹為主俱加天麥門冬酒炒黃芩以清肺蓋肺主皮毛肺熱則皮毛有是疾也若日久則肺虛又宜補肺而不宜清肺矣此意先哲未及故附之癬張子和治一女子年十五兩股間濕癬長三四寸下至膝發癢時爬搔湯火俱不解癢定黃赤水又痛不可耐炙焫熏泄硫黃䕡如僵蠶羊蹄跟之藥皆不效其父母來求療張曰能從豫言則瘥父母諾之以扉針磨尖快當其癢處于癬上各刺百餘針其血出盡煎鹽湯洗之如此四次大病方除此方不盡以告後人恐為癬藥所誤濕淫于血不可不砭者矣薛立齋治一人生風癜似癬三年不愈五心頻熱脈洪按之則澀此血虛之症也當以生血為主風藥佐之若専攻風毒則血愈虛而熱愈熾血被煎熬則發瘰癧或為怯症遂以逍遙散數劑及人參荆芥散二十餘劑而愈劉禹錫傳信方云豫少年曽患癬初在頸項間後延上左耳遂成濕瘡浸淫用斑蟊狗膽挑根諸藥徒令蜇蠚其瘡轉盛偶于楚州賣藥人教用蘆薈一兩研甘草炙半兩相和令勻先以溫漿水洗癬乃用舊乾帛子拭乾便以二味合和傅立乾差神效本草立齋治一男子面青腿內臁患癬類色赤作癢或為砭刺出血發熱焮痛服消風散而益甚服遇仙丹愈加發熱作渴仍服之膿水淋漓其脈洪數左關為甚此肝經血虛火內動復傷其血而瘡甚先用柴胡清肝散數劑又用四物山梔治之諸症漸退用八珍湯地黃丸兩月餘而痊張子和治一童子病滿胸腹濕癬每爬搔則黃水出已年餘先以末作丸上涌次以舟車丸濬川散下三五行次服涼膈加朴硝少許時時呷之不數日而愈疙瘩翟立之素善飲遍身疙瘩搔起白屑上體為甚面目焮腫成瘡結痂承漿潰膿眼赤出淚左關脈洪數有力或作癘風治之膿潰淋漓此肝火濕毒以四物湯加乾薑連翹山梔柴胡一劑諸症悉退四劑全退兩睛各顯青白翳一片亦屬肝火再劑翳去乃用六味丸而愈一儒者身發疙瘩時起赤暈憎寒發熱服癘風之藥眉落筋攣後疙瘩漸潰日晡熱甚肝脈強洪餘脈數而無力此肝經血虛風熱也先以小柴胡合四物湯加丹皮酒炒黑知柏肝脈漸和晡熱漸退又用八珍湯加丹皮酒炒黑知再與加味逍遙散加參术鉤藤服兩月瘡悉愈而眉漸生後因怒復作用小柴胡湯加芎歸鉤藤木賊而愈後勞役發熱誤用寒劑不時身癢日晡赤暈早與補中益氣湯加五味麥冬山藥午後與加減八味丸尋愈後食燒炙等物仍發疙瘩小便白濁後關脈滑大有力用補中益氣湯加山巵諸症悉退一男子秋間發疙瘩兩月餘漸髙有赤暈月餘出黑血此風熱血虛所致先用九味羌活湯風熱將愈再用補中益氣湯而愈後不慎房欲復作盜汗晡熱口乾唾痰體倦懶言用補中益氣湯加減八味丸頓愈一婦人遍身疙瘩搔癢敷追毒之藥成瘡出水寒熱脅痛小便不利月經不調服祛風之劑形體消瘦飲食少思此肝火血燥生風也前藥益傷肝血先用歸脾湯二十餘劑又用加味逍遙散二十餘劑蓋諸症漸愈乃用六味地黃丸調理而瘥此等症候服風藥而死者多矣一男子不時患疙瘩搔癢成瘡膿水淋漓惡寒發熱先用羌活當歸散而癢止又用易老祛風丸而不發後飲燒酒起赤暈二便不通口舌生瘡熱渴不安用防風通聖散二便遍利但口乾體倦飲食不入用七味白术散去木香四劑而愈一男子遍身患疙瘩作癢勞而益甚用參茋歸术為君佐以柴胡炒芩桔梗川芎炙草而痊更用補中益氣之劑後不再發一男子患疙瘩癢發熱形氣虛弱口鼻氣熱且喜飲冷屬外邪也以消風散二劑外邪悉解但倦怠少食更以參茋陳皮炙草五味而健又以補中益氣湯去柴胡升麻加茯苓白芍乃痊一男子患疙瘩多在臀腳勞役則癢甚小便色黃服敗毒散芩連之劑患處癢痛夜不得寐此脾氣下陷用補中益氣湯加五味麥冬少用炒黑黃柏治之而痊凡病日間如故日晡倦怠成勞愈加晨起如故皆元氣虛也宜用前藥補而治之一男子患疙瘩色黯作癢出黑血日晡至夜益甚其腿日腫夜消以為氣血虛而有熱朝用補中益氣湯夕用加味逍遙散而愈一儒者應試後遍身瘙癢後成疙瘩此勞元氣隂火內熾秋寒收斂腠理鬱熱內作補中益氣湯加茯苓川芎白芷而愈後復勞仍作惑于人言服祛風敗毒藥如大風之狀又發熱作渴倦怠懶食用補中益氣湯倍參茋歸术半夏茯苓五味麥冬而愈一婦人遍身患疙瘩發熱作癢內服敗毒袪風外搽攻毒追蝕各潰成瘡膿水津淫形氣消瘦飲食日減惡寒發熱作渴飲冷脈浮數按之則澀此元氣復傷也先用七味白术散數劑其渴漸止飲食稍加乃用八珍湯加柴胡丹皮膿水漸乾又用六君芎歸丹皮山梔瘡漸收斂仍用八珍山梔丹皮而愈一婦人因怒寒熱發赤暈服袪風之劑發疙瘩或砭出血患處焮腫發熱頭痛內服外敷俱係風藥膿水淋漓服花蛇酒之類前症益甚更加晡熱煩渴不寐脈洪大按之如無此血脫煩燥先用補血當歸湯稍緩用四君當歸數劑得睡但倦怠頭暈少食用補中益氣湯加蔓荆子稍可又用八珍湯加用芎芍倍用參术三十餘劑而能步履又復月餘而痊一婦人性急善怒月經不調內熱口苦患疙瘩作癢服敗毒之藥膿水淋漓熱渴頭眩日晡益甚用加味逍遙散漸愈後因大怒月經如涌眼出淚用四物湯加山梔柴胡連芩數劑而愈年餘左足臂腕起白點漸大搔起白屑內熱盜汗月經兩月餘一至每怒或惡寒頭痛或不食作嘔或胸乳作脹或腹內作痛或小便見血或小水不利或白帶下注此皆肝木制伏脾土元氣虛而變症也用補中益氣湯加炒黑山梔及加味歸脾湯服半年而愈後每怒惱患赤暈或以風疾治之發疙瘩又服遇仙丹赤腫作癢出膿水外敷追蝕之藥寒熱作渴又服胡麻草烏之藥遍身瘙癢眉毛脫落膿水淋漓咳嗽發熱月經兩月一行用四君當歸丹皮月餘熱渴稍止飲食少進又服月餘咳嗽少可却用八珍湯加丹皮二十餘劑患處漸乾經水如期後因傷食作瀉不食用六君子湯飲食漸進又因怒發熱作渴患處作痛經行不止用加味逍遙散漸可仍用四君子湯而痊愈一女子二十嵗月經先期或過期或怒則身發赤暈或患疙瘩六七日方退服袪風藥瘙癢作渴撥破成瘡膿水浸淫曰此肝火生風再服是藥必致筋攣不悟後兩手固攣始信先用地黃丸四物湯月餘熱渴頓減乃佐以加味逍遙散又月餘患處膿少又用四君山梔丹皮二十餘劑指能伸屈因怒發熱經水不止睡中筋脈抽動不安以加味逍遙散加鉤藤治之而痊仍用四物山梔鉤藤丹皮而瘡結靨乃去鉤藤調理元氣復而瘡靨乾一女子常患癮疹作癢因怒發熱變為疙瘩痛甚用梔子清肝散治之而愈後又觸怒痕起赤暈逰走不定自砭出紫血甚癢徹骨其熱如炙如大麻風欲用風藥治之曰然乃以當歸補血湯四劑其熱悉止又用聖愈湯加味逍遙散而痊一婦人身發疙瘩或如丹毒癢痛不常搔碎成瘡膿水淋漓發熱煩渴頭目眩暈日晡益甚此血虛內熱之症以當歸飲加柴胡山梔治之愈一婦人患前症肢體疼痛頭目不清自汗盜汗月水不調肚腹作痛食少倦怠先用人參荆芥散後用逍遙散治之而痊一婦人因忿怒身發疙瘩憎寒發熱此肝火用小柴胡湯加山梔黃連治之而愈後口苦脅痛小便淋漓復用前藥遂全愈一婦人患前症發熱夜間譫語此血分有熱以小柴胡湯加生地治之而安後用四物湯加柴胡山梔丹皮而熱退又用逍遙散全愈一女子常患疙瘩時或作癢服消風之類搔破成瘡其癢不止延及頭面先用羌活當歸散其癢頓止用加味逍遙散其熱頓痊又用當歸飲而瘡亦愈用八珍柴胡山梔而不再作血風癮疹薛立齋治一男子面赤作渴面常患小瘡作癢服袪風藥遍身發赤㿔服花蛇酒更發赤暈遍行砭刺又服消風散發熱口渴飲水不止謂肝經血虛而風熱也用梔子清肝散及地黃丸料煎服熱渴漸止瘡漸結靨用八珍湯地黃丸瘡靨漸脫又服月餘瘡漸愈一男子面生粉刺或生小㿔服消風散瘡益甚服遇仙丹加遍身赤癢仍服前藥發熱焮腫又服旬餘潰而出水形體骨立先用四君子當歸桔梗四劑飲食稍進又用八珍湯數劑而痊一男子嗜膏粱炙煿醇酒辛辣之物遍身生㾦㿔甚癢服消風散之類更起赤暈又砭出血其癢益甚敷敗毒之劑遂各成瘡膿水津淫眉毛漸脫赤癢益甚此脾經積熱傷血所致先用犀角地黃湯諸症稍退乃用濟生犀角地黃湯加黃連治之膿水漸止乃以八珍湯加山梔丹皮眉毛漸生因飲食失宜胸腹作脹飲食少思或大便下血用五味異攻散加升麻飲食漸進又用補中益氣湯而血止仍用異攻散加當歸丹皮而痊一女子性急多怒月經先期患㾦㿔色赤作癢搔破膿水不止服袪風藥其瘡益甚服花蛇酒四肢瘛瘲眉毛脫落先用柴胡清肝散加鉤藤數劑又用加味逍遙散加鉤藤諸症漸愈又用易老袪風丸而安一女子年十四腕軟處生物如黃豆大半在肉中紅紫色痛甚諸藥不效一方士以水銀四兩白紙二張揉熟蘸銀擦之三日自落而愈李摟怪症朱丹溪治朱院君三十餘久患癮疹身痺而紫色可與防風通聖散加牛蒡為極細末每二錢水盞半入薑汁令辣煎食前熱飲之汪石山治一人年逾六十形瘦蒼紫夜常身癢搔之熱蒸皮肉磊如豆粒癢止熱散肉磊亦消醫用烏藥順氣升麻和氣等不效診之脈皆細濡近駛曰此血虛血熱也而為順氣和血所謂誅罰無辜治非所宜遂以生地元參白蒺藜歸芎茋芍黃芩甘草陳皮煎服月餘而愈一老人患疹色微赤作癢發熱以人參敗毒散二劑少愈以補中益氣湯加黃芩山梔而愈一婦人遍身搔癢秋冬則劇脈浮數此風邪客于皮膚而然也名曰血風疹飲以消風散及搽蛇牀子散少可更以四物湯加荆防數劑而愈一婦患此夏月尤甚脈洪大以何首烏散一婦患赤斑瘙癢搔破成瘡出水久而不愈內服當歸飲外搽蛇牀子散並愈又一婦患此諸藥不應以四生散數服而愈大抵婦人體虛風邪客于皮膚則成白疹寒濕客于肌肉鬱熱而為赤疹色雖有異治法頗同凡人汗出不可露卧及浴經云汗出見濕乃生痤痱雷公云遍身風疹皆由汗身受風也瘙癢薛立齋治一男子遍身瘙癢後成瘡出水灑淅惡寒皮膚皴起眉毛漸落大便祕結小便赤少此屬肺火為患用補氣瀉榮湯四劑諸症漸退但倦怠惡寒小便清少此邪氣去而真氣虛用補中益氣湯兼換肌散半載元氣復而諸症退時仲秋忽大便不實小便頻數體倦食少灑淅體重此濕邪乘虛而作用東垣益胃湯二劑頓安仍用前藥調理三月餘全愈一男子兩目俱赤遍身癢痛搔起白皮此肝肺隂虛誤服袪風燥劑鼻赤面紫身發疙瘩搔出血水用升麻湯下瀉青丸數服又用加味逍遙散數劑身鼻漸白疙瘩漸消又用四物湯加參茋柴胡山梔并換肌散各百餘服喜其年少謹疾全愈一婦人日晡身癢內外用追毒袪風之劑膿水淋漓午前畏寒午後發熱殊類癘風用補中益氣湯加山梔鉤藤又以加味逍遙散加川芎而愈一婦人手心赤瘙癢發熱頭暈作渴晡甚服袪風清熱之藥膚見赤痕月經過期用加味逍遙散倍熟地熱止癢退更以四物湯加柴胡參茋炙草茯苓頭清渴止再用四物湯加參术茯苓山梔赤暈亦消一男子患瘙癢破而成瘡如大麻風服遇仙丹發熱作渴大便祕結脈沉實右關為甚此熱畜于內也先用黃連內疏湯而大便通利又用防風通聖散去硝黃而熱渴止却用八珍湯而瘡愈一男子脾腎氣血虛熱後遍搔癢時喜熱水浴之後患瘡㿔破而出水用風藥益甚或赤或白眼作花癢先用胡麻散六味丸而痊次年兩股小腹頸項復作癢用四生散六味丸而愈一婦人經水先期勞役或氣惱則寒熱瘙癢服袪風降火等藥不勞怒而自癢發熱更加痰喘氣促服化痰清氣之藥形氣倦怠食少胸痞身發瘡疥服消毒之類膿水淋漓服大麻風藥口乾作渴欲水而不敢飲經水又過期眉間若動又復月餘眉毛脫落經水淋漓此心肝二經風熱相搏制金不能平木木剋脾土而不能統血肝火旺而不能藏血也經云水生木遂朝用地黃丸以滋腎水生肝血夕用加味逍遙散以清肝火生肝血月餘諸症漸愈又佐以四君芎歸丹皮月餘經水旬日而止又兩月餘經水五十餘日而至乃夕用五味異攻散加當歸服兩月經水四十餘日而至因怒寒熱經水如崩眉稜角動脈洪數弦肝脾二脈為甚用柴胡梔子散二劑以平肝火用五味異攻散二劑以補脾氣發熱頓退經水頓止更以八珍湯倍加參术及地黃丸兩月餘經水如期眉毛漸生因飲食停滯腹脹作痛另服祛逐劑泄瀉不止小便重墜飲食甚少先用六君子湯送四神丸數劑瀉漸止飲食少進又用補中益氣湯倍用升麻數劑重墜漸愈後因勞心發熱飲食難化嘔吐涎水其熱自臍上起覺飢熱頻作乃用六君子湯加炮薑治之熱時飲稠米湯稍安兩月餘又常服加味歸脾補中益氣二湯而痊一婦人秋間肢體作癢時發寒熱日晡熱甚口苦喜酸月水先期面色常青熱甚則赤恪服清熱涼血後發疙瘩赤癢益甚乃清熱敗毒破而膿水淋漓謂此肝脾血燥虛不信仍治瘡毒其瘡益甚形氣倦怠飲食減少先用補中益氣湯間佐以六君當歸元氣稍復乃以八珍湯倍用參术少用川芎白芍間佐以補中益氣湯諸症漸愈又以四君子湯佐以加味逍遙散兩月餘膿水漸少又復月餘瘡漸結靨因怒寒熱腹脹飲食少思患處復甚用六君子湯加山梔柴胡乃用四君子湯為主而瘡漸愈又因怒月經甚多發熱作渴瘡痛出血用柴胡清肝散熱退痛止仍用四君子湯而結靨又用八珍山巵丹皮而愈一婦人遍身瘙癢膿水淋漓發熱身如蟲行月經不調先用升麻湯送瀉一丸熱癢頓退又用加味逍遙散經行如期用換肌丸而瘡愈後因怒經行不止筋骨作痛用秦艽地黃湯易老袪風丸而愈一婦人性沉靜懷抱不樂月經過期遍身作癢服袪風清火之劑搔破成瘡出水不止其癢益甚或用消風散之類眉稜跳動眉毛折落又服遇仙丹患處俱潰咳嗽發熱飲食日少月經先期作肝脾鬱怒而血燥前藥復傷而益甚先用四君子芎歸山梔丹皮飲食漸進服月餘而嗽止又以加味逍遙散加鉤藤二十餘劑而眉不動乃去鉤藤倍加參术當歸月餘瘡結靨又以八珍湯加山梔丹皮而痊一婦人患前症膿水淋漓發熱作渴體倦惡寒經水不利久而不愈此肝脾虧損而虛熱也先用補中益氣湯加山梔川芎而元氣漸復又用逍遙散而瘡漸愈又虛後患疥遍身作癢搔起疙瘩破而出膿或出血水誤服醉仙散殊類風症用八珍湯數劑而安又用十全大補湯患處漸乾矣一婦人日晡身癢素清苦因于鬱怒遍身晡熱內熱自汗盜汗月經不行口乾咽燥用歸脾湯數劑諸症稍退後兼加味逍遙五十餘劑而痊一婦人瘙癢發熱日晡益甚皮膚赤暈月經過期此血虛而有熱也以逍遙散倍加熟地熱止癢退更以四物加柴胡參茋炙草茯苓調理而愈一婦人懷抱久鬱患前症膿水淋漓服連翹消毒散食少胸痞服清氣化痰丸作嘔吐痰服清熱化痰丸煩熱畏寒四肢焮熱面目赤色脈大而無力此脾胃虧損而虛寒隔陽氣于外遂用六君子湯加炮薑治之諸症少愈飲食頓進又佐以四物湯諸症漸愈又以四君子每味各一錢四物湯每味各五分諸症全愈一婦人每秋間兩手心作癢搔起白屑因勞役惱怒則發寒熱通身作癢起疙瘩或以為風症內服花蛇等藥外敷硫黃之類又服遇仙丹熱渴益甚月水不通謂脾肝二經血燥生風先用加味逍遙散熱渴漸減又用八珍柴胡山梔患處少可後因怒氣發熱脅痛患處焮腫用加味逍遙散四劑而安又用四君芎歸山梔丹皮至半載而痊一男子遍身瘙癢諸藥不效脈浮按之而澀以生血藥為主間以益氣百貼而愈宋生遍身作癢搔破成瘡出水脈浮數此手足陽明經風熱所致以人參敗毒散對四物湯加芩連服之外以松香一兩枯礬五錢輕粉三錢為末麻油調敷月餘而愈又一人患此但脈沉實以前藥加大黃治之漸愈再服人參敗毒散而平續名醫類案卷五十七
