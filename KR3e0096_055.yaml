body:
  text: 續名醫類案卷五十五錢塘魏之琇撰時毒此症感四時邪毒之氣其候發於鼻面耳項咽喉赤腫無頭或結核有根寒熱頭痛狀如傷寒少宰李蒲汀患時毒用發散之藥耗損元氣患處不消體倦惡寒食少口乾用益氣湯加桔梗及托裏消毒散而愈秋官陳同野患時毒元氣素弱脉微細而伏此形病俱虛也用參术芎歸陳皮柴胡升麻炙草以升舉陽氣用牛蒡元參連翹桔梗以解熱毒二劑腫頓消而脉亦復矣苟以脉微細為屬隂以腫赤為屬陽而藥之鮮有不誤者一婦人時毒潰後腫赤不消食少體倦膿青色白乃脾肺氣虛也先用六君加桔梗芎歸後用益氣湯加桔梗而斂春官袁谷虛之妹表散過度腫硬寸脉浮大按之而短此真氣絶也辭不治後果歿一男子患此腫痛發熱作渴脉實便祕以五利大黃湯下之諸症悉退以葛根牛蒡子湯四劑而痊一男子表裏俱解腫痛尚不退以葛根升麻湯二劑而消一男子腫痛發寒熱脉浮數以荆防敗毒散二劑少愈以人參敗毒散二劑勢減半又二劑而痊一男子耳面赤腫作痛咽乾發熱脉浮數先以荆防敗毒散二劑勢退大半又以葛根牛蒡子湯四劑而痊一婦人表邪已解腫尚不消診之脉滑而數乃瘀血欲作膿也以托裏消毒散潰之而愈一男子焮腫脹痛作渴煩熱便祕脉數按之尤實用防風通聖散一劑諸症頓退以荆防敗毒散加元參牛蒡黃芩二劑而瘥一老人冬月頭面耳項俱腫痛甚便祕脉實此表裏俱實病也飲防風通聖散不應遂砭患處出黑血仍投前藥即應又以荆防敗毒散而瘳蓋前藥不應者毒血凝聚上部經絡藥力難逹故也惡血既去其藥自效或遽用寒涼藥及年髙畏用硝黃而用托裏與夫尋常之劑或不砭泄其毒専假藥力鮮不危矣一男子表裏俱解惟腫不消以托裏消毒散四劑膿成針之而愈一婦人腫痛用硝黃之劑攻之稍緩翌日復痛診之外邪已退此瘀血欲作膿也用托裏消毒散潰之而愈一男子頭面腫痛服硝黃敗毒之劑愈甚診之脉浮數邪在表尚未解用荆防敗毒散二劑勢退大半更以葛根牛蒡子湯四劑而痊內經曰身半以上腫天之氣也身半以下腫地之氣也乃邪客心肺之間上攻頭目而為腫此感四時不正之氣為患與夫膏粱積熱之症不同硝黃之劑非大便祕實不可用若不審其因不辨其虛實表裏概用攻之必致有誤常見饑饉之際芻蕘之人多患之乃是胃氣有損邪氣從之為患不可不察常治邪在表者用葛根牛蒡子湯人參敗毒散或普濟消毒飲若邪在裏者五利大黃湯梔子仁湯表裏俱不解者防風通聖散表裏俱解而腫不退者犀角升麻湯如腫甚者砭患處出惡血以泄其毒或用通氣散取嚏以泄其毒或用通氣散取嚏以泄其毒十日外自愈若嚏出膿血即愈欲其作膿者用托裏消毒散欲其收斂者用托衰散此法最為穩當五七日咽喉腫閉言語不出頭面不腫食不知味者不治一男子服表散藥愈熾發熱便祕診其脉沉實此邪在裏也以大黃湯下之裏症悉退以葛根牛蒡子湯浮腫亦消惟赤腫尚存更以托裏藥潰之而愈齊氏云時毒者為四時邪毒之氣而感之於人也其候發于鼻面耳項咽喉赤腫無頭或結核有根令人增寒發熱頭痛或肢體痛甚者恍惚不寧咽喉閉塞昧者將謂傷寒便服解藥一二日腫氣增益方悟始求痬醫原夫疾古無方論世俗通為丹瘤病家惡言時毒切恐傳染考之于經曰人身忽經變赤狀如塗丹謂之丹毒此風熱惡毒所為與夫時毒特不同耳蓋時毒初狀如傷寒五七日間乃能殺人治者宜精辨之先診其脉滑數浮洪沉緊弦澀皆其候蓋浮數者邪氣在表也沉澀者邪氣深也氣實之人急服化毒丹以攻之熱實不利大黃湯下之其有表症者解毒升麻湯以發之或年髙氣軟者五香連翹湯主之又于鼻內㗜通氣散取十餘左右看病之人每日用㗜藥嚏之必傳染其病人每日亦用嚏藥三五次以泄熱毒此治時毒之良法也經三四日不解者不可大下猶宜和解之服犀角連翹散之類至七八日大小便不通利頭面腫起髙赤者可服托裏散黃茋散宜針鎌砭割出血泄其毒氣十日外不治自愈也此病若五日以前精神昏亂咽喉閉塞語聲不出頭不腫食不知味者必死治之無功矣然而此疾有隂有陽有可汗有可下常見粗工但云熱毒就用寒殊不知病有虛實治有逆從不可不審也徐考功年逾三十耳面焮腫寒熱拘急脉浮洪此時毒症也邪在表以荆防敗毒散加牛蒡元參治之漸愈更以升麻葛根連翹桔梗川芎銀花牛蒡而平復疔羅謙甫云丙午嵗豫居藁城人多患疔瘡縣尹董公謂豫曰今嵗患疔瘡者極多貧民無力醫治近于史侯處得數方用之者無不效官給藥錢君當捨手治之遂諾其語董公榜示通衢命豫施藥如此一年金活甚衆其用保生錠子千金托裏散神聖膏藥破棺丹凡四方保生錠金腳信二錢雄黃三錢輕粉二錢碙砂三錢麝香錢半巴豆四十九粒蟾酥一錢為細末用黃蠟五錢溶開將藥和成錠子冷水浸少時取出揑作餅子如錢眼大將瘡頭撥開每用一餅次用神聖膏後用托裏散若瘡氣入腹危者服破棺丹世傳疔瘡必有一條紅線可針紅線所至之處出毒血乃敷藥神聖膏藥當歸藁本各半兩乳香沒藥各二錢白芟琥珀各二錢半黃丹二兩白膠香三兩黃蠟二兩粉霜一錢木鱉子五十個去皮巴豆十五粒去油清油槐柳枝各百草枝膽礬一錢先將槐柳枝下在油內熬焦取出復下餘藥熬勿至焦濾出待油澄清下黃丹再熬成膏用緋帛攤之立有神效托裏散一兩五錢茋朴芎防各二兩桔芷翹各二兩二錢芍桂草參各一兩歸术香乳香沒藥各半兩細末每服三錢酒一大盞煎二三沸和查溫服破棺丹大黃二兩半生半熟甘草芒硝各一兩細未蜜丸彈子大每服半丸食後溫酒化下或童便半盞研化之忌冷水薛立齊治上林陳靜涵面患疔脉洪數有力屬邪氣藴結用清熱消毒散二劑未應或用黃茋肉桂等藥二劑反益其勢致耳目唇口俱腫閉頭面如斗由邪氣外實也前脉按之無力由元氣內虛也連進托裏消毒之藥及數砭患處出黑血碗許已而膿與腐肉併潰而出復用托裏之藥瘡勢漸愈七日後復因調護失宜以致煩渴不食兩尺脉如絲欲絶急用八味丸料煎服其脉頓復手足自溫使非砭以泄其外托裏散以補其內八味丸以回其陽則治之失宜必致不救慎之慎之長洲庠蘇子忠鼻梁患之症屬表邪但氣血俱虛不勝發散遂用補中益氣為主佐以防風白芷而愈張所望治理安寺一僧患水疔走黃絶水榖者已三日衆莫能治延所望入視曰毒已八內奈何須下一針方可因向瘡頂刺入寸餘始聞痛聲曰生矣隨以膏塗之復投丹藥數粒拔其疔根寸許堅黑如鐵遂愈錢塘縣志立齊治一男子足患疔作癢惡心嘔吐時發昏亂脉浮數明灸二十餘壯始痛以奪命丹一服腫起更以荆防敗毒散而愈一男子患疔發熱煩躁脉實以清凉飲下之而愈一男子胸患疔遍身麻木脉數而實急針出惡血更明灸數壯始痛服防風通聖散得利而愈一男子左手背患之是日一臂麻木次日半體皆然神思昏憒遂明灸至二十餘壯尚不知痛又三十餘壯始不麻至百壯始痛以奪命丹一服腫始起更用神異膏及荆防敗毒散而愈一老婦足大指患之甚痛令灸之彼不從専服敗毒藥致真氣虛而邪氣愈實竟至不救蓋敗毒散雖能表散瘡毒然而感有表裏所發有輕重體假有上下所禀有虛實豈可一概而用之耶且至隂之下藥力所難到専假藥力則緩不及事不若灸之為良故下部患瘡皆宜隔蒜灸之痛則灸至不痛不痛則灸至痛若灸之而不痛者宜明灸之及針疔四畔去惡血以奪命丹一粒入瘡頭孔內仍以膏藥貼之若針之不痛或無血者以針燒赤頻烙患處以痛為度或不痛眼黑如見火光者此毒氣入臟腑也不治若患在手足紅絲攻心腹者就于絲盡處刺去惡血宜服荆防敗毒散若絲近心腹者宜挑破瘡頭去惡水亦以膏藥貼之如麻木者服奪命丹如牙關緊急或喉內患者並宜噙一二丸凡人暴死多是疔毒用燈照看遍身若有小瘡即是宜急灸之俟醒更服敗毒藥或奪命丹人汗入肉食之則生疔瘡不可不慎劉禹錫纂栁州救三死方云元和十一年得疔瘡凡十四日益篤善藥傅之皆莫知長樂賈方伯教用蜣蜋肉一夕而百苦皆已明年正月食羊肉又大作再用亦如神效其法一味貼瘡半日許可再易血盡根出遂愈蜣蜋心腹下度取之其肉稍白是也所以云食羊肉又大作者蓋蜣蜋食羊肉故耳用時便禁食羊肉其法蓋出葛洪肘後方也本草韓光治疔極神效正觀初衛州徐使君訪得此方用艾蒿一擔燒作灰于竹筒中淋取汁一二合和石灰如麵漿以針刺瘡中至痛即㸃之㸃三遍其疔自拔亦大神驗正觀中用治三十餘人得差故録之千金方繆仲淳治顧博士伯欽內人左耳患疔時方孕令先以白藥子末雞子清調塗腹上護胎次以夏枯草甘菊貝母忍冬地丁之屬大劑飲之一服痛止疔立拔胎亦無恙白藥子療馬病者也廣筆記馬銘鞠治顧聖符幼弟患髭疔醫者先用火針圍藥腫脹至目與鼻俱隱入肉牙關緊急用患者耳垢齒垢刮手足指甲屑和勻如豆大放茶匙內燈火上炙少許取作丸令洗净圍藥將銀簮挑開疔頭抹入外用綿紙一層津濕覆之痛立止半日腫半消目可開次日服仙方活命飲二劑愈此法兼可治紅絲疔長洲華承溪指節間患之得此而痊又云可治面白疔未試也此方𫝊自道人廣筆記廣筆記云用陳年露天鐡鏽碾如飛麵將金簮腳挑破毒處一孔納鐡鏽末于內仍將皮蓋好少頃黑水流盡中有白絲如細線慢慢抽盡此疔根也盡即立愈又方用甘菊花并根葉搗汁以酒下之立消立齊治劉貫卿腳面生疔形雖如粟其毒甚大宜峻利之藥攻之因其怯弱以隔蒜灸五十餘壯癢遂止再灸片時乃知痛更用膏藥封貼再以人參敗毒散一服漸愈夫至隂之下道逺位僻且怯弱之人用峻利之藥則藥力未到胃氣先傷虛脫之禍有所不免不如灸之為宜松江諸大尹唇生一疔已五日腫硬脉數煩躁喜冷此胃經積熱所致先以凉膈散一服熱去五六更與奪命丹二粒腫退二三再與荆防敗毒散四劑而愈楊錦衣唇下生疔脉症俱實而不下反用托裏致口鼻流膿而死是謂實實之禍馬氏室忽惡寒作嘔肩臂麻木手心搔癢遂瞀悶不自知其故與卒然暴者不同但手有一泡此乃患疔毒也令急灸患處至五十餘壯知痛投以荆防敗毒散而愈古人謂暴死多是疔毒急用燈照遍身若有小瘡即是此毒宜急灸其瘡但是胸腹溫者可炙先君云有人因剝死牛瞀悶令看遍身俱有紫泡便急灸泡處良久遂蘇更以敗毒藥而愈張都憲夫人面生疔腫焮痛甚數日不潰脉症俱實以荆防敗毒散加芩連治之稍愈彼以為緩乃服托裏一劑其勢愈甚痛極始悟再用凉膈散二劑痛減腫潰又與連翹消毒散十餘劑而愈鄭氏舉家生疔多在四肢由皆食死牛肉所致刺去黑血更以紫金丹服之悉愈王檢討汝和感痘毒面生疔十餘枚腫痛脉數以荆防敗毒散治之雖小愈尚可畏更以奪命丹一服而痊陸宣子山東名醫也言京師李公子某指甲中生肉管赤色頃刻長三尺餘垂至地能動動則血眯欲死諸醫束手公子乃取酒痛飲引刀自斷之出血數斗良久復生如初自分死矣有乞兒自言能治召之肩火蛇至顧罵諸醫者曰公子蛇頭疔也其管通四肢百骸絶則又出若輩何能為蓋乞兒初饒于財嘗患此破家求醫不可得遇一丐命其妻納大蛇袴中穴袴出蛇首握之與肉管相向蛇以氣吸之不移時而消蛇則紅絲百道僵死矣乃如其法治之公子亦愈竟分其産之半與乞兒云蔣湘帆疣附癭周漢卿治山隂楊翁項有疣如瓜大醉仆階下潰血不能止疣潰者必死漢卿以藥糝其穴血即止明史薛立齊治長洲庠王夫爵辛丑春左腿近環跳穴患瘤狀如大桃按之濡軟恪服除濕流氣化痰之劑惡寒發熱食少體倦形氣俱虛脉洪大而虛氣瘤也肺主之蓋肝屬木肺屬金然發于膽經部分乃肺金侮肝木元氣虧損而其膿已內潰矣遂用十全大補湯數劑出青白稀膿甚多頓加寒熱煩渴頭痛殊類傷寒狀此因膿泄而血氣益虛耳仍用前湯其勢益甚脉洪數大按之如無乃加附子一錢其勢愈甚而脉復如前此虛甚而藥不能及也更加附子二錢三劑諸症頓退乃朝用補中益氣湯夕用十全大補湯各三十餘劑出腐骨五塊瘡口將完後因不慎起居患處復潰諸症更發咽間如焚口舌無皮用十全大補加附子一錢服之諸症即愈二日不服內病悉至患處復潰二年後又患服前藥不應診其尺脉微細如絲此屬命門火衰用八味丸為主佐以十全大補湯稍愈至乙巳仍患虛寒之症而歿一男子左腿外側近臀腫一塊上有赤縷三年矣飲食起居如常觸破涌出血膿發熱惡寒此膽經受症故發于腿外側診其脉左尺洪數左關弦洪此腎水能生肝木用補中益氣湯六味地黃丸而痊一老嫗右腋下生一瘤漸長至尺許其狀如長瓠子久而潰爛一方士以長柄鮮葫蘆燒存性研末搽之水出消盡而愈繫瘤法芫花净洗帶溫不得犯鐡器於木石器中搗取汁用線一條浸半日或一宿以線繫瘤經宿即落如未落再換線不過兩次自落後以龍骨并訶子末敷瘡口即合依上法繫妳痔纍用得效繫瘤法蘇耽良方有用蜘蛛絲者然費力不如此徑捷如無根只用花泡濃水浸線亦得趙氏家姊嘗用繫腰間一瘤不半日即落亦不痛百乙方琇按芫花用之繫疣即落雄猛可知蟲門中孫文垣嘗用三分以治某氏婦立下其癥苟非實積未可輕試孫真人治癭一二年者以萬州黃藥子半斤須緊實者若虛而輕即他處産者用一斤取無灰酒一斗浸固浸器口以糖火燒一伏時停待酒冷卻開令患者日飲之不令酒氣絶經三五日後以線圍頸覺消即停飲否則令項細也用火時不可多惟燒酒氣出瓶頭有津即止火不待經宿也已驗如神忌毒食黃履素曰豫年三十時臀生一小瘤根細如線而頭如豆大越十年漸大如荔有妨跨馬豫有鍳于决瘤之說不敢醫常歎曰吾年若六七十此瘤當如碗大必妨行坐矣奈何既而歎曰六七十即礙行坐亦何妨遂安意養之及四十七嵗時偶擦傷瘤皮水滲出不止懼其成漏乃延潘惠峯問之云欲去此瘤甚易欲塞此漏甚難瘤去則漏自止矣不得已聽其治潘以藥塗瘤甚痛其肉盡黑少頃血出津津豫甚懼且悔不復求治但求止血之藥越宿則黑肉已堅如石片數日脫去其根尚存如豆水出仍不止復商之潘潘曰不去其根漏仍不可塞也又以前藥㸃之痛甚肉黑如初次日復㸃凡三次內服托裏散每劑用黃蓍五錢凡旬日堅肉脫去則根已平仍服托裏散外用長肌收口藥絶欲息勞以漸收滿肌肉完好豫之服藥守禁固勤且慎者而潘君亦可謂妙手矣張子和在西華衆人皆訕以為吐㵼一日魏夀之與張入食肆中見一夫病一瘤正當目之上􅀈內眥色如灰李下垂覆目之睛不能視物乃謂夀之曰吾不待食熟立取此瘤魏未之信也語其人其人曰人皆不敢割曰吾非用刀割别有一術焉其人從之乃引入一小室中令俯卧一牀以繩束其胻刺乳中大出血先令以手揉其目瘤上亦刺出雀糞立平夀之大驚張曰人之有技可盡窺乎一女子未嫁年十八兩手背皆有瘤一類雞距一類角丸腕不能伸向明望之如桃膠然夫家欲棄之張見之曰在手背為膠瘤在面者為粉瘤此膠瘤也以䤵針十字刺破按出黃膠三兩匙立平更不再作非素明者不敢用此法一婦人年四十餘有癭三辨張令以鹹吐之三涌三汗三下癭已半消次服化癭之藥遂大消去夫病在上皆宜吐亦自有消息之法耳張景嶽三旬外忽臀下肛門前骨際皮裏生一小粒初如菉豆許不以為意及半年大如黃豆又一年如棗核復如栗矣乘馬坐榻皆有所礙且漸痛料此非敷藥可散又非煎藥可及若漸長大如升如斗懸挂腰股間行動不便將奈何謀之識者皆云不可割刺恐為害初亦未敢然熟思此時尚小不取則日久愈大愈難矣遂决意去之乃飲酒乘醉以柳葉針刺之所出如豆腐白皮之類蓋粉瘤也刺後頓消兩日後則腫如熟癰以㑹通膏貼三日膿潰而愈不兩日又腫起更熱更大始悔其刺之誤再以㑹通膏貼之又三日而大潰潰出一囊如魚脬者然後收口全愈使開之再遲則難瘳矣一人眼皮下弦生一小瘤初如米粒漸大如豆外科用攢針三四枚翻轉眼皮刺其內膜少少出血如此二三次其瘤日縮竟得盡消一人臂上生一瘤漸大如龍眼其人用小艾於瘤上炙七壯竟爾漸消亦善法也或用膈蒜炙之亦無不可一人腹上生一瘤大如胡桃治者以蛛絲撚成粗線扎其根數日其絲漸緊瘤根漸細屢易屢細不十日竟脫落誠竒法也可見他線日鬆唯蛛絲日緊物理之妙有當知者如此然纒之亦宜早若形勢既大恐不宜也方出焦氏筆乘舊案已裁其略沈樞文幼嚙指甲及長不能自禁此肝火血燥也又頸側常生小疣子屢散屢發又臂生一塊如菉豆大若觸碎則如斷束縷扯之則長縱之則縮後兩鬢發白㸃求治曰子素肝病此部亦屬肝膽經也夫爪為筋之餘但行人身之側正與嚙爪生㾋等症相應須滋補腎水以生肝膽則諸病自愈與六味地黃丸服之二年白㸃自退疣亦不生一男子小腹中一塊不時攻痛或用行氣化痰等藥不應猶以為血鱉服行氣逐血之劑後手背結一㾋子漸長寸許形如鱉狀肢體間如豆大者甚多彼疑鱉生子今發于外亦用行血虛症悉至左尺洪數關脉洪數而弦謂腎水不能生肝木以致肝火血燥而筋攣用六味丸滋水生肝三月而愈陶氏佃民有病癭者嘗與陶僕輸穀如市道逺勞極癭攖其頸氣幾不接陶僕素愚匆遽間削竹為鋭銛刺之癭穿氣溢頸復完固荷擔而起一無所苦說頥余兄竒峯生兩瘤大如拳僧傳一方用竹刺將瘤頂上稍稍撥開油皮勿令見血細研銅緑少許放于撥開處以膏藥貼之數日即潰出粉而愈續金陵瑣事錢國賔治山西神池張百長姪女年十七自八嵗左手背生瘤日大已如鍾許看係粉瘤可治與一方用巴豆天麻子肉各四兩大杏仁一兩香油一斤二兩血丹八兩熬膏藥貼之一日一換其皮漸薄旬日皮紅半月皮破出膿碗許瘤消口平說之右衛酬謝辛酉夏廣陵各鹽場天行時疫人多濕熱病若傷寒頭疼發熱不惡寒身體痛舌紅昏睡不食思凉飲肌黃大便結小便紅醫用發散清凉劑罔效錢亦臨症治復不投病勢數日如故前後胸背漸長數十瘤如核桃大其皮甚薄以針挑破每瘤出虱數千遍􅎲四處人人寒禁莫敢近視瘤破虱出調服後人倣此俱愈氣頸之症乃人項下墜如長瘤也山東多有此症雖風水所致亦卧熱炕過食辛辣而然他方間有此根由足厥隂肝經之脉循喉嚨之後上入頑顙屬肝統于足陽明胃經此蓋起于肝胃二經瘤長挂下雖非致命大不美觀古今並無治法錢訪海上仙方遇異人傳授用青皮六錢疏肝桔梗六錢引導木饅頭一名鬼饅頭煆存性二兩消癭散肝胃二經結氣共末酒下一錢凡氣頸小者三四月消大者七八月或一年消其功雖緩其方百發百中即錢已治蘭溪王元直衮州趙瑚璉二人矣不惜良方普利後世㑹稽黃元亮文士也年五旬頸生氣瘤候其六脉衝旺榮衛俱足精神元氣亦厚止肝部沉滯氣結成瘤錢告之曰公無病人也氣瘤結于頸下不過不美觀耳終無大害書云凡粉瘤痰瘤蟲瘤石瘤腿瘤虱瘤發疽瘤可治凡氣瘤筋瘤肉瘤肩瘤癭瘤血瘤肋瘤乳瘤肘臂瘤不可治治之破膜泄氣不救宜絶此念勿信庸愚以輕性命也黃拜謝而去結核薛立齊治一婦人經事不調肢體結核如榛如豆不計其數隱於肉裏其色不變三年餘矣大按則痛或投以降火消毒乃不按自痛發熱作渴日晡益甚經水過期左關脉數此肝火血燥也用清肝益榮湯六十餘劑諸症已愈惟項核未消又以當歸龍薈丸數服及八珍湯加柴胡山梔三十餘劑而痊一婦人久鬱怒胸脅內股外膁各結核寒熱往來經候不調胸膈不利飲食少思大便不調左關弦洪右寸弦數右關弦緊曰左關弦洪肝經熱也左寸弦數木生火也右關弦緊肝尅脾也右寸弦浮木侮金也法當生肝血遂用加味四物湯而諸症退用加味逍遙散而經候調用加味歸脾湯而全愈一婦人因怒肢體結核睡中發搐左關弦洪此肝火血燥筋攣當清肝火養元氣遂用加味小柴胡湯加味逍遙散漸愈又用八珍湯加丹皮柴胡山梔鈎藤而愈一婦人肢體結核胸腹痞悶氣泄稍寬此肝脾鬱滯不信服降火行氣化痰病愈甚而氣愈虛用加味逍遙加味歸脾二藥間服半載而痊一婦人項間結核不時寒熱左目緊小頭項振掉四肢抽搐此肝火血虛風熱也用加味逍遙加鈎藤數劑諸症漸愈又用八珍湯調理而痊一婦人耳內耳後項側結核作痛寒熱口苦月經不調此肝膽經火而傷脾胃也用四君柴胡丹皮及六味丸而愈一婦人因怒桔核經行不止發熱晝安靜而夜譫語此血分有熱也用小柴胡加生地頓安其核尚在經後先期肝脉弦數此肝火血涸而筋攣也用加味逍遙加生地月經如期而核消一婦人項臂結核頭痛寒熱乳內時疼兩脅焮痛此肝脾鬱火而血燥先以加味逍遙散再用加味歸脾湯而愈一婦人素鬱怒患結核內熱晡熱久而不愈若面色痿黃則月經過期而少若面色赤則月經先期而多曰面黃過期脾經虛弱也面赤先期脾虛火動也朝用補中益氣升舉脾土以益氣血夕用加味逍遙滋養肝血以息隂火復以歸脾湯解鬱結半載元氣復而痊又有患前症因脾虛下陷而發熱乃専治其瘡變瘵而歿一女子耳下結核焮痛寒熱此屬肝經風熱用梔子清肝散一劑諸症悉愈後因怒耳後并額兩角作痛寒熱此兼少陽經症仍以前藥加羌活二劑而瘥一婦人項患五核時常寒熱肝肺弦長而出寸口此血盛無耦之症也用小柴胡湯加生地烏梅治之而愈施二守項右患一核用涼藥貼頸皆腫又敷之腫連胸脅冷應腹內不悟凉藥所致尚以為毒盛形體困􅉵自分不起見其敷藥處熱氣如霧急令去藥良久瘡色變赤刺出膿血用托裏藥而愈舉人江節夫兩耳下兩臂兩肋結核恪服祛痰降火軟堅之劑益甚薛曰此膽經血虛火燥也蓋膽經行人身之側前藥必致虧損至明年七月復請視各核皆潰脉浮大而澀時金旺于秋木受金刻必不治果卒周上舍兩耳下項間筋牽壅腫堅硬咳嗽氣喘內熱盜汗所服皆化痰散堅行氣之劑勢益甚診之左關弦澀左尺洪數此怒氣傷肝房勞損腎須滋腎水生肝血慎調攝至水旺之際庶可愈矣彼欲速效乃外敷商陸石灰等藥內服海藻蓬术之類至秋金旺之際元氣愈虛腫甚而歿一上舍性豪善怒耳下結一核忽潰而瘡口翻張如菌焮連頭痛或胸脅作脹或內熱寒熱或用清熱消毒之藥年餘未瘥用補中益氣湯六味地黃丸而尋愈瘡口翻出亦名翻花瘡邵黃門子手合骨處患一核半年後潰一小孔如粟又年餘不合日出清膿數滴或止三四滴面上赤脉數口乾夜則發熱晝則惡寒行履如故此氣血俱虛也辭不治月餘後他處相㑹彼云小兒有不藥之功矣薛曰過火令方為善也已而果斃繆仲淳治一女子頦下發一硬塊而不痛有以石癭用貝母首烏各三錢連翹白芨花粉各二錢牛蒡蒼耳青木香各錢半銀花鮮菊地丁各五錢先用夏枮草五兩河水五碗煎三碗去查納前藥煎至一碗服十劑全消廣筆記薛立齊治一男子神勞多怒頸腫一塊久而不消諸藥不應以八珍湯加柴胡香附每日更隔蒜炙數壯及日飲逺志酒二三盞而漸消續名醫類案卷五十五
