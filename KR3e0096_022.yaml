body:
  text: 續名醫類案卷二十二錢塘魏之琇撰頭有人三代不壽問彭祖祖觀其寢處果有一穴當其腦户令塞之遂得壽蓋隙風入耳吹腦則陽氣散頭者諸陽所聚以主生也延夀書竇材治一人起居如常但時發頭痛此宿食在胃腕也服丁香丸十粒而愈陽明食積頭痛張子和治南鄉陳君將赴秋試頭頂遍腫連一目狀若半壺其脉洪大張出視內經面腫者風此風乘陽明經也陽明氣血俱多風腫宜汗乃與通聖散入生薑葱根豆豉同煎一大盞服之微汗次日以草莖塞鼻中大出血立消陽明風熱頭痛王定國病風頭痛至都梁求明醫楊介治之連進三丸即時病失懇求其方則用香白芷一味洗晒為末煉蜜丸彈子大每嚼一丸以茶清或荆芥湯化下遂名都梁丸其藥治頭風眩暈女人胎前産後傷風頭痛血風頭痛皆效百一選方陽明風熱不按此方惟陽明風熱宜之餘可服張大復曰偏頭風之苦病者莫能自言方亦多岐而罕效戊申豫忽病此正悶鬱時周叔明以餅法見寄未服也五月五日顧民服貽二餅貼太陽上一夕良一法用南星半夏白芷三味等末爛搗生薑葱頭為餅不服不吹不熏視諸方更簡便也筆談有風痰用之驗姚應鳯治嚴州施盛宇三載患頭痛不可忍姚曰法當取首中骨今八月時收斂難猝治期以明嵗春乃割額探去其骨出瘀血數升頓愈錢唐縣志略與腦中石蟹同龔子才治杜侍御患頭痛如刀劈不敢移動懼風怕語言耳鳴目中􅘇火六脉緊數有力與酒九蒸九晒大黃為末三錢茶調服一劑而愈此亦陽明畜熱為病病在至髙之地故大黃必用如是製法孫文垣治蔡樂川內人患頭痛痛如破髮根少動則痛連滿頭暈倒不省人事踰半時乃蘇遍身亦作疼胸膈飽悶飲湯水停膈間不下先一日因怒吐水數次蛔蟲三條今或惡風或惡熱口或渴或不渴大便祕脉則六部皆滑大有力此痰厥頭痛也先以藿香正氣散止其吐繼以牛黃黑虎丹清其人事頭仍痛甚又以天麻藁本各三錢半夏二錢陳皮白芷薄荷庥黃生薑葱白煎服得少汗而頭痛少止至晚再服之五更痛止大半人事未全清此蓋中州痰盛非下不可乃用半夏五錢巴霜一分麵糊為丸每服三十丸生薑湯送下下午大便行三次皆稠粘痰積也飲食少進餘症差可惟遍身疼未盡去改用二陳湯加前胡石膏藁本薄荷枳殼黃芩石菖蒲調理而安木盛土衰朱丹溪治一人因浴冷水發熱頭痛脉緊此有寒濕也宜溫藥汗之蒼术庥黃乾薑甘草陳皮川芎二貼得汗後知病退又與下補藥白芍陳皮半夏白术蒼术人參木通甘草四帖薑水煎服濕熱一婦人頭痛發熱而渴白术陳皮川芎乾葛木通甘草水煎溫服陽明病樓全善治一老婦人頭痛嵗久不已因視其手足有血絡皆紫黑遂用三棱針盡刺出其血如墨汁者數盞後視其受病之經灸刺之而得全愈即經所謂大痺為惡及頭痛久痺不去身視其血絡盡出其血是也三陽風熱李時珍治一人病氣鬱偏頭痛用萞庥子同乳香食鹽搗㶸㶸字無考一夜痛止治標妙法李士材治蔣少宰頭痛如破昏重不寧風藥血藥痰藥久治無功脉之尺微寸滑腎虛水泛為痰也地黃四錢山藥丹皮澤㵼各一錢茯苓三錢沉香八分日服四貼兩日輒减六七更以七味丸人參湯送五日其痛若失近時上盛之病最多觀此可悟一切乃少隂病吳孚先治一人患頭痛痛不可禁脉短而澀吳曰頭為諸陽之首若外邪所乘脉當浮緊而弦今反短澀短則陽脫于上澀則隂衰于下更加手足厥冷名為真頭痛與真心痛無異法在不治惟猛進參附或冀挽回萬一如法治之果愈李成章官六安衛干户善針灸或病頭痛不可忍雖震雷不聞李診之曰此蟲啖腦也合殺蟲諸藥為末吹鼻中二三日蟲悉從眼耳口鼻出即愈明史一人素病黃忽苦頭痛不已發散降火歷試無效診得脉大而緩且一身盡痛又兼鼻塞乃濕家頭痛也投瓜蒂散一匕內鼻中黃水去大杯而愈大退濕熱張三錫屢見苦頭痛百法不應詢之曾生過楊梅瘡用土茯苓四兩白鮮皮苦參金銀花各三錢黃柏一錢皂角子三十粒苡仁木通防風各二錢氣虛加參耆血虛加四物大獲其驗身痛亦效治法彚濕毒一人頭痛脉滑而數乃痰火上攻也二陳荆芥羌活酒芩不應加石膏二劑稍可終未盡除前方加熟大黃三錢食逺煎服病去如脫同上陽明痰火一人苦頭痛衆作外感治診得右手寸口脉大四倍于左兩尺洪盛乃內傷氣虛頭痛也外兼自汗倦怠以補中益氣湯加炒黃柏一劑知二劑已氣虛一人頭痛而面色黎黑身體羸瘦左寸關俱不應指兩尺獨洪盛因作隂虛治用滋隂四物加黃柏知母元參二服减半十日痊血虛一婦苦頭痛悮為外感治發散三黃白虎硝黃愈投愈甚診之氣口急大而數按之即濡右脉亦虛大詢之先不熱服藥後始熱曰風寒必先發熱在一二日間豈有先不熱而後熱者此氣虛頭痛也觀其氣短不足以息餘皆可知今發散過度復耗其氣又復下之復損其血氣血兩傷宜乎虛火獨熾而身反熱也非大補詎能挽回遂以補中益氣湯大劑加熟附子一片為嚮導服下即熟睡覺而痛止第人事不清復加筋惕肉瞤振振不寧彼歸咎于補劑曰虛極所致復更一醫用柴胡表藥致一身之火游行于外變為斑爛彼信為傷寒矣化斑承氣日進遂不救同上一人頭痛身形拘急惡寒便祕惡心作食鬱治不應診得氣口脉和平獨尺數而細且行步艱難乃腳氣欲動也從腳氣治而愈同上一人頭痛作外感治不應左脉平和氣口獨盛症兼飽悶惡心乃食鬱也消導而愈同上陽明病一人牙與頭角互痛乃少陽陽明二經火盛之故清胃散對小柴胡去半夏人參加薄荷石膏二劑瘳同上一老嫗頭痛連額發散降火備用不效面上皆出小紅泡有微水不甚潰一月後痛悉移于右左眼胞上紅腫且懶于言動飲食不甜用辛凉愈甚六脉濡弱如蛛絲初接少弦因作氣虛治六君倍黃耆加蔓荆子三服後漸安心跳不眠愈急乃以調中益氣湯加茯神元參棗仁柏子仁連進數服頓愈同上東垣常病頭痛發時兩頰青黃眩暈目不欲開懶言身體沉重兀兀欲吐潔古曰此厥隂太隂合病名曰風痰以局方玉壺丸治之灸俠溪即愈是知方者體也法者用也徒執體而不知用者弊體用不失可謂上工矣祕藏編醫說續湖南押衙顔思退治頭風掣痛用蠟二斤鹽半斤相和于錫鑼中鎔令相入揑作一兜鍪勢可合腦量大小搭頭至額頭痛立止經驗方同上王叔權云豫年踰壯寒夜觀書每覺腦冷飲酒過量腦亦疼甚後因灸囟會穴而愈有兵士患鼻衄不已豫教令灸此穴即愈有人久患頭風亦令灸此穴即愈但銅人明堂經只云主鼻塞不聞香臭等疾而已故豫書此以補其治療之缺然以腦户不宜針觀之囟㑹亦不宜針針經只云八針以下不宜針恐未盡也叔權母氏隨叔權赴任為江風所吹身體頭動搖如在舟車上如是半年乃大吐痰遍服痰藥并灸頭風諸穴方愈有士人患腦熱疼甚則自牀投下以腦拄地或得冷水粗得减而疼終不已服諸藥不效人教灸囟會而愈熱疼且可灸况冷疼乎凡腦痛腦瀉先宜灸囟會而强間等穴蓋其次也以上並同上資生經薛立齊治一儒者酒色過度頭腦兩脅作痛以為胃虛而肝病用六味地黃料加柴胡當歸一劑頓安商儀部勞則頭痛作陽虛不能上升以補中益氣湯加蔓荆子而痊王肯堂治一人寒月往返燕京感受風寒遂得頭痛數月不愈一切頭風藥無所不服厥隂愈甚肢體瘦削因思此症明是外邪緣何不解語云治風先治血血行風自滅本因血虛而風寒入之今又踈泄不已烏能愈哉又云痛則不通通則不痛乃用當歸生血活血木通通利關竅血脉其人能酒用酒一斗入二藥其中浸三晝夜重湯煮熱乘熱飲之致醉則去枕而卧矣然有火鬱于上而痛者宜酒芩石膏之類治之又方用芎歸熟地連翹各二錢以薄荷二錢放碗內將滚藥冲下鼻吸其氣候溫即服服之立愈然亦為血虛者設耳馬元儀治一友患頭痛經年不愈早則人事明了自午至亥神氣昏憒不寧作風火治無效診之兩脉俱沈且滑此太隂陽明痰厥頭痛也用礞石滚痰丸間服導痰湯以湯滌之次以六君子少加秦芁全蝎調理而安張樹滋妹患頭痛纍月診之陽脉太隂脉澀曰此隂衰于下陽亢于上上盛下虛之候也法宜六味地黃湯加青鉛五錢俾清濁定位斯不治痛而痛自止矣所以然者以陽氣居上體本虛也而濁氣干之則實隂氣居下體本實也而氣反上逆則虛頭為清陽之位而受濁隂之邪隂陽混亂天地否塞而成病矣治之者不察其脉槩以頭痛為風火專行透解之劑有不益虛其虛者乎朱某患頭痛纍月苦不可忍咸用散風清火之劑診其脉浮虛不鼓語言懶怯肢體惡寒此勞倦中傷清陽之氣不升濁隂之氣不降也故汗之反虛其表清之益傷其中其惡寒乃氣虛不能上榮而外固也况脉象浮虛體倦語怯尤為中虛氣弱之驗與補中益氣湯升清降濁加蔓荆為使令至髙巔一劑知二劑已一人頭風畏冷首裹重綿三十年不愈以蕎麥粉二升水調作二餅更互合頭上微汗即愈李樓怪症竒方王帶存曰此方先莊溪伯曽治族祖經驗繆仲淳治梁溪一女子頭痛作嘔米飲不能下曰因于血熱血虛火上炎也麥冬五錢橘紅木瓜茯苓各二錢白芍三錢枇杷葉三大片蘇子錢半甘菊錢半烏梅二個竹瀝一杯蘆根汁半碗二劑嘔止頭尚痛加天麥冬二錢頭痛少止加土茯苓二兩小黑豆一撮全愈廣筆記沈觀頥中丞傳自一道人頭風神方豫僕婦患此痛甚欲自縊服二劑數年不發土茯苓四兩忌錢金銀花三錢蔓荆子防風明天麻各一錢元參八分辛夷川芎各五分黑豆四十九粒燈心二十莖芽茶五錢河水井水各鍾半煎一鍾服廣筆記廣筆記治半邉頭痛屬火症者用之大黃末三分黃芩末一錢二味和生白酒一碗頓熱調勻服之即愈立齊治一婦人腦左腫痛左鼻出膿年餘不愈時或掉眩如坐舟車正許叔微所謂肝虛風邪襲之而然也以川芎一兩當歸三錢羌活旋覆花細辛蔓荆子防風石膏藁本荆芥穗半夏麯乾地黃甘草各半兩乃製一料每服一兩薑水煎服而愈劉雲密曰一婦季冬受寒甚至仲春巔頂並左後腦痛是原病于足太陽寒水寒久化熱鬱熱上行以病于手太陽因風升之化不達而病亦在足厥隂也經謂過在巨陽厥隂者誠然診者云手太陽熱甚于風足厥隂熱勝于濕更謂脾肺亦有鬱熱心有微熱余止治手太陽而微兼肺以上焦合而營諸陽歸于手太陽之氣化在肺主氣者也並治足厥隂以風升之化達而手太陽之氣化乃暢更微利小腸以通血脉而和其氣並心經之熱亦去故不必多治他經也按此亦治巔頂之一因見寒者溫治之未盡耳酒片芩二分半酒枯芩分半蔓荆子二分半防風分半萸連二分半柴胡三分藁本三分升麻二分川芎二分酒黃柏三分當歸三分木通四分牛膝三分水煎一劑愈嘉祐初仁宗寢疾藥未驗間召草澤醫始用針自腦後刺入針方出開眼曰好惺惺翌日聖體良已自爾以穴目為惺惺穴針經初無此名或曰即風府也畫墁録宋張舜民吳橋治方簡妻病五年恃饘不盡一器至夜則頭岑岑遞絶遞蘇達旦乃定橋至曰食少久卧肌宜朘今且腴而脉不數奚病為或婦當娠大損血于頭審是治二年可受胎復産男而起矣蓋婦嘗妊哭姑髮根有疣如豆大出血數升匿勿令人知尋免男弗育也治不補氣專補血果二年而舉子命之曰去病遂如常太函集眉髮李林甫壻鄭平為省郎林甫見其鬢髮斑白因曰上明日當賜甘露羮鄭郎食之能烏髮翌日食之一夕兩鬢如黳琅琊代醉編李卿換白髮方云刮生老薑皮一大升于鐺中以文武火煎之不得令過沸其鐺惟得多油膩者尤佳更不須洗刮便以薑皮置鐺中密封固濟勿令過氣令一精細人守之地色未分時黎明也便須煎之緩緩不得令火急如其人稍疲即換人看火一伏時即成置于磁鉢中研極細李方雖云一伏時若火候勻至日西即成藥也使時以簮腳蘸取如麻子大先于白髮下㸃藥訖然後拔之再㸃以手指熱撚之令入肉第四日當有黑者生神效梅師治年少髮白拔去白者以白蜜塗毛孔中即生黑髮不生取桐子搗汁塗上必生黑者千金療髮黃熊脂塗髮梳之散頭入牀底伏地一食頃即出便盡黑不一升脂驗薛立齊治一男子因大怒發熱眉髮頓落蓋髮屬腎而眉屬肝此肝腎素虛為怒隂火愈盛銷鑠精血而然也用六味丸料加柴胡山巵黃柏數劑漸生又二十餘劑而完一男子染時瘡服換肌散之類眉毛頓脫遍身作癢或時赤暈乃燥藥損其隂血陽氣偏旺而然朝用四物湯倍熟地加茯苓白术丹皮山梔甘草夕用六味丸料加當歸黃耆治之瘡症既愈眉毛亦生一男子素不慎房勞其髮忽落或發熱惡寒或吐痰頭暈或口乾作渴或小便如淋兩足發熱或冷至脛屬足三隂虧損而隂火內熾朝用十全大補夕用六味丸料加炒黑黃柏枸杞治之諸症悉退而髮漸生一男子遍身瘙癢服祛風辛燥之劑眉髮脫落此前藥復傷肝腎精血虛而火內熾所致朝用八珍湯加麥冬五味夕用六味丸料加當歸黃耆治之風熱退而眉髮生矣一儒者遍身作癢搔破膿水淋漓眉毛脫落如癘風症久服祛風等藥致元氣虧損用補中益氣湯加茯苓而愈後失調理日晡熱甚用八珍湯加五味麥冬五十餘劑而痊面孫兆治樊樓店家劉三一日滿面皆黑色有相者斷云不過月餘死既逾月且安適孫入店與客飲酒遂拜孫述說其病狀孫診之曰非病也乃為臭氣所熏穢氣蓄于面部不散故有此色問劉汝一月前聞甚一陳非常臭氣不能避耶劉曰一日登溷其厠臭氣不可聞隱忍良久下厠明日遂有此疾孫曰去至臭無過至香我家有南人將至售香可用沈檀二香各一兩碎擘焚于爐中安帳內以熏絹被蓋定勿令香氣散可端坐香邉瞑目靜坐候香氣散方可出帳明日引鑑照之劉依其言面色漸變旬日如故樓全善曰腎臭腐屬水脾臭香屬土厠臭者腐臭也故聞之則入腎而面黑沈香者香臭也故熏之則脾土勝腎水而色還也蘇子由面有瘡髙安丐者趙生謂子由曰君好道而不得要陽不降隂不升故肉多而浮面赤而瘡吾將教君碗水以灌溉子骸經旬諸疾可去子由用其說信然惟怠不能久故不能極其妙龍川志略治面部生瘡或鼻臉赤風粉刺用盡藥不效者惟有此藥可治神妙不可言每以少許臨卧時洗面令淨如面油用之近眼處勿塗數日間瘡處自平赤亦消如風刺粉刺一夕見效閔提㸃方用生硫黃半錢香白芷半錢芫青七個去趐足全蝎一個洗炒瓜蔞半錢膩粉半錢蟬退五個洗去泥右為細末麻油黃蠟約度如合面油多少熬鎔取下離火入諸藥在內每用少許塗面上醫說續編趙君猷撫幹所傳云有二卿趙再可知湖州時與一詩僧相厚而僧患酒齄鼻端生赤贅數枚大者如橘小者如梅李下垂過口飲食言語皆所妨廢良自厭苦之郡有一小兵事刀鑷人但聞其善取靨痣不知其能治酒齄也一旦自言于僧請醫此疾即以藥傅之凡半月餘每日取惡物如膿血自皮膚出者甚多其贅後悉成痂落去鼻面瑩然遂以十千為謝且語二卿俾直齊閣而求得其方以傳秀邦治人良驗用黃丹五文餅藥五十文著大罐子盛碙砂三十文研極細用巴豆十個去殼膜紙裹壓去其油右件同入餅藥罐子中慢火熬三兩沸取下續入研細生礦灰三錢酒齄鼻用鵝毛掃在紅處一日一次上藥以追出毒物病退即止雀子斑用小竹棒兒挑藥㸃患處才覺微腫即便洗去恐力太猛並集成同上陳三農治鄰婦面上一熱即通身躁熱而汗隨之日夜六七次百治不愈細思之經曰面熱者足陽明病此脾隂不足而胃火有餘也以山藥為君歸芍地黃為臣以補脾隂之不足用石膏生甘草以㵼胃火黃耆麥冬五味以固腠理加竹葉以去煩熱二劑愈朱丹溪治一婦人面頰兩腮熱腫此膈壅之病也乾葛桔梗各錢半升麻一錢蘇葉錢半薄荷一錢炙甘草七分薑一片水煎食後服王莽遺孔休玉休不受莽曰君面有疪美玉可以滅瘢休猶不受莽曰君嫌其價重乎遂槌碎進休休方受之薛立齊治吳黃門瞻之腮赤腫痛此胃經風熱上攻所致以犀角升麻湯二劑而平又姜大理患此前湯為人所惑謂湯內白附子性溫而不服另用荆防敗毒散愈甚後雖用此湯尚去白附子亦不應後用前方三劑而愈本草云白附子味甘辛氣溫無毒主面上百病及一切風瘡乃風熱之主藥內經曰有是病用是藥苟不用主病之藥病焉得而愈哉吾進士面患瘡已潰作渴自服托裏藥及降火藥不應診其脉浮而弱丹溪云潰瘍作渴屬氣血俱虛况脉浮弱投以參耆各三錢歸术熟地各二錢數服渴止又以八珍湯加黃耆數劑脉斂而愈韓氏子年十四早喪天真面紅腫如風狀不時舉作或誤用癘風藥內虛發熱口燥煩渴此內傷不足隂火上痰之類赤遊風症也藥宜滋其隂則火自退缺加參耆四十劑又用此作丸服斤許不兩月而痊癡瘍機要許學士治王檢正患鼻額間痛或麻痺不仁如是數年忽一日連口唇頰車髮際皆痛不開口難言語飲食亦妨在額與頰上常如糊手觸之則痛作足陽明經絡受風毒傳入血凝滯而不行故有此症或者以排風小續命透髓丹之類與之皆不效乃製犀角升庥湯贈之數日而愈犀角升麻防風羌活川芎白附白芷黃岑甘草右粗末每服四大錢水煎日三四服陽明經絡環唇挾舌起于鼻合頞中循頰車上耳前過客主人循髮際至額顱今所患皆一經絡也老母年七十餘纍患頰車痛每多言傷氣不寢傷神則大發上連頭下至喉內及牙齦皆如針刺火炙手不可犯乃至口不得開言語飲食並廢自覺火光如閃電尋常涎唾稠黏如絲不斷每勞與饑則甚得卧與食則稍安知其虛也始以清胃散犀角地黃湯人參白虎湯羌活勝濕湯加黃芩甘桔皆不效後改用參耆术草芎歸升柴桔梗之類稍佐黃岑山梔牛蒡連翹空腹進之而食逺則服加减甘露飲始漸安然老人性多躁而不耐閒勞與多言時有之不能除去病根然發亦稀少即發亦不如往嵗之劇矣從子語因喪子鬱結復多餌鹿角膠諸種子藥或于食後臨卧輒進之以至成積于胃遂患面痛如老母之症服清胃散甘露飲重加石膏太過而見虛症又服參耆等補藥而復見火症門人施生以越鞠丸加山梔連翹貝母橘紅之屬開其鬱結而始安然如舊日矣連上一條俱自米選抄入不知誰案目孫兆治國婆婆患眼冷淚眼科醫科醫官治二三年不效上召孫孫至曰臣非眼科但有藥耳容進方用石決明一兩赤小豆一兩半半夏五錢生斑貓二十一粒炒去頭足木賊五錢為末薑汁丸如桐子大每服二十丸薑湯下方進聖㫖下眼科詳定奏曰此方與眼科甚不相涉斑貓有毒恐傷臟腑不敢用合再取聖㫖國婆婆聞之曰眼科醫官不惟不能亦不願使我治也但合此藥總傷無怨上聞之孫自進藥服經十餘日愈八分二十日全愈時眼科並降兩官孫賞錢三十萬竇材治家中女婢忽二目失明視之又無暈翳細思此女年少精氣未衰何緣得此症良由性急多怒有傷肝臟故經脉不調耳遂與密蒙花散一料如舊光明矣張子和治女僮目忽暴盲不見物此相火也太陽陽明血氣俱盛乃刺其鼻中攢竹穴與頂前五穴大出血目立明李民範目常赤至戊子年火運君火司天其年病目者往往暴盲運火炎烈故也李是年目大發張以瓜蒂散涌之赤立消不數日又大發其病之來也先以左目內眥赤發牽睛狀如鋪麻左之右次鋭眥發亦左之右赤貫瞳子再涌之又退凡五次交亦五次皆涌之又刺其手中出血及頭上鼻中皆出血上下中外皆奪方能戰退然不敢觀書及見日張云當候秋凉再攻則愈火方旺而在皮膚雖攻其裏無益也秋凉則熱漸入裏方可擒也惟宜暗處閉目以養其神水暗與靜屬水明與動屬火所以不宜見日也蓋李因初愈後曾冒暑出門故痛連發不愈如此涌泄之後不可常攻使服鼠黏子以退翳方在别集中趙君玉目暴赤腫㸃洗不退偶思張語曰凡病在上者皆宜吐乃以茶調散涌之一涌赤腫消散君主歎曰法之妙其迅如此乃知法不逺人人自逺法耳王之一子十餘嵗目赤多淚衆工無效張曰此兒病目睘當得之母腹中被驚其父曰妊娠時在臨清被圍乃令服瓜蒂散加鬱金上涌而下泄各去涎沫數升人皆笑之其母亦曰兒腹中無病何吐㵼如此至明日其目耀然爽明其日又與頭上出血及眉上鼻中皆出血吐時次用通經散二錢舟車丸七十粒自吐却少半又以通經散一錢投之明日又以舟車丸三十粒投之下十八行病更不作士人趙仲溫赴試病兩目赤腫睛翳不能識路大痛不任欲自尋死一日與同儕釋悶坐于茗肆中忽鉤窗脫鉤其下正中溫額上髮際裂長三四寸紫血流數升血止目快能通路而歸來日能辨屋脊次見瓦溝不數日復故此不藥不針誤出血而愈夫出血者乃發汗之一端也亦偶合出血法耳一小兒名德孫眼發赤其母買銅碌欲洗兒目煎成家人誤與兒飲之須臾大吐吐訖立開樓全善男目珠至夜疼連眉棱骨及頭半邉腫痛用黃連膏㸃之反甚諸藥不效灸厥隂少陽疼隨止半日又作月餘以夏枯草二兩香附二兩甘草四錢為末每服一錢半清茶調下咽疼减半四五服良愈一男子所患與前症皆同但黑睛有白翳二㸃諸藥不效亦以此藥與東垣選竒湯加四物及黃連煎間服并灸厥隂少陽而安王海藏妻姪女形肥笄年時得目疾每月或二月一發發則紅腫難開如此三年服除風散熱等劑左目反有頑翳從鋭眥遮瞳人右目亦有翳從下而上經云從內走外者少陽病從下上者陽明病此少陽陽明二經有積滯也脉短滑而實鼓晨則似短澀潔古云短為積滯遏抑臟腑宜下之遂用溫白丸减以川芎附子之二多加龍膽草黃連如東垣五積法從二丸加起每日加一丸如至大利然後减丸又從二丸加起忽一日于利中下黑血塊若干如黑豆大而堅硬從此漸痊而翳盡去以上三則皆醫學綱目廬州知録彭大辨在臨安暴得眼赤後生翳一僧用蘭香子本名羅勒又名香菜又名翳子草洗晒每納一粒入眥內閉目少頃連膜而出也一方為末㸃之李時珍嘗取子試之水中亦脹大蓋此子得濕即脹故能染惹眵淚浮膜耳然目中不可著一塵此子可納三五顆亦不妨礙亦一異也本草綱目張大復云豫目初眇有教服三花五子丸者或云緩甚寧益于用乎遂止揚州張斗嶽謂豫淮僧某者久眇晳然問之則服三花五子丸也此古本所載耳而修合之法稍異則效不效應焉北歸請以相與豫病久且老無事于方然願得之以濟同病者張信士通劔術其言多不妄筆談張三丰真人治目疾碧雲膏臘月取羯羊膽十餘枚以蜜裝滿紙套籠住懸簷下待霜出掃下㸃之神效即二百味花草膏另一製法兖州朱秀才忽不見物朝夕拜天因夢神傳方用好焰硝一兩銅器鎔化入飛過黃丹二分片腦二分銅匙急抄入罐內收之每㸃少許即愈張三丰仙方本草綱目宋丞相言黃典史病外障翳夢神傳一方用太隂𤣥精石隂陽火煆石決明各一兩㽔仁黃連各二兩羊子肝七個竹刀切晒為末粟米飯丸梧子大每卧時茶服二十丸服至七日烙頂心以助藥力一月而愈朱氏集驗方魏全家富母忽然失明王子貞卜之曰明年三月一日有從東來衣青者療之必愈至時候見一人著青綢襦遂邀為重設飲食其人曰僕不解醫但解作犁耳為主人作之乃持釡就舍求犁轅見桑曲枝臨井上遂斫下其母兩眼煥然見物此曲枝葉蓋井之所致也朝野僉載王璽集要詩云赤眼之餘翳忽生草中鵝不食為名塞于鼻內頻頻換三日之間復舊明又倪惟德原機啓微方用鵝不食草本名石胡荽晒乾二錢青黛川芎各一錢為細末噙水一口每以米許㗜入鼻內泪出為度一方去青黛本草綱目經驗方治目障翳以熊膽少許净水略調開盡去筋膜塵土入氷片一二片或淚癢則加生薑汁些少時以銅筯㸃之絶竒赤眼可用余家二老婢俱以此效熊膽善辟塵試之之法净一器塵其上投膽一粒許則凝塵豁然而開同上朱丹溪治飛絲入目紅腫如眯痛澀不開鼻流清涕用京墨濃磨以新筆塗入目中閉目少時以手張開其絲自成一塊看在眼白上却用綿輕輕拭出即愈如未盡再治又飛絲入目用頭垢㸃入目中即出神效又眯目鹽與豉置水中浸之視水其查立出本草綱目龔子才治一人兩眼角出烟霧此肝火也以柴胡黃連等分大劑水煎臨卧頻頻服之數劑乃瘥仍宜入血藥為妥周漢卿治鄉人蔣仲良左目為馬所踶睛突出如桃他醫謂係絡已損不可治漢卿封以神膏越三日復故明史華州陳明逺瞽十年漢卿視之曰可針也為翻睛刮翳歘然辨五色明史福建按察使沈文敏其母隨養時雙目失明延一醫療之云障翳已重藥不能效乃先藥之使不知痛尋以物撥轉眼睛向內一面向外封閉三日而開視物無一不見云眼睛惟兩角有筋保之故可撥轉然非削鼻堊手不能也菽園雜記京師法雲寺僧律師失明數年夢中有人授一方治內外障但神水在者皆可療焉二兩二兩上脫一味疑為首烏抄本但字下空一字又焉字似烏字之訛蔓荆子枸杞蒺藜甘菊荆芥穗各一兩當歸地黃川芎赤芍防風各一兩半十一味末之水麵糊丸桐子大空腹食前溫水下三二十丸僧服之目復明因目曰夢靈丸元遺山續夷堅志白彥良壯嵗常赤目道人曰但能不赤頭則不病此彥良記之七十餘更無眼疾延夀書有人年八十餘眸子瞭然夜讀蠅頭字云别無服藥但自小不食畜獸肝人以本草羊肝明目疑之余曰羊肝明目性也以食百草故他肝不然畜獸臨宰之時忿氣聚于肝肝主血不宜于目明矣延夀書陳坡次女痘後餘毒上攻遂成內障遍試諸藥半月不驗後得老醫一方用蛇脫一具净洗焙燥又天花粉等分細末之以羊子肝破開入藥在內麻皮縳定用泔水煮熱切食之凡旬餘而愈其後程甥亦用此取效槎菴小乘今此案已從居易録録入痘門以其詳細再録之萬密齊治孫撫軍淮海患目疾因宦學政時多閲卷而得今每閲文案則眼珠脹痛用八珍湯為主人參茯苓炙甘草酒洗當歸酒炒白芍酒炒生地去白术以其燥也川芎以其竄也加麥冬五味子柏子仁棗仁黃連减半共十一味孫曰何不用菊花蔓荆子曰凡目疾有外因內因由風熱得之為外因宜發散所謂火鬱則發之也由久視傷血得之為內因宜以養血為主所謂目得血而能視也服十數劑全愈孫文垣治吳小峯與弟小川俱病目專科治之益甚其目始紅腫次加太陽痛繼以星翳叠出脉之小峯濡緩而大兩目血縷直貫瞳人薄暮則痛虛小川則洪大鼓指黑珠有浮翳瘼隱澀難開大小便皆不利實故于小峯用補先以清肝散與之夏枯草五錢香附四錢甘草一錢五分細茶五分以撤其痛治標藥兩進而痛止方法與前樓全善案同繼用人參茯苓熟地杞子桂心牛膝破故紙白蒺藜丹皮治本桂紙蒺藜當酌用于小川用瀉內用瀉肝湯及當歸龍薈丸外用象牙氷片末㸃之凡㸃眼藥研須極細七日全愈經云實者正治虛者從治小川之症唯厥隂肝火熾盛肝常有餘者㵼之正治也小峯則下虛又為怒所激怒則火起于肝肝為藏血之地故血絲貫童人而薄暮作痛故先用清肝散以去其痛再用甘溫補下元之虛俾火得歸原此從治也若用苦寒降火之劑恐血凝而痛加且火激而愈熾矣姪孫眼紅腫脹或以苦寒治時疾之劑與之眼愈腫且增兩太陽痛再加石膏病不减且遍身脹悶寢食俱廢脉之弦大無力乃用蔓荆子桑白皮柴胡香附夏枯草甘草芽茶一帖痛定兩帖腫消四帖全愈一女孩右目紅腫腹中飽乃能開饑則不能開此疳積虛寒症也以夏枯草二錢甘草榖精各一錢香附一錢五分煎服四帖而安孫氏婦年過四句眼赤腫太陽痛大便三日不行經水四日未止諸治不效右目內眥突生一白泡垂與鼻齊大二寸餘專科見而却走以為竒疾時眩暈不能少動動則嘔吐益劇孫脉之兩寸關俱滑大有力兩尺沈微此中焦有痰肝膽有火為怒所觸而然經云諸風掉眩皆屬于肝諸逆衝上皆屬于火蓋無痰不作暈也却未然其白泡乃火性急速怒氣加之氣乘于絡上而不下故暴脹垂下也古壯士一怒目眥裂與此理同治當抑肝木鎮痰火先用薑汁益元丸以壓火止吐再以二陳湯加酒連酒芩天麻滑石吳茰竹茹枳實一帖吐止稍能運動仍以二陳湯加岑連之類赤腫消白泡斂經止而愈呂東莊治吳綺崖弟患左目痛連腦醫以頭風治之不解初時發寒熱後遂壯熱不止吕珍之曰火伏于內風燥泉涸木乃折矣非得汗不解也或曰汗須用發表藥獨非風燥乎且發汗藥須擁被悶卧乃得身熱甚苦此奈何難得妙吕曰庸醫發汗皆屬强逼故須擁被悶卧然而汗不可得也說破此輩伎倆正是救人苦心今藥非此類雖薄衾舒體時雨自至豈能消遏哉語缺圓活乃用龍腦白术飲子必逍遙無疑夜分大汗淋漓次日頭目爽然矣龍腦白术飲子無從考核有謂即趙氏加减逍遙散未知是否原注吳浮先治一人目痛取竹葉一片刺鼻之迎香穴出血而痊鼻內迎香穴乃手足陽明交經也治法本張子和王宗蒼目珠紅赤驚悸腸鳴色夭不澤左手浮空右關尺重按無力吳曰此肝腎交虛不能制遊行之火非肺家實火也朝服加味歸脾湯夕服八味丸不一月白珠紅退脉漸冲和矣楊賁亨治一貴人患內障性暴躁時時持鏡自照計日責效數醫不愈召楊診曰公目疾自愈第服藥過多毒已流入左股旦夕間當發毒竊為公憂之既去貴人日夕視左股撫摩惟恐其毒發也久之目漸愈而毒不作貴人以楊言不驗召詰之對曰醫者意也公性躁欲速每持鏡自照心之所屬無時不在于目則火上炎目何由愈故詭言令公凝神于足則火自降目自愈矣兵行詭道惟醫亦然貴人曰良醫也厚禮而遣之筠齊漫録江西通志載此太略范武子嘗患目痛就張處度求方處度因嘲之曰古方宋陽里子少得其術以授魯東門伯魯東門伯以授左丘明及漢杜子夏鄭康成魏髙堂隆晉左太冲凡此諸賢並有目疾相傳此方云用損讀書一减思慮二專內視三簡外觀四旦晚起五夜早眠六凡六物熬以神火下以氣篩藴于胸中然後納諸方寸修之一時近能數其目睫逺視尺箠之餘長服不已洞見墻壁之外非但明目乃亦延年同上黃履素曰豫少時神氣不足患目每用目少過輒酸澀無光者纍日博考方書多云六味地黃丸可治目豫連服二三料目疾轉甚改用别方補腎氣血之藥始得少愈後讀醫學鈎元有目病不宜服六味丸辨謂澤瀉茯芩滲水山茱萸不宜于目山茰味酸肝閈竅于目經云肝病者毋多食酸凡肝腎病皆不宜此三味不惟目也言之甚詳以豫驗之此論良是然從今思之目病有屬血虛亦有屬氣虛者豫血固不足氣則尤虛薛立齊治兩目緊澀不能瞻視以為元氣下陷用補中益氣湯倍加參耆而愈豫悔往時不多服前湯而專事于補腎養血致久不痊逮四十後以指麻多服前湯原無意于治目而目光漸充始信往時之誤豫幼時患風弦爛眼甚受其纍百藥罔效遇一陳姓醫士于長安邸授豫白末藥令敷于眼眥患處隨敷隨愈取效如神不肯傳方豫略訪之云有吐蛔在內吐蛔者小兒口中吐出蛔蟲收乾候用其中想更有製就蘆甘石配之者真竒方也張三錫治一人病目久不能視凉藥盡試不應診之兩手微弱命服八珍加麥冬一月如舊乃知飲食不運腸胃枯澀髮落皮皴噎膈淋閉等症目昏耳聾悉由氣液血脉榮衛衰少不能升降出入虛火阻滯而然故元府閉小濁火炎上則視昏花隔簾視物之象也丹溪東垣治目昏用參耆補養氣血久靡不獲效以氣血旺則元府得利升降清明乃服一人目赤黑珠傍暗赤成瘡耳中癢作腎臟風治用四生散每作三二服即愈時稱為聖散聖惠方一人拳毛倒睫用木鱉子一個去殼為末綿裹塞鼻中左塞右右塞左一二夜其睫自分治法彚陸肖愚治孫憲副夫人因怒氣患兩目赤痛兩太陽亦痛治及半月赤痛益劇且腫大如桃經行數日不止大便數日不行飲食不進頭眩吐逆脉之左弦右滑上下俱有陽分有餘曰相火寄位于肝膽怒氣觸之其發如龍雷不可逆折病雖上劇而下緩然實因下而逆于上也用醋炒柴胡青皮吳茱茰炒黃連鹽水炒黃柏酒炒黃芩白芍丹皮青黛竹茹為煎劑以抑青丸合龍薈丸一日夜煎丸各三服遂减大半第大便未行經血未止煎劑仍前以抑青丸合潤字丸投之便行極澀進粥安睡明日諸症俱愈後以清氣養榮湯調理之一老人年八十四夜能細書詢之云得一竒方每年九月二十三日桑葉洗目一次永絶昏暗宜五月五日六月六日立冬日採者佳倪新溪母陶氏哭子喪失明已十一年忽一人踵門曰吾能療瞽時其孫上成均宗黨會錢具在其人曰諸君但少留此視之發囊出針針其目兩眥頓能見物撫其孫頂曰吾久不覩汝今成人矣新溪得之手百金謝其人不受而去衆以為神雲間雜志九江有夫毆其婦致雙睛突出適有兵過其門令勿動取手中水濕盛睛旋轉使其系不亂然後納入即以濕巾裹住令三日勿開其婦性急閉二日遂解巾眼好如故但遇風寒常發痛云解早之故也吳誠有談竒疾方王帶存抄輯晉顧含養嫂失明嘗藥視膳不冠不食嫂耳疾須用蚺蛇膽含計盡不得有一童子以一合授含開乃蚺蛇膽也童子出門化為青鳥而去嫂目遂差晉書王叔權云即執中也豫遊學㑹稽絶早觀書晨牌方食久之患目澀倦遊而歸同舍遺以鹽精數次揩目而疾除鹽精且爾則青鹽之治目固也古方用青鹽揩牙因掬在手洗目而目明鹽精乃鹽倉地下之精英資生經唐丞相李恭公扈從蜀中日患眼或澀或生翳膜或即疼痛或見黑花如豆大纍纍數十不斷或見如飛蟲趐羽百方治之不效僧智深云相公此病緣受風毒夫五臟實則瀉其子虛則補其母母能令子實子能令母虛腎是肝之母今腎受風毒故令肝虛則目中恍惚五臟亦然腳氣消中消渴諸風等皆由腎虛也此僧深得經㫖雖未能惕發所以終是唐人髙手諸說紛紛徒亂人意耳地黃丸悉主之用生地黃熟地黃各一斤石防風皆去蘆枳殼麵炒去瓤牛膝酒浸杏仁去皮尖各四兩右為細末不犯鐵器煉蜜丸如桐子大空心以豆淋酒下五十丸豆淋酒法黑豆半升净揀簸炒令烟出以酒三升浸之不用黑豆用此酒煮獨活即是紫湯也百方陸景淵之子患爛弦風眼兩眥皆痛淚漬兩頰皆即成瘡百藥不效因理故書得此方試㸃之須臾藥淚俱下循瘡中流出其間有小蟲自此遂愈甚妙黃連一兩柏樹皮乾用一兩半濕用二兩右三味㕮咀以水二升煎至五合稍冷用滴目兩眥及洗爛處日三四用同上呪偷針眼已結赤腫未成膿者神驗取患人衣衫角以手緊捻定于所患眼大眥上揾之每一揾即念一聲移甚底移撅眼如此一氣念七遍揾七遍訖即隨身就手撚令緊打一結結定自然便退直候眼安方解切在志誠不須令病人知呪語或欲自呪自移亦甚可同上朱丹溪治一人病眼至春夏便發當作鬱治用黃岑酒浸南星薑製香附蒼术俱童便浸連翹各二兩山梔炒一兩川芎童便浸一兩半陳皮酒浸草龍膽酒蒸蘿蔔子清黛各半兩柴胡三錢為末神麴糊丸服之旬月而愈治法華川陳明逺患瞽十齡百藥屢嘗而不見效自分為殘人松陽周漢卿視之曰是翳雖在內尚可治用針從眥入睛背捲其翳下之目歘然辨五色陳以為神續文粹趙良仁云丹溪先生嘗用參膏治一老人目暴不明昏暗如夜正乃靈樞謂氣脫者目不明是也余亦曾治一士人患頭風連左目壅痛從戴人法于百會上星出血皆不效遂在頭偏左之足太陽所過第二行與上星對平按之痛甚處出血立愈由是而言針之與藥必切中病所藥與邪對然後可愈蓋前人之方不過立規矩耳藥要或問繆仲淳從父病後眼花服此立愈蓋肝腎二經虛也真甘枸杞一斤去蒂真懷生地黃一斤極肥大者酒洗净河水砂鍋內熬膏以無味為度去查重湯煮滴水成珠便成膏也每膏一斤入煉蜜六兩空心白湯化下廣筆記黃學諭潜白患風淚眼每出則流淚盈頰繆仲淳疏一方寄之榖精草為君蒺藜和枸杞之屬佐之羊肝為丸不終劑愈同上薛立齊治一男子眼赤癢痛時或羞明下淚耳內作癢服諸藥不應氣血日虛飲食日减而癢愈盛此肝腎風熱上攻也以四生散白附子黃耆獨活沙苑蒺藜酒調四服而愈又一人頭目昏眩皮膚瘙癢搔破成瘡以八風散治之亦愈立齊曰世傳眼眥初生小皰視其背上即有細紅㸃如瘡以針刺破眼時即瘥故名偷針實解太陽經結熱也人每試之有驗張子顔少卿晚年常目光閃閃然中有白衣人如佛相者子顔信之彌謹乃不食肉不飲酒然體瘠而多病矣一日從汪壽卿求診卿一見大驚不復言但投以大丸數十小丸千餘粒囑曰此十日內服之當盡却以示報既如期視所見白衣人變黃而光無所見矣乃欲得肉食又思飲酒又明日黃亦不見覺氣象異他日矣乃詣壽卿以告卿曰吾固知矣公脾初受病為肺所乘心脾之母也公既多疑心氣不固自然有所覩吾以大丸實其脾小丸補其心肺為脾之子既不能勝其母而病自愈矣道山清話未選入沈存中云豫為河北察訪使時病目赤四十餘日黑睛傍黯赤成瘡晝夜作楚百治不效郎官邱革相見問豫病目如此曾耳中癢否若耳中癢即是腎家風有四生散療腎風每作二三服即瘥閭里號為聖散子豫傳其方合服之午時一服臨卧一服目反大痛至二更乃能眠及覺目赤稍散不復痛矣更進三四服遂平安如舊是時孫和甫學士帥鎮陽聞豫說大喜曰吾固知所以治目矣向久病目嘗見呂吉甫參政曰頃目病久不差服透氷丹乃瘥如其言修合一劑試服了二三十服目遂愈乃知透氷丹亦療腎風耳未選入龔子才治一人兩目作痛服降火祛風之藥兩目如緋熱倦殊甚用十全大補湯數劑諸症悉退後服補中益氣湯兼六味丸而愈復因勞役午後目澀體倦仍服十全大補而痊一人目赤不明服祛風散熱藥反畏明重聼脉大而虛此因勞心過度飲食失節以補中益氣湯加茯神棗仁山藥五味頓愈又勞役復甚用十全大補兼前藥而痊前日與歐陽叔弼朝無咎張文潛同在戒壇豫病目昏將以熱水洗之文潛曰目忌㸃洗目有病當存之齒有病當勞之不可同也又記魯直語云治目當如治民治齒當如治軍治民當如曹參之治齊治軍當如商鞅之治秦頗有理故追録之東坡志林相國崔公慎由亷察淅西左目眥生贅如息肉欲蔽瞳人視物極礙諸醫方無驗談簡見曰此立可去但能安神不撓獨斷于中則必效矣崔公曰如約雖妻子必不使知談又曰須用九日晴明亭午于靜處療之若其日果能遂心無憂矣是時月初也至六七日間忽隂雨甚談生極有憂色至八九大開霽問崔公飲酒多少崔曰户雖至小亦可引滿談大喜是日于使宅北樓請飲酒數杯端坐無思俄而談以手微捫所患曰殊小事耳初覺似拔之雖痛亦忍又聞動剪刀聲乃白崔曰此地稍暗請移往中庭坐既定聞櫛然有聲先是談請好綿數兩染縫至是以絳綿拭病處兼傅以藥遂不甚痛請開眼看所贅肉大如小指堅如乾筋遂命投之江中後數日詔徴入秉鈞因話録唐趙璘金封翁年近七旬病暈厥即類風也小愈後眼花不良于步或教以一味白蒺藜水法為丸每早晚服四錢既可祛風又能明目且價亷而工省才服數日覺口咽苦燥再服遂陡然失明重以鬱怒暈厥復作目閉不語汗出如珠延診脉已散亂姑以熟地二兩杞子一兩煎服一時醫至不敢主方欲就中加附子一錢謂重劑純隂宜少入陽藥余曰此症外間多用參附湯有致筋枯皮黑人未死而半身先死者以衰微之隂被劫也今症屬三隂虧竭五志之火上炎故卒然暈厥且病人以誤服白蒺藜之燥失明而病作寧可再服附子耶乃默然去二味服下神氣漸蘇乃减半入沙參麥冬沙苑蒺藜而愈今常服之兩年許能辨磁器花色矣後復更醫不知何病而卒盧玉川年六旬外久病脅痛凡一切香竄古方莫不遍嘗後一醫與丸方以胡盧巴為君餘多伐肝之品服之脅痛果暫愈既而一目失明猶不謂藥之誤也再服則兩目俱損近脅痛轉甚延診以大劑生熟地杞子女貞沙參麥冬蔞仁與之一服即愈始悟向藥之非然目中黑水神光枯竭已久不能復矣一人年二十左右求診無他病唯日入則兩目無所見此即諺語所謂雀盲是也其脉唯左關大左尺極微語之曰君得母新婚乎曰然與生地杞子牛膝甘菊沙參麥冬女貞四劑而愈因戒其房幃撙節否則再發成廢人矣方懋缺內人患瘄荆防二味為時師治瘄所不可缺者服四劑不慮其芳香燥烈竟能致兩目赤腫眵淚成障也已逾月漸次失明診之兩寸上溢且弦數令以前方加當歸白芍數服而愈其姪亦同此患時已瞳人迸出不及藥矣耳許叔微治一男子年二十嵗因瘡毒後腎經熱右耳聼事不真每心中拂意則轉覺重虛鳴疼痛地黃湯生地枳殼羌活桑白皮磁石甘草防風黃芩木通右為粗末每服四錢水煎日二三服不拘時候綱目朱丹溪治馮官人左耳鳴此勞得之法當補隂而鎮墜之黃耆人參當歸陳皮茯芩升麻酒柏防風甘草白芍食前熱服飲了去眠一覺綱目其方則似補氣而升舉之非補隂鎮墜也薛立齊治一人耳內不時作痛痛時欲死痛止如故六脉皆安非瘡也話間忽作度其有蟲令急取猫尿滴耳果出一臭蟲遂不復痛或用麻油滴之則蟲死難出或用炒芝麻枕之蟲亦出但不及猫尿之速也取猫尿法用生薑擦猫鼻其尿自出趙養葵治一小兒患耳膿醫以藥治之經年纍月無效殊不知此腎疳也用六味丸加桑螵蛸服之而愈吳孚先治張司馬素有火症兩耳腫痛係少陽風熱勸廷針灸科刺聼㑹合谷臨泣尋愈柴嶼青治汪謹堂夫人兩耳蟬鳴昕夕不歇服過人參熟地數兩無少效柴曰腎開竅于耳心亦寄竅于耳治耳必責之腎固矣但診得兩尺尚屬有神決非腎虛左寸亦平緩無疴惟右寸關洪大此肺胃兩部風熱所壅而致遂不治病而治脉用清解之劑不數服而右耳已愈再服數劑兩耳全愈因思耳目口鼻雖于五臟各有分屬而內實相通治病惟以切脉為慿夫固有治在此而效在彼者全在一心之圓機活法也李元淳尚書在河陽日蚰蜒入耳無計可為腦悶有聲至以頭擊門柱奏狀危困因御醫療之不驗忽有人獻方用胡麻油作餅枕卧須臾自出乃愈圖經本草綱目江湖紀聞云有人壁風入耳頭痛不可忍百藥不效用稻稈灰煎汁灌入即死而出也又萵苣搗汁滴入亦能出百蟲入耳本草綱目薛立齊治一婦人耳內或耳後項側作痛寒熱口苦月經不調此肝膽經火兼傷脾胃用四君加柴胡升麻黃耆白芍而愈後因勞役怒氣嘔吐脅脹用六君子湯加山梔柴胡而安一婦人耳內外腫痛胸脅不利寒熱往來小便不調此肝火傷血先用龍膽瀉肝湯四劑諸症頓退又用加味逍遙散而愈又因怒復作用小柴胡湯而痊一婦人經行後因勞怒發寒熱耳作痛以經行為血虛用八珍湯加柴胡怒氣為肝火用加味逍遙散勞役為氣傷用補中益氣湯加山梔而愈一婦人素鬱怒耳內作痛腫焮寒熱面色青黃經行則變赤用加味歸脾湯加味逍遙散而愈一婦人懷抱素鬱因怒耳作腫痛經行不止寒熱發熱面色青赤肝脉弦數此久鬱傷脾暴怒傷肝先用加味小柴胡湯隨用加味逍遙散而痊一婦人因怒發熱每經行兩耳出膿兩太陽作痛胸脅乳房脹痛或寒熱往來或小便頻數或小腹脹悶皆屬肝火血虛先用梔子清肝散二劑又用加味逍遙散數劑諸症悉退乃以補中益氣而痊一婦人耳內腫痛出水寒熱口苦焮連頸項飲食少思此肝火甚也用小柴胡湯加山梔丹皮稍愈用加味逍遙散漸愈用八珍湯加柴胡丹皮山梔調補肝脾全愈一婦人耳內腫痛胸脅不利寒熱往來小便不調此肝經濕熱也用龍膽㵼肝湯四劑諸症頓退用加味逍遙散而全愈又因怒復作用柴胡清肝散而痊一婦人耳內不時脹痛內熱口乾勞則頭暈吐痰下帶此肝脾氣虛也朝用補中益氣夕用加味逍遙散而痊一寡婦耳內外作痛不時寒熱脉上魚際此血盛之症用小柴胡加生地以抑其血而愈又項間結核如貫珠寒熱晡熱用加味歸脾湯加味逍遙散調補肝脾而愈一婦人耳內外或作痛或赤腫或寒熱月經旬日而止潮熱內熱自汗盜汗此肝脾氣血俱虛而有熱用歸脾湯六味丸而愈一婦人性急或耳內作痛或耳外赤腫發熱脅脹日晡益甚此怒氣傷肝氣血俱虛朝用加味逍遙散加黃柏桔梗夕用歸脾湯送地黃丸而愈一孀婦耳內外作痛或項側結核內熱晡熱月經不調吐痰少食胸膈不利此鬱怒傷肝朝用歸脾湯以解脾鬱生脾氣夕用加味逍遙散以清肝火生肝血而愈一女子耳下腫赤寒熱口苦月經不調小腹內結一塊此肝火氣滯而血凝也先用小柴胡加山梔川芎丹皮又用柴胡清肝散而痊一婦人耳下腫痛發寒熱與荆防敗毒散四劑表症悉退以散腫潰堅湯數劑腫消大半再以神效瓜蔞散四劑而平一男子肝經風熱耳下腫痛發熱脉浮數以薄荷丹治之而愈薄荷皂角連翹三棱首烏蔓荆豆豉荆芥一男子每怒耳下腫或脅作痛以小柴胡湯加青皮木香紅花桃仁四劑而愈一婦人耳鳴內熱經行不調肢體倦怠飲食無味以為肝脾虛熱用四君加柴胡山梔丹皮甘草而愈一男子耳內出膿或痛或癢服聰耳益氣湯不應服防風通聖散愈甚以補腎丸治之而愈朱余二女中表姊妹也年十六七朱則耳痛常發癮疹因感冒痛暴甚耳門連項皆腫與養青湯加黃芩羚羊蔞仁二劑而愈余則耳痛常流膿水因患瘄醫與荆防發之遂出血不止膈間嘈辣前方去羚羊加知母赤芍二劑血止數劑膿水乾二人脉皆關弦寸鼓乃腎與肝膽之火也余早失怙恃困苦顛連年十四就西溪吳氏質庫食力值冬月查盤提唱勞劇忽右耳暴痛不可忍如刺如錐約一日夜內起一疱迸出黃水涓滴不絶數日乃乾第水出則痛减水乾則病除自後過勞即發其痛至欲求死如是年必數次偶問一醫彼見少年得此謂由暴怒傷肝瘀血為患教服抵當丸不知此屬勞傷肝腎龍雷之火上攻而然幸合藥時肆中無蟲蟲水蛭竟因循不服後年二十餘右耳漸聾痛遂不作蓋此中經絡枯絶火亦不能透達也鼻張子和治常仲明嘗于炎暑時風快處披露肌膚為風所賊三日鼻窒雖坐于暖處少通終不大解使服通聖散入生薑葱根豆豉同煎三兩服大發汗鼻立通矣此由傷風而得有人患鼻中有瘜肉垂出鼻外不聞香臭用瓜蒂細辛等分為細末以綿包如豆許塞鼻中須臾鼻即通瘜內化為黃水㸃滴至盡三四日愈又聖惠方用陳瓜蒂以羊脂和傅上日三次效醫學綱目薛立齊治一男子面白鼻流青涕不聞香臭三年矣此肺氣虛也用補中益氣湯加山梔麥冬而愈陳都憲夫人患鼻疳爛通鼻孔用鹿角一兩白礬一兩瓦上煆過人頭髮五錢燈火上燒過為末用花椒湯洗净糝藥疳上三四次即愈如不收口瓦松燒灰存性研末乾糝之即收一人酒齄鼻紅赤用金花丸晚服芩連梔柏大黃桔梗白葛粉井水為丸用六味地黃丸全料加當歸二兩苦參四兩空心服不兩月而愈孫文垣治吳儀制尚卿弱冠時病鼻塞不能噴者四年且衄寒月更甚口渴咽喉邉有痰核脉之右寸關洪滑此肺經痰火症也與前胡秦芁葛根薄荷石膏天花粉元參貝母山梔甘草白藥子桔梗丹皮四帖而衄止夜與牛黃三清丸數粒噙之鼻氣即通利能嗅噙未旬日全愈一婦人方妙齡表虛易感風寒致成鼻淵流青涕不止便覺頭暈兩太陽常痛且多噴嚏脉之兩寸洪大用秦芁酒芩桑白皮馬兜鈴各八分白芍一錢滑石石膏各二錢枳殼蔓荆子各五分甘草三分四帖而愈病鼻赤者乃陽明胃經火上炎一方只食鹽一味研細每晨起撮少許擦齒噙水蕩潄旋吐掌中掬以洗面行之月餘而鼻色復舊且有益于齒蘇談吳浮先治一人患鼻淵十載乃脾肺氣虛下陷須用補中益氣湯百劑方愈不信用白芷防風辛夷川芎等味病轉甚復求治與前方百帖而痊丹溪治一中年人右鼻管流濁且臭脉弦小右寸滑左寸澀灸上星三里合谷次以酒芩二兩蒼术半夏各一兩辛夷川芎白芷石膏人參葛根各半兩分七帖服之全愈乃痰鬱火熱之症也大還一人鼻中流臭黃水腦亦痛名控腦沙有蟲食腦中用絲瓜藤近根三五尺許燒存性為細末酒調服即愈又灸法𩕄㑹在鼻心直上入髮際二寸再容豆是穴通天在𩕄㑹上一寸兩旁各一寸灸七壯隨臭左右灸嘗見灸後去臭肉一塊從鼻中出臭不可言而愈有人卒食物從鼻中縮入腦中介介痛不得出以牛脂或羊脂如指頭大內鼻吸入須臾脂消物逐脂出也治法彚孫文垣治從姪中叔以暑月赴南雍一日假出索茶飲之趣從左鼻逆流而出入腹者十之三治幾一月即粥飯亦多鼻出矣再藥漸加惡心頭暈肌削四支無力診畢詢醫作何症投何劑曰僉謂此疾書所不載治法無稽或云胃火或云諸逆上衝皆屬于火所用非黃連解毒即三黃石膏及諸苦寒之劑自以多飲火酒因動理或為然然竟無效曰治病貴辨經絡之貫通與臟腑之出納豈拘拘徒守方書而已哉經云咽喉者水榖之道路氣之所以上下者也吭顙者分氣之所泄也人之涕出不收者吭嗓不開也此症亦類是耳吭嗓不開故氣上而不下㑹厭弱而不能掩其氣喉夫鼻與氣喉相通惟不掩故飲食逆從鼻竅而出不見常人偶氣逆則飲食從噴嚏出乎今右脉緩弱無力氣虛明矣經云形寒飲冷則傷肺脾胃喜溫而惡寒因多服寒凉所以惡心頭暈肌消也蓋肺屬金而主氣金氣旺則收斂下降氣下降則飲食自不逆矣以六君子湯加辛夷桑白皮苡仁沈香一進而勢緩三進而止大半七劑全安王執中母氏久病鼻乾有冷氣問諸醫者醫者亦不曉但云病去自愈既而病去亦不愈也後因灸絶骨而漸愈執中亦常患此偶絶骨微疼而著艾鼻乾亦失去初不知是灸絶骨之力後閲千金方有此症始知鼻乾之去因絶骨也若鼻涕多宜灸𩕄㑹前頂大人小兒之病初無異焉許知可自停飲食已必嚏服棗膏丸而愈本事方孫氏姑鼻不聞香臭有年矣後因他病友人繆仲淳為處方每服用桑皮至七八錢服久而鼻塞忽然通矣未選入鼻淵沈晉培年三十許患鼻淵黃濁如膿時醫以為風熱上淫于腦與薄荷辛夷川芎蒼耳白芷蔓荆古方治之不效反增左邉頭痛所下涕亦唯左鼻孔多就診曰此肝火上炎為病耳與生熟地杞子沙參麥冬十餘劑而愈是症由傷風用力去涕而得者易愈若因火盛而成必由水虧而致蓋肝脉上絡顛頂與督脉㑹腦為髓海為龍火鬱蒸故濃濁腥穢源源而下有若淵然久之督脉之髓亦隨輸泄致成勞損者有之醫學自立齊以前宋元明初諸公未詳肝腎之治至我國朝諸老亦漸講明然多雜耆术桂附惟集靈膏一方最善治法彚載之但云吳中一醫用之所向神效是亦知其然而未知其所以然也故守兔園一册者其覆餗多矣一瞽者徐姓年三十來鼻淵年餘醫亦與辛散服之覺反甚遂堅守不藥之戒此瞽人心靜自能消息病情故不為庸手所誤後遇豫教服集靈膏十餘帖而愈一費氏子年二十餘亦患此時師與辛夷蒼耳芎芷荆薄之屬至百二十劑後就診于豫兩手脉神氣索然告以不可治矣果月餘而殁續名醫類案卷二十二
