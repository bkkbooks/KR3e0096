body:
  text: 續名醫類案卷十七錢塘魏之琇撰癱瘓竇材治一人病半身不遂先灸關元五百壯一日二服八仙丹五日一服換骨丹覺患處汗出來日病減四分一月全愈再服延夀丹半斤保元丹一斤五十年病不作千金等方不灸關元不服丹藥惟以尋常藥治之雖愈難久一人患左半身不遂六脈沉細無力竇曰此必服峻利之藥損其真氣故脈細沉病者云前月服捉虎丹吐涎二升此後稍輕但未全愈耳竇歎曰中風本因元氣虛損今服吐劑反傷元氣目下雖減不數日再作不復救矣不十日果大反復求治雖服丹藥竟不能起余嘗行衡州道中遇醴陵尉自衛陽方回以病歸問其得疾之由曰某食豬肉入山既深無肉可以食偶從者食穿山甲肉因嘗數臠舊有風疾至是復作今左手足廢矣因以匣中風藥遺之後半月聞其人頓愈及至永州觀圖經曰穿山甲不可殺於隄岸血一入土則隄岸不可復塞蓋能透地脈也如此尉因誤食致病而旬日痼疾盡愈亦可怪也今人用以通婦人脈甚驗醫説萬鎡家貧折字度日得末疾以帛絡臂于項左手執杖而行服藥不效一日遇吕純陽謂曰汝少饒今澀怒盛於肝以致生火其如雷擊風旋二氣不合是以火不生土而土焦土不生金而金鑠金不尅火火反尅之子孫拂意方致汝蹶血氣停滯於脈絡乃致如此因以手捫腰臂曰痠乎曰不又再捫至膝曰痠矣曰此乃環跳穴所在汝既知痠他日將棄此杖矣又見鎡手有懸帛又將手向衣內上下捫者三曰幸瘦不害汝五臟俱火不必餌藥惟武彞茶能解之茶以東南枝者佳採得烹以澗泉則茶豎立若以井水則橫還居數日忽不知手舉足步矣續金陵瑣事李時珍治一人偏風手足不舉用萆麻油同羊脂麝香鯪鯉甲即穿山甲等藥煎作摩膏日摩數次一月餘漸復兼服搜風化痰養血之劑三月而愈又一人病手臂一塊腫痛亦用萆麻搗膏貼之一夜而愈本草綱目薛立齋治一婦人性善怒常自汗月經先期以為肝火血熱不信乃泛用降火之劑反致月經過期復因勞怒口噤呻吟肢體不遂六脈洪大面目赤色用八珍麥冬五味山梔丹皮數劑漸愈兼用逍遙散六味丸各三十餘劑全愈一婦人因怒患痰厥而蘇左手臂不能伸手指麻木口喎眼邪痰氣上攻兩腿骨熱或骨中痠痛服烏藥順氣散之類諸症益甚不時昏憒更加內熱晡熱此肝經血虛內熱生風前藥復耗肝血虛火熾盛而益甚也先以柴胡梔子散調養肝經氣血數日後用八珍湯加鈎藤鉤散諸症稍愈又用加減八味丸料少加酒炒黃蘗知母黑色者數劑諸症頓退乃服八珍柴胡梔子散半載而痊後勞役即有復作之意服柴胡梔子散遂安至正十二年某月括蒼葉仲剛氏居天台郡為府史且二歲一日病肢體不隨衆醫皆以為洞風謂風洞徹四肢也療之不能愈請于施敬仲敬仲診其脈曰病積於身有日矣為大劑飲之不詢日遂愈人咸神異其故敬仲曰某所以知仲剛病者切其脈大而來徐是積熱盤鬱於內久不得發卒與風遇其病當作吾以脈治之而愈何神異焉白雲集醫説續編王肯堂治一人右手足偏廢不起牀二年矣久服順氣行痰之藥不效至夜神志輒昏度不可支服十全大補即覺清明數日能扶䇿而起無何能舍策而步矣經云邪之所湊其氣必虛但治其虛不理其邪而邪自去也李東垣治陜帥郭巨濟病偏枯二指著足底不能伸以長針刺委中深至骨而不知痛出血一二升其色如黑又且繆刺之如是者六七次服藥三月病良愈試效方馮楚瞻治于某患偏枯症右臂浮腫或麻或痛艱於步履或者謂痰謂火謂風多與清涼消尅發散之劑一日忽昏迷不省痰喘潰汗脈之六部沉微此中氣久虛不為峻補反肆尅伐非重劑無以挽回乃用人參六兩炒黃白术四兩生附子一枚去皮薑汁炒水煎一碗灌之汗漸收脈漸起痰喘定而神清調補一月而愈吳孚先治王季衡患左半身不遂或作痛風與發散或作痰治與滚痰丸下數行精神困憊左部沉細而弱此非濕痰死血乃血虛也左屬血然非氣以通之則不流法當從陽引陰上午用四君子湯加黃芪桂枝首烏製附下午用四物湯加秦芁續斷炮薑并加新纓少許取絲有綿綿不絶之形絳有入心化赤之義也治左半身不遂尤宜用之四十帖手能運動倍之足能步履如初近時吳門專以此法欣動愚昧韓貽豐治孔學使尚先患半身不遂步履艱難語言蹇澀音含糊氣斷續為針環跳風市三里各二十一針即下牀自走不煩扶掖筋舒血活無復病楚意惟語言聲音如舊翌日又為針天突膻中十四針遂吐音措詞琅然條貫矣穆大司農和倫先是左手患木風指不能伸屈此半身不遂之兆也召韓治為用七針指即伸縮無恙逾兩月復患腿疾必持杖而行因力辭乞休己而韓為針環跳風市三里針數次而疾頓瘳遂視事如故喻嘉言治季蘅翁將七旬半身不遂已二載病發左半口往右喎昏厥遺尿初服參芪頗當惑於左半屬血不宜補氣之説幾至大壞雲間施立澤以參療之稍安然概從溫補未盡病情也脈之軟滑中時帶徑疾蓋痰與風雜合之症痰為主風為標也又熱與寒雜合之症熱為主寒為標也平時手冷如冰故痰動易厥厥已復蘇嘔去痰眠食自若冬月頗能耐寒可知寒為外顯之假寒熱為內藴之真熱熱蒸為痰阻塞竅隧故衛氣不周外風易入加以房帷不節精氣內虛與風相召是以雜合而成是症耳今欲大理右半脾胃之氣以運出左半之熱痰虛風非溫補一端所能盡也夫治雜合之病必須用雜合之藥而隨時令以盡無窮之變如冬月嚴寒身內之熱為寒所束不得從皮膚外泄勢必寒入筋骨為害矣故用薑附以暫徹外寒而內勢反得宣泄若時令之熱與內藴之熱相合復助以薑附三熱交煽有灼筋腐肉而已凡治一偏之病法宜從陰引陽從陽引陰從左引右從右引左以參术為君臣以附子乾薑為佐使寒月可恃無恐以參术為君臣以羚羊柴胡知母石膏為佐使而春夏秋三時可無熱病之纍然宜刺手足四末以泄榮血而通氣恐熱痰虛風久而成癘也朱丹溪治一肥人憂思氣鬱右手癱口喎與補中益氣湯加半夏竹瀝薑汁煎服程雲來曰里中一老醫右手足廢不能起於牀者二年矣忽遇諸塗詢之曰吾之病幾危始服順氣行痰之劑了無應薄暮則神志輒昏度不可支令家人煎進十全大補湯即覺清明遂日服之浹數日能杖而起無何則又能舍杖而步矣經云邪之所湊其氣必虛吾治其虛不理其邪而邪自去吾所以獲全也余曰有是哉使進順氣疏風之劑不輟者墓木拱矣然此猶拘於成方不能因病變通隨時消息故奏功稍遲使吾為之當不止是也程雲來醫腵巵言據程説只用大劑人參有疾者宜竹瀝少加薑汁佐之其用四物二陳膽星天麻者大謬痿米南宫五世孫巨秀亦善醫嘗診史相脈未發史謂之曰可服紅丸子否米對以正欲用此亦即愈史病手足不能舉朝謁遂廢樞中要務運之帷榻米謂必得天地丹而後可丹頭偶失去歷年莫可訪尋史病甚召米於常州至北關登舟買飯偶見有售拳石於肆者頗異米即而玩之即天地丹頭也史當未死鬼神猶相之問售者爾自何致此曰去年有人家一嬭子以售米因問厥值售者漫索錢萬米以三千酬值持歸調劑以供史史未敢嘗有閽者亦疾痿試服即能坐起又能起步史始信而餌之身即輕及史疾再殆天地丹已盡遂薨於賜第葉紹翁四朝聞見録張子和治武辨宋子玉因駐軍息城五六月間暴得痿病腰胯兩足皆不任用躄而不行求治於張張察其脈俱滑之而有力張憑內經火淫於內治以鹹寒以鹹水越其膈間寒熱宿痰新者為熱舊者為寒或宿食宿飲在上脘者皆可涌之宿痰既盡因而下之節次數十行覺神志日清飲食日美兩足漸舉腳膝漸伸心降腎升便繼以黃連解毒湯加當歸等藥又瀉心湯涼膈散柴胡飲子大作劑煎時時呷之而愈直斷曰痿病無寒多發五六七月若誤作痺與腳氣治之用烏附乳沒自然銅威靈仙之類燔針艾火湯煮袋蒸痿弱轉加如此而死者豈亦天乎李成章治一人病痿李察諸方於治法合而不效疑之忽悟曰藥有新陳則效有遲速此病在表而深非小劑能愈乃熬藥二鍋傾缸內稍冷令病者坐其中以藥澆之踰時汗大出立愈明史龔子才治一人兩足痿弱不能動止以鹿茸人參各五錢又銼一劑水煎空心溫服連進數服而愈孫文垣治徐氏子年弱冠肌肉瘦削尻膝腫大手肘肩顒皆腫腫處痛熱或作風與濕痰及鶴膝鼓捶風治病轉甚診之六部皆弦其色青而白飲食少時當長至曰此筋痿也諸痿皆不可作風治病轉甚者以前藥皆風劑耳風能傷血血枯則筋愈失養况弦脈乃肝木所主攙前而至是肝有餘而脾土受尅脾傷則飲食少而肌肉削也經曰治獨取陽明陽明者腸與胃也法當滋補腸胃俾飲食日加臟腑有所稟受營衛流行氣煦血濡調養至春君火主事之時宗筋潤而機關可利也以五加皮苡仁甘草蒼耳子枸杞回陽人參杜仲黃蘗黃芪防風服二十劑而精神壯腰膂健飲食加惟間夢遺去杜仲加逺志當歸三十帖全愈易思蘭治一婦人年十九稟賦怯弱庚辰春因患痿疾臥榻年餘首不能舉形瘦如柴髮結若氊起便皆賴人扶一粒不嘗者五月惟日啖甘蔗汁而已服滋隂降火藥百帖不效有用人參一二錢者輒喘脹不安其脈六部俱軟弱無力知其脾困久矣以補中益氣湯加減治之而人參更加倍焉服二劑遂進粥二盞雞蛋二枚後以強筋健體之藥調理數月飲食步履如常全愈陸養愚治王庚陽中年後患手足拘攣屈伸不利以風濕治不效脈之左手細數重按則駛右手稍加重按亦弱告曰始偶不謹而胃寒便發寒熱口苦筋骨疼痛服發散藥寒熱除而口苦疼痛不減至月餘先左足拘攣難以屈伸漸至右足亦然又漸至兩手亦然手更振掉不息醫數十人不外疏風順氣及行氣行血而已數月前少能移動而振動疼痛不可忍今雖不能移動幸不振掉疼痛曰若不疼痛大事去矣曰不移動則不痛若移動極其痠痛曰幸尚可藥此筋痿症也必少年房帷間曾有所思慕而不得遂否曰早年一婢其色頗妍因昵之拙荆覺而私黜他方後極想念半年間欲事反縱嘗患遺精白濁今陽事久不起矣曰內經痿論肝氣熱則膽泄口苦筋膜乾筋膜乾則筋急而攣發為筋痿由思想無窮所願不得意淫於外入房太甚宗筋弛縱發為筋痿及為白淫又曰筋痿者生於疾使內也蓋思願不遂遇陰必恣風寒乘虛襲之不覺中年後血氣既衰寒變為熱風變為火消精爍髓而病作醫又以風熱之藥治之重耗其血筋無養不能束骨而利機關而病轉劇所幸飲食未減大便猶實蓋痿症獨取陽明陽明盛則能生氣生血用當歸地黃參芪白术丹皮黃蘗青蒿山萸枸杞牛膝少加蓁芁桂枝羌活獨活煎服又以紫河車鹿角龜板虎脛骨熬膏酒服兩許調治一月而起李士材治朱太學八年痿廢屢治無功診之六脈有力飲食如常此實熱內蒸心陽獨亢症名脈痿用承氣湯下六七行左足便能伸縮再用大承氣又下十餘行手中可以持物更用黃連黃芩各一斤酒蒸大黃八兩蜜丸日服四錢以人參湯送一月之內去積滯不可勝數四肢皆能展舒曰今積滯盡矣煎三才膏十斤與之服畢而痊倪文學四年不能起於牀李治之簡其平日所服寒涼者十六補肝腎者十三診其脈大而無力此營衛交虛以十全大補加秦芁熟附各一錢朝服之夕用八味丸加牛膝杜仲遠志萆薢虎骨龜板黃蘗溫酒送下七錢凡三月而機關利高兵尊患兩足痠軟神氣不足向服安神壯骨之藥不效改服滋腎牛膝苡仁二妙散之屬又不效純用血藥脾胃不實診之脈皆沖和按之亦不甚虛惟脾部重取之澀而無力此上虛下陷不能制水則濕氣墜於下焦故膝脛為患耳進補中益氣倍用升麻數日即愈夫脾虛下陷之症若誤用牛膝等下行之劑下愈陷此前藥之所以無功也喻嘉言治徐嶽生軀盛體充昔年食指因傷見血冷水灌之血凝不散腫潰出濃數升小筋脫出三節指廢不伸後兩足至秋畏冷重綿蔽之外拊仍熱內揣覺寒近從踵至膝後筋痛不便逺行醫令服八味丸深中其意及診自云平素脈難摸索乃肝肺二部反見洪大大為病進時在冬月木落金寒猶為不宜八味丸之桂附未可輕服蓋筋者肝之合也附金之血既經食指外傷不能榮養筋脈加以忿怒數動肝火傳熱於筋足跗之大筋得熱而短是以牽強不便於行也然肝木所畏者肺金故必肺氣先清周身氣乃下行今肺脈大則為心主所傷而壅窒是以氣不下達而足寒也所患雖微已犯三逆平素脈細而今大一逆也肝脈大而熱下傳二逆也肺脈大而氣上壅三逆也設以桂附治之壅熱愈甚即成痿痺矣故治此患先以清金為第一義清金又以清胃為第一義胃不清則飲酒之熱氣厚味之濁氣咸輸於肺矣藥力幾何能勝清金之任哉金不清如大敵在前主將懦弱已不能望其成功况舍清金而更加以助火爍金倒行逆施以為治耶必不得之數矣原注後徐仍服八味一月餘竟成痿痺卧牀一載聞最後陽道盡縮小水全無乃肺經之氣先絶於上所以致此錢叔翁形體清瘦平素多火少痰邇年內藴之熱蒸濕為痰夏秋間濕熱交勝時忽患右足麻木冷如冰石蓋熱極似寒誤以牛膝木瓜防已加皮羌獨之屬溫之甚且認為下元虛憊誤用桂附河車之屬補之以火濟火以熱益熱由是腫潰出膿水浸淫數月足背趾踵廢而不用實為痿之變症總為誤治使然若果寒痰下墜不過堅凝不散止耳甚者不過痿痺不仁止耳何至腫而且潰黃水淋漓腐肉穿筋耶蓋此與傷寒壞症熱邪深入經絡而生流注同也所用參膏但可專理元氣而無清解濕熱之藥以佐之是以元老之官而理煩繁劇也若與竹瀝同事人參固其經竹瀝通其絡則甘寒氣味相得益彰矣徐某服人參以治虛風誤以附子佐之迄今經脈短縮不便行持亦由不識甘寒可通經絡也今用參膏後脾亦大旺乃日食而外加以夜食是以所生之脾氣不用之運痰運熱只用之運食誠可惜也近者食亦不易運以助長而反得衰乃至痰飲膠結胸中為飽為悶為頻咳而痰不應豫常見肺熱之人雖産婦服參亦多此症總為脾失其健不為胃行津液而飲食反以生痰漸漬充滿肺竅咳不易出皆由內熱之故與脾却無與雖以治痰為急然治痰之藥大率耗氣動虛恐痰未出而風先入也惟是確以甘寒之藥杜風消熱潤燥補虛豁痰乃為合法至於辛熱之藥斷斷不可再誤矣醫者明明見此輒用桂附無算想必因膿血易乾認為辛熱之功而極力以催之結局耳可勝誅哉按此症實為肝經燥火鬱於脾土而成世罕知者即喻君亦以膿水浸淫認為濕熱豫有治黃淡翁案附後盧不逺治織造劉監病痿一年欲求速效人亦以旦暮效藥應之二月診之六脈細弱血氣大虛而其性則忌言虛以已為內家也然多畜夫近侍之美者此即內經所謂思想無窮所願不得意淫於外入房太甚發為筋痿及為白淫是也乃直謂之曰尊體極虛非服人參百劑不復能愈若所云旦暮效者是欺也不敢附和遂用十全大補湯四劑後乃陽為不用參而陰用之至四月參且及斤藥將百帖而能起矣次年七月疾作再欲用前法加參不信因斷其冬仍痿立春必死果然馮楚瞻治李主政足病疼痛不堪步履少廢醫用腳氣祛風燥濕之劑久服不效飲食不甘精神益憊脈之兩寸洪大而數兩關便弱而尺更微據脈乃上熱中虛下寒也再用祛風燥濕則氣血更受傷矣夫治痿獨取陽明而脾主四肢筋主肝腎主骨則足三陰宜並重焉羽翼軒岐誠在此等餘子紛紛不足數也乃與重劑熟地麥冬牛膝五味製附子炒黃白术加杜仲另煎參湯沖服十餘劑漸愈再用生脈飲送八味丸加牛膝杜仲鹿茸丸及歸脾湯全瘳孫文垣治一文學兩足不痠不痛每行動或狃於左而又墜於右或狃於右而又墜於左之字而行不能正步此由筋軟不能束骨所致夫筋者肝之所主肝屬木木縱不收宜益金以制之用人參黃芪白芍以補肺金苡仁虎骨龜板杜仲以壯筋骨以鐵華粉專制肝木蜜丸蚤晚服之竟愈然則此亦筋痿病也邱太守姪丁年患兩手筋攣指掉不能伸屈臂內肉削體瘠面白寢食大減脈之六部俱弦重按稍駛自去冬偶發寒熱筋骨疼痛至仲春寒熱退而筋骨之疼不減藥無虛日甚則日三四進僉謂是風而治不效孫謂此筋痿症也乃少年多欲且受風濕邪氣乘虛而入醫者不察天時不分經絡概行汗之仲景治風濕之法但使津津微汗則風濕盡去若汗大出則風去而濕存由是氣血俱虛經云陽氣者精則養神柔則養筋虛則筋無所養漸成痿弱乃不足之病古人皆謂諸痿不可作風治誤則成痼疾曰服風藥已二百劑矣顧今奈何曰幸青年猶可圖也法當大補氣血經云氣主拘之血主濡之血氣旺則筋柔軟筋柔軟則可以束骨而利機關又何攣掉之有以五加皮苡仁紅花人參鹿角膠龜板虎骨當歸丹參地黃骨碎補蒼耳子之類服兩月肌肉漸生飲食大進兩手攣掉亦瘳黃履素曰余己酉夏應試南都與姊丈吳公甫聨社課藝見公甫步履微有不便云苦腿痛精神固無恙也聽庸醫之言以為風濕專服祛風燥濕之劑形容日稿八月間見咯血之症肌肉盡削至冬而殁即此驗之則腿足痠痛不可概作風治也益明矣腿足皆是三陰部位多係肝腎陰虛法宜滋補顧反服風藥以耗之寧不速其死張三錫治一蒼瘦人每坐輒不能起左脈微弱右關寸獨弦急無力因酒色太過所致用丹溪加味四物湯不二十劑愈後服鹿角膠調理一人體厚二足行履不便時作眩暈以大劑二陳加南星二术黃蘗黃芩入竹瀝薑汁數劑頓愈作痰治一人自覺兩足熱如火灸自足踝上下衝腿膝且痿弱軟痛脈濡而數乃濕熱挾虛也以蒼术黃蘗為君四兩牛膝二兩龜板虎脛骨漢防已各一兩當歸二兩人參二兩山藥糊丸桐子大每服一百丸空心鹽湯下古方加附子一老人痿厥用虎潛丸不應後於虎潛丸加附子遂愈蓋附反佐之功也一人兩足沉重不能舉六脈沉數詢之平居痛飲遂作濕熱治乃以四苓二妙加牛膝木通防已數服漸減用健步丸調理而安薛立齋治舉人于尚之素腎虛積勞足痿不能步履後舌瘖不能言面色黧黑謂此腎氣虛寒不能運及所發用地黃飲子治之而愈後不愼調攝而復作或用牛黃清心丸之類小便祕澀口舌乾燥仍用前飲及加減八味丸漸愈又用補中益氣湯而痊冢宰劉紫岩因勞下體軟痛發熱痰甚用清燥湯入竹瀝薑汁服之熱痛減半再劑而全愈張路玉治勞俊卿年高攣廢或用木瓜獨活防已威靈仙莃蘞之類半年餘致跬步不能移動或令服八味丸亦不應脈之尺中微浮而細時當九夏自膝至足皆寒冷如從水中出知為腎虛風雨所犯而成是疾遂與安腎丸方終劑能步履連服二料絶無痿弱之患矣陸養愚治施鳳岡母年及五旬患四肢削而微腫腕膝指節間腫更甚筋外露而青向來月事後必煩燥一二日因而吐血或便血一二日服涼血藥丹皮生地芩連之類三劑方止若不服藥則去血必多近來天癸既絶血症亦減而肢節之症作矣史國公藥酒服之無效數年間蒼术烏附羌防莃蘞及活絡諸湯驅寒勝濕之劑皆遍服且今飲食便溺動輒須人攣痛猶不可忍脈之六部微澀兩尺緩溺猶甚曰始因過用寒涼損其肝氣繼則多用風燥耗其肝血肝主筋今氣血俱虛筋失其養故腫露而持行俱廢也用人參當歸川芎首鳥少佐肉桂秦芁為煎劑以虎潛丸料倍鹿角膠為丸服月餘而減三月而行持如故半年全瘳朱丹溪治鄭安人年六十虛而有痰脈緩足弱與半夏天麻白术湯下酒芩丸愈一士夫因腳弱求診兩手俱浮洪稍鼓飲食如常惟言問不答肌上起白屑如麩片時在冬月作極虛處治詢其弟乃知半年前曾於背臂腿三處自夏至秋冬節次生疽率用五香連翹湯十宣散與之今結痂久矣為作參芪白术當歸膏以二陳湯化飲之二日後盡藥一斤白屑沒者大半病者自喜呼吸有力補藥應效以漸而病家反怨藥不速應自作風病論治煉青蒙石二錢半以青州白丸作料煎飲子頓服之阻之不聽因致不救書以為警云痿症作風治多死薛立齋治一婦人患血痔兼腿痠痛似痺此陰血虛不能養於筋而然也宜先養血為主遂以加味四斤丸治之愈一老人筋攣骨痛兩腿無力不能步履以局方換腿丸治之而愈一婦人筋牽痺縱兩腿無力不能步履以三因勝駿丸治之而瘥河間云腳氣由腎虛而生然婦人亦有病腳氣者乃因血海虛而七情所感遂成斯疾今婦人病此亦衆則知婦人以血海虛而得之與男子腎虛類也男女用藥固無異更當兼治七情無不效也因虛而成故以入痿姚僧垣治金州刺史伊婁穆自腰至臍似有三縛兩腳緩縱不復自持僧垣為診脈處湯三劑穆初服一劑上縛即解次服一劑中縳復解又服一劑三縳悉除而兩腳疼痺猶自攣弱更為合散一劑稍得屈伸僧垣曰終待霜降此患當愈及至九月遂能起行周書琇按此即春夏劇秋冬差之痿症也張子和曰宛丘軍校三人皆病痿積年不瘥腰以下腫痛不舉遍身瘡疥兩目昏暗脣乾舌燥求治於張張欲投㵼劑二人不從為他醫溫補之藥所惑皆死其同病有宋子玉者俄省曰彼以熱死我其改之竟從治之而愈張曰諸痿獨取陽明陽明者胃與大腸也此言不止謂針也針與藥同也王執中曰列子載偃師造偈云廢其腎則足不能行人患此蓋腎有病也當灸腎俞或一再灸而不效宜灸環跳風市犢鼻膝關陽陵泉隂陵泉三里絶骨等穴但按略痠痛處即是受病處灸之無不效也資生經施靈修有一里人喜酒卧牀褥者三年靈修憐而索方于仲淳仲淳親診之知其酒病也夫酒濕熱之物多飲者濕熱之邪貫於陽明濕熱勝則下客於腎而為骨痿昔人治痿病取陽明以五味子為君黃連為臣麥冬乾葛扁豆為佐服之愈廣筆記立齋治一人年逾五十筋骨軟痿卧牀五年遍身瘙癢午後猶甚以生血藥治之癢漸愈痿少可更以加味四斤丸治之調理謹守年餘而痊河間云熱淫於內而用溫補藥何也蓋陰血衰弱不能養筋筋緩不能自持陽燥熱淫於內宜養陽滋陰陰實則水升火降矣錢國賓治龍泉沈士彥平生無病肝氣不平過五八腿無故而軟由軟至癱由癱至攣臥牀不起矣遍寫病狀與知識求醫答之曰能直不能屈者其病在骨能屈不能直者其病在筋筋舒則無病矣內經云心生血肝藏血公平生肝薄多怒血不能養筋筋不能束骨耳久則冷痺而攣彼聞此論遣使求方用臍帶紫河車為君人乳枸杞何首烏為臣芎歸地芍牛膝紅花為佐使血旺則養筋筋和則束骨此藥作丸服矣外取童便數升盛大鉢內以腿放鉢上鉢放腿下另置炭火一爐用新瓦三四片每片打二三塊燒紅淬童便內更易不論次數以取熱氣熏筋約一時止之次日再如此半月筋舒一月能步二月能走矣童便味鹹寒鹹能軟堅又能走血消瘀經云血不足者補之以氣謂陰生於陽也又經火氣熱散筋骨冷痺藉瓦引導筋骨之分治法深奧得竅者知之張玉書子年近三十忽寒熱頭痛時師謂傷寒也蠻治月餘後竟不知為何病唯晝夜喊叫痛極延診問何遲曰人皆謂先生專用補渠係傷寒故不敢請頷之入視見病人尸卧在牀髮長覆額面垢鼻煤皮枯肉臘狀如竒鬼脈之弦而堅左關尺殊澀數詢其痛處起自臀側下連趾踵肩背頭腦亦時抽痛僵直莫能動動則欲死乃謂其父曰此筋骨兼痿之候也若蚤補何至此極此由少年不愼接內之後即逺行勞役三陰受傷今痛自還跳穴下連大敦隱白涌泉蓋三穴為肝脾腎所主至連肩背頭腦皆掣痛督脈亦傷矣其母私問之果以內後因事疾走江干歸而病發其父曰洵如是已誤治許時今奈何曰幸少年血氣易復第需服藥百劑否則雖愈必跛也與肉蓯蓉生熟地杞子米仁當歸牛膝紅花丹皮蔞仁麥冬之屬十劑能起坐又十劑可杖而行其父素慳吝見病已起遂勿藥後果一足筋短一二寸至今行路傾敧吳太宜人年六旬外病經絡抽掣上連顚頂肩項下至腰腹腸脅莫不牽痛背脹頭昏口燥心忡便數食減兩手極熱常欲冷水浸之診得脈弦急而疾曰症即多端均由肝火盛而血液虧筋燥失養久之則成痿矣但濡以潤之可立愈也與養青湯加米仁蔞仁當歸女貞等十劑而痊痛痺方勺云一人遍體作痛殆不可忍都下醫或云中風或云中濕或云腳氣藥悉不效周言亨言是血氣凝結所致用元胡索當歸桂心等分為末溫酒服三四錢隨量頻進以止為度遂痛止蓋元胡索能活血化氣第一品藥也其後趙待制霆因導引失節肢體俱攣亦用此數服而愈泊宅編本草綱目錢乙本有羸疾每自以意治之而後甚歎曰此周痺也入臟者死吾其已夫既曰吾能移之使在末因自製藥日夜飲之左手或攣不能動喜曰可矣遂親登東山得茯苓大踰斗以法噉之盡由是雖偏廢而風骨得堅如全人張子和治一衲子因陰雨卧濕地一年手足皆不隨若遇陰雨其病轉加諸醫皆作中風偏枯治之用當歸白术乳香沒藥之類久反大便澀風燥生經歲不已張以舟車丸下之三十餘行去青黃沫水五升次以淡劑滲泄之數日手足皆舉張曰夫風濕寒之氣合而成痺水痺得寒而浮畜於皮腠之間久而不去內舍六府曰用去水之藥可也水濕者人身中之寒物也寒去則血行血行則氣和氣和則愈矣邉校白公以隆暑時飲酒覺極熱於涼水池中漬足使其冷也為濕所中股臍沈痛又因醉卧濕地其痛轉加意欲以酒解痛遂連朝而飲反成赤痛發間止且六七年往往斷其寒濕腳氣以辛熱治之不效或使服神芎丸數服痛微減他日復飲疾作如前睪囊癢濕腫硬臍下似有物難於行張曰豫亦斷為寒濕但寒則陽火不行故為痛濕則經墜有滯故腫先以苦劑涌之次以舟車丸百餘粒濬川散四五錢微一兩行張曰如激劑尚不能攻况與熱藥補之乎異日又用神祐丸百二十丸通經散三四錢又來日以神祐八十丸投之續見一二行又次日服益腎散四錢舟車百餘粒約下七八行已覺膝睪寒者暖硬者軟重者輕也腫者赤退飲食加進又以涌之其病全瘳以疏風丸方與之此不肯妄服辛熱故可治也梁孺人年六十餘忽曉起梳髮覺左指麻斯須半臂麻又一臂麻斯須頭一半麻比及梳畢從脅至足皆麻大便二三日不通醫皆云風也或藥或針皆不效左手三步脈皆伏比右手小三倍此枯澀痺也不可純歸之風亦有火燥相兼乃命一涌一泄一汗其麻立已後以辛涼劑調之潤燥之劑濡之惟小指次指尚麻張曰病根已去此餘烈也方可針豁谷豁谷者骨空也一日清和往針之用靈樞中雞足法向上卧針三進三引訖復卓針起向下卧針送入指間皆然手熱如火其麻全去劉河間作原病式常以麻與澀同歸燥門中真知病機者也琇案燥為六氣之一其為病至夥而烈然皆病成而變者為多故皆散入諸症不能專立一門一貧人病濕痰腫痛經年不能行遇乞食道人授一方用莃蘞草水紅花蘿蔔纓白金鳯花水龍骨花椒槐條甘草蒼术金銀花共十味煎水蒸患處水稍溫即洗之此方已醫好數人續金陵􅖰事周漢卿治諸暨黃生背曲須杖行他醫皆以風治之漢卿曰血澀也刺兩足崑崙穴頃之投杖去明史朱丹溪治何縣長年四十餘形瘦性急因作勞背痛臂疼骨節疼足心發熱可與四物湯帶熱下大補丸保和丸共六十粒食前服許知可在歙川有一貴家婦人遍身走注疼痛至夜則發如蟲囓其肌多作鬼邪治許曰此正歷節症也以麝香丸三服愈此藥專治白虎歷節風疼痛逰走無定狀如蟲行晝靜夜劇本事方醫説續編陳良甫治一婦人先自兩足踝骨痛不可忍次日流上於膝一二日流於髀骨甚至流於肩肩流於肘肘流於後溪或如鎚鍛或如蟲嚙痛不可忍晝靜夜劇服諸藥無效召僕診之六脈緊曰此真歷節症也非解散之藥不能愈但用小續命湯一劑而效鄧安人夏月亦病歷節痛不可忍諸藥不效良甫診之人迎與心脈虛此因中暑而得之合先服酒蒸黃連丸衆醫莫不笑用此藥一服即愈自後與人良驗良方宋青龍中司徒顔奮女苦風疾一髀偏痛有人令穿地作坑取雞矢荆葉然之安脛入坑中熏之有長蟲出遂愈也范注方本草綱目龔子才治張太僕每天陰即遍身痛如鎚刺已經數年左脈微數右脈洪數乃虛血有濕熱也以當歸拈痛湯加生地白芍黃蘗去人參數劑而瘳張子和治麻先生妻病食指痛不可忍酒調通經散一錢半夜大吐吐畢而痛減因歎曰尚見陳五曾病此醫以為小蟲傷或以草上有毒物因觸之遷延數月膿盡方已今日觀之可以大笑孫真人云豫以貞觀五年七月十五日夜以左手中指背傍著庭木至曉痛不可忍經十日痛日深瘡日髙大色如熟小豆色常聞長者之論有此方遂依治之手下即愈痛亦除瘡亦即瘥未十日而平復楊炎南行方著其效云其方取蒲公草搗傅腫上千金方序琇按上二症即世俗所謂木蛇咬也張説似不然之虞天民治一男子四十歲因感風濕得白虎歷節風症遍身抽掣疼痛足不能履地者三年百方不效身體羸瘦骨立自分必死一日夢與木通湯服愈遂以四物湯加木通服不效後以木通二兩銼細長流水煎汁頓服服後一時許遍身癢甚上體發紅丹如小豆大粒舉家驚惶隨手沒去出汗至腰而止上體不痛矣次日又如前煎服下體又發紅丹方出汗至足底汗乾後通身舒暢而無痛矣一月後人壯氣復步履如初後以此法治數人皆驗潘塤曰豫少時讀書郡學夏月洗足風濕搏於右足外踝注痛十餘年足跟不仁宦逰北方少愈歸老又發前後幾四十年沉痼之疾也嘉靖丁未右臂亦遭此患牽連上下手腕及指將成偏痺用藥宣通驅逐敷貼攻尉百不效蓋風邪入於骨藥力莫能逹也豫思骨必有竅喘息呼吸百骸相通邪氣因乘虛而入亦可引之而出又思手居上體出路頗近先從手臂試之乃澄心靜慮每夜側卧右臂向上伸手平軃以意從肩井骨竅中步步存想而下直至指尖復徐徐引氣而上過兩腕直至肩井旁分一路穿頸入喉出口細細吐之每夜如是行者往復十餘遍倦則止行之二三夜意熟路通又四五夜覺骨竅中有一線氣隨意想上行微微牽痛至十數夜覺肩井紅腫生小瘡而腹亦微痛蓋惡氣上衝肩井旁一路由喉下墜入腹不能盡從口中吐出也乃用拔毒膏貼肩井瘡潰而成膿腹自利二三遍痛止而右臂豁然通矣因思足外踝歲雖久而病根發道路雖逺而骨竅相通亦如前法側卧伸足以意存想以漸引氣過膝穿腿入腹則惡氣注腹而大痛口不及引之而出也忽一日大㵼四五遍臭味極惡而足病亦瘳此殆神啓愚衷獨得靈異之訣至妙至妙者歟而昔人未之有行也楮記室琇按此與景嶽之父導痰飲之法頗同宜參閲張案在飲門孫文垣治姚畫老夫人年幾七十右手痛不能上頭醫者皆以中風治不效益加口渴煩躁診之右脈浮數左平曰此濕痰生熱熱生風也治宜化痰清熱兼流動經絡乃瘳也二陳湯倍加威靈仙酒芩白僵蠶秦芁四劑病去吳少溪有酒積常患胃脘痛近又腰眼足根肢節皆痛孫曰此由濕熱傷筋脾肺痰火所致法宜清肅中宫消痰去濕俾經絡流通筋骨自不疼矣切不可作風痛而用風劑以二陳湯加威靈仙蒼术黃蘗五加皮枳實葛根山梔進之肢節痛減改用清氣化痰丸加瓦楞子蒼术枳實薑黃竹瀝神麯打糊為丸調理而安李妓體素肥患痛風自二月起至仲冬諸治不效六脈大而無力手足肢節腫痛兩胯亦痛不能起止肌肉消半日僅進粥二碗月汛兩月一行曰此行痺也以人參白术苡仁各三錢當歸枸杞杜仲龜版蒼耳子各二錢晚蠶沙秦芁防風各一錢附子甘草桂枝黃蘗各五分五帖痛止腫消改用歸芍六君子加苡仁丹參紅花石解紫荆皮三十帖全愈案中孫鬍為友人泥此妓無力贖之孫乃力肩治愈設法卒歸其人為良家婦兹以文繁節之崔百原年餘四十為南勳部郎患右脅痛右手足筋骨俱痛艱於舉動者三月醫作偏風治之不效孫視其色蒼神固性多躁急脈左弦數右滑數時當仲秋曰此濕痰風熱為痺也脈之滑為痰弦為風數為熱蓋濕生痰痰生熱熱壅經絡傷其營衛變為風也非假歲月不能愈與二陳湯加鈎藤蒼耳子苡仁紅花五加皮秦芁威靈仙黃芩竹瀝薑汁飲之數日手足之痛漸減脅痛如舊再加鬱金川芎白芥子痛俱稍安囑其愼怒內觀以需藥力遂假歸調養半年而愈夏益吾肢節腫痛手足彎腫痛猶甚不能動止凡腫處甚紅熱先起於左手右足五月後又傳於左足右手此行痺症也且喘咳氣涌不能睡脈之左浮數中按弦右滑數乃濕熱風痰壅遏經絡而然以蒼术薑黃苡仁威靈仙秦芁知母桑皮黃蘗酒芩麻黃服下右手腫消痛減夜服七制化痰丸而嗽止得睡再劑兩足消半左手經渠列缺穴邉腫痛殊甚用苡仁蒼术秦芁甘草花粉五加皮石斛前胡枳殼威靈仙當歸旋服旋愈一婦人年五十餘向來小水短少今則右背鹽匙骨邉一點痛夜猶甚已半月治不效且右邉手肢節皆脹痛筋皆暴起肌肉上生紅點子脈兩手皆滑數右尺軟弱乃濕熱傷筋而成痛痺以東垣舒筋湯為主兩帖而愈族孫壯年患遍身筋骨疼痛肢節腫痛痛處如虎嚙如火燎非三五人不能起居呻吟不食醫投疏風之劑不應又以乳香沒藥活血止痛亦不應診之六脈浮緊而數曰此周痺也俗名白虎歷節風乃濕熱所致丹溪云腫屬濕痛屬火火性速故痛暴而猛以生地紅花酒芩酒連酒蘗秦芁防風羌活獨活海桐皮威靈仙甘草四帖痛減大半再加赤芍當歸蒼耳苡仁去獨活秦芁又八劑全愈陸養愚治孫監司體肥畏熱平時燥浴每以扇代拭後因喪子悲哀不思粥飯惟恣飲自解忽脊背似脹漸及肘膝痠痛醫謂脈氣澀弱骨節痠疼乃血虛火鬱也用四物湯加丹皮山梔香附等十劑不效改用牛膝首烏枸杞輩又十劑亦不效再用鹿膠虎骨河車病如故舉止甚艱時時令人熱手拊摩初則輕按如刺良久雖重亦不痛矣脈極浮極滑診畢以飲症對問出何書曰仲景要略云飲水流行歸於四肢當汗出而不汗出名曰溢飲今聞澡浴不拭是外之水濕浸於皮膚矣又悲憂飲酒內經謂悲哀傷肺肺傷則分布之令失且又過飲則內之水濕能不溢於經絡乎其特甚於陽分部位者外濕不拭陰處熱而易乾陽處冷而難乾又酒性屬陽故其濕亦并溢於陽分也治法溢飲者當發其汗時天氣頗寒令搆一密室四圍生火熱湯置浴桶中今乘腹飽時浴之良久投藥一劑用防風五錢蒼术三錢麻黃蘇葉羌活獨活威靈仙甘草各一錢煎一二沸熱服一滿碗頻添熱湯浴至汗透方止愈時便覺身體寬暢夜間甚安間三日又為之如是五次遍體輕快病全去矣邵南橋子壯年患遍身筋骨疼痛肢節腫脹病處熱如火煅食飲不進呻吟不已其脈浮之而數沉之而澀曰此似白虎歷節症而其因總不出於血虛有火若誤以為風氣投表散燥熱之藥病必增劇用生地當歸白芍紅花酒芩秦芁花粉連翹數劑減半十劑全瘳李士材治陸文學兩足麻木自服活血之劑不效改服攻痰之劑又不效半載後手亦麻左脅下有尺許不知痛癢曰此經所謂著痺也六脈大而無力氣血皆損用神效黃芪湯加茯苓白术當歸地黃十劑後有小效更用十全大補五十餘劑始安王孝亷久患流火靡藥勿嘗病勢日迫李曰經年之病痛傷元氣非大補氣血不可彼曰數日前曾服參少許痛大作故不敢用李曰病有新久之不同今大虛矣而日從事於散風清火清火則痺必敗散風則肺必傷言之甚力竟不能決遂不起一人遍體疼痛尻髀皆腫足膝攣急李曰此寒傷榮血筋脈為之引急內經所謂痺也用烏藥順氣散七劑而減更加白术桂枝一月而愈馮楚瞻治李相國諱之芳當耿逆之變勤勞軍旅左臂強硬作痛上不能至頭下不能撫背醫與驅風活絡不效且大便圓如彈子以書有糞如羊矢者不治深以為憂診之六脈大而遲緩無神知為中氣久虛榮衛不能遍及支末乃有偏枯之象至其大便亦由中氣不足命門火衰以致運行不健轉輸遲滯糟粕不能連接直下猶蜣蜋之轉丸故圓而且大非若關格之病津液燥稿腸胃窄細致黑小如羊糞者然宜空心服八味加牛膝杜仲以培其本食逺以加減歸脾加甜薄桂以壯其標元陽得旺則運行健而大便自調氣血既充則肢節和而臂強自愈矣如法而痊精神更倍盧不逺治張二如病脊膂痛艱於起拜形傴僂楚甚脈之以為精虛須龜鹿四仙膏一大劑服三月方可愈也彼不信越三年再求治用四仙膏一料佐以透冰丹二十粒全愈或問故曰此房後風入髓中骨氣不精故屈伸不利也用透冰以祛腎風用四仙以填骨髓病去精滿百體從令矣顧渠三年之中未嘗不服補精血祛風邪之藥不知藥不可儱侗而用必使之填髓入骨中透風自骨出斯為合法耳孫文垣治程參軍年六十四尚以子嗣服下元藥太多冬月單袴立溪邉督工受寒致筋骨疼痛肩井缺盆腳膝跟踝及骨節動處皆紅腫而痛卧牀三年或認為虛為寒為風為濕百治不效腿間大肉盡消惟骨節合處痛大而痛脈之弦澀有力知為濕熱痰火被寒氣凝滯固澀經絡也所喜目中精神尚在胃氣未全損其小便在器少頃則澄結為砂色紅而濁兩膝下腳指皆生大瘡瘡靨如靴釘狀皆由向服春方所致為先逐經絡凝滯然後健脾消痰俾新痰不生血氣日長後以補劑收功斯得矣以新取威靈仙一斤裝新竹筒中入燒酒二斤塞筒口刮去青皮重湯煮三炷官香為度取出晒乾為末用竹瀝打糊為丸桐子大蚤晚酒送一錢曰服二次五日後大便去稠黏痰積半桶腫痛減大半改以人參石斛蒼术黃蘗苡仁蒼耳子牛膝烏藥葉龜板紅花犀角木通煎服二十帖又用前末藥服三日又下痰積如前之半仍以前藥服半月又服末藥三日腹中痰漸少乃以虎骨晚蠶沙蒼术黃蘗丹參杜牛膝莖葉苡仁紅花五加皮蒼耳子龜板酒打糊為丸梧子大每空心服七八十丸外以丹溪保和丸食後服半年全愈孫質菴患痛風兩手自肩顒巨骨下臂臑上及曲池肘彎處三里上兩足自膝及跟尻腫痛更甚痛處熱火流注也飲食少伏蓐者三年脈之皆弦細而數面青肝色肌瘦火多大小腿肉皆瘦削三隂虛損曰此得之稟氣弱下虛多內以傷其陰也治當養血舒筋使經絡通暢待痛止即以大補陰血之劑實其下元先與五加皮蒼术黃蘗蒼耳子當歸紅花苡仁羌活防風秦芁紫荆皮二十劑筋漸舒腫漸消痛減大半更以生地龜版牛膝蒼术黃蘗晚蠶沙蒼耳子苡仁海桐皮當歸秦芁三十劑腫消全減戒之曰難足而易敗者陰也須痛絶酒色以固根本斯刀圭可恃乃用仙茅為君杞子牛膝鹿膠虎骨人參為臣熟地黃蘗晚蠶沙茯苓蒼耳子為佐桂心秦芁澤㵼為使蜜丸服百日腿肉長完精神復舊薛立齋治一男子先腿痛後四肢皆痛遊走不定至夜益甚服除濕敗毒之劑不應診其脈滑而澀此濕痰濁血為患以二陳湯加蒼术羌活桃仁紅花牛膝草烏治之而愈凡濕痰濕熱或死血流注關節非辛溫之劑開發腠理流通隧道使氣行血和焉能得愈一男子肢節腫痛脈遲而數此濕熱之症以荆防敗毒散加麻黃二劑痛減半以檳榔敗毒散四劑腫亦消更以四物湯加二术牛膝木瓜數劑而愈一婦人兩腿作痛時或走痛氣短自汗諸藥不應診之尺脈弦緩此寒濕流注於腎經也以附子六物湯治之而愈但人謂附子有毒多不肯服若用童便炮製何毒之有况不常服何足為慮薛中氣不足以補中益氣湯加附子服之三年何見其毒也經云有是病用是藥馮楚瞻治唐某患左足左手骨節疼痛勢如刀割旦夕呼號既而移至右手右足皆遍矣或用祛風活絡之劑不效見其口燥咽乾誤作風火投以涼劑幸而吐出神氣疲困六脈洪弦此氣血久虛筋骨失養將成癱瘓之候惟宜大用熟地當歸白芍養血為君銀花秦芁少借風勢以逹藥力於筋骨為臣牛膝續斷杜仲以調筋骨為佐更用桂枝松節以鼓舞藥性橫行於兩臂為引再加參术以固中倍元調理半月漸瘳後以生脈飲送八味丸之加牛膝杜仲鹿茸五味子者四五錢日中仍服前劑始能步履更以大補氣血強筋壯骨之藥以收全功未幾其室人因日夜憂勞亦患是症六脈沉微右手足疼痛既而不流於左而竟攻於裡之胸脘痞悶惡心疼痛欲絶知為內傷日久寒邪不為外逹直中陰分宜急溫之以人參白术各五錢肉桂附子各二錢濃煎徐徐溫服次日脈少起胸中痛悶大減身有微熱左亦略疼此陽氣還表寒邪欲外散之機也照方再服內症漸平惟手足之痛尚在然亦不甚以參术補中為君歸芍養血為臣杜仲牛膝續斷秦芁桂枝舒筋活絡為佐全愈夫痛風止有五痺皮痺脈痺肌痺骨痺筋痺未聞有臟腑之痺也然經曰寒氣勝者為痛痺又曰其留連筋骨間者疼久其留皮膚間者易已其入臟者死可不愼歟薛立齋治一婦人肢節作痛不能轉側惡見風寒自汗盜汗小便短少雖夏亦不去衣其脈浮緊此風寒客於太陽經用甘草附子湯一劑而瘥一婦人月經不調且素有痛風遇勞必作用衆手重按稍止此氣血俱虛用十全大補加獨活而痛痊用六味丸逍遙散而經調一婦人肢體作痛面色痿黃時或赤白發熱惡寒吐瀉食少腹痛脅脹月經不時或如崩漏或痰盛喘咳頭目眩痛或五心煩熱口渴飲湯或健忘驚悸盜汗無寐等症卧牀年許悉屬肝脾虧損氣血不足所致用十全大補加味歸脾兼服月餘諸症悉痊張仲景治婦人六十二種風及腹中血氣刺痛以紅藍花酒主之紅花一味以酒一大碗煎減半頓服一半頃之再服喻嘉言治張令施弟傷寒壞症兩腰僂廢徹夜痛叫百治不效脈亦平順無患其痛則比前大減曰病非死症但恐成廢人矣此症之可以轉移處全在痛如刀刺尚有邪正互爭之象若全不痛則邪正混為一家相安於無事矣今痛覺大減實有可慮病者曰此身既廢命安從活不如速死欲為救全而無治法諦思良久謂熱邪深入兩腰血脈久閉不能復出止有攻散一法而邪入既久正氣全虛攻之必不應乃以桃仁承氣湯多加肉桂附子二大劑與服服後即能強起再仿前意為丸服至旬餘全安此非昔人之已試乃一時之權宜也然有自來矣仲景於結胸症有附子瀉心湯一法原是附子與大黃同用但在上之症氣多故以此法瀉心然在下之症多血獨不可仿其意而合桃仁肉桂以散腰間之血結乎後江古生乃弟傷寒兩腰僂廢痛楚不勞思索徑用此法二劑而愈陳洪章治沈沃田年七十餘左臂及指拘攣不能伸舒食減神憊或謂老人虛弱用補劑以致日甚陳診之曰此由風濕邪鬱胸脾波及四肢用二陳湯加芒硝砂仁以薏苡仁三兩煎汁煎藥連服四劑病去大半去硝仍用二陳又服六劑而全愈沃田手扎立齋治一婦人肢節腫痛脛足猶甚時或自汗或頭痛此太陽經濕熱所致用麻黃左經湯二劑而愈昔有人患足痺者趂舟見舟中一袋以足倚之比及登岸足已善步矣詢袋中何物乃木瓜也本草備要王執中云有貴人手中指攣已而無名指亦攣醫為灸肩顒曲池支溝而愈支溝在腕後三寸或灸風疾多有不灸支溝只灸合谷云李景渠中丞傳筋骨疼甚如挾板狀痛不可忍者將騾子修下蹄爪燒灰存性研末或酒白湯調服立愈廣筆記馬元儀治陳氏婦患痛痺手足瘛瘲周身盡痛不能轉側口乾煩燥脈之弦數兼澀此陽明津液不足則生熱熱勝則生風手足瘛瘲者風淫末疾也口乾煩燥者火邪內熾也惟專滋陽明不治風而風自息不治痛而痛自除矣用生首烏一兩生地五錢黃連黃芩秦芁半麴枳殼桔梗各一錢四劑症減六七又數劑而痊張氏子周身掣痛頭不可轉手不能握足不能運如是者半月矣診之兩脈浮虛浮雖風象而內虛者脈亦浮而無力以脈參症當是勞倦傷中陽明不治之候也陽明者五臟六腑之海主束筋骨而利機關不治則氣血不榮十二經脈無所稟受而不用矣衛中空虛營行不利故相搏而痛也法當大補陽明氣血不與風寒濕成痺者同用人參二錢黃芪當歸各三錢炙草桂枝紅花各五分秦芁一錢兩劑脈和能轉側去桂枝加白术肉桂杞子熟地等調理半月而安夫病有虛實不同治法因之而異風寒濕所致者氣滯於內而為痺邪踞於表而為痛病之實者也陽明中虛所致者血不養筋而為痛氣虛於內而不運病之虛者也其實者急在邪氣去之不速留則生變也其虛者急在正氣補之不蚤愈久愈劇也凡病皆然不獨此也書之以為見病治病者鑒袁某患痛痺身及手足掣痛徹夜不得安卧發熱口燥胸滿中痛兩脈弦右關獨大此胃熱壅閉為陽明內實症也陽明之氣不能充灌周身十二經脈不得流利故肢體不能自如以調胃承氣加黃連秦芁一劑大便得通再劑症減六七改用清胃和中之劑調理而愈吳漢章痛風發熱神昏妄言見鬼手足瘛瘲大便不行此腎水傷而肝木生火內熾則便閉神昏外攻則發熱身痛也法當滋其內則火自息風自除痛自止矣用生首烏蔞仁黃連知母枳殼桔梗桂枝秦芁一劑漸減但心神不安如在舟車雲霧中不能自主改用人參炙草生地麥冬逺志棗仁茯神貝母橘紅羚羊角三劑再與歸脾湯調理數日而安杜漢飛患周身流走作腫手不能握足不能履已三月脈之浮大而數發熱口乾此陰虛生內熱熱勝則生風風惟善行傷於筋脈則縱緩不收逆於肉理則攻腫為楚也用生地五錢酒炒芩連各一錢羌活一錢紅花五分蓋苦以勝熱辛以散風也二劑得酣睡數劑而諸苦若失治臂腿之間忽一兩點痛著骨不可忍芫花根研為細末米醋調隨大小傅之立效醫云此陶成一醫者方曾以治一婦人産後得此疾者良驗但敷貼不住須以紙花覆其上用絹帛札定也百乙方立齋治徐工部宜人先兩膝後至遍身骨節皆痛脈遲緩投羌活勝濕湯及荆防敗毒散加滲濕藥不應次以附子八物湯一劑悉退再劑而愈若脈洪數而痛者宜服人參敗毒散張子和治一稅官病風寒濕痺腰腳沉重浮腫夜則痛甚而惡寒經五六月間猶綿脛靴足腰膝皮膚少有跣露則冷風襲之流入經絡其痛轉劇走注上下往來無定其痛極處便臃急而腫起肉色不變腠理間如蟲行每遇風冷病必轉增飲食轉減肢體瘦乏須人扶掖猶能行立所服者烏附薑桂種種燥熱燔針著灸莫知其數前後三年不愈一日命張脈之其兩手皆沉滑有力先以導水丸通經散各一服是夜瀉二十餘行痛減過半漸服赤茯苓湯川芎湯防風湯此三方在宣明論中治痺方是也日三服煎七八錢漐漐然汗出又作玲瓏竈法熏蒸若血熱病反劇諸汗法古方亦多有之惟以吐發汗者世罕知之故嘗曰吐法兼汗良以此矣常仲明病濕痺五七年矣張令上涌之後可瀉五七次其藥則舟車濬川通經神祐益腎自春及秋必十餘次方能愈公之疾不必針灸與令嗣皆宜涌但臘月非其時也欲俟春時恐余東邁今姑屏病之大勢至春和時人氣在上可再涌之以去其根卒如所論而愈繆仲淳治高存之長郎兩年腹痛愈後又患臂痛每發一處輒於手臂指屈伸之間腫痛不可忍三四日方愈痛時在手即不能動曰此即前病之餘虛火移走為害也立丸方凡四五更定服至此方全愈生地丹皮萸肉茯苓山藥澤㵼天冬麥冬五味牛膝黃蘗枸杞砂仁甘菊花何首烏虎前脛骨蒺藜兔絲蜜丸每服五錢空心白湯下一婦人臂痛筋攣不能伸屈遇寒則劇脈緊細正陳良甫所謂肝氣虛為風寒流於血脈經絡摶於筋筋不榮則乾急而為痛先以舒筋湯更以四物湯加丹皮澤蘭白术治之而痊亦有臂痛不能舉或轉左右作痛由中脘伏痰脾氣滯而不行宜茯苓丸或控涎丹治之胡縣丞遍身走痛兩月後左腳面結腫未幾腿股又患一塊脈輕診則浮重診遲緩此氣血不足腠理不密寒邪襲虛而然以加減小續命湯四劑及獨活寄生湯數劑疼痛頓去更以托裡藥倍加參芪歸术百帖而愈施沛然治許户部贊忽患痛痺不能步履者浹旬矣遍治無效診之曰病得之暮不收拒數見風露立而使內擾其筋骨許曰然然未有語其因者疇昔之夏祝融肆虐竹筐几牀如楚如炙移榻露處涼飈拂拂越女揮扇齊姫薦席行立坐卧匪朝伊夕豈以斯故乃嬰厥疾曰無難也當為起之乃飲以丹參虎骨酒萆薢蠲痺湯不一月而病若失步履如常矣蔣仲芳治張蒔官年十九春末遍身筋骨疼痛漸生小骨久藥不效視其身纍纍如龍眼蓋筋而非骨也因邪氣入筋縮結而然譬之頸癧結核而硬豈真骨乎遂針委中大權以治其後內關三里治其前內服當歸生地白术秦芁桂枝桑枝靈仙羌活米仁牛膝生薑入酒三分以助藥力數日其骨漸小一月盡消劉雲密治一女子年三十外病冬月祛寒並頭痛背重墜而痛下引腰腿及腿肚痛甚右臂痛不能舉醫以五積散為主加羌活烏藥以散凝寒而行滯似亦近之然但除怯寒與腰痛而頭腿腿肚及右臂之痛只小愈耳至背之重墜而痛毫未減蓋止知散寒而不知逹陽止知行胃腎之氣而不知逹胸中之陽也夫陽受氣於胸中而背固胸之府也因簡方書有以薑黃為君而羌活白术甘草四之一乃知入附子三分服頭飲則諸痛去其三再如前劑用其三之一與前查同煎服竟而諸症霍然此以薑黃逹上焦之陽為其能不混於治血且不等於治氣之味也續名醫類案卷十七
