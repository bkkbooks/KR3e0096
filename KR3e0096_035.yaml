body:
  text: 續名醫類案卷三十五錢塘魏之琇撰産後感症陸肖愚治吳敬之室年二十餘産前已有感冒分娩三日后因責婢離牀時正冬月覺身上懷栗遂身熱頭痛或用參蘇飲發其汗頭痛止而身熱不除遂以産后當大補氣血數劑而煩熱日甚又擬用補中益氣湯脈之兩手雖弱而左猶帶浮右已見數曰脈虛正産后之平脈但左手猶浮知表邪未散右手見數欲傳裡之候也宜急解其表微通其裡少緩便有承氣之患矣用柴葛桔梗黃芩花粉甘草山查一劑而煩熱減二劑而身涼以清氣養榮湯調之馬元儀治陸氏婦産后惡寒雖重茵厚被不除屢補不效將行桂附矣診之兩脈沉伏面赤口燥胸滿此非産后新虛乃胎前伏邪也屢用參术則邪愈結而正愈阻肌表惡寒者邪熱內鬱逼陰于外也口乾面赤胸滿者邪氣挾火挾食上凌清道也仍宜一表一裏治之用葛根防風蘇梗枳壳桔梗杏仁蘇子薄荷一服而表症矣右關尺轉見滑實隨用大黃五錢元明粉三錢甘草一錢一服下積穢盛多復發疹發頥此表裡兩和餘邪畢達之徵也再與辛涼解透之劑而安此症邪伏于內久而不宣用清陽泄表苦寒達下兩泄之猶發疹發頥而乃妄行溫補將謂脈伏惡寒為陽虛之候耶其亦不審病機甚矣王氏婦産后一月神氣昏倦上氣喘促胸滿中痛咳嗽發熱百治無效診之兩脈沉澀兼結此胎前已有伏邪兼産后氣血兩虛邪益內結法宜表裡兩和使邪從外達氣從內泄病自愈矣以桂枝柴胡蘇梗枳壳半曲蔔子杏仁廣皮透邪達滯之劑頓安脈已稍舒或投參地歸芍斂滯之品遂徹夜靡寧如喪神守此邪結于中補之生變也乃用桂枝炮薑黃連枳實厚朴廣皮等一劑而胸滿中痛除復用蔞仁柴胡桂枝半夏枳實杏仁蘇子桔梗再劑而表熱喘咳平但大便不行此久病津液失養也加生首烏一兩便行餘邪盡去然正氣大虧再與滋補氣血之劑而安李季虬治魏常正産后飲食不節復感風寒遂致發熱譫語喘咳氣逆惡露絶不至勢盛急迫謂症皆係外來客邪尚屬可救設正氣虛脫現諸症者必無幸矣何以見之以脈氣浮大有力故也用大劑疏風消食之劑二劑便霍然先是有用白术芎歸等補藥者幾為所誤廣筆記張意田治一婦産后患病已及半載咸作勞損治且云陰虧已極勢難痊愈張連診五次確知此症服小柴胡湯法必當應奈羣議紛紜以參柴非治陰虧之藥又言肺熱咳嗽大忌人參因立案正心幸病家見信一服而寒熱大作三服之后寒熱退而咳嗽平十服全愈案云診得六脈皆數右寸大而軟關尺兩部沉候弦急左寸洪數關部三候皆虛數尺中空大夫右寸軟大肺氣虛也關尺沉候弦急關主中州尺司火位沉裏也弦肝脈也此因中氣虛而木邪犯位木氣動而火從之也左寸洪數心經虛火也關中虛數肝無血養也尺中空大腎水虛也是脈本屬陰虛而寒邪乘之留連不已以至于此今所見症五更發熱者寅卯木旺之時肝木挾邪隨時而動也上午寒熱得汗熱減者邪稍泄而勢稍緩也咳嗽之聲結而不暢此久嗽傷肺肺氣虛而邪不得越也胸腹時脹而微鳴此肝木犯脾肝主脹也合脈症是為虛中挾實不得樞轉外出之候也大全曰産后血氣虛弱餘食未平不滿百日將養失所風冷客于氣血顔容憔悴飲食難消感于肺故咳嗽口乾遂覺頭昏百節疼痛榮衛受邪氣通于肝流注臟腋須臾頻發咳嗽無汗寒熱如瘧蓐勞之候往往如此景嶽天虛弱之人外邪初感不為解散而作內傷或用清涼或用滋補以致寒邪鬱伏久留不解而寒熱往來或為咳嗽其症全似勞損欲辨之者察其表裏病情或身有疼痛而微汗則熱退無汗則復熱或大聲咳嗽脈雖弦緊而不甚數即病至一兩月而邪猶未解此似損非損之症毋再誤也今此症實類此當用小柴胡湯轉動樞機藉少陽之生氣從內而外自下而上則陰陽和而伏邪解散矣半夏生當夏半能啓陰氣産后陰虧而兼口燥故去之胸腹時脹脾陰多鬱宜加牛膝以導之藥病相當自應如桴鼓也來天培治潘氏婦季夏産后二十餘日患寒熱便血惡露未淨而専科與香薷飲四劑服后反嘔吐頭眩腹痛自汗惡心發熱氣促發斑色微紅兩頰淡紅診之左脈如絲右脈沉細此虛而兼感嘔吐傷胃肝木乘相火刑金肺氣受傷上下拒格之症也治宜活血滋陰行氣舒脾散滯降逆托裏化斑之劑用牛膝茯苓杞子當歸紅花黃茋川芎木香香附廣皮夏麴生薑一劑諸症大減六脈和緩但微嗽眩暈心跳胸膈不舒此邪去正虛所致也前方去川芎木香牛膝加伏神丹參杏仁貝母二劑前症盡除惟心跳頭暈改用歸脾湯去人參木香加防黨參杞子白芍調理而愈産後暑孫文垣治一婦人年十六初産女艱苦二日偶感暑邪繼食麵餅時師不察竟以參术投之即大熱譫語口渴汗出如洗暑症多汗氣喘暑傷氣泄㵼㵼皆黃水無屎協熱下利日夜無度小水短少飲食不進症甚危惡時六月初旬女科見熱不退乃投黃連黃芩白芍之劑諸症更甚又以參术大劑肉果乾薑等止㵼一日計用參二兩四錢㵼益頻熱益劇喘汗轉加譫語不徹口醫各束手謝曰汗出如油喘而不休死症也又汗出而熱不退㵼而熱不止譫語神昏産后脈洪大法皆犯逆無生路矣惟附子理中湯庶僥幸萬一孫診之六脈亂而無緒七八至獨右關堅硬食積因思暑月汗出乃常事但暑邪麵食瘀血皆未銷鎔補劑太驟致畜血如見鬼若消瘀去積解暑猶可生也用益元散六錢解暑清熱止㵼利水為君糖毬子即山查三錢為臣紅麴澤蘭各一錢五分消瘀安魂為佐橘紅半夏白茯苓理脾為使三稜五分消前參术决其壅滯為先鋒飲下即略睡譫語竟止連進二劑㵼半減次日仍用前劑其下熱減大便只二次有黃屎矣惡露行黑血數枚次日診之脈始有緒神亦收斂進粥一盞前方去三稜紅麴加扁豆大便一次所下皆黑屎熱盡退改用六君子加益元散青蒿扁豆香附酒芍炮薑調而安易思蘭治石城王福歉之妃癸酉六月受孕偶患泄㵼醫用淡滲之藥止之自后每月㵼三五日有作脾㵼者用參苓白术散之類二三服亦止然每月必㵼五七次至次年三月生産后連㵼半月日夜八九次諸藥不效驚惶無措召易診之兩寸尺俱平和惟兩關洪大有力曰此暑病也以黃連香薷飲治之一劑減半再劑全愈惟肝脈未退又用通元二八丹調理半月後平復陸祖愚治李丹山子室自來元氣不足産后六七日正當酷暑而卧房在樓忽頭疼氣喘昏悶體若燔炭沉沉昏去或以為傷寒令門窗盡閉帳幔重圍用二陳羌防芎蘇一劑口乾唇裂喘急欲絶診之六脈浮洪而散乃冒暑而非感寒宜涼解而不宜溫散令取井水灑地鋪以蘆席移病人卧其上飲以香薷飲遂微汗而蘇再用清暑益氣湯四劑而起沈明生治劉舜泉孫媳夏月産后暈厥不知人事或謂惡露上攻所致投去瘀清魂等劑瘀不行暈厥益甚又作痰治食治皆不效沈至回翔諦審笑曰吾得之矣此暑熱乘虛而入急宜清暑非黃連不可或謂血得冷則凝今惡露未去若投寒涼是速其斃也沈笑曰有不諱吾任之藥甫入口厥蘇暈止再進而惡露行蓋産時樓小人多炎𫾣之際益助其熱乍虛之體觸之豈能不病經云暑傷心又云心主血為熱冒而暈厥此中暑而非惡露明矣或曰舍症從時理固然矣然血熱則行冷則凝亦古訓也今用寒涼而惡露反去何也曰熱行冷瘀以血喻水道其常耳子獨不觀失血者有用溫暖藥而得止則瘀血者豈無用苦寒而得行此造化之微權逆從之妙理也安可執乎産後火熱易思蘭治一婦産后半月餘胃有清水作逆而吐以為胃寒令煮雞倍用椒薑初覺相宜凡內熱虛火之人初服辛熱之藥亦有小效至三五日清水愈多以薑椒煎湯時時飲之近一月口氣漸冷四肢發厥晝夜作逆腹中冷氣難堪有時戰栗用四物湯人參一錢至二錢初服少安久則不應又加炮薑亦不效衆議用附子理中湯庸俗必趨之道易診之六脈俱無以食指復按尺部中指無名指按尺之后診法妙脈來實數有力左右皆同發言壯厲一句可說三五句唇進頰赤大便五六日一次小便赤少此實熱症也詢之其俗産后以食胡椒炒雞為補此婦日食三次半月後遂得此疾乃用三黃湯治之連進四盞六脈俱現薑椒湯不欲食矣又進四盞身不戰栗清水減半服四日口中熱氣上升滿口舌尖俱發黃小粟瘡大便八日不通以四苓合涼膈散空心一服至午不動又以甘草煎湯調元明粉五錢熱服一時許腹中微鳴吐出酸水一二碗大便連去二次又服元明粉五錢下燥矢十數枚後以四苓三黃山梔枳壳調理全愈按此為火極似水乃物極必反之候凡患此為燥熱溫補所殺者多矣哀哉許學士云記一婦人産后護密閣內更生火睡久及醒則昏昏如醉不省人事其家驚惶許用荆芥佐以交加散云服之即睡睡中必以左手搔頭覺必醒矣本事方所蓋為火逼也産後火沈協蘭室人善病自頗知醫最重景嶽全書數年來所服多溫補之劑約桂附幾各半斤近以産后惡露淋瀝赤白時下咳嗽日甚小便自遺脈之右寸鼓指兩關弦數右尺弱面有紅光舌當中無胎胸多冷氣喜熱飲稍涼則不快所服乃夀煎加薑桂等乃列案與之曰病本三陰不足久服溫補則氣分偏勝遂致綿延不已其誤在便糖氣冷又喜熱飲認為脾胃虛寒不知火盛下迫則作㵼上冲則反冷鬱于中則得辛熱而暫散此理方書多未論及今以産后去血血益虛則火益盛面有紅光火炎上也惡露赤白肝脾熱也咳嗽便遺肺虛肝盛腎不祕密也辛溫燥烈宜急逺之方用生熟地杞子沙參麥冬叉斛初猶畏麥冬之寒以二錢太重只用六分數劑後覺相宜漸加至一錢五分十餘劑便不喜熱飲症漸平又加蔞仁二十餘劑每日大便下青黑雜色而辛氣滿房户蓋桂薑之熱久泊迥陽因營氣漸充乃勢不能容而下出也若再投溫補其害可勝言哉書此以為偏服溫補者戒楊氏二婦妯娌也其姒新産發寒熱頭暈不能起坐坐則欲仆惡露紅白兩乳壅腫子户旁腫如雞卵痛甚勢將成癰専科與炮薑白术荆芥桂枝等更嘔惡不寐脈之弦數六至有餘乃與生地杞子蒂丁麥冬當歸銀花甘草黃連蔞仁六劑全愈其娣産彌月耳聾頭及乳腹常痛帶下綿綿每浴湯中搖漾如線子户亦腫痛醫與香燥轉甚亦用前方加減而愈又朱朗齊令妹産後赤白淋瀝口乾咽痛前方去蒂丁當歸加白芍四帖全安其初楊姒所生兒食乳即吐自母服藥后亦不嘔矣凡此皆少厥二陰陰虛火盛之病若謂産后而辛溫是殺之也産後惡寒吳洋治汪伯玉嬸杜冬舉仲子會病瘖且痿四肢汗溢而甚惡寒歷春夏滋深挾纊擁絮猶栗栗曰物極則反吾且極之病由遞産而虛勢重不可亟反激而后反其易為力哉于是補以參茋斂以桂枝固以龍骨牡蠣經年寒猶故也汪以為言洋曰母謂徐徐及瓜而后可治又明年夏先期一月而診之曰藥力告盈其可已至日則以槃水沃青巾者二以石水浮瓜者三謂汪曰洋無戲言通言語徹衣衾其在今日乃命女僕奉槃水進杜難之手語曰吾病産后宜不可水洋曰無害第以兩手按青巾試之病者曰宜然后乃沃兩履尋潄以盂水已復飲之既削瓜而華啖其半于是汗止聲出單衣如常先是溪南吳千婦病與杜同洋治以嚮法效太函集産後喘樓全善治一婦産后洗浴即氣喘但坐不得卧已五日惡風得暖稍寬兩關脈動尺寸俱虛百藥不效用牡丹皮桃仁桂枝茯苓乾薑枳朴桑白皮紫蘇五味子蔞仁服之即寬二三服即卧其痰如失蓋作汗血感寒治之也治法彚薛立齊治一産婦喘促自汗手足俱冷常以手護腹此陽氣虛脫也用人參附子湯四劑愈繆仲淳曰己丑豫婦産后五日食冷物怒傷脾作㵼乃微嗽又三日泄不止手足冷發喘牀亦動搖神飛揚不守一醫投以人參五錢附子五錢療之如故加參附又不效漸加參至三兩附子三錢一劑霍然起廣筆記繆仲淳治于中甫夫人産后氣喘投以人參五錢蘇木麥冬各三錢一劑愈未入選産後咳嗽薛立齊治一婦咳嗽見風則喘急惡寒頭疼自汗口禁痰盛薛謂脾胃氣虛腠理不密用補中益氣加肉桂數劑而安一産婦咳而腹滿不食涕唾面腫氣逆此病在胃而關于肺用異功散而愈孫文垣治贊皇令堂産后左脅痛盛此脅痛緣肺實而氣機不利咳嗽痰不易出內熱氣壅不能伏枕與以瓜蔞仁六錢桑白皮蘇子杏仁半夏桔梗枳壳各一錢水煎服之氣定喘除外與保和丸及七製化痰丸而安繆仲淳治施靈修乃正産后發寒熱咳嗽不止因本元虛弱誤用薑桂勢甚劇二句宜細玩之用鱉甲白芍牛膝生地各四錢山查麥冬益母草各五錢橘當歸各二錢青蒿杜仲各二錢五分棗仁八錢逺志五味各一錢茯神三錢竹葉三十片數劑輒定方亦太雜聶久吾治一婦年四十餘因産過多身熱日夜不止午后益盛肌內瘦削經水不行諸醫無效與花粉山藥百合香附麥冬各八錢天冬五分地骨皮當歸二母各六分生地生炒各四分白芍生炒三分前胡四分茯苓七分生甘草三分薑一薄片龍眼三個服十餘劑而身熱已退又加桔梗四分酒炒芩連各六分二十餘劑而安産後嘔附霍亂陳霞山治一婦産后傷食致胃虛不納榖四十餘日聞榖氣藥氣俱嘔以參苓白术炒麯各一錢陳皮藿香各五分炙甘草三分砂仁五分陳米一合用沸湯二碗泡伏龍肝末澄清汁前藥服而安薛立齊治一産婦患腹脹滿悶嘔吐因敗血散于脾胃不能運化所致或用抵當湯疑是抵聖湯敗血以下前症益甚小腹重墜似欲去后薛謂脾氣虛而下陷用補中益氣湯加炮薑溫補脾氣重墜如失又用六君子湯而安一産婦停食霍亂用霍香正氣散之類已愈後胸腹膨脹飲食稍過即嘔吐或作泄㵼此脾胃俱虛用六君子湯加木香治之漸愈后因飲食失調兼恚怒患霍亂胸腹大痛手足逆冷用附子散又用八味丸以補土母而康設泥痛無補法而用辛散或用平補之劑必致不起産後泄㵼陸養愚治臧舜田內人脾胃素常不實産后因怒大便泄㵼或以胃苓湯加歸芍投之勢日甚且汗出氣喘脈氣散大或謂此非産后泄㵼所宜宜勿藥陸曰脈雖大而按之不甚空尚有一二分生意用人參理中湯加訶子肉果已煎矣忽傳人事已不省再診之浮按虛數沉按如絲手足厥逆或謂今夜决不能延乃辭去陸令急以前藥加附子一錢一劑汗止㵼減再劑病減七分去附子加歸芍數劑起王憺如治一産婦㵼彌年不愈六脈沉遲此元氣下陷寒熱太甚症也然湯藥猶濕也以濕治濕可乎遂用參茋苓术肉蔲升麻防風甘草用猪肚一枚入蓮肉一斤好酒煮爛搗和為丸日進而安陳三農治一婦産后滑㵼勺水粒米不容即時㵼下半月餘矣六脈濡而弱此産勞力傷脾也若用湯藥恐滋胃濕遂以參苓白术散加肉蔲生薑棗肉為丸服愈薛立齊治一産婦大便不實飲食少思五更或清晨遺屎此中氣虛寒脾腎不足用補中益氣送四神丸而痊張子和治李德卿妻因産后病泄年餘四肢瘦乏皆斷為死症張曰兩手脈皆微小乃利病之生脈况洞泄屬肝經肝木尅土而成此病亦是腸澼澼者腸中有積水也先以舟車丸四十五粒又以無憂散三四錢下四五行又進導飲丸渴則調以五苓散再與胃風湯調之半月而能行一月而安健産後不禁薛立齊治一産婦小便頻數時忽寒戰乃屬脾肺虛弱用補中益氣加山茱山藥為主佐以桑螵蛸散而愈後患發熱晡熱盜汗自汗月水不調用加味逍遙散而安一産婦患前症吐痰發熱日晡作渴此膀胱陰虛用補中益氣湯佐以六味丸而愈又患痢后小便頻數手足俱冷屬陽氣虛寒用前湯及八味丸而瘳一産婦小便不禁二年不愈面色或青赤或黃白此肝脾氣血虛熱用加味逍遙散為主漸愈佐以六味丸而痊后因怒小便自遺大便不實左目頓緊面色頓赤仍用前散佐六君子湯以清肝火生肝血培脾土而瘳一産婦小水淋瀝或時自出用分利降火之劑二年不愈以為肺腎氣虛用補中益氣及六味丸而痊産後祕結附淋薛立齊治一産婦大便祕結小腹脹痛用大黃等藥致吐㵼不食腹痛胸痞用六君子湯加木香炮薑治之而愈孫文垣治沈三石夫人産三日腹不暢女科為下之大㵼五六次遂發熱惡心又用溫膽湯止吐小柴胡退熱數劑食吐不止粒米不進又用八珍湯加童便昏憒耳聾眼合口渴腸鳴發熱惡心耳聾口渴多似感症然此實誤下虛之所致所謂變症蜂起也眼胞上下及手足背皆浮腫診之六脈皆數曰脈數所主其邪為熱其症為虛與十全大補湯加炮薑夜半稍清爽進粥一盂始開目語言次日午以藥不接且言語過多復昏昧不知人事翌日以人參白术各三錢炮薑茯苓陳皮各一錢甘草五分服訖體微汗遍身痱痤熱退神爽下午藥又不接且動怒昏昧如前六脈散亂無倫狀如解索痱痤亦沒亟以人參白术各五錢炙甘草炮薑製附各一錢連進二帖是夜熟睡唯呼吸之氣尚促屢進皆效後之腫毒自非實症也次日脈轉數下午發熱不退環跳穴邊發一毒如碗大紅腫微痛女科復譛曰向之發熱惡心皆此所致薑附溫補誤也須急進寒涼解毒之藥孫曰此乃胃中虛火遊行無製大虛之症非毒也若用寒涼速其死耳經云壯者氣行則愈怯者著而或痛惟大補庶可萬全三石然之仍與前劑日夕二帖參术皆用七錢服后痱痤復起毒散無踪熱亦退再以參苓白术散調理而安是症皆由誤下致變百出可不慎哉按是症多由産后血津虛耗及平素多火內熱之人常有之雖日數過亦無所害即欲通之唯大劑二冬二地歸杞蓯蓉不過一二服即行矣彼桃杏麻柏及膽蜜之治猶下乘也若硝黃肆用誠失醫哉薛立齊治一婦産后大小便不通諸藥不應將危矣令飲牛乳一日稍通三日而痊人乳尤善産後瘧陸肖愚治陳振宇女年二十七産后患間日瘧已月餘寒熱雖不甚而身體倦怠飲食減少脈之左手平和右手弱而無力與補中益氣湯二劑覺胸膈飽悶遂歸咎人參更醫仍用青皮飲二陳湯等寒熱反甚用截藥或止數日復作延至數月肉削骨立再診之其脈微弱已甚曰前服人參兩可愈今非至斤不能奏效矣用十全大補湯二劑仍覺悶疑之曰直服至不飽悶自愈矣更倍參投之遂飲食日增服數十劑方起産後下痢薛立齊治一産婦食雞子腹中作痛面色青黃服平胃二陳更下痢腹脹用流氣飲子又小腹一塊不時上攻飲食愈少此脾胃虛寒肝木尅侮所致用補中益氣加木香吳茱萸漸愈又用八珍大補兼服調理而安龔子才治一産婦血痢小便不通臍腹疼痛以生馬齒莧搗爛取汁三大合煎沸下蜜一合調頓服即愈薛立齊治一産婦屎后下血諸藥不應飲食少思肢體倦怠此中氣虛弱用補中益氣湯加吳茱萸炒黃連五分四劑頓止但怔忡少寐盜汗用歸脾湯治之而愈孫文垣治族女小産后二十日矣患赤痢一日十餘次怯寒惡食小腹脹痛診之右寸滑大知其虛中有熱蓋緣惡露未盡故小腹脹痛専科泥丹溪産后大補氣血之語概施之因而作痢乃翁曰病尚怯寒何云有熱曰惡寒非寒反是熱症蓋火極似水也時師多昧此㫖飲藥后當知之以白芍當歸滑石為君桃仁酒連酒芩為臣木香桂皮檳榔為佐青皮為使服下果去黑瘀血甚多小腹頓寬惟口乾小水少惡心怕飲食體倦仍裡急后重人參川芎白芍各一錢當歸一錢五分酒連陳皮各六分木香二分外與清六丸服下熱除痢減十之八矣但大便不實惡心虛弱以四君子湯加酒芍陳皮木香肉果酒連當歸養之而平陸養愚治李尚田乃正産後患痢延及年餘肢肌羸瘦面色黧黑咸以不可為矣脈之兩手皆微小而右關尺之間尚覺有力如珠舌中常起黑胎曰微小乃久痢生脈脈滑胎黑必沉積在腸久而未去也若大下之病當愈李謂初病亦常服通利今飲食不進者數月矣安所得積乎因前方大都紐于産后大補氣血為主即用消導多雜參茋歸芍補不成補消不成消致元氣日衰積滯日固至收斂濕澀宜其劇也乃以潤字丸一兩分三服令一日夜服盡下紫黑如膏數缶許口渴甚煎生脈散作茶飲之胃漸開又以潤字日服一錢每日下稠積缶許十日后方用補養一月而痊張路玉診大兵船上一婦胎前下痢産后三日不止惡露不行發熱喘脹法在不救服藥一劑反加厄逆診之其脈三至一代欲辭不治因前醫被留不與排解必致大傷體面乃曰此症雖危尚有一線生機必從長計議庶可圖治彼聞言始放其醫而求藥遂與盞一枚錢數文令買砂糖熬枯白湯調服既可治痢又能下痢且不傷元氣急與之服彼欣然而去醫得脫而遁至大兵去乃歸薛立齊治一産婦痢未至滿月因食冷物及酒冷熱與血攻擊滯下純血纒墜極痛其脈大無力口乾用黃芩芍藥湯三服而安未選入痘孕産婦徐仲光曰一孕婦正痘養漿時墮胎血去多昏憒乃伏陷而死一孕婦症同前以黃茋一兩五錢人參當歸各一兩阿膠五錢甘草艾黑薑各三錢附子一錢治之而愈一婦漿期正産痘順以保元湯加川芎當歸荆芥山查益母草而愈一孕婦痘漿足不易痂面赤晡熱此脾虛血少也以安胎飲加參而愈一孕婦痘勻朗灰白熱甚墮胎昏憒冷嘔此胃氣虛寒也以保元湯加炮薑白术肉桂而愈一産婦痘不易透疲倦血去不止此氣血兩虧也治以芎歸參薑益母升麻血止痘起又以補中益氣而愈一孕婦出痘以安胎飲調理而愈又有胎痛甚者以砂仁炒黑研末酒下一錢即愈一産婦出痘漿不足灰白身熱肢冷寒戰咬牙煩躁溏泄此脾胃氣虛也以異功散治之而愈亦有去血不止藥不效者倒靨而死一婦産后痘順痰盛清解之益甚此陰虛不能致陽也以六味地黃丸料加當歸麥冬而愈一婦痘甫愈而强以房事疤變色成勞而死一産婦痘不易發煩躁譫狂此毒重壅遏也以芎歸連紫升蒡甘芍蟬退治之而愈萬密齊治程氏女年二十出痘時娠五月矣診其脈男胎也惟以清熱解毒和中安胎為主用黃芩白术為君人參生甘草當歸生地白芍紫蘇為佐自初出至成漿無他苦乃聞家中被盜遄歸醫與藥一服胎墮果男也再延診痘變灰白平塌成倒陷乃裏虛故也詢所用方乃獨聖散曰山甲麝香皆墮胎藥胎去氣血益虛瘡毒內陷不可為矣三日卒續名醫類案卷三十五
