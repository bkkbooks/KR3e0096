body:
  text: 續名醫類案卷八錢塘魏之琇撰熱病滕曇恭豫章南昌人也年五歲母患熱病思食寒瓜土俗所不産曇恭歷訪不得俄遇一桑門問其故曇恭具以告桑門曰我有兩瓜分一相遺還以與母舉室警異尋訪桑門莫知所在南史唐武宗有心熱疾百醫不效青城山刑道人以紫花梨絞汁而進帝疾遂愈後復求之苦無此梨常山忽有一株目緘實以進帝多食之解煩躁殊效醫説續編張子和治常仲明之妻每遇冬寒兩手熱痛曰四肢者諸陽之本也當夏時散越而不痛及乎秋冬收斂則痛要言不煩以三花神祐丸大下之熱遂去李東垣治節使趙君年幾七旬病身體熱麻股膝無力飲食有汗妄喜笑善飢痰涎不利舌強難言聲嗄不鳴診得左寸脈洪大而有力是邪熱客於經絡之中也兩臂外有數二經灌溉通身終而復始蓋手之三陽從手表上行于頭面之間陽併於陽勢甚熾焉故邪熱妄行流散於周身而為熱麻胃熱則蟲動蟲動則亷泉開故涎下熱傷元氣而為痰痰涎皆隨食入胃慓悍之氣不循常度故多汗心火盛則妄喜笑脾胃熱則消穀善飢肺金衰則聲嗄不鳴仲景云微數之脈愼不可炙焦骨傷筋血難復也君奉養以膏梁之味無故而加以火焫之毒熱傷經絡而為此病明矣內經云熱淫所勝治以苦寒佐以苦甘以甘㵼之以酸收之當以黃柏知母之苦寒為君以㵼火邪壯筋骨腎欲堅急食苦以堅之黃耆生甘草之甘寒㵼熱實表據此耆草可云甘寒五味子味酸止汗補肺氣之不足以為臣炙甘草當歸之甘辛和血潤燥升麻柴胡之苦平行少陽陽明二經自地升天以苦發之者也以為佐㕮咀同煎清汁服之更繆刺四股以㵼諸陽之本使十二經相接而㵼火邪不旬日良愈遂名其方曰清神補氣湯試效方張子和曰余向日從軍於江洭上一舟子病余診之乃五實也余自幼讀醫經嘗記此五實之症竟未之遇也既見之人竊私料之此不可以常法治乃大作劑而下之殊不動搖計竭智窮無如之何忽憶桃花萼丸頓下七八十丸連㵼二百餘行與前藥相兼而下其人昏困數日方已蓋大疾已去自然臥憩不如此則病氣無由衰也徐以調和胃氣之藥饘粥日加自爾平復也五實者脈盛皮熱腹脹前後不通瞀悶也蔣仲芳治蕭氏婦年二十餘素虛弱患熱病將一月一夕忽瀝生薑燈心湯灌之下咽少頃微動細察之腹痛甚問其大便云二十日不食亦不行矣以大黃一兩芒硝五錢桃仁當歸各三錢與之衆駭曰素有弱症且病久何能堪此曰更有法在強與之遂去黑物半桶即用人參五錢煎湯補之蓋因素弱急下後不得不峻補也調理月餘而愈今連生三子此諸醫因其虛而不治其實之誤也樞密副使耶律斜軫妻有沈疴易數醫不能治耶律敵魯視之曰心有畜熱非藥石所及當以意療因其聵聒之使狂用泄其毒則可於是令大擊鉦鼓於前翌日果狂呌呼怒罵力亟而止遂愈遼史見説儲上洋劉公逺至洞庭山治病病者已氣絶劉曰無恐當即活也但某今夜必欲觀劇又所演必劇武者從之遂令以氊褥裹病人置場上已而鉦鼓喧沸則病者欠伸復蘇矣張氏巵言觀其治法與前案頗同則為病亦必仿佛萬密齋治胡應龍五月患熱病治半月未愈脈弦數鼻衄三四日一作左脅痛不能側臥先以炒山巵一個婦人髮同燒存性吹入鼻中而衄止再以當歸龍薈丸方作湯一劑而脅痛止再診其脈弦去而浮數日當以汗解蓋衛氣不共營氣諧和者當用桂枝湯以治其陽今乃營氣不共衛氣諧和則當用黃連解毒湯合白虎以治其陰使營衛和則得汗而愈也乃以二湯合煎飲之先告之曰當戰汗勿驚也連進二劑果汗而愈胡龍嘉六月病熱身壯熱自汗出大渴喜裹體診其脈弦大而虛萬為制一方小柴胡內摘柴胡人參白虎湯內摘知母甘草巵子䜴湯內摘淡豆䜴共五味淡竹葉煎名三合湯一劑而愈繆仲淳治辛衡陽銓部熱病病在陽明頭痛壯熱渴甚且嘔鼻乾燥不能眠診其脈洪大而實仲淳故問醫師曰陽明症也曰然問投何藥曰葛根湯仲淳曰非也曰葛根湯非陽明經藥乎曰陽明之藥表劑有二一為葛根一為白虎不嘔吐而解表用葛根湯今吐甚是陽明之氣逆升也葛根升散故用之不宜宜白虎湯加麥冬竹葉名竹葉石膏湯石膏辛能解飢鎮墜能下胃家痰熱肌解熱散則不嘔而煩燥壯熱皆解矣遂用大劑與之且戒其仲君曰虜荆非六十萬人不可李信二十萬則奔還矣又囑曰子時投藥五鼓瘥天明投藥朝餐瘥已而果然或謂嘔甚不用半夏何也仲淳曰半夏有三禁渴家汗家血家是也病人渴甚而嘔是陽明熱邪熾盛劫去津液故渴邪火上升故嘔半夏辛苦溫而燥且有毒定非所宜又疑其不用甘草口嘔家忌甘仲景法也龔子才治一婦人夏間病熱初用平調氣血兼清熱和解之劑二三服不應熱愈甚舌上焦黑膈間有火嗽水不咽診之兩手皆虛微而右手微甚六七日內譫語撮空循衣摸牀惡症俱見後用四物湯加黃蓍人參白术陳皮麥冬知母熟附子服之一二時汗出熱退次日復熱再服仍退又次日復發知其虛劇也遂連進十服皆加附子而安喻嘉言治王玉原昔年感症治之不善一身津液盡為邪熱所鑠究竟十餘年熱未盡去右耳之竅常閉今夏復病感纒綿五十多日面足浮腫臥寐不寧耳間氣往外觸蓋新熱與舊熱相合狼狽為患是以難于去體醫者不察其情治之茫不中竅延至秋深金寒水令病方自退然淺者可退深者末由遽退也喻曰面足浮腫者肺金之氣為熱所壅失其清肅下行之權也靣腫可云足腫則未確終是陰虛血不配氣耳臥寢不寧者胃中之津液枯乾不能內榮其魂魄也語殊牽強亦由陰虛肝火浮入胞絡也耳間大氣撞出者久閉之竅氣來不覺今病體虛羸中無阻隔氣逆上沖始知之也總不外陰虛二字外病雖愈而飲食藥餌之內調者尚居其半特挈二事大意為凡病感之邪熱未退於此而補虛則熱不可除於此而清熱則虛不能任即一半補一半熱終屬糢糊不得要領然舍補虛清外熱更無别法當細審之補虛有二法一補脾一補胃如瘧痢後飲食不能運化宜補其脾如傷寒後胃中津液久耗新者未生宜補其胃如傷有霄壤之殊也清熱亦有二法初病時之熱為實熱宜用苦寒藥清之大病後也熱為虛熱宜用甘寒藥清之此説極透徹二者亦霄壤之殊也人身天真之氣全在胃口津液不足即是虛生津液即是補虛故以生津之藥合甘寒㵼熱之藥而治感之虛熱如麥冬生地丹皮人參梨汁竹瀝之屬皆為合法仲景每用天水散以清虛熱正取滑石甘草一甘一寒之義也設誤投參蓍苓术補脾之藥為補寧不併邪熱而補之乎至於飲食之補但取其氣不取其味如五穀之氣以養之五菜之氣以充之每食之間便覺津津汗透將身中藴畜之邪熱以漸運出於毛孔何其快哉人皆不知此理急於用肥甘之味以補之目下雖精采健旺可喜不思油膩阻滯經絡邪熱不能外出久之充養完固愈無出期矣前哲有鑑於止寧食淡茹蔬使體暫虛而熱易出乃為貴耳前醫藥中以浮腫屬脾用苓术為治以不寐責心用棗仁茯神為治致餘熱糾纒不已總由補虛清熱之旨未明故詳及之璛按寓意草中多有發前人所未發處至於支離牽強處亦復不少如此案謂感冒後以甘寒清熱最為肯綮然以補脾補胃立論便爾糢糊但當云氣虛者冝補氣血者宜補血凡瘧痢後飲食不運多氣虛宜氣分藥如參耆苓术之類凡感症後津液不充多血虛宜地冬梨竹之屬以感症多餘熱未清也何等明快然猶未免於偏常見痢以下多而亡隂瘧以汗多而耗液飲食難運多由相火盛而真氣衰非大劑二冬二地投之多見其纒綿不已也至其論面足浮腫卧寐不寧尤屬隔靴搔癢陸養愚治凌比部藻泉暑月榮歸煩勞過度夜間頭痛如破內熱如火不寐汗多小水短赤舌上黃胎右脅脹痛有謂頭痛身熱冝散者有謂煩勞之後冝補者診之見其身熱喘語言間氣乏不足以息脈浮數按之不甚有力曰此熱傷元氣也乃以河間桂苓甘露飲加人參一錢服之片時汗止熱減喘定能言再與一劑昏倦思睡次早脈浮按已平沉按弦而有力此浮熱已除內熱未盡故脅腹尚微痛也與當歸龍薈丸一錢五分空腹服之而後進粥至下午便通而色黑痛即減後以參麥散調理而安陸肖愚治史洞庭室四月間患頭痛發熱脈洪數見於氣口用清解藥二劑大約柴葛巵苓之類一醫謂頭痛身熱乃太陽症而遽用柴葛不引邪入陽明少陽乎汗未得而遽用巵苓寒涼之品表邪何由而解不將傳裏乎以正傷寒論未嘗不是用大清龍湯二劑病家止服一劑夜間遍身如煆口渴咽乾已有譫語矣明日又以非傷寒乃痛風也觀前説其人亦頗閲書而臨症則鹵莽不堪逮福薄而氣浮騣凶鬯匕抑識淺而意易移歟用羌獨活首烏牛膝等二劑乃登高而歌棄衣而走罵詈不避親疏再求診乃令數婦人縶之謂洞庭曰此陽症也擾之益劇當以言寬諭之果如言而止因先用糖水法灌之勢便緩隨以白虎加元明粉苓連蔞仁犀角數劑而罵詈止時或妄言知大便久不去也以潤字丸三錢投之夜出燥矢約二十枚然譫語猶未全止仍進前湯又以丸藥二錢投之出燥矢數枚糖便少許又三日方思粥飯以清氣養榮湯調理之吕東莊治吳華崖館僮夏月隨後湖上感熱症下痢膿血身如燔炭因是熱症否則下痢身熱為不治矣曰此陽明病也不當作痢治視其舌必黑而燥夜必譫語果如所言診之則脈已散亂忽有忽無壯類蝦遊不可治也吳強之不得已用熟地一兩生地麥冬當歸白芍甘草枸杞佐之戒之曰汗至乃活夜來熱不減譫語益狂悖血痢不下耳服藥後見微汗少頃即止診之脈已接續分明洪數鼓指曰今生矣仍前方去生地加棗仁山藥丹皮山萸加減無當甚連服六帖其家以昏熱甚每日求更方令姑忍定以活人還汝再診脈始斂而圓乃曰今當為汝去之用四順清涼飲之加熟地一兩大黃五錢下黑矢數十枚諸症頓愈越二日薄暮忽復狂譫發熱喘急口渴此欲回陽作汗也與白术一兩黃蓍一兩乾薑三錢甘草一錢歸芍各三錢盡劑汗如注酣臥至曉病霍然已後有發明節去以其説在語案多有也琇按先補而下再補而汗治法固善然此症在初時數劑能與天水㵼心並行定不致如許決張楊乘六族弟患熱症六七日不解口渴便祕發狂踰墻上屋赤身馳驟譫妄罵詈不避親疏覆蓋盡去不欲近衣如是者五日矣時楊以歲試自苕上歸尚未扺岸病人曰救人星至矣問是誰曰雲峰大兄回來也頃之楊果至家人咸以為奇視之良久見其面若無神兩目瞪視其言動甚壯徑有力意以胃中熱甚上乘於心心為熱胃故神昏而狂妄耳不然何口渴便祕白虎涼膈等症悉具耶及診其脈豁大無倫重按則空驗其舌黃上加黑而滋潤不燥乃知其症由陰盛於內逼陽於外雖壯徑有力乃外假熱而內真寒也其陽氣大虧神不守舍元神飛越故先遇人于未至之前遂以養榮湯加附子倍棗仁五味白芍濃煎與之一劑狂妄悉除神疲力倦熟睡周時方寤渴止食進而便通矣繼用補中益氣加白芍五味而痊璛按傷寒門張令韶治一婦譫妄發狂以聲重且長斷為實熱下之而愈此案亦壯徑有力斷為虛寒補之而愈苐張案則脈伏全無為熱厥也此則脈空豁無倫為陽越也故臨症者猶不可執一端以為凖的也朱湘波母病熱症痰盛喘急煩燥口渴喉中如煙火上攻兩唇焦裂足心如烙小便頻數董安于擬用十全大補煎送八味丸朱以時方盛暑又係火症不敢服招楊商之切其脈洪大而數無倫按之虛軟面色遊紅舌上生刺且斂束如荔枝曰此腎虛火不歸經脈從而病反者也當舍時舍症從脈以治之方用八味飲合生脈散倍加參地附子朱見方論與董合乃出所擬方示楊楊曰天熱症熱非有灼見何敢用此無庸疑也乃濃煎探冷與飲而愈李氏婦年六十餘患熱症胸痛悶神昏沉氣粗便祕發散消導增甚脈之滑數重按有力面色壅熱通紅滿舌黃胎中間焦黑此食滯中宫賁門壅塞太陰之氣阻而不運陽明之氣抑而不伸鬱而為火也以大劑疏肝益腎湯倍熟地與之當晚下黑矢數十塊諸症大減次日再診脈見浮洪舌上焦燥黃胎盡脫而其色反黑如炭問曰症減而色反黑何也曰向者食滯便祕上下竅不通火悶不舒其焰不能上逹今以純陰之劑便得通則壅塞之火隨便泄去而餘火未盡者復炎而上行所以舌反黑耳前方加棗仁當歸山巵以滋水清肝舌黑退再以生金滋水及六君子加歸芍全愈朱氏媪熱病痞悶眼赤羞明遍身瘡腫大便燥結小水痛澀聞聲則惕然而驚醫與解毒清火導赤十餘劑火益甚不食不眠脈之浮分鼓指沉則緩大兩關洪軟而遲知其外症悉假火也與參附養榮湯不敢服楊曰此症本為憂慮所傷致三陰虧損又為寒涼所迫致虛火遊行沖於上則兩目赤澀流於下則二便艱難乘於外則遍身瘡腫塞於中則胸膈痞悶故其摽則似實熱其本則甚虛寒也若果係實熱何以聞響則驚寒涼頻進而反甚也藥下咽即卧至五更大叫餓甚自寅及已連進粥三次大便潤而小水長諸症悉退原方去附子十餘劑全瘳張飛疇治一婦寡居五月間忽壯熱多汗煩渴耳聾脅痛醫用柴葛桂枝等劑其熱彌甚汗出不止胸滿昏沉時時噫氣診之右脈數大左脈少神舌胎微黑此伏氣自少陽發出故耳聾脅痛法當用白虎清解反行發表升越其邪是以熱渴轉甚汗出多故在左脈無神胃液耗故昏悶胸滿其噫氣者平素多鬱之故今元氣已虛伏邪未解與涼膈去硝黃易瓜蔞根丹皮竹葉一服熱減得睡但汗不止倦難轉側或時欲嘔此虛也以生脈加棗仁茯神白芍扶元斂陰兼進飲粥以扶胃氣渴止汗斂而脈轉虛微欲絶此正氣得補而虛火漸息之真脈也復與四君歸地而痊柴嶼青治陳勾山輿人梁大發疹身熱譫語口渴遺尿服藥增劇求治兩脈沉伏意其診尚未透擬用消毒飲子不信勢已瀕危復求診脈尚如故探其舌燥烈生刺且靣垢唇焦始信為伏暑即伏氣也發於陽明故現以上諸症實熱之症急投白虎湯二劑病解而脈始洪矣故臨症者脈既難憑猶當察其舌也王莭齋常治一僕人病熱口渴唇乾譫語診其脈細而遲用四君子湯加黃耆當歸白芍熱附子進一服熱愈甚狂言狂走或曰附子差矣診其脈如舊仍增附子進一大服遂汗出而熱退脈還四至矣一婦人亦夏間病熱初用平調氣血兼清熱和解之劑服二三服不應熱愈甚舌以焦黑膈間有火嗽水不咽診其脈兩手皆虛微而右手微甚六七日內譫語撮空循衣摸牀惡症俱見後用四物湯加黃蓍人參白术陳皮麥冬知母熟附子服之一二時汗出而熱退次日復熱再服仍退又次日復發知其虛極也遂連進十服皆加附子而安陳三農治一人身大熱兩目出火口舌乾燥手足欲以水浸不避親疏脈豁大服黃連解毒湯益甚此心之脾胃而心氣耗散故耳遂用炒黑乾薑一兩人參三錢白术一錢不用甘草者恐生者㵼心氣炙者緩中致脾胃中火邪不得發散也三味煎服不逾時引被自蓋戰汗出而愈夫乾薑微炒溫中炒黑涼腎止㵼張玉路治童姓者伏氣發於盛暑診時大發躁擾脈皆洪盛而躁其婦云大渴索水二日不敢與飲故發狂亂因令速與連進二盞稍寧少頃復索又與一大盞放盞通身大汗安睡熱除不煩湯藥而愈同時有西客二人亦患此症皆與水而安薛立齋治一男子盛暑發熱胸背皆疼痛飲湯自汗用發表之藥憒譫語大便不實吐痰甚多用十全大補一劑頓退又用補中氣加炮薑二劑而愈王肯堂治余雲衢太史形氣充壯飲啖兼人辛卯夏六月患熱病肢體不甚熱而間揚手擲足如躁擾狀昏憒不知人事時發一二語不了了而非譫語也脈微細如欲絶有謂是隂症宜溫者有謂當下者時座師陸葵曰先生與曽植齋馮琢庵二太史皆取決于王王謂是陽病見隂脈法在不治然素稟如此又值酷暑外熾酒炙肉炙宜狂熱如焚不大便七日矣姑以大柴胡湯下之時用熟大黃二錢而太醫王雷菴力爭以為太少不若用大承氣王曰如此脈症豈宜峻下待大柴胡不應而後用調胃承氣再不應後用小承氣以及大承氣未晚也服藥大便即行脈已出手足溫矣乃謂雷菴日設用大承氣寧免噬臍之悔哉繼以黃連解毒湯數劑而平七月初遂與陸先生同典試南京不復發矣明年王請告歸里偶得劉河間傷寒直格論讀之中有云畜熱內甚脈須疾數以其極熱畜甚而脈道不利反致脈沈細欲絶俗未明造化之理反謂傳為寒極陰毒者或始得之陽熱暴甚而便有此症候者或兩感熱甚者通宜解毒加大承氣湯下之下後熱少退而未愈者黃連解毒湯調之或微熱未除者涼膈散調之或失下熱極以致身泠脈微而昏冒將死者若急下之則殘陰暴絶而死蓋陽氣後竭而然也不下亦死宜涼膈散或黃連解毒湯養陰退陽積熱漸以宣散則心胸再暖脈漸以生然後撫卷而歎曰古人先得我心矣余太史所患正失下熱極以致身冷脈微而昏冒欲絶也下與不下大下與微下死生在吁吸間不容髮鳴呼可不愼哉宜表而出之以為世鑒馬元儀治馮太史因客邸無聊挾妓為樂值內虛之際又苦暑熱因而晝夜發熱煩渴引飲焦躁不寧脈之細數而急尺帶弦神氣不清此房勞過度真陰受虧陽往乘之也且煩渴身熱神昏火邪內擾外淫已極當此盛夏火炎土燥埀絶之陰其足以供燔灼者幾何若不急救其陰大事去矣用生首烏二兩為君以救肝腎之陰佐以黃連知母柴胡黃芩枳殼半麴橘紅杏仁熱化痰之品一劑而神氣清再劑而大便解熱解大半再以人參製首烏鱉甲丹皮白芍甘草調和陰陽之劑而退熱又以人參逍遙散而安張意田治角江焦姓人七月間患壯熱舌赤少腹滿悶小便自利目赤發狂已三十餘日初服解散繼則攻下俱得微石而病終不解診之脈至沈微重按疾急夫表症仍在脈反沉微者邪陷入於陰也重按急疾者陰不勝其陽則脈流薄疾并乃狂矣此隨經瘀血結於少陽也宜服抵當湯乃自為製虻蟲水蛭加桃仁大黃煎服服後下血無算隨用熟地一味搗爛煎汁時時飲之以救陰液候其通暢即用人參附子炙草漸漸服之以固真元共服熟地二斤人參半斤附子四兩漸得平復施笠澤治孝亷唐後坡長公病寒熱面赤頭齒大痛診之脈洪而數此熱病也當用白虎湯每劑石膏一兩一劑而頭及齒痛俱已寒熱亦除但脈尚摶指曰須仍前再進一劑不然兩日後定發癍矣乃疑而謀之專科曰是何斗膽也石藥豈堪重劑乎置不服半月後復求治云兩日後果發癍癍十日不解解後身猶灼熱曰曲突徙薪其有功乎投柴苓芍藥湯一劑而熱退後用參术調理而痊友人章深之病心經熱口燥唇乾百藥不效有教以犀角磨服者如其言飲兩碗許症頓愈遊宦紀聞宋張世南凌表姪年二十餘丙子患熱症初愈醫即與四君乾薑巴戟諸氣分溫補藥久之益覺憔瘦壯若顚狂當食而怒則囓盞折筋不可遏抑所服丸藥則人參養榮也沈綿年許其母問豫豫曰此餘熱未清遽投溫補所致與甘露飲方令服十餘劑遂痊甲申夏復患熱症嘔惡不眠至七日擬用白虎湯以先日服犀角地黃而吐疑為寒不敢服延一盧醫至診其脈伏按其腹痛謂此疝症非外感也脈已全無危險甚矣姑與回陽得脈復乃佳所用胡盧巴吳茱萸肉桂乾薑木香小茴香丁香青皮橘核等約重三兩餘令急煎服蓋是日夜半當戰汗故脈伏而厥痛彼不審以為寒症也乃用此方黃昏服下即躁擾煩渴揚手擲足譫語無倫汗竟不出蓋陰液為躁熱所劫不能蒸發矣侵晨再亟診脈已出且洪數而目大眥及年夀間皆迸出血珠鼻煤唇焦舌漸黑小便絶無令以鮮地黃四兩搗汁一茶杯與之飲下即熟睡片時醒仍躁擾再與白虎湯加鮮地黃二兩煎服熱漸退神漸清次日漸進粥二白睛赤如鳩目繼而口鼻大發瘡痬改與大劑甘露飲二十餘日始便黑糞甚夥猶時時煩擾服前方至五十餘日忽大汗自頂至足極臭自是全瘳燥張子和治陽夏胡家婦手足風裂其兩目昏漫張曰厥陰所致至為璺又曰鳴紊啓折皆風之用風屬木木鬱者達之達為吐也先令涌之繼以調胃承氣湯加當歸洗之立效喻嘉言治葉茂卿子出痘未大成漿其殼甚薄兩月後尚有著肉不脫者一夕腹痛大叫而絶令取梨汁入溫湯灌之少蘇頃復痛絶灌之又蘇遂以黃苓二兩煎湯和梨汁與服痛止令製膏子藥頻服不聽其後忽肚大無倫一夕痛叫小腸突出臍外五寸交組各二寸半如竹節壺頂狀莖物絞摺長八九寸明亮如燈籠此實未經聞見以阿膠黃苓二味日進十餘劑三日後始得小水五日後水道清利臍收腫縮而愈門人駭問答曰夫人一身之氣全關於肺肺清則氣行肺濁則氣壅肺主皮毛痘不成漿肺熱而津不行也殼著於肉名曰甲錯甲錯者多生肺癰癰者壅也豈非肺氣壅而然歟腹痛呌絶者壅之甚也壅甚則并水道亦閉是以其氣橫行于臍中而小腸且為突出至于外腎弛長尤其剩事耳用黃芩阿膠清肺之熱潤肺之燥治其源也氣行而壅自通源清而流自清矣緣病已極中之極惟單多用可以下行取效故立方甚平而奏功甚捷耳試以格物之學為子廣之凡禽畜之類有肺者有尿無肺者無尿故水道不利而成腫滿以清肺為急肺主通調水道又水出高原故謂之化源此義前人闈發不到後之以五苓五皮八正等方治水者總之未悟此旨至於車水放塘種種劫奪膀胱之劑則殺人之事矣可不審哉趙我完次子秋月肺氣不能下行兩足腫潰而小水全無肺氣敗者多此二症臍中之痛不可名狀以手揉左則攻於右揉右則痛攻於左當臍揉尉則滿臍俱痛叫喊不絶利水之藥服數十劑不效用敷臍法及單服琥珀末兩亦不效診時彌留已極無可救藥矣傷哉吕東莊治徽人江仲連冒寒發熱火為寒邪所鬱兩頷􅀈腫如升子大狀類雷頭風俗名豬頭風臂膊磊塊無數不食不便狂燥發渴診其脈浮數無序醫作傷寒發毒治吕曰誤矣此燥逐風生也用大劑疏肝益腎湯熟地加至二兩五劑而腫退便解十劑而熱除進食再用補中益氣湯加麥冬五味而痊陸肖愚治李安吾姪年十三大腸燥結不時脫肛鼻中結塊不時出血平日喜讀書病由辛苦而得每勞則發久治不效診之骨瘦如柴面紅身熱其脈細數曰此天稟燥火之症若破身後則成勞怯矣急宜治之戒厚味節誦讀庶可療也用天麥冬各一斤生地半斤人參四兩即加減三才膏也服一料其發甚稀至三料將一年全愈萬密齋治一女子年十四歲病驚風後右手大指次指屈而不能伸或用羌活防風天麻全蝎僵蠶蟬蛻諸風藥治之病益甚曰手足不隨血虛也伸而不能屈者筋弛長也屈而不能伸者筋短縮也皆血虛不能養筋之症也手大指者太陰肺經之所主也次指者陽明大腸之所主皆屬燥金此血燥之病也一切風藥助風生燥致血轉虛而病轉盛用黃蓍人參天麥門冬生熟地黃當歸各等分官桂減半為引經橫行手指之端共為末蜜丸芡實大每一丸食後湯化下馬元儀治周君開病經一月口燥咽乾胸滿不能飲食二便俱閉診其脈虛而且澀此少陰客熱腎經虛燥也腎開竅于二陰腎陰既虧竅不滑澤所以二便俱閉少陰之脈循喉嚨挾舌本腎熱則經絡亦熱所以口燥咽乾腎者胃之關也關門不利胃氣亦阻之阻所以胸滿不能飲食當用仲景豬膚湯治之夫豬水畜也其氣充入腎膚味甘寒能解少陰客熱故以為君加白密以潤燥除煩白粉以補虛益氣二劑熱去燥除便調食進而愈薛立齋治周上舍脾胃虛服養胃湯枳术丸初有效而久反虛口舌生瘡勞則愈盛服敗毒藥則嘔吐此中氣虛寒也以理中湯治之少愈更以補中益氣湯加半夏茯苓月餘而平夫養胃湯香燥之藥也若飲食停滯或寒滯中州服則燥開胃氣宿滯消化少為近理使久服則津液愈噪胃氣愈虛况胃氣本虛而用之豈不反甚其病哉一男子兩掌每至秋皮厚皴裂起白屑內熱體倦此肝脾血燥故秋金用事之時而作用加味逍遙散加川芎熱地三十餘劑而愈再用六味丸加五味麥冬服之半載後手足指縫臂腿腕皮厚色白搔之則木久服前藥方愈一婦人素晡熱月經不調先手心赤癢至秋兩掌皮厚皴裂時起白皮此皆肝脾血燥用加味逍遙散加荆芥釣藤鉤川芎熟地五十餘劑又用歸脾湯二十餘劑乃服六味丸而不再發蔣仲芳治表弟婦韓貞女幼年守節勤孝清苦茹素誦經以故氣血素少而色不榮乙巳春忽冒風寒胸腹䐜脹入夏則胸脅刺痛背如負石百治無效至秋末冬初則覺腸細如線粒米入胃左盤右旋其行如飛窄澀異常痛苦難伏遇節氣則病劇診之右脈疾左脈澀曰疾者氣燥澀者血虛血虛則津液乾而腸胃收小宜其窄澀也氣燥則其行速速則米粒不安宜其如飛也遂用當歸五錢酒炒白芍二錢川芎一錢以補血為君惟其緊寬以七分服皮惟其澀利以一錢滑石惟其乾潤以二錢蘇子惟其疾緩以二分甘草四劑后諸病漸減至五六十劑榮氣始通膏子丸藥調養年餘方有起色火楊思蘭治一婦人患渾身倦怠呵欠口乾飲冷一月不食強之數粒而已有以血虛治之者有以氣弱治之者有知為火而不知火之原者用藥雜亂愈治愈病自夏至冬覺微瘥次年夏諸病復作甚於前肌消骨露診得三焦脈洪大侵上脾肺二脈沉細餘皆和平曰此肺火病也以巵子湯飲之進二服即知飢者喜食旬日氣體充實如常後因久病不孕衆皆以為血虛而用參蓍為君大補之劑胸膈飽脹飲食頓減至三月經始通下黑穢不堪或行或止不得通利治以順氣養榮十數劑一月內即有孕夫火與元氣不兩立倦怠者火耗其精神也呵欠者火鬱而不伸也口乾飲冷者火熾於土也飲食不進者火格於中也肌消骨露者火氣消爍也至經水過期而多其色紅紫肝脈有力乃氣滯血實也非順氣調經清火氣血何由而平妊娠何由而得哉孫文垣治從孫君錫頭痛胸背脹飲食下膈即吐諸逆衝上皆屬于火咳嗽不住口痰濁如膿大便燥結脈之右寸獨洪大皆金受火尅之候以二陳湯加竹茹滑石石膏黃連麥冬連進四劑夜與益元散兼服益元能清六府之火然不宜與大便燥結之人咳嗽俱止惟痰濁如膿色且腥氣觸人此將作肺癰改用丹皮麥冬山巵甘草貝母枳殼桑白皮紫菀知母當歸生地桔梗服四劑全愈楊思蘭治一士人素耽詩文夜分忘寢勞神過度忽身熱煩渴自汗惡寒四肢微冷飲食少減初以為外感先發散次和解不應又用補中益氣湯加參二錢踰月諸症仍前一日午後發熱忽耳聾不知人恍愡譫語或謂少陽症也宜小柴胡和之易診之六脈皆洪大無力曰非少陽症乃勞神過度虛火症也不信遂以小柴胡去半夏加花粉知母楊謂服此必熱愈甚當有如狂症作已而胸如火炙刀刺發狂欲走飲冷水一盞始定復求治以人乳並人參湯與之當日進四服濃睡四五時病減半次日又進四服六脈歸經沉細有力終夜安寢諸症悉除或曰是症人謂傷寒今作虛火何也曰傷寒自表達裏六日傳遍經絡復傳至二十一日外雖有餘症亦從雜病論今病已二月豈可以傷寒論乎况少陽之脈弦長有力今浮洪滿指而無力豈少陽脈耶蓋平日勞神過分心血久虧肝脾亦損陽氣獨盛氣即火也經云壯火食氣火與元氣不兩立于是水涸火勝之病作矣傷寒云乎哉夫小柴胡乃治少陽實症今陰虛病而以此㵼之則元氣愈虧陰火愈熾故知其當發狂也又補中益氣湯補陽者也陰虛而補陽陽愈盛而陰愈虛所以不效今用人乳者以真血補真水又以人參𨗳引散於諸症以濟其火與他藥不同故見效猶速也龔子才治管藩相夫人每至夜半不睡口乾煩渴吐黏痰必欲茶水嗽口舌上赤黑皮厚胸痞嘈囃飲食少思脈之兩寸洪數兩尺空虛右氣口盛此上盛下虛血虛氣鬱而有火也以四物湯加生地黃連麥冬知母貝母花粉元參巵子桔梗枳實青皮甘草數臍奏功又以六味丸加生地麥冬知母元參花粉貝母五味黃連一料全安陳三農治一士人素好滋補之劑久之致口舌乾燥腦後作痛神思不爽飲食減少食肉則㵼六脈實大作實火治以知柏連巵赤芍甘草一劑而胸次爽豁痛㵼俱止再劑飲食倍加精神頓長諸症悉愈書此以為無病好補之戒陸養愚治董龍山妾每小腹氣上衝則熱壅頭面臥不能寐身戰慓日中發熱無常至四鼓五鼓其熱更甚熱時腹中有塊升起經期參前而淋漓數日飲食過於平時而肌肉消瘐或作陰虛發熱治之數月不效脈之數而弦左關尺為甚曰此肝膽病也膽主決斷謀慮不決則木氣鬱而成火故於少陽初動之時其熱更甚也因膽之氣既鬱而成火則肝之血亦滯而成瘕瘕非血不聚非火不升今塊之上升熱之上壅即經所謂諸逆衝上皆屬於火也苐初病止在無形之氣但調其氣而火自息今兼在有形之血必先去瘀令有形消而後無可調也適在經行之際乃以女金丹連服去瘀塊甚多後以達氣養榮湯盡其舊以生其新數劑諸症漸愈再用檳榔加人參數劑而肌肉漸長矣張玉路治張太史虛火症脈之右關氣口獨顯弦象右尺微數餘皆微細搏指蓋陰火內伏也緣勞心太過精氣滑脫加以怵惕恐懼怔忡驚悸醫唆用人參桂附初稍可交春復劇如前仍用參附導火歸元固斂精氣之藥轉劇凡陰虛病初服桂附有小效久服則陰竭而脫余日擊者百十人矣稍用心則心系牽引掣痛痛連脊骨對心處或時痛引膺脅或時顛頂如掀或時臂股瓜甲皆隱隱作痛怔忡之狀如確杆如牽繩如簸物如綳絹如以竹擊空控引頭中如失腦髓夢寐不寧達旦倦怠睡去便欲失精精去則神魂如飛越觀其氣色鮮澤言談亹亹總屬真元下脫虛陽上擾之候其人本病三陰虛損誤以參附熱補遂至變病蜂起細推脈症其初雖屬陽氣虛脫著此一語便於此道未徹而過餌辛溫之劑致陽亢而反耗真陰當此急宜轉關以救埀絶之陰庶可挽回前過為疏二方煎用保元合四君丸用六味合生脈此時却宜二地二冬竗參杞子少加川連蔞仁養陰兼解鬱之法俟元氣大復然後議補乃為合法六味生脈留為後徑若保元四君則仍魯衛之政耳服及兩月諸症稍平但倦怠力微因自檢方書得補中益氣湯為夏月當用之劑於中加入桂附二味一啜即喉痛聲瘖用補中益氣者宜著眠復邀診見其面顔精彩聲音忽瘖莫解其故詢之知為升柴桂附擾動虛陽所致即以前方倍生脈服之半月後聲音漸向安但衣被過暖便咽乾痰結稍涼則背微惡寒或熱飲則大汗時怔忡走精此皆宿昔過用桂附內伏之熱所致也適石門董某謂其伏火未清非苓連不解散自仲春至初夏純服苦寒亦大庸手初甚覺爽朗至是反覺精神散亂氣不收攝後仍用六味合生脈經歲服之以化桂附餘毒云內翰孟端士之母虛火不時上升自汗不止心神恍惚欲食不能食欲臥不能臥口苦小便難溺則灑浙頭暈凡醫每用一藥輒增一病用白术則窒塞脹滿用橘皮則喘息怔忡用逺志則煩擾閧熱用木香則腹熱咽乾用黃耆則迷悶不食用枳殼則喘咳氣乏用門冬則小便不禁用肉桂則顱脹咳逆用補骨脂則後重燥結用知柏則小腹枯用苓巵則臍下築築少腹愈覺收引遂致畏藥如蠍惟日用人參錢許入粥飲和服聊藉支撑交春虛火倍劇火氣一升則周身大汗神氣駸駸欲脫惟倦極少寐則汗不出而神氣稍寧覺後少頃火氣復升汗亦隨至較之盜汗逈殊診之其脈微數而左尺與右寸倍於他部氣口按之似有似無此本平時思慮傷脾脾陰受困而厥陽之火盡歸於心擾其百脈致病病名百合此症惟仲景金匱言之甚詳原云諸藥不能治所以每服一藥輒增一病惟百合地黃湯為之專藥奈病久中氣虧之復經藥誤而成壞病姑用生脈散加百合伏神龍齒以安其神稍兼茱連以折其勢數劑少安即令勿藥以養胃氣但令日用鮮百合煮湯服之交秋天氣下降火氣漸伏可保無虞逮至仲秋果勿藥而愈喻嘉言治吳添官因母久病初愈自患腹痛徹夜叫喊不絶小水全無知為火鬱之痛以茱連加元胡索投之始安又因傷食反覆病至二十餘日肌肉瘦削眼胞下陷適遭家難症變壯熱目紅腮腫全似外感有餘之候知其為激動其火上焚令服六味加知柏二十餘劑其火始退後遍身瘡痍黃腫燥火反類濕熱腹中急欲得食不能少耐片時鎮日哭煩臟燥者多哭泣慰之曰旬日後腹稍充氣稍固即愈矣服二冬膏而全瘳朱丹溪治一人小腹下常唧唧如蟹聲作陰火處治用敗龜板用酥炙鹽酒炙亦得側柏用酒九蒸九焙黃柏知母俱酒炒川芎酒製當歸酒浸右各等分酒糊丸每服八十丸淡鹽湯送下陸祖愚治符卿夫人素有痰火症再遇經行一日覺澀滯二日即洶湧三日大下如崩或昏暈幾絶嘗喜怒發即咽喉乾燥氣出如火痰涌胸塞不能轉舒其平日辛燥之品如陳枳前术及芎歸之類稍用即暈眩氣絶不足以息及寒涼稍過即大便作泄病作時日進粥十餘碗不覺飽脈之左三部弦細而駛右脈數而稍充曰此血虛甚故狂火偏旺如此而氣原非有餘也此時養血則血一時不能充補氣則浮火無由熄莫若分上下為治入人參於滋陰藥中為丸引陽入陰以扶生氣之原所以治其本也再用清涼以為煎劑助陰抑陽以制浮遊之火所以治其標也煎丸間服而愈丸方人參二地二冬知柏阿膠杜仲煎方花粉元參二母苓苓地芍麥冬甘草隨症加減夫天地之間陽常有餘陰常不足人身之中氣常有餘血常不足氣有餘便是火血不足則陰虛三十以前精神氣血日漸旺盛三十以後日漸衰微語曰陰陽水火猶權衡也一髙則一下一盛則一衰又曰火與元氣不兩立故凡火盛之症必先陰虛而後元氣亦弱也朱丹溪治一人夜間發熱早晨退五心發熱無休六脈沉數此鬱火也用升陽散火湯熱退以四物加知柏佐以乾薑調理而安東垣治一人惡熱目赤煩渴引飲脈七八至按之則散此無根之火也用薑附加人參服之愈劉彥純治一人不能食而熱自汗氣短不食而熱脾隂弱也自氣短肺氣虛也以甘寒之劑補氣㵼火而安琇按治法只從壯火食氣四字得之薛立齋治一婦人口苦脅脹此肝火之症也用小柴胡加山巵黃連少愈更以四君子加白芍當歸柴胡調補脾胃而痊一婦人每怒口苦發熱䀯熱此肝火盛而血傷也以小柴胡合四物湯二劑以清火而生血更以四物加柴胡白术茯苓丹皮生血健脾而愈一婦人每怒則口苦兼辣胸痛脅脹乳內或時如刺此肝肺之火也用小柴胡加山巵青皮芎歸桑皮而安後又勞怒口復苦經水頓至此屬內火動血得熱而妄行用四物加炒苓炒巵膽草一劑而血止更以加味逍遙散而愈張玉路治徐君玉素稟陰虛多火且有脾約便血症十月間患冬溫發熱咽痛里醫用麻杏橘半枳實之屬遂喘逆倚息不得臥聲颯如􅀈頭面赤熱手足逆冷右手寸關虛大微數此熱傷手太陰氣分也與蔞㽔甘草等藥不應為製豬胃湯一甌命隔湯頓熱不時桃服三日聲清終劑病如失朱丹溪治施卜年四十因炙火太多病腸內下血糞肚痛今痛自止善嘔清水食不下宜清胃口之熱黃芩甘草茯神各五分陳皮地黃各一錢連翹白术各一錢五分生薑三片楊乘六治姚又曾病感症二字在此案却不必泥外涼內熱肢冷口渴痞悶昏沉語言譫妄不食不便婦人産後血虛火盛者循多此症不必有所感也醫作肝經鬱火治用逍遙加生地薄荷兩劑益煩燥不安脈沉伏按之至骨則細有力面黑滯舌黃燥乃遏陽明胃隂不能充拓所以脈與症皆內顯陽徴外呈隂象也或問症既火遏法宜疏散乃服前劑轉劇何也曰逍遙中柴胡薄荷風藥也單走肝膽若陽明病用之則火得風而亦熾矣苐用左歸飲去茯苓以滋味隂加生地當歸以清胃火症自平耳如言病減數劑而痊後數年病復如前醫見身涼脈細用左歸飲加附子則神清昏憒狂擾不寧即前方去附子加粉花一劑而安乃去花粉數劑而愈龔子才治一人頭痛發熱眩暈喘急痰涎涌盛小便頻數口乾引飲遍舌生刺縮斂如荔枝下唇焦裂面目俱赤煩燥不寐或時喉間如煙火上衝急飲涼茶少解已瀕於死脈洪大而無倫且有力捫其身烙手此腎經虛火遊行于外投以十全大補加山萸澤㵼丹皮山藥麥冬五味附子一鍾必須冷服熟睡良久脈症略減三四再以八味丸服之諸症悉退後畏冷物而痊薛立齋治李閣老序菴有門生饋坎離丸喜而服之曰前丸乃黃柏知母恐非所宜服者內經有云壯火食氣少火生氣今公之肝腎二脈數而無力宜滋化源不宜㵼火傷氣也不信服將二月脾氣漸弱發熱愈甚小便澀滯兩拗腫痛公以為瘡毒曰此肝腎二經虧損虛火所致耳當滋補二經為善遂朝用補中益氣湯夕用六味地黃丸諸症悉愈嘗見脾胃虛弱肝腎陰虛而發熱者悉服十味固本丸與黃柏知母之類反泄真陽令人無子可不慎哉一男子口舌糜爛津液短少眼目赤小便數痰涎壅盛腳膝無力或冷或午後足熱勞而愈盛數年不愈服加減八味丸而痊一男子咳嗽喘急發熱煩躁面赤咽痛脈洪大用黃連解毒湯二劑少退更以巵子湯四劑而愈蔣仲芳治楚中一商性急而初嗜煙閲三日五心發熱咳嗽大作百藥不愈診之六脈俱洪火症也莫非煙毒乎其人亦悟曰吸煙則嗽愈甚遂以麥冬知母山巵花粉黃芩蘇子甘草蔞仁枇杷葉煎成去查入砂糖一兩和服四劑而愈聶久吾曰豫稟素弱神雖強而精甚弱脾腎兩虛即節欲猶然二十前後常服參术等補脾而僅免於病至三十後脾胃稍可頗覺上膈有熱時齒痛口舌痛每服清上藥輒愈亦不為大害也至乙未春夏自察脈覺兩尺弱而寸關亦不晤疑下虛水不能制火宜補下滋水以制之若但清上非治本也啇之饒姓老醫亦以為然遂用人參當歸熟地茯苓五味石棗肉巴戟故紙肉蓯蓉鹿膠仙茅逺志棗仁天麥冬枸杞兔絲之類以山藥末酒糊為丸服至兩三月上膈虛火盡除口齒等病不復作自後滋補丸藥服無虛日迄今二十餘年無虛火者滋水制火之功也可與虛門黃履素按合𠫭續名醫類案卷八
