body:
  text: 續名醫類案卷五十錢塘魏之琇撰乳薛立齋治一婦人因怒兩乳腫兼頭痛寒熱此肝經氣症也用人參敗毒散二劑表症已退用小柴胡加芎歸枳殼桔梗四劑而愈一婦人因怒左乳作痛胸隔不利此屬肝脾氣滯以方脈流氣飲加木香青皮四劑而安一婦人久鬱左乳內結核如杏三月不消心脈澀脾脈大按之無力此肝脾氣血虧損以八珍加貝母逺志香附柴胡青皮桔梗五十餘劑而消一婦人乳內結核年餘晡熱少食此氣血不足欲用益氣飬榮湯彼反服行氣之劑潰出清膿而歿又一婦乳內結核如栗亦服前藥大如覆碗堅硬如石出血水而歿又郭氏妾乃放出宫人乳內結一核如栗亦以前湯彼不信乃服瘡科流氣飲及敗毒散三年後大如覆碗堅硬如石出水不潰亦歿大抵鬱悶則脾氣阻肝氣逆則成隱核不痛不癢人多忽之最難治療若一有此宜戒七情逺厚味解鬱結更以養氣血之藥治之庶可保全否則不救亦有二三載或五六載方潰陷下者皆曰乳巖以其形巖凸似巖穴也最毒慎之可保十中一二也一婦人腫而不作膿以益氣養榮湯加香附青皮數劑而膿成針之旬日而愈一婦人右乳腫發熱怠惰嗜卧無氣以動至夜熱亦甚以補中益氣湯兼逍遙散治之而痊一男子左乳腫硬痛甚以仙方活命飲二劑而止更以十宣散加青皮四劑膿成針之而愈若膿成未破瘡頭有薄皮剝起者用代針之劑點起皮處以膏藥覆之膿亦自出不若及時針之不致大潰如出不利更絍搜膿化毒之藥若膿血未盡輒用生肌之劑反助邪氣縱早合必再發不可不慎也一男子年踰五十患子不立事左乳腫痛左脅脹腫肝脈弦數而澀先以龍薈丸二服諸症頓退又以小柴胡對四物加青皮貝母逺志數劑而膿成欲針之仍以養氣血解鬱結彼不從乃雜用流氣敗毒之劑致便祕發熱作渴復請治謂膿成不潰陽氣虛不能鼓舞也便祕發熱隂血竭不能濡潤也辭不治果死一男子因怒左乳腫痛肝脈弦數以復元通氣散二服少愈以小柴胡湯加青皮芎歸數劑而消復元通氣散木香茴香青皮甲片陳皮白芷甘草漏蘆貝母各等分每服三錢溫酒調下孫文垣姪婦素有痰涎胸膈痞脹近因乳腫大發寒熱欲成癰以加味神效瓜蔞散二帖寒熱退而腫不消用貝母白芷為臣瓜蔞為君赤芍當歸連翹為佐青皮甘草柴胡為使痛減腫仍不消脈之近數知已成膿乃與內托十宣散加銀花蒂丁二帖而膿潰因腳上生瘡且有浮氣前方去蒂丁銀花加苡仁蒼耳子調理全安薛立齋治王汝道室年踰三十每怒後乳內作痛或腫此肝火所致用小柴胡合四物加青皮桔梗香附枳殼而愈彼欲絶去病根自服流氣飲遂致朝寒暮熱益加腫痛此氣血被損而然與八珍三十餘劑喜其年壯元氣易復得愈一婦人乳內腫一塊如雞子大勞則作痛久而不消服托裡藥不應此乳勞症也屬肝經血少所致先與神效瓜蔞散四劑更隔蒜灸之腫稍退再與八珍湯倍加香附夏枯草蒂丁仍間服前散月餘而消亦有乳疽一症其狀腫硬木悶雖破而不潰腫亦不消尤當急服此散及隔蒜灸法此乳腫症氣血為七情所傷亦勞症也宜戒惱怒節飲食慎起居否則不治一婦人患乳癰氣血頗實但瘡口不合百治不應與神效瓜蔞散四劑少可更與數劑及豆豉餅灸之而愈一婦人患此未潰亦與前藥三劑而消陳良甫曰婦人乳勞便服此藥可杜絶病根毒已成能化膿為水未成者則從大小便散之一人抱疾小愈左乳復生癰繼又胸膈間結核其堅如石荏苒半載百藥不能施已而牽掣于肩痛楚特甚禱于張王祠夢間語曰但用生薑自然汁製香附服之可也比覺簡本草視之二物治症相符訪醫者張祿亦云有理用香附去毛薑汁浸一宿為末二錢米飲調才數服瘡膿流出腫硬漸消而愈搓菴小乘朱丹溪治一婦人年六十厚味鬱氣而形實多妬夏無汗而性急忽左乳結一小核大如棋子不痛自覺神思不佳不知食味經半月以人參湯調青皮甘草末入生薑汁細細呷一日夜五六次至五七日消矣此乃妳巖之始不早治隱至五年十年已後發不痛不癢必于乳下潰一竅如巖穴出膿又或五七年十年雖飲食如故洞見五內乃死惟不得于夫者有之婦人以夫為天失于所天乃能生此謂之巖者以其如穴之嵌岈空洞而外無所見故名曰巖患此者必經久淹延惟此婦治之早正消患于未形餘者皆死凡十餘人又治一初嫁之婦只與青皮甘草與之安二孺人但經將行而乳腫先兩日發口乾而不渴食少減脈左弦帶數右却平治用四物湯加陳皮白术茯苓帶熱下與點丸三十粒義二孺人平時乳內有結核不為痛忽乳邉又有一腫核頗却有此痛黃芩川芎木通陳皮各四錢人參二錢白芍一錢大腹皮三錢炙甘草生甘草各一錢當歸頭一錢分二帖煎服楊孺人乳腫痛青皮石膏連翹角刺黃藥子當歸頭木通各一錢生甘草三分入好酒些少同煎飲又别藥洗腫處李東垣治一婦人乳間出黑頭瘡瘡頂陷下作黑眼子其脈弦洪按之細小升麻連翹葛根各一錢半肉桂三分黃芪歸身甘草炙各一錢牛蒡五分黃柏二錢水煎至一盞二服愈立齋治一婦人患乳癰寒熱頭痛與荆防敗毒散一劑更與蒲公英一握搗爛入酒二三盞再搗取汁熱服查熱罨患處而消丹溪云此草散熱毒消腫核又散滯氣解金石毒之聖藥陳良甫云開慶間淦川嘉林曽都運恭人年已五十而病妳癰癰缺後果不起以此稱聖醫此妄説也癸亥年僕處五羊趙經略夫人年七十一嵗隔一二年前左乳房上有一瑰如鵝卵大今忽然作楚召豫議藥僕云據孫真人云婦人年五十嵗以上乳房不宜見癰見則不可治矣幸而未破恐是氣瘤漫以五香連翹湯去大黃煎服服後稍減則已過六七年後每遇再腫脹時再合服必消減矣良方立齋曰一婦人乳內結核年餘不消口乾倦怠脈澀少食此肝脾二經血氣虧損之症宜培養為主乃用草藥敷帖遂不救繆仲淳治顧文學又善內人患左乳巖用夏枯草蒲公英為君銀花漏蘆為臣貝母桑葉甘菊雄鼠糞連翹白芷紫花地丁山茨菰炙草瓜蔞茜根陳皮乳香沒藥為佐使另用夏枯草煎濃汁丸之服斤許而消三年後右乳復患用舊存餘藥服之亦消後以此治數人俱效廣筆記馬銘鞠治沈姓婦患乳癧潰爛經年不見臟腑者一膜耳用鼠糞土楝樹子經霜者佳川楝不用露蜂房各三錢俱煅存性各取淨末和勻每服三錢酒下間兩日一服痛即止不數日膿盡收斂此方傳自江西販糖客因治祝氏喉症得之廣筆記張王屋屠後江孟修兄驗過乳癖方白芷一錢雄鼠糞一錢二種晒乾為末用好酒調服飲取一醮睡而愈雄鼠糞尖者是又一神驗方用活鯽魚一個山藥一段如魚長同搗汁敷乳上以紙蓋之立愈廣筆記薛治一婦人乳癰愈後發熱服養氣血藥不應與八珍湯加炮薑四劑而止仍以前湯加黃芪香附三十餘劑氣血平復一婦年逾二十稟弱乳內作痛頭疼脈浮與人參敗毒散倍加人參一劑表症悉退但飲食少思日晡微熱更以小柴胡湯合六君子湯二劑熱退食進方以托裡藥加柴胡十餘劑針出膿而愈又一婦患此症膿成畏針病勢漸盛乃強針之膿出三碗許脈數發渴以大補藥三十餘劑而愈丹溪云乳房為陽明所經乳頭為厥隂所屬厥隂者肝也乃女子致命之地宗筋之所且各有囊槖其始焮腫雖盛受患止于一二囊若膿成不針攻潰諸囊矣壯者猶可弱者多致不救所以必針而後愈也錢國賔治一婦人年五十六左乳患已七年爛過半矣中間一孔如桃時流血水凡帖膏藥痛反增劇以布圈繫護防其摩擦夫乳頭屬足厥隂肝乳房屬足陽明胃乃肝胃二經之症非單方不足以治其外非峻補不足以養其內以形色氣味治之用陳香櫞一個其穰之瓣如乳內之房其色先青而後黃青屬肝黃屬胃其味先酸而後甘酸屬肝甘屬胃其氣香能通肝胃之氣煅黑止血酒服和經此治其乳也製一枚為末作二次服又用酒炒黃芪二兩益氣實表土炒白术二兩山藥五錢健脾收濕芎歸地芍各一錢養血水六碗煎三碗作四次服調至一月痊胸癰薛立齋治一男子胸患癰腫髙焮痛脈浮而緊以內托復煎散二劑表症悉減以托裡消毒解四劑而消一男子素弱胸患癰飲食少而倦以六君子湯加芎歸黃芪膿成針之更以托裡藥而愈一男子胸患癰焮痛煩燥發熱作渴脈數而實時季冬謂此熱毒內畜也須捨時從症欲治以內疏黃連湯彼以時當隆寒乃雜用敗毒藥愈熾仍求治投前湯二劑後去二次諸症悉退以金銀花散加連翹山梔四劑出水而消大抵症有主未治有權宜治其主則末自退用其權則不拘于時泥于守常必致病勢危甚况雜用攻劑動損各經故丹溪云凡瘡發于一經只當求責本經不可干擾餘經羅謙甫云守常者衆人之見知變者智者之事知常而不知變細事因而取敗者多矣一男子胸患毒焮痛喜冷脈洪數以黃連解毒湯二劑頓退更以金銀花散六劑而消一少婦胸膺間潰一竅膿血與口中所咳相應而出以參芪當歸加退熱排膿等藥而愈余按此因肺痿所致原注張都憲夫人性剛多怒胸前作痛肉色不變脈數惡寒經云洪數之脈應發熱而反惡寒瘡疽之謂也今脈洪數則膿已成但體豐厚故色不變似乎無膿以痛極始肯用針入數寸膿出數碗遂以清肝消毒藥治之而愈設泥其色而不用針無可救之理矣琇按肝脈挾胃貫鬲又曰是所生病者為胸滿故胸之癰疽本由于肝也楊百户胸患毒腫髙焮赤發熱脈數大小便澀飲食如常齊氏曰腫起色赤寒熱疼痛皮膚壯熱頭目昏重氣血之實也又云大便硬小便澀飲食如故腸滿膨脹胸膈痞悶肢節疼痛身熱脈大精神昏塞臟腑之實也遂以黃連內疏湯二劑諸證漸退更以荆防敗毒散加芩連山梔四劑少愈再以四物加芩連白芷桔梗甘草銀花數劑而消一男子胸腫一塊半載不消令明灸百壯方潰與大補藥不斂復灸以附子餅而愈張路玉治談仲安體肥善飲初夏患壯熱嘔逆胸膈左畔隱痛手不可拊便溺澀數舌上滑胎食後痛嘔稠痰漸見血水脈來澀澀不調與涼膈散加石斛連翹下稠膩極多先是醫作肺癰治不效張曰肺癰必咳嗽吐腥穢痰此但嘔不嗽洵為胃病無疑下後四五日復嘔如前再以小劑調之三下而勢甫平後以保元苓橘平調二十日而痊先時有李姓者患此専以清熱豁痰解毒為務直至膈畔潰腐膿水淋漓纒綿匝月而斃良因見機不早悔無及矣琇按是症最難别白即內經所謂內有裹大膿血之症也吾鄉一名醫自患此同道診之不知為癰也雜進參附丁桂之劑久之吐出臭膿乃省已無及矣脅癰薛立齋治一婦人脅患癰未成膿惡寒脈緊以十宣散加柴胡二劑表症悉退更以托裡散數劑膿清而愈一男子近脅患疽腫而不潰投大補之劑潰而已愈後患弱症而歿一上舍年逾四十因怒脅內作痛不止數日後外結一塊三寸許漫腫色不赤按之微痛此怒氣傷肝致血傷氣鬱為患以小柴胡湯對四物倍用芎歸黃芪貝母肉桂治之彼謂丹溪云腫瘍內外皆壅宜托裡表散為主又云凡瘡未破毒攻臟腑一毫熱藥斷不可用况此症為氣血凝滯乃服流氣飲愈虛始信而復求治視之虛症併臻診之胃氣更虛彼欲服薛前藥曰急者先治遂以四君子湯加酒芍炮薑四劑少得更加當歸又四劑胃氣漸醒乃去薑又加黃芪芎歸肉桂數劑瘡色少赤并微作痛又二十餘劑膿成針之却與十全大補湯喜其謹疾又兩月餘而瘳夫氣血凝滯多因營衛之氣弱不能運散豈可復用流氣飲以益其虛况各經氣血多寡不同心包絡膀胱小腸肝經多血少氣三焦膽腎心脾肺少血多氣然前症正屬膽經少血之臟人年四十以上隂血日衰且肝症俱屬不足腫瘍內外皆壅宜托裡表散為主乃補氣血藥而加以行散之劑非専攻之謂也若腫焮痛甚煩躁脈大辛熱之劑不但腫瘍不可用雖潰瘍亦不可用也凡患者須分經絡氣血地部逺近年嵗老幼稟氣虛實及七情所感時令所宜而治之常見以流氣十宣二藥概治結腫之症以致取敗者多矣此案與舊案東侍御一則正同而此之發明最為緊要而舊案節之故重録于此馬元儀治沈氏婦左脅患腫瘍長五寸許治已兩月發表托裡劑多功少診其兩脈弦數兼澀腫處低陷作痛寒熱經行不止口燥艱食此症頗危必得之勞鬱且怒邪熱結聚厥隂之位榮衛不行周身火邪獨徹上下表斂俱所不宜用生首烏一兩滋其內燥柴胡一錢疏其氣鬱枳殼桔梗各一錢舒通肺氣以制肝木杏仁蘇子各二錢調氣化痰以清上焦丹皮一錢清其血半麴一錢和其中兩劑寒熱減而經止患處焮腫潰出稠膿飲食少進瘍醫以潰後當行大補投芪术之屬復致瘡口內陷食少曰癰疽已潰當補此其常耳今兩脈遲澀遲則氣阻澀則血滯鬱而得補其鬱彌甚始猶肝木自傷既乃轉戕脾胃以缺不循常度分肉不溫經隧不行而欲瘡之斂也其可得乎夫榮衛不通須以血藥和之當歸桃仁紅花延胡索是也白术枳殼一補一㵼所以推陳氣而致新氣乾薑暖胃而和血查肉消滯而和中服二劑復大潰出稠膿碗許食進神旺而安朱丹溪診李兄年四十餘而面稍白神甚勞忽脅下生一癰腫如桃一人教用補劑衆笑且排于是流氣飲十宣散雜而進之旬餘召視之曰非惟不與補藥抑且多得解利血氣俱􅉵不可為矣已而果然立齋曰一男子因怒左脅腫一塊不作痛脈澀而浮此肝經邪火熾甚而真氣不足為患宜培養氣血為主乃用草藥敷帖遂致不救一男子因勞發熱脅下腫痛脈雖大而按之無力此氣血虛腠理不密邪氣襲于肉裡而然也河間云若人飲食疏精神衰氣血弱肌肉消薄榮衛之氣短促而澀滯故寒薄腠理而癰腫也當補之以接虛怯之氣遂以補中益氣湯加羌活四劑少可去羌活又十餘劑而愈又一男子年二十遍身微痛腰間作腫痛甚以前藥加茯苓半夏並愈一朝士腹脅間病疽經嵗或以地骨皮煎湯淋洗出血一二升家人懼欲止之病者曰疽似少快更淋之出五升許血漸淡乃止以細穰貼之次日結痂愈同上馬刀張子和治襄陵馬國卿左乳二肋間期門穴中發瘡硬而不潰痛不可忍瘍醫皆曰乳癰或曰紅絲漏或曰覷心瘡使服內托散百日又服五香連翹湯數月皆無驗張曰此馬刀也足少陽膽經之病出靈樞十二經以示之其狀如馬刀故曰馬刀堅而不潰乃邀之于食肆中使食水浸湯餅稍覺緩次日先以滄鹽上涌又以涼劑滌去熱勢約十數行腫已散矣朱葛黃家妾左脅病馬刀憎寒發痛已四五日矣張曰此足少陽膽經病也少血多氣堅而不潰不可急攻當以苦劑涌之以五香連翹湯托之既而痛止然瘡根未散有一醫者過見之曰我有妙藥可潰而為膿不如此何時而愈既絍毒藥痛不可忍外寒內嘔血不止大便黑色食飲不下號呼悶亂幾至于死再求治張曰脅間皮薄肉淺豈可輕用毒藥復令洗去以涼劑下之痛立止腫亦消腋癰薛立齋治一童子腋下患癰久不斂膿清脈大倦怠懶食少寐自汗口乾以內補黃芪湯及豆豉餅灸之兩月而愈凡瘡膿潰而清或瘡口不合或聚腫不赤肌寒肉冷自汗色脫者皆氣血俱虛也非補不可一男子腋下患毒咳逆不食腸鳴切痛四肢厥冷脈細以托裡溫中湯二劑頓愈更以香砂六君子湯二神丸而飲食頓進以十全大補湯二十餘劑而斂里中有周七者少年曽患毒左脅下得一異方用糯米炊飯乘熱入鹽塊夾蔥管少許搗極爛如膏貼患處輒消至中年腰間忽生一毒熱如火板硬痛不可忍傴僂局蹐自分必死屢藥不效急思前方如法貼之未幾大便去糞如宿垢甚多硬者漸軟數日而起廣筆記薛立齋心法云河南張承祖年逾二十腋下患毒十餘日腫硬不潰脈弱時嘔謂腫硬不潰脈弱乃陽氣虛嘔吐少食乃胃氣弱先以六君子湯加藿香砂仁治之彼謂腫瘍時嘔當作毒氣攻心治之潰瘍時嘔當作隂虛補之曰此丹溪大概之言也即諸痛癢瘡皆屬心火之意假如赤腫痛甚煩躁脈實而嘔為有餘法當下之腫硬不痛不潰脈弱而嘔為不足法當補之亦有痛傷胃氣或感寒邪穢氣而作嘔者雖腫瘍尤當助胃壯氣彼執不信用攻伐之藥病愈甚復請診其脈微細而發熱謂熱而脈靜脫血脈實汗後脈躁者皆難治後果然夫腫瘍毒氣內侵作嘔十有一二潰瘍濕氣內侵作嘔十有八九豈可混為一途朱文鼎母因忿鬱腋下結一核二十餘年因怒加腫痛完穀不化飲食少思東垣云㵼利不止飲食不入此腸胃虛也遂以六君子湯加砂仁肉桂乾薑肉豆蔲㵼雖止而膿清瘡口不合氣血俱虛也以十全大補湯月餘而愈一男子年逾五十腋下患毒瘡口不合右關脈數而渴此胃火所致用竹葉黃芪湯遂止再用補氣藥而愈嘗治午後發渴或發熱用地骨皮散亦效續名醫類案卷五十
