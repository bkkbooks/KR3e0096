body:
  text: 續名醫類案卷四十錢唐魏之琇撰小兒痘目徐仲光治一兒痘后目黑睛初起細白點大便順而日晡潮熱有用雞䏶肝花粉威靈仙煮食其瞳神即髙腫突出白晴紅腫徐用瀉青九煎服兼用羽皇散五六劑而愈一兒白睛生翳漸掩黑睛連用去風去翳涼血清熱等藥不效即用瀉青丸及羽皇散間服數劑而安鵝不食草鹽酒焙乾白蒺藜各一兩谷精草石決明各二兩旋覆草蟬蛻川芎龍膽草各五錢羊膽三個蜜丸每服二錢鹽湯下羽皇散萬密齋治蕭别駕女痘后不戒厚味其俗有病者必服附子食雄雞靈關元戒之不聽后兩目出淚爛弦此毒發於肝肝火旺也或曰目上下胞屬脾脾亦熱乎曰此因淚出不止浸淫潰爛也乃用瀉青丸去大黃加柴胡黃芩密蒙花蜜丸服半年而愈雷邑丞孫痘七日倒陷已與發出毒猶甚欲解其毒中氣素虛又致倒陷欲補其中恐助毒火又傷其目不如節飲食適寒溫以待自安不聽乃服參茋溫補之劑後兩目俱盲王司訓子痘後兩目畏明此肝火太旺宜服瀉肝散加柴胡蟬退黃芩初一劑用酒浸大黃乃畏苦不肯服果成內障目盲蕭氏子痘後目有白翳曰此痘瘢也治之無功果盲徐淑道痘不靨用陳氏木香散一服曰誤也必損目矣果盲其一周氏女痘後目閉不開曰痘順無餘毒必羞明症也乃試之向暗則開向明則閉不流淚此肝火邪未除耳用羌防歸尾川芎柴胡蔓荆密蒙花生甘草淡竹葉一服目開遍身痘瘢腫凸再用四物湯加荆防人參連翹甘草而愈周氏子九嵗痘後出外忽頭腫兩目不開此非毒乃風熱也用羌防升柴芎歸藁本蔓荆細辛甘菊黃芩治之愈王肯堂治從子懋鋙痘後兩目生翳羞明特甚窗牖皆以衣被覆蔽就明展兩眸視之則白膜已遍覆黑睛淚如泉涌嬰科眼科投藥不效束手告技窮矣乃閉户而思目者清陽之所越也忽焉而有翳膜是濁隂犯之也濁隂安敢與陽敵故羞明特甚乃以黃茋助清陽之氣為君生地當歸養目真血為臣羌獨防芎芷甘菊薄荷升清陽黃芩豬膽汁車前茯苓降濁隂為佐仍間服瀉青丸八劑而目開翳已去矣凡眼科點洗藥概屏不用橄欖核磨汁敷上皮而已蓋嬰幼柔脆點洗之藥必有所傷故也費建中治一女三嵗痘稀而綻突紅潤似可弗藥但烈熱如炮叫喊不絶左目掀腫如桃以大黃生地荆芥甘菊赤芍黃連木通地丁青皮自三朝及十四朝始身涼回好目亦無恙痘唇口症徐仲光治一兒痘稠密未起發而唇先黃熟目先虛閉咽喉腫痛不能飲食遍身痘俱平暗幸正頞勻朗眼眶口唇雖腫而紅活以甘桔湯加牛蒡連翹山查荆芥陳皮人中黃等清利咽膈解其脾毒而愈一兒痘四朝稠密未起脹而口唇先黃熟乃內潰之惡候必為唇刺幸餘痘光澤腳斂脾雖受毒根本猶固以補中益氣湯去白术加牛蒡連翹山查繼以保元湯理中湯而愈一兒痘稠如綴粟平塌嬌紅血散不附唇口腫硬剝落一層又一層皮薄空漿破如血汁溏瀉煩渴皆為逆候但能食安靜有胃氣也用參术連各二錢日進三服十四朝肢厥脈沉靜如死狀痘皆倒靨心胸尚溫收日漸蘇而愈痘口疳徐仲光曰一兒患血熱痘後身發熱口臭成疳潰脫上齦門牙左腮盤牙唇紅乾裂左頰下亦紅腫如發毒狀湖州沈三春外用抑陽散加蔥汁酒漿調敷腫處若靣腫而帶青紫色為實熱必成馬疳潰頰不治矣今雖腫而紅活知為另發癰也內服犀角羚羊角黃連黃芩元參生地牛蒡桔梗甘草白芍花粉木通紫花蒂丁及牛黃散一二服或煎銀花一兩入廣膠一錢間搗甘菊花根葉汁沖入服之靣腫漸平身熱漸退外吹牛黃一分珍珠三分黃蘗青黛人中白硼砂豬膽製各四分不易斂加烏梅炭三分血竭二分龍骨一分因體虛又加人參象皮灰三黃製蘆甘石各四分又常以醋調雄黃末軟筆點入潰竅中延至月餘而愈痘咽痛徐仲光治一兒患血熱痘先用寒涼芩連犀角起發灌漿頭靣身背俱濃但兩腿靣凹陷不起用參茋托之反見熱渴燥煩大便溏泄多次咽喉腫痛改用清咽利膈山豆根麥冬川貝桔梗元參防風僵蠶山甲當歸白菊紅花生地山查陳皮蚯蚓牛蒡川連黃芩甘草而愈一兒痘後咽痛壅塞不通此餘毒留於心肺邪熱不泄風痰壅盛先以桐油探吐服駝原散甘桔湯連翹牛蒡射干元參而愈一兒痘後真隂不足二火上行咽喉腫痛有以寒涼治者愈而復腫原其火為寒鬱先以附子理中湯驅其寒次宜壯水之主六味地黃丸加知母麥冬元參治其本治外吹葛槿散而愈一兒痘後脾胃不足隂火上炎咽喉腫痛以四君子加甘梗知蘗川連牛蒡而愈一兒痘後咽喉成疔以柴葛地蜈蚣等分煎成加犀角磨汁和服而愈萬密齋治馬氏子五嵗痘不起發曰此順痘也毒甚者則頭靣腫毒微者則頭不腫非不起發也又呼咽痛曰此痘家常病喜喉舌無瘡頸項間痘稀不足怪也以甘桔湯加牛蒡子煎細細咽之咽痛即止痘瘖萬密齋媳李氏年十八痘成膿時經水忽行下血塊且多未踰日猝失音問之但搖頭埀淚凡痘帶黑歸腎宜有猝失音之症今已成膿飽滿紅潤何以有此逆症思之良久乃得之經云婦人重身九月而瘖者少隂之脈不榮於舌也手少隂者心也心主血諸瘡皆屬於心瘡毒之火內起於心迫血下行故經血來也舌者心之苖血去則心虛不能上榮於舌故舌萎縮而猝失音也乃以生血散去五味子加當歸生地服之頓愈後以十全大補湯調理而起蕭氏子三嵗出痘將靨時忽失音啼哭有聲但言語重濁不清亮曰此肺熱也以甘桔清金散服之而安痘發核徐仲光治一兒痘十朝外左上齦潰爛外頰紅腫外治用抑陽散同蔥汁酒漿搗敷每日一換不用紙封內服紫花地丁花粉生地丹皮元參山慈菰貝母翹防蒡芎桔連芩歸芍先以銀花一兩煎汁煎之頰腫口疳漸平月餘忽發夜熱左腮下生一核大如李色白按之而疼外治硼砂一錢五分膽􅈨五分麝半分燒酒薄薄調勻新筆醮塗內服芩羌翹蒡甘芍元參前胡貝母膽草山梔亦以夏枯草一兩煎汁煎之連進四五劑而愈痘腹痛徐仲光治一痘未盡出而腹痛噯腐吞酸大便酸臭乃飲食停滯也保和丸二服而愈一痘起脹時不易行漿肢冷腹痛乃血熱症而過冷劑理中湯加肉桂木香炮薑一劑而愈一痘後傷食腹痛本中氣不足宜補瀉間施香砂保脾丸又補中益氣湯調理而愈一痘後能食易化腹痛此胃熱易飢脾弱不能消磨鬱積而痛也補中益氣湯加芍藥木香黃連治之而愈一痘漿足不易靨腹脹發熱靣赤午後益甚按之腹不痛乃脾虛血少也歸芍六君子湯加陳皮棗薑數劑而愈費建中治錢銓部女平時內熱柴瘦仲夏痘而熾熱腹痛異常不能轉側口極穢紫滯稠密但不細碎幸初起毒雖惡未有定位以大黃四錢石膏七錢生地六錢黃連一錢佐以山查荆芥葛根赤芍桃仁地丁紅花地龍臨服和豬尾膏盞許服至六日色漸肥紅放白腹痛少緩餘未減仍前方至九日漿甚充而腹痛熾熱尤甚眼封而角流血譫語不寐不食前方加犀角倍大生地石膏減豬尾血臨服以化毒丹調入牛黃一分硃末二分十二日頭靣發臭方日進粥三次皆碗許而腹痛與熱依然至十八日始大轉自始至終一方收效如此治驗多矣聊舉此以概其餘痘腰痛徐仲光治一庠友年十八初熱腰痛點發在頞角紅綻光澤心經順症非腎逆候亦宜滋腎六味地黃丸料加杞子杜仲與升發之藥間服痛止痘出至六朝煩渴譫妄唇燥舌黑睡卧不寧此乃腎水不足以制火也保元湯加歸芍冬杞棗仁龍眼肉間服八味地黃丸加麥枸杞漸愈有一症同但補陽而不滋隂竟枯涸疤粘不脫而死一兒初熱腰痛如折此折腰痘也強以荆防敗毒散發出點如蚤斑口鼻出血而死一兒初熱腰痛連背脊不能轉側點見左耳側及腰左一點如筯頭大平而紫又舌中心一點疏而黑此腎毒逆候也急以四牙散發出紫黑點五日死一兒孟夏發熱腰痛甚見點稠密紫黑幸有神而胃氣強元氣實雖逆而尚有生理四朝以四牙散一服又化毒散送下地黃丸二服次日痘起但色未轉以黃連解毒湯加柴蒡歸芍地黃而愈一女年十四痘正漿足忽腰痛不能轉側此經血去多之故六味地黃丸加歸芍續斷杜仲治之而愈一男子年十八痘後四十日外忽腰痛極兩手撒撇目開無光汗出遺尿喉聲如鋸六脈浮大此恣欲房勞而隂陽離決也以艾灸氣海六十二壯四肢活動又以獨聖湯頻服及八味地黃丸而愈一男子年二十痘後腰痛左尺脈微弱房勞所致也以八味地黃丸補中益氣湯相間服而愈一痘不起而腰痛繆仲淳用人參蘆三兩煎服一吐而痘起痛止毒在下吐以升之吐有發散之義也廣筆記一好痘綻朗而色淡紅兩腿痛甚腿亦屬腎此隂虛而毒乘之也活命飲二劑痛稍止十全大補湯六味地黃丸間服而愈此症不早治及四肢厥冷則變黑變紫而死與腰痛之逆相不可輕視之也一兒痘後足脛痛甚不紅腫氣血虛不能榮養筋骨也歸芍四君子湯加牛膝獨活苡仁桂枝連進數服而愈一兒年十四痘後腰脊痛不能俯仰午後潮熱此骨髓枯少水不勝火腎氣熱也灸崑崙穴中脈穴各三壯又以六味地黃丸加獨活及補中益氣湯間服而愈萬密齋治一富家子年十六患痘發熱腰疼問曽婚否曰未也連進人參敗毒散二劑痛止痘出而安若曽有房室者不可治也或以大劑生歸與之必有拿手琇按李季虬曰顧叔夏次郎出痘而先腰痛豫斷以不治果殤施季泉曰凡成婚或破陽後出痘而腰痛者可療童子而腰痛是先天之水不足也不治廣筆記費建中治章繼美年近三旬季冬忽腰如杖昏憒如迷問之不答身體振振肉瞤筯惕痘之象也但腰如被杖其症必逆用大黃山查各六錢青皮羌活桃仁各二錢佐以荆芥乾葛元參乘初起預攻庶望轉機於萬一若見痘腎已受傷無及矣自申至卯連服二頭煎次早發出如芥如砂色焦紫上下無容針之隙形色既逆神情又惡辭勿治因苦懇乃用大黃八錢石膏一兩黃連二錢生地兩半佐以荆芥羌活葛根牛蒡紅花桃仁蟬蛻等加白頸地龍每劑十條又以豬尾膏半盞和入連進二劑次日如芥如砂并焦黑色即退顆粒分明紅活但密而神昏熱熾前方服之九朝雖圓綻如硃漿黃如臘而昏熱如故大便日六七次而不暢水米不沾議者謂寒涼大過曰如果蕩滌傷胃則氣血乏矣漿何由得至十日正靣有回意仍不思食乃用大黃石膏各一兩生地兩半黃連山查四錢佐以牛蒡荆芥甘草十二日胃忽開神爽熱和十五日諸症悉愈痂如松皮後又口疳齒牙幾落又服牛黃硃末并黃連解毒湯十餘劑漸愈月外又發血風瘡身無完膚此腎傳脾故為輕症將百日始霍然是症當危疑之際旁議紛紛幸病家有識故得收效云痘手足徐仲光治一兒痘後溏泄腿腫睡卧不寧足三隂虛也四君子湯加陳皮歸芍枸杞澤瀉石斛川牛膝繼以八味丸而愈一兒痘後勞役痢雖愈而脛膝結核成鶴膝風此足三隂虛邪襲之也驅風散間八味丸苡仁牛膝兔絲當歸一兒痘先從腳底出起逆上至頭靣回至心窩內攻而死此症早治俟其頭靣出齊重用升提保元湯加川芎及先護心以黃連解毒湯一劑使其起灌收痂自上而下可保無事續名醫類案卷四十
