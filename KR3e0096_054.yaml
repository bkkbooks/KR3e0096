body:
  text: 續名醫類案卷五十四錢塘魏之琇撰囊癰薛立齋治一男子囊癰未作膿而腫痛以加味龍膽㵼肝湯二劑少愈更以四物湯加木通知母黃柏而愈一男子焮腫痛甚小便澀發熱脈數以龍膽㵼肝湯倍用車前子木通茯苓四劑勢去其半仍以前湯止加黃柏金銀花四劑又減二三便利如常惟一處不消此欲成膿也再用前湯加金花白芷角刺六劑微腫痛脈滑數乃膿已成令針之腫痛悉退投滋隂托裏藥乃紫蘇末敷之愈一膏粱之客隂囊腫脹小便不利此中焦積熱乘虛下注先用龍膽㵼肝湯加黃柏牛膝四劑漸愈後用補隂八珍湯加柴胡山梔而愈後不守禁忌前症復作仍用補隂八珍湯補中益氣湯六味丸而痊又因勞倦發熱自用四物知柏之類虛症悉具瘡口大開此五臟氣血俱虛也朝用補中益氣夕用六君加當歸各五十餘劑瘡口始斂又用六味丸調理而愈知州黃汝道先晡熱發熱肢體倦怠入房則腿足痠軟足心熱至腿膝六脈洪數兩尺為甚此足三隂虛欲滋補化源彼反服苦寒降火之劑後隂囊腫脹用治疝藥腫脹益甚形氣愈虛服溫補之劑腫痛上攻小便不利兩尺脈洪按之虛甚曰此囊癰也因氣血虛而不能潰先用補中益氣湯加山藥山茰車前柴胡山梔一劑腫脹頓消隨用六味丸料加車前牛膝柴胡山梔一劑小便漸通乃用活命飲與前二藥消息間用至二十餘劑囊裂出穢膿甚多乃用托裏消毒散六劑膿穠穢清又用托裏散數劑膿水漸少更用補隂托裏散及十全大補五十餘劑而痊府庠李達卿素腎虛發熱久服知柏之類形體漸瘦遺精白濁晡熱唾痰此腎水虧損虛火內熾用補中益氣之類加五味麥冬前症將愈又别用清熱涼血之劑飲食少思唾痰不止此脾虛復損不能攝涎歸源仍用前湯加茯苓半夏而愈後入房頭暈吐痰腰骨作痛大小便道牽痛此精已耗而復竭所致危殆之症也遂朝用前湯加麥冬五味夕用六味丸料加五味萆薢五十餘帖諸症頓退後又入房隂囊隂莖作痛别用淡滲之劑隂囊內潰乃用補隂托裏之劑出膿甚多喜腫消痛止竟不善調養致大便不通小便如淋痰涎上涌此腎虛之症復作矣誠為可慮有保其可生者用礞石滚痰丸牛黃清心丸之類吐痰愈加曰非惟無一保其生而反促其危矣辭不治果歿一男子患此腫痛發熱以上柴胡湯加黃連青皮四劑少愈更以加減龍膽瀉肝湯而愈一男子膿熟作脹致小便不利令急針之以小柴胡湯加黃柏白芷銀花四劑少愈更以托裏消毒散數劑而痊一男子囊腫狀如水晶時痛時癢出水小復按之作水聲小便頻數脈遲緩此醉後飲水入房汗出遇風寒濕毒乘聚于囊為患名水疝也先以導水丸二服腹水已去小便如常再飲胃苓散倍苓术更用氣針引去聚水而痊一男子患久而不斂以十全大補湯加五味子麥冬灸以豆豉餅月餘而平一弱人腫痛未成膿小便赤澀以灸甘草青皮木通黃柏當歸麥冬四劑少愈以青蓮子飲而消一男子病勢已盛脈洪大可畏用前湯二劑腫少退以仙方活命飲二劑痛少止脈之滑數乃膿已成須針之否則囊皆潰不信遂更他醫果木潰睪丸挂懸復求治診之脈將靜以八珍湯加黃芪知柏山梔更敷紫蘇末數日而痊此症勢雖可畏多得保全患者勿懼一弱人膿熟脹痛大小便祕結針之膿出三碗許即鼾睡覺而神思少健但針雖敷解毒藥亦潰盡矣故用托裏藥三十餘劑始痊大抵此症屬隂道虧濕熱不利所致故滋隂除濕為要常治腫痛小便祕澀者用除濕為主滋隂佐之腫痛退便利和者除濕滋隂相兼治之欲其成膿用托裏為主滋隂佐之膿成即針之仍用托裏滋隂濕毒已盡専用托裏如膿清或多或斂遲者用大補之劑及豆豉餅或附子餅灸之如盧武選封君年逾五十患此瘡口年餘不斂診之微有濕熱以龍膽瀉肝湯治之濕熱悉退乃以托裏藥及豆豉餅灸之而愈次年復患濕熱頗盛仍用前湯四劑而退又以滋隂藥而消若潰後虛而不補少壯者成漏老弱者不治膿清作渴脈大者亦不治朱丹溪曰癰疽入囊者豫嘗治數人悉以濕熱入肝經施治用補隂佐之雖膿潰皮脫睪丸懸挂皆不死心法外科薛立齋治胡同知年逾五十隂囊腫痛得熱愈甚服蟠蔥散等藥不應肝脈數此囊癰也乃肝經濕熱所致膿已成急針之以龍膽瀉肝湯脈症悉退更以托裏滋藥外搽杉木灰紫蘇末月餘而愈此症雖潰盡而無害患者審之柏道官年六十餘隂囊已潰痛不可忍腎丸露出與龍膽瀉肝湯服之及敷前末不應意此濕氣熾甚先以槐花酒一碗仍以前藥少愈更以托裏加滋隂藥月餘而平設以前不應加之峻利未有不損中氣以致敗者也聘士陳時用沈汝和患此悉用前藥而愈竇材治一人忽遍身拘急來日隂囊連莖大腫如斗六脈沉緊此隂疽也幸未服解毒涼藥若服之則莖與睪丸必皆爛去而死急令服救生湯五錢又一服全安懸癰薛立齋治一弱人榖道前結核如大豆許勞則腫痛先以十全大補湯去桂枝車前麥冬酒炒黃柏知母少愈更服製甘草漸愈即國老膏仍以物車前之類而消一男子患此焮腫發熱以龍膽瀉肝湯二劑及製甘草四劑而潰再用滋隂之劑而愈若膿未成以蔥炒熟敷上冷則易之隔蒜灸之亦可數日不消或不潰或潰而不斂以十全大補湯加柴胡梢為主間服製甘草並效若不保守必成漏矣一男子患懸癰服坎離丸及四物知柏之類不應脈浮洪按之微細以為足三隂之虛用托裏散及補隂八珍湯愈又用六味丸補中益氣湯調補化源半年而痊大凡瘡瘍等症若腎經火氣亢盛致隂水不能生化而患隂虛發熱者宜用坎離丸取其苦寒能化水中之火令火氣衰而水自生若陽氣衰弱致隂水不能生化而患隂虛發熱者宜用六味丸取其酸溫能生火中之水使陽氣旺而隂自生况生此症屬腎經精氣虧損者十有八九屬腎經陽氣亢盛者十無一二然江南之人患此者多屬脾經隂血虧損元氣下陷須用補中益氣湯升補陽氣使陽生而隂長若嗜欲過多虧損真隂者宜用六味丸補腎經元氣以生精血仍用補中益氣湯以培脾肺之生氣而滋腎水經云隂虛者脾虛也但多認為腎經火症用黃柏知母之類復傷脾肺絶其化源反致不起惜哉通府張敬之患懸癰久不愈日晡熱甚作煩渴而喘或用四物湯知柏之類病益甚肢體倦少食大便不實小便頻數問何故曰此肺虛之症前藥復傷而然遂用補中益氣加茯苓半夏數劑飲食漸進症漸減更加麥冬五味調理乃痊經曰脾屬太隂為隂土而主生血故東垣云脾虛元氣下陷發熱煩渴肢體倦怠等症用補中益氣湯以升補氣而生隂血若誤認為腎虛火盛而用四物知柏之類反傷脾胃生氣是虛其虛矣况知柏乃瀉陽損隂之劑若非膀胱陽火盛而不能生隂水以致發熱者不可用也魏玉橫治江雲溪兄初春患痔即令服一氣湯加減不信致卧月餘後遂成管冬月復患懸癰初時如大豆半月來大如雞卵按之甚痛行動有妨幸未服藥脈之惟左關尺略大而微此膿尚未成也仍與一氣湯加減大生地麥冬北沙參甘杞子生米仁蔞仁丹皮蒂丁等令服八劑二劑知四劑消其半八劑完而全愈薛立齋治尚寶鮑希傳足發熱服四物知母黃柏之類年餘患懸癰唾痰作渴飲湯其熱至膝更加芩連二陳熱痰益甚問故曰此足三隂虧損水泛為痰寒涼之劑傷胃而甚耳遂先用補中益氣夕用六味丸間佐以當歸補血湯半載乃愈上舍劉克新潰後作痛發熱口乾小便赤色自用清熱消毒之藥不應左尺洪數此陽氣盛而隂氣虛也先用四物湯加知母等諸劑瀉其陽氣使隂自生數劑諸症漸愈後用益氣湯地黃丸補脾肺滋腎水而愈一儒者小便赤澀勞則足軟腫痛發熱口乾舌燥食少體倦日晡益盛此氣血虛而未能潰也遂用八珍加麥冬山藥倍用製甘草數劑諸症悉退但患處腫痛此膿內焮也又五劑膿自涌出又五十餘劑而瘡口將完又因勞役且停藥寒熱作渴膿多腫痛用補中益氣湯加炒梔二劑少愈又以八珍湯加麥冬五味百餘劑腫痛悉去喜其慎起居節飲食常服補劑而安但勞則膿出一二滴後惑于他言內用降火外用追蝕必其收斂致患處大潰幾至不起仍補而愈一男子腫痛小便赤澀以加減龍膽瀉肝湯加製甘草二劑少愈以參芪歸术知柏製甘草四劑而潰更以四物湯加知柏參芪製甘而愈一男子膿清不斂內有一核以十全大補湯加青皮柴胡製甘草更以豆豉餅灸之核消而斂一男子久而不斂脈大而無力以十全大補湯加五味麥冬灸以豆豉餅月餘而愈一老人年餘不斂診其脈尚有濕熱以龍膽瀉肝湯二劑濕退乃以托裏藥及豆豉餅灸之而愈一男子腫痛發熱以小柴胡湯加黃連青皮四劑少愈更以加減龍膽㵼肝湯而消一男子膿不潰脹痛小便不利急針之尿膿皆利更以小柴胡湯加黃柏白芷金銀花四劑痛止以托裏消毒四劑而愈常見患者多不肯用針待其自破殊不知緊要之地若一有膿宜灸針之使毒外發不致內潰故前人云凡瘡若不針烙毒結無從而解膿瘀無從而泄又云宜開户以逐之今之患者反謂地部緊要而不用針何其悖哉一男子膿熟不潰脈數無力此氣血俱虛也欲治以滋隂益血之劑更針之使膿外泄彼不從仍用降火敗毒藥致元氣愈虛瘡勢愈甚後潰不斂竟至不救夫懸癰之症原係肝腎二經隂虛雖一于補尤多不治况膿成而又尅伐不死何俟常治初起腫痛或小便赤澀先以製甘草一二劑及隔蒜灸更飲龍膽瀉肝湯若發熱腫痛者以小柴胡湯加車前黃柏芎歸膿已成即針之已潰者用八珍湯加製甘草柴胡梢酒炒知柏小便澀而脈有力者仍用龍膽瀉肝湯加製甘草小便澀而無力者用清心蓮子飲加製甘草膿清不斂者用大補之劑間以豆餅灸之久而不斂者用附子餅灸之並效一男子患此焮痛發寒熱以小柴胡湯加製甘草二劑少退又製甘草四劑而消大抵此症屬隂虛故不足多此患寒涼藥不可過用恐傷胃氣惟製甘草一藥不損氣血不動臟腑其功甚捷最宜用之不可忽也馬銘鞠治談公武患跨馬癰外勢不腫毒內攻膿多瘡口甚小突出如指大一塊觸之痛不可忍多飲寒劑外敷涼藥毒內攻胃氣俱損令盡去圍藥洗淨瘡口但用一膏藥以護其風用大劑黃芪山藥生地白芷牛膝米仁銀花雜以健脾藥十餘劑膿盡再數劑肉長突出者平矣後服六味丸斤許精神始復廣筆記薛立齋治黃吏部穀道前患毒焮痛寒熱此肝經濕熱所致名曰懸癰屬隂虛症先以製甘草二服頓退再以四物加車前子青皮甘草節酒製知柏數服而消一男子嵗逾五十患懸癰膿清肝腎脈弱此不慎酒色濕熱壅滯也然膿清脈弱老年值此何以收斂况榖道前為任脈發源之地肝經宗筋之所辭不治後果死嘗治此癰惟澗水製甘草有效已破者兼十全大補湯為要法柴嶼青以省覲舟行舟人患騎馬癰哀號痛楚憐而治之先用大歸湯十餘劑外貼回生膏日令其以藥水勤洗繼惟十全大補湯因貧人苦無力購參㩦有扁黨參給以半斤始備藥又用玉蟾生肌散人參末敷患處調理月餘而愈痃癖一名便癰一名便毒一名㾦子一名血疝又俗名一石米瘡薛立齋治一婦人拗中赤腫脹痛此膿內作用托裏消毒散加柴胡數劑潰而膿清寒熱乃氣血復虛用托裏散而寒熱止用十全大補百餘劑而痊一婦人腹拗腫痛小水不利時或胸乳作痛脅腹作脹此肝火氣滯四物加柴胡青皮元胡索木香而愈一婦人拗中作痛小腹痞悶小便不利內熱體倦飲食少思此肝火內動脾胃受傷也用加味歸脾胃湯柴胡青肝散而安一婦人拗中腫脹小腹作痛服下血之劑其痛益甚更吐瀉少食此肝脾復傷用六君子湯加升麻柴胡而愈一婦人兩拗腫痛腹內一塊不時上攻月經不調一便不利此肝脾氣滯而血傷以四君加芎歸柴胡山梔而愈後因鬱怒前症復作兼胸滿腹脹盜汗此肝木甚而傷脾土也用加味歸脾湯下蘆薈丸而痊一婦人小腹內作痛或痞悶兩拗腫痛內熱寒熱胸膈不利飲食不甘形體日瘦此肝氣滯而氣傷也朝用補中益氣湯夕用蘆薈丸漸愈更用六味丸全愈一婦人兩拗腫痛小腹痞脹白帶時下寒熱往來小水淋瀝此肝氣滯而血病用龍膽瀉肝湯漸愈又用加味逍遙散六味地黃丸全愈一婦人患前症胸脅脹悶或小水不利或時腹痛此肝火氣病先用龍膽瀉肝湯以清肝熱又用加味逍遙散以生肝血六味地黃丸以滋腎水而愈一婦人患前症內熱作渴飲食不甘肢體倦怠隂中作梗小便赤澀此脾經鬱結肝經濕熱用加味歸脾湯而愈後因怒氣復作小腹脹痛用小柴胡加山梔芎歸痛止又用加味逍遙散而愈一婦人小腹痞悶溺澀內熱體倦懶食此肝火動而脾血傷也用八珍加柴胡山梔膽草而安一婦人隂中如梗兩拗腫痛熱寒不食小便頻數小腹重墜此肝脾鬱怒所致先以補中益氣加茯苓山梔車前子青皮以清肝火升脾氣更以加味歸脾湯調理脾鬱而愈一婦人小腹內如有所桔兩拗並入門俱腫小便淋澀經候不調內熱作渴飲食少思腹內如雞卵而漸大脈洪數而虛左關尤甚屬肝膽鬱結之症也用加味歸脾湯肝火退而脾土健間以逍遙散下蘆薈丸而愈一男子患便毒焮腫作痛大小便祕脈有力以玉蠋散二劑頓退更以龍膽瀉肝湯四劑而愈一男子已潰而痛不止小便祕嗇此肝火未解也以小柴胡加黃柏知母芎歸痛止便利更以托裏當歸湯而瘡斂若毒未解而痛不止者須用活命飲春元凌待之虛而服尅伐藥幾致危殆用托裏健脾藥而愈秀才王文逺因勞枯之患服小柴胡湯及表症散後用托裏藥膿成針之而旬日愈又胡判官膿清脈弱以大補藥而已愈因新婚復發自用連翹清毒散致瀉利不止竟致不救可見此症屬不足者多矣非補不可大抵便毒屬肝經初起堅硬肝主筋故也五七日後當赤軟膿成故也若尚堅硬乃元氣不能腐化往往人見堅硬只欲內消反服攻散藥多致虛虛之禍前此治者即其驗也魏玉橫治宋復華兄因勞頓患左拗腫硬漸如鵝卵或與發散轉甚已半月足冷過膝面赤手亦冷惡寒夜熱口苦食懈脈極弦數曰此肝虛火甚也與生地杞子沙參麥冬丹皮蔞仁歸身紅花間入川楝川連羚羊牛蒡數劑寒熱退又十劑其腫硬及諸症漸愈惟小塊如豆大未消彼以要務奔走勞碌復腫數日大如李其色赤而軟已成膿再與前藥即自潰而愈此症俗名一石米瘡言百日後可愈也即遇先輩如立齋其治法或未能如是雖然余非有過古人第知為肝腎病則不雜入他藥耳薛立齋治一婦人素清苦因鬱怒患前症或用敗毒寒涼之藥反晡熱內熱自汗盜汗月經不行口乾咽燥此鬱氣傷脾因藥復損先以當歸湯數劑後兼逍遙散五十餘劑而愈陳自明治一男子患便毒堅硬與神仙太乙丹一粒服之去後二次痛止不日而消方見蠱門薛立齋治一男子患此未作膿小便祕澀以八珍三劑少愈以小柴胡湯加澤瀉山梔木通二劑而消一男子腫痛發寒熱以荆防敗毒散二劑而止以雙解散二劑而消一男子膿未成大痛服消毒托裏內疏藥不應診之脈洪大毒尚在以仙方活命飲一劑痛止又一劑而消一男子腫痛日晡發熱以小柴胡湯加青皮花粉四劑痛止熱退以神效瓜蔞散四劑而消一男子腫而不潰以參芪歸术白芷皂角刺柴胡甘草節數劑而潰以八珍湯加柴胡數劑而愈一男子潰而腫不消且不斂診之脈浮而澀以豆豉餅灸之更以十全大補湯月餘而愈一男子潰而痛不止諸藥不應診之脈大按之則數乃毒未解也以仙方活命飲而止又二劑而斂一男子服尅伐之藥以求內消致㵼利少食以二神丸先止其瀉以十全大補倍加白术茯苓數劑而消大抵此症多患于勞役之人亦有內藴熱毒而生者須辨虛實及成膿否不可妄投藥餌常見治此症者概用大黃之類下之求內消或膿成令膿從大便出鮮有見其痊也人多欲內消者蓋恐收口之難也若補養血氣不旬日而收矣何難之有若膿既成豈有可消之理如再用尅伐之劑反為難治一男子不慎房勞患此腫痛以雙解散一服通之其痛即止更以補中益氣湯數劑而膿針之以八珍湯加五味子麥冬柴胡三十餘劑而愈大抵便癰者血疝也俗呼為便毒言于不便處腫毒故為便癰也乃足厥隂肝之經絡及衝任督脈亦屬肝之旁絡且氣血流通之道今壅而腫痛此則熱毒所致宜先疏導其滯更以托裡之劑此臨症制宜之法也一老婦腫痛膿成未作小便澀肝脈數以加減龍膽瀉肝湯加山梔黃柏四劑而消張德俊灸便毒親曾取效云屢以灸他人皆驗以細草或軟篦一莖隨所患左右手量中指自手掌量中指自手掌盡處橫紋量起通三節至指盡處為則不量指甲集斷卻將此草于手腕橫紋量起引草向臂當中草盡處即是穴麥粒大灸三壯腫散痛止即時安百乙方繆仲淳親試治便毒甚驗綿地榆四兩白酒三碗煎一碗空心服雖腫者亦愈加穿山甲同患處者二片土炒引經更妙廣筆記黃履素曰余家有女流患便癰兩拗腫痛不能起瘍醫用敗毒藥十餘帖以圍藥逼之出膿腫痛愈甚豫查薛氏外科樞要此症皆因鬱怒傷肝得之治用加味歸脾湯加逍遙散間服遂遵用之不三劑腫痛減半六劑而起孫文垣治吳翁年七十有三偶墜馬左脅作痛隨治而愈後半年忽左胯腫痛增寒作熱諸治罔效或作疝氣投荔核大小茴香川楝橘核之類痛不可忍至欲引繩自絶診之六脈浮而洪數左尺尤甚驗痛處紅腫如匏按之烙手此便毒也非因近色而得蓋胯屬厥隂肝經肝為血海乃昔時墜馬惡血消之未盡畜于經絡化而為膿年髙氣虛又為香燥尅伐故痛且劇今其色青中隱黑膿成久矣乃令外科針之出青黑膿五六碗此俗名石米瘡也乃用內托十宣散參芪三錢後加至五錢一日兩進兩月而愈腿癰薛立齋治一男子年逾二十稟弱左腿外側患毒三月方清膿水清稀肌肉不生以十全大補湯加牛膝二十餘劑漸愈更以豆豉餅灸之月餘而痊滁州于侍御髀甲患毒痛甚服消毒藥其勢未減即以槐花酒一服勢隨大去再以托裏消毒而愈丁蘭年二十餘股內患毒日久欲求內消診其脈滑數知膿已成曰氣血虛不潰遂刺之膿出作痛以八珍湯治之少可但膿水清稀更以十全大補湯加炮附子五分數劑漸愈仍服十全大補湯三十餘劑而痊一僧患股內腫一塊不痛不潰治以托藥二十餘劑膿成刺之作痛謂腫而不潰潰而反痛此氣血虛甚也宜峻補之彼云痛無補法曰正氣不足不可不補補之則氣化而痛邪自除遂以參芪歸地白术治之兩月而平一男子腿內患癰漫腫作痛四肢厥逆咽喉閉塞發寒熱諸治不效乃邪鬱筋絡而然也用五香連翹湯一劑諸症少退又服之大便行二次諸症悉退而愈一男子先腿痛後四肢皆痛逰走不定至夜益甚服除濕敗毒之劑不應其脈滑濕痰而澀濁血為患以二陳湯加蒼术羌活桃仁紅花牛膝草烏治之而愈凡濕痰濕熱及死血流注關節非辛溫之劑開發腠理流通墜道使氣行血和焉能得愈上舍李通甫腿患瘡作痛少食作嘔惡寒此痛傷胃氣用六君子湯加當歸四劑疼痛少止飲食加進又以十宣散加白术茯苓陳皮數劑膿成針而出之又以前散去防風白芷數劑而痊一老人腿患癰自潰忽發昏瞀脈細而微此氣血虛極也以大補之劑而蘇一男子患腿痛而不焮腫內亦便利調和用托裏榮衛湯數劑而消一男子內股患毒腫硬痛甚不作膿隔蒜灸五十餘壯勢退七八以仙方活命飲四劑而膿成用十宣散六劑膿潰而愈凡瘡或大痛或不痛麻木灸最良一男子腿內側患癰未作膿而腫痛以內托黃芪柴胡湯二劑少愈又二劑而消一男子腿外側患癰漫腫大痛以托裏黃芪酒煎湯二劑少可更以托裏散數劑潰之而愈一婦人腿癰久而不愈瘡口紫陷膿水清稀以為虛彼不信乃服攻毒之劑虛症蜂起復求治令灸以附子餅服十全大補湯百餘劑而愈凡瘡膿清及不斂者或陷下皆氣血虛極也最宜大補否則成敗症若更患他症尤難治療一男子腿癰內潰針之膿出四五碗惡寒畏食脈診如絲此陽氣微也以四君子湯加炮附子一錢服之寒少止又四劑而止以六君子湯加桂數劑飲食頓進乃以十全大補湯及附子餅兩月而愈一男子患腿癰兼筋攣痛脈弦緊用五積散加黃柏柴胡蒼术治之而痊一男子腿痛兼筋攣骨痛脈弦緊以大防風湯二劑攣少愈又二劑而腫消但內一處尚作痛脈不緊此寒邪已去乃所滯瘀濁之物欲作膿故痛不止用托裏藥數劑腫發起脈滑數乃膿已成矣針之用十全大補湯月餘而安一男子右腿赤腫焮痛脈沉數用當歸拈痛湯四肢反痛乃濕毒壅遏又况下部藥難逹非藥不對症也遂砭患處去毒血仍用前藥一劑頓減又四劑而消丹溪診東陽李兄子年逾三十形瘦膚厚連得憂患又因作勞過于色忽足腿外側臁上紅腫其大如栗一醫問其大府堅實與承氣湯兩帖不效又一醫教以大黃硃砂生粉草麒麟竭又二三貼半月後召視之曰脈實大事去矣後果歿馬銘鞠治江都尹子九嵗患腿癰治彌月勢漸盛按之堅如石幸兒氣厚可內消用牛膝米仁地榆生地牛蒡銀花連翹甘草初劑加微藥利之即稍寬過兩劑加汗微汗其勢益寬至數劑取穿山甲末五錢半入煎半調藥送下兒善飲令一醉自此頓消半月地下行矣初一醫欲開刀遇馬中止凡外科宜以開刀為戒廣筆記薛立齋治一男子患腿癰膿已成針之出二碗許飲以托裏藥一劑大發熱更以聖愈湯二劑而止翌日惡寒不食脈細如絲以人參一兩熟附子三片薑棗煎再服而愈但少食不寐更與大補黃芪湯而平一男子腿腫發熱畏寒以補中益氣湯治之彼以為緩乃服芩連等藥熱愈甚復請治與人參養榮湯二十餘劑而潰更以參芪歸术灸草肉桂又月餘而斂夫火之為病當分虛實芩連苦寒能㵼心肺有餘之火若老弱或飲食勞倦而發者此為不足當以甘溫之劑治之未嘗有實熱而畏寒虛熱而喜寒者琇按二語却未然此其驗也臁瘡附爛腿薛立齋治一婦人患臁瘡因入朝步履勞復惡寒發熱倦怠懶食而瘡出血此元氣虛而不能攝血歸經也用補中益氣湯而愈陶九成曰辛酉夏余足瘍發于外臁初甚微其後浸淫涉秋徂冬不良于行凡敷膏濯之劑嘗試略盡痛癢雜作大妨應酬一日友人俞和父見過怪其蹣跚舉以告之和父笑曰吾能三日已此疾法當先以淡􅐽水滌瘡口浥乾次用局方駐車丸研極細加乳香少許乾糝之無不立效如其説用之數日良愈蓋駐車丸本治血痢滯下而此瘡亦由氣血凝滯所成也齊束野語張子和治小渠袁三因強人忽入家傷其兩胻外臁作瘡數年不已膿水常涓涓然但飲冷則瘡間冷水浸淫而出涎為濕瘡張曰爾中焦當有緑水二三升涎數掬袁曰何也曰當被盜時感驚氣入腹驚則膽傷足少陽經也兼兩外臁皆少陽之部此膽之甲木受邪甲木色青當有緑水少陽在中焦如漚既伏驚涎在中焦飲冷水咽為驚涎所阻水隨經而旁入瘡中故飲水則瘡中水出乃上涌寒痰汗如流水次下緑水果二三升一夕而痂乾矣薛立齋治一室女年十七腿外臁忽腫起一紅點作癢搔破日日鮮血如注及飛小蟲甚多審其由每先寒熱兩耳下或結核蓋外臁耳下俱屬膽經膽為肝之腑肝主風熱生蟲血得風而妄行肝火旺而血出其肝膽隂陽俱虛矣凡病虛則補其母用六味丸滋腎水以生肝木四物柴胡山梔鈎藤生肝血以抑風熱而瘥陳湖陸懋誠素因隂虛過飲入房發熱腿痛似臁瘡用發表之劑兩腿腫黯熱氣如霧欲發痙脈皆洪數兩尺尤大此屬足三隂虛酒濕所乘元氣損而邪益甚耳用十全大補加山藥山茰附子一劑脈症頓退去附子又二劑全愈李絳記武元衡相國在西川且苦脛瘡焮痛不可堪百醫無效及到京城呼供奉石礞等數人療治無益有廳吏上此方用之更瘥其方云療多年惡瘡百方不差或痛焮走不已者並爛搗馬齒莧傅上不過三兩度愈李絳兵部手集章宇泰傳治臁瘡方六郎乳母試之神效松香一兩輕粉三錢乳香五錢細茶五錢四味共打成膏先將蔥頭花椒煎湯熏洗淨用布攤膏厚貼患處以絹縛定黃水流盡爛肉生肌廣筆記陳儀部年逾五十兩臁生瘡日久不愈飲食失節或勞苦或服滲利消毒之劑愈甚脾脈大而無力此脾虛而無濕熱也以補中益氣湯數劑少愈更以六君子湯加蒼术升麻神麴治之而愈嘗治下部生瘡焮痛或發寒熱或腳氣腫痛以人參敗毒散加檳榔紫蘇蒼术黃柏並效久不愈者以四生散治之愈後以補腎丸補之庶不再發矣槎菴小乘云臁瘡以淡􅐽水滌瘡口浥乾次用局方駐車丸研極細加乳香少許乾糝之無不立效王洪緒治馬悠也右足背連小腿轉彎處初因湯毒而成爛腿三十餘年其腫如斗孔可容拳有時出血以布團填塞否則空痛時年七十有四令以老蟾破腹身刺數孔以肚雜填患孔蟾身覆之早晚煎蔥椒湯溫洗一次以蟾易貼用醒消丸早晚二服三日後取地丁大力鮮草搗爛填孔外貼烏金膏日服醒消丸其四圍硬塊出水處以嫩膏加五美散敷其發癢者以白花膏貼內有硬塊如石者以生商陸搗爛塗孔內出血時先以參三七末糝之然後填藥如此二十餘日腫退癢止塊平黑肉漸紅活孔亦收淺以止草填日以五寶散糝仍貼烏金膏因老人精神不衰飲食不減始終不用補而收功蔣仲芳治胡明甫年五十餘患臁瘡三載沿皮瘙癢微腫色紫黑用膏藥蓋之則流水鞋襪盡濕去膏藥即又燥烈癢痛難忍此濕熱下流也人但知燥濕清熱解毒而不知濕熱之原從脾家下陷耳遂用補中益氣湯升舉其氣更加黃柏清熱蒼术燥濕茯苓澤瀉利水蓋治濕不利小便非其治也外用陳石灰調側柏汁以澡濕散瘀清熱稍加火酒為從治敷之明日瘡乾數日而愈外治法抄脫疽謂疔生于足指或足消而自脫故名亦有發于手指者名蛀節疔重者腐去去節輕者筋攣一男子足指患脫疽焮痛色赤發熱隔蒜灸之更以人參敗毒散去桔梗加金銀花白芷大黃痛止又十宣散去桔梗官桂加花粉銀花數劑而痊一男子足指患之色紫不痛隔蒜灸五十餘壯尚不知痛又明灸百壯始痛更投仙方活命飲四劑乃以托裏藥潰脫而愈心法中韓判官症同芷同乃以敗毒散加銀花白而愈一男子患足指大痛色赤而腫令隔蒜灸至痛止以人參敗毒散去桔梗加金銀花白芷大黃而潰更以仙方活命飲而痊此症形勢雖小其惡甚大須隔蒜灸之不痛者宜明灸之庶得少殺其毒蓋因膏粱厚味酒麵灸煿積毒所致或不慎房勞腎水枯竭或服丹石補藥致有先渴而後患者有先患而後渴者皆腎水涸不能制火故也初發而色黑者不治赤者水未涸尚可若失解其毒以致肉死色黑者急斬去之緩則黑延上足必死此患不同腫潰惟隔蒜灸有效亦有色作痛而自潰者元氣未脫易治夫至隂之下血氣難到毒易腐藥力又不易逹况所用皆攻毒之藥未免先于腸胃又不能攻敵其毒不若隔蒜灸并割去最為良法故孫真人云在指則截在肉則割即此意也一男子腳背患此赤腫作痛令隔蒜灸三十餘壯痛止以仙方活命飲四劑而潰以托裏消毒藥而愈一男子足指患之色赤焮痛作渴隔蒜灸數壯服仙方活命飲三劑而潰更服托裏藥及加減八味丸潰脫而愈一男子足指患之色黑不痛令明灸三十餘壯而痛喜飲食如常謂急割去之速服補劑彼不信延上遂致不救一男子腳背患之色黯而不腫痛煩燥大渴尺脈大而澀此精氣已絶不治後果然楊太僕年逾四十左足大指赤腫焮痛此脾經積毒下注而然乃脫疽也喜色赤而痛以人參敗毒散去人參桔梗加銀花白芷大黃二劑更以瓜蔞銀花甘草節四劑頓退再以十宣散去桔梗加銀花防已數劑而愈一膏粱人年逾五十患此色紫黑腳焮痛孫真人云脫疽之症急斬去之毒延腹必不治也黑不痛者亦不治喜其飲食如故動息自寧為瘡瘍善症也尚可治遂以連翹消毒散六劑更以銀花甘草節瓜蔞二十餘劑患指潰脫再以芎歸地連翹銀花白芷二十餘劑而愈一芻蕘左足指患一泡麻木色赤次日指黑五日足黑冷不知疼痛脈沉細此脾胃受毒所致以飛龍奪命丹一服翌日令割去足上死黑肉割後骨始痛可救遂以十全大補湯治之而愈蓋死肉乃毒氣盛而拒截營氣所致况至隂之下氣血難逹經云風淫未疾即此是也向若攻伐之則邪氣愈盛乘虛上侵必不救海山驕淫益無度強并民居田宅婦女竟占山東之半陸宣子者山東名醫也有富室妾足小指生瘡狀類細米瘡頭早白根如熟棗臟腑挈挈欲墜聞平湖名延之視曰此粟米瘡也與人面瘡等七日毒上升遍體腐爛成黑水死矣君欲生之當急斷其指斷之愈海山亦生是瘡屬宣子視宣子仍前言海山大怒欲殺之楚人丁維章以外科有名出入禁內海山邀之至告以宣子語且曰公視我瘡無恙吾必殺之維章熟視曰殺我可也何尤宣子今已過三日毒上升矣公欲活耶斷膝尚可海山瞋目曰其然三問應聲如響海山喟然曰我命在公矣顧左右取截刀伸足曰斫左右戰栗海怒罵使斫遂斷一腿維章手提海山髮倚柱坐海山面黃氣絶維章曰可速召前醫者宣子至視其地一腿尚自起跳躍黑血淋漓命取人參一斤濃煎灌其口少頃海山蘇顧其足曰嗟乎刖足刑已重矣何辜而刖至膝幸公活我我自今後庶幾可無後患閲四十九日而右膝毒發復生人面瘡醫曰不可再治矣海山不數日死凡所奪民家産皆散去其兄乃乞食如初多骨疽薛立齋治舉人于廷器腿患流注年餘出腐骨少許午前畏寒午後發熱口乾唾痰小便頻數以為足三隂虧損朝用補中益氣湯夕用六味地黃丸料加歸芪五味各三十餘劑外用豆豉餅諸症漸愈又以十全大補之類喜其慎疾而愈一儒者患附骨疽失于調補瘡口不斂日出清膿少許已而常出三腐骨其脈但數而無邪此氣血虛瘡結膿管而不能愈絍以烏金膏日服十全大補而愈上舍王廷璋患前症三年未愈肢體消瘦飲食難化手足並冷大便不通手足隂冷此陽氣虛寒用補中益氣湯八味丸及灸其患處而愈一男子臂患流注出腐骨三塊尚不斂發熱作渴脈浮大而澀乃氣血俱損須多服生氣血之劑庶可保全彼惑于火尚未盡仍用涼藥內服外敷幾危始求治其形甚瘁其脈愈虛先以六君子湯加芎歸日餘飲食漸進以八珍湯加肉桂三十餘劑瘡色乃赤更以十全大補湯外以附子餅灸之僅年而瘥醫林集要云骨疽乃流注之敗症也如用涼藥則內傷其脾外氷其血脾主肌肉脾氣受傷飲食必減肌肉不生血為脈絡血受氷則氣血不旺而愈滯宜用理脾健脾則肉自生而氣自運行矣又有白虎飛留連周期或展轉數嵗冷毒朽骨出盡自愈若附骨腐者可痊正骨腐則為終身廢疾矣有毒自手足或頭面腫起或兼疼痛上至頸項骨節去處如瘍癧貫珠此風濕流氣之症也宜以加減小續命湯及獨活寄生湯治之有兩膝腫痛起或至遍身骨節疼痛者此風濕痺又名歷節風宜用附子八物湯治之又有結核在項腋或兩乳傍或兩胯軟肉處名曰􅗢癧癰屬冷症也又有小兒宿痰失道致結核于頸項臂膊胸背之處亦冷症也俱用熱藥敷貼已上諸症皆緣于腎腎主骨堅虛則骨冷而為患也所謂骨疽皆起于腎亦以其根于此也故用大附子以補腎氣腎實則骨有生氣而疽不附骨矣附骨疽王肯堂治一人患附骨疽膿熟不能泄潰而入腹精神昏憒粥藥不入醫無所措診之脈細如蛛絲氣息奄奄曰無傷也用針刺其腹膿大泄然皆清稀若蟹吐沫在法為透膜不治用參芪附子加厥隂行經之藥大劑飲之又服八味丸食大進升餘肉數臠旬日而平所可治者潰瘍之脈洪實者死微細者生病脈相合故可治也刺腹者膿不泄必內攻按之知其瘡深即刺無害所以不透膜八味補腎腎氣旺而上升胃口開而納食凡泄膿既多刀圭之藥其何能濟遷延遲久且有他患故進開胃之藥多食肉以補之肌乃速生此治潰瘍之大法一男子腿根環跳穴患痛徹骨外皮如故脈數而滯滑此附骨疽膿將成也用托裏藥六劑腫起作痛脈滑數其膿已成針之出碗許更加補劑月餘而瘳一男子患附骨疽腫硬發熱骨痛筋攣脈數而沉用當歸拈痛湯而愈張景嶽治一人年三十餘素多勞忽患環跳酸痛數月後大股漸腫曰此附骨疽也當速治與活命飲二帖未效而腫益甚因混投清火解毒遂致嘔惡發熱飲食不進勢甚危復求治與參芪內托散大加炮薑數劑而嘔止食進其腫軟熟知其膿成針之膿不多復與九味異功煎遂大潰且瓣瓣出膿潰者五六處腿肉盡去止存皮骨矣潰後復嘔發熱不食以十全大補湯九味異功散相間與之熱漸退食漸進然足筋短縮但可豎膝仰卧左右挨緊毫不能動動則痛極自分已成廢人凡用十全大補三十餘劑人參三斤乃肉生筋舒如故一人年近三旬素不節欲忽環跳穴酸痛月餘張曰此最可畏恐生癰毒不信或謂筋骨痛常事耳不過風熱使然與散風清火藥至半年後果微腫復求治曰速用托補以救根本尚不遲也又不信謀之瘍醫曰豈有腫瘍未潰遽可溫補邪復用清火消毒之劑及大潰而危再延視則脈症俱敗悔無及矣一膏粱子年三旬素耽酒色亦患前症令早服藥執拗不從及腫而膿成令速針之不肯偏信庸流敷以苦寒解毒之藥不知膿已成猶何毒之可解但有愈久愈深直待自潰元氣盡去不可收拾耳立齋治地官孟卿環跳穴患疽內服外敷皆敗毒寒劑因痛極刺之膿瘀大瀉瘡口開張其色紫黯右關脈浮大此胃氣復傷不能榮于患處也以豆豉餅六君子湯加藿香砂仁炮薑數劑由是胃氣醒而飲食進患處暖而肌肉漸生再以十全大補湯而愈大尹都承慶患附骨疽內痛如錐外色不變勢不可消喜其未用寒劑止因痛傷胃氣而不思飲食用六君子湯治之飲食少進更以十全大補二十餘劑而膿成針去仍以大補湯倍用蒼芪歸术加麥冬五味逺志貝母數服膿漸止而瘡亦愈一儒者左腿微腫肉色如故飲食少思此真氣虛而濕邪內襲也蓋諸氣皆秉于胃法當助胃壯氣遂用六君加藿香木香當歸數劑飲食漸進更以十全大補元氣復而愈一儒者兩腿腫痛肉色不變惡寒發熱飲食少思肢體倦怠脾氣不足濕痰下注也以補中益氣加半夏茯苓白芍二劑寒熱退而腫痛消又十餘劑脾胃壯而形體健一男子因負重飲食失節胸間作痛誤認為瘡毒服大黃等藥右腿股腫肉色如故頭痛惡寒喘渴發熱脈洪大而無力此勞傷元氣藥損胃氣而然耳補中益氣湯四劑又用十全大補湯數劑喜其年少而愈一婦人患附骨疽久而不斂致腿細短軟脈來遲緩以十全大補湯加牛膝杜仲及附子餅灸之兩月餘而愈凡膿潰之後脈澀遲緩者易愈以其有胃氣故也脈來細而沉時直者裏虛欲變症也若煩痛尚未痊也洪實粗散者難療以其正氣虛而邪氣實也一婦人環跳穴作痛肉色不變脈緊數此附骨疽也膿未成用內托黃芪酒煎湯加青皮龍膽草山梔數劑而消一婦人患附骨疽久不愈膿水不絶皮膚瘙癢四肢痿軟以為虛欲補之彼惑為風疾遂服祛風藥竟致不起陳無擇云人身有皮毛血脈筋膜肌肉骨髓以成其形內則有心肝脾肺腎以主之若隨情妄用喜怒勞佚致內藏精血虛耗使皮血筋骨肉痿弱無力以運動故致痿躃狀與柔風腳氣相類柔風腳氣皆外所因痿則內藏不足所致也山西曹主簿年逾四十夏間患附骨疽服托裏藥而愈至秋飲食少思痰氣壅盛口舌生瘡用八味丸治之而愈一老人腿患附骨疽腫硬大按方痛口乾脈弱腫聚不潰飲食少思謂腫下而堅者發于筋骨皮色不變者發于骨髓遂以參芪等藥托之三十餘劑膿雖熟不穿謂藥力難達必須針刺不聽至旬日方刺之涌出清膿五六碗許然衰老之人氣血不足養毒又久竟不治大抵瘡疽旬日不退宜托之有膿刺之有腐肉取之虛則補之此十全之功也王上舍患附骨疽畏針不開臂膝通潰脈數發渴煩躁時嗽飲食少思齊氏曰瘡瘍煩躁時嗽腹痛渴甚或瀉利無度此惡症也膿出之後若脈洪數難治微澀遲緩易治遂刺之膿出四五碗許即服大劑參术歸术翌日脈稍斂更以八珍湯加五味麥冬肉桂白斂三十餘劑脈緩膿稠三月而愈續名醫類案卷五十四
