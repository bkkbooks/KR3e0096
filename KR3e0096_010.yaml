body:
  text: 續名醫類案卷十錢塘魏之琇撰嘔杜壬治安業坊有閻家老婦人患嘔吐請石秀才醫曰胃冷而嘔下理中丸至百餘丸其病不愈石疑之召杜至曰藥病兩相投何必多疑石曰何故藥相投而病不愈杜曰藥力未及更進五十丸必愈果如其言石於是師法於杜醫學綱目王普侍郎病嘔飲食皆不得進召孫兆治數日亦不愈後復召杜杜曰治嘔愈嘔此胃風也遂用川烏一兩淨洗去皮臍不去尖以漿一碗煮乾每個作兩片復用漿水一碗煮盡更作四片細嚼一片以少溫水下少頃嘔遂止痛既少息杜遂問曰尋常好喫何物曰好喫甘甜之物杜曰是甘甜乃膏梁之物積久成熱因而生風非一朝一夕之故也王服其説同上毛公弼有一女嘗苦嘔吐求龎安常醫與之藥曰嘔吐疾易愈但此女子能不嫁則此病不作若有娠而嘔作不可為矣公弼既還家以其女嫁歸沙溪張氏年餘而孕果以嘔疾死曽達臣獨醒雜志臧中立毗陵人客鄞崇寧中徽宗后病甚中立應詔以布衣麻履見命之入診出問何症中立對曰脾脈極虛殆嘔㵼之疾作楚和藥以進且曰服此得睡為效至夜半果思粥食不一月獲安賜歸詔出官帑豫地築室南湖以居焉寧波府志許學士政和中治一宗人病傷寒得汗身涼數日急嘔吐藥食不下用丁香藿香滑石等藥下咽即吐許曰此正汗後餘熱留胃腕正宜竹茹湯用之即愈薛立齋治府庠沈姬文母患脾虛中滿痰嗽發熱又食濕麵冷茶吞酸嘔吐絶食誤服芩連青皮等藥益加寒熱口乾流涎不收聞食則嘔數日矣迎治曰脾主涎以脾虛不能約制也欲用人參安胃散惑於衆論以為胃經實火宿食治之病日增劇忽思冬瓜食如指甲一塊頓發嘔吐酸水不止仍服前藥愈劇復邀視之則神脫脈絶頻死矣惟目睛尚動曰寒淫於內治以辛熱然藥不能下矣急用鹽艾附子炒熱尉臍腹以散寒回陽又以口氣補接母口之氣又以附子作餅熱貼臍間時許神氣少蘇以參术附子為末仍以是藥加陳皮煎膏為丸如粟米大入五七粒於口隨津液咽下即不嘔二日後加至十粒諸病少退甘涎不止五日後漸服前劑一二匙胃氣少復乃思粥飲後投以參术等藥溫補脾胃五十餘劑而愈明醫雜婦人良方一人湯藥入口即吐出六脈洪大有力此因地道不通故氣厥上行而食物難入耳不更衣已十日餘服承氣等湯俱不納日祕結日久湧逆勢盛故也止沸莫若抽薪遂用蜜𨗳去燥糞數升嘔吐即止調以養血清火之劑而安周慎齋治一人飲食如常每遇子時作吐大便祕結其人必苦慮憂思脾氣鬱結幽門不通宜扶脾開竅為主遂以參苓白术以蒼术拌炒炙甘草各一錢煮附子烏藥三分水煎服愈一士鬱熱嘔吐用竹茹山梔各三錢陳皮茯苓各二錢甘草一錢煎成加薑汁五匙熱服而愈大還陸養愚治李廳因飯後勞攘下午飲酒數杯遂覺臍下小腹作痛升至胃腕即嘔嘔訖痛止少頃又從下痛上復嘔訖痛緩自後痛嘔益頻自疑中毒以淡鹽湯虀汁探吐之一無所出醫投藿香正氣散不效其脈浮按細數稍重即伏沈按甚堅曰此飲食過飽急遽所至與潤字丸百十顆令淡薑湯服之少頃連㵼數行而愈龔子才治梁太守女患頭暈嘔吐聞藥即嘔諸醫束手令以伏龍肝為末水丸塞兩鼻孔用保中湯以長流水入膠泥攪瀝煎積冷頓服而安萬病回春信陵府桂臺殿下夫人善怒怒即嘔吐胸膈不利煩躁不寧腹痛便祕食下即吐已八日心慌喘急危甚診之六脈虛微此血虛胃弱氣鬱痰火也與二陳湯加薑連酒芩炒梔當歸酒芍香附竹茹白术入薑汁竹瀝二服而安張景嶽治吳參軍因食蘑菰致大吐大㵼醫謂速宜解毒以黃連黑豆桔梗甘草枳實之屬連進而病益甚胸腹大脹氣喘水飲不入延張診投以人參白术甘草乾薑附子茯苓之類彼疑曰腹脹氣急口乾如此安敢服此耶閲日愈劇再求治與藥如前且疑且畏含淚吞之一劑而嘔少止二劑而脹少衰隨大加熟地以兼救其㵼亡之陰前後凡二十餘劑復元如故蓋蘑菰之為物必産於深坑枯井或沈寒極陰之處其得陰氣最盛故肥白且嫩也今中其陰寒之毒而復解以黃連之寒其解毒之何兹用薑附以解其寒人參熟地以解其毒傷元氣此疾之所以愈也金氏少婦素任性每多胸脅痛肝火及嘔吐等症隨調隨愈後於秋盡時前症復作而嘔吐更甚病及兩日甚至厥脫不省肝火衆謂湯飲不入無策可施一醫云唯用獨參湯庶幾萬一張診之其脈亂數且煩熱躁擾意非陽明之火何以急劇若此乃問其欲冷水否彼即點頭遂與以半鐘惟此不吐且猶有不足之狀乃復與一鐘稍覺安靜因以太清飲投之有謂此非傷寒又值秋盡能堪此乎不與辨及藥下咽即酣睡半日不復嘔矣後以滋陰輕清等劑調理而愈大都嘔吐多屬胃寒而復有火症若此者此病火症極多張偏於溫補故有此説經曰諸逆衝上皆屬於火即此是也多屬胃寒又是何説自後凡見嘔吐其有聲勢湧猛脈見洪數症多煩熱者皆以此法愈之以多屬胃寒及自後二字觀之張生平於此誤亦不少矣蓋此症良由肝火上逆故暴急如此而曰陽明之火其孟浪可知張路玉治曽餘弟婦患嘔逆不食者月餘服寬膈理氣二十餘劑幾致絶粒而痞脹異常診之脈得虛大而數按仲景脈法云大則為虛此胃中陽氣大虛而濁陰填塞於膈上也因取連理湯方用人參三錢服之四劑而痞止食進後與異攻散調理而康嵇紹有胸中寒疾每酒後苦唾服萎蕤得愈草似竹取根花葉陰乾昔華陀入山見仙人所服以告樊阿服之夀百嵗也本草陳良甫曰胃熱嘔吐者手足心熱政和中一宗人病傷寒得汗身涼數日忽嘔吐藥與飲食俱不下醫者皆進丁香藿香滑石等藥下咽即吐豫曰此症汗後餘熱留胃腕孫兆竹茹湯正相當爾亟治藥與之即時愈有婦人病吐逆大小便不通煩亂四肢冷漸無脈息凡一日半與大承氣湯兩劑至夜半漸得大便通脈漸生翌日乃安此關格之病極難治醫者當詳審也經曰關則吐逆格則小便不通如此亦有不得大便者衍義醫説續編張子和治柏亭王論夫本因喪子憂抑不思飲食醫者不察以為胃冷血寒之劑盡用病變嘔逆而瘦求治於張一劑湧泄而愈歸家忘其禁忌病復作大小便俱祕臍腹撮痛嘔吐不食十日大小便不通十三日復問張張曰令先食葵羮菠菱菜豬羊血以潤燥開結次與𨗳飲丸二百餘粒大下結糞又令恣意飲冰水數升繼搜風丸桂苓白术散以調之食後服𨗳飲丸三十餘粒不數日前後皆通痛止嘔定張臨别又留潤腸丸以防復結又留滌腸散大便祕則用之凡服大黃牽牛四十餘日方瘳論夫自嘆曰向使又服向日熱藥已非今日人矣一僧問張云腸者暢也不暢何以此一句儘多按子和之醫大抵此法行之耳丹溪云凡病人欲吐者切不可下之逆故也縱使二便復祕可行踈通亦中病而止然後養其氣血潤其腸胃庶乎標本之治乃羸瘠之人服大黃牽牛四十餘日方瘳豈理也哉違聖人之法以欺後世恐非子和之筆也孟子謂盡信書則不如無書學者詳之醫學續編原評薛立齋治一婦人少作嘔口吐涎痰面黃腹痛月經不調手足逆冷此內外俱寒之症遂以六君加附子木香治之而愈一男子食少胸滿手足逆冷飲食畏寒發熱吐痰時欲作嘔自用清氣化痰之劑胸腹愈脹呼吸不利吐痰嘔食小便淋瀝又用五苓散之類小便不利諸症益甚曰此脾土虛寒無火之症故食入不消而反出非氣膈所致遂用八味丸補中益氣湯加半夏茯苓薑桂旬日乃愈一婦人因勞役發熱倦怠唾痰欲嘔或以為火症用清熱化痰等藥反大便不實無氣以動此寒涼復傷中氣形病俱虛用參耆术草麥冬五味陳皮附子治之而痊後復勞經水數日不止衆以為附子之熱所致用四物芩連槐花之類涼而止之前症愈甚更加胸膈痞滿飲食日少仍用前方去門冬更加茯苓半夏炮薑數劑漸愈又用當歸芍藥湯而經止但四肢逆冷飲食難化不時大熱此命門真火衰脾土虛寒之假熱也用八味丸半載而痊又服六味丸三載而生子宋理宗嘔吐不止召楊吉老治之問用何方曰辛熱藥也帝曰服之不效吉老奏曰熱藥冷服藥成放井中良久澄冷進服一啜而吐止萬密齋幼科發揮立齋治一癧惡心少食服解毒藥愈嘔此胃氣虛也以六君子湯加生薑治之而安戴氏云元禮如惡心者無聲無物欲吐不吐欲嘔不嘔雖曰惡心非心經之病皆在胃口上宜用生薑蓋能開胃豁痰也施笠澤治鄒翁患嘔吐遍身疼不能轉側醫為療其嘔吐矣然眠食猶未安也診之曰風入於經其脈乃凝留結不散寒痰中停四末不掉三焦不行亟疏其風亟調其經氣和血平轉側自能先用蘇合丸以通其氣隨用𨗳痰湯加桂枝沈香白芍一劑即熟睡覺而展轉自如再用六君子加沈香數劑而安馬元儀治袁某患小腹厥氣上衝即吐得飲則吐愈甚諸治不效診之兩脈虛澀右尺獨見弦急曰人身中清氣本乎上而反陷下則為注為泄濁氣本乎下而反逆上則為嘔為吐今病正在下而不在上也下焦之濁氣上騰則胸中之陽氣不布故飲入於胃有上壅而不下達耳經云雲霧不清則上應白露不下非地道不通濁氣何由而降嘔吐何由而止以調胃承氣湯一劑下宿穢甚多繼培中氣而愈張司馬子婦患病胸中滿結作痛飲入則嘔湧出痰涎多成五色已數月或主攻尅或主補虛卒無一效至七月中病轉危迫診之兩關尺虛微少神體倦神煩胸中結痛按之愈甚此正氣內傷陰邪內結攻之則傷其正補之則滯其邪當以仲景臟結之法治之用黃連湯加桂甫一劑嘔吐頓除再劑胸中滿痛亦釋次用理中加桂湯數劑而安張景嶽曰沈姓者業醫年及四旬極勞碌因􅒃疝下墜欲提上升用鹽湯吐法遂吐不止湯水不受如此一日夜復大便下黑血一二碗脈微如毛欲絶此蓋吐傷胃氣脾虛之極兼以鹽湯走血脾不能攝從便而下令速用人參薑附等以回垂絶之陽忽一醫至曰諸逆衝上皆屬於火大便下血亦因火也尚堪參附乎宜速飲童便則嘔可愈而血亦止矣病者然之及童便下咽即嘔極不堪而斃琇按疝下墜本由肝木厥張乃復激之上騰致脾胃俱傷而下血不死何俟童便固非即參附亦未為是也馮楚瞻治蔣公子精神素弱吐血陰虧調理初愈忽又夢遺大吐不已六脈沈微曰夢遺俗名走陽陽更傷矣大吐不已又已陽矣急以附子理中湯去甘草投之到口即吐又以白通之類然拘不受沉困數日上不能入下不能出適有進西洋藥酒一方神治關格吐逆之症內皆辛熱純陽之藥能破格陽之陰又燒酒力猛辛烈直透丹田令照方修治飲之即不吐矣遂以參附峻補之藥陸續漸進調理而痊琇按馮氏生平多尚溫補如此症吐血陰虛之後夢遺而吐多由飛雷之火下迫上奔以辛熱治其標則可若守而不化則後患不可測也孫奉職治趙儀女忽吐逆大小便不通煩亂四肢漸冷無脈凡一日半大承氣湯一劑至夜半漸得大便通脈漸和翌日乃安此關格之病極為難治垂死而活者惟此一人盧復曰生平聞銅腥臭即惡心入口鮮不吐者雖參湯與茶久在銅銚中者亦然常思銅青固發吐藥唯我何獨畏之甚久未晰此疑辛亥夏卧病聞銅臭而嘔恍自反為木形人色常青畏金故於銅臭為相忤因思子和吐論中發吐之藥四十有六種嘗讀而未能解也遂將以五形五色定人而施之若木形人畏金腥而吐則火形人畏鹹腐水類而吐矣然畏者必惡惡因其惡以激其怒則用力少而成功多餘三形可以例見噫豈唯吐藥為然而下而汗寧不可乎沈抄聶久吾曰庚寅季春别駕夏公至新興寺放飢榖豫備酒飯欵之正飲間忽然腹痛其痛從臍下小腹起痛至胃腕即嘔嘔訖痛止半時許又從下痛上復嘔嘔訖痛止如是者數次醫作感寒治用藿香砂仁等藥不效至申刻豫覺是內熱作痛熱氣上衝而嘔必須利之然煎劑不可服恐反增嘔急製牽牛大黃丸服至數不利數次而脫然愈矣黑牽牛四兩半炒半生磨取頭末一兩二錢三稜莪术醋炒各六錢為末濃米湯為丸梧子大服三錢未到再服二錢俟二三時見效鮑緑飲年二十餘以夏月肩輿返歙途次受熱鼻衄盈盆愈後偶啖梨遂得吐症蓋肝火而胃寒也百治無效聞道吐字則應聲而嘔以故家人咸戒之後至吳門就葉氏診以其脈沉細令服附子理中湯人參薑附俱用三錢服後出門行及半里覺頭重目眩急歸寓及門而仆幸其尊人雅諳藥性謂必中附毒亟煎甘草湯灌之良久乃蘇後去附子仍服三劑吐轉劇再往診仍令服前方遂不敢試改就薛氏告以故薛用六君子湯服四劑無驗再求診適薛他往薛壻令照方加益智仁一錢再服亦不應又求診於孫某其方用甘草八錢下咽即吐因不復求治而返偶以冬月送殯感寒增咳纒綿至夏余偶訪之則病劇詢知為向患吐近復二便俱祕已七八日不食惟渴飲茶水更醫數人或令以艾灸臍俱不應請診之見其面色青悴脈弦伏而寸上溢謂此緣脾陰大虧木火熾甚又因久嗽肺虛肝無所畏遂下乘脾而上侮胃致成關格幸脈不數易已也宜先平其肝俾不上衝而吐止斯肺得下降而便行令以黃連肉桂各五分隔湯蒸服飲下覺吐稍止即能食糕數塊然二便脹不可支令以大田螺一枚獨蒜一枚搗爛罨於丹田以物繫定不逾時二便俱行所下皆青色遂霍然而愈時甲戌五月二十七日也後與六味加減入沙參麥冬等咳嗽亦止向後常服養榮之劑吐不作矣葉太史古渠在上江學幕中患吐症久不愈凡學使按臨之郡必召其名醫診治兩年餘更醫十數病日甚嵗暮旋里或與二陳加左金吳萸川連俱用五六分服下少頃吐血碗許脈之不數苐兩寸俱上魚際左尺微不應指彼欲言病源及所服方藥余曰悉知之矣苐服余方五十劑乃得痊計熟地當用三斤許乃訝然莫喻問所患究何病曰彼上江名醫不過謂病痰飲耳所用方不過四君六君香砂六君已耳遂拍案笑曰一皆如言但非痰飲何以多酸苦涎沫今飲食日減何以反重用熟地曰此症由於腎虛肝失其養水燥生火上逆胃絡肺金亦衰飲食入胃不能散布通調致津液停畜腕中遇火上衝則吐而出也四君二陳香砂類皆香燥之品以之為治猶抱薪救火反助之然必滋水生木潤肺養金庶可獲效第陰藥性緩病既久非多劑不瘳也用熟地杞子沙參麥冬石斛等出入加減初服吐自若十劑外吐遞減食漸增果至五十劑而愈倪首善年未二十稟賦甚弱早婚得吐病或與二陳五香等劑轉甚有用桂附者服一劑覺不安乃止有教單食豬油者初頗效後亦不應脈之虛弦略數與生熟地沙參麥冬川連蔞仁四劑後去連又三十餘劑而愈髙氏女七八嵗時即病頭痛而嘔或酸或苦百治不效其父詢余余曰此肝火上逆耳與生地杞子沙參麥冬二三劑即愈後及笄於春盡病復作其父已殁乃兄延數醫治之所用皆二陳六鬱香砂丁桂之類經半年面殺青股無肉其母泣令延豫仍前方每劑內熟地一兩二十餘劑乃愈金氏婦患吐症蓋十餘年矣所服香燥不可勝計後左脅漸有塊經水不行脈澀數善怒延診辭不治弦不已勉與六味加減服之頗有驗然一怒即發越半年而卒福建羅二尹悔齋久病足痿於去年春嘗嘔而頭汗大出醫療無效乃不藥數月漸可隨於夏間又患不眠治亦無效至秋後乃痊今年春因公事寓杭求針科治足疾又為灸中腕氣海等穴十餘壯步稍良而嘔症大作食入即吐絶粒數日又不眠服薑附萸桂二术二陳等覺有煙辣之氣上衝診之六脈大如筋頭兩寸皆溢出魚際舌瘦小伸之極尖且顫中黃胎邉紅㿔額色赭石鼻色熏焦小便清白大便常五日一行謂此營氣大虧肝腎之火上逆胃絡則嘔吐浮入心胞則不眠與養青湯加川連牛膝苡仁屬其驗小便黃則病退一劑即不嘔能食小便果黃色二劑得眠舌胎淡紅㿔消唯兩脅如有物動輒牽引加山梔川楝二劑左脅之物即墜下又加枇杷葉熟地蔞仁去山梔川楝黃連牛膝二劑右脅之物亦墜下脈亦稍斂大便二日一行以行期甚迫屬其照方服至舌不顫乃可或足疾再甚慎進風燥之劑所以云者知其針之得㵼而暫愈耳反胃常熟一富人病反胃往京口甘露寺設水陸泊舟岸下夢一僧持湯一杯與之飲罷便覺胸快次早入寺乃夢中所見僧常以此湯待賓故易名曰甘露飲用乾飴糖六兩生薑四兩二味爛搗作餅或焙或晒入炙甘草末二兩鹽少許點湯服之豫在臨汀療一小吏旋愈切勿忽之繼洪淡寮方本草綱目金山周禪師得正胃散方於異人用白水牛喉一條去兩頭節并筋膜脂肉及如阿膠黑片收之臨時旋炙用米醋一盞浸之微火炙乾淬之再炙再淬醋盡為度研末厚紙包收或遇陰濕時微火烘之再收遇此疾每服一錢食前陳米飲調之輕者一服立效凡反胃吐食藥物不下結腸三五日至七八日大便不通如此者必死用此方十痊八九君子收之可濟人命也普濟方本草綱目天順間有周岐鳯者身兼百技溺意方術既死友人偶召箕周至運箕如飛頃刻數百言乃長詩也後一段云朗吟堂前夜欲闌丹方寫與期平安菊莊老人此老病翻胃病實由胃寒枇杷葉兮白豆蔲紫蘇子兮用莫謬良薑官桂用些須厚朴陳皮看功奏半夏檳榔赤茯苓沉香丁皮皆用輕白芥藿香吐聖藥杆頭粳兮尋至誠三片生薑兩枚棗切切分明向君道人參乃是佐使者食前一服沉疴好蓋菊莊患此病用示以方也苐菊莊未知何許人餘詩不録祝子志怪薛立齋治一婦人患反胃胸脅脹悶或小腹不利或時作痛小便澀滯曰此肝火血虛也當清肝火生肝血養脾土生肺金以薛言為迂别服利氣化痰等劑前症益劇虛症蜂起乃用加味逍遙散加味歸脾湯兼服尋愈一婦人患反胃吐痰甚多手足常冷飲食少思曰此肝脾鬱怒兼命門火衰不信另服化痰利氣之劑胸腹愈脹又服峻利疏𨗳之劑薛曰非其治也必變脾虛發腫之症急服金匱加減腎氣丸庶有可救仍不信反服沈香化氣等丸果發腫而歿汪石山治李一之年近四十病反食與近鄰二人脈病頗同汪曰二人者皆急於名利惟一之心寬可治遂以八珍湯減地黃加藿香為末用蜜韭汁調服而愈其二人逾年果歿張路玉治湯伯乾子年及三旬患嘔吐經年每食後半日許吐出原物全不穢腐大便二三日一行仍不燥結渴不喜飲小便時白時黃屢用六君子附子理中六味丸皆罔效日頻於危診之兩尺弦細而沈兩寸皆澀而大腎臟真陽大虧不能溫養脾土之故遂以崔氏八味丸與之或謂附子已服過二枚六味亦曽服過恐八味未能奏效也張曰不然此症本屬腎虛反以薑附白术伐其腎水轉耗真陰至於六味雖曰補腎而陰藥性滯無陽則陰無以生必於水中補火斯為合法服之不終劑而愈張三錫曰治反胃用新水一大碗留半碗將半碗水內細細澆香油鋪滿水面然後將益元散一貼輕輕鋪滿香油面上須臾自然沈水底此即陰陽升降之道也用匙攪勻服却將所留水半碗蕩藥碗潄口令淨吐既止却進末子涼膈散通其二便未效再進一帖益元及涼膈即效也此方極驗王叔權曰有人久患反胃豫與鎮靈丹服更令服七氣湯遂能立食若加以炷艾尤佳有老婦患反胃飲食至晚即吐出見其氣繞臍而轉豫為點水分氣海并夾臍邊兩穴他醫只灸水分氣海即愈神效資生經浙省平章南征閩越還病反胃醫以為可治朱先生診其脈告曰公之病不可言也即出獨告其左右曰此病得之驚後而使內火木之邪相挾氣傷液亡腸胃枯損食雖入而不化食既不化五臟皆無所稟去此十日死果如言越遊集醫説續編薛立齋治一婦人患反胃胸腹痞悶得去後或泄氣稍寬此屬脾氣鬱結而虛弱也當調補為善不信乃别用二陳枳實黃連之類不應又用香燥破氣時師類多出此前症益甚形氣愈虛用歸脾湯調治半載而痊許學士治一婦人年四十餘久患翻胃面目黃黑厯三十餘年醫不能效脾俞諸穴燒灸交遍其病愈甚服此藥頓然全愈服至一月遂去其根名附子散用附子一枚極大者生於磚上四面著火漸漸逼熟焠入生薑自然汁中再用火逼再焠約盡生薑汁半碗焙乾入丁香二錢每服二錢水一盞粟米少許同煎七分不過三服瘥玉海云趙侍郎先食後吐目無所見耳無所聞服紫菀丸五十日㵼出青蛇五七條四寸許惡膿三升愈方見癘風門蕭萬輿曰崇禎戊寅嵗余客汴梁為一郡王宫人産後發厄症因言及先王壯齡時患瘧痢反胃遍治不瘥自料無生理一草醫亦精於脈者連投五劑用大黃七兩始能食再投十餘劑計服大黃斤許前症漸愈後日服痰藥滚痰丸兩旬方得全痊越年餘連生五子夀至九十三嵗而薨如此稟賦亦所不概見者㵼崔萬安分務廣陵苦脾㵼家人禱於后土祠是夕萬安夢一婦人珠珥珠履衣五重皆編貝珠為之謂萬安曰此痰可治今以一方相與可取青木香肉豆蔲等分棗肉為丸米飲服下二十丸此藥太熱疾平即止如其言愈稽神録宋髙宗嘗以㵼疾召王繼先繼先至則奏曰臣渴甚乞先宣賜瓜而後靜心診御上急召大官賜瓜繼先先食之既上覺其食瓜甘美則問繼先朕可食此乎繼先曰臣死罪索瓜固將以啓陛下食此也詔進瓜上食之甚適㵼亦隨止左右驚上亦疑問繼先曰此何方也繼先曰上所患中暑故㵼瓜亦能消暑耳四朝聞見録翁葉紹王涇亦頗宗繼先術亦有奇驗然用藥多孟浪髙宗居北宮苦脾疾涇誤用㵼藥竟至大漸孝宗欲戮之市朝憲聖以為恐自此醫者不肯進藥止命天府杖其背黔海山涇先懷金箔以入既杖則以傳瘡若未嘗受杖後放還居天街猶揭於門曰四朝御醫王防禦有輕薄子以小楮帖其旁云本家兼施瀉藥王慙甚同上竇材治一人患暴注因憂思傷脾也服金液丹霹靂湯不效蓋傷之深耳命灸二百壯小便始長服草神丹而愈一女人因泄㵼發狂言六脈緊數乃胃中積熱也竇詢其丈夫因吃胡椒生薑太多以致泄㵼五日後發狂言令服黃芩知母湯而愈衍義治一人大腸寒清小便精出諸熱藥服及一斗二升未效後教服赤石脂乾薑各一兩胡椒半錢同為末醋糊為丸如梧子大空心及食前米飲下五七十丸終四劑遂愈醫學綱目張子和曰昔聞山東楊先生治府主洞泄不止楊初未對病人與衆人談日月星辰纒度及風雲雷雨之變自辰至未而病者聽之忘其圊楊嘗曰治洞泄不已之人先問其所愛之事好棋者與之棋好樂者與之笙笛勿輟脾主信又主思慮投其所好以移之則病自愈維揚府判趙顯之病虛羸泄瀉褐色乃洞泄寒中症也每聞大黃氣味即注泄張診之兩手脈沈而軟令灸分水穴一百餘壯次服桂苓甘露散胃風湯白术丸等藥不數月而愈趙明之米榖不消腹作雷鳴自五月至六月不愈諸醫以為脾受大寒故併與聖散子豆蔲丸雖止一二日藥力盡而復作諸醫不知藥之非反責明之不忌口張至而笑曰春傷於風夏必飱泄飱泄者米榖不化而直過下出也又曰米榖不化熱氣在下久風入中中者脾胃也風屬甲乙脾胃屬戊巳甲乙能尅戊巳腸中有風故鳴經曰風木太過風氣流行脾土受邪民病飱泄診其兩手脈皆浮數為病在表也可汗之直斷曰風隨汗出以火二盆暗置牀之下不令病人見火恐增其熱紹之入室使服湧劑以麻黃投之乃閉其户從外鎖之汗出如洗待一時許開户減火一半須臾汗止泄亦止喻嘉言治周信川用火之法逮祖此見痢門麻知幾妻當七月間病臟腑滑泄以降火之藥治之少愈後腹脹及乳痛壯如吹乳頭重壯熱面如渥丹寒熱往來嗌乾嘔逆胸脅痛不能轉側耳鳴食不可下又復㵼麻欲㵼其火臟腑已滑數日矣欲以溫劑又禁上焦已熱實不得其法請張未至因檢劉河間方惟益元散正對此症能降火解表止渴利小便定利安神以青黛薄荷末調二升置之枕右使作數次服之夜半遍身冷汗出如洗元覺足冷如冰至此足大暖頭頓輕肌涼痛減嘔定利止及張至麻告之已解張曰益元固宜此是少陽症也能使人寒熱遍劇他經縱有寒熱亦不至甚既熱而有利何不以黃連解毒湯服之乃令診脈張曰娘子病來心常欲痛哭為快否婦曰欲如此豫亦不知所謂張曰少陽相火凌爍肺金金受屈制無所投告肺主悲但欲痛哭而為快也麻曰脈初洪數有力服益元散後已平又聞張之言使以當歸白芍以解毒湯味數服之大瘥矣一僧病泄㵼數年丁香豆蔲乾薑附子官桂烏梅等燥藥燔針燒臍炳腕疑脘無有缺者一日發昏不省張診兩手脈沉而有力脈訣云下利微小者生脈浮大者無瘥以瓜蒂散涌之出寒痰數升又以無憂散泄其虛中之積及燥糞盈斗次以白术調中湯五苓散益元散調理數日而起劉德源病洞泄逾年食不化肌瘦力乏行步傾欹面色黧黑凡治利之藥遍用無效張乃出示內經洞泄之説以曉之先以舟車丸無憂散下十餘行殊不困己頗喜食後以檳榔丸磨化其滯待數日病已大減又下五行後數日更以苦劑越之病漸愈而足上患一癤此裡邪去而之外病痊之候凡病皆如是也豫治余氏媪膈症將愈亦指上生癤劉倉使大便少而頻日七八十次常於兩股間懸半枚瓠蘆如此十餘年張見而笑曰病既頻欲通而不得通也何不大下之此通因通用也此一服藥之力乃與藥大下之三十餘行頓止殷輔之父年六十餘暑月病泄㵼日五六十行喜飲而家人輩爭之張曰夫暑月年老津液衰少豈可禁水但勸之少飲先令以菉豆雞卵十餘枚同煮卵熟取出令豆軟下陳粳米作稀粥攪令寒食雞卵以下之一二頓病減大半蓋粳米雞卵皆能斷利然後制抑火流濕之藥與調順而愈一男子病泄十餘年豆蔲阿膠訶子龍骨烏梅枯礬皆用之矣中腕臍下三里嵗嵗灸之皮肉皺稿神昏足腫泄如泔水日夜無度張診其兩手脈沉微曰生也病人忽曰羊肝生可食乎曰羊肝止泄尤宜食病人悅食一小盞許以漿粥送之幾半升續又食羊肝生一盞許次日泄減七分如此月餘而安夫胃為水榖之海不可虛怯虛怯則百邪皆入矣或思葷茹雖與病相反亦令少食圖引漿粥此權變之道也若專以淡粥責之則病人不悅而食減久則病增損命世俗誤人甚矣孫文垣治張懷赤每早晨腸鳴瀉一二次晚間㵼一次年四十二且未有子診之尺寸短弱右關滑大曰此蓋中焦有濕痰君相二火皆不足故有此症以六君子湯加破故紙桂心益智仁肉豆蔲煎服瀉遂減半前方加杜仲為丸服之愈次年生子何洗心每飲食稍冷饘粥或稀必作脹㵼理脾之劑厯試不瘳孫診之左三部皆濡弱右寸亦然關滑尺沉微此下元虛寒所致法當溫補以補骨脂杜仲兔絲各二錢山萸肉人參山藥各一錢茯苓澤㵼各八分肉果五分數劑愈吳鶴洲母年八十六素有痰火大便日三四行一夜兩起腸鳴臍腹膨脹脈三四至一止或七八至一止醫以苦寒入平胃散投之剋伐太過因致腹疼且謂年髙而脈歇至是為凶兆辭不治孫診之曰脈緩而止曰結數而止曰促此乃結脈非凶脈也由寒濕之痰凝滯所致法當補溫下元俾火得以生土所謂虛則補其母是也吳問夀算何如曰兩尺迢迢有神夀徴也以補骨脂白术各三錢為君杜仲二錢為臣茯苓澤㵼陳皮甘草各一錢為佐肉果益智仁各五分為使四帖大便實惟腸鳴未止減肉果加炮薑五分而安夀至九十有八薛立齋治侍御沈東江之內停食腹痛作㵼以六君加木香炮薑而愈後復作傳為腎㵼用四神丸而安侍御徐南湖子室㵼屬腎經不信薛言專主滲泄後遂致不起一婦人年踰五十不食夜飯五更作㵼二十年矣後患痢午前用香連丸午後用二神丸各二服而痢止又以二神丸數服而食夜飯不月而形體如故吳江史玄年母素有血疾殆將二紀平居泄㵼飲食少思面黃中滿夏日尤甚治血之藥無慮數百劑未嘗少減薛以為脾腎虛損用補中益氣湯送二神丸復用十全大補湯煎送前丸食進便實病勢頓退若泥中滿忌參术痰痞忌熟地便泄忌當歸皆致誤事府博趙宜人患泄㵼諸藥無效診之曰此肝腎虛也服木香散而愈經曰泄痢前後不止腎虛也又曰諸厥固泄皆屬於下下謂下焦肝腎之氣也門户束要肝之氣也肝氣厥而上行故下焦不能禁固而泄痢腎為胃關門户不要故倉廩不藏也薛立齋治沈太尹病㵼五更輒利此腎㵼也用五味子散數服而愈因起居不慎㵼復作年餘不瘥此命門火虛不能生土法當補其母火者土之母也遂用八味丸㵼即止食漸進東垣云脾胃之氣盛則能食而肥虛則不能食而瘦全賴命門火為生化之源滋養之根也故用八味丸屢效只用六味亦可龔子才治一人食下腹即響響即㵼至不敢食諸藥不效以生紅柿核紙包水溫灰火燒熟食之不三四個即止許州黃太守患泄㵼二三年不愈每飲燒酒三鍾則止二三日以為常畏藥不治龔診之六脈弦數先服此藥以解酒毒後服理氣健脾丸而愈宜黃連一兩生薑四兩以慢火炒令薑乾脆去薑取連搗末每服二錢空心臘茶湯下甚者不過二服專治久患脾泄陳三農治一士喜食瓜果縱飲無度忽患大㵼先用分利不應再用燥濕反加沉困診其六脈浮因思經曰春傷於風夏生飱泄非汗不解以麻黃三錢參术各二錢甘草升麻各一錢與之泄㵼頓止以四君子調治而愈一人脾胃素弱少有所傷即泄㵼此肝氣乘脾且久㵼濕熱在腎故也用白术八兩紅棗去核四兩二物間襯煮至焦色搗餅烘乾入松花七錢白豆蔲五錢新米糊為丸午前服愈一人腳膝常麻飲食多即泄㵼此脾虛濕熱下流用補中益氣湯加防己黃柏而愈一人食物入口頃從大便出其脈洪數此火性急速也用黃連滑石木通澤㵼人參徐徐服二帖愈楊起云余壯年患肚腹微微作痛痛即㵼㵼亦不多日夜數行兩月瘦怯尤甚用消食化氣藥俱不效一僧授方用蕎麥麵一味作飯連食三四次即愈簡便方本草綱目李時珍謂氣盛有濕熱者宜之虛寒人食則大脫無氣而落鬚眉也李時珍治魏刺史子久泄諸醫不效垂殆李用骨碎補為末入豬腰中煨熟與食頓愈蓋腎主大小便久泄屬腎虛不可專從脾胃也本草綱目一婦年七十餘病㵼五年百藥不效李以感應丸五十丸投之大便二日不行再以平胃糝加椒紅茴香棗肉為丸與服遂瘳每因怒食舉發服之即止同上一婦人年六十餘病溏泄已五年肉食油物生冷犯之即作痛服調脾升提止澀諸藥則轉甚診之脈沉而滑此乃脾胃久傷冷積凝滯所致王太僕所謂大寒凝內久利溏泄綿厯藏年者法當以熱下之則寒去利止遂用蠟匱巴豆丸五十粒與服二日大便反不行其㵼遂愈自是每用治泄痢積滯諸病皆不㵼而病愈者近百人蓋妙在配合得宜藥病相對耳苟用所不當用則犯輕用損陰之戒矣同上有人患內寒暴泄如注或令食煨栗二三十枚頓愈腎主大便栗能通腎於此可驗同上易思蘭治瑞昌王妃患泄㵼屢用脾胃門消耗諸藥四五年不能止一醫用補中益氣湯加人參三錢服一月不泄忽一日胸脹滿腹響如雷大㵼若傾昏不知人口氣手足俱冷渾身汗出如雨用人參五錢煎湯灌蘇如是者三病者服久自覺口中寒逆醫者以為汗出過多元氣虛弱於前湯內加人參三錢棗仁大附子薄桂各一錢昏厥尤甚肌膚如冰夏暑亦不知熱二年計服過人參二十五斤桂附各二斤棗仁七十斤至己巳冬飲食入口即時㵼出腹中即飢飢而食食即瀉日十數次邪火不殺榖火性迫速愈盛而愈迫也身不知寒目畏燈火熱明顯初診之六脈全無久按來疾去緩有力如石聞其聲尚雄壯此乃大鬱火症也以黃連四錢入平胃散與之飲下少頃熟睡二時不索食不泄㵼飲五日方知藥味甘苦既用通元二八丹與湯藥煎服一月飲調和其病遂愈吳浮先治俞用昭秋間水㵼腹痛異常右脈弦數洪實知腸胃濕熱挾積用枳殼山楂黃連青皮檳榔木香一劑而滯見病人慮藥尅伐意欲用補曰有是病服是藥邪氣方張非亟攻不退邪退則正復攻即是補也前方再服二劑愈矣設不早攻必致痢疾非一月不痊謝武功素患大便溏泄兼病咳嗽用涼藥則咳減而㵼增用熱藥則㵼減而咳劇用補脾則咳㵼俱甚診之右尺軟如爛綿兩寸實數博指酌用附子肉果以溫下焦之寒麥冬川連以清心肺之火茯苓甘草一以降氣一以和中甫四劑而症頓減不加人參者緣肺家有鬱熱耳喻嘉言治胡太夫人病偶然肚腹不寧㵼下數行醫以痢疾藥治之其利轉多更引通因通用之法用九蒸大黃丸三錢下之遂擾動胃氣脹痛全不思食狀如噤口診之六脈皆沉而伏應指模糊曰此非痢症乃誤治之症也今但安其胃不必治痢而痢自止不必治脹痛而脹痛自除遂以四君子湯為主少加薑蔲暖胃之藥二劑痢果不作但苦胃中脹痛不安必欲加入行氣之藥以冀脹消痛止而速得進食固爭曰寧可緩於食不可急於藥蓋前因藥誤引動胃氣作楚若再加行氣則脹痛必無紀極即用橘皮亦須炒而又炒凡五日未得大便亦聽之痛止脹消食進便利共七日全安渾不見藥之功其實為無功之功也陸養愚治許默菴素有腸風症常服寒涼之藥中年後腸風幸愈致傷脾胃因成泄㵼之症初時服胃苓湯一帖便愈久之不效近來四肢浮腫而厥肚腹膨脹而鳴面色萎黃而帶青身體苦冷而帶熱診之左脈沈緩而遲右脈沉弱而弦曰諸緩為濕應㵼而浮腫諸遲為寒應厥而苦冷右弦為木乘土位應腹脹而面青沈者陽氣不升也弱者陰精不實也脈色與症悉相應用人參白术黃耆炙甘草為君以補其虛炮薑附子為臣以溫其寒升麻防風為佐以升其陽茯苓澤㵼為使以勝其濕十劑而諸症減又合八味丸間服而愈疑從薛案化出沈少西女二十自小脾胃受傷不時作泄作嘔近則寒熱不時手足厥冷胸膈不舒脅脹噯氣在眠則氣不通暢左脅胃脘時疼時止渴而不欲飲小便短大便日二三行腹中雷鳴彈之如鼓揉之如水大約氣上塞則脹而痛氣下墜則泄而痛幸飲食不甚減常服胃苓白术黃連及消𨗳之藥或調氣補血之品不應謂此症非參术不能取效但今微有表邪先與小柴胡加枳桔二三帖寒熱稍和近時庸師專得此決易以調中益氣湯去黃柏加青皮以伐肝神麯以助脾炮薑以溫中四帖脹痛俱減大便稍實改用加減歸脾湯數劑更以六君子料加枳實黃連神麯木香砂仁為丸與煎劑間服月餘而安陸祖愚治潘古臣母患脾泄久多啖水果㵼更甚嘗因經行腹痛服攻瘀去血之劑致淋瀝不止肌肉枯稿身體發熱不能轉側不思飲食氣短口渴夜卧不安服麥冬生地棗仁等而㵼不止脈之兩寸關虛數兩尺隱隱若無此下元不足中氣虛寒虛火上炎之症乃用人參炮薑白术陳皮山查木香苡仁木通山藥甘草豆仁服之頗覺相宜又用肉果人參白术炮薑棗肉為丸日服兩次一月㵼止兩月肌肉漸長月事亦調黃履素曰乙巳之夏余患中脘痛既而泄㵼偶過姑蘇一名醫令診之驚曰脾胃久傷不治將滯下豫體素弱憚服攻尅之劑因此醫有盛名一時惑之遂服枳實黃連厚朴山楂木通等藥數劑又服枳术丸一月以致脾胃大傷是秋遂溏泄不止漸覺飲食難化痞悶倒飽深自悔恨服參耆等藥及八味丸十餘年始得愈然中氣不如故苦不耐飢稍飢則中氣大虛憊不可狀凡山查消𨗳之物入口即虛脾胃乏不可妾攻如此方書極言枳术丸之妙孰知白术雖多不能勝枳實之迅利豫友胡孝轅刺史亦誤服枳术丸而大病可見此丸斷非健脾之藥或飲食停滯偶一二服則可耳又曰脾胃喜暖而惡寒脾虛必宜溫暖之藥患嘔吐不止服聶遡源五氣丹數丸遂不復發豫近患脾不和不時溏泄服參术三日不效服胡與辰金鉛一丸脾氣頓佳得兩三月安妥家菴中一比邱尼患脾疾甚殆肛門不收穢水任出服金鉛一丸肛門頓斂漸調而愈其神效有如此者故知脾病之宜於溫暖也張路玉治陳總戎泄㵼腹脹作痛服黃芩白芍之類脹急愈甚其脈洪盛而數按之則濡氣口大三倍於人迎此濕熱傷脾胃之氣也與厚朴生薑半夏人參湯二劑痛止脹減而㵼利未巳與乾薑黃連人參湯二劑㵼利止而飲食不思與半夏㵼心湯二劑而安柴嶼青治學士于鶴泉痢後久㵼醫以人參川連為末日服遂至飲食不思每欲小便大便先出求治診其兩尺微細欲絶經曰腎主二便又曰腎司啓閉今腎氣不固是以大便不能自主况年逾六旬不必診脈已知其概而脈又如此更無疑義遂用補中益氣湯加熟附一錢煨肉果二錢送八味丸二劑後頗思飲食大便止㵼勃有生機乃慕時醫某以為一劑立效二劑而殁惜哉馬次周令嗣于甲子場前身熱脾泄醫以外感治之屢藥不效診其人迎左尺平弱氣口微緩此屬肝腎脾胃不足用六君子湯加柴胡數劑身涼去柴胡再加歸芍調理而安是科獲雋張三錫治一人㵼口乾舌燥脈洪數與六一散一服知二服已又一人服不應用芩連四苓散效一老嫗久㵼服補劑不應以參苓白术散加黃連肉豆蔲少許作丸服未半斤永不發立齋治橫金陳子復面帶赤色吐痰口乾或時作㵼或用二陳黃連枳實之類不應脈之左關弦急右關弦大此乃腎水挾肝木之勢而剋勝脾土也不信後交夏果患痢而亡衍義治一人大腸寒清小便精出諸熱藥服及一斗二升未效後教服赤石脂乾薑各一兩胡椒半錢同為末醋糊為丸如桐子大空心及食前米飲下五七十丸終四劑遂愈此中寒而滑泄故此溫澀治之樓全善治翁仲政久泄早必泄一二行泄後便輕快脈滑而少弱先與厚朴和中丸五十丸大下之後以白术為君枳殼茯苓半夏為臣厚朴炙甘草芩連川芎滑石為佐吳茱萸十餘粒為使生薑煎服十餘帖而愈作食積在脾治羅謙甫曰丁巳豫從軍至開州夏月有千户髙國用謂豫曰父親七十有三於去嵗七月間因內傷飲食又值霖雨㵼痢暴下數行醫以藥止之不數日又傷又㵼止而復傷傷而復㵼至十月間肢體瘦弱四肢倦怠飲食減少腹痛腸鳴又以李醫治之處以養臟湯治之數日泄止後添嘔吐又易以王醫用丁香人參藿香橘紅甘草同為細末生薑煎數服而嘔吐止延至今正月間飲食不進扶而後起又數日不見大便問何以治之醫曰老人年過七旬血氣俱衰弱又况㵼痢半載脾胃久虛津液耗少以麻仁丸潤之可也或謂馮村牛山人見證不疑有果決遂請治之診其脈問其病曰此是風結也以搜風丸百餘丸服之利數行而死悔恨不已敢以為問豫曰人以水榖為本今髙年老人久㵼胃中津液耗少又重㵼之神將何依靈樞經曰形氣不足病氣不足則陰陽俱竭血氣皆盡五臟空虛筋骨髓枯老者絶滅少者不復矣又曰上工平氣中工亂脈下工絶氣危生絶危生其牛山人之謂歟琇按是症牛山人固莫可云前李王二君唯知嘔治㵼不知下多亡陰力進香燥至臟腑枯竭而上不納下不出其視牛亦魯衛之政也蓋當時此等症候即羅公生平亦未解用峻劑養營矧其他哉豫有治宋復華兄母夫人一案可參閲繆仲淳治梁溪一女人茹素患內熱每食腸鳴清晨水泄教服脾腎雙補丸立愈人參蓮肉兔絲五味萸肉山藥車前橘紅砂仁巴戟天補骨脂白芍扁豆蜜丸菉豆大每五錢空肌食時各一服如虛而有火火盛肺熱者去人參巴戟添補骨脂元有肉豆蔲無白芍扁豆廣筆記開慶己未年七月間裕齋馬觀文夫人費氏病氣弱怠四肢厥冷惡寒自汗不進飲食一醫作伏暑治之投暑藥一醫作虛寒治之投熱藥無效召僕診之六脈雖弱而關獨甚此中焦寒也中焦者脾也脾胃既寒非特但有是證必有腹痛吐㵼之症今四肢厥冷屬脾是脾胃虛冷無可疑者答云未見有腹痛吐㵼之症今用何藥治之僕答云宜用附子理中湯未服藥間旋即腹痛而㵼莫不神之即治此藥一投而差良方陳良甫治趙府博與輈宜人病泄㵼不止如附子木香訶子肉豆蔲龍骨等藥及諸丹服之皆無效診之云是肝腎脈虛弱此肝腎虛也府博云其説見在何經曰諸方論泄瀉止是言脾胃病不過謂風冷濕毒之所侵入及飲食傷滯遇腸虛則泄利而不知肝腎氣虛亦能為泄利古書所載甚明不可不辨經云泄㵼前後不止腎虛也又諸厥固泄皆屬于下下謂下焦肝腎之氣分也門户束要肝之氣也守司于下腎之氣也肝氣厥而上行不能禁固而泄利腎為胃關門户不要倉廩不藏也若病泄利其源或出於此而專以脾胃藥治之則謬固千里矣遂服木香散數服而愈舊傳有人年老而顔如童子者蓋每嵗以鼠糞灸臍中神闕穴一壯故也豫嘗患久溏利一夕灸三七壯則次日不如厠連數夕灸則數日不如厠足見經言主泄利不止之驗也又豫年踰壯覺左手足無力偶灸此而愈薛立齋治僉憲髙如齋飲食難化腹痛泄㵼用六君子加砂仁木香治之而痊後復作完榖不化腹痛頭疼體重困倦以為脾虛受濕用芍藥防風湯而愈太僕楊舉元先為飲食停滯小腹重墜用六君子加升麻柴胡漸愈後飲食難化大便而痊後心腹作痛飲食不甘用和中丸倍加益智仁而尋愈光祿楊立之元氣素弱飲食難化泄㵼不已小便短少灑淅惡寒體重節痛以為脾肺虛用升陽益胃湯而痊大凡泄㵼服分利調補等劑不應者此肝木鬱於脾土必用升陽益胃之劑庶能保生一儒者季夏患泄㵼腹中作痛飲食無味肢體倦怠用補中益氣湯八味地黃丸月餘而痊後彼云每秋間必患痢今則無恙何也曰此閉藏之月不逺幃幕妄泄真陽而然前藥善能補真火火能生土脾氣生旺而免患也憲副屠九峯先㵼而口渴尺脈數而無力恪用解酒毒利小便之劑不應曰此腎陰虧損虛火熾盛宜急壯水之主不然必發疽而不能收斂也不信别服降火化痰之劑果發疽而歿繆仲淳治無錫秦公安患中氣虛不能食食亦難化時作泄胸膈不寬一醫誤投枳殼青皮等破氣藥下利完榖不化面色黯白乃用人參四錢白术二錢橘紅一錢乾薑七分甘草炙一錢大棗肉豆蔲四五劑漸愈後加參至兩許全愈三年後病寒熱不思食他醫以前病因參得愈仍投以參病轉劇仲淳至曰此陰虛症也不宜參乃用麥冬五味牛膝枸杞白芍茯苓石斛棗仁鱉甲十餘劑而愈廣筆記從妹患泄後虛弱腹脹不食季父延諸醫療之豫偶問疾見其用二陳湯及枳殼山查等味豫曰請一看病者見其向內卧眠兩手置一處不復動曰元氣虛甚矣法宜理中湯恐食積未盡進以人參三錢橘紅二錢加薑汁竹瀝數匙夜半食粥神思頓活季父大喜盡謝諸醫再以六君子湯加山查砂仁麥冬調理之數劑立起同上朱丹溪治一老人奉養太過飲食傷脾常常泄㵼亦是脾泄白术二兩白芍神曲山查半夏各一兩黃芩五錢右為末荷葉包飯燒為丸平治會萃聶久吾治廬陵尹之嶽素以善醫名患傷感泄利自治不效脈之知其原感風寒未經發汗久則入裡鬱為溫熱又內傷飲食脾胃不和是以作泄乃先與清解滌其入裡之邪前胡甘草麥冬連翹赤芍赤苓花粉廣皮山查厚朴黃芩乾葛黃連枳殼生薑次日再診知其熱鬱已去脾胃虛滑用補脾藥一劑而安宋復華兄尊堂年七十體素肥長夏病泄㵼診之曰此肝木乘脾也宜養肝腎則愈勿治脾與數劑病已略減會復華以事入都家人另延醫投以蒼白术補骨脂肉豆蔲丁桂香砂建蓮扁豆之屬服至百餘日肌肉枯削動則忡惕眩暈食入即嘔而下利益頻始謝去但延余但與重劑杞子地黃沙參麥冬苡仁山藥初加黃連三分四劑隨減去加人參一錢四五劑亦減去後加肉蓯蓉四錢四劑凡服藥一月而安類皆甘寒潤滑之品有泥景嶽之説謂吐㵼皆屬脾胃虛寒者宜變通焉復華令正亦患脾泄每五更黎明必行一二次醫亦以香燥卒熱健脾之劑與之治半年餘泄㵼轉加月事數月不至寒熱無時頭暈心忡四肢厥冷每下午則面赤口苦舌燥食則欲嘔寐則多驚幸脈未數亦與杞地沙參麥冬間入酒連諸症遞愈經水亦行再加山藥棗仁食增㵼止禇某年二十四五新婚數月忽病泄㵼日五六次苐食後即急欲如厠腹脹甚腰亦疼脈之兩手俱弦與生地杞子沙參麥冬苡仁川楝稍減旋復乃加杞子至一兩入酒連四分二劑而愈項秋子尊堂年五十久患泄㵼日常數行凡飲食稍熱即欲去後食漸減治數年無效已聽之偶昏暮於空房見黑影疑外孫也撫之無有因大恐失跌遂作寒熱左脅如錐刺徹夜不眠口苦眩暈或疑邪祟或疑瘀滯幸未服藥診之脈弦數與川連揀苡仁沙參麥冬生地杞子蔞仁才下咽脅痛如失再劑則纍年之泄㵼亦愈矣或問故曰此肝經血燥火旺脾虛之症經曰肝虛則目昏昏無所見其見黑影者乃眩暈時作又因恐而失跌也原夫向之泄㵼治罔驗者蓋時師見症治症所用必香砂苓术諸燥劑也火生於木禍發必克此陰符經之祕旨也醫者能擴而充之則世無難治之病矣續名醫類案卷十
