body:
  text: 續名醫類案卷三十二錢塘魏之琇撰崩漏薛立齋治一婦人性急每怒非太陽耳項喉齒胸乳作痛則胸滿吞酸吐㵼少食經行不止此皆肝火之症肝自病則外症見土受剋則內症作先以四物加白木茯苓柴胡炒梔炒龍膽清肺飬血次用四君加柴胡白芍神麴吳茱茰炒黃連以培土制肝漸愈惟月經不止是血分有熱脾氣尚虛以逍遙散倍用白术茯苓陳皮又以補中益氣加酒芍兼服而安一婦人懷抱不舒腹脹少寐飲食素少痰涎上涌月經頻數薛曰脾統血而主涎此鬱悶傷脾不能攝血歸源耳用補中益氣濟生歸脾而愈一婦人血崩兼心痛三年矣諸藥不應每痛甚虛症悉具靣色痿黃薛曰心主血蓋由去血過多心無所飬以致作痛宜用十全大補湯參术倍之三十餘劑稍愈百餘劑全愈大尹王天成之內久患崩自服四物涼血之劑或作或輟因怒發熱其血不止服前藥不應乃主降火更加脅腹大痛手足俱冷薛曰此脾胃虛寒所致先用附子理中湯體熱痛止又用濟生歸脾補中益氣二湯崩血頓愈若泥痛無補法則誤矣錦衣楊永興之內患血崩過服寒涼之劑其症益甚更加肚腹悶痞飲食不入發熱煩躁脈洪大而虛薛曰此脾經氣血虛而發躁也當急用八珍湯加炮薑以溫補之緩則不救不信仍服止血降火之劑虛症蜂起始信其言緩不及治矣一婦人因怒崩血久不已靣青黃而或赤此肝木制脾土而血虛用小柴胡合四物清肝火生肝血又用歸脾補中二湯益脾氣生肝血而瘥此症若因肝經風熱而血不寧者防風為丸以兼症之藥煎送或肝經火動而血不寧者炒條苓為丸以兼症之藥煎送若瘀血為患用五靈脂為末燒鐵器焠酒調服無不效者周暉內人病血山崩諸醫皆危之劉春齋用當歸一兩荆芥一兩酒一鍾水一鍾煎服立止如神續金陵瑣事易思蘭治一婦患崩晝夜十餘次每次去血升許用止血藥愈甚卧牀月餘羸瘦食少靣青爪黑氣促痰喘診之心脈平和肝脈弦大時一結肺脈沉而大且有力脾胃脈沉澀兩尺沉而無力曰此氣鬱病也詢之果因午餐小婢忤意發怒搆疾隨以四神散與之服藥半盂未及一時頓覺神爽易曰未也明日子時分指甲變桃紅色方可救至期甲色果紅復診之左三部如前肺脈微起脾胃雖沉緩而不澀二尺仍舊謂其家曰午時血當大崩毋得驚惶以駭病者至期果然下紫黑血塊數枚自此遂止後用壯真五和丸調理月餘全愈次年生子方用四神散以香附行氣為君烏藥為臣蘇梗通十二經之關竅白芷化腐血生新血為佐加當歸引氣入心而生新血川芎引氣入肝舒肝之鬱而去舊納新神麴引氣入脾暢脾結而統新血白术健脾胃而和中氣為使以行氣為主活血輔之此治血先調氣之法也吳孚先治俞氏婦血淋念載已成痼疾因幼孫出痘危險忽下血兩晝夜不止汗㵼交作暈數次思慮恐懼三隂並傷也脈向弦大而革者忽變而數疾欲脫奄奄一息用人參黃蓍各一兩製附炮薑棗仁各三錢五味龍骨各一錢或疑附子太熱且謂何不用血藥曰血脫補氣古人精義謂有形之血不能速生幾微之氣所當急固又脾胃氣血俱喜熱而惡寒薑附宜服也二劑脈漸轉前方加歸芍等血藥症已除然脈氣不弦非三年調攝未易復也自後參蓍不輟計服補劑六百餘帖膏丸數料而起并宿疾亦瘳一婦半月前小産繼以血崩舌硬心搖汗出髮潤日夜俱熱耳閉不聞目視不見身浮浮如在舟車六脈細數欲脫用人參二兩黃蓍二兩白术一兩熟地二兩當歸五錢炮薑製附棗仁各三錢龍骨一錢五分一劑頓減二劑精神爽慧陸養愚治王笠雲母年四十九經事已止半年一日匆暴至不止昏暈厥逆脈之兩手沈微如絲急以八物湯加附子薑灰煎灌之半時方醒連進二大劑乃止十之七八至十劑六日方止後數月復崩亦昏暈或以犀角地黃湯加藕節阿膠之屬不止脈仍沈弱以附子乾薑鹿茸俱燒存性同釜底墨酒調服之即止後以六味加四物料服之約二斤一年不作次年八月間又暴至昏暈更久脈之如舊仍以八物湯加附子連進二劑昏暈自晡至晚未醒咸謂必死診之決其必蘇蓋氣血暴脫一時至未能與胃氣相迎耳或投以牛黃丸至半夜人事稍省而血尚未止明早復診之仍銼八物湯少加薑附二劑或適至云昨夜之蘇乃牛黃丸之功公實不知也向因屢服參附致屢崩今人事既省斷宜順氣行瘀去其病本豈可復蹈前轍曰昨早投大補之藥即不服牛黃丸亦蘇此等脈症急宜續投參蓍少緩恐成不救况可更以他藥乎或乃怫然而去曰讀父書而坑趙卒天下每多此人陸令先服煎劑隨製存性附子等灰午後人事更爽進粥晚投末藥一服夜間血少止明日又湯散並投血遂止再服前湯十劑而瘳立齋治一婦人飲食因怒忽患血崩四肢逆冷抽搐口禁如發痙然吐痰如涌灌以二陳柴胡山梔枳殼吐出酸味神思稍醒藥止次日進薄粥少許但乳脅脹痛此悉屬肝火熾盛致脾氣不能運化先用六君柴胡山梔鉤藤諸症頓退惟四肢不遂血崩如初或又為肝火未息欲投清肝涼血之劑此肝脾氣血俱弱先用補中益氣湯培其脾土而血氣歸經又用四物參术柴胡飬肝經而四肢便利餘見異症名要一婦人月經淋瀝無期作鬱怒傷肝脾虛火動而血不歸經乃肝不能藏脾不能攝也當清肝火補脾氣與歸脾湯逍遙散二藥四劑而愈一婦人因怒經事淋瀝半月方竭遇怒其經即至甚則口噤筋攣鼻衄頭痛痰痙抽搦上視作肝火熾盛以小柴胡加鉤藤黃連熟地山巵而愈王執中治皮匠妻患血崩兩月飲食不進與鎮靈丹服少減而未斷因撿得耆域方如聖散用棕櫚烏梅乾薑各一兩煎燒存五分性為末每服二錢食前烏梅湯調下合一劑與服而疾平患甚者不過三服資生經有巡撫夫人年踰五十因傷寒而血崩與膠艾四物湯一服漸愈後因勞復大作與鎮靈丹十五丸而止或無此丹燒鹿角存性為末酒調服亦佳屢驗同上陳良甫治一婦人崩漏暴下諸醫投薑附桂等藥服之愈甚診之六脈緊數遂用金華散兼局方龍腦雞蘇丸數服即安本事方單用黃芩者亦此意也良方一親戚婦人年四十五經年病崩漏不止靣黃肌瘦髮黃枯稿語言聲嘶服諸藥無效診之六脈微濡問服何藥云凡是當歸川芎澀血諸品丹藥服之皆不作效遂合溥濟方伏龍肝散兼白礬丸服之愈同上繆仲淳治董清山夫人患血崩由于中年鬱怒百藥不效用大劑參蓍令覔胎髮百餘丸火煆調入藥服久之漸愈煆髮用小砂罐鹽泥煉極熟將髮入罐中封固隂乾以炭火圍之俟黑煙將盡即起若青煙出髮枯不可用矣非細心人不可任蓋火候不可過也王肻堂曰徐朝奉傳其內人有血崩症服諸藥不效用香附炒為末每服二錢米飲調下服後遂痊未選入一親戚黃卿內子凌夫人忽苦血崩百藥不效用五靈脂一味不拘多少炒令煙盡研末每服一錢溫酒調下旋服遂安蔣仲芳治毛氏婦經來淋瀝不斷已徑三月涼血止血之藥服至五六十劑不效而口乾唇燥愈甚脈來微澀詢其大便必㵼果然即以四君子湯加熟附炮薑熟地血餘二劑而止蓋寒客于中火浮于上脾虛而不攝血故淋瀝不已也聶久吾婦年三十九生子月內調飬未善次年春其經兩月餘不行一日忽暴至不止一二飯久即昏暈不省人事急用十全大補湯去桂倍加參蓍又加熟附子炒乾薑各一錢灌之蘇省後連服二大劑遂止十之七八又十餘日共服二十餘劑乃得全止次年春崩又大作比前尤甚昏暈更久又服前方三十餘劑尚未全安後用鹿茸炒燒存性研末酒調二錢服數次而血止繼服峻補丸藥幸年餘不發然病根未除次年中秋忽又暴至前方連服二大劑血流如水涌吐冷痰至日晡昏暈初更而氣絶惟胸次微溫至三更用灶心土研細水調灌一二酒杯冷痰少開遂飲滚湯一盞蘇省漸安豈初發時服大補二劑能令生意不絶耶後又服峻補之劑而血止因思三年之內嘗服峻補丸藥而病仍大作者何也或謂補血太過是以積而成崩或謂不宜用附子等熱藥推動其血遂至于崩此説極是惜聶君未及明抑知土虛不固然後山崩今既血崩則是血大虛且血氣相依附氣虛甚則降令多升令少是以不能攝血致血不歸經而妄下不惟大補血而尤當大補氣也前丸方雖峻補不合攙入香附益母砂仁元胡等損氣之品乃令病根不除而屢作也因純用補氣血藥一料而神氣爽健二料而病根除次年遂孕而生第八兒矣劉氏媪年七十病血行如壯年月事久之淋漓不斷兩月餘耳鳴心跳頭暈目眩惡食罕眠奄奄就斃醫者不一有與歸脾補中者六味四物者十全八珍者諸治未為無見然服歸脾補中則上鬲脹而靣腫似不宜于補氣服六味四物則小腹脹而足腫似不宜于補血服八珍十全則中脘脹而氣急似氣血兼補又不宜延診先告以不宜用補以症皆緣補而增也脈之沉小而澀兩關尤甚且無神曰此肝脾兩傷之候也以七旬之年兩月之病非補何以能瘳苐余之補異乎人之補無慮也與熟地二兩以一兩炒炭杞子一兩白芍炒棗仁炒各五錢酒連三分四劑而淋瀝止去連四劑而腫脹消諸症亦愈姚氏婦早寡年三十餘因月事暴至遂崩漏不止勢甚猛脈之兩寸上溢兩尺甚弱據脈不可與補中益氣據症又不可不暫升提以挽其下陷先與熟地杞子白芍棗仁重劑服之果不應急以萆麻仁十數粒去殼研入麝一分捏作餅子用緑雲膏貼臍上再服前藥血去漸緩少頃再服藥覺血不行即令揭去之又服數劑全愈白𢃄朱丹溪治陶遒外姑年七十形瘦善啖白𢃄食前薑湯吞大補丸五十丸一二次午膳後及臨卧時各與小胃丹十五丸愈胡安人白𢃄下月經甚多食少倦怠靣黃經中如有血塊者有如筋膜者與參术等補血氣調脾胃後諸症皆退惟𢃄未止以樗皮丸主之薛立齋治一婦人𢃄下四肢無力薛曰四肢者土也此脾胃虛弱濕痰下注以補中益氣濟生歸脾二藥治之而愈孫文垣治吳涌瀾母年六十餘久患白𢃄歷治不效變為白崩診得右寸滑左寸弱兩關濡兩尺軟弱據脈心腎俱不足中焦有濕古云崩中日久為淋𢃄漏下多時骨亦枯今白物下多氣血日敗法當燥脾兼補心腎以既濟丹補其心腎以斷下丸燥中宫之濕則萬全矣果未終劑而愈一僧治蔡大尹內人崩中赤白𢃄下用墓頭回一把酒水各半盞童便半盞新紅花一捻煎七分卧時溫服日近者一服久則三服愈董炳集驗方一婦人小腹痞脹小便時下白𢃄小水淋瀝此肝經濕熱下注用龍膽㵼肝湯而愈一女人赤𢃄腰痛以四君子加乾薑肉桂地榆而愈男子腰痛亦效一婦人赤白濁腰痛四君子加當歸杜仲續斷乾薑地榆而愈王海藏云李知府妻梅氏𢃄下病七年血崩不止骨痿著牀日服紫莞丸五丸至十丸十五丸取下膿血五升黃水一升肉塊如雞子狀始愈方見瘀風門王教授云有來覔赤白𢃄藥者豫以鎮靈丹與之鎮靈丹能活血溫中故也以其神效故書于此但有孕不可服者若夋𢃄脈穴尤竒于此丹也資生經一婦人白𢃄兼病痛風半夏茯苓川芎陳皮甘草蒼术米泔浸黃柏酒洗晒乾炒南星牛膝酒洗煎服同上蕭萬輿治龔氏妾年三十娩未百日恣啖生冷嘔吐臍痛病白𢃄月餘行經衝任冒寒發熱煩渴赤𢃄頻下脈沉遲無力此內真寒而外假熱症也用四物二陳加炮薑肉桂木香少佐升麻丸服月餘而愈一寡婦年三旬時或增寒發熱通宵不寐時或經晝昏睡喃喃獨語遇勞肢體厥冷每用薑蔥解表遂致停熱脾胃乘虛下注而患赤𢃄脈沈伏重按搏指以為相火藴結外假寒而內真熱也用四物加黃連龍膽炒巵知母茯苓木通投八劑諸症悉安來天培治一婦年四旬外苦于白𢃄朝夕常流不止已十餘日矣外症頭暈腰痛診其脈澀此肝腎隂虧氣虛下陷所致法宜以十劑中澀可去脫之劑治之否則因循慮成弱症矣以六味飲去茰肉澤㵼加牡蠣龍骨川斷肉桂杜仲白芍鹿角膠不數劑而瘳一閨女年十五嵗夏間患白𢃄月餘更兼腹痛診之六脈俱弦細而數按之中指下極沉此屬脾氣下陷肝藏濕熱為患同升麻柴胡蒼术白术茯苓半夏廣皮甘草黃柏黃苓二劑而霍然交腸交腸症男子亦有張路玉治詹石匠婦産後五六日惡露不行腹脹喘滿大便從前隂而出省其故平日酷嗜煙酒所産之兒身軟無骨因而驚駭遂患此症以芎歸湯加蒼术肉桂炒黑山查一服惡露通而二便如常陸聖祥之女方四嵗新秋患血痢而稀糞出于前隂作冷熱不調食積治與五苓散服香連丸二劑而愈錢吉甫女年十三體肥痰盛因鄰家被盜發熱頭痛嘔逆回青六脈弦促而便溺易位此因驚而氣亂痰襲竅端所致也與四七湯下礞石滚痰丸開通痰氣而安喻嘉言治薑宜人得竒症簡本草經疏治交腸用五苓散之説以為神祕喻曰交腸一症大小二便易位而出若交易然古用五苓治之専為通前隂而設也若此症閉在後隂二便俱從前隂而出擬之交腸誠有似是而非者况交腸乃暴病驟然而氣亂於中此症乃久病以漸而血枯於內有毫釐千里之别原夫疾之所始始於憂思傷脾脾傷則不能統血而錯出下行有若崩漏實名脫營宜大補急固乃誤以涼血清火為治脫出轉多於是乎陽明之血亦漸消今乃大腸枯稿幽門驟閉飲食至此無庸分别遂清濁并走前隂勢必大腸復通令渣滓率由故道斯為得耳與五苓一方有何干涉况五苓一方又為亡已血所深戒乎向診時嘗問病中多哭泣否答曰時時泣下乃知臟燥者多泣大腸方廢而不用也交腸云乎哉今大腸之脈纍纍而現於指可虞之時其來春棗葉生乎棗葉生而言果驗按此仍是交腸症惟與驟然氣亂者不同耳愚擬治之之法宜集靈膏重用人參以補其肺而潤之蓋肺與大腸相表裏而主氣又肺者相傳之官治節出焉肺得飬斯大腸之燥可清又得枸杞二冬以滋其失血之稿然後故道可復而清濁自分矣薛立齋治一産婦小便出糞名大小腸交乃氣血俱虛失行當道先用六君子湯二劑又用五苓散二劑而痊婦人良方作先用五苓散二劑而愈又用補中益氣湯而安沈明生治葉惟和室月夜探親其母留之食時春寒獨峭歸途即覺肌膚凛栗次早復當窗梳櫛重感于邪無熱惡寒胸膈䐜悶一醫見其肌表無熱竟作食傷太隂主治遽用大黃下之不特不見效反致水道閉澀尤可異者白物腥穢如膏淋之壯從大腸來綿綿不絶漸致肌體蔞弱骨立難支診之脈沉而澀虛寒可知計惟有溫中益元之法然慮大便尚結小水未行或增滿之患遂先用五苓散倍加肉桂一服而水道果通再服而宿垢并下嗣用附子理中湯三四劑後白物漸止更以十全大補調理一月而安夫白淫白沃載在靈蘭之典皆指前竅中來今乃轉移于後何也蓋此病始終是一寒症初因食在胃脘之上火衰不能熟腐而反下之太早則有形之物不能即降而無形之寒抑遏于闌門之際遂致清濁混淆涓涓不息似乎淋𢃄而實非淋𢃄也今先以五苓分利隂陽而倍肉桂使寒隨溺泄上下宣通繼以理中之劑撤其餘邪鼓其陽氣令脾土熱燥而濁流有制宜其效如桴鼓也夫始用行大便之藥大便不行并致小便亦澀今用利小便之藥小便即利并致大便亦通其得失為何如哉求子建平孝王妃姬侍皆麗無子擇良家未笄女入御又無子問尚書禇登曰求男有道乎澄對曰合男女必當其年男雖十六而精通必三十而娶女雖十四而天癸至必二十而嫁皆欲隂陽完實然後交合則交而孕孕而育育而為子堅壯強夀今未笄之女天癸始至已近男色隂氣早泄未完而傷未實而動是以交而不孕孕而不育育而子脆不夀此王之所以無子也然婦人有所産皆女者有所産皆男者大王誠能訪求多男婦人媒至宫府有男之道也王曰善未再期生六男夫老陽遇少隂老隂遇少陽亦有子之道也禇氏遺書朱丹溪曰肥盛婦人不能孕育者以其身中脂膜閉塞子宫而致經事不行可用導痰湯之類瘦怯婦人不能孕育者以子宫無血精氣不聚故也可用四物湯飬血飬隂等藥余姪女形氣俱實以得子之遲服神仙聚寶丹背上發癰疽症候甚危豫診其脈散大而澀急以加減四物湯百餘貼補其隂血幸其質厚易于收救質之薄者悔將何及龔子才治劉小亭年四十無子陽事痿弱精如氷冷求診兩寸脈洪兩尺脈沉微無力此真元衰􅉵乃斫喪過度所致以固本健陽丹加人參附子枸杞覆盆子各二兩製一料服盡覺下元溫暖如前又製一料服至半料而乃正果孕生一子後傳之於劉柏亭劉敏菴服之俱得子汪石山治一婦人形肥色淡紫年幾三十艱於育子脈之兩尺皆沉微法當補血以形言之肥人氣虛亦當補氣遂令多服八物湯仍以補隂丸加參蓍空腹吞之三月餘有孕復為診之兩尺如舊以理論之孕不當有昔人云脈難盡慿殆此類歟薛立齋治儒者錢思習子室年三十餘無嗣月經淋瀝無期夫婦異處幾年矣思習欲為娶妾以謀諸薛薛意此鬱怒傷肝脾虛火動而血不歸經乃肝不能藏脾不能攝也當清肝火補脾氣遂與加味歸脾逍遙二藥四劑送至其家仍告其姑曰服此病自愈而當受胎妾可無娶也果病愈次年生子后妃不妒忌而百斯男獨中山靖王飲酒好內生子百十二人世稱全鹿丸為周文王所定常服之故生子衆多豈中山靖王亦常服是丸者耶何生子之多于文王也張氏巵言馮楚瞻治金紹老晨㵼不已就診按其脈兩寸關俱沈弱無力兩尺沉微更甚曰少年得此不惟難愈更恐嗣育之間多女少男矣適許某至亦索診其脈亦然各道連生數女而無子令以八味去丹皮澤㵼加補骨脂三兩兔絲子四兩五味子二兩早晚食前各服五錢後各生子矣精要云久服令人肥健多子信然吳孚先治蔡孝亷年已五旬苦乏嗣遍求種子方偹嘗十載無一驗診得右尺神旺真火本自不衰惟左尺虛弱乃真水乾涸也宜補隂配陽與六味地黃丸加元武膠越二載果得一子萬密齋曰嘗見男子隂痿者多致無子不可不慮也惟其求嗣之急易為庸醫之惑或以附子赤石脂為內補或以蟾酥呵芙蓉為外助陽事未興內熱已作玉莖雖徑頑木無用以致終身無子或有夭歿者吾見此輩無辜而受醫藥之害遍訪諸方無越此者出以示人名曰壯陽丹熟地黃四兩巴戟去心破故紙炒各二兩仙靈脾一兩桑螵蛸真者鹽焙陽起石煆另研水洗各半兩上六味合隂之數研末煉蜜丸如桐子大每三十丸空心只一服溫酒下不可恃此自恣也戒之生地四兩熟地四兩天冬四兩麥冬四兩當歸二兩枸杞一兩仙靈皮八兩銼碎絹袋浸大罈酒內隔湯煮從卯至酉取水埋地下七日夫婦日共飲五六杯婦人經水不準者即準而受孕此方刻鄒南臯仁文書院集驗方中扶銀臺徐光祿俱云往往得驗因腹記而筆之李日草六硯齋筆記吳橋治胡醫卿胡喜詼諧故與橋習則以久不宜子請壯陽方橋診曰公寸脈洪尺中沉澀火炎而不降水涸而不升水火不交是曰未濟法宜滋隂補腎庶幾相濟相生倘復壯陽則火益炎而水益涸咳血嘔血將不可謀殆矣胡大笑曰吾五十而善飲強飯不異丁年何病徒以陽痿精滑願得方藥壯之且吾斗奭滋隂藥如奉漏巵無益橋曰技止此爾胡後遇邑人老而舉子者得壯陽方至留都亟服之咳而失聲已復咳血久之肉削大溲浸動則遣使逆橋橋謝不暇病深請告歸即召橋歎曰不用公言至此矣幸脈不數聲不喑骨不蒸血不咳獨大溲日三四行爾橋曰否否夫數者喑者蒸者咳者則陽火未熄猶可鼓而行之今熄矣即爐鞲無及也無何而絶妊娠王顯字世榮文昭皇后之懷世宗也夢為日所逐化為龍而繞后后寤而驚悸遂成心疾文明太后敕召徐譽及王顯等為后診脈徐譽言是微風入臟宜進湯藥及加針灸顯診云按三部非有心疾將是懷孕生男之象後果如言汪石山診一婦形長色紫妊五月矣求脈之以别男女汪曰脈右大於左脈訣云左大為男右大為女今脈右大當是女耶彼則喜曰我男胎矣往嵗有妊時尊甫先生診之亦謂右脈浮大當是女孕後生男今妊又得是脈可知為男矣後果生男汪曰脈書但道其常莫能盡其變此醫所以貴乎望聞問切也張子和診一婦人年四十餘得孕自以為年衰多病故疾復作醫亦不察加燔針於兩臍旁又以毒藥攻磨轉輾腹痛食減形羸已在牀枕張診其脈曰六脈皆平惟右尺洪大有力此孕脈也兼擇食為孕無疑左右皆笑之不數月生一女兩目下各有燔針痕幾喪其明凡治病婦當先問孕不可倉卒鬍王之妻病臍下積塊嘔食靣黃肌瘦而不月或謂之乾血氣治之無效張視之曰孕也其人不信再三求治乃與之平藥以應其意妙否則别求人治或致悮事終不肯下毒藥凡攻病之藥皆曰毒後月到果胎也問何以别之曰尺脈洪大也亦有尺脈徵弱而孕者見求子門汪石山案素問隂陽别論所謂隂摶陽别之脈崑山周知縣景星家一婦病腹中塊痛專科診之曰氣積投以疏氣破積之劑又命人以湯餅軸擊之不效聞有巫峯神廟頗靈往問之云此胎氣也勿用藥信之彼果生一男南京户部主事韓文光妻病腹中作痛按之若有物在臍左右者適浙中一名醫至京請診之云是癥瘕服三稜蓬术之劑旬餘覺愈長亦以其不效乃止後數月生二男此皆有命而然可不慎哉客中間集程世光治一有胎婦兒腹啼皆不治乃傾豆於地令婦低頭拾之兒啼止江西通志萬密齋曰兒啼腹中此症臨月將産婦人有之師母錢氏嘉靖戊子有娠九個月兒在腹中哭錢大驚令作男子拜而止之過二十日生師兄邦孝師母以下似萬門人語邦孝似萬之子李有懷妾髙氏懷妊二十七月舉子後亦長成雲問雜志朱丹溪曰懷孕愛物乃一臟之虛假如肝臟虛其肝氣止能飬胎無餘用也不能榮肝肝虛故愛酸物治法邢氏亡其名朱勝非婦偶小疾命視之曰小疾爾不藥亦愈然不宜孕孕必死其家以為狂言後一嵗朱婦得男其家方有抱孫之喜彌月婦疾作急召之堅不肯來曰去嵗已言之無可療之理越宿而婦卒人共竒之錢塘縣志妊娠胎不長薛立齋治一妊婦胎六月體倦懶食靣黃晡熱而胎不長因勞欲墜此脾氣不足也用八珍湯倍參术茯苓三十餘劑胃漸健胎安而長矣一妊婦因怒寒熱往來內熱晡熱脅痛嘔吐胎之八月而不長此因肝脾鬱怒所致用六君加柴胡山梔枳殼紫蘇桔梗病愈而胎亦長矣妊娠胎動薛立齋治鴻臚張淑人痢疾後胎動心神不安肢體殊倦用八珍散二十餘劑漸愈因勞加煩熱頭痛以大劑補中益氣湯加蔓荆子治之熱痛頓止仍用前散又五十餘劑而安其後生産甚易一妊婦八月胎欲墜如産卧久稍安日晡益甚此氣血虛弱朝用補中益氣湯加茯苓半夏隨愈更以八珍湯調理而安一妊婦小腹作痛其胎不安氣攻左右或時逆上小便不利用小柴胡湯加青皮山梔清肝火而愈後因怒小腹脹滿小便不利水道重墜胎仍不安此亦肝木熾盛所致用龍膽肝湯一劑諸症頓愈乃以四君子加柴胡升麻以培脾土而安孫文垣治張溪亭子室妊已七月夢見亡過祖母揮拳背打一下即覺胎動不安血已下大小便皆急腰與小腹脹痛者五日診之兩寸俱短弱此上焦元氣大虛當驟補之人參阿膠黃蓍白术各二錢當歸白术條苓杜仲各一錢砂仁香附各五分苧根嫩皮三錢蔥白六錢一劑而血止再劑諸症悉除四劑後減去蔥白苧根調理旬日足月産一女吳孚先治孫氏婦妊六月作㵼欲小産診之曰此水胎也四君子加炮薑製附十餘劑而安陳三農治一孕婦腰痛甚如欲小産用杜仲一兩薑汁拌炒續斷一兩二味為丸白湯送下遂安薛立齋治一婦八月胎下墜或動靣體倦飲食少思此脾氣虛弱用補中益氣湯倍白术加蘇梗三十餘劑而安産後眩暈胸滿咳嗽用四物加茯苓半夏桔梗而愈一妊婦內熱晡熱或兼寒熱飲食少思其胎或下墜或上攻此肝經血虛而火動耳先用加味逍遙散數劑次用六君子加柴胡枳殼各數劑而愈一婦人每胎三四月作痛欲墜此為痛胎用當歸二錢熟地黃三錢而愈妊娠子懸即胎上也附子滿薛立齋治一妊婦每因恚怒其胎上逼左關脈弦洪乃肝火內動用小柴胡加茯苓枳殼山梔而愈但體倦不食用六君子加枳殼柴胡山梔而瘥孫文垣治費少垣乃眷妊已九月痰多喘嗽胎氣上逆眼撑不起兩太陽微疼此子懸症兼痰火也以大紫蘇飲為主才服一帖即不上逆胸膈頓寬唯喘咳不止與七製化痰丸而安陸祖愚治梅飬中子婦孕七月其夫出外經商患胎上衝心不時昏暈或與紫蘇安胎飲數劑不效脈之寸大於關關大于尺俱帶弦數此血虛極而火上炎之故也用清氣飬榮湯磨沉香四兩牛黃二分煎就徐徐灌之不終劑而蘇矣蔡元度寵人有孕夫人怒欲逐之憂悸成疾乃取香术散用莪术煨二錢丁香一錢甘草三分共為細末分作三服空心鹽湯調覺胸中如物推下之而愈芬蜜齋廣嗣紀要萬密齋治徐太和之妻娠八月得子滿病或作子懸治不效腹滿轉甚胎墜下迫玉門大張脆形外露但仰卧不能坐其脈兩手俱大堅摶指謂曰病無害乃雙胎也胎肥氣弱妊娠子腫一孕婦遍身皆腫或以為白火疸或以為鼓脹治俱不效産科郭大生曰此名琉璃胎至將産一月前必飲食大進産即腫消矣而果然彼蓋閲歷多故耳然病之所以然究未之知也一婦人孕七月先下體發腫漸及面目數月忽子户內突出一水泡皮薄而光亮於是身腫悉消矣然起卧不便困苦非嘗後復皮破出水恆不得乾偶一內親自言昔嘗患此有醫教用王不留行及明礬等藥煎洗而痊如言試之苦於蜇痛如此月餘比前稍愈而終不除詢産科亦罕知者但云此似不妨必所謂琉璃胎也産時自消後果然同上一孕婦遍身發腫既産仍不消只向裡牀卧終日昏迷不省人事有時少醒即又狂躁不寧如此二十餘日絶口不食諸醫束手偶有村媪聞而告曰無憂我兒媳亦曽如此不餓死也但用陳年白鮝向病人前炙熱以米醋沃之彼聞香自然欲食如言果愈腫亦遂消同上又見婦人胎腫如欲産之勢皆由氣血虧竭不能束約故下墜耳用束胎和氣主之加人參一錢升麻炒三分服三劑胎復上而安後生一男一女楊乘六治我修姪婦妊八月一日胎忽上搶塞至心口喘滿不食自汗悶絶僵卧口噤目直視面色不赤舌色不青按其兩手脈息尚有急取丸子兩許滚水研化灌之灌至兩酒杯胸口鬆動口開睛轉手足運動而蘇問何藥乃爾神曰八味丸也又問此何病而用此丸曰此子懸也由下元虛冷中無火以養嬰兒故上湊以就心火之熱如人睡被中足冷則上縮也後用蓍术芎歸煎送前丸服至兩月而産未選入薛立齋治一妊婦每胎至五月肢體倦怠飲食無味先兩足腫漸至遍身後及遍頭面此脾肺氣虛朝用補中益氣湯夕用六君加蘇梗而愈元豐中淮南陳景初名醫也獨冇方論治妊婦子腫病其方初謂之香附散李伯時易名曰天仙蕂散王荆公居金陵舉家病以詩贈景初曰舉族貧兼病煩君藥石功到家何所有一一問征鴻因此見方得于李伯時家傳方録于臨川張右丞宅薛立齋治一婦子腫用紫蘇飲三服而愈轉脬鍾大延治一貴家孕婦小便祕腫脹面赤發喘衆醫莫效大延診之曰是可弗藥乃胎壓膀胱耳令其周身轉運而瘳寧波府志孫卓浮梁人工精岐黃正德間邑令以宸濠之變先與送其夫人避山中病前祕五日腹膨如鼓仰而張目息已微急召孫孫曰此盛暑急驅飲水過度羞溺而轉脬也法以豬尿脬吹氣貫滿令女婢投入衝之而溺淋淋下遂起江西通志孫文垣治一富家婦大小便祕者三日市師以巴豆丸二帖大便㵼而小便愈祕脹悶臍突二寸餘前隂脹裂不能坐卧啼泣呻吟欲求自盡孫曰此轉脬病也桕樹東行根皮一寸滑石三錢元胡索桃仁當歸瞿麥各一錢臨服入韭菜汁半杯服後食頃小便稍行玉户痛甚非極用力努之則不能出改用升麻桔梗枳殼元胡索煎成調元明粉二錢乃提清降濁之意服後大小便俱行始不脹急次日報云每便時腹先痛有淡血水小便短再以丹參丹皮當歸白芍甘草青皮香附元胡茯苓山梔山查兩帖而安孫君又有四卷七十七頁一案亦轉脬病治法大抵如前唯多令患者橫卧畀有力婦人以患者兩腳膝彎架肩上將下體虛空提起搖擺數四則尿脬倒上徐徐放下患者去衣不及小便箭射而出熱如湯黑如墨頃刻盈盆一段按轉脬病古人但令患者橫卧榻上高其下體良久其尿自通殊不費力黃履素曰豫窗友賀立菴方伯常言其伯父賀嶽精於醫曽治一孕婦將坐草患小便不通百藥不效愈飲愈飽束手待斃賀君診之曰此乃脾氣虛弱不能勝胞故胞下墜壓塞膀胱以致水道不通大健其脾則胞舉而小便自通以白术二兩土炒加炒砂仁數錢别加一二輔佐之藥服一劑小便立通其神如此豫常記此言于懷中壬寅嵗內人有妊臨月竟同此病藥無功危甚余以此法告醫者喜醫虛心如法治之立效遂舉長子寅錫余若不聞此言母子均殆矣李時珍嘗治數人小便不通及轉脬危急者令將蔥管吹鹽入莖內極有捷效又小兒不尿乃胎熱也用大蔥白切四片乳汁半盞同煎片時分作四服即通不飲乳者服之即飲乳若臍四旁有青黑色及口撮者不可救也本草綱目薛立齋治司徒李杏岡仲子室孕五月小便不利諸藥不應薛曰非八味丸不能救不信别用分利之藥肚腹腫脹以致不起儒者王文逺室患小便不通小腹腫脹幾至於殆用八味丸一服小便滴瀝再以前丸之料加車前子一劑即利肚腹頓寬而安陸養愚治方思桂女年十四患大小便不通已三日村醫與丸藥數十粒如芝麻大服之大便立通而㵼小便仍祕又二日脹悶臍突小腹時時抽痛不能坐卧啼泣呻吟欲求自盡脈之沉數而兩尺尤甚曰此轉脬病也時尚炎熱以六一散井水調服之小便稍行行時隂中極痛後仍點滴不暢大便努責而無積腹痛時作痛則如刀刺再診脈仍沉數乃用升麻三錢柴葛甘桔各一錢以提清降濁服後二便俱行小便純血大便亦帶血水其家猶危之曰今無患矣向者丸藥必巴豆也病本熱鬱而以極熱之藥攻之向之刺痛今之溺血皆巴毒使然也以犀角地黃湯加黃連山巵數劑而愈萬密齋治一娠婦淋瀝小便不通醫作轉胞治之不愈乃用檳榔赤芍二味研末順取長流水煎湯調服效此方治男婦一切血淋及淋澀水道疼痛用之無不神驗馬元儀治沈氏妾妊娠八月下利二十餘日利後患小便淋閉渴而引飲飲畢方去滴許澀痛異常已三晝夜診得肺脈獨大餘脈虛澀曰下利經久脾隂必耗燥火自強今見肺脈獨大是火據肺位金被火制氣化不及州都便溺何由而出經曰病在下者治上令上竅越則下竅自行矣且妊娠之體脈見虛澀氣血不能養胎可知若再行趨下不惟病不除且有胎動之患因與紫苑五錢專達肺氣下及膀胱乾葛一錢升發胃氣敷布津液火鬱則氣燥以杏仁蘇子潤之燥勝則風生以薄荷清之加枳殼桔梗開提三焦之氣一劑小便如泉再劑利下亦止吳橋治趙氏婦故孱弱有身七月病不得大小溲醫者遞以四苓利之卒不利久則小腹前後脹急痛楚燥亂昏憒殆將不勝橋診之則以補中益氣湯加黃連為劑一服小溲稍行明日為湯液五斗呼挈壺者口授之扶病者坐臨盤遞引湯沃病者腹沃已口授産嫗舉手奉其胎大小溲即行病愈矣病得之食砒而唾未盡其遺毒觸胎病者故內虛胎氣下墮而壓脬矣或曰胎壓脬矣或曰胎壓脬而不得小溲誠是也大溲何為橋曰小溲塞則鼓膀胱是將壅大腸其氣亦為不利故爾聞者曰善太函集妊娠胎墮薛立齋治一婦人墮胎昏憒不時吐痰自用養血化痰之劑昏憒不省自汗發搐痰涎涌出彼以為中風欲用祛風化痰之劑薛曰此屬脾氣虛寒所致遂用十全大補湯加炮薑二十餘劑尋愈一婦人年二十餘疫疾墮胎時咳服清肺解表喘急不寐薛謂脾土虛不能生肺金藥損益甚先與補中益氣加茯苓半夏五味炮薑四劑漸愈又與八珍加五味及十全大補湯全愈龔子才治一婦人每懷孕至三箇月必墮不肯服藥教以四五老母雞煮湯入紅穀小黃米煮粥食之不數服而胎固至足月生男方節菴之夫人朱屢受産難因就醫乞墮胎方服之無效復求方於專産醫鄭氏鄭云墮胎不下必貴兒也今後宜服安胎藥矣一日方間步阡陌間見一道人手攜竹筐坐於橋下與之語道氣盎然因設齋留之到家問筐中何物曰此濟瘳病人丹藥也因授一方名曰回生救産丹并勸修合普施朱夫人誕彌厥月時服一丸則果如達矣遂連生二子長名鵬字矯亭次名鳯字改亭後一為宫詹一為御史云張氏巵言薛立齋治一婦苦於生育孕及三月以麵粉燒酒調服墮胎胎去下血不止嘔吐湯藥不納六脈細小欲絶作毒藥傷胃氣胃氣虛不能司納以人參二錢甘草五分水煎徐徐與服嘔止用八珍湯調理而安又治一孕婦用前藥患前症胸腹飽滿嘔吐不止用菉豆甘草湯飲之而安一婦懷孕三月而墮墮後發熱自汗四肢軟弱曰氣血虛不能榮養其胎故墮墮後益虛隂虛則發熱陽虛則自汗以十全大補湯去桂加五味子而安吳橋治程應兆妻故多病三月不月已忽微行諸醫以為積血而力導之惡乃大至舉身汗溢垂絶而蘇則又為虛極而重劑補之上視反張驚搐昏冒飾巾待盡橋診之脈雖離經按之不絶曰此妊脈也誤謂積血迫之大行胎離經而欲下則血竭而途窮陽氣無隂血可依則浮騰而上越胎隨陽上逆而觸心故上視反張驚搐昏瞀法不當死乃豫順胎散始進甚艱既及半而藥力行嗒焉而寐諸醫目橋曰死矣橋曰藥中病乃寐諸公待之頃之呻吟始云頭痛諸醫以為餘燼也夜分乃終橋曰中夜陽生比當來復時至而圉圉乃少舒詰朝爽然俄仆卧內諸醫目攝橋曰真死矣橋曰胎欲下而血垂盡壅閼不得行尋以順胎散下之則血塊大如拱諸醫攝橋曰吾向固以為積血果然橋徐應曰非積血也胎也立引水激而濯之外紫而中白具人形病者漸安諸醫乃服太函集妊娠胎死許裕卿治邵涵貞內子孕十七月不産不敢執意憑脈問諸情況果孕非病但云孕五月以後不動心竊訝之為主丹參一味令日服七錢兩旬餘胎下已死而枯其胎之死料在五月不動時經十三月在腹不腐而枯如果實在樹敗者必腐亦有不腐者則枯胎之理可推也張路玉治馬雲生婦孕十三月不産脈來微結為處十全大補湯服至二十餘劑而下胎枯色白治雖異而胎枯則一也喻嘉言治顧季掖乃室仲夏時孕已五月偶爾下血醫以人參阿膠勉固其胎又經一月身腫氣脹血逆上奔結聚於咽喉胸膈間食飲才入觸之痛楚轉下甚艱稍急即嘔出全似噎症數更醫咸謂胎氣上逼延至秋計孕已八月病已極呼吸將絶診之脈與病反其脈尺部微澀難推獨肺部洪大無倫其喘聲如曳鋸其手臂青紫腫亮如毆傷色乃駭曰似此凶症何不早商然不必明言以滋驚恐姑以善藥投之通其下閉上壅可也必求病名曰上壅者以肺脈之洪大合於會厭之結塞知其肺當生癰也下閉者以尺脈之微澀合於肉色之青腫知其胎已久壞也善藥者㵼白散加苓桔之苦以開之不用硝黃等厲藥也服一大劑腹即努痛如欲産狀問欲産乎曰肺氣開而不行多時閉拒惡穢得出可也奚産之云再進一劑身腫稍退上氣稍平下白汚如膿者數斗裹朽胎而出旬餘尚出白汚並無點血相間可知胎朽腹中已近百日蔭胎之血和胎俱化為膿也病人當時胸膈即開連連進粥神思清爽然朽胎雖去而穢氣充斥周身為青腫者未去也胸膈雖寬而肺氣壅遏為寒熱咳嗽者未除也乃一以清肺為主旬餘獲痊然則肺癰未成乃穢濁之氣上攻而然耳立齋治一穩婆之女勤苦負重妊娠腹中隂冷重墜口中甚穢意其胎必死令視其舌果青黑與朴硝半兩許服之隨下穢水而愈濟隂綱目是薛案一婦胎死服朴硝而下穢水肢體倦怠氣息淹淹用四君子為主佐以四物薑桂調補而愈同上李將軍妻病甚呼華他視脈曰傷娠而胎不去將軍言間實傷娠胎已去矣他曰按脈胎未去也將軍以為不然他舍去婦稍小差百餘日復動更呼他他曰此脈固自有胎前當生兩兒一兒先出血出甚多後兒不及生母不自覺旁人亦不悟不復迎遂不得生胎死血脈不復歸必燥著母脊故使多脊痛今當與湯并針一處此死胎必出湯針既加痛急如欲生者他曰此死胎久枯不能自出宜使人探之果得一死男手足完具黑長可尺許他之絶技凡此類也三國志陳斗巖治一婦孕四月而墮墮後腹腫發熱氣喘脈洪盛面赤口鼻舌青黑陳曰脈洪盛者胎未墮也面赤者心火盛而且乾也口鼻舌青黑肝氣絶而胎死也以蛇脫煎湯調平胃散加芒硝歸尾服之下死胎而安華他甘陵相夫人有妊六月腹痛不安華他視脈曰胎已死矣使下之果下男形即愈三國志陳良甫治僇宅厥媳孺人杜氏生産不下家人百方救療皆無效召診之曰産前脈不可考但當察色而知之遂揭帳明燭以察之其面色赤舌色青見此色者知胎已死母却無憂矣或問曰何以知之答曰面赤舌青者子死母活明矣躬自合至寶丹二粒服之胎即落矣此以見古人處方神速良方妊娠異胎莊氏婦懷妊三年不産有醫者診之曰脈象頗異疑必異物當以藥下之服畢覺腹中奇痛産一胞墮地而裂中有小蛇蜿蜒盤屈以次而出急撲之沉布衣麟親見其事三岡識略張路玉治一婦懷孕六月因喪子悲哭動胎醫用黃苓白术等二服不應改用香附紫蘇枳殼砂仁一服胎遂上逼心下脹悶喘急口鼻出血第三日薄暮往診其脈急疾如狂風驟雨十餘至則不至頃之復至如前因喻之曰此孕本非好胎安之無益不若去之以存母命因思此胎必感震氣所結震屬木惟金可制令以鐵斧燒紅醋淬乘熱調芒硝一兩灌之夜半果下異胎下後脈息微和神思恍惚所去惡露甚多又與安神調血之劑數服而安孫文垣治張氏婦年二十一診之左寸關短弱尺滑右寸亦滑關濡弱尺沉微診畢其夫問曰脈何如不告病原曰心神脾志皆大不足囫圇得妙肺經有痰孫君平生多以一痰揣病因躊躇不決久之曰左寸短弱如此安得有孕云已七十日矣問曽經孕育否曰已二次今乃三也問二産皆足月否男耶女耶曰始産僅九月手足面目俱全第無啼聲抱起已身冷矣細檢之乃知其無水火也水火前後隂也次亦九月而産亦無啼聲驗之口中無舌二胎之異如此乃為制方以補心脾為主令多服以百帖為率棗仁茯神逺志各一錢白术二錢白當歸枸杞各一錢五分甘草五分生地八分艾絮二分龍眼肉五箇水煎服足月産一子次年又有身不以前事為意至九月産下形體具備外有脂膜一片包其面不能去即殞因思上年所産獲全藥之力也乃以前方黏壁間才覺有身即照方服之後生子女皆無恙凡小兒有不足之症皆緣父母有虛損處觀此當舉一三反郭茂恂嫂金華君産七日不食始言頭痛頭痛已又作心痛既而目睛痛如割如刺更作更止相去無瞬息間每頭痛欲取大石壓良久漸定心痛作則以十指抓壁血流滿掌痛定目又痛又以兩手自剜取之如是十日不已衆醫無計進黑龍丹半粒疾少間中夜再服乃瞑目寢如平時至清晨下一行約三升許如蝗蟲子三疾減半已刻又行如前則頓愈矣濟隂綱目河南開封府有丹客之婦懷娠甚巨動躍間似雙胎也丹客語婦曰若生二男當名虎四兒虎五兒一日欲出而天若雨狀謂妻曰晴履可耶抑雨具去可耶妻未答則腹中朗應無雨丹客驚懼曰汝何人則曰虎四兒也言未竟又聞聲曰雖不落也有幾點丹客曰汝所為竟煉不成必須爐如何置火如何候藥如何辨又曰如何如何乃毛也如何如何小點化如何如何大點化待吾母為之可也丹客遂如言行之火然硫黃偶客至門室既不深廣而客又不行其父與二兒俱曰黃氣迫人奈何奈何至夜熏蒸死世今有小點化之術謂其傳也豫則以為豈非天怒其泄故欲滅其口耶然亦不知何妖也錢國賓云山西大同軍人朱劉祿娶妻孔氏七年始孕其腹極大月不能行八月不能動仰卧于牀延診右寸及兩尺脈主别部一倍經斷當生雙女其懷胎之狀主難産令服易産湯劑以救其母至十月期足腹痛産下一女其腹不減至三日腹陳痛再産一女其腹仍大咸謂怪異必傷其母矣次日腹又陳痛又産一女腹始如故初生二女存三生之女斃鬼胎滑伯仁治仁孝廟廟祝楊天成一女薄暮遊廟廡見黃衣神覺心動是夕夢與之交腹漸大而若孕邀伯仁治診之曰此鬼胎也其母道其由與破血墜胎之藥下如蝌蚪魚目者二升許遂安薛立齋治一婦人經閉八月肚腹漸大面色或青或黃用胎症之藥不應診之曰面青脈澀寒熱往來肝經血病也面黃腹大少食體倦脾經血病也此鬱傷脾肝之症非胎也不信仍用治胎散之類不驗薛用加味歸脾逍遙二藥各二十餘劑諸症稍愈彼欲速效别服通經丸一服下血昏憒自汗惡寒手足俱冷嘔吐不食薛用人參炮薑二劑漸愈又用十全大補湯五十餘劑而安此案依婦人良方鬼胎門選入東白馬氏婦有妊歷十四月不産形瘠尫且黑松陽周漢卿脈之曰非孕也乃為妖之所乘耳以藥下一物如金魚疾旋已立齋治一婦人虛羸有鬼胎癥塊經候不通診之曰此病也非胎也令服四物湯加莞花根而塊漸消又令用吳萸川芎柴秦強蠶巴戟巴豆不去油莞花醋製為末煉蜜丸梧子大每服七丸蜜酒下即出惡物而愈後以八珍湯調理而安錢國賓云余之太倉有長年吳山其妻懷孕十有八月胎形漸大山以貧人難治日懷生死之憂求便道一診其脈浮沉長短去來至止上下不一知痰非胎矣曽見痰火專門書中一款凡婦人當經受驚其痰由心胞絡流入血海如懷胎狀經閉漸大活動身安此假胎也以清痰活血輕劑用芎歸地芍貝母天冬半夏香附白芥子茯苓陳皮枳殼各一錢煎服數月乃愈六和塔農夫朱言之妻生平無病為人言寡凡有氣惱不發肝火久鬱可知矣於天啓二年經後胎漸大起居飲食如常至十月不生又十月不生家人憂甚醫皆莫知其故錢亦曽診見六部浮鼓亦未敢斷又過五月終日撒屁如此兩月胎消因當經著氣傷肝久鬱沖於血海似懷胎而無形此名氣胎表出以識續名醫類案卷三十二
