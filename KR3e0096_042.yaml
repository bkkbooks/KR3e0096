body:
  text: 續名醫類案卷四十二錢塘魏之琇撰小兒疹孫文垣治僕子孫守以麻即瘄子咳嗽無痰上唇厚腫體熱大便燥聲啞燥火為患以麥冬知母瓜蔞甘草白芍桑皮是症宜去白芍桑皮入牛蒡桔梗地骨皮石斛枳殼服后嗽減其七乃去瓜蔞枳殼以其大便已溏加生地當歸苡仁調理而安程氏子七嵗中麻西吳呼為瘄子姑蘇呼為沙子一月餘矣發熱如故咳嗽聲啞肌削骨立頭髮盡禿衆醫束手孫見之曰若謂此兒不治耶此麻后虛熱成疳以大蘆薈丸治之可萬全也病家初不余問者謂非幼科専門也不知此特大方家餘事耳可改韓詩曰餘事作兒科然方脈不知貌科者必非良手為製藥與之未服盡而病瘳吕東莊治錢氏子五嵗病診泄瀉兒醫謂瘄最宜於瀉不復顧忌以清火為急寒涼縱進著眼前縱字病勢殊劇吕視之靣色兩顴嫩紅虛陽上浮時咬牙喘急上盛口渴甚飲水不絶隂虛液燥脈洪緩如平壯人曰脾急矣速投人參白术當歸黃茋陳皮甘草茯苓木香以救之一劑覺安或阻之曰誤矣小兒有専門豈可令腐儒治之吾所聞瘄病以發散清涼解毒為主今半身瘄潮熱未退而用溫補必不救矣無真知而參末議最能誤人知者慎之其家懼遂不敢再服間三日其父復來見曰諸症復如故如何吕曰豈有是理哉君戲我耳曰日來實不服君藥乃述其故吕曰君試急歸兒天柱骨倒矣别去頃之馳至曰果如公言奈何急服前方何如吕曰前方救虛也今加寒矣非桂附不能挽也曰顴紅口渴喘急飲水俱是熱症而公獨云虛寒何也曰隂竭於內何以不入生熟地陽散於外而寒涼復逼之也陽無所歸內真寒而外假熱此立齋所發內經微旨非深究精藴者不能信也乃歸而違衆服之一劑而天柱直二劑而喘渴止三劑起行嬉戲户外此由苦寒過劑故處方如是非一切小貌皆可桂附也馮楚瞻治沈氏兒發熱數日見麻疹才一日靣上盡沒神氣困極蛔從口出不一而足數日不食下瀉上喘唇口焦裂五心壯熱手足指尖皆冷脈細數無倫兩尺更弱咸謂疹毒歸臟胃熱故蛔連出也不知神氣欲脫五臟俱困脾虛不能納榖蟲無所食又兼虛火熏蒸臟腑燥熱蟲不安而出耳况諸斑疹多由內傷失調脾胃不足是以榮氣逆行隂覆於外血盛氣壯則紅而焮發血虛氣弱則色白而隱伏有何毒之輕重乎靣上退縮者陽虛不能升發也喘促者氣短難續也唇焦者脾津耗竭也五心壯熱者隂虧火爍也泄瀉不食者真火衰而脾不運也寸關細數尺弱者氣虛血虛虛火上浮而不藏也急則治標緩則治本今者之急本氣欲脫也倘謂麻疹餘毒解利清托恐神氣先盡矣乃以熟地六錢丹皮一錢麥冬三錢牛膝二錢製附六分一劑假熱全消真虛畢露神氣更倦此隂已少復當補氣以助其發生前方另煎人參二錢沖服神氣漸爽喘促全安飲粥微嘔乃胃氣久虛之故也再用前方加炒黃白术二錢去丹皮參湯沖服三四劑全愈愚按此與吕症大同小異要是百中一二未可執為程法也大抵麻疹之發本諸肺胃治之但宜鬆透一切風燥寒熱之劑不可入也余常遇表散過甚綿延不已者一以生地杞子地骨麥冬蔞仁沙參等味三四劑必嗽止熱退而安髙士宗長男六嵗次男三嵗於元旦次日俱發熱見疹即用清透發之劑次日略增十數點究不暢逹心以長男七月而生先天怯弱問其胸腹寬否曰飢甚口味何如曰淡甚因知其虛遂投茋术參甘桂枝紅花一二劑次日透發遍身熱稍退而人情猶煩躁夜發熱頻咳嗽至一月而安由見點之初過服表劑虛其經脈故也由此成疳勞者多矣次男幼稚致問不能以上冬痰喘服麻杏桂枝石膏一劑而愈謂其稟質略強其疹不透必寒凝毒甚因與蘇麻前杏黃芩石膏藥大錯紅點不增又與紫蘇蔥薑芫荽等熏之尉之疹總不出所謂不知經候混攻混表是也同道俱云舍透法並無别法此等藥豈止透發而已耶至五六日吐蛔或曰此熱極生蟲可服牛黃散牛黃散即大黃末也一服而痰喘止神氣稍平却自是不能言矣計無所施針百會穴開其瘄門服西黃分許及諸單方急則亂投藥餌觀其形症實不能生友人張衛生曰此大虛大寒症也今既無言又不能食恐無濟矣勉投參附究無挽回經云一逆尚引年再逆促命期為醫者可不鑒諸汪氏子出瘄已三日自用前杏麻黃石膏藥一二劑疹出二十點餘不能再增心胸煩悶乞髙診髙曰若再攻發則敗矣急與芎歸茋术桂苓紅花一劑而熱退身安凡治疹調其氣血和其經絡寒涼攻發概置不用則屢治屢效也亦非定論蓋鑒前車而矯枉過正也吳題先子甫二嵗出瘄兒醫攻發不透髙視之知其虛也曰若但發瘄瘄斷不出必至不保惟有溫補之劑益其臟腑安其腸胃助其氣血方可語無筋節則胸無卷軸可知遂與茋术薑桂歸芍苓草銀花紅花諸味一劑而安次日仍用原方加人參一錢又連服獨參湯而愈夏氏子出瘄色紫黯神氣不寧髙曰此症大凶治須得法連看二次皆用溫散藥次早其家人走告曰口㕱蟲另有藥否曰昨二劑俱服否曰尚存一劑因與附子八分令加入煎服自此遂無音耗心竊惑之越三載至其家猶懷鬼胎見其子長大因問昔年出瘖吐蛔何由得愈曰服藥后因無力相延仗天覆庇得以漸愈語亦虛活以上皆醫藥真傳髙案小兒疹徐仲光治一兒身熱喘脹以內傷外感治之不效視其背隱隱赤色乃疹也以麻黃湯表發雖出而頭靣不出隨沒而死一兒疹身熱似痘候遍身報點沈虛明黃錦雲皆以為虛也時黃綺雲年十二嵗未知醫往視獨以為疹其父詬之綺雲曰兒聞父言疹為肺胃風熱今兩鼻流涕豈非疹乎已而果然后長遂為明醫是以鼻涕作疹者則早得其要領也一兒疹出紫色喘嗽噦瀉不食用解毒飲挑􅂒法治之而后愈一兒疹出紫色便祕溺澀煩躁悶亂急以大柴胡湯利之而愈一兒疹不易透知為風寒所遏用桂枝湯加葛根麻黃前胡升發之又用厚被裹之再以大劑防風湯熏於牀下而愈此症亦可用芫荽防風湯浴頭靣手足又苧蘸芫荽酒戞之一兒身熱頭疼骨痛咳嗽氣急嘔噦不食乃傷寒而兼山疹也以百祥散十神解毒湯治之愈此症治之小緩疹雖透必變紫黑悶亂喘脹而死一兒疹出腹飽便祕乃內傷所發也以承氣下之而愈一兒疹正出而恣食停滯腹飽便祕壯熱詀語急以大黃瓜蔞枳實厚朴黃連甘草等藥利之而尚喘嗽脈遲肢冷以附子理中湯又歸芍六君湯治之而愈一兒表散后疹出隱隱肌肉間成片又為風寒所鬱渾身青紫煩躁悶亂喘脹欲出不出急用麻黃桂枝湯加葛根以升發之得冷汗微出而愈一兒疹半出壯熱煩躁喘脹悶亂乃出不透而內攻也急以麻黃甘草桔梗前胡葛根荆芥牛蒡枳殼升發之疹出二三畨得盡透而愈一兒疹隱不振頭靣不出靣色青白喘脹悶亂右寸脈微此正氣虛也不能升毒急用麻黃桂枝湯加人參一錢防風芫荽湯浴法治之而愈一兒疹盡出而壯熱祕結喘脹詀語此毒壅猶不盡透也急以黃連瓜蔞枳殼石膏桑皮知母人中黃等藥治之而愈一兒汗出疹透猶喘不止亦邪壅也急以炒黑麻黃加石膏杏仁甘草治之而愈一兒疹時咳嗽喘急用大小無比散五分至一錢即喘定而睡醒后神安此熱從小便而解也一兒仲春出疹用涼藥食生梨寒鬱而沒喘悶靣青肢冷聲啞昏暈急以麻黃湯加葛根柴胡甘草桔梗紫蘇生薑升發之再覆以被取汗而愈一兒疹發不出喘嗽煩躁悶亂繆仲淳用西河栁五錢麥冬三錢五分牛蒡三錢五分蟬退荆芥薄荷知母各一錢竹葉三十片甚者加石膏五錢冬米或三黃治而愈一兒疹雖出而喘反甚乃驟用麻燥烈之藥火甚而肺火熱也宜清金潤肺以甘草桔梗前胡牛蒡杏仁元參知母黃芩花粉治之而愈賀知忍少子疹不透極重其家不知尚以肉飯與之仲淳急以西栁兩許石膏一兩五錢知母五錢元參貝母各三錢竹葉七十片作二劑服而疹盡現遍身皆赤連服四服疹盡出而煩躁猶不止再以石膏三兩知母西河栁各二兩麥冬三兩黃芩黃蘗黃連各五錢竹葉二百片濃煎與服遂定而瘥廣筆記一兒寒月出疹不透喘脹悶亂煩躁用去節麻黃蜜炒酒拌炒一錢葛根木麥冬貝母前胡知母荆芥元參甘草西河栁一服而疹立透隨愈一新婚出疹痰嗽不止咸謂餘毒用清解而痰愈多午后咳甚此隂虛火熾而潮熱也用六味地黃丸料加知母麥冬治之而愈一婦新婚出疹其症如前用六味地黃丸料加當歸治之而愈一孕婦疹不出熱極悶亂喘脹用清熱安胎藥而熱愈甚危劇慮子母難全此懷胎內熱故也法當下其胎則疹熱解而母命可保矣以表散兼墮胎藥治之而愈一孕婦出疹觸動其胎胎墮而去血過多疹雖沒而煩躁喘悶昏絶乃血脫故也當兼益氣用理中湯而蘇又用人參一兩當歸阿膠炮薑荆芥艾葉治之而愈一孕婦出疹小腹痛而漏血此熱甚動胎也以升麻葛根湯加荆芥紫蘇黃芩白术當歸川芎砂仁橘紅阿膠治之血止而安一孕婦出疹熱極墮胎而難産用魚膠三寸燒存性麝香一分共酒服立産遇此症最為難治更有橫生者用魚膠一尺如前治法雖産而子不活一産婦疹不易出熱甚而去血不止乃氣血不足不能逐毒出外也用麻黃葛根湯加人參荆芥白芷當歸阿膠治之而愈一婦疹后輕咳朝涼暮熱靣色少神肌瘦唇赤咸以氣血不足用八珍湯治之細訊其夫知不慎房用六味地黃丸合生脈散與服之又囑其絶欲百日而瘳柴嶼青治候補汪某年二十餘因感時氣出疹過服石膏等劑身熱泄瀉兩耳皆聾絶不思食脈之兩尺微弱舌上乾燥毫無津液本屬隂虧况大寒之劑不但傷陽亦且傷隂用麥冬五錢滋隂以清虛熱陳皮以和胃氣加西河栁一錢以清疹毒次日熱微瀉止舌亦覺潤惟左寸脈微洪加小生地二錢木通一錢菊葉一錢三日熱退思食因是月應選身軟耳聾慮不能過堂掣籖謂已平復十九日當投補劑定可全愈后果如言竟得赴選萬密齋治吳道松四肢病疹或治之三日疹不出煩躁甚欲用荆防敗毒散曰此皆發熱之藥無解毒之用况天大熱又無時令之藥一二味在內則陽愈勝隂愈虧隂陽不和此疹之所以不出也以東垣涼膈散加元參升麻一服疹出三日起甘氏子發熱疹三日不出身涼神倦坐卧不寧此毒不外出毒火內伏也故煩而坐卧不安用升麻葛根湯加麻黃石膏以發之一服疹盡出色白不紅此血虛也用四物湯加防風一服色紅而愈楊氏子疹后痢下解血用當歸稍生地白芍條芩炒黃連炒人參生甘草枳殼烏梅而愈凡出疹利血者此方皆效錢乙診睦親宫中十大王瘡疹云曰瘡疹始終出未有他症不可下但當用平和藥頻與乳食不受風冷可也如瘡疹三日不出或出不快即微發之鼠粘子湯之類如瘡發后不多出即加藥如一日一帖即加至二帖加藥不出即大發之升麻葛根羌活防風獨活麻黃桂枝之類如發后不多及脈平無症即瘡本稀不可更發也有大熱者當利小便小熱者當解毒利小便四聖散之類若不快勿發勿下攻止用抱龍治之瘡若起能食者大黃下一二行即止有大熱者當利小便有小熱者宜解毒若黑紫乾陷者百祥丸下之不黑慎勿下身熱煩躁腹滿而喘大小便澀靣赤悶亂大吐此當利小便不瘥者宜宣風散下之也若五七日痂不焦是內熱氣蒸於皮中故瘡不得焦痂也宜宣風散導之用生犀角磨汁解之使熱不生必著痂也睦親宫十太尉瘡疹衆醫治之王曰疹未出屬何臟腑一醫言胃氣熱一醫言傷寒不退一醫云在母腹中有毒錢氏曰若言胃氣熱何以乍涼乍熱若言母腹中有毒屬何臟也醫曰在脾胃錢氏曰何以驚悸皆無以對錢氏曰夫胎在腹月至六七則已成形食母腹中穢液入兒五臟食至十月即穢液滿胃至生時兒口猶有不潔産母以手拭淨則無疾病俗以黃連汞粉下其邪糞之穢此亦知不潔餘氣入兒臟中本先因微寒又遇風寒邪氣相搏而成痘疹也未出欲作之時熱動五臟則五臟之症先見初欲病時先呵欠煩悶驚悸乍涼乍熱手足冷面腮頰赤燥咳嗽噴嚏者此五臟症俱見也吹呵欠頓悶者肝也時發驚者心也乍涼乍熱手足冷者脾也面赤腮頰咳嗽噴嚏者肺也惟腎無候以在腑下不能食故也凡瘡疹乃五臟毒若出歸一症肝水泡肺膿泡心為斑脾為疹腎雖無症其后惡者瘡變倒靨而黑陷則歸腎也此由不慎風冷而不能食內虛所致也今太尉疹子無他症當用平和藥為治因用抱龍丸數服愈海藏云本先因微寒入一句并由不慎風冷而不能食內虛一句勿認作寒症用抱龍丸即知斑疹多熱也吳橋治姪孫始孩纍日發熱蒸蒸驚搐惛憒衆醫不知所以橋曰麻也寒邪外乘閉而不出是􅈱􅈱爾飲藥已數中氣乃傷藥不足恃也當置沸湯一瓶撤其蓋令保母抱子坐湯側稍逺擁被圍之湯氣自逺薰蒸少飲藥內托麻出而解后汪氏子病如子亦用嚮法並效太函集薛立齋治一小兒患疹作痛發熱煩渴欲服清涼飲下之診其脈不實舉指不數此邪在經絡也不可下遂用解毒防風湯二劑而愈此症小兒多患之須審在表在裡及邪之微甚而治之王海藏曰前人云首尾俱不可下者何也曰首不可下者為斑未見於表下則邪氣不得伸越此脈症有表而無裡故禁首不可下也尾不可下者為斑毒已顯於外內無根蒂大便不實無一切裡症下則斑氣逆陷故禁尾不可下也一兒作癢發熱以消毒犀角飲一劑作吐瀉此邪氣上下俱出也毒自解少頃吐瀉俱止其症果消吐瀉后脈見七至此小兒和平之脈也邪已盡矣不須治果愈潔古云癍疹之病其為症各異發焮腫於外者屬少陽三焦相火也謂之斑小紅靨行皮膚之中不出者屬少隂君火也謂之疹凡顯斑症若自吐瀉者慎勿亂治而多吉謂邪火上下皆出也斑疹並出小兒難禁是以别生他症也首尾不可下大抵安裡之藥多發表之藥少祕則微疏之令邪氣不壅併令其次第出使兒易見也身溫暖者順身涼者逆沈明生治沈翰臣婦咳嗽發熱或認為不足遽用六味地黃湯以滋隂分既而咳逆更劇疹之脈浮且數風熱干乎肺家宜用疏表之劑服下遍身發出紅疹二劑嗽差緩而猶未透更用辛涼等味以清表熱忽復作瀉不已咸歸咎寒涼沈笑曰非也肺受風邪邪變為熱經云邪并於陽則陽熱而隂虛始則疹在欲出未出之際火上炎於手太陽而作嗽今則疹在欲收未收之時熱下移於手陽明而作瀉是亦斑疹家常候曷足怪乎行且止矣果越兩日而嗽寧瀉止身涼疹退按斑疹之候雖異斑疹之治略同是嵗丁未濕土司天而春夏之交燥旱殊甚蓋猶襲夫昨嵗燥金在泉之餘氣耳是以初當涼解而不利乎溫散次當寒潤而不宜於溫補六味地黃丸之屬雖若相宜然質濁味厚不惟不能逹表抑且錮蔽外邪施諸疹退而餘熱未清之時稍為近理今初熱始嗽驟然用之是非滋隂乃滋害也況以丸為湯已非古人本意而専投泛用尤乖病變之機自來善用六味者無若薛立齋假使九原可作視近日之湯法盛行能無掩口胡盧哉續名醫類案卷四十二
