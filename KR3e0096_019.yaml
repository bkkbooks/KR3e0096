body:
  text: 續名醫類案卷十九錢塘魏之琇撰諸氣鄧安人年五十忽然氣痛投神保丸愈不一二日再痛再服神保丸六七十粒大腑不通其痰轉甚亦有要用沈香木香薑桂等藥而未敢投痛甚則築心築背築定兩脅似有兩柴十字插定心脅呌聲徹天召良甫診之六脉沈伏乍來乍去衆問疹脉吉凶何如答曰凡久痛之脉不可凖也但以症辨用藥觀其人質肥偉問其脉數日不通曰實痛也其腹必脹但以人按之痛甚手不可向近此大實也經曰大滿大實者可下之用替針丸五六百粒是夜即愈俱醫說續編羅謙甫治趙運使夫人年五十八嵗于至元甲戌三月中病臍腹冷疼相引脅下痛不可忍反復悶亂不得安卧以當歸四逆湯主之炙中庭穴同上朱丹溪治一婦氣自小腹丹田冲上遂吐清水火氣上逆由丹田虛寒故也用白术二兩白豆䓻五錢為末早飯後以白湯送下白术補脾豆䓻溫肺此藥服之則金水相生其病自愈若在男子純隂無陽則為不治之症矣陳三農治一人怒氣感寒小腹有塊氣送上行喘息不安衆用散氣降氣藥益甚曰此因汗下過多傷其胃氣胃虛為衝脉所逆并脅下少陽脉二道而反行病多厥逆以調中益氣湯加炒黃柏炒青皮一劑而愈一老人大怒氣自臍下上攻兩脅作痛喘息不卧此動厥陽之火也兩脅肝膽部分怒氣傷肝而動龍雷之火故逆上作痛耳用伏龍湯下左金丸愈一貴人患氣從小腹上攻胸脅頭項遍身急脹而痛諸治罔效曰此督脉為病也經曰督脉為病令人逆氣而裏急以四物加炒黑黃柏醋炒青皮一劑而愈朱丹溪治鄭仲遊年二十三膈有一㸃相引痛吸氣皮覺急滑石枳殼炒各一兩桃仁黃連炒各半兩炙甘草二錢為末每一錢半以蘿蔔自然汁研煎熟飲之一日三五次作淤血治鄭仲本年二十七因喫熱補藥又妄自學吐納以致氣亂血熱嗽血消瘦遂與行倒倉法今嗽血消瘦已除因喫炒豆米膈間有一㸃氣梗痛似有一條絲垂映在腰與小腹亦痛大率偏在左邉此肝部有惡血行未盡也滑石枳殼一兩柴胡黃連五分桃仁二兩黃丹三錢生甘草二錢紅花一錢服法同前繆仲淳治髙存之壻浦生氣上逆每飯下一二口輒噯氣數十口再飯再噯食頃三四作曰此氣不歸元中焦不運也每劑須人參二錢不信服快氣藥愈甚逾二三月曰今須參四錢矣不信又逾二三月曰今須六錢矣不信又逾月飲食不下每嘔冷氣如團而出上下氣不屬分必死存之坐其家迫令繆藥服首不動再煎不動然亦不如他湯藥輒嘔也服三劑忽心口下如爆一聲上則噯氣下則小遺無算上下洞然即索粥頓食三四碗不上逆矣服五六劑减參二錢噯逆復作仍用六錢而安一月後方减參二錢服半年全愈人參六錢麥冬三錢五味二錢橘紅一錢砂仁一錢白芍二錢沉香五分益智仁一錢五分萸肉三錢蘇子二錢枇杷葉三大片水煎臨服加沉香汁十五匙逆水蘆根汁一大盞又十倍為末山藥糊為丸空心白湯吞廣筆記梁溪一婦人喉間如一物上下作挭前後板痛服仲淳方二十劑愈降香通草蘇子橘紅枇杷葉人參炙草石菖蒲麥冬甘菊白芍逺志白豆仁木瓜石斛加蘆根汁一鍾同煎八分入姜汁二匙同上哮丹溪治一人哮十日一發此病在上焦不得汗泄正當十月遂以麻黃黃芩各二錢入姜汁煎服臨卧進小胃丹二十粒而安聖濟治一人飲醋嗆喉喘哮不止用粉甘草二兩去皮破開以猪膽六七枚取汁浸三日炙乾為末蜜丸清茶下三四十丸漸愈王宇泰治一人鹽哮用白麵二錢沙糖搜和以糖餅灰汁揑作餅子放在爐內熯乾剗出切作四塊以輕粉四錢另炒糝在餅內食之吐痰而愈以上俱大還龔子才治一人哮喘十數年發則上氣喘促咳嗽吐痰自汗四肢厥冷六脉沉細此氣虛脾弱與六君子加黃茋五味二冬杏仁薑棗煎服而愈一人自幼患哮喘之症每遇寒即發發則喘急咳喘痰涎上涌久不瘥已成痼疾與甘桔芩連瓜蔞貝母二冬清肺合六味補腎為方名清上補下丸服一料全愈孫文垣治查少川夙有哮喘疾每發則遍身如燎上氣短促喉中痰聲響若湯沸每經七晝夜汗出漸愈七日來復之義居恆嗜飲縱欲不避風寒有教以石膏麻黃杏仁枳殼細茶各一兩作大劑飲之名曰五虎湯喘至即以此禦之隨飲而止屢發屢進應若桴鼓凡三年飲五虎無算因而腹大如覆箕兩腿光腫如柱內外臁瘡清水不竭腥氣逼人不能伏枕者五閲月診時長至後一日也氣髙而喘身熱而煩覆以棉被足納火箱環列火盆絨帽貂套束之以帕鼻亦絨套籠之坐重幔中猶凛凛畏寒今已十日其脉浮大無力其色白中隱青蓋舊病由于氣虛中滿新病由寒在表而然合先散之以紫蘇馬蹄辛甘草防風白豆仁蒼术陳皮人參羌活生薑一帖得微汗畏寒之狀已去獨鼻尚寒用防風黃茋二兩煎湯令熏其鼻飯頃而止日凡三熏次日亦愈嘔惡不止用人參溫脾湯加丁香進之一帖旋已因欲利水自食鯉魚數斤夜脹極以平胃散入橄㰖肉一兩能解魚毒兩劑而定獨腹脹小水不利不能伏枕為苦以附子理中湯加砂仁補骨脂赤小豆桂心連進四劑小水略長繼以尊重丸日三服之每服五丸五日後小水通利可以卧矣守此調理脹消而平李士材治顧文學十年哮喘百藥無功診其兩寸數而澀曰澀者痰火風寒久久盤据根深蒂固矣須補養月餘行吐下之法半年之間凡吐下十次服補劑百餘遂愈更以補益氣為丸加雞子秋石服年許永不再發施沛然治阮二華室患哮喘過用凉劑痰上壅面目浮黃而腫每昏暈則形靜若死蘇則齁䶎之聲聞于外庭醫者望而却走診其六脉沈滑而弱兼緊病得之冬傷于寒經云形寒飲則傷肺古人治此病必用麻黃輕清辛散之劑若投以寒凉則邪氣蔽痼而不得泄痰日膠結上焦之氣壅而不宣乃用通關散涌其痰涎凡三涌而痰氣始清喘息始定後以三拗湯兼導痰湯出入調理月餘而安錢國賔治金陵青襟趙灔澦母年六旬得痰症晝夜吼鋸嘔痰數碗初尚能行後漸不起幸胃不病飲食如常多醫罔效脉之六部浮滑右寸關更甚浮主肺氣虛弱滑主脾經積痰乃痰吼症也用導痰加杏仁麻黃草劑病勢不减辭去又更二醫反重復求治曰吾技盡矣容思之忽悟吼痰屬太隂肺經之症肺乃清虛之藏六葉兩耳四垂如蓋今膠痰固于肺縫中呼吸而作吼鋸之聲且胃主納受脾主運化今胃納而脾不運停飲作痰涌出非劫劑不可也以三白丸方示彼用白砒三分煅黃貝母桔梗各三分搗飯為丸黍米大以冷茶睡下七丸七服痰止吼定服理脾清肺藥痊大抵病危至此不用客劫之味弗知此七方十劑之意者也古人學力深今人學力淺再思能用狼虎劫奪之劑學力方到若迎奪劫伏神兵竒正當並用也奚王道可以盡岐黃之伎哉如果見真劫劑亦不妨暫用也喘金陵一鋪治哮喘白果定喘湯服之無不效者其人以此起家方用白果二十一個炒黃麻黃三錢蘇子二錢欵冬花法製半夏桑白皮蜜炙各二錢杏仁去皮尖黃芩微炒各一錢半甘草一錢水三鍾煎二鍾隨時分作二服不用薑攝生方目本草綱琇按此方惟風寒外感者宜用若上盛下虛氣不歸元者服之立斃如不問虛實盡行與之雖起家而殺人多矣然今之時師執方遇病謬為知脉其人亦未必不起家而其罪則加等矣瀘東治一人九月間病發熱惡寒喘急脉洪大而似實衆作傷寒治勿效此火甚之脉非真實也止視其短氣不足以息即當作虛治以補中益氣湯加麥冬五味子熟附子三分六劑愈亦有痰食阻滯而聲微脉促者與虛症相似不可不審也陳三農治一人每勞或怒即喘急吐痰不卧衆以降火化痰理氣清肺之劑不效脉浮數而虛澀此隂虛火動其痰也用補隂平肺飲下咽喘即定而愈同上薛立齊治一婦人傷風寒作喘或用表散愈而復患仍用前藥其症益甚飲食少思胸腹不利此因脾肺氣虛也先用六君子湯加桔梗漸愈又用補中益氣湯全愈侍御談希曽喘咳吐痰或手足時冷此中氣虛寒用補中益氣炮薑而愈一婦人患前症屬命門火虛不能生脾土用補中益氣湯八味丸而痊後復患其喘益甚用前藥不應遂用黑錫丹二服喘止仍用前二藥而諸症痊凡屬邪氣有餘者其症易識治效亦速其屬元氣不足者變症不一效非可以旦夕期也定西侯蔣公患上氣喘急其脉寸口洪滑此痰滯胸膈也令先服稀涎散二錢更以熱水頻頻飲之用代探法殊妙則溢而吐其痰如膠內有一長條裏韭葉一根遂愈一路姓者年近五十身體肥大飲食倍常病月餘每行動即喘診之六脉微澀曰此死症也衆謂妄後逾月果卒孫文垣治程菊泉暑月患喘嗽咳咳連聲濃痰滚滚行動則喘促不寧夜分口渴胸膈脹悶脉兩寸滑而數兩關弦此肺有宿痰膽有鬱火經云火鬱發之又風寒外束者可發用蘇子半夏麯杏仁各一錢石膏二錢欵冬花桑皮各八分桔梗枳殼各五分麻黃三分病不减改以杏仁陳皮人參貝母欵冬花麥冬各七分苡仁一錢五分桔梗知母各五分五味子十粒桑皮一錢陳皮六分痰减半胸膈未舒口乾腳熱前方减去欵冬五味加枳殼葶藶兩帖全愈陸祖愚治唐鳴和平時有火症因試事成痰火咳嗽日夜吐黃痰二三碗氣逆喘急飲食不進服枳梗二陳尤甚改服參术幾危脉之兩寸俱洪滑而數乃用茯苓桑皮貝母芩連花粉元參枳殼加牛黃竹瀝二三劑胸寬氣緩七八劑痰乃白色去牛黃三十餘劑而安黃履素曰豫家有庖丁王姓生平多欲年四十患腳痛往針豫謂此足三隂虛針無益也數年後患痰喘胸中痛晝夜不眠豫謂此腎虛氣不歸元峻補其下則氣自降適名醫陳月坡來診其持論與豫略同奈病者服陳藥嫌其作悶别尋粗工治之大服降氣寬中之劑服後覺寬寬後復發病者尚以暫寬為效信服之以至于死良可歎也大凡此等病服藥初覺悶久當漸寬漸愈愚者嫌悶而别求寬藥死者比比而是醫者病家兩宜熟悉如脾虛者亦然初服术必作悶久則自寬破氣消導之藥服之覺寬久乃愈悶以至不救病者不可不知李士材治一人發熱乾咳呼吸喘急始用蘇子降氣不應乃服八味丸喘益急診之見其兩顴俱赤六脈數大此肺肝藴熱也以逍遙散用牡丹皮一兩苡仁五錢蘭葉三錢連進兩劑喘吸頓止以地黃丸料用麥冬五味煎膏及龜膠為丸至十日而康朱太學喘急多痰可以坐不可以卧可以俯不可以仰惶急求治李曰兩尺獨大而軟為上盛下虛遂以地黃丸一兩用桔梗三錢枳殼二錢甘草一錢半夏一錢煎湯送下不數劑而安黃給諌中氣大虛發熱自汗喘急診之脉大而數按之如無此內有真寒外見假熱當以理中湯冷飲舉家無主不能信從惟用清熱化痰之劑遂致不起葉方伯夫人喘急痞悶肌膚如灼汗出如洗目不得瞑診之六脉皆空所謂汗出如油喘而不休絶症見矣辭不治三日而歿宋氏女中氣素虛食少神倦春初忽然喘急悶絶不知人手足俱冷咸謂斃矣李曰氣虛極而不清肅不能下行非大劑溫補决無生理遂以人參一兩乾薑三錢熟附子三錢白术五錢藥服而蘇後服人參七斤餘薑附各二斤遂全愈孫氏女久嗽而喘凡順氣化痰清金降火之劑幾于遍嘗絶不見效一日喘甚煩躁李視其目則脹出鼻則鼓扇脉則浮而且大肺脹無疑矣遂以越婢加半夏湯投之一劑而减再劑而愈曰今雖愈未可恃也當以參术補之助養金氣使清肅下行竟因循月許終不補再發遂不救藥矣馮楚瞻治司文選素患痰喘發則飲食不進旦夕不寐調數月不效脉之兩寸少洪餘皆沉弱其右關尺微細更甚乃命門之火衰極無根虛陽上浮且服尅削脾元虧損致痰涎益甚虛氣愈逆以炒黃白术八錢固中氣為君炒燥麥冬三錢清肺引氣降下為臣炮薑二錢溫中導火牛膝二錢下趨接引五味子一錢斂納收藏並以為佐製附子一錢五分承上藥力直達丹田為使如是數劑痰退喘止食進神强久服八味丸不再發吳孚先治趙太學患水氣咳嗽而喘誤作傷風概投風藥面目盡腫喘逆愈甚曰風起則水涌藥之誤也以真武湯溫中鎮水諸症悉平李成槐之室驀地氣喘呼吸促急提不能升咽不能降氣道噎塞勢甚危或作痰逆氣滯欲用牛黃蘇合二丸不敢遽服脉之兩尺微細無神此肝腎虧損子午不交氣脫症也用人參一兩熟地二兩當歸五錢甘草二錢一帖稍定二帖喘平凡氣短似喘人謂其病在上不知元海無根病實在下也誤治立危豫遇此等症重投熟地無力之家不能備參者以棗仁一兩枸杞子一兩代之亦應如桴鼓張飛疇治韓順溪內子患喘症月餘服破氣寬胸豁痰清火等藥不效發表利水亦不應其痰轉急稍動則喘難以休息診之六脉細數而面赤戴陽用大劑六味地黃丸作湯加青鉛兩許一服而緩三服而安柴嶼青治程别駕尊人髙年忽患痰喘不進飲食診其脉有根决無意外事用四磨湯內加人參一兩一服而愈王觀察在太史時方酷暑令媳面紅唇燥發喘不止足冷至胯危甚兩脉鼓指按之微細必過服苦寒所致詢之果然曰此戴陽症也內真寒而外假實急以人參三錢熟附子一錢五分投之喘定又加肉桂一錢五分半夜尚發躁煩足冷未愈遂以六味湯內加桂附各一錢五分六劑並煎冰冷頻頻飲之而愈少宗伯鄒小山春月患喘咳吐痰甚劇延診視按其諸脉和平惟肺部沉洪明有伏邪此小疾也緣醫謂風寒凝結用桂溫散徹夜不寐憊甚不支遂用清理藥劑而愈張三錫云綱目載一男子五十餘病傷寒咳嗽喉中聲如齁與獨柴湯一服而鼾聲除至二三帖咳嗽亦漸退服二三斤病始痊不佞亦屢用有驗但可與知者道耳今人因右寸脉大不知分别有力無力遽認為實枳桔桑杏芩栀妄投死亦不悔者多矣薛立齊治一儒者體肥仲夏患痰喘用二陳芩連桔梗痰喘益甚加桑皮杏仁瓜蔞盜汗氣促加貝母枳殼不時發熱飲食漸减脉大而無力以為脾肺虛寒用八味地黃丸以補土母用補中益氣湯以接中氣而愈一婦人早間吐痰甚多夜間喘急不寐夫早間多痰乃脾虛飲食所化夜間喘急乃肺虛隂火上衝用補中益氣加麥冬五味而愈王叔權治一貴人久患喘夜卧不得而起行夏月亦衣夾背心知是膏肓病也令炙膏肓而愈亦有暴喘者知是痰為梗令細銼厚朴七八錢重以薑七片水二碗煎七分服滓再煎服不過數服愈若不因痰而喘者當炙肺俞凡有喘與哮者為按肺俞無不痠疼皆為繆刺肺俞又令灸而愈亦有只繆刺不灸而愈者此病有淺深也舍弟登山為雨所摶一夕氣悶幾不救見昆季必泣有欲别之意疑其心悲為刺百㑹不效按其肺俞云疼如錐刺以火針微刺之即愈因此與人治哮喘只謬刺肺俞不刺他穴惟按肺俞痠疼者然後㸃其他穴非是並資生經滁陽髙司法名申之每苦寒喘痰發甚時非此藥不能治方名五味子湯用橘皮三兩去白甘草一兩半炙麻黃四兩去根節五味子二兩杏仁二兩麩炒去皮尖右為粗末水一盞半藥末二大錢煎至七分去渣通口服不拘時候如喘甚加藥末入馬兜鈴桑白皮同煎夏月减麻黃一兩醫方集成醫說編陳三農治一人極言痰氣作楚喘急而不能食遍體作痛服清氣化痰藥無異服水何也曰豈止無益反受害矣肥人氣居于表中氣必虛脾弱不能勝濕氣虛不能健運是以多痰而喘以四君子加南星半夏佐以薑汁數劑而愈劉㸃生治汪去塵脾虛水逆傷肺喘嗽不食小水不通脈虛不勝補㵼用茯苓五錢澤㵼橘紅各一錢五分防風肉桂熟附各五分二服水去後加人參調理而安張氏醫通薛立齊治職方王用之喘嗽作渴面赤鼻乾為脾胃有痰用二陳加芩連山栀桔梗麥冬而愈一武職體魁梧素不圍爐不喜熱食行則喘促自謂氣實老痰服碑記丸攻伐之又名黑丸子診其脈洪數重按全無謂命門火衰脾肺虛寒與八味丸一服痰喘稍止數服全止遂能親火喜熱飲食蓋碑記丸出自西域况方外人所製者經云西域水土剛强其民不衣而褐薦其民華色而脂肥故邪不能傷其形體其病生于內其治宜毒藥由此觀恐不可概用也太守錢東墟先患肩疽屬足三隂虛火不歸元用壯水之主以制陽光而愈曰瘡疾雖愈當屏去侍女恐相火一動其精暗流金水復竭必致變症後果咳嗽痰出如涌面目赤色小便淋澀又誤認為外感風寒用麻黃湯表散汗出不止迎視其脈已脫惟太冲未絶曰此脾虛不能攝涎腎虛不能生水肺虛不能攝氣水泛為痰虛極之症也辭為難治勉以益火之源以消隂翳而愈繼又勞傷神思外邪乘之仍汗出亡陽以致不起朱丹溪治七三嬸喘遇冬則發此寒包熱也解表則熱自除枳殼三錢炒麻黃防風黃芩桔梗各二錢木通一錢半通利九竅治肺壅甚當紫蘇五葉分四帖煎取小半盞飲之薛立齊治一男咳嗽脈緊數以小青龍一劑表症已解更以葶藶大棗湯喘止乃以桔梗湯愈馬元儀治朱千秋患喘嗽自夏及秋羣治不愈自謂已成隂虛曰隂虛者宜補隂以制火陽虛者宜補氣散邪今兩脈浮濡浮為虛風濡為氣弱病在陽而補隂故邪留而不愈也不信又一月食减喘增寒熱自汗身重不能轉側復求治其脈空大急疾此中氣大虧虛陽不外固治法先固衛外之陽次補內守之隂則真氣內振而虛風可熄矣遂與大劑玉屏風散加貝母杏仁蘇子桔梗一劑而脈症漸和再加人參三錢二劑諸症漸平惟咳嗽未已以六味湯加人參調理一月全安顧芝巖夫人喘嗽半載卧不著枕舌燥無津屢治不應診之右關尺虛澀無神此標在肺而本在腎也肺為出氣之路腎為納氣之府今腎氣虧乏吸不歸根三焦之氣出多入少所以氣聚于上而為喘嗽口乾不得安卧中藏經云隂病不能吸者此也法當清氣于上納氣于下使肺得其清肅腎復其蟄藏則氣自納而喘嗽平矣用蘇子降氣湯加人參五錢肉桂一錢連進三劑症漸平改用金匱腎氣湯加人參五錢二十餘劑可以安枕後因補護失宜前症復作乃委之庸手純用破氣鎮逆之劑極詆人參為不可用病者自覺不支求少參不與遂氣敗而死傷哉邱友痰喘發熱口渴胸滿身如被杖時惡寒或與嘔風化痰不效診之弦數且澀此情志鬱結而肺燥也今之醫者但知散風清熱治痰風劑則辛寒劑則苦痰劑則燥辛能耗液苦能傷氣燥能動火是適助長而已今欲治痰必先清風清氣必先滋燥使氣得清肅下行又何痰喘之有哉用萎仁半麯枳殼秦芁杏仁蘇子少加柴胡桂枝二劑症减半再加生首烏以滋隂燥大便通而全愈繆仲淳治臧儀部靜涵患氣喘自汗晝夜不眠食諸醫以外感治之繆診之曰此腎虛氣不歸元故火上浮喘汗交作脾虛故不思食亟以麥冬五味枸杞滋隂斂肺以蘇子橘紅降氣消痰以白芍棗仁茯苓補脾斂汗不數劑而愈葉都督患痰喘諸醫作胃虛治之不愈後以導水丸利五六次而安平治㑹萃薛氏書蔣仲芳曰周忠介夫人年六十餘患痰喘五六年醫藥無效士材先生診之曰右寸浮洪肺有實邪須用麻黃石膏半夏防風細茶生薑等件藥雖峻而病當之無畏也投之果愈但麻黃只可用二三分服後兼須避風耳吳橋治程參軍汶年近耆故病痰喘秋冬遞作春夏浸平頃歸自留都痰喘如昔一醫以為熱也劑以石膏再服而痰喘不除加以泄㵼一醫以為攻損而虛也則以人參峻補一服而痰喘大作喉壅塞不能言瞑而惛惛橋至診之寸口浮大弦數搏指然不任按病得之鬱怒而傷肝氣法當緩治而二醫以燥急乘之故甚脈雖九死猶可覬一生乃以導痰湯為劑加芩連麥冬一服而唾結痰有間稍寤未盡二服結痰越出喉吻間不能唾則簮入口而衡引之纍纍連綿去如敗絮者盈二缶喘乃少定瞑而惛惛如前偃卧如尸七日乃寤寤則呻吟出息目微開始進勺飲間日一劑踰月而安或以參軍方趙簡子云太函集劉清江曰先君嘗施喘藥蓋用麻黃三兩不去根節湯浴過訶子二兩去核用肉二味為塵末每服三大匙水二盞煎减一半入臘茶一錢再煎作八分熱服無不驗者後于彭子夀侍郎傳一方用新羅參一兩作細末以生雞子清和為丸如梧子大陰乾每服百粒溫臘茶清下一服立止嘗見知臨江葉守端向言其祖石林病此專服大黃而愈其尊人亦苦此疾乃純用附子至某則非麻黃不可然則又觀其所禀如何且自謂其女幼年已喘傳至四世而用藥皆不同劉昌詩字興伯號清江蘆浦筆記朱武章年三十八客姚江仲冬左額患疔七八日微喘疔潰後大喘疔愈喘甚坐不能卧醫與降氣清金不效已二旬歸而渡江比到岸兩腳赤腫如燈籠不能扱履矣舁負至家一月間更七醫其寬胸者重投厚朴㵼肺者峻用葶藶有謂表邪未清者有謂腳氣上攻者有謂水腫入腹者有謂疔毒入肺者雜治腫漸及囊一醫謂虛也與八味反增讝語診之兩關糢糊左尺不應餘部微數而洪面有紅光倚息不寐小便濃濁掌心熱炙臀起映瘡以久坐也其舌左邉赤紫四沿凸凹而左為甚鼻孔乾燥能俯不能仰曰此肝腎大傷之候初時之疔亦肝火熾甚而作治得其宜數劑可愈朴藶既非桂附亦誤今兼治藥必三十劑乃可與生熟地天麥冬沙參枸杞子蔞仁米仁四劑腫漸消讝亦止十劑便清腫退可卧矣唯仰卧及側向右則喘嗽丁寧又十劑已能應酬賔客但卧仍宜向左乃加熟地至一兩入五味三分蛤蚧一具一劑而安四劑全愈吳性全幼即病喘兒醫與枳桔橘半桑杏前蘇之屬傷其肺氣遂成痼疾每發必沉綿牀第淹旬浹月年十七余診之令服重劑肝腎藥加沙參蔞仁麥冬之類自是發漸輕或數月一次仍以前方加减不過數劑即霍然近則終年亦罕作余治喘多矣多以此法取效蓋虛喘者十之九實喘者十之一也金太孺人四旬之外病喘以攻伐之過坐致痼疾已近七旬忽一醫與三子湯加葶藶服下脅痛厥逆欲脫余以大劑杞子地黃入川楝一枚得瘳蘭亭其四君也亦病喘面色㿠白發必數日卧牀與以滋水生肝養金之劑後發漸少而輕自言得狗寶服之而愈此症凡遇面夭白皮急痰腥穢而小便㸃滴者不可治蓋症非肺癰而肺葉壞也肺為水源既敗則小便必少耳張司閽年六十餘嗜飲病喘吐痰無算動則齁䶎臺肩倚息或與杏仁枳殼蘇子前胡之類十餘劑喘益甚枯瘠如鬼辭不治矣余與二地二冬米仁蔞仁沙參杞子枳椇子女貞子等八劑全愈戒其勿飲初稍節久仍縱恣年餘復作左脈如按琴瑟弦此真臟見也不與藥月餘而沒厄逆朱丹溪治紹越陳氏二十餘嵗因飽後奔走數里遂患噦病但食物連噦百餘聲半日不止飲酒與湯則不作至晚發熱如此者二月脈澀數以血入氣中治之用桃仁承氣湯加紅花煎服下汚血數次即减再用木香和中丸加丁香服之十日而愈一人病後厄逆不止聲聞鄰家或令取刀豆子燒存性白湯調服二錢即瘥蓋取其下氣歸元而逆自止也本草綱目邃巖治一人傷寒陽明內實地道不通發厄其脈長而實以大承氣湯下之而愈一人傷寒七日熱退而厄聲不絶六脈沈細無力倦甚以補中益氣湯加附子日進三服而安一人酒色過傷醫作外感治發汗過多絶食日久致氣血兩虛相火冲上厄逆五六日不止治以半夏黃連以㵼逆氣歸芍生地知母以養隂炒柏以㵼冲火二三劑而愈陳三農治一人患溫熱病十餘日身熱面紅舌燥黑咳逆日夜不止者三日衆醫以脈遲無力欲用丁附回陽熱劑陳以手按其胸腹痛不可近曰脈微遲非元氣虛由邪熱內實壅滯其脈而然也用解毒承氣湯入甘遂末三分下咽而躁熱片時去黑糞三四升熱退厄止而安一人患溫熱病大便不通用下藥糞去而厄大作衆尤下藥之過曰此燥糞在腸胃遏氣于下糞去而鬱氣暴升故奔迫而作厄耳以枳殼飲之而安一人厄逆連聲脈來有力因相爭肝木受邪自思金能尅木用鐵二斤燒紅水淬飲之即愈一婦患時疫飲水過多心下堅痞咳逆倚息短氣不卧湯藥不下諸藥無效作停飲治之進以五苓散一劑而安以上皆大還盧不逺治陳孟抒室人因怒發厄三日夜召診以來遲意甚不懌脈之曰固來遲然效極速果一劑而愈此蓋肝鬱盛怒弗暢氣將入胃而不能故發厄今不治厄用柴胡等條達木鬱鬱解即止暴病氣全故易愈也吳孚先治袁氏女陡發厄症有用丁香柿蒂者有補之㵼之者有灸之者俱不效乃與柴胡桔梗等味開提之不三劑而愈良由鬱怒肝木不舒上乘于胃故作厄經曰木鬱則達之此之謂也喻嘉言治王岵翁素有脾約症得潤劑即解冬盡偶飽食當風而吐胃氣大傷微發熱左關脈甚大自云中脘不舒氣覺攻左初飲梨汁不投今服蔗汁稍定喻曰此虛風之候也以胃中空虛若谷風自內生左投肝木而從其類是以氣攻左而左脈即為之大且徑經云風淫于內治以甘寒梨蔗皆甘寒而一效一不效者乃胃中氣虛極不奈梨性之達下而喜蔗性之和中也遂以甘寒定方人參竹瀝麥冬生地之屬衆議除參不用服後腹內呱呱有聲嘔出黃痰少許胸中遂快次早大便亦通症以平安然本胃經受病而胃脈反和惟心腎肝肺之脈不安其故口中味淡湯飲不肯下行此中央氣弱不能四迄轉達也宜急用四君子湯理胃氣不信别召二醫一謂中風一謂傷寒微用表劑即汗出沾濡氣髙神蕩厄逆不休矣再投黃連一劑則脈亂如沸羮頻轉頻歇神昏身强年夀黑滯氣出順而入必噦晝夜萬三千五百息即噦亦如之二醫卸禍謂喻前議四君子湯今始可用喻曰氣已出而不入再加參术之膩阻立斷矣惟仲景旋覆代赭一方可收神功于百一進一劑而噦勢稍减二劑加代赭至五錢噦遂大减連連進粥神清色亮脈復體輕再用參苓麥冬木瓜甘草平調二日康復如初張三錫治一老人內傷飲食消導未减或悮與潤腸丸二服下清水脹痛轉甚或復投巴豆丸二服致厄逆不止用大劑六君子湯二帖至五帖全止補養而愈一老人深秋患痢發厄逆嘔吐黃柏炒燥研末陳米飯為丸小菀豆大每服三十丸人參白术茯苓三味濃煎湯下連服三劑即愈切不可下丁香等熱藥陳良甫治一人痢疾厄逆不止六脈沈弱諸醫藥灼艾皆無效乃投退隂散兩服愈又嘗治許主簿痢疾咳逆不止諸藥無效灸期門穴不三壯而愈良方王叔權治一男子忽氣出不絶聲病數日矣以手按其亶中而應微以冷針頻頻刺之而愈初不之灸何其神也資生經陳霞山治一人咳逆上氣體重氣短脹滿坐不得卧常作水雞聲用白前湯白前二兩紫菀半夏各三兩大㦸一兩水一斗煮三升分三服水腫大實之治薛立齊治一婦人痢後嘔噦即厄逆也服降火化痰等劑愈甚脈洪大按之虛細作渴飲湯諸藥到口即嘔此脾胃虛寒不能司納以參术炮薑末各一錢以飯作丸米飲不時送三五粒至三兩許聞藥不嘔乃以六君加炮薑三十餘劑而安一婦人患症同前飲食少思胸腹膨脹大便不實所見之症悉屬虛寒假實遂朝用補中益氣湯加炮薑木香夕用六君子湯送四神丸漸愈又用八味丸料煎送四神丸而痊一婦人因怒嘔噦時或昏憒口噤或時舉體內動其面色或青或赤此肝火熾甚脾土受侮用小柴胡湯加山梔鈎藤治之漸愈又用加味歸脾逍遙二藥調理而痊繆仲淳治髙存之鄰人賣腐者傷寒微噦兩日夜不省人事其子乞方問之曰汝父當時曽頭身熱乎曰然曰曽服汗藥乎曰未也曽吐下乎曰未也因索傷寒書撿之其方類用乾薑柿蒂丁香及附子等溫熱之藥撿方云云者蓋示人以病係陽明熱嘔以上諸藥均不可用非臨陳看兵書也末條僅載白虎湯一方繆思之曰傷寒頭痛口渴身熱本屬陽明熱邪傳裏故身凉發噦傳裏身凉亦是金針未經汗吐下邪何從而出但其人年老多作勞故于白虎湯中加人參三錢二劑立起馬元儀治葛懷年六旬外下痢厄逆兩足徹冷或以痢治之轉劇診之兩脈虛微此中氣挾寒下痢當大劑溫補以恢復元氣時有言下痢多由濕熱在胃不行清理而反溫補恐未合曰濕熱傷者其脈必實其腹結痛且無厄逆足冷之症此由年髙氣弱火衰於下氣虛于中因之升降失常而輸泄無度溫補非治痢也陽回則痢自止耳若必俟痢止而後補之晚矣遂與人參四兩合附桂理中湯連投四大劑而瘥陸聖修年逾六旬厄逆泄瀉面赤如赭足冷如氷兩脈沈微曰人身之中賴元氣以充養今因泄瀉而氣衰于下復因厄逆而氣傷於上上下交征年髙氣弱何以當此所幸者猶未喘與汗尚可挽也與附子理中湯大培火土加丁香以暖胃止厄蓋一法而升降之道備焉降者以腎中陽旺則氣不上僣而下收崇土之功升者以脾中陽旺則氣不下陷而中守其運行之職則飲食自然變化精液而泄瀉安有不愈者乎朱氏子未第時患腹脹食少倦怠自汗厄逆口乾脈之左得弦急右見虛微此中虛肝盛得之煩勞且怒也煩勞則陽氣分馳而脾胃損鬱怒則肝木橫肆而脾胃傷由是汗出不止脾虛而腠理不固也口中乾燥者脾虛而精液不升也腹脹者氣虛而傳化失常也食少者胃陽不化健運失職也厄逆者五陽不布隂氣用事也當用附桂理中湯大培中土土旺則不受制于木且能生肺以制木也服四劑脈漸起脹漸平因停藥數日脹如故與大劑桂附理中湯少加沈香以和胃氣而行肝氣調理一月而安病本多頃因厄入逆為病之最故老僕王忠婦嘔逆厄氣幾無寧刻脈之右寸獨大餘脈虛微此中州土敗水氣不行五陽不布濁隂上逆也與五苓散一劑服後一時許吐逆頓止再與附桂理中湯連服之明日兩脈向和厄逆亦止微覺倦怠與加桂理中湯四五劑而安張意田治董友之母年將七旬病已八日脉之軟緩而遲滯發熱日晡益甚舌胎黃厚大便不行便知非丁香柿蒂症畏寒厄逆閲諸方咸以老年正氣用丁香柿蒂與補隂之劑夫脉來遲滯畏寒陽邪入裏也舌胎黃厚日晡熱盛陽明實也此乃表症未解而陷裏之勢急致氣機逆窒而發厄法當下之毋以年髙為慮也與小承氣服後大便轉矢氣兼有心煩大不寧之狀再與一劑臨晚下黑屎數枚二更戰栗壯熱四更大汗天明又便黑矢然後厄止神清而睡此實症之厄也宜審之朱丹溪治一中年婦人病噦以四物湯加和白陳皮留尖桃仁生甘草酒紅花濃煎入驢尿飲以防其或生蟲也與數十帖而厄逆除矣婁全善治其兄九月得滯下每夜五十餘行嘔逆食不下五六日後加厄逆與丁香一粒噙之立止但少時又至遂用黃連㵼心湯加竹瀝引之厄雖少止滯下未安若此者十餘日痢久故可用澀遂空心用御米殼些少澀其滑日間用參术陳皮之類補其虛自服御米殼之後厄聲漸輕滯下亦收而安沈明生治唐玉如夏間患血淋數日淋止發厄舉體振動聲大且長或與開胃消痰益劇勺粒不入已兩日夕又欲進丁香柿蒂且加薑桂參蓍診之乃隂衰火炎症也蓋勞後而兼房幃時際炎歊水不制火血少而氣上冲是以脹滿不食厄逆不已今六部脉洪數顔如煤炲大便六七日不行小水滴瀝不快經云諸逆衝上皆屬于火先哲云厄滿須看前後部腎虛不能納氣歸元故厄聲長大從丹田出丁香柿蒂可妄投耶乃先用膽導得垢數枚覺兩足微暖此逆氣下達也即以六味湯料稍减山藥萸肉入黃連梔子車前牛膝薄暮煎服不夜分厄全愈矣明晨進粥滯色漸清夫厄症有寒熱之分厄聲有上下之别今以勞劇之體血淋後見之是不由胃而由于腎也六脈洪數大小便不利是不由于寒而由于熱也真水耗于平日火症萃于一時虛則肝腎不能納氣自下焦上逆為聲非中焦熱邪之比其腰疼顔黑俱屬可虞幸得而足溫得補而噦止乃壯水制陽明之明驗亦坎離既濟之佳徵也依方調理半月全瘳婁東吳夫令梅頓先生弟也丁未夏歸自燕臺炎風烈日不無感受萑苻出沒不無驚恐舟中兼有當夕者至中途疲薾殊甚疾棹抵吳門或謂憔悴之體竟應投補沈見脉數未平氣口獨盛以為虛中有實熱初用薷芩等劑遡其源也繼用踈利等劑導其流也宿垢既除旋培元氣元氣漸復行且勿藥矣因設酬勞之宴勞憊甚其夕神昏肢倦俄而發厄沈曰勞復發厄當施溫補無疑第虛氣上逆其勢方張恐湯藥未能即降須艾焫佐之為妙一友于期門穴一壯即緩三壯全除調補而瘥祖姓人年近七旬素有胃痛病于二月間忽發厄晝夜不絶聲者十餘日胃亦痛食入即嘔或與二陳湯加丁香藿香等病轉劇脈之兩手皆洪數兩寸溢而鼓時見歇至乃厥隂之火上衝而然與杞子米仁各一兩沙參五錢麥冬三錢酒連四分二劑而愈後半年病復作以貧乏無力再藥而死此貧亦為不治之一也哀哉汗竇材治一人額上時時汗出乃腎氣虛也不治則成勞瘵先灸臍下百壯服金液丹而愈一人夜多虛汗亦腎氣虛也服全真丹黃茋建中湯而愈一人每日四五遍出汗灸關元穴亦不止乃房事後飲冷傷脾氣復灸右命門百壯而愈常東軒挺晚苦隂汗有教之用牡蠣粉撲之者始雖少减久之至潰腐見其皋丸焉豈非别殺以藥乎志雅堂雜抄琇按隂汗必由下部濕熱而成以牡礪收澀之故鬱瘀而潰爛也宋懷州知州李治與一武臣同官怪其年七十而輕健面如渥丹能飲食叩其術則服首烏丸也乃傳其方後治得病盛暑中半體無汗已二年竊自憂之造丸服至年餘汗遂浹體其治血治風之功大有補益方用赤白何首烏各半斤米泔浸三夜竹刀刮去皮切焙石臼為末煉蜜丸梧子大每空心溫酒下五十丸亦可末服本草綱目滑伯人治一人暑月病身冷自汗口乾煩燥坐卧欲于泥水中脈浮而數按之豁然空散曰脈至而從按之不鼓諸陽皆然此為隂甚格陽得之飲食生冷坐卧當風所致以真武湯附术茯芍冷飲一進汗止再進燥去三飲而安琇按江案暑門滑治一人汗出如雨身熱煩燥醫悮用术附乃以黃連人參白虎三進愈之宜參看薛立齊治一婦盜汗不止遂致廢寢神思疲甚口乾引飲作血虛有熱用當歸補血湯代茶炙芪一兩當歸三錢又以六黃湯加人參五味子二劑而愈陳三農治一人感寒用麻黃發汗汗遂不止用建中湯汗出愈多痰喘有聲此傷寒損血兼用藥之過隂虛而陽無所附遂用川芎三分白芍生地各二錢當歸一錢元胡索香附各三分再服而愈四物是矣加香附元胡是所不解一少年人汗出三年不愈用棉子炒黑入湯一滾服四五日腳腿能立後以歸脾補中等湯而安楊乘六治朱氏子年二十外勞倦發熱上半身自汗如雨三晝夜不止一切斂汗方法無效脈之浮細沈洪軟弱無力面白無神舌胖而軟且白滑意此必肺氣大虛而腠理不固也以黃芪湯加五味附子各二錢自子至卯連進三劑其汗如故思之良久乃用蜜炙黃芪二兩人參五錢白术一兩蜜升麻柴胡陳皮各一錢歸身炙草炒黑乾薑各二錢白芍五味附子各三錢大棗五枚一劑而斂此症本以勞力傷其脾肺中藏之陽陷而不升衛外之陽虛而不固以致隂氣不肯下降乘虛外溢故特用升麻以升提下陷之氣用黑薑以收固衛外之陽使在外而為隂之衛在內而為陽之守也後用清金滋水等劑而愈薛立齊治一婦人盜汗自汗遍身痠疼五心發熱夜間益甚或咳嗽咽乾月經兩三月一至用加味逍遙散六味地黃丸兼服臨卧又服陳术丸陳皮白术三月餘諸症悉愈其經乃兩月一至又服兩月而全痊一婦人患前症食少倦怠肌肉消瘦日晡發熱至夜益甚月水過期漸至不通猶奪汗者無血也時發渴燥汗多而津液涸誤用通經之劑熱倦愈重飲食愈少乃用八珍加升麻丹皮山梔柴胡治之熱漸退又用八珍丹皮軟柴胡調而愈羅謙父曰齊大兄因感寒邪頭項强身體痛自用酒服靈砂丹四五粒遂大汗出汗後身輕至夜前病復發以前藥復汗其病不愈復以通聖散發汗病添身體沈重足脛冷而惡寒是日方命醫醫者不究前治又以五積散汗之翌日身重如石不能反側足胻如氷冷及腰背頭汗如貫珠出而不流心胸躁熱煩亂不安喜飲西瓜梨柿氷水之物常置左右病至于此命診之六脈如蛛絲微微欲絶乃以死决之主家曰得汗多矣焉能為害曰夫寒邪中人者陽氣不足之所致也而感之有輕重治之豈可失其宜哉仲景云隂盛陽虛汗之則愈汗者助陽退隂之意也且寒邪不能自汗必待陽氣泄乃能出也今以時月論之大法夏月宜汗然亦以太過為戒况冬三月閉藏之時無擾乎陽無泄皮膚使氣亟奪為養藏之道也逆之則少隂不藏此冬氣之應也凡有觸冒宜微汗之以平為期邪退乃已急當衣暖衣居密室服實表補衛氣之劑雖有寒邪勿能為害此從權之治也今非其時而發其汗乃謂之逆仲景有云一逆尚引日再逆促命期今本傷而并汗汗而復傷傷而復汗汗出數四使氣亟奪衛氣無守陽泄于外隂乘于內故經云獨陽不生獨隂不長不死何待雖盧扁亦不能活也是日至夜將半項强身體不仁手足搐急爪甲青而死矣金匱要略云不當汗而妄汗之奪其津液枯槁而死今當汗之一過中亦絶其命况不當汗而强汗者乎華他傳縣吏尹世若四肢煩口中乾不欲聞人聲少便不利他曰試作熱食得汗則愈不汗後三日死即作熱食而不汗出他曰藏氣已絶于內當啼泣而絶果如他言此亦藏氣傷燥之病三國志馬元儀治沈康生夫人病經一月兩脈浮虛自汗惡風此衛虛而陽弱也與黃茋建中湯一劑汗遂止夫人身之表衛氣主之凡所以溫分肉肥腠理司開闔者皆此衛氣之用故內經曰陽者衛外而為固也今衛氣一虛則分肉不溫腠理不密周身毛竅有開無闔由是風之外入汗之內出其孰從而拒之故用黃芪建中湯以建立中氣而溫衛實表也越一日病者又手自冒心間脈之虛濡特甚此汗出過多而心陽受傷也仲景云發汗過多病人叉手自冒心心下悸者桂枝甘草湯主與一劑良已丁庠生頭汗火升食少心悸恍惚不寧或議用滋隂脈之兩寸獨鼓兩關尺虛微少神此脾腎交虧真陽欲脫之候也與人參桂附理中湯大培火土以復虛陽彼以生平不任熱劑為辭曰若謂頭汗火升為火邪上熾耶不知此乃真氣上越也且謂心悸恍惚為隂氣內虧耶不知此乃真元無主也遂與人參四兩白术五錢附子肉桂各三錢乾薑二錢炙草一錢連進四劑脉始和症始退再溫養元氣一月而安羅謙甫治刑部侍郎王立甫之壻年二十五仲冬因勞役憂思煩惱飲食失節而病時發躁熱肢體困倦盜汗濕透其衾不思飲食氣不足以息面色青黃不澤診其脈浮數而短澀兩寸極小曰此危症也治雖粗安春至必死當令親家知之夫人不以為然遂易醫至正月躁熱而卒他日王謂羅曰吾壻果如君言願聞其理曰此非難知也內經曰主勝逆客勝從天之道也蓋時令為客人身為主冬三月人皆懼寒獨渠躁熱盜汗是令不固其陽時不勝其熱天地時令尚不能制藥何能為冬乃閉藏之月陽氣當伏于九泉之下至春發為雷動為風鼓坼萬物此春生之道也如冬藏不固春生不茂又疫癘之灾且人身陽氣亦當潜伏于內不敢妄擾無泄皮膚使氣亟奪此冬藏之應也令壻汗出于閉藏之月腎水已涸至春何以生木陽氣內絶無所滋榮不死何待乃嘆息而去施笠澤治一人服參芪數日後每將昏反發熱至夜得盜汗而解曰此隂虛不能勝其陽也參茋雖能補陽助隂而隂血未易驟生乃用六味丸料加參歸陳皮一劑而熱退汗止後以六味丸參苓白术散全愈庠友張君牙患寒熱咸作瘧治服解表之劑乃盜汗潮熱肢節頸項强痛夜卧則汗出如沐濕透重衾二旬餘目不交睫診得左寸微細欲絶右尺浮大無力此汗多亡陽症也與加味歸脾湯不效自加麥冬更服二劑胸膈滿悶飲食不進遂疑參术不可服一僧欲進大劑苦參湯施曰診法隂盛陽衰者不可以柔藥柔藥助隂陽氣衰弱隂氣益著實實虛虛之禍其能免乎今君相二火俱虧非急進歸脾湯加桂心五味不可豈前藥有陳腐或炮製失宜耶令取藥一劑是夜即安汗亦漸止間進八味丸一月而愈庠生施爾祁病脈之曰隂虛火動也病使人發熱盜汗肢節作楚正合丹溪滋隂降火之劑服三日後服虎潜丸病全愈所以知爾祁之病者切其脈虛而數經云血虛脈虛腎水之真隂不足而虛火妄動也先是一醫謂是歷節風飲以風劑即支節浮腫痿弱不能行汗出如沐經云足受血而能步又云奪血者無汗奪汗者無血蓋風能生火又能生血血虛則內熱益甚支熱則腫肺則痿矣錢國賔治荆州李山人年四旬餘凡飲食頭上汗多氣如煙霧必頻抹乃止寸關浮洪兩尺沈實胃脈倍盛而數此胃熱蒸籠頭也飲食入胃遇熱上薰心肺心主汗液火性上騰肺主皮毛腠理不密故頭汗出若蒸籠之氣因煎迫而如煙霧也以三黃石膏湯數劑清胃熱愈詹渭風母年六旬外素有肝病因患瘧自五月至九月瘧愈而他症風起自汗如洗徹夜不眠食少便溏脅痛齒痛口淡惡心惡風畏寒頭頂皮帽身襲皮衣重幃夾幔猶凛栗不勝診時先以止汗為屬脈之弦小急疾知為隂虛火盛瘧邪未清誤作陽虛多與補氣斂汗之劑而然叩之果服歸脾五味子麻黃節浮麥龍骨甚夥乃與生地杞子地骨叉斛首烏鱉甲黃連蔞仁渭風曰諸醫咸謂頭為諸陽之首惡寒若此又自汗而喜熱飲明屬陽虛今方中唯與養隂又口淡便溏惡心皆屬脾胃虛寒黃連蔞仁安可用至瘧疾已愈何必用首烏鱉甲再所重在汗多而又全不治汗其故何也曰此症乃火鬱之極內真熱而外假寒也瘧本膽腑之邪因肝虛而腑傳臟故寒熱止而變為諸症故以生地枸子地骨叉斛養肝治其本黃連清伏暑蔞仁散鬱熱以治標首烏鱉甲入肝而去瘧邪蓋肝火熾盛逆入胃絡上蒸則為汗下迫則為㵼若見汗則收斂見㵼則固澀一藥肆人足矣醫云乎哉如方服之數劑而愈何某年七旬矣偶于冬間苦盜汗乃水衰肝火內熾當閉藏之候反蒸鬱而為汗也或教以黃芪煮黑棗服之四五日汗果止而咳嗽作或以為傷風與前胡桔梗杏仁蘇子秦艽防風之類或以為痰火與二陳薑汁竹瀝或以為血氣與四物知母黃柏咸不效已半年診其脈則弦數而促其症則痰多食少天柱已傾雙足浮腫投以生地麥冬杞子地骨沙參女貞四劑無進退已召畫工傳真矣告曰某本籍越中今病已膏肓量不可起治任欲歸第乞疏一方俾方服多劑者以希萬一耳仍前方加熟地蔞仁與之後二年偶遇之客坐彼前致謝甚殷余茫然叩其故曰某何姓昔患咳嗽幾斃蒙惠方渡江後服草餘劑竟獲全愈此再造之德也視其容貌充腴迥非疇曩其病之痊殊意外矣書此以為輕信單方并見汗治汗之戒楊元植年四旬外早衰鬚髮盡白素患肝腎病客吳門病瘧瘧愈而汗出不止凡生脈飲六黃湯牡蠣龍骨五味黑豆一切斂汗之劑莫不嘗之吳醫伎窮乃遄歸就豫診脈但虛數與熟地一兩杞子五錢棗仁五錢麥冬二錢蔞仁一錢胡黃連四分地骨皮三錢一服减二服瘥趙坤維令正病自首至胸汗出如沐動則尤甚頗能食然食入則滿面漓淋衣領盡透醫與玉屏風散當歸六黃湯如不服延診右關寸數大問面浮及齒痛否曰然此少厥二隂之火上逆胃絡也與重劑玉女煎入杞子五錢川連少許二帖而瘳楊兆成年十許病瘧瘧愈大汗如雨一日夜約斗許醫盡力與固表收澀反較麻黃羌活為甚延診脈洪數有力日啖粥十數甌猶覺飢蓋瘧時多服半夏豆䓻蒼术厚朴藿香橘皮諸燥烈之劑擾動胃火而然若與六黃湯則汗止而瘧必更作乃用生地一兩石膏五錢黃連八分麥冬三錢蔞仁一錢半一服减二服瘥瘧亦不作張玉書年近六旬素患隂虛火甚兩手脈常溢入掌心夏月偶不快就混堂澡浴以圖汗解歸而寒熱大作頭痛兩耳後焮腫上連承靈下至天牖急余視余適他出别延外科謂當成耳枕癰勢甚危投以搜風敗毒之劑腦後肩甲筋絡益抽掣急絆燥渴燥悶小便淋瀝如火逮余至困憊不支矣脈之洪數異常知其中熱邪在陽明少陽以隂虛過汗火驟升土又為風藥所鼓而然不可與柴胡乃君以黃芩石膏臣以鮮乾兩地黃佐以滑石生甘草使以連翹木通大劑飲之次日腫痛减腫處尚赤色前方入菉豆一合腫痛全消再與導赤散合六一散而愈續名醫類案卷十九
