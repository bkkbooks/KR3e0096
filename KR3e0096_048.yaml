body:
  text: 續名醫類案卷四十八錢塘魏之琇撰小兒跌撲損傷薛立齊治少參王陽湖孫八嵗傷股骨正體科續之視其面青而兼黃口角微動此肝木侮脾土症也且氣血筋骨皆資脾土而生但壯脾氣則所傷自愈遂用六君子湯加鈎藤當歸三十餘劑諸症悉愈義具楊純父幼兒病寒熱勢甚棘諸醫以為傷寒也藥之不效仲淳曰此必內傷純父不信編詢乳媪及左右並不知所以傷故仲淳固問不已偶一負薪者自外至聞而訝曰曩見郎君攀竹稍為戲梢折墜地傷或坐此乎仲淳曰信矣投以活血導滯之劑數服而起仲淳嘗言古先望聞問而後切良有深意世人以多問嘲醫醫者含糊診之以致兩誤悲夫廣筆記一小兒五嵗因目戲劇以莖入搗藥臼中不復出舉家驚呼無計或教之使執兒兩足以新汲水急澆之兒驚啼體縮遂得出小兒發背張景嶽長男甫二周而患背疽初起時背中忽見微腫數日後按之則根深漸濶其大如碗皮色不變亦不甚至十餘日身有微熱其熱滋甚乃謀之瘍醫或云背疽或云痰氣或曰葷腥溫補毫不可入口乃以解毒之藥投之而身反大熱神氣愈困飲食不進因思丹溪有云癰疽因積毒在臟腑當先助胃氣為主使根本堅固而以行經活血佐之又曰但見腫痛參之脉症虛弱便與滋補氣血無虧可保絡吉是誠確論也全書中何以大菲薄之因却前醫而專固元氣以內托其毒遂用人參三錢製附子一錢佐以當歸熟地炙草肉桂之屬一劑而飲食頓進再劑而神采如舊抑何神也由是弛其口腹藥食並進十劑而膿成以其根深皮厚復用針出膿甚多調理月餘而愈大凡腫瘍虛症未見但無實熱壅滯可據者便宜托補如此張子和治一富家女子十餘嵗好食柴攖每食即二三斤嵗嵗如此至十餘年一日潮熱如勞診其兩尺脉皆洪大而有力謂之曰他日必作惡瘡腫毒熱上攻因陽盛陰脫之症其家大怒不肯服解毒之藥不二三年患一背疽如盤痛不可忍其女忽思張曽有是言再三悔過請張張以䤵針繞疽暈刺數十針去血一斗如此三次漸漸痛減腫消微出膿而斂將作痂時使服十劑內托散乃痊痊後終身忌口然目亦昏終身無子小兒結核萬密齊治朱震三之子結喉上生一核如李原病式云結核者熱也又考本草消結核之藥立一方苓連梔貝昆布海藻桔梗麥芽薄荷各一錢五分紫背天葵元參連翹瞿麥各二錢為末溫湯調服即效後病者服之無不應驗名之曰神應丹師碧泉公子項下生一結核或作痢治用藥破爛轉加腫大此任脉所過之路元氣受傷致成疳症遂不救王思泉女四嵗耳後側有結核曰非癧瘡乃痰核也不必治亦不為害他醫作癧治之用螌蝥內消之藥過多脾胃受傷致成疳勞而死朱氏子五嵗病結喉下生一核大如李兩旁有小核相連者二三方用東垣凉膈散去甘草加龍膽草元參貝母海藻麥芽為丸彈子大每服一丸研細溫酒調服七日而安後用此方全活小兒甚衆薛立齊治一小兒七嵗頸結二核時發寒熱日久不愈以連翹丸治之而消若患在面臂等處尤當用此藥若潰而不斂宜服托理之劑小兒下疳附線傳陽薛立齊治一小兒二嵗莖痿濕癢後陰囊焮腫莖中作痛時出白津以為肝火用龍膽㵼肝湯六味地黃丸而愈一小兒下疳潰爛發熱作痛一小兒莖中作癢不時搔捻一小兒莖中潰痛小便祕澀日晡尤甚一小兒目癢出水或項間結核或兩眼連劄或陰囊搔癢俱屬肝火皆用九味蘆薈丸並愈萬密齊以王府小女溺出如青水著肉處潰爛成瘡問曰豈女之臟腑壞耶答曰膀胱受五臟之液以藏之化為溺也各隨本臟之色青者肝之色也著處成瘡肝火盛也火之所灼則潰爛矣以導赤散加山梔條芩膽草甘草稍黃柏為丸調理五日而安薛立齊治魏户部邦寧子年十六鼻目蝕爛肝脉弦長恚怒不息三年不愈諸藥不應服蘆薈丸半劑頓退一劑而痊一小兒下疳潰爛爪黑面黧遍身生疥此腎經內外疳症用地黃丸為主佐以四味肥兒丸而瘥邱汝誠治一嬰孩以線縛其陽莖腫脹不得脫號呼欲絶令汲水擲之於器驚啼復故揮塵新談小兒疝薛立齊治一小兒睪丸作痛小便赤澀寒熱作嘔乃肝脾之症用小柴胡湯加山梔車前茯苓而愈一小兒睪丸腫硬小便黃澀用小柴胡湯加山梔車前并蘆薈丸而消萬密齊治梁大尹子病疝右睪丸腫大如雞卵長約五寸絡臍旁下抵陰囊硬痛大小便不通用當歸川芎木香青皮山梔仁山查子小茴香川楝子澤㵼二劑而安一小兒腸痛即小腸疝也用諸症辨疑內一方五苓散加川練子小茴香入鹽一捻神效張子和治霍秀才之子年十二嵗睪丸一旁腫䏨張見之曰此因驚恐得之驚之為病上行則為嘔血下則腎傷而為水腫以琥珀丸通經散一㵼而消散小兒便血髙存之幼郎病內傷大小便俱血諸醫競用紅花桃仁病愈甚仲淳曰桃仁之類疏其瘀也血且行奈何又重傷之傷則補之而已以生地四錢續斷及杜仲牛膝等飲之稍平而腹痛不已仲淳曰是在內經强者氣盈則愈弱者著而成病加人參二錢一劑而愈廣筆記湯某治鄭都丞子患七年搖頭三年下血已服百餘方前後所服治搖頭者無非風藥止血者或作腸風俱不效湯視之亦不明其摽本退而思之乃肝血液盛外有風熱乘之謂肝病則得之矣謂血液盛而風熱外乘則未必然肝屬木盛而脾土為木所尅脾與肺是子母俱為肝所勝而血遂漬於大便故便血不止遂處一方但損肝祛風而益脾初亦一時之見只數服而愈十餘日後血止而下白膿遂安用犀角屑甘草各一錢瓜蔞半兩蛇蛻瓜蔞半兩蛇蛻一錢炙防風五兩疑誤鉤藤一錢麻黃一錢去節炙芪半兩羌活白芍各半兩為末棗肉丸食後薄荷湯下只二服作效頭搖即止便血隨愈次間服胃風湯數日頓除沈舍人子服之亦效蔣仲芳治周忠介公孫女年七八嵗大便下血不止有用黃連犀角者有用人參阿膠者俱不效診得氣口沈緊令服末子三進而血止問故曰人但知脾虛不能攝血不知飲食傷脾亦不攝血今用消導之劑食去則脾氣復而血自攝焉得不愈其末子即沈香末也小兒疳瘡薛立齊治一小兒頭患白瘡皮光且急諸藥不應名曰腦疳瘡乃胎毒挾風熱而成也服以龍膽丸及吹蘆薈末於鼻內兼搽解毒散而愈若重者髮結如穗腦熱如火遍身汗腮腫胸髙尤當服此藥一小兒咳嗽喘逆壯熱惡寒皮膚如粟鼻癢流涕咽喉不利頥爛吐紅氣脹毛焦作名曰肺疳以地黃清肺飲及化䘌丸治之而愈一小兒眉皺多啼嘔吐清沫腹中作痛肚脹筋青唇口紫黑肛門作癢名曰蛔疳以大蘆薈丸治之而愈有蟲食脊膂身熱黃瘦煩溫下利拍背如鼓鳴脊骨如鋸齒十指生瘡常嚙此脊疳也當以前丸治之一小兒鼻外生瘡不時揉擦延及兩耳諸藥不效以蘆薈丸及搽松香菉豆末而愈一小兒十嵗患瘡疥久不愈肌體羸瘦寒熱作時腦熱足冷滑㵼肚痛齦爛口臭乾渴爪黑面黧此腎疳也服六味地黃丸更搽解毒散而愈一小兒十五嵗遍身似疥非疥膿水淋漓晡熱口乾形體骨立四年矣腎疳之症用六味丸而痊後陰莖作癢小便澄白患疥瘡如大風用蘆薈四味肥兒丸諸症漸愈又用大蕪夷湯而全安一小兒項結一核堅硬如栗面色痿黃飲食不甘服托裡藥不應此無辜疳毒也以蟾蜍丸治之而愈若數服不消按之轉動軟而不痛者內有蟲如粉宜急針去之若不速去則蟲隨氣走內蝕臟腑不治丸用蟾蜍一枚夏月溝渠中取腹大不跳不鳴者先取糞蛆一杓置桶中以尿浸之桶近上令乾使蛆不得出將蟾蜍撲死投在蛆中任與蛆食次以新布袋繫之置水急處浸一宿取出瓦上焙為末入麝香五分軟飯丸如麻子大每服二十丸空心米飲下一小兒遍身生瘡頭髮成穗眉毛脫落肌肉消瘦大便酸臭小便不調頸間結核肚大青筋先用五味異功散月餘後用四味肥兒丸又用大蕪荑湯異功散而痊一小兒面黃頰赤作渴驚悸兼手心發熱遍身如疥此心經內外疳症用肥兒丸為主佐以祕㫖安神丸而愈史少參幼子二嵗項後結核不時仰首或以為熱瘡內潰用針决之服消毒之藥後曲腰啼哭謂此無辜疳外弔症也曲腰而啼內弔症也果殁一小兒數嵗腦後並結二核肉色如故而不臖腫正屬膀胱經觀其形狀審其糞色兼屬肝脾腎三經用九味蘆薈丸以清肝脾地黃丸以補腎水形體漸健不兩月而消一小兒遍身如瘡或癢或痛肌體消瘦日夜發熱口乾作渴大便不調年餘不愈用蘆薈丸以治肝兼五味異功散以補脾而愈小兒瘍症薛立齊治一三嵗小兒臂患毒焮痛服解毒丸及搽神功散而消嘗治便祕或煩躁服五福化毒丹亦效若膿成者急刺去用紙撚蘸麻油絍瘡內以膏藥貼之若兒安靜不必服藥候有膿取去仍用絍貼有小兒瘡毒不愈或愈而復發皆因其母食炙􅏼辛辣或有熱症宜先治母熱就於母藥中加漏蘆令母服之其瘡亦愈一周嵗小兒先於頭患瘡疥漸至遍身久而不愈飲四物湯加防風黃芩升麻外搽解毒散月餘而愈一小兒頭面患瘡數枚作癢出水水到處皆潰成瘡名曰黃水瘡也用菉豆粉松香為末香油調傅飲以荆防敗毒散而愈一小兒頭面生瘡數枚作癢瘡痂積纍名曰粘瘡也以枯白礬黃丹末等分麻油調搽更飲敗毒散而愈一小兒癮疹瘙癢發熱不安以消風散治之又一小兒亦患此咳嗽時嘔以葛根橘皮湯並愈一小兒頸面胸腹患水泡數枚潰而成瘡此風邪乘於皮膚而然也名曰瘭瘡飲荆防敗毒散更以牛糞燒存性為末傅之而愈有瘭疽一症為患最毒形如粟許大者如栗患無常處多在手指潰而出血用南星半夏白芷末傅之重見骨或狂言煩悶一小兒遍患疥如痢或癢或痛肢體消瘦發熱口乾作渴大便不實年餘矣此肝脾食積鬱熱服蘆薈丸不月而愈一小兒因有食積服尅滯之劑肢體生瘡似疥服消毒之藥發疙瘩赤色作癢膿水津淫先用五味異功散加柴胡山梔以補脾胃平肝木赤癢漸消又用四味肥兒丸五味異功散治之而食積愈一女子赤暈作癢寒熱發搐服風藥身發疙瘩搔破出水此肝血風熱之症先用加味小柴胡湯後用四味肥兒丸而愈又後傷風咳嗽頭面搔癢微腫先用消風散一劑又用子清肝散而痊一小兒遍身生瘡小便不調頸間結核兩目連劄服祛風之劑眉毛脫落謂肝經風熱之症先用大蘆薈丸後用四味肥兒丸漸愈後因飲食停滯發熱其瘡復臖用大蕪荑湯四味肥兒丸而痊後每停食遍身發赤作癢服四味肥兒丸即愈一小兒面部浮腫遍身如癬半年後變疙瘩色紫作癢敷巴豆等藥皮破出水痛癢寒熱大便堅硬脾肺脉洪數而實先用防風通經散便利調和又用四物湯加荆防黃苓柴胡角刺甘草節諸藥漸愈更以八珍湯加白术荆防角刺五加皮而愈後但勞則上體發赤暈日晡益甚此氣血虛而有火也先用四物湯加丹皮參术柴胡治之稍愈又用補中益氣加酒炒黑知柏月餘全愈一小兒遍身生瘡大便下血發熱作渴腹大青筋眉毛漸落用大蘆薈丸五味異功丸其瘡漸愈佐以補中益氣湯熱渴漸止又用異功散為主佐以補中益氣湯加吳茱茰所製黃連治之血止瘡愈一女子素有肝火因怒頸項結核寒熱晡熱遍身起赤暈作癢服祛風之藥搔癢出水唇口搐動以為脾經血虛內熱生風用梔子清肝散加鈎藤而寒熱頓減又用當歸川芎散而漸愈乃用加味逍遙散而痊一小兒遍身搔癢或如蟲行內服胡麻散外敷解毒藥患處皆潰誠如麻風視其唇或掣動或兩目連劄此肝木乘脾土用升麻湯煎服㵼青丸而漸愈又用樺皮散而痊一小兒身搔癢起赤暈後膿水不止先用歸脾飲二劑又用胡麻散而愈後因驚挾食發熱起赤暈用越鞠丸一錢枳术蓬术末各五分葱湯調服二次又用消風散一服赤暈頓消又用越鞠丸而痊續名醫類案卷四十八
