body:
  text: 續名醫類案卷三十九錢塘魏之琇撰痘寒戰咬牙徐仲光所治痘症甚多下皆其神效者也載之一痘六日不起脹寒戰咬牙腹脹氣急用竒攻散補中益氣湯而愈一痘初發熱時惡寒身振動此邪正交爭欲出不出也用升麻葛根湯加人參防風桂枝山甲及補中益氣湯調理而愈一痘未出齊而手足搖動以異功散投之而更甚此假寒實熱木氣大過而兼火化也宜平肝制火升麻葛根湯加川芎柴胡防風而愈一痘發熱時咬牙兼竄視乃心熱甚也用升麻葛根湯合導赤散服之而愈一痘發熱時悶瞀咬牙此肝熱風也羌活湯加葛芍服之而愈萬密齋長孫二嵗染痘發熱三日內寒戰似瘧其父泣曰死矣乃笑曰爾為醫救病如篙工然忽遇風浪手足自亂何以濟人此兒元氣充盛毒氣微少邪不勝正作寒戰而退試觀症必少也果止五七粒七日愈一兒初發熱便咬牙戞戞有聲精神昏憒此逆痘也乃腎虛症蓋腎主骨齒者骨之餘腎水不足則毒火無制火氣扇動故上下相戞有聲陳氏所謂稿者是也果卒一兒痘甚密曰此兒脾胃素弱當用補胃之劑使血氣旺而痘易成就也不聼至成膿後過期不靨遍身潰爛寒戰咬牙失音悉具曰此戰乃遍身潰爛坐卧艱難不能自任非鼓頷寒戰也咬牙者齦瘡癢相戞而鳴非神昏鬬齒也失音者欲得肉食不與之日夜啼哭得之非咽喉爛嗆水也用調元湯加白芷防風暗入熟附一片三劑而安痘寒析徐仲光治一痘五日形色少神腹脹喘急腸鳴肢冷或擬內傷者或擬陷伏者殊不知內傷者按必痛陷伏者必煩悶今若便利安寧而虛鳴者乃隂陽二氣不和傷冷之症或服涼藥也經曰中虛不足則腹滿腸鳴以理中湯加木香陳皮官桂等疏逐冷氣諸症悉平又以補中益氣湯調理而愈一痘因春夏久雨為寒溫之氣所侵不能起者五苓散加蒼术防風多服之佳或平胃快斑湯松江黃綺雲療徐氏兒痘兒幼遇冬月痘不起熾炭圍爐抱兒火邊以酒漿挹火火氣熏兒痘立起廣筆記費建中治朱氏子稠密乾紅或以色滯便以清火兼升發纍日不起見其鼻流清涕身涼且靜時在春初寒風凛凛此熱毒輕而感寒重毒火為外邪所閉也以溫肌透毒散陳皮換荆芥連二劑身漸暖頓起發次日鼻塞眼封而痘發煌身漸熱清解治毒調理收功一兒稠密不鬆眉愁腹痛不寐毒盛也蒼白乾滯涕吐稠黏頭溫足冷邪閉也急疏風攻毒四朝體漸熱痘漸起色漸紅活但筋脈時惕以法驅毒而愈一兒三日目紅鼻塞噴涕甚濃氣粗熱壯痘甚稀色滯乾紅無甚內症以荆芥穗葛根前胡黃芩牛蒡木通丹皮蟬蛻青皮赤芍三劑起發沛然六日肥綻順敘收功痘厥逆徐仲光治一兒痘四日溏泄無度四肢厥冷痘點隱之其㵼已旬日脾虛以附子理中湯數劑㵼減肢溫又以補中益氣湯加肉果官桂㵼止後竟用補中益氣湯調理而愈一兒痘九日色灰白溏泄厥逆氣憊隂陽不相順接而肢為之厥冷也用陳氏異功散而愈一兒痘過期不斂便溏安靜四肢少溫但脾氣不足用參附苓陳甘芍山藥木香肉果治之破損不成痂而愈一兒痘七日肢厥減食乃血熱而過服冷劑以致水伏也保元湯加丁桂炮薑而愈一兒痘六朝綻突焦紫煩躁悶亂喘促厥逆乃陽毒陷伏厥深熱亦深也以四順飲行二次諸症悉平又清解之而愈一兒痘四五日毒已盡形色無神二便自利四肢厥冷腹脹發噦裡氣虛弱也稍遲則胃氣脫矣急以理中湯連進二服內氣一暖痘即發光紅活四肢溫暖又以補中益氣湯加丁香噦止而愈一兒靨後自言手足冷及按之反熱夜卧不安經曰外熱而內冷者牌弱也內熱而外冷者胃弱也夜卧不寧脾隂不足也用歸脾湯而愈一兒痘後手足厥冷乃脾弱不能旁逹四肢用保元湯加當歸白术附子炮薑而愈痘昏冒萬密齋治汪氏子痘靨後忽然悶絶目閉口合令作調元湯加麥冬濃煎灌之又與粥湯遂愈此正氣素弱邪氣方盛壯火食氣氣益弱矣今邪氣既退正氣將生乃否極泰來之兆所以戒勿擾亂待其自蘇人不知此卒見悶絶或呼喚抱持神氣一散不救者多矣或謂恐有餘毒曰餘毒有三一曰疥二者癰三者目赤未聞有昏瞀也凡痘瘡或出不盡發不透或空殼無水或清水非膿則有餘毒今起發胖壯膿漿飽滿何餘毒之有哉痘驚搐徐仲光治一兒卒仆驚搐蘇而復作此風寒壅毒紅綿散治愈一兒驚搐誤以驚藥涼其心痘不得出而死一兒初發熱搐以升麻葛根湯加天麻鈎藤木通蟬蛻枳殼痘出而愈一兒見點發搐此心血虛而客邪以四物湯加茯苓逺志石菖蒲棗仁蟬蛻而愈一痘初點驚搐不止此心脾虛而血少失治十朝而卒一痘出二三日驚搐此毒不透心經有邪導赤散加蟬蛻黃連紅花天麻鈎藤石菖蒲而愈一痘出未盡驚搐且溏泄肢冷異功散四劑而愈一痘漿期驚搐不止安神養血丸而愈一痘後驚搐吐㵼肢厥目直痰鳴此中氣不足補中益氣湯為主兼醒脾散附子理中湯下至聖保命丹而愈一痘後驚搐氣促痰喘口開目直二便閉澀此類急驚乃風邪有餘症宜清涼解散㵼氣以天麻抱龍㵼清丸治愈一痘後過食白果驚搐痰壅目直腹脹喘急此氣滯生痰甘草湯薑湯漸與服得吐㵼而愈不可以風治之也痘煩燥以下亦徐仲光所言一痘未出齊色赤壯熱煩躁清解之而益重此反氷其毒也宜升解之升麻葛根湯加桂枝牛蒡紫草而愈一四朝順痘煩躁不食毒未盡也升麻葛根湯補中益氣湯而愈一順痘日夜啼哭不止此不勝火熾刑金也㵼青散導赤散加黃連而愈一痘少淡白不易肥而煩躁真氣弱也綿紙搓軟白芨膏封痘服保元湯而愈一痘後夜卧不寧此胃不和而衛氣不得入於隂也四物湯加逺志棗仁龍眼肉及歸脾湯而愈一痘後身熱午前煩躁解毒清熱而愈一痘六朝不起乾紅煩躁此毒壅也過用保元湯而反悶亂焦紫乃以枳殼湯先解參茋之滯犀角地黃湯加蟬蒡紫草清其壅滯之熱七朝痘色正後以保元湯調理而愈萬密齋治邱氏子痘正作膿瘙癢煩哭其面磊落紅綻膿漿未熟而頰先紅乾皮肉木硬曰左頰屬木肝也肝主血藏魂右頰屬金肺也主氣藏魄兩頰木硬氣血不榮魂魄不靖所以煩哭也請藥曰欲解其毒則中氣反傷欲補其中則邪火正盛不可為也是夕加煩而死痘譫妄徐仲光治一痘起脹色焦枯譫語此火亢極也以退火回生丹無比散治之而愈一痘密漿其白色昏睡譫語此血虛也保元湯加歸地芎冬茯苓仁棗仁一痘後午餘發睡面赤譫語此火從虛發也保元湯加歸芍川連萬密齋治胡三溪子痘時常以手自掩其面身下縮頻呼曰我怕若有所見者曰逆症也經曰腎敗者失志目中見鬼死不治錢氏曰腎病則下竄此痘發於腎不可為也果然一婦年二十餘發熱五日痘不出常起摸牀壁昏不知人口喃喃不休曰死症也果然周璜子年十三染痘發熱五日痘不出發狂譫語已進保元湯三劑矣曰誤矣犯實實之戒也凡痘發熱之初驚者平之渴者潤之吐利者和之便祕者利之熱盛者解之如無他症不須藥今此子元氣素厚飲食夙強乃以保元湯助火為邪毒氣鬱遏至於狂妄熱已劇矣宜急下之與三黃湯得利而狂止痘出至十七日靨汪少溪婢染痘發熱顛狂曰熱極矣當速解之乃作三黃湯與服得利熱減神清痘出而安徐氏子年十七出痘至膿將靨忽發狂語起舞或毆人罵人皆平日仇恨者一身之瘡盡迸破祈禳不效乃用安神丸百粒作次服良久始省問其所為夢也痘喘急以下亦徐仲光所言一痘稀嫩少神起脹時泄㵼而喘此氣虛也補中益氣湯加肉果而愈一痘漿足痰喘便實此肺熱過於補也枳殼湯加連翹牛蒡腹皮瓜蔞而愈一痘收靨原痂喘急腹脹因能食非倒靨也保和湯愈一痘漿灌喘急用荆防桔梗只杏冬貝橘紅炒鹽竹葉而愈一痘喘急用白花地丁水煎服即止如神一痘後齁喘久不愈蜜炒麻黃半夏桑皮欵冬花各一錢白果肉五斤煎服數劑愈一云有甘杏芩蘇子更妥一痘後喘嘔不已用長流水揚百遍煎清上藥服愈一痘後喘急聲重客水侵肺也蜜炒麻黃桂杏車葶藶甘草愈一痘後痰嗽喘嘔用阿膠糯米各一兩牛蒡兜鈴各三錢杏仁三粒甘草五分丸服愈一痘後泄㵼喘急此肺虛也人參一錢五味三錢煎服而愈一痘後痰喘不已火侵肺也用芩連枳杏甘桔花粉柴胡煎服而愈一痘八朝俱充灌因暑月汗多解衣熱為風抑忽咬牙喘泄一晝夜頰上有倒靨先用蘇防杏只青皮陳皮茋术葶貝前蠶得微汗喘緩次用振蟄丹三分隨以大清丸三丸小青丸五丸大靈丸三分連進二服而愈萬密齋治程氏子未一嵗多笑知其心火有餘令以川連山梔辰砂為丸服之三日後笑漸少隨染痘發熱忽作喘嘔中涎嚮汨汨有聲此肺熱症幸不肩息作冷乃作清金散湯一服而減半再劑而喘定如不知則殆矣痘咳嗽一痘五朝勻澤紅潤稀朗頂平陷痰嗽甚此傷風失表邪客肺經但膿期患此難於補托用甘桔前芩桑杏橘蔞而愈一痘七朝不易起脹喘咳吐食此毒壅也清解散而愈一痘八朝順但頂平痰嗽重此由失清解治以清補兼行因不信藥十一朝聲啞喘脹倒靨死一痘收靨厚而乾黑身熱咳嗽風寒客肝也麻黃湯愈一痘收疤咳嗽咽膈不利用甘桔翹防蒡陳皮射干元參而愈一痘後傷風咳嗽發熱用解表藥反汗喘用二陳湯加桑杏查反加搐溺此脾胃虛弱也補中益氣湯加麥芽五味鈎藤而愈一痘痰嗽諸藥不效用黑散子而愈一痘後咳嗽連聲不續痰鳴欲絶嗽罷吐白沫面唇白飲食少不得卧此虛而攻肺下痰過劑也小異功散加藿半蔞粉冬又用人參清肺飲而愈此救子益母之法也一痘後咳嗽吐膿腥臭胸中隱隱作痛右脈數滑乃餘毒在胸作內癰也用橘貝甘桔芩合翹蒡知蔞防已并蒸百合服愈一痘後風寒痰嗽頻吐和食俱出以清金散治而愈一痘後咳嗽吐􅀈此脾傳胃也以六君子湯治而愈一痘久嗽不已腰背痛此腎咳也地黃丸加麥冬五味子而愈一痘十二朝咳嗽旬餘不止服發表化痰藥多反吐膿血此脾肺虛重傷真氣成肝癰也用桔梗湯而愈萬密齋治陶氏子痘將靨咳嗽喘急用甘桔湯加麥冬牛蒡未效此肺有火邪火鬱宜發之乃去麥冬加紫蘇地骨皮一服而安痘嘔吐噦下皆徐仲光所言一兒年十五血熱毒重而無顆粒正頞略見分珠而又稠密唇焦口腫舌有黑刺大熱大渴先羌活湯調下催蟄丹退火丹雖起發嘔噦特甚用苓連荆防翹蒡查蟬犀角紫草石膏大黃二劑痘乃稍潤又加芎歸冬知甘桔生地丹皮紅花元參痘漸滋長嘔噦漸止八九朝復嘔背痘平塌仍用芎歸苓連蟬蒿翹防羌蒡陳藿石膏黃土澄水煎服隨以桑蟲漿雞腦各二個入催蟄丹震熱丹各五分至夜狂躁作渴以陳冬米麥冬煎湯頻飲至天明熟睡痘轉而起灌矣但大便溏數加茋术查橘炮薑人參三四分調理而愈一兒成漿倒陷吐噦不止急用攻發藥以起其痘於安胃藥中加參芪黑薑陳米白术黃泥澄水煎治愈一兒標點噦吐面色枯口唇焦胃氣已脫毒不出三日死一痘六朝勻朗光澤外症順而胃氣損聞食則噦漿雖滿不能收拾蒼老變倒靨而死吐􅀈者更重一痘後喘嘔以長流水揚百遍煎清上之藥服愈一痘後吐蛔氣血弱無榖氣以養蛔故出也二陳湯加生薑白芍川連連翹大黃治之而愈一痘後煩渴乳多則吐身熱喜涼此餘毒在胃竹葉石膏湯治之而愈一痘後噦腐有用香砂丸尅伐太過遂變泄㵼而死萬密齋治一兒痘本輕因傷食腹痛而嘔用平胃散加砂仁藿香葉煨薑而嘔止一小兒因食生冷傷脾胃而嘔痘變灰白用錢氏異功散加砂仁丁香桂而嘔止一小兒痘密甚喉舌都是將閉時嗆水嘔食雜膿血痂皮痰涎而出用甘桔湯加牛蒡嚬呷之調理而安一小兒膿成將靨忽作乾嘔雖飲食常自嘔噦其痘不作膿不滿頂曰此逆痘也乃誦木陳葉落弦絶聲嘶之言以告之後失聲悶亂死庠生余光庭年十九出痘膿成將靨忽作咳逆即噦也又名餽逆脈促而代或謂咳逆者惡症也促代者怪脈也痘瘡順正飽壯明潤何以得此曰咳逆三症一曰胃寒二曰水逆三曰胃敗皆不合經曰諸逆衝上皆屬於火此火炎上之象乃問其大便何如則自出痘至今七日未更衣曰此燥矢壅塞下竅不通火炎上竅故咳逆耳促代之脈得之氣逆脈亦逆矣以豬脖導之下燥矢咳逆即止而脈亦調勻而起痘吐㵼及蛔徐仲光治一痘不見出吐㵼不已服升發益盛此虛症宜溫補藥升發以透肌散六君子湯加升蟬薑桂陳米棗而愈以其熱靜痘嬌也若執痘未齊而不補真元反致伏陷矣一痘後吐㵼類霍亂此外感兼內傷也藿香正氣散藿香五苓散因兼暑食加味二陳湯治愈一痘後吐蛔乃氣血虛無榖氣以養蛔求食而出也二陳湯加連翹連棗薑芍而愈一痘起脹吐蛔乃胃熱而久不能食蟲為熱迫但聞食氣則上湧出安蛔湯而愈然多有不治者雖痘勻朗漿半足若久不食而服劑不止者土虛而木乘之必至腫消目開倒陷而死費養恆治馮憲副孫兩日稠密無縫皮薄色淡身涼而靜睡不合目而困倦面㿠白吐蛔數條俱已死此虛寒而鄰於逆者也以保元湯加芎歸肉桂山甲數劑絶無起勢乃加參三錢茋五錢熟附五分日二劑六日漸起色漸紅囊漸蒼老肢體亦暖參茋更加重附至七分幸不㵼又加熟地膏半盞鹿茸膏數匙十日漿肥膿神爽寢食俱安十四日收功因痂乾燥防餘毒以參歸化毒湯重入忍冬膏調理而安費建中治姚氏子秋夜忽吐㵼三十餘次口不能合兩目失神身不熱痘齊涌出甚細密僅得分珠顆粒圓滿却如水泡有頂無盤乃劇虛劇寒之症形象固逆幸氣血未離疏通之劑斷不宜用即與保元湯加白术木香當歸熟地訶子等服至六日如常乃倍參茋加鹿茸肉桂至八九日身得溫暖窠囊覺厚漿水及半而不蒼老前方去鹿茸肉桂訶子加芍茯苓銀花神爽進食而痊矣虛劇之症補之不足尚可散乎但今無是症矣痘泄㵼施季泉治一兒甫半嵗身熱即見痘皆以樹小花多頂丁腳塌根窠澆薄為十死一生之症擬以六朝多用參茋附子施季泉曰此險發癢必甚須看守嚴密竟用涼藥與前論迥别七朝果發癢作㵼一日夜二十餘行乳藥湯飲傾注而不變色季泉加炒黑黃連而㵼止十三朝復發癢口渴唇燥舌生白胎仍用炒黑黃連而胎渴愈十九朝季泉别而誡曰慎防發疔疳其疔必發腦後頂骨間待自潰以收口膏貼禁用滲藥口疳只用人中白散前後毫不用補何其識明而斷確治效如神豈其先得決於身一熱即見痘而多且嬌故豫決其為險症發癢乎廣筆記一兒痘㵼投以升澀藥不效黃綺雲用白芍藥酒炒三兩煎服一劑即止此脾虛有熱也廣筆記一兒虛寒將行漿時作㵼用炒蓮肉去心一兩真鴉片五分共末白湯下兒小者三分大者五分㵼立止虛癢或虛煩躁不止亦如之若係大熱泄㵼者不可用也同上一血熱痘兼氣虛先用解毒藥毒清矣忽㵼日數行不止痘漸平塌繆仲淳以炒蓮肉五分真鴉片半分米湯下立止王宇泰復用人參二兩黃三兩鹿茸三錢煎服補其元氣漿頓足而愈蓋因其先解毒盡故可補而無他症起也廣筆記一痘脾虛作渴用蓮肉六兩參茋五味山茰扁豆各四兩白术三兩棗肉為丸薑湯下此方移治老年腎虛脾泄㵼更效一痘密毒重起發亦透八朝但頭面胸背膿漿手足止有清泡用參茋米桔翹連蠶薯即痰不食身熱而嘔大便頻頻失屁急加歸芍查陳砂冬防术元參石膏山豆根及便製人參兼用牛黃抱龍丸八寶丹連二三劑四肢漿足以後去人參止用清解藥而愈一痘起脹時忽㵼痘色赤而稠根窠堅突便祕六日矣此血熱毒壅正宜㵼去其毒治只宜清解主人恐㵼耗其元氣用豆蔲丸保元湯加肉果官桂等痂雖收而目腫赤四肢發癰始悔而用清解病根已深竟損一目廢一肢此症有同是熱㵼而用犀角地黃湯加木通桔梗川芎提之而順愈一痘早起泄㵼飲食不化此脾腎不足四君子湯加補骨脂肉果又朝服四神丸夜服參苓白术散而愈一痘隱隱不見面白神疲微熱飱泄此脾虛不能送毒也異功散加木通芎升蟬陳米㵼止痘發補中益氣湯調理愈一痘六朝不起脹灰白昏睡四牙散木香散發之數劑而愈一痘後㵼藥食俱不化此脾虛也參苓白术散阿附丸而漸愈一痘後泄㵼不已此脾虛也四君子湯加升防肉果又肉豆丸而愈一痘後羸瘦枯稿溏泄不已咸謂脾弱理中湯小異功散六君子湯皆不效知其乳母弱乳薄故也令易乳而安一痘後飱泄此邪熱不殺榖六君子湯而愈一痘溺赤溏泄如糜腸中熱則㵼黃如縻此煎煿積熱也以五苓散加車前黃連神麯麥芽山查而愈一痘後傷食傷暑而㵼四苓散合香薷飲加神麥芽山查而愈一痘後夏月泄㵼腹如雷鳴服調脾藥不效此腸風泄㵼葛根湯加防桂煨薑得微汗而愈一痘未出發盡利下赤白此血熱痘壅有積熱也以葛根升麻湯加芎歸查麥蟬蛻稍減而目赤溺數犀角地黃湯補中益氣湯治愈一痘暑月六朝而利下膿血壯熱煩渴此毒留大腸三黃丸兼補中益氣湯而愈一痘同而不治痢久漸倒陷二七而死故曰險者治之一痘靨期而利水榖不分完榖不化參苓白术散芍藥獨參湯治愈一痘後利下蛔蟲此熱迫之也芩甘半芍烏梅川椒薑棗而愈一痘後患利裡急後重面黃不食聞藥食則嘔此病邪雖實而胃氣受傷多矣當先補後攻小異功散加芍藥而噦止進食次以木香檳榔丸去積盡調中湯而安一痘後初秋利下白積身熱腹痛嘔噦不食此濕熱瘀積兼受寒邪理中湯加防風一劑噦止平胃散加連青葛查麥愈一痘後利下赤白能食而不化此胃熱而脾虛也乃恣食而不知節慎遂致莫救一痘後暑利保和丸香薷飲間服而愈一痘後噤口痢用人參一兩陳皮黃連石蓮肉各五錢桔梗三錢胃風湯調愈一痘後利久不止積未盡而中氣不足用人參白术白芍甘草升麻陳米大固中氣而愈一痘後毒入大腸而便膿血者牛黃散三黃散犀角地黃湯黃連解毒湯而愈一痘臘月㵼數日而後標點患痢無度用升發藥不效痘色淡白少神脈浮大無根大虛症也附子理中湯日進二劑積少減痘亦紅潤脈始有根然飲食不進用補中益氣湯加桂枝炮薑遂能食安寢漿雖充而完榖不化亦不易結痂小異功散加芍藥木香參苓白术散調理而愈萬密齋治胡氏子染痘自利三日不止或欲進理中湯加訶子肉豆䓻曰不可此協熱利也宜用黃芩芍藥湯但觀其形色利當自止不必服藥次日痘出利止一小兒發熱時自利大孔如竹筒狀清水流出逆症也此乃火盛於內肺金不行收令也以黃芩芍藥湯加烏梅一服而利止萬之子三嵗出痘至膿成將靨時忽泄㵼痘變灰白先君曰此虛寒症命作木香散服之未盡劑泄止瘡復紅活時鄰人曽氏子痘出密盛將靨亦作㵼痘變灰白且作癢來請藥先君即以前未盡劑與之㵼止痘紅活不癢矣蕭别駕女七嵗出痘連服保元湯痘密甚曰表裏俱實雖密順痘也不必服藥蕭江西永豐人彼處出痘専食雞戒以不可食不聼日食雞汁至膿將成忽大㵼日夜五六決所下皆清水欲止之日裏氣太實正須㵼耳次日㵼益盛視其痘飽滿紅潤不與藥乃怒甚曰保無他或欲進肉豆䓻丸力止之至第三日大泄水一行曰㵼止矣問故曰此坐飲雞汁太多水留薄腸胃之間今㵼者名畜水㵼也水盡㵼自止與四君子加陳皮調理而愈一痘將靨忽作泄㵼口渴飲水小便短少其痘胖壯紅潤此內熱也用五苓散加黃芩白芍煎調益元散而愈一痘起膿成能食一向溏㵼未止用錢氏異功散加木香訶子肉服之愈一痘成膿面部將靨因渴飲過多以致自利白术散服之渴㵼俱止愈一痘成膿少食忽作泄㵼不止變灰白用木香散豆䓻丸服之愈一滑㵼不止食少腹脹足冷痘灰白色脈細無力此犯五虛不治必死陳三農治一小兒痘後泄㵼二三年體瘦腹大善食此久㵼傷腎腎不納氣肝火起脾無正火不殺榖故作㵼瘦削成疳耳用紅麯丸加草果三錢服之愈李季虬曰長兒痘初熱即泄日十數行見痘泄不止時醫以脾胃藥止之愈甚施季泉曰是在不治豫強之曰止泄不難發藥中加黃連二錢黃芩一錢一劑泄止豫喜甚施曰非也毒火熾故泄初泄時即以解利藥乘熱導之或可望生今遲矣過四日即欲解毒無及矣坐視七日死廣筆記痘痢萬密齋張氏子痘靨時面瘡潰腫膿水浸淫泄下膿血後重不食或作噤口痢治不效視其症乃倒靨非痢也在痘科中利下膿血痂皮者生水榖不化者死在傷寒太隂經病論則曰熱畜於腸便膿血勿治利盡膿血自愈因思此疾不可急乃故製藥延緩以待之數日後度其膿血將盡乃用四君子湯加白芍枳殼黃連木香一服後重除利稍止再服能食三服痘靨痘大小便祕徐仲光治一痘十九嵗標點時便祕一十二朝不行口渴煩躁左尺脈浮大此隂不足而津液竭也參冬歸地知杞枳殼兔絲子而便利一痘後食粽便結痛不可按手足搐搦大柴胡湯加酒麯二錢而行一痘後身熱便祕此餘毒結大腸也解毒湯服而愈一痘後身便燥此辛熱耗液潤燥湯愈一十五嵗血熱毒重痘十八朝忽小便不利欲解不能起倒竟夕聞其大便已阻而不行者四日矣此有燥屎結於幽門後竅不通故前竅亦閉進以湯藥則小便益急而不能出痛苦極矣且藥力未能逹於至隂之下因用膽導法須臾二便皆通一痘正出而小便祕此氣為火食也導赤散疏解藥而愈一痘泄㵼溺澀此隂陽不分五苓散加車通而愈一痘隂陽分而小便少此肺脾虛也補中益氣湯加麥冬五味愈一痘溺澀為隂虛火炎爍肺六味地黃丸加冬味而愈一痘後小便赤色知熱在膀胱導赤散加梔芩車前竹葉燈心而愈一痘後小便不利用五苓而愈甚隂囊漸腫此虛隂而滲利之復損其隂也六味地黃丸加肉桂車前又補中益氣調理愈一老醫有孫痘既脫痂少腹脹小便不通衆謂痘後餘毒用利水解毒愈脹老醫忽悟曰此脾虛下陷也痘後無實症土堅則水清人參一兩大棗五枚生薑五片煎服愈廣筆記萬密齋治庠生余光庭年十九嵗染痘發熱五日不出三日未更衣脈細而數雖有下症元氣怯弱不可下也以膽導之不得通病者煩燥因思發熱日久毒流其中燥糞閉塞肛門腸乾枯氣不得行血不得潤膽導力小不能通也自立一法取豬尿脬一枚以豬膽汁半杯清油半杯蜜半杯三物和勻入脬中如作膽導法取下燥屎二十餘枚氣通熱解神清痘出此法外意也虞天民亦有此法胡氏子出痘乍熱乍退足冷數日不大便先出者猶是紅點亦不起發此逆症也或曰熱微毒亦微熱甚毒亦甚今熱不甚順痘也曰不然毒本火毒待熱而發如發熱而不煩不渴大小便如常精神清爽者此熱在表無邪毒火發越而痘易出易靨也若煩燥不安大小便艱昏昏喜睡此毒火內藴不得發越表熱雖微內熱則甚今乍熱乍退者毒火來往也大便不通者毒火鬱遏也見紅點而不起發者毒火陷伏也足冷者火極兼水化謂之逆冷也彼不以為然次日紅點俱沒煩燥轉甚猶謂此內收也翌日死痘疫癘徐仲光治一兒季春出痘感疫氣亢極便祕用十神解毒湯次以升麻藥治之而愈一兒季春出痘七朝順朗亢極便祕狂煩舌有黑胎刺痘空處隱隱有黑點此感疫失解也先用大承氣湯治之次以理氣血而愈萬密齋云嘉靖甲午春痘毒流行死者十八九乃一厄也時有豫服三豆子湯絲瓜辰砂散凡方書所載豫解痘毒之法用之無效豫思痘疹疫癘之毒因嵗運災眚之變難以藥解而人事未盡又不可委之天數也於是撿閲古方於韓氏醫通得五瘟丹以五運為主喜曰此解毒神藥也依方修合施售與人但服之莫不輕疏人皆神之因命之曰代天宣化丸甘草甲乙年為君土黃芥乙庚年為君金黃蘗丙辛年為君水山梔丁壬年為君木黃連戊癸年為君火連翹佐山豆根佐牛蒡子佐先見其年所屬者為君次四味為臣君藥倍用臣藥減半佐視臣又減半共為細末於冬至日修合取雪水煮升麻汁打麵糊為丸辰砂為衣竹葉煎湯下萬密齋曰胡松山子出痘在母黃氏懷半夜後此兒却在地下蕭楚梧子出痘日中時聞蒜氣過胡三溪子出痘有鴉日日聒噪胡淑卿子出痘近夜時樓上忽聞棹倒聲視之無他王東樓子出痘有蝙蝠飛入室後皆凶醫者病家不可不知續名醫類案卷三十九
