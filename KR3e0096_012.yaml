body:
  text: 續名醫類案卷十二錢塘魏之琇撰飲食傷竇材治一人慵懶飲食即卧致宿食結於中焦不能飲食四肢倦怠令灸中腕五十壯服分氣丸丁香丸即愈一人脾氣虛好食冷物不消常覺口中出敗卵臭服草神丹即愈若服全真金液亦效原注脾胃既為食所傷不可再施消尅唯治以溫化則自健運矣一人暑月飲食冷物傷肺氣致咳嗽胸膈不利先服金液丹百粒泄去一行痛減三分又服五膈散而安但覺常發後五年復大發灸中府穴五百壯方有極臭下氣難聞自後永不再發世醫不審病目動云暑月熱氣傷肺一𣲖寒涼致水氣不消變成大病原注汪潁曰一人好食燒鵝炙煿日常不缺人咸防其生癰疽後卒不病訪知其人每夜必啜涼茶一碗乃知茶能解炙煿之毒也龔子才治一人勞後喫紅柿十數枚又飲涼水數碗少頃又食熱麵數碗遂心腹大痛診之六脈沉微氣口稍此寒熱相搏所致以附子乾薑肉桂枳實山查神麴莪术香附一服立止後渾身發熱又以小柴胡一劑而安一人臘月賭喫羊肉數斤被羊肉冷油凝結堵塞胸膈不下脹悶而死諸醫束手診之六脈俱有乃用黃酒一大罈煮熱入大缸內令患人坐其中衆手輕輕亂拍胸腹背心令二人吹其鼻及將熱燒酒灌之次服萬億丸遂得吐㵼而愈陶節菴治一人患病因食羊肉涉水結於胸中門人請曰此病下之不能吐之不出當用何法陶曰宜食砒一錢門人未之信也乃以他藥試之百計不效卒依陶語一服而吐遂愈門人問曰砒性殺人何能治病陶曰羊血大能解砒毒羊肉得砒而吐而砒得羊肉則不能殺人是以知其可愈杭州府志唐守元治一婦人食羊聞呼未及吞而應逾月病發淹及兩年唐曰此必胸有宿物家人曰兩年不食矣曰試以我藥投之既而大吐痰塊中裹羊肉一臠遂愈平湖縣志王海藏治秦生好服三生茶及冷物成積而痼寒脈非浮非沈上下內外按舉極有力堅而不柔觸指􅊳出膚表往來不可以至數名縱橫不可以巨細壯此陰症鼓擊脈也一身流行之火萃於胸中寒氣逼之故搏大有力與真武四逆理中等湯丸佐以白芍茴香使不僭上每日服百丸夜八十丸至夜汗出而愈孫文垣治董潯陽年六十七有脾胃疾以過啖瓜果胸膈脹痛諸醫不愈脈之寸關弦緊曰病傷瓜果而為寒濕淫勝經云寒淫所勝治以辛溫然瓜果非麝香肉桂不能消以髙良薑香附各一兩為君肉桂五錢為臣麝香一錢為佐每服二錢酒調下藥下咽胸次便寬再服知餓三服而巾櫛交接賔客如未病者馬二尹迪菴年五十五以過食鰻肉卷餅心腹脹痛醫不知吐法遽以硝黃下之大便不行脹痛愈甚又用木香檳榔丸繼又有下以大小便承氣者十餘日病益加便既不行食亦不進小水僅點滴又服白餅子五日備急丸三日脹痛遂不可當又服甘遂芫花大戟牽牛之屬三日并小便之點滴亦無矣又灸中腕三十餘壯亦無驗孫至視其色蒼黑神藏不露聲音亮惟腹大如箕不能反側脈之兩手皆滑大尺猶有力曰此病初時食在上膈法當用吐素問云在上者因而越之是也乃誤下傷脾失其健運是以愈下愈脹又以峻利益下之致展轉增劇今先用六君子湯以醒其脾木香砂仁助其運動再用吐法吐出前藥弗慮大便不行獨慮行之不止耳計所服藥硝黃五斤巴豆白餅五兩又加諸標悍之劑幸而藥性未行否則如瓶水底脫傾㵼無餘矣今傷在上中二焦下元未損故兩尺尚有神色蒼氣固根本未動尚可為也服藥後腹中大痛知藥力已至改用人參蘆防風蘆升麻桔梗各三錢煎服少頃用鵝翎探之涌出前藥約十餘碗病者曰目前光矣時已刻謂鵝翎探之涌出宜備人參數斤以待至午刻進至寶丹一帖以溫中氣未申間腹中濁氣下注覺少寬至晚大便行一次小水略通即用參术各五錢炮薑三錢茯苓二錢木香甘草各五分陳皮一錢煎服四鼓又行一次小水亦行次日連㵼十餘次以理中為丸與煎劑兼服脹全消食漸進凡㵼七十二日服參二斤吳九宜每早晨腹痛泄㵼者半年糞色青腹膨脹咸謂脾腎㵼為炙關元三十壯服補脾腎之藥皆不效自亦知醫謂尺寸俱無脈惟兩關沉滑大以為憂疑久㵼六脈皆絶也孫診之曰無恐此中焦食積痰㵼也積膠於中故尺寸隱伏不見法當下反用補誤矣以丹溪保和丸二錢加備急丸三粒五服之更下稠積半桶脹痛隨愈次日六脈齊見再以東垣木香化滯湯調理而安汪氏婦腹大如箕堅如石時或作痛雜治月餘轉脹急小水不通或用溫補下元之劑則脹急欲裂自經求盡脈之兩關洪滑鼓指按之不下乃有餘之候也症雖重可生其致病之由母家常令女奴袖熟雞牛舌之類私授之因數食冷物積冷物積成脹滿誤作虛治宜增劇也乃用積塊丸三下之而脹消積去以保和丸調理一月而愈黃履素曰豫在臨江時誤服厚朴傷中氣之後偶食犬肉一塊遂覺停滯時中氣正虛不敢加山查等藥考本草食犬肉不消煮蘆根汁飲之可消如法煎飲覺右脅下微痛次日大痛殊不可解自是日甚一日坐卧皆妨反側痛如刀右脅下按之有物如雞子方書言右脅痛屬食積痰積有謂須攻治者有謂不宜攻必須助正以消邪者時有醫主攻治謂不治將成痞塊豫以為不然確守助正之説當痛極時不敢服藥靜以守之俟痛小定氣雖痞即用六君子加木香等行氣之藥以漸調之竟得痊可若誤信攻伐不知死所矣張景嶽治一上舍年及三旬因午刻食水煮麵角將至初更食及小腹下至右角間遂停積不行而堅􅊳如拳大如鵝卵其痛之劇莫可名狀察其明係麵積顯而無疑然計其已入大腸此正通則不痛之症也乃與木香檳榔丸其痛如故因疑藥力之緩猶未及病及更投神授丸以㵼之又不妨因謂此藥性皆寒故滯而不行也再投備急丸雖連得大㵼而堅痛毫不為減斯時也張計窮矣因濳思其由不過因麵豈無所以制之今既逐之不及使非借氣以行之不可也且計麵毒非大蒜不殺氣滯非木香不行又其滯深道逺非精鋭之嚮𨗳不能達乃用火酒磨木香令其嚼生蒜一大瓣而以香酒送之一服後覺痛稍減三四服後痛漸止而食漸進而小腹之塊仍在後至半年許始得消盡由是知欲消食滯即大黃巴豆猶有所不能及而推宜行氣為先也且知飲食下行之道乃必由小腹下右角間而後出於廣腸此自古無言及者琇按就此觀之景嶽平生臨症遺憾多矣夫麵角由胃入腸已至少腹之角豈能作痛如是而又如拳如卵耶必其人素有疝病偶因麵食之濕熱發之或兼當日之房勞遂乃決張如是故推蕩之亦不應得木香火酒一𣲖辛熱香竄而痛止耳至謂食由小腹下右角而後出廣腸謂自古無言及者更堪捧腹經謂大小腸皆盤屈十六曲則左旋右轉可知豈如筒如袋而直下乎嘻張路玉治葉某停食感冒兩寸關俱澀數糢糊兩尺皆沉弦按之益堅雖其人尚能行走而脈少沖和此必向有陳氣在少腹詢之果患寒疝數年因婉辭不用藥是夜腹暴滿而逝或問此人小恙何以知其必死曰凡人胃滿則腸虛腸滿則胃虛更實更虛其氣乃居今胸有瘕而腹有積上下俱困能保其不交攻為患乎當知厥痛入腹腳氣沖心等疾皆是陰邪摶結鬱既久則挾陰火之勢而上升若胸中元氣有權則邪下伏今既為宿食填塞逆則上下俱滿正氣無容身之地往往有暴絶之虞所以不便用藥實未知其即死也傷寒論病人素有痞積及病傳入三陰則死謂之臟結蓋新邪與舊邪合併也幼科汪五符夏月傷食嘔吐發熱顱脹自利黃水遍體肌肉捫之如刺六脈糢糊指下似有如無足脛不溫自認陰寒服五積散一劑熱愈熾昏卧不省苐三日利不止時讝語至夜尤甚或以為傷暑與香薷飲遂頭面汗出如蒸喘促不寧足冷下逆或以為大寒而脈息糢糊按之殊不可得以為陽脫之候欲猛進參附或以為陰症斷無汗出如蒸之理脈所虛而症大熱當用人參白虎爭持未決張診之曰六脈如此而心下按之大痛舌上灰刺如芒乃食填中宫不能鼓運其脈往往多此當與涼膈散下之一劑神思頓清脈亦頓起倘投參附其寧免乎癸卯元夕周徐二子過石頑齋頭縱飲次日皆病酒不能起欲得葛花湯解酲張曰此湯雖為傷酒專劑然人稟各有不同周子縱飲則面熱多渴此酒氣行陽明肌肉之分多渴知熱傷胃氣豈可重令開㵼以耗津液與四君子湯去甘草加藿香木香煨葛根澤㵼下咽即愈徐子久患精滑飲則面色愈青此素常肝膽用事腎氣亦傷酒氣皆行筋骨所以不上潮於面葛花胃藥用之何益與五苓散加人參倍肉桂服後食頃溲便如皂角汁而安柴嶼青治中翰陳雯山壯熱神昏為時醫所誤者纍日勢甚危篤診得人迎脈緩自無外感惟氣口洪實舌胎甚厚重按其胸皺眉呼痛此胸中停食屢進發表相去徑庭無怪參增劇也用小承氣湯連下二次即神清熱退而安張飛疇治謝元海夏月常飲火酒致善食易飢半月後腹漸脹滿大便艱澀食亦日減醫用刻削清火俱不效左脈細數右脈澀滯此始為火助胃弦而善食繼為火灼胃液而艱運艱運則食滯食滯而脹滿脹滿則食減今宜斷食辛熱乘元氣未漓袪其滯而回其液日久則費調理也用枳實𨗳滯湯去黃連白术加葛根一服大便通利而滯行又用健脾理氣三日後以小劑生脈加葳𬎼煨葛根半月而愈張三錫治一人發熱頭痛七日不止診之左脈平和右寸關俱弦急有力乃內傷宿食為患也以二陳加枳實厚朴查麯柴胡三劑再加黃芩頭痛除但熱不淨投枳實𨗳滯丸百粒更衣而愈一婦每夜分即發熱天明暫止自投四物湯反加嘔惡診得左關微急而右寸關弦數有力詢之經後食梨午後遂熱起正丹溪所謂胃虛過食冷物抑遏陽氣於脾土之中此病皆因血虛而得者遂以升陽散火湯一服熱已後用四物去地黃加枳术陳皮健脾養血調理而愈張三錫曰余初識繆仲淳時見袖中出彈丸咀嚼問之曰此得之祕傳飢者服之即飽飽者食之即飢因疏其方名資生丸余大喜之而頗不信其消食之功已於醉飽後頓服二丸徑投枕卧夙興了無停滯始信此方之神也許學云有人全不思食補脾罔效授二神丹服之頓能進此即補母法黃魯直用兔絲子淘淨酒浸日挑數匙以酒下之十日外飲啖如湯沃雪亦此理也治法彚張三錫治一人夏食羊肉太多作渴燥煩自謂受暑用涼水調一元散躁渴愈甚診之脈雖滑不鼓隨以鹽湯吐之得生肉碗許乃以二陳加草果肉桂厚朴山查調理而安若用涼藥作暑治立見其斃一人飲茶過度且多憤悶腹中常漉漉有聲秋來寒熱似瘧以十棗湯料黑豆煮晒乾研末棗肉和丸芥子大以棗湯下之初服五分不動又服五分無何腹痛甚以大棗湯飲大便五六行時蓋日晡也夜半乃大下數斗積水而積平當其下時瞑眩特甚手足厥冷絶而復蘇舉家號泣咸咎藥峻嗟乎藥可輕哉一人過食瓜果時值夏月大㵼不止中腕大痛煩渴引飲自服天水散及香薷飲脈之右關寸俱沈伏因作停冷治香砂六君子湯加炮薑厚朴一服痛渴俱止只以胃苓調理而安龔子才治徐通府因好燒酒及五香藥酒過度患吐血唾痰六脈急數此酒毒積熱入於骨髓不受滋補以黃連解毒湯加知母貝母石膏連翹元參花粉葛根瓜蔞桔梗酒蒸大黃早晚服至百日外以六味丸加解毒湯在內與前湯藥並進又百日始瘳後歸田逾年仍為酒困而卒陸肖愚治吳武祖之母少寡長齋稟賦極薄因正啖糯米粉食人誤報武祖不入泮不覺驚而且悶遂成內傷或與消𨗳過多而中滿更甚脈之兩手斷續不勻洞㵼口開頭汗如洗元氣將脫胸中仍不可按脈不足而症有餘宜先補後攻急用附子理中湯二劑汗止㵼減脈稍有根以枳實理中湯進之其積漸覺移動脈亦有神後以潤字丸每服五分以煎劑送之積去身和調理而愈徐小園子新昏多痰脾已受傷又外感遂往來寒熱項強背痛頭疼表裡具在或謂瘧疾遽用截藥因而口渴多食生冷變為吐㵼與柴苓湯不效診之四肢厥逆不省人事面色青黃乃用參附理子加枳實厚朴山查等三劑脈起而內傷之症才現身大熱舌焦芒刺臍上下手不可按四肢濈然汗出下症悉具苐用枳朴熟黃少許加鐵鏽水𨗳之去燥屎三四塊勢未減又與枳朴查連小柴胡加人參少許間四五日進潤字丸五分大便去一次如是八十餘日裡症去六脈有神尚晡時潮熱胃氣不開口乾腹滿前方去參四劑勢又大減或謂傷寒三七不解謂之壞症經云安榖者昌絶榖者亡今將百日粒食不進焉有生理况身不熱舌無胎縱晡時微熱亦是陰虛之故急宜滋陰養血開胃健脾自愈遂服藥一劑又強飲粥湯半盞及龍眼湯一杯是夜仍身體大熱心口作痛異常煩躁舌上有胎再診右關尺沉實仍用枳實黃連卷舒麥芽查朴送潤字丸一錢五分去後極暢諸症頓除改用六君方知飢飽計百三十餘日頭髮落盡年餘未得出門户參附理中烏得舍罪琇按如此治病時醫之説信哉陳孟昭新正赴館偶開别室見一柩心中怦然是晚夢遺次日勉強行文薄暮啖肉麵遂頭疼身熱右脅有塊如碗疼痛寒熱疑為腫毒診之謂內傷兼感不信瘍醫視之外用敷藥內服解毒之劑不效或與投補遂昏冒煩躁譫語如狂再延診脈洪數無倫此誤補故也仍作內傷飲食治之用青皮陳皮枳實厚朴山查黃連等又以麩皮炒尉稍蘇再用潤字丸五分數服宿垢去而痛減改用參术歸芍麥冬陳皮茯苓甘草之類調理月餘而安沈振宇病愈未幾因食饅頭羊肉等物遂胸腹脹滿否塞不通服藥旬餘不效口渴煩躁晡時更甚大便閉結凡硝黃枳朴檳查麻仁青皮紅花歸地芩連遍服而大便不通陸曰大病須以大方治之若拘拘一二錢力量輕薄安能奏捷如玄明粉檳榔必用五錢枳實生地當歸黃芩必用一兩紅花必用三錢另以山查四五兩煎湯代水煎藥臨服必加鐵鏽水半酒杯其垢自行矣如言一劑果腹中運動響聲不絶兩時許下宿垢半桶頓覺爽利調理而痊昔有婆羅門僧東來見食麵者云此大熱何以食之又見食中有蘆蔔云賴有此以解其性自此相傳食麥麵必啖蘆蔔又小説云人有中麥麵毒者夢紅裳娘子悲歌有一丸蘆蔔火吾宫之句醫説續編本草扁鵲云酒飲過腐腸爛胃潰髓蒸筋傷神損夀有客訪周顗頻出美酒二石顗飲石二客飲八斗次明顗無所苦酒量慣也客已死矣觀之客脅穿腸出豈非量過而犯扁鵲之戒與同上王海藏治秦生好服天生茶及冷物積而痼寒脈非沈非浮上下內外舉按極有力堅而不柔觸指突出膚表往來不可以至數名縱橫不可以巨細狀此陰證鼓擊脈也一身遊行之火萃於胸中寒氣逼之搏大有力與真武四逆理中等湯丸佐以白芍茴香酒糊丸使不僭上每百丸晝夜相接八九服凡至半斤作汗而愈亦世罕有也陰症略例醫説續編薛立齋治一人食粽煩悶熱渴大便欲去用消𨗳藥不應以白酒麵炒為末溫酒調服二錢俄頃腹鳴粽下而安一人食水晶團子過多肚服脹痛亦治以此方而愈一人食魚鮓腹痛患痢諸藥不效用陳皮白术等分為末陳米湯下數服而愈一人每食蟹即腹痛用紫蘇濃煎湯一服而安一婦人停食飽悶或用人參養胃湯木香檳榔丸而泄㵼吐痰腹中成塊又與二陳黃連厚朴反加腹脹不食此胃氣虛不能消磨用補中益氣加茯苓半夏五十餘劑脾胃健而諸症痊竇材治一人因暑月食冷物以致胸腹脹悶欲死服金液丹百丸少頃加全真丹百丸即有氣下降而愈一人每飯後飲酒傷其肺氣致胸膈作脹氣促欲死服鍾乳粉五膈散而愈若重者炙中府穴亦好服涼藥則成中滿難治矣一小兒食生杏致傷脾脹悶欲死炙左命關二十壯而愈又服全真丹五十丸一人嗜茶成癖一方士令以新鞋盛茶令滿任意食盡再盛一鞋如此三度自不喫也男用女鞋女用男鞋用之果愈集酒方立齋治一男夏月入房食冰果腹痛用附子理中湯而愈有同患此者不信别用芩連二陳之類而死即上舍徐民則林觀子治一人房欲後逺涉飢渴飲新汲泉水而歸病作醫以解表消中藥與之遂冷逾膝肘外熱躁擾不定掀衣擲被謾語無倫脈寸如蛛絲餘無急以人參薑附入蔥白生薑大劑浸冷灌之得睡躁定去䓤白生薑服數帖得汗脈亦漸服加别藥調理而安朱丹溪治一丈夫因酒多下血肚疼後重成痢滑石半兩連翹黃芩木通白芍枳殼白术各二錢甘草五分桃仁二十一枚分四帖服有人因憂愁中傷食結積在腸胃欲發吐利自冬後至暑月積傷發暴下數日不止玉函云下痢至隔年月日應期而發者此為有積宜下之止用溫脾湯尤佳如難下可佐以乾薑丸乾薑巴豆大黃人參各等分後服白术散白术木香附子人參各等分右細末每二錢水一盞薑三片棗一個煎六分溫服一丈夫酒多病泄久不愈又自進附椒等食不進泄愈多滑石黃芩各半兩乾薑黃連雲皮粥為丸每服百丸許學士治宗室趙彥材下血面如蠟不進食蓋酒病也授紫金丹方服之終劑血止面鮮潤食亦倍常新安一士人亦如是與三百粒作一服立愈膽礬三錢黃蠟二兩大棗五十枚右以砂鍋或銀石器內用好醋三升先下礬棗慢火熬半日取出棗去皮核次下蠟再慢火熬一二時如膏好入蠟茶二兩同和丸如桐子大每服二三十丸茶酒任下孫兆治館職學士張居易嗜酒散涎不為名利拘束忽發熱頭疼俾翰林醫官治之十日愈甚諸學士共議召孫孫至脈之曰餘人皆曰傷寒故作此痰也張學士好酒多痰食所傷也今痰非傷寒而右手脈甚數左手脈平和此必傷酒食而作頭痛宜喫食藥五七丸俟之半日進退決矣孫遂用食藥經食久膈漸寬頭痛遂減再進利膈藥遂獲安大凡陽邪頭疼經十日豈得不變發熱而狂亂故知非傷寒乃食病之過也朱丹溪治胡孺人因喫冷粉與肉頭痛自汗膈痞小便赤用白术二錢半陳皮一錢半木通川芎黃芩各半錢薑水煎熱吞下草豆蔲丸阿魏丸保和丸各五十粒羅謙甫曰丁巳冬豫從軍回至汴梁有伶人李人愛謂豫曰大兒自今嵗七月聞因勞役渴飲涼茶及食冷飯覺心下痞醫投藥一服下利兩行症遂減不數日又傷冷物心腹復痞滿嘔吐惡心飲食無味且不飲食四肢困倦懶於言語復請前醫診視曰此病易為更利幾行即快矣遂以無憂散對加牽牛末白湯服至夕腹中雷鳴而作陳痛少焉既吐又㵼煩渴不止飲食無度不復能禁時發昏憒再命前醫視之診其脈不能措手而退頃之冷汗如洗口鼻氣漸冷而卒矣小人悔恨無及敢以為問豫曰未嘗親見不知所以然既去或曰豫親見之果藥之罪歟而非歟豫曰此非藥之罪乃失其約量之過也夫藥之無據反為氣賊內經云約方猶約囊也囊滿勿約則輸泄方成弗約則神氣弗俱故仲景以桂枝治外傷風邪則曰若一服汗出病瘥停後服不必盡劑大承氣湯下大實大滿則曰得更衣止後服不必盡劑其慎如此此為大戒蓋得聖人約囊之旨也治病必求其本蓋李人以雜劇為戲勞神損氣而其中痛因時暑熱渴飲涼茶脾胃氣弱不能運化而作痞滿以藥下之是重困也加以不慎又損其陽虛而復傷傷而復下陰爭於內陽擾於外魄汗未藏四逆內起仲景所謂一逆尚引日再逆促命期如是則非失約量之過而何故內經戒云上工平氣中工亂脈下工絶氣不可不慎也張子和治一細侣好茶成癖積在左脅曰此與肥氣頗同然痎瘧不作便非肥氣雖病十年不勞一日况兩手沈細有積故然吾治無針灸之苦但小惱一餉可享夀盡期先以茶調散吐出宿茶水數升再以木如意􅀈之又涌數升皆作茶色次以三花神祐丸九十餘粒是夜㵼二十餘行膿水相兼燥糞瘀血雜然而下明日以除濕之劑使服十餘日諸苦悉蠲神色清瑩抄自醫説續編浙東監憲全公每晨先飲阿剌吉十餘杯然後飲常酒至六月大發熱張奕之治用冰攤心腹上冰消復增內飲以藥三日乃愈一富家子二十餘嵗四月間病發熱求趙以德治之脈浮沉無力而虛熱又往來潮熱作無時脈間有力又洪數隨熱進退因知非外感之熱必是飲酒晉毒在內今因房勞氣血之虛而病作問之果在正月間每晨飲阿剌吉喫狗肉一月既得其情遂用補氣血藥加葛根以散酒毒一帖微汗反懈怠熱如故因知是氣血皆虛不禁葛根之散而然也必得雞距則方可解其毒偶得乾者少許加於藥中其熱即愈藥要或問同上唐生者病因飲酪水及食生物下利紫黑血十餘行脾胃受寒濕毒與六神平胃散半兩加白术三錢以利腰臍間血一服而愈周子固治王經厯患身輕飄飄若行空虛中易醫凡七十人皆以為風虛與熱劑轉加周曰此酒毒也即以寒涼之劑驅之隨愈九靈山房集張子和一酒病人頭痛身熱惡寒狀類傷寒診其脈兩手俱洪大三兩日不圊以防風通聖散約一兩水一中碗生薑二十餘片蔥二十莖豆豉一大撮同煎三沸去柦稍熱分作二服先服一服多半須臾以叉股探引咽中吐出宿酒香味尚然約一兩掬頭上汗出如洗次服少半立愈內經曰火鬱發之發謂汗之令其疏散也朱丹溪治一飲酒人胸大滿發熱夜譫語類傷寒右脈不如左大與補中益氣湯去黃耆柴胡升麻加半夏以黃耆補氣柴胡升麻又升故去之服後病愈因食涼物心痛於前藥中加草豆蔲數粒愈治法立齋治曺銓因飲法酒肛門腫痛便祕脈實服荆防敗毒散不應用黃連內疏湯而愈張子和治蘇郡丞秦水心初有中氣虛寒之症兼以案牘叢脞應酬紛擾遂致疲倦食少肌表微熱不能治事召診始而用溫繼而用補其後每劑加參至兩許附至三錢然後飲食大進精神煥發復因湯液久而苦口則更製丸劑常服大抵不外扶陽抑陰之義忽一日諸症復發視前較甚加之自汗頭暈懶於語言亟延診首訊昔日大劑溫補煎方蓋謂丸劑緩而無濟也診畢曰證即前日之症藥非前日之藥是殆勞神動怒之後復為飲食所傷致令當納受者不納受當運化者不運化實熱滯於太陰陽明兩經此王安道所謂飲食勞倦之中仍有有餘不足今非昔比參附斷斷不可沾唇者惟宜清𨗳消熱耳詢之果然遂如法治之而愈所以知秦之病者其脈左關獨大而氣口緊盛倍常左關獨大者肝主勞與怒也氣口緊盛非食而何藉若膠柱前方實之咎其何能免顧開一內人以傷食飽悶求治診其脈氣口初非緊盛而反得虛微察其症雖若胸次有物而神氣殊短正符東垣飲食勞倦之説宜補正以祛邪即用六君子健脾佐以薑桂等味助中焦熟腐水榖一二劑後腹脹寬舒忽又以脾㵼告沈曰服補得㵼此元氣勝而滯氣消君子進而小人退之機也改用補中益氣數劑脾瀉即止飲食如常聶久吾曰一侍婢停食腹痛先用消𨗳藥略加發散一劑其痛未減因用炒鹽湯服二碗吐之其痛減半又用發散為主加消𨗳一劑其痛立止因悟寒邪停食作痛散其寒氣則食自消而痛自止自後依此施治無不神效消張子和曰初虞世言凡渴疾未發瘡瘍便用大黃寒藥利其勢使大困大虛自勝如發瘡瘍膿血流漓而飱此真俗言也故巴郡太守奏三黃丸能治消渴余嘗以隔數年不愈者減去朴硝加黃連一斤作兩劑以長流千里水煎五七沸放冷日呷之數百次以桂苓甘露散白虎湯生藕節汁淡竹􅅹生地黃汁相間服之大作劑料以代飲水不日而痊故消渴一症調之而不下則小潤小濡固不能殺炎上之勢下之而不調亦旋飲旋消終不能沃鬲膜之乾下之調之而不減滋味不戒嗜欲不節喜怒病己而復作能從此三者消渴亦不足憂矣昔有消渴者日飲數斗劉完素以生薑自然汁一盆置之密室中具罌杓於其間使其人入室從而鎖其門病人渴甚不得己而飲減盡渴減得內經年以潤之之旨又內經治渴以蘭除其陳氣亦辛平之劑也劉完素之湯劑雖用此一味亦必有傍藥助之也秦運副云有人消渴引飲無度或令食韭苖其渴遂止法要日喫三五兩或炒或作羮無入鹽極效但喫得十斤即佳過明日勿喫食醬無效本草苦楝根新白皮一握切焙入麝少許水二碗煎至一碗空心飲之雖困頓不妨自後下蟲三四條狀如蛔蟲其色真紅而渴頓止乃知消渴一症有蟲耗其津液者醫説續編渴鄂渚辛祐之患消渴九年服藥止而復作蘇朴教以白芍甘草等分為末每用一錢水煎服七日頓愈古人處方殆不可曉不可以平易而忽之也經驗方陳日諸家本草朱丹溪治徐兄年四十嵗口乾小便數春末得之夏來求治診其兩手左澀右略數而不強重取似大而稍有力左稍沈略弱而不弦然澀却多於右喜兩尺皆不甚起此由飲食味厚生熱謂之痰熱禁其厚味宜降火以清金抑肝以補脾用三消丸十粒左金阿魏丸各五粒以薑湯吞下一日六次又以四物湯加參术陳皮生甘草五味麥冬煎服一日三次與丸藥間服一二日自覺清快小便減三之二口亦不乾止渴未除頭暈眼花坐則腰疼遂以摩腰膏治腰疼仍以四物湯用參耆減川芎加牛膝五味炒柏麥冬煎飲調六一散服及覺便多遂去六一散令仍服丸藥而安薛立齋治一貴人病疽疾未安而渴作一日飲水數升教服加減八味丸方諸醫大笑云此藥能止渴我輩當不復業醫矣皆用木瓜紫蘇烏梅人參茯苓百藥煎等生津液之藥止之數劑而渴愈甚不得已用前方服三劑渴止因相信久服不特渴疾不作氣血亦壯飲食加倍強健過於少壯之年薛氏家藏丹方屢用有驗竇材治一人頻飲水而渴不止曰君病是消渴也乃脾肺氣虛非內熱也其人曰前服涼藥六劑熱雖退而渴不止覺胸脅氣痞而喘竇曰前症止傷脾肺因涼藥復損元氣故不能健運而水停心下也急灸關元氣海各三百壯服四神丹六十日津液復生方書皆作三焦猛熱下以涼藥殺人甚於刀劒慎之楊賁亨鄱陽人博羣書精脈理每心計造方有患飢者諸醫以火症治亨久思之未得頃見堂上木凳自仆乃為濕氣所蒸致朽忽悟水能消物不獨屬火此濕消耳遂投熱劑而愈江西通志孫文垣治一書辦年過五十沉緬酒色忽患下消之症一日夜小便二十餘度清白而長味且甜少頃凝結如脂色有油光治半年無效腰膝以下軟弱載身不起飲食減半神色大瘁脈之六部而無力經云脈至而促按之不鼓諸陽皆然法當溫補下焦以熟地黃六兩為君鹿角霜山茱萸肉各四兩桑螵蛸鹿角膠人參白茯苓枸杞子逺志兔絲山藥各三兩為臣益智仁一兩為佐大附子桂心各七錢為使煉蜜為丸梧桐子大每早晚淡鹽湯送下七八十丸不終劑而愈或曰凡消者皆熱症也今以溫補成功何故曰病由下元不足無氣升騰於上故渴而多飲以飲多小便亦多也今大補下元使陽氣充盛熏蒸於上口自不乾譬之釡蓋釡雖有水必釡底有火蓋潤而不乾也一人消中日夜溺七八升鹿角燒令焦為末以酒調服五分日三服漸加至方寸七一人不時發熱日飲冰水數碗寒藥二劑熱湯益甚形體日瘦尺脈洪大而數時或無力王太僕曰熱之不熱責其無火又云倐熱往來是無火也時作時止是無水也法當補腎用加減八味丸不月而愈張路玉治趙雪訪消中善食日進膏粱數次不能敵其飢勢丙夜必進二餐食過即昏昏嗜卧或時作酸作甜或時夢交精泄或時經日不飲或時引飲不輟自言省試勞心所致前所服皆安神補心滋陰清火之劑不應察其聲音濁而多滯其多滯其形雖肥盛色蒼而肌肉綿軟其脈六部皆洪滑而數惟關特甚兩尺亦洪滑而按之少神此腎氣不充痰濕挾陰火泛溢於中之象遂與加味𨗳痰加蘭香數服其勢大減次以六君子合左金枳實湯泛丸服後以六味丸去地黃加鰾膠蒺藜平調兩月而愈朔客白小樓中消善食脾約便難察其形瘦而質堅診其脈數而有力時喜飲冷氣酒此酒之濕熱內藴為患遂以調胃承氣三下破其藴熱次與滋腎丸數服滌其餘火遂全安粵客李之藩上消引飲時當三伏觸熱到吳初時自汗發熱煩渴引飲漸至溲便頻數飲即氣喘飲過即渴脈之右寸浮數動滑知為熱傷肺氣之候因以小劑白虎加人參三服勢頓減次與生脈散調理數日而痊薛亷夫子強中下消飲一溲二因新娶繼室真陰灼爍虛陽用事陽強不倒恣肆益甚乃至氣息不續精滑不收背曲肩隨腰胯疼軟足膝痿弱寸步艱難糜粥到口即厭惟喜膏粱方物其脈或數大少力或弦細數疾此陰陽離決中空不能主持而隨虛火輒內輒外也與八味腎氣保元獨參調補經年更與六味地黃久服而痊邵某仲夏與婢通因客至驚恐精氣大脫即凜凜畏寒翕翕發熱畏食畏飲小便淋􅅹不禁診之六脈弦細如絲青青如循刀刃此腎中真陽大虧之候令服生料六味加桂附以通陽氣咸謂夏暑不宜桂附另延醫峻用人參附子月餘飲食大進猶謂參附得力恣餌不徹遂至日食豚蹄雞鴨七八餐至夜預治熟食飽啖二次如兩月餘形體豐滿倍常但苦時時嘈雜易飢常見青衣羣鬼圍繞其側再邀診其脈滑數有力而右倍於左察其形色多滯且多言多笑而語無倫次此味痰壅塞於中復加辛熱助其淫火始本陰虛未傳消中之患也不急祛滌必為狂癡之患為製涌吐之劑遲疑不進未幾忽大呌發狂妄見始信言之非謬也許學士云一卒病渴日飲水斗許不食者三月心中煩悶時已十月豫謂心經有伏熱與火府丹數服越二日來謝云當日三服渴止又三服飲食如故此本治淋用以治渴可謂通變也生地木通苦芩見婦人良方陸祖愚治李悅吾年五十餘患消渴症茶飲不能輟口小便多而數殊不欲食及食後即飢病將一載精神困怠肌膚枯澀自分必死脈之沉濡而澀曰病尚可藥凡人身之津液以火而燥然必以氣化而生前醫純用清涼滋潤之品所以不效潔古云能食而渴者白虎倍加人參大作湯劑多服之不能食而渴者錢氏白术散倍加乾葛亦大作劑服之今不能食反食即飢當合二方加升麻佐葛根以升清陽之氣少用桂附以合從治之法每味數兩大砂鍋濃汁禁湯飲以此代之此病仲景謂春夏劇秋冬差今當盛夏病雖不減亦不劇若依法治之兼絶厚味戒嗔怒閉關靜養秋冬自愈幸其能守戒忌交秋即瘥秋末全愈陸養愚治兩廣制府陳公年近古稀而多寵婢且嗜酒忽患口渴茶飲不輟而喜熱惡涼小便極多夜尤甚大便祕結必用蜜𨗳日數次或一塊或一二塊下身軟弱食減肌削所服不過生津液潤燥清涼而已脈之浮按數大而虛沈按更無力曰症當溫補不當清涼問消本熱症而用溫補何也曰經謂脈至而促按之不鼓諸陽皆然今脈數大無力正所謂促而不鼓無陽脈也以症論之口渴而喜熱飲便祕而熱偏多皆無陽症也曰將用理中參附乎曰某所欲溫補在下焦而非上中二焦也經曰陽者從陰而極起也又曰腎為生氣之原今恙由於腎水衰竭絶其生化之原陽不生則陰不長津液無所兼以出故上渴而多飲下燥而不潤前無以約束而頻多下無以轉輸而艱祕食減肌削皆下元不足故也曰豫未病時陽已痿病後從不近女色腎未必衰竭曰腎竭於未病之前痿是腎竭明驗既痿之後雖欲竭而無從矣彼雖不悅而心折其言遂委治之乃以八味丸料加益智仁煎人參膏糊丸每服五錢白湯送下日進三服數日溺少十日溺竟如常大便尚燥每日一次不用蜜𨗳矣苐口渴不減食尚無味以升麻一錢人參黃耆各二錢煎湯送丸藥數服口渴頓止食亦有味又十日諸症全安薛立齋曰一男子作渴日飲水數碗冬月亦然彼用加減八味丸去肉桂服之不應一男子患此欲治以前丸彼謂肉桂性熱乃服知柏等藥渴不止背發疽而殁一男子亦患此症漸消瘦與前丸數服渴減半一劑而痊再劑形體復壯夫肉桂腎經藥也前症乃腎經虛火炎上無制為患用肉桂𨗳引諸藥以補之及引虛火歸原故效一男子腳面發疽愈而作渴以前丸治之而愈一富商稟賦頗厚素作渴日飲水數碗面發一毒用消毒藥潰而雖愈尺脈尚數渴亦不止時孟秋謂此火旺水涸之脈也須服加減八味丸以補腎水制心火庶免疽毒之患彼不信至夏果腳背發疽脈數按之則澀而無力足竟黑腐而死一男子稟頗實乏嗣服附子等藥致作渴左足大指患疽色紫不痛脈亦數而澀亦死大抵發背腦疽腫痛色赤水衰火旺之色尚可治若黑若紫火極似水之象也乃腎水已竭精氣固涸決不治外科精要云凡病疽疾之人多有既安之後忽發渴疾而不救者十有八九疽疾將安而渴疾已作宜服加減八味丸既安之後而渴疾未見宜先服之以防其未然薛兒時聞其父云一士夫病渴疾諸醫皆用渴藥纍載不痊有一名醫教服加減八味丸不半載而愈一老人冬月口舌生瘡作渴心脈大而實尺脈大而虛此下消症也患在腎須加減八味丸補之否則後發疽難療不信仍服三黃等藥降火次年夏果患疽而殂東垣曰膈消者以白虎加人參湯治之中消者善食而瘦自汗大便硬小便數脈訣云口乾饒飲水多食亦飢虛成消中者調胃承氣湯三黃丸治之下消者煩躁引飲耳輪焦乾小便如膏又云焦煩水易易虧此腎消也六味地黃丸治之總録所謂未傳能食者必發腦疽背瘡不能食者必傳中滿鼓脹皆謂不治之症潔古老人分而治之能食而渴者白虎加人參湯不能食而渴者錢氏白术散倍加葛根治之上中既平不復傳下消矣前人用藥厥有旨哉或曰末傳瘡疽者何也此火邪盛也其瘡痛甚而不潰或赤水者是也經云有形而不痛陽之類也急攻其陽無攻其陰治在下焦元氣得強者生失強者死一婦人面患毒焮痛發熱作渴脈數按之則實以涼膈散二劑少愈以消毒藥數劑而平一男子肩患疽作渴脈數有力以黃連解毒湯三劑而止更以仙方活命飲四劑潰而愈一男子潰而煩渴以聖愈湯二劑而寧以人參黃蓍當歸地黃四劑渴止以八珍湯二十劑而愈大抵潰後有此症屬氣血不足須用參耆以補氣歸地以養血若用苦寒之劑必致有誤一男子患毒作渴右關脈數以竹葉黃耆湯治之而愈更以補中益氣湯加黃芩而痊一男子潰後口乾遇勞益甚以補中益氣湯加五味麥冬治之而愈更以黃耆六一湯而斂耆六草一繆仲淳治湖州庠友張時泰正月間驟發齒痛十餘日而愈四月間焦勞過多齒痛大作醫用石膏知母等藥不效用刀去齒間紫血滿口齒痛不可忍齒俱搖動矣至六七月間飲食益多小便如注狀如膏肌肉盡削至十一月身不能起冬末用黃耆地黃等藥稍能起立然善食易飢如故小便如膏亦如故今年二三月愈甚亦不服藥齒痛如故當門二齒脫落復加口渴晝夜不止此中下二消症也為立方未數劑而瘳麥冬蘆根各五兩五味黃連各三錢黃耆五錢生地六錢天冬一兩用繅絲湯十碗煎二碗不拘時服丸方於前藥中加黃柏三兩牛膝五兩沙參六兩枸杞四兩五味六兩蜜丸常服遂不復發張景嶽治省中周公山左人也年逾四旬因案牘積勞致成羸疾神困食減時多恐懼自冬徂夏通夕不寐者半年有餘而上焦無渴不嗜湯水或有所飲則沃而不行然每夜必去溺二三升莫知其所來其半皆膏濁液尫羸至極自分必死診之脈猶帶緩肉亦未脫知其胃氣尚存慰以無慮乃用歸脾湯去木香及大補元氣煎之屬一以養陽一以養陰出入間用至三百餘劑計人參二十斤乃得全愈此神消於上精消於下之症也可見消有陰陽不得盡言為火自來選抄入喻嘉言曰友人病消渴後渴少正反加燥急足膝痿弱豫主是丸白茯苓丸加犀角有醫曰腎病而以黃連犀角治心母乃倒乎豫曰腎者胃之關也胃熱下傳于腎則關門大開心之陽火以直降於腎心火灼腎躁不能需豫用犀角黃連對治其下降之陽光寧為倒乎服之果效再服六味地黃丸加犀角而肌澤病起矣沈效兄抄本胡天敘年五旬素豪飲而多思慮自弱冠後即善病近則兩足及臂常時痺痛甚則肝腎之氣上逆或致暈厥汗出不寐齒痛齦露夜卧陽事暴舉時時夢遺面有油光楷去復爾脈之兩手俱豁大關前尤搏指據症脈乃二陽之病發心脾今已傳為風消矣詢其小便云頗清白令以器貯逾時觀之果變稠漿面結腐皮遂恐甚告以平昔洪飲縱欲勞神數十年來所服桂附純陽之藥不可勝計未知尚能愈否曰幸未至息賁但能斷飲絶欲多服養榮之劑尚可為也今病但有春夏而無秋冬非兼清肅之治不可乃與生熟地杞子麥冬沙參地骨知母黃柏黃連石膏出入增減十餘劑諸症漸平唯齒痛轉甚自製玉帶膏貼之而愈次年因診其媳産病告以前方出入常服計用石膏不下四五斤矣此則初為寒中後為熱中之變症也然初之桂附未為癰疽豈非天幸乎哉黃疸黃疸之病當以十八日為期治十日已上宜瘥反劇為難治竇材治一人遍身皆黃小便赤色而澀炙食竇穴五十壯服薑附湯全真丹而愈沈以濳葛可久俱神醫也一日有老嫗患黃疸詣沈求治曰吾固未之能薦於葛葛延沈飲以針針其左右乳下而與沈飲者頃刻時出啓左針而左半身肉色瑩然啓右針而右半身肉色如左潄石間談張子和治一男子作贅偶病疸善食而瘦四肢不舉面黃無力其婦翁欲棄之其女子不肯曰我已生二子矣更適他乎翁本農者召壻意欲作勞見其病甚每日辱詬教之餌膽礬丸三稜丸了不關涉針灸祈禳百無一濟張見之不診而療使服涌劑去積痰宿水一斗又以㵼水丸通經散下四五十行不止命以冰水一盂飲之立止服平胃散等間服檳榔丸五七日黃退力生蓋脾疸之症濕熱與宿榖相搏故也俗謂之金勞黃周黃劉三家各有僕病黃疸張曰僕役之職飲食寒熱風暑濕寒尋常觸冒恐難調攝虛費治功其二家留僕於張所從其飲餌一僕不離主人熱役三人同服苦散以涌之又服三花神祐丸下之五日之間果二僕愈一僕不愈如其言一女病黃遍身浮腫面如金色困乏無力不思飲餌惟喜食生物泥煤之屬先以苦劑蒸餅為丸涌痰一碗又以舟車丸通經散下五七行如墨汁更以𨗳飲丸磨散氣數日肌肉如初趙君玉病發遍身黃往問醫者醫云君乃陽明症公等與麻知幾皆受訓於張戴人是商議吃大黃者難與論病君玉不悅歸自揣無别病乃取三花神祐丸八十粒服之不效乃悟曰豫之濕熱盛矣此藥尚不能動以舟車丸濬川散作劑大下一斗糞多結者一夕黃退君玉由此益信戴人之言張仲文治一婦人年六十嵗病振寒轉栗足太陽寒水也呵欠噴嚏足少陽膽也口亡津液足陽明不足也心下急痛而疸手少陰受寒足少陰血滯也身熱又欲近火熱在皮膚寒在骨髓也臍下惡寒丹田有寒渾身黃及睛黃皆寒濕也餘症驗之知其為寒溺黃赤而黑又頻數乃寒濕勝也病來身重如山便著床枕者陰濕盛也其脈右手關尺命門弦細按之洪而弦弦急為寒加之細者北方寒水雜以緩甚者濕盛出黃色脈洪大者心火受制也左手又按之至骨舉手來實者壬癸腎旺也六脈按之但空虛者下焦無陽也用藥法先宜以輕劑去其寒濕兼退其洪大之脈以理中加茯苓湯投之朱丹溪治一婦人年二十八嵗發黃脈澀經水自來不行身體倦怠未曽生子用陳皮白术木通各一兩黃芩歸頭丹皮各半兩甘草一錢分作十二帖水煎食熱服一人年二十嵗因勞又冒雨得疸症腳痠心悸口苦力弱尿黃脈浮而數病在表宜解外黃耆三錢白术蒼术各一錢陳皮蘇葉木通各五分山梔炒二錢甘草稍些白水煎服下保和十五丸與點抑青各十丸溫中二十丸而愈一婦人年三十面黃腳痠弱口苦喜茶月經不勻且多倦怠用黃耆甘草各三錢人參當歸白芍各一錢木通陳皮各五分白术一分炒柏秦芁各二分一婦年六十面黃倦甚足痠口苦脈散而大此濕傷氣也白术半兩陳皮四錢蒼术木通黃芩各三錢人參川芎各二錢黃柏炒一錢甘草炙五分分六帖水煎食前服王官人痞後面黃腳痠弱倦怠食飽氣急頭旋黃耆甘草木通各二分白术一錢半厚朴陳皮蒼术各一錢黃柏炒三分水煎服成庚五官面黃腳痠無力食不化脈虛而少弦口苦肚脹宜補之人參木通各三分白术一錢五分當歸白芍川芎陳皮蒼术各五分甘草二分水煎下保和丸四十丸孫文垣治一人因冒雨勞力汗出又以冷水澡浴因發熱口渴心與背脹痛小水長而赤舌胎黃不眠目如金皮膚盡黃或謂年髙不敢與治診得左脈浮數熱右濡弱濕皆七至濕熱相併此濕熱發黃症也病雖重年雖髙猶可為以柴胡三錢太重否酒芩葛根青蒿香薷花粉各一錢人參七分甘草五分連進二劑得微即能次早熱退其半舌稍淡潤身黃未退胸膈餘熱作煩以竹茹青蒿葛根各一錢人參麥冬花粉知母各八分白芍六分二帖熱退食進精神陡長後與補中益氣湯加青蒿麥冬花粉十帖黃頓痊一人患酒疸遍身皆尿如柏汁目如金汗出沾衣如染胸膈痞悶口不知味四肢痠軟脈濡而數以四苓散加厚朴陳皮山查麥芽葛根倍青蒿水煎臨服加萱草根自然汁一小杯四帖頓愈一人病後身面俱黃吐血成盆熱鬱陽明諸藥不效用螺十個水漂去泥搗爛露一夜五更取清服二三次血止黃愈小山怪症方本草綱目外臺祕要治三十六黃急救方用雞子一顆連殼燒灰研酢一合和之溫服鼻中蟲出為效身體極黃者不過三枚神效柴嶼青治覺羅諱瑪德夫人病疸醫投茵陳五苓散未效又合末藥服之肌膚白眼皆如金色轉致不思飲食右關緩弱特甚柴曰胃為水榖之海脾為倉廩之官府藏失職濕熱滋甚今惟有調其土能健運濕熱自去不必治疸而疸自愈矣用六君子湯加厚朴炮薑以溫中神麴麥芽以助戊巳之化不數劑而全愈東垣曰戊申春一婦人六十嵗病振寒戰栗太陽寒水客也呵欠噴嚏足少陽溢口亡津液足陽明不足也心下急痛而痞手足陰受寒也故急痛足太陰血滯為痞身熱近火熱在皮膚寒在骨髓亦拒寒戰栗也臍下惡寒丹田有寒也渾身黃而白睛黃寒濕也以餘症推之知其寒也溺黃赤而黑頻數寒濕盛也自病來身重如山便著牀枕至陰濕盛也其脈診得左右關并尺命門中得弦而急極細雜之以洪而極緩弦急為寒加之以細細者北方寒水雜以緩甚者濕勝出黃色也又洪大者心火受制也左骨按之至骨舉止來實者壬癸俱旺也六脈按之俱空虛者下焦無陽也先以輕劑去其中焦寒濕兼退其洪大脈理中湯加茯苓是也水煎冰之令寒服之謂之熱因寒用假寒以對足太陽之假熱也以乾薑之卒熱以㵼真寒也故曰真對真假對假若不愈當以术附湯冰之令寒以補下焦元氣也試效方醫説續編陸祖愚治潘巨源食量煩髙恣肆大嚼因勞役失飢傷飽每患脾胃之症或嘔或㵼恬不介意後成黃疸用茵陳五苓散治之而痊仍前飲食不節疸症復作人傳一方以苦藥葫蘆酒煮服之即效試之果然仍力疾生理後試之至再至三周身熏黃肚腹如鼓而卒薛立齋治大司徒李蒲汀南吏部少宰時患黃疸當用淡滲之劑公尚無嗣猶豫不決曰有是病而用是藥以茵陳五苓散加芩連山梔二劑而愈至辛卯得子應天王治中遍身發黃妄言如狂苦於胸痛手不可近此中焦畜血為患用桃仁承氣湯一劑下瘀血而愈又太守朱陽山弟下部畜血發狂用抵當湯而愈馬元儀治沈王格患疸症一身及面目悉黃微見黑滯煩渴腹滿脈之左弦數右空大此內傷發黃為厥陰肝木太陰脾土二藏交傷之候也夫肝鬱則生熱脾鬱則生濕濕熱交爭而煩渴腹滿發黃之症生矣至黑色兼見於面則并傷其腎汗之下之非其治也宜平肝之亢扶土之虛兼解鬱熱以清氣道除濕蒸而和中氣用人參三錢白术二錢白芍一錢黃連山梔七分歸身丹皮茵陳秦芁各一錢柴胡七分炙草五分半麴一錢服三十劑而痊顧奉常務逺目黃脾氣弱仲淳疏方用茵陳三錢人參三錢薏苡仁三錢蓮肉三錢木通八分黃連酒炒一錢山梔炒八分白术土炒一錢石斛酒蒸三錢皆治疸之劑以事冗未服既而身目皆黃小便亦赤乃服仲淳先見飲前藥稍愈一按摩者投以草汁藥酒脾敗遂不起臨殁下瘀血數升亦畜血症也以其年邁不絶欲故爾前方尚有茯苓二錢廣筆記施靈修乃兄七年前曽患疸症服草藥愈後復發坐多氣多勞故草藥不效服田螺發脹一日夜大作寒熱因發渴小便如油眼目黃且赤手足黃紫仲淳以瘀血發黃服後藥大小便通黃及渴俱減橘紅一錢五分紅麯炒研二錢山查五錢鬱金汁十五匙薏苡六錢木瓜三錢牛膝五錢五分麥冬五錢車前二錢五分赤苓三錢通草五分白芍酒炒四錢竹茹二錢河水二鍾煎八分飢時服三日後加人參三錢廣筆記徐環薇年三十餘病疸服山梔茵陳五苓六一之劑將兩月不效脈之弦細而駛面目爪甲俱淡黃語言遲倦謂之曰君以黃疸求治此其餘症耳今病成勞損矣乃竦然曰誠有之近來夜卧不寧晚即發熱黎明始退咳嗽痰稀腰膝疼痛然治之當奈何曰病緣陰虛火盛肝熱久鬱移其所勝故食少便溏發為黃症與酒榖諸疸為濕熱熏蒸者不同乃服苦寒滲利重傷其陰致成勞損今宜峻養肝腎俾嗽止熱退食進便調而黃自消矣與集靈膏加減十餘劑諸症漸瘳黃亦愈矣金魯瞻年四十餘館於時醫湯靜公宅病疸諸治不效已厯數醫最後一人與草頭方四味中有六月雪餘忘之矣服之增劇脈之軟弱無神略數外症目黃如橘面額則黃而黑黯腹大臍凸便溏食少動則氣促知為脾腎兩虧近乎女勞一症乃疸中最難治者也與熟地山藥各一兩杞子棗仁苡仁各五錢彼疑太補待以問湯湯老醫也謂曰方極是苐吾輩素不用此姑試之一劑減二劑又減再診脈漸起仍前方八劑全愈朱天一年二十餘喜食糖及燥炙糕餅忽病黃面目如金脈之兩關數實有力尺滑大便六七日不行小便黃澀此敦阜太過燥熱所鬱如以素瓷覆火其色必黃非濕症也與小承氣湯加當歸白芍一劑便行而瘥赤丹又名風疸又名赤遊風又名赤瘤孫思邈曰貞觀七年三月豫在內江縣飲多至夜覺四體骨肉疼痛至曉頭痛額角有丹如彈丸腫痛至午通腫目不能開經日幾斃豫思本草藝苔治風遊丹腫遂取葉搗傅隨手即消其驗如神亦可搗汁服之一云無葉用子研代之張子和治黃氏小兒面赤腫兩目不開以排針刺輕砭之除兩目尖外亂刺數十針出血乃愈此法人多不肯從必欲治病不可不謹護朱丹溪治一中年男子癰潰後發熱乾嘔背發丹熛用諸般敷貼丹熛藥乃用刀於個個丹頭出血皆不退後半陳生薑加補劑治嘔不效遂純用參半兩歸术各一錢五分濃煎一貼嘔止二三貼丹漸緩熱漸減約五十餘貼熱始除神氣始復鮑允中年五十嵗風丹癢甚腹微疼咽不利面身微腫五六日不退兩寸脈滑大實右浮大左浮弦小以炒芩炒連四物桔草黍粘紫葳各一錢防風黃耆各半錢凡五六帖而安黃師文治一婦人苦風丹每酒沾唇則風丹重迭而起癢刺骨殆不可活令服五積散約數服以杯酒試之如其言飲酒已丹不作德昭一婢亦苦風丹亦以此聞其説遂服五積散亦瘥又師文用五積散治産㵼有奇功北忩炙輠薛立齋治一婦人素清苦因鬱怒患遊風晡熱內熱自汗盜汗月經不行口乾咽燥此鬱氣傷脾乃以歸脾湯數劑諸症稍退後兼逍遙散五十餘劑而愈一婦人患此性躁寒熱口苦脅痛耳鳴腹脹溺澀乃肝脾血虛火旺也用六君加柴胡山梔龍膽數劑更與逍遙散兼服漸愈又與六味丸逍遙散七十餘劑諸症悉退一婦人患前症誤服大麻風藥破而出水煩渴頭暈誠類風症六脈洪數心脾為甚曰風自火出此因怒火脾胃受邪血燥而作非真風症也與逍遙散六味丸以清肝火滋脾血生腎水而愈一婦人患前症久不愈食少體倦此肝脾虧損陰虛發熱也先用補中益氣湯加川芎炒梔元氣漸復更以逍遙散而瘡漸愈一婦人患赤逰風晡熱癢甚用清肝養血之劑不信乃服大麻風藥臂痛筋攣又服化痰順氣之劑四肢痿弱又一婦患前症數用風藥煎湯泡洗以致腹脹並歿一女子十五嵗患瘰􅐇赤暈形氣倦怠此肝火血虛所致用加味逍遙散而赤暈愈用益氣湯六味地黃丸而瘰􅐇消一婦人身如丹毒搔破膿水淋漓熱渴頭暈日晡益甚用加味逍遙散而愈續名醫類案卷十二
