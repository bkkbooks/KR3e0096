body:
  text: 續名醫類案卷二十五錢塘魏之琇撰腹痛周漢卿治永康人腹疾痀僂行卿解衣視之氣衝起腹間者二其大如臂刺其一砉然鳴又刺其一亦如之加以按摩疾遂愈明史薛立齊治一婦人小腹脹痛小水不利或胸乳作痛或脅肋作脹或氣逆心吻薛以為肝火而血傷脾用四物柴胡青皮元胡索木香而愈一婦人久患腹痛去瘀血方止而復大痛諸藥不納薛以脾胃之氣虛寒用參术炮薑丸如黍每用數粒津咽下後以二味濃煎漸呷而愈通府張孟威云其妹小腹痛服附子理中湯附子服過八十餘枚此乃沈寒痼冷之甚不多有者壬午仲冬金臺一男子患腹痛誤服乾薑理中丸即時口鼻出血煩躁發狂入井而死二條俱見薛案龔子才治一婦人臍腹疼痛不省人事只一劑立止人不知者云是心氣痛誤矣方用白芍五靈脂木通去皮三味等分每服五錢水醋各半煎至七分去渣溫服此瘕痛也李北川仲夏患腹痛吐㵼兩手足捫之則熱按之則冷外假熱內真寒之證其脉輕診則浮大重診則微細外假熱內真寒之脉此隂寒之症也急服附子理中湯不應仍服至四劑而愈汪石山治大坑方細形瘦年三十餘忽病腹痛磊塊起落如波浪然晝輕夜重病在血分可知醫用木香磨服及服六君子湯皆不驗診其脉浮緩弦小重按似澀曰此血病也前藥作氣治謬矣彼謂血則有形發時雖有塊磊痛減則消而無迹非氣而何此難亦不可少蓋不知有形者血積也無形者血滯也滯視積略輕耳安得作氣論耶若然則前藥胡為不驗遂用四物湯加三棱蓬术乳香沒藥服之其痛遂脫然本傳孫文垣治嚴印老長媳腹痛有小塊畾畾然腹覺冷甚兩寸關皆滑數兩尺沈微此脾氣弱而飲食不消又當秋令濕淫之候不痢亦㵼冝預防與白术蒼术茯苓甘草白豆仁木香半夏陳皮澤㵼煎服其夜果㵼一度次早又㵼一度小腹仍疼且裏急後重蓋其稟賦素虛當補中兼消兼利白芍三錢桂心一錢甘草人參茯苓澤㵼陳皮白术各八分升麻葛根各六分服後脉皆軟弱不滑畾塊亦消改以人參黃耆白术白芍各二錢炙甘草陳皮澤㵼葛根柴胡茯苓各一錢調理而安張道南內人以飲食忤於氣因腹痛不飲食五日矣兩寸關弦尺滑孫曰此上焦氣虛下有鬱滯也以薑黃青皮為君山查檳榔當歸杏仁烏藥枳殼為臣柴胡木香為佐吳茱茰為使服後氣稍順然後用葱二斤煎湯浴洗腰腹即將熱葱擦摩使氣通透鬱滯外治法洗畢即安卧少頃其夜大便通先下皆黑硬結塊後皆清水此積滯行而正氣虛也以建中湯加山查茯苓澤㵼柴胡香附薑連調理而痊李士材治一人鬱怒之餘胸腹脹痛先服消痰踈氣化食之劑不效更以人參補之亦不效診之六脉弦而數此內有鬱熱為寒涼飲食壅之而痛用黃連三錢梔子一錢五分橘紅白豆蔲各二錢鉤藤木香各八分官桂二錢加薑汁半鍾二劑痛止四劑後加乾薑人參而霍然焦太史當臍切痛作氣食療之無功李診之曰當臍者少隂腎之部位也況脉沈而弱與氣食何干非徒無益反害真元以八味丸料煎飲不十日而痊胡京卿少腹作痛連於兩脅服踈肝之劑一月以來日甚一日李診之左關尺俱沈遲治以理中湯加吳茱茰一劑知十劑起矣柴嶼青治廣撫諱蘇昌將赴瀋陽京兆任時伊嫂腹痛吐酸日夜轉側呼號已治木求一診以决之其脉微緊受寒所致並非危症何用驚惶若此蘇云昨服藥後稍定以方就政并屬定方柴見前方係附子理中湯頗合是症遂不另立王海藏治姬提領因疾服涼劑數日遂病臍腹下大痛幾至于死與薑附等劑雖稍蘇痛不已隨本方內倍白芍服之愈綱目陸肖愚治尤少溪年近六十性急多怒因食冷粽四枚遂患腹痛并脅亦痛醫用平胃散加枳實黃連不效彼亦知某家潤字丸方以五錢分三服令一日內服之大便已㵼而痛仍未止謂通則不痛今通而仍痛藥力淺而積未盡也再以五錢令一日服之大便數十行皆清水而痛反增劇號叫不已飲食不進面色青脹勢極危陸脉之弦細沈弱右關弦而有力曰虛中有實消則元氣即脫補則腹痛尚劇因用理中湯料五錢配枳實五錢一日二劑始下堅積缶許是夜痛大減明日減枳實之半又二劑而腹痛全愈第脅間尚微痛去枳實加青皮吳茱茰數劑而痊後以調氣養榮湯理之張三錫治一婦人腹痛而㵼口乾面時赤乃食積也與木香檳榔丸一服去硬物愈一酒客每日腹痛㵼黃沫知積熱也投苓連厚朴炒梔子木通澤㵼赤苓二劑少可復以酒蒸大黃為丸酒下二錢凡三服遂不發一婦人小腹塊痛醫作隂治投熱劑不應又作燥矢治者硝黃潤腸丸等藥屢用不減詢之七日前作寒起遂腹痛左三部皆絶小無力右寸關俱弦滑必起于外感內傷挾氣下早故食滯不下每痛則下黃水止作無時下傷津液故作渴遂以炒白芍茯苓保脾木香青皮疏氣炒山梔清塊中之火當歸潤燥陳皮甘草和中小水不利加澤㵼升麻車前二劑黃水雖少痛塊不減隨用葱豉尉法復投二劑二便大去而安陳良甫治家提幹內人病心腹脹痛衆投木香檳榔大腹白芍薑桂之類病益甚診之六脉弦緊而和不似病脉但診時兩手如火以此知其熱也衆問治法曰大凡心腹刺痛不可便作虛冷治之或曰非冷而何熱即生風冷生氣是也曰不然難經云虛則癢實則痛又仲景曰腹痛者桂枝加芍藥湯痛甚者桂枝加大黃湯家云荆布素來質弱曰有可辨處遇痛時使一婢按之若痛止是虛寒症也若按之轉甚手不可近叫喚異常此是實熱無可疑者當用大柴胡湯治之衆皆不許乃與責狀而投之八服愈良方朱丹溪治一婦人上腹大痛連及兩脅以香附末湯調而安羅謙甫治副使覃郎中年四十九歲至正丙寅春病臍腹冷疼完榖不化足胻寒而逆皮膚不仁精神困弱診其脉沈細而微遂投以大熱甘辛之劑及灸氣海百壯三里二穴各三七壯陽輔各二七壯三日後以葱尉炙瘡皆不發復灸前穴依前壯數亦不發十日後瘡亦更不作膿瘡口皆乾癸丑歲豫隨朝承應冬屯于瓜忽都地面學針於竇子聲先生因詢穴腧曰凡用針者氣不至而不效灸之亦不發大抵本氣空虛不能作膿失其所養故也更加不慎邪氣加之病必不退異日因語針科忽教授亦以為然戊辰春副使除益州府判到任未幾時風疾半身麻木自汗惡風妄喜笑又多健忘語言微澀醫以續命湯復發其汗津液重竭其症愈甚因求醫還家日久神氣昏憒形容羸瘦飲食無味便溺遺失扶而後起屢易醫藥皆不能效因思內經云陽氣者若天與日失其所則折夀而不彰今因此病而知子聲先生之言矣或曰副使肥甘足于口輕暖足于體便令足于前所言無不如意君言失其所養何也豫曰汝言所養者正務快于心精神耗散血氣空虛因致此疾靈樞云人年十歲五藏始定血氣已通其氣在下故好走二十歲血氣始盛肌肉方長故好趨三十歲五藏大定肌肉堅血氣盛滿故好步四十歲五藏六府十二經脉皆大盛以平定腠理始踈華容頽落髮頗斑白平盛不搖故好坐五十歲肝氣始衰肝葉始薄膽汁始減目始不明六十歲心氣始衰善憂悲血氣懈惰故好卧七十歲脾氣始衰皮膚已枯八十歲肺氣衰魂魄散離故言善悮九十歲腎氣燋藏枯經脉空虛百歲五藏皆虛神氣皆去形骸獨居而終矣蓋精神有限嗜欲無窮輕喪性命一失難復其覃氏之謂歟朱丹溪治一人痛當臍綿綿不已脉弦伏無力因作挾隂治理中湯加肉桂八分附子三分煎冷服隨愈薛立齊治羅給事小腹急痛大便欲去不去此脾腎氣虛而下陷也用補中益氣送八味丸二劑而愈此等症候因利藥致損元氣肢體腫脹而死者不可枚舉副郎李孟卿常患腹痛每治以補中益氣湯加山梔即愈一日因怒腹痛脉弦緊以前湯吞左金丸三十粒而愈一婦人心腹痛諸藥不應用炒黑山梔桔梗治之而愈傅青主治一婦妬惡夫有所昵忽患腹痛輾轉地上不可忍其夫求先生令持敝瓦釜置婦牀前搗千杵服之立止劉紹文九畹古文有一婦人少腹痛百藥不效一醫用杉木節童便煎服下血而愈醫學綱目汪訒菴嘗病腹中啾唧經兩月有友人見招飲以蘆稷燒酒一醉而積痾暢然蘆稷最能和中煎湯溫服治藿亂如神華他𫝊有人病腹中半切痛十餘日中鬚眉墮落他曰是脾半腐可刳腹養治使飲藥令卧或即麻沸散也破腹就視脾果半腐壞以刀斷之刮去惡肉以膏傅瘡飲之以藥百日平復三國志薛立齊云壬午仲冬金臺一男子腹痛服乾薑理中丸即時口鼻出血煩躁發狂入井而死外科心法趙從先治保義郎頓公苦冷疾時方盛暑俾就屋開三天窗于日光下射處使頓仰卧揉艾遍鋪腹上約數斤移時日光透臍腹不可忍俄而腹中雷鳴下㵼口鼻間皆濃艾乃止明日復為之如是一月疾良已乃令滿百二十日宿疴如洗壯健如少年時趙曰此係真人祕訣也世人但知灼艾而不知㸃穴又不審虛實徒受痛楚損耗氣力日者太陽真火艾既遍腹徐徐照射入腹之功極大五六七月若秋冬間當以厚艾鋪腹蒙以綿衣尉斗盛灰火慢尉之以聞濃艾氣為度亦其次也繆仲淳治髙存之長郎患腹痛問曰按之痛更甚否曰按之則痛緩曰此虛症也即以人參等藥用之數劑不愈但藥入口則痛止其痛每以卯時發得藥漸安至午痛復發又進再煎而安近晚再發又進三劑而安睡則不復痛矣如是者月餘存之疑之更他醫藥則痛愈甚藥入痛不止矣以是服繆方不疑一年後漸愈服藥六百劑全瘳人參白芍甘草麥冬當歸橘紅木瓜茰肉黃柏鱉甲或去當歸黃柏加牛膝秦芁棗仁石斛延胡索廣筆記包海亭夫人患腹痛連少腹上支心日夜靡間百藥不效診其脉兩寸關俱伏獨兩尺實大按之愈甚詢知其起于暴怒風木鬱于地中投以芎藭上柴胡中升麻下下咽噯氣數十聲痛立已已而作喘曰是升之太驟也以四磨湯與之遂平同上蔣仲芳治吳氏母年六十餘患腹痛日㵼四五行已三四年矣遍治不效診之二尺沈緊曰內有沈積也用熟大黃三錢入本病藥中煎服一劑而病如失沈抄本示吉曰毛方來忽患真寒症腹痛自汗四肢厥冷絶諸醫束手豫用回陽急救而痊吳石虹曰此症暫愈後必下膿血則危矣數日後果下痢如魚腦全無臭氣投參附不應忽思三物桃花湯仲景法也為丸與之三四服愈沈效兄抄本腰痛陶𢎞景曰相傳有人患腰腳弱往栗下食數升便能起行此是補腎之義然應生啖若服餌則宜蒸曝之按蘇子由詩曰老去自添腰腳病山翁服栗舊𫝊方客來為說晨興晚三咽徐收白玉漿此得食栗之訣也本草綱目竇材治一老人腰腳痛不能行步令灸關元三百壯更服金液丹強健如前張仲文傳神仙炙法療腰重痛不可轉側起坐艱難及冷痺腳筋牽急不可屈伸炙曲踿兩文頭左右腳四處各三壯每炙一腳二火齊下艾炷才燒至肉初覺疼便用二人兩邊齊吹至火滅午時著炙至人定以來臟腑自動一二行或轉動如雷聲其疾立愈此法神效卒不可量也綱目張子和治趙進道病腰痛歲餘不除診其兩手脉沈實有力以通經散下五七行次以杜仲去粗皮細切炒斷絲為細末每服三錢猪腰子一枚薄批五七片先以椒薑淹去腥水糝藥在內裹以荷葉外以濕紙數重封以文武火燒熟臨卧細嚼溫酒送下每旦以無比山藥丸一服遂數日而愈戴子和女僮冬間自途來面赤如火至㶏陽病腰胯大痛裏急後重痛則鬼神張曰此少陽經也在身側為相火使服舟車丸通經散瀉至數盆病猶未瘥人皆怪之以為有祟張大怒曰驢鬼也復令調胃承氣湯二兩加牽牛頭末一兩同煎服之大便數十行約一二缶方捨其杖策但發渴恣其飲水西瓜梨柿等張曰凡治火莫如冰水天地之至隂也約飲水一二桶猶覺微痛乃刺其陽陵穴以伸其滯足少陽膽經之穴也自是方寧女僮自言此病每一歲須瀉五七次今年不曽瀉故如是也常仲明悟其言以身有濕熱病故一歲亦瀉十餘行病始已此可與智者言難與愚者論也凡泄瀉火症極多一人六十餘病腰尻脊胯俱痛數載不愈晝靜夜躁大痛往來痛作必令人以手槌擊至五更雞鳴則漸減向曙則痛止左右及病者皆作鬼神隂譴百方禱祝無驗淹延歲月肉瘦皮枯飲食減少暴怒日增惟候一死張診其兩手脉皆沈滯堅徑力如張絙謂之曰病雖瘦難於食然腰尻脊胯皆痛者必大便堅燥其左右曰有五七日或八九日見燥糞一兩塊如彈丸結硬不可言曽令人剜取之僵下一兩塊渾身燥癢皮膚皴揭枯澀如麩片既得病之虛實隨用大承氣湯以薑棗煎之加牽牛頭末二錢不敢言是瀉劑蓋病者聞暖則悅聞寒則懼說補則從說瀉則逆此弊非一日也而況一齊人傅衆楚人咻之乎及煎成使稍熱咽之從少至多纍至三日天且晚臟腑下泄四五行約半盆以燈視之皆燥糞痺塊及瘀血雜臟穢不可近須臾痛減九分昏睡如常人至明日日將夕始覺飢而索粥溫涼與之又困睡一二日其痛盡去次令飲食調養日服導飲丸甘露散滑利便溺之藥四十餘日乃復蓋虛結與閉雖久猶可解而決去腰脊胯痛者足太陽膽經之所過也難經曰諸痛為實又痛隨利減不利則痛何由去故凡燥症皆三陽病也病者既痊夀乃八十歲衛德新因之析津冬月飲寒則冷病腰常直不能屈伸兩足沈重難於行步途中以牀舁程程問醫皆云腎虛用蓯蓉巴㦸附豫鹿茸大便反祕潮熱上周將經歲矣乃乞拯張張曰此十日之效耳衛曰一月亦非遲張曰足太陽經血多病則腰似折膕如結腨如裂太陽所致為屈伸不利況腰者腎之腑也身中之大關節今既強直而不利宜鹹以軟之頓服則和柔矣難經曰强力入房則腎傷而髓枯枯則高骨乃壞而不用與此用疑訛同今君之症太陽為寒所遏血墜下滯腰間也原缺五字必有積血非腎也節次以藥下可數百行去血一二㪷次以九曲玲瓏竈蒸之汗出三五次而愈初蒸時至五日問曰腹中鳴否曰未也至六日覺鳴七日而起已能揖人張曰病有熱者勿蒸蒸則損人目也饒之城中某病腎虛腰痛沙隨先生以其尊人所傳宋誼叔方用杜仲酒浸透炙乾搗羅為末無灰酒調下如方制之三服而愈槎庵小乘薛立齊治一婦人腰痛三年矣每痛必青頭暈目緊薛以為肝脾氣虛用補肝散而愈三年後因勞役患頭痛兼惡心用補中益氣湯加茯苓半夏蔓荆子而愈一婦人苦腰痛數年不愈薛用白术一味大劑服不三月而痊乃胃氣虛閉之症故用白术也一婦人先腰胯作痛後兩腿亦痛薛以為足三隂虛寒外邪所傷用小續命湯及獨活寄生湯或作或止所用飲食極熱腹中方快薛曰邪氣去而元氣虛寒也診其脉果沉細用養腎散漸愈又用十補丸而痊一婦人所患同前但發熱作渴喜冷飲食脉洪數按之遲澀薛以為血虛有熱用羚羊角散去檳榔加白术茯苓數劑更用加味逍遙散而瘥一婦人患前症時或腿膝作痛脉浮數按之遲緩此元氣虛而風濕所乘用獨活寄生湯頓愈又用八珍湯而安一婦人因怒患前症寒熱往來口苦不食晡熱內熱薛以為肝火血虛先用小柴胡山梔頓愈又用加味逍遙而瘳一婦人患前症寒熱頭痛殊類傷寒此寒邪之症用檳蘇敗毒而安又用補中益氣調補而愈龔子材治一人跌後腰痛用定痛等藥不效氣血日衰面耳黎色龔曰腰為腎之腑雖曰閃傷實腎經虛弱所致也遂用杜仲補骨脂五味子山茰蓯蓉山藥空心服又以六君當歸白术神麯各二錢食逺服不月而瘥張路玉治沈雲步媳常有腰疼帶下之疾或時勞動則日晡便有微熱診其兩尺皆弦而右寸關虛濡少力此手足太隂氣衰敷化之令不及也合用異功散加當歸丹皮調補胃中營氣兼杜仲以壯關節澤㵼以利州都則腰疼帶下受其益矣江蘇總藩張公嚴冬腰腹疼重甲夜延診候脉得沈滑而駛遂與導痰兼五苓之製一劑而腹痛止三啜而腰胯弛縱自如未嘗用腰腹痛之藥沈為在裏滑為痰駛為熱故消導分利而愈盧不逺治陳孟抒父六月中受寒尚淹淹未甚也至次年二月忽小腹與腰急痛即令人緊挽外腎稍鬆便欲死與羌活黃柏茯苓肉桂等劑令刮委中痛止而足軟至五月天熱身發紫斑有汗至足乃愈此小腸腑病也經曰小腸病者腰脊控睪而痛以羌活入太陽小腸故痛隨愈其足軟未瘳者原以寒邪鬱火故需夏時則火力全而血脉之邪始去所以斑出足汗百骸暢美寒净而火遂融通也吳孚先治尹瑞之腰痛異常從目內眥進藥而愈或問之曰是乃精明穴也在目內眥紅肉中上行足太陽經于腰背下應足少隂通於心腹腰背之痛從精明進藥良有竒驗古來神聖有從耳進藥者病愈而耳聾針之則愈矣蘇頌治一女子忽得小腹中痛月經初來便覺腰間切痛連脊間如刀刺錐所刺不可忍衆醫不别謂是鬼疰妄服諸藥終無所益其疾轉增審察前狀相當即用積雪草其藥夏五月正放花時即采曝乾搗篩為糝每服二方寸匕和好醋二小合平旦空腹頓服之每旦一服以知為度天寶單行方本草綱目張三錫治一人瘦弱性復嗜酒致腰及兩脛痛不可忍作腎虛治不應診之左脉濡細而數乃血虛受熱也遂以四物湯生地加知柏牛杜肉桂少許二劑知十劑已一人因太勞又過飲酒致濕熱乘入客于經腰痛夜更甚不得俯仰脉濡而弱先與拈痛去參术二帖稍愈遂改用四物加杜仲牛膝獨活肉桂頓瘳一人脉症同上服拈痛漸減一人改用桂附遂攻出一癰出膿大補消一人肥盛而肢節痛腰更甚脉沈濡而滑知濕痰也與二陳加南星二术二活秦芁防風十劑愈一人因墜馬後腰痛不止日輕夜重瘀血諦矣與四物去地加肉桂桃仁泥蘇木四服大便下黑而痊王叔權曰舍弟腰疼出入甚艱余用火針微微頻刺腎俞則行履如故初不炙也屢有人腰背傴僂來覓㸃炙豫意其是筋病使然為㸃陽陵泉令歸炙即愈筋㑹陽陵泉也然則腰疼又不可専泥腎俞不炙其他穴也陳三農治一士精神倦怠腰膝異痛不可忍咸謂腎主腰膝乃用桂附之劑延兩月覺四肢痿軟腰膝寒冷遂恣服熱藥了無疑懼診之脉伏于下及重按之振指有力此陽盛格隂乃火熱過極反見勝已之化以黃柏三錢膽草二錢芩連梔子各一錢五分加生薑七片為之向導乘熱頓飲移時便覺腰間暢快三劑而痛若失立齊治一婦人患腰痛腳弱弛長不能動履以人參敗毒散加蒼术黃柏澤㵼而愈一人體厚腰間常冷與腎著湯加星半蒼术三服全愈朱鶴山老年久患腰痛用茯苓三錢枸杞一兩生地二錢麥冬五錢人參三錢陳皮三錢白术三錢河水二鍾煎八分日服一劑强健再生子八十未艾廣筆記繆仲淳治錢晉吾文學腰痛甚診之氣鬱兼有傷瘀血停滯投以牛膝五錢當歸二錢五分炙甘草一錢蘇梗一錢五加皮三錢橘紅二錢製香附二錢續斷二錢水二鍾煎八分飢時加童便一大杯服二劑愈同上繆之外祖李思塘少年患腰痛至不能坐立諸醫以補腎藥療之不效朱逺齊者湖明醫也用潤字號丸藥下之去黑糞數升蓋濕痰乘虛流入腎中作苦痰去方以補藥滋腎不逾月起惜其方傳者不真同上李學虬曰先安人因亡女忽患腰痛轉側艱苦至不能張口受食投以鹿角膠不愈以濕痰療之亦不效遍走使延仲淳曰此非腎虛也如腎虛不能延至今日矣用白芍製香附各三錢橘紅白芷肉桂各二錢炙草一錢乳香沒藥各七分半燈心同研細臨服下之一劑腰脫然覺遍體疼仲淳曰愈矣再煎滓服立起豫駭問故仲淳曰此在素問木鬱則達之顧諸君不識耳廣筆記薛治一男子年四十餘患腰痛服流氣飲寄生湯不應以熱手尉之少可蓋脉沉弦腎虛所致以補腎丸愈之張景嶽治董翁年六旬資稟素壯因嗜火酒致濕熱聚于太陽膀胱忽病腰痛不可忍至求自盡診之六脉甚洪滑且小水不通而膀胱脹急遂以大分清飲倍加黃柏龍膽草一劑小便頓行腰痛如失劉宏璧曰一友病腰痛醫以杜仲補骨脂等治之不效診其脉浮細緩止知為風寒血脉耳與當歸四逆湯劑盡痛深次日前醫來深詆此湯之謬復進杜仲等藥腰痛如故怪而問之曰子或又服他藥耶友以實對令其再服四逆湯一貼即已錢國賓治榆林張參戎體厚力大素善騎射壯時縱欲水敗火虧腰胯如折其脉寸關浮大兩尺若有若無不可以揖非人扶不起已三年筋骨皆冷以六味丸加河車膏龜鹿膠參歸桂附補其真元腎命年餘方能步又五年卒陸茂才父年七十素有肝疾偶于春分日育王山頂燒香育王之髙為湖上衆山之最晨而往晡而歸足力可云健矣至夜忽腰大痛不可轉側或以為勞傷兼感冒宜先表散與羌活秦芁等一劑痛益劇脉之弦硬參互不調二便俱祕面黯囊縮日夜不得眠曰此肝腎大傷踈泄已廢症瀕危矣豈可再投風藥以養青湯加牛膝當歸痛略減二便仍祕且嘔惡發厄此地氣不得下行而反上攻也前方重用熟地外以田螺獨蒜搗爛繫臍下二便既行嘔厄隨止痛忽移入少腹控引睪丸前方杞子至一兩再入白芍甘草數劑漸瘥乃素性畏藥停數日覺復甚又與數劑而安前隂朱丹溪治吳江王氏子年三十歲忽隂挺長腫而痛脉數而實用朴硝荆芥湯浸洗又用三一承氣湯大下之愈本草綱目姚蒙字以正巡撫鄒來學嘗使視脉蒙既叙病源因曰公根器别有一竅出汗水來學大驚曰此隱疾何由知蒙曰以脉得之左關滑而緩肝第四葉有漏洞下相通來學改容謝江南通志薛立齊治一婦人隂中腫悶小便澀滯兩脅作痛內熱晡熱月經不調時或寒熱此因肝脾鬱怒元氣下陷濕熱壅滯朝用歸脾湯加柴胡升麻解鬱結補脾氣升元氣夕用加味逍遙散清肝火生肝血除濕熱各數劑諸症悉愈又用四君芎歸丹皮調補肝脾而經水如期一婦人隂中寒冷小便黃澀內熱寒熱口苦脅脹此因肝經濕熱用龍膽湯祛利濕熱用加味逍遙散調補血氣而安矣一婦人所患同前更寒熱嘔吐兩股腫痛先用小柴胡加山梔一劑寒熱嘔吐頓止次用龍膽瀉肝湯一劑腫痛頓消一婦人隂中寒冷小便澄清腹中亦冷飲食少思大便不實下元虛寒治以八味丸月餘飲食漸加大便漸實又月餘諸症悉愈一婦人隂腫下墜悶痛出水胸腹不利小便頻數內熱晡熱口苦耳鳴此肝脾火症用小柴胡車前膽草苓术升麻二劑少愈又用加味逍遙加升麻數劑漸愈乃以加味歸脾加升麻柴胡并補中益氣加山梔數劑頓愈仍用加逍遙加味歸脾二藥調理全愈一婦人患前症熱痛或用寒涼敗毒藥飲食不入時欲作嘔小腹重墜此脾胃復損元氣下陷先用補中益氣加炮薑二劑重墜頓愈又加茯苓半夏二十餘劑而愈乃以歸脾湯少加柴胡升麻并六味地黃丸而康孫文垣治一婦當暑月小便不利而痛玉戶腫又便血發熱左脉弦數右寸短弱此肺氣不足肝火太熾蓋肝為血海又主踈泄二便玉戶為肝經所絡之地治當踈決肝經壅滯俾氣暢則新血得以歸經熱解則小水可自利而腫亦可消矣以滑石三錢桃仁當歸白芍各一錢柴胡黃連人參各八分川芎六分甘草桂枝白芷各三分四劑而瘳馬鳯林內子有隱疾每月汛行子户旁輒生一腫毒脹而不痛過三五日以銀簮燒紅針破出白膿盞許而消不必膏藥亦無疤痕初用針刺近則以指掐之膿即出但汛行即發上下左右無定所第不離子戶于今八年內外科歷治不效且致不孕孫曰此中焦濕痰隨經水下流壅于子戶也經去而痰凝則化為膿本來非毒故不痛怪病之謂痰用白螺螄殼火煅存性為君南星半夏為臣柴胡甘草為佐麯糊為丸令早晚服之未終劑而汛行不腫次年生女一婦有隱疾其夫三造門而不言繼至欲言而面赭孫開喻之乃俯首曰言之無任主臣先生長者諒無哂山妻子戶中突生一物初長可三寸今則五寸許矣狀如堅筋色赤大可拱把脹而且痛不便起止增寒壯熱寢食俱減赧于言欲求自盡逡巡百日矣孫曰乃隂挺症也厥隂肝經之脉女子下系庭孔濕熱則隂挺猶木有濕熱而生也畢竟熱則挺緃不收為是與以龍膽瀉肝湯及蝟皮散當歸黃苓牡蠣蝟皮赤芍為末每用二錢空心米飲湯調下去後數月來報云前症果痊兹為汛期一月不至敢問曰此有身也彼疑疾甫愈未必能孕謂曰前恙乃肝經有餘之症肝為血海女子血盛則懷胎據血盛當先期今汛逾期實孕耳非病也後果足月生子尚某言昔在粵東與都司李某交善後李沒其妻售濠畔街宅與尚仍分院而居兩家往來如親串然一日李妻私語尚夫人有女及筓而病病且甚異欲求尚診而難於言夫人告尚曰與李君夙交好言之何傷李妻乃言女初患腹痛久之溲溺甚艱溲內有物能游泳或二或三似有鱗鬛者取視之乃此目魚半體也身微黑止具一目其背白置水中果如所云試診之乃肝氣久鬱所致投以踈肝之劑而愈李河南人居易録有寡婦患隂中癢不可告人漸至委頓此婦平日䖍奉大士忽有尼僧來與藥一色曰以此洗之數洗而愈其藥乃蛇牀子吳茱茰苦參也採蘭雜志何首烏本名交藤因何首烏服而得名何首烏者順州南河縣人祖能嗣本名田兒生而閹弱年五十八無妻子醉卧野中見田中藤兩本異生苗蔓相交久而解解合三四田兒心異之掘根持問鄉人無能識者遂曝乾搗末酒服七日而思人道百日而舊病皆愈十年而生數男後改名能嗣又與子庭服皆夀一百六十首烏服藥亦百三十歲唐元和七年曽文象遇茅山老人遂傳其事李翺因著方録云甘泉蕞殘録富家子唐靖瘡發於隂至爛道人周守真曰病得之欲泄而不可泄也治法宜內服龍膽瀉肝湯外以甘草末糝之延夀書有人隂冷漸漸入隂囊腫滿晝夜疼悶不已用上好川椒為末帛包裹囊如不覺熱烘熱更妙內煎大蘇湯汁服妙隂冷兩丸如冰出汗兩腳痿弱宜補肝湯千金方王節齊曰男子隂痿不起古方多云命門火衰祖氣虛固有之矣然亦有鬱火盛而致痿者經云壯火食氣譬如人在夏暑而倦怠遇冬寒而堅強豫常親見腎經鬱火而有此症令服黃柏知母清火堅腎之藥而效故須審察不可遍認為火衰症也薛立齊治一婦人吐痰發熱遍身作痛小便頻數隂中作癢日晡熱甚曰此肝脾血虛氣滯而兼濕熱也用加味逍遙散加車前子而愈馬元儀治尤悔姪患隂莖作痛痛甚而憤遂昏迷不醒幾閲月診其兩脉浮虛而澀浮為氣虛澀為精傷隂陽兩虛之候得之憂思勞鬱而傷中也經云陽明主潤宗筋又陽氣者精則養神柔則養筋今悒鬱勞倦氣血兩傷故令作痛以當歸補血湯加人參炙草榮養氣血桂心秦芁紅花宣通血脉一劑而痛止復診兩脉沉微連進大劑參附諸症已平惟徹夜不寐用歸脾湯調理而安有人隂腫醫以赤土塗之令服八味丸而愈一兒隂腫醫亦以赤土塗之愈若久病而隂腫病已不可救宜速炙水分穴蓋水分能分水榖水榖不分故隂腫不特隂腫他處亦腫也尤宜急服禹餘糧丸云既效方陳良甫家婢患隂蝕就瘡家療不差蝕處作兩瘡深半寸良甫于涓子方中撿得甘草湯方仍以自處蚺蛇膽散不經七日瘡乃平復甚效凡救十八人手下即活遇斯疾者請流布而傳之葛氏云比見人患莖頭腫攻下瘡欲斷者以猪肉湯漬洗之并用黃連黃柏末塗之又方蜜煎甘草末塗之千金方立齊治一婦人隂內膿水淋漓或癢或痛狀似蟲行診之少隂脉滑此隂中有瘡也名曰䘌由心神煩鬱胃氣虛弱氣血凝滯所致與升麻白芷黃連木通當歸川芎白术茯苓柴胡煎服用搨腫湯熏洗更搽蒲黃水銀兩月餘而愈或有胞絡虛風邪乘隂血氣相搏令氣否塞致隂腫痛當以菖蒲散治之更以枳實炒熱帛裹尉之冷則再炒或有子臟虛冷氣下衝致隂脫出謂之下脫或因産努力而脫者以當歸散治之久不愈者以補中益氣湯倍加升麻柴胡升舉之靳閣老子隂莖腫痛服五苓散等藥不應診其脉左關弦數此肝經積熱而成以小柴胡湯送蘆薈丸一服勢去三四再服頓愈一婦人隂器腫痛小水澀滯遇晚寒熱交作此肝經濕熱為患以龍膽瀉肝湯二服小水通利又以四物湯兼小柴胡加花粉木通山梔服之而愈外科正宗以下共六案來選入一婦人無故發熱月餘忽隂中突出一物如雞冠一片此肝鬱脾虛所致以補中益氣湯加青皮梔苓柴胡甘草外以白芷蒼术紫蘇煎湯每日熏洗十餘日其患漸小仍用前湯倍參术月餘而安一婦人隂中作癢遇夜五心煩熱作渴不寐此思慮太過致心腎不交以四物湯加龍膽草山梔知母黃連以銀杏散約入隂中二日其癢漸止又朝以八味丸午用歸脾湯加銀柴胡茵陳月餘而愈一婦人隂器半邊腫痛身發寒熱口乾便祕脉實有力以內踈黃連湯一劑大便通利口乾乃止惟腫痛尤甚此濕毒結聚欲為膿也以四物湯加角針澤瀉二劑膿熟脹痛又透膿散一服出臭膿鍾許痛止以八珍湯加丹皮澤瀉十餘劑而安一婦人肝經風濕下流隂器浮腫癢甚至􅎲出血不痛以消風散加苦參膽草澤瀉木通山梔外以蛇牀子湯熏洗搽擦銀杏散十餘日癢止腫消而愈一婦人孀居十餘載隂器作癢出蟲含忍不言後隂器蝕爛已蝕內臟尫羸發熱作渴脉洪而數詢其癢痛日久隂器黑腐小水不禁內臟已壞不可用藥彼苦求治癢者蟲也痛者損也先用鯽魚數枚以香料糝炙魚熟以絲綿薄裹納入隂中夾之良久取出紅蟲長者一寸短者五六分細如絲線約二十餘條置溫湯中搖擺片時方死彼家惟悅以為可治曰再取再有生化無窮強投養血清肝藥終竟不應而死錢國賓曰浙湖戴氏女年五歲胎生雙隂溺從上出下戶亦流因母病延診以私語言及余曰此女天生雙隂也不聞楞嚴經云五種不男之人即此類也長大經行生子如常以上竅為正從此勿疑撫養待配鶴膝風朱丹溪治一丈人年七十歲患腳膝疼稍腫此血虛而挾濕熱也用生地歸頭白芍蒼术炒柏川芎桂木通水煎食前熱服一男子年近三十滋味素厚性多焦怒秋間髀樞左右一㸃發痛延及膝骭晝靜夜劇痛處惡寒或渴或不渴或痞或不痞醫多用風藥兼補血次年春其膝漸腫痛愈甚食減形羸至春末膝腫如桃不可屈伸診其脉左弦大頗實寸澀甚大率皆數知其小便必數而短遂作飲食痰積在太隂陽明治之炒柏一兩生甘草梢犀角屑蒼术鹽炒各三錢川芎二錢陳皮牛膝木通白芍各五錢遇暄熱加條芩三錢為細末每三錢重與生薑自然汁同研細多少以水蕩起煎令沸帶熱食前飲之一晝夜四次與至半月後數脉漸減漸輕去犀角加牛膝敗龜板半兩當歸半兩如前服又與半月腫漸減食漸進不惡寒唯腳膝痠軟未能久立久行去蒼术黃芩時當夏熱加炒柏至一兩半依本方內加牛膝春夏用莖葉冬用根杵取汁用之效尤速須斷酒肉濕麵胡椒當仲夏加生地半兩冬加茱茰桂枝鎮江外科史姓者曽治一人鶴膝風以蝦蟇用碗鋒略破腹有縫不可穿縳置患處待動脅移時受毒輒死如前再易一枚不過二三枚愈戒菴漫筆李謝孫文垣治程紹溪中年患鶴膝風兩腿及腿肚內外臁肉盡削兩膝腫大乃酒後縱欲所致且四肢膿疥淫濕腌臢自分必死家人以病久醫藥破家不復求治矣孫以鄰人之親往診左寸關浮數右寸短弱兩尺沈微曰此氣虛血熱之候法當大補壯其筋骨猶可冀生第非百日不見功蓋補血無速效必漸而需之關節通利骨正筋柔腿肉自生初以龜版苡仁各三錢蒼耳子五加皮頭二蠶沙節節香各一錢當歸人參黃耆蒼术杜仲黃柏各八分紅花八分十劑而瘡疥漸稀精神稍長再以苡仁五加皮龜版各二錢節節香蒼耳子地黃丹參蒼术黃柏首烏各一錢人參當歸各八分紅花木通各五分三十帖可倚杖而行腿肉漸生瘡疥盡愈膝腫消去其六後以虎潜丸加鹿角膠首烏狗脊節節香牛膝用龜膠為丸服三月腿肉復完而愈薛立齊嘗治韓廷儀先患風症用踈風化痰養血之藥而痊其腿膝骨內發熱作痛服十味固本丸天麻丸益甚兩尺脉數而無力謂此腎水虛不能生肝木虛火內動而作非風邪所致也不信又服羌活愈風丹之類四肢痿軟偏身麻木痰涎上涌神思不清曰此皆脾氣虧損不能榮養周身又不能攝涎歸源先用六君子加芎歸木香數劑以助五臟生化之氣以榮養周身而諸症漸愈乃朝以補中益氣湯培養脾肺夕以六味丸滋補肝腎如此三月而安一婦人久鬱怒膝腫胸脅不利內熱寒熱經候不調遍身痠痛此胃氣虧損先用補中益氣湯加半夏茯苓二十餘劑胃氣漸醒又用大防風湯與歸脾湯膝腫漸消用加味逍遙散大防風湯全消又用八珍湯加丹皮調理而安一婦人患前症腫痛寒熱先用大防風湯一劑又用加味逍遙四劑月餘腫痛漸退惑於速效另服祛風敗毒虛症蜂起仍用大防風為主佐以十全大補而消又服大補湯兩月餘而愈一婦人患前症兩拗中腿股筋牽作痛內熱寒勢此肝火氣滯之症先用加味小柴胡湯四劑後以加味逍遙散為主佐以大防風湯而消又患痢後兩膝腫痛寒熱往來用十全大補湯為主佐以大防風湯而仍消一婦人患之雖潰而腫不消朝寒暮熱飲食不思經水三四月一至此肝脾氣血俱虛也用補中益氣加味歸脾二湯各三十餘劑腫漸消而寒熱止又佐以大防風月餘而能步履再月餘經行如期又服六味丸八珍湯三月而瘡斂一男子腿筋弛長月餘兩膝腫痛此隂虛濕熱所乘也用六味丸為主佐以八珍湯加牛膝杜仲間以補中益氣湯三月餘而消通府劉國威先筋攣骨痛右膝漫腫用化痰消毒之劑腫痛益甚食少體倦加祛風消毒等藥寒熱作嘔大便不實用二陳除濕之類腫起色赤內痛如錐診其脉滑而無力此膿已成元氣虛而不能潰也用十全大補湯四劑佐以大防風湯一劑而潰又百餘劑而痊一男子腿痛膝腫脉浮按之弦緊此肝腎虛弱也用大防風湯二劑已退彼惑于附子有毒乃服治瘡之藥日漸消瘦虛症漸至復求治曰倦怠消瘦脾胃衰而不能營運也小便不禁膀胱虛而不能約制也燥熱虛痞胃氣弱而不能化也恍惚健亡精失而憒亂也惡症蜂集辭之後果殁一男子患腿痛膝微腫輕診則浮按之弦緊此鶴膝風也與大防風湯二劑已退二三彼謂附子有毒乃服敗毒藥日漸消瘦復求治薛謂今飲食不為肌膚水榖不能運化精微灌溉臟腑周身百脉神將何依夫氣短而促真氣損也怠惰嗜卧脾氣衰也小便不禁膀胱不藏也時有躁熱心下虛痞胃氣不能上榮也恍惚健忘神明亂也不治後果然此症多患于不足之人故以加減小續命大防風二湯有效若用攻毒藥必誤一婦人膝腫痛遇寒痛益甚月餘不愈諸藥不應脉弦緊此寒邪深伏于內也用大防風湯及火龍膏治之而消大抵此症雖云腫有淺深感有輕重其所受皆因真氣虛弱邪氣得以深襲若真氣壯實邪氣焉能為患耶故附骨癰疽及鶴膝風症虛者多患之前人用附子者以補溫腎氣而又能行藥勢散寒邪也亦有體虛之人秋夏露卧為冷氣所襲寒熱伏結多成此症不能轉動乍寒乍熱而無汗按之痛應骨者是也若經久不消極隂生陽寒化為熱而潰也若被賊風所傷患處不甚熱而灑淅惡寒不時汗出尉之痛止須大防風湯及火龍膏治之若失治為彎曲偏枯有堅硬如石謂之石疽若熱緩積日不潰肉色赤紫皮肉俱爛名緩疽其始末皆宜服前湯欲其驅散寒邪以補虛托裏也一人患鶴膝風五年敷藥三日即愈王心涵傳乳香沒藥各一錢五分地骨皮三錢無名異五錢麝香一分各為末車前草搗汁入老酒少許調敷患處廣筆記立齊治一男子左膝腫大三月不潰謂體虛之人風邪襲于骨節使氣滯而不行故膝愈大而腿愈細名曰鶴膝風遂以大防風湯三十餘劑而消張上舍亦患此伏枕半載流膿三月彼云初服大防風湯去附子一錢服二十餘劑少愈乃去附子五錢服至三十餘劑將愈乃去附子更以三十餘劑而痊蓋桂附當用而不用則無功也王汝道膝腿腫筋骨痛服十宣散不應脉沈細以五積散二劑而痛止更以十宣散去桔梗加牛膝杜仲三十餘劑膿潰而愈此寒氣之腫八風之變也腳蘇頌曰水氣腳氣最為急症有人患此以袋盛赤小豆朝夕踐踏展轉之久久遂愈本草綱目今人多誤為相思子其實即食豆赤黯而緊小者耳其紅大者不入藥竇材治一人患腳氣兩䯒骨連腰日夜痛不可忍為炙涌泉穴五十壯服金液丹五日全愈一女人患腳氣忽手足遍身拘攣疼痛六脉沈大乃胃氣盛也服宣風丸三十粒泄去而愈張文定嘗苦腳疾無藥可療一日遊相國寺有賣藥者得菉豆兩粒服之遂愈琅琊代醉編劉敬叔云滎陽鄭鮮之字道子為尚書左僕射女腳患攣癖就王僕醫僕陽請水澆之餘澆庭中枯樹樹既生女腳瘥樵書初編鄱陽周順治一士人腳弱病方書羅列積藥如山而疾益甚令屏去但用杉木為桶濯足及令排樟腦兩股間以腳䙀繫定月餘而安健如故南方多此疾不可不知遁齊閒覽六七叔婆血少氣多大便後腳痛而麻用當歸白芍白术青皮地黃川芎甘草桃仁煎服薛立齊治一婦人兩膁赤痛寒熱口苦嘔吐懶食面色青黃此肝木乘脾土用小柴胡湯加山梔升麻茯苓二劑頓愈又用六君子湯加柴胡山梔全愈一婦人飲食勞役兩膁兼腿疼痛或時寒熱薛以為脾虛濕熱下陷用補中益氣湯加山梔茯苓半夏治之而痊後復作六君子湯加柴胡山梔全愈一婦人經行後寒熱晡熱兩腿作痛此肝經血虛也用加味逍遙散加山梔治之而愈後因勞日晡內熱或用四物黃柏知母之類前症益甚更加食少作瀉薛以為元氣下陷前藥復傷先用六君子湯加補骨脂二劑調補脾胃而瀉止食進又用補中益氣湯升舉元氣而痊一婦人年三十有七早孀居兩腿骨作痛晡熱體倦月經不調或發寒熱數年矣一日頸項兩側結核兩脅脹痛此係肝經鬱火而成也先用小柴胡湯合四物數劑肝症頓愈又用加味逍遙散加澤蘭乳香沒藥三十劑血症漸痊再用加味歸脾等藥年餘而安一孀婦兩腿作痛或用除濕化痰等藥遍身作痛而無定處薛曰此血症也不信仍服流氣飲之類而殁一放出宫人年四十餘臀腿內股作痛晡熱口乾月經不調此係肝經血少不能養經絡而然也宜用加味逍遙散加澤蘭葉五十餘劑諸症稍緩又以歸脾湯兼服二百餘劑而痊一放出宫人臀腿腫痛內熱晡熱惡寒體倦咳嗽胸痞月經過期而少彼以為氣毒流注服清熱理氣之劑益甚薛曰此乃肝經瘀血停留所致蓋肝經上貫鬲布脅肋循喉嚨下循膕內臁繞隂器抵少腹主治之法但當補其所不勝而制其所勝補者脾也制者肝也經曰虛則補之實則瀉之此定法也彼不信仍服前藥遂致不起薛立齊治一儒者兩足發熱腳跟作痛用六味丸及四物湯加麥冬五味元參治之而愈後因勞役發熱惡寒作渴煩躁用當歸補血而安一婦人下體腫痛用人參敗毒散加蒼术黃柏威靈仙痛減又以四物湯加蒼术黃柏防己紅花澤瀉而安一人足熱口乾吐痰頭暈服四物湯加黃連黃柏飲食即減痰熱益甚用十全大補湯加麥冬五味山藥山茰而愈吳孚先治褚仁甫病足瘇虛軟無力頗能食醫與二妙散加米仁木瓜牛膝防風之屬愈服愈憊此脾虛濕熱下陷法當補脾升舉誤用下行之劑故愈陷下也凡診是症須審右寸不數并能食否如數又不能食則是痿症宜清肺熱不可不知即痿不可作痺治是也張路玉治褚廷嘉患腳氣痼疾恆服腎氣丸不徹六七年來宿患懇除之乃彚取术附桂附耆附參附等法兼采八風散中菊花鱉甲湯中鱉甲貝齒羚羊犀角風引湯中獨活防己竹瀝湯中薑汁竹瀝為丸共襄祛風逐濕之功服後必蒸蒸汗出不終劑而數年之症頓愈沈汝楫子夏月兩膝脛至腳痛極僵挺不能屈者十餘日或用敷治之法不效其脉耎大而數令拭去敷藥與當歸拈痛湯二劑汗出而愈陸養愚治邵完吾左臀尖腫痛引至膝膕行動不便眠卧亦艱治療半年無效肌肉盡削診之沈弱似緩按之遲遲兩尺沈數曰此由元氣虛弱寒濕乘之胃氣不升隂火伏匿于下法當扶元升陽導濕清熱則痛自止用補中益氣湯加蒼术黃柏猪苓澤㵼桂附少許十劑其痛頓釋後去桂附五苓倍人參歸身月餘肌肉漸生張三錫治一人素有腳氣每發則引腰痛不可俯仰其人雄飲明是濕熱脉濡而數投拈痛湯八劑漸減遂以摐虎丹酒下二丸空心凡三服腿腕出黑汗永不再發陳三農治一人熱從腳起入腹視其形體實作濕鬱熱成熱之候治之以潛行散加牛膝防己丸服之而愈一婦積勞病兩足如火燒即惡寒壯熱頭疼眩暈齒痛齒浮安卧片時少減日二三發此氣血俱虛虛火妄動所致以十全大補湯加五味四劑而愈朱丹溪治一婦人腳疼怕冷夜劇日輕用生地白芍歸尾各五錢炒黃柏黃芩白术右分四貼水煎帶熱服一婦人腳乂骨痛用蒼术白术陳皮白芍各三錢木通二錢甘草五分分二服送大補丸五十粒儒者章立之左股作痛用清熱滲濕之藥色赤腫脹痛連腰脅腿足無力此足三隂虛用補中益氣六味地黃兩月餘元氣漸復諸症漸退喜其慎疾年許而痊府庠鍾之英兩腿生瘡色黯如錢似癬者三四癢痛相循膿淋漓晡熱內熱口乾面黧此腎虛之症用加味六味丸數日而愈此等症候用祛風敗毒之劑以致誤人多矣一男子素遺精腳跟作痛口乾作渴大便乾燥午後熱甚用補中益氣加白芍元參及六味丸而愈周都憲兩腿作痛形體清癯肝脉弦數却屬有餘之症用龍膽瀉肝湯治之愈一婦人兩腿作痛不能伸展脉弦緊按之則澀先以五積散二劑痛少止又一劑而止更以神應養真而能屈伸一男子腿痛每痛則痰盛或作嘈雜脉滑而數以二陳湯加升麻二术澤㵼羌活南星治之而安一男子素有腳氣脅下作痛發熱頭暈嘔吐腿痺不仁服消毒護心等藥不應左關脉緊右關脉弦此亦腳氣也以半夏杜經湯治之而愈一男子腳軟腫痛發熱飲冷大小便祕右關脉數乃足陽明經濕熱流注也以大黃左經湯治之而愈一男子臁脛兼踝腳皆焮痛治以加味敗毒而愈一男子兩腿腫痛脉滑而緩此濕痰所致也先以五苓散加蒼术黃柏二劑少愈更以二陳二术檳榔紫蘇羌活獨活牛膝黃柏而瘥夫濕痰之症必先以行氣利濕健中為主若中氣和則痰自消而濕亦無所容矣一婦人兩腿痛脉澀而數此血虛兼濕熱先以蒼术黃柏知母龍膽草茯苓防風防己羌活數劑腫痛漸愈又以四物湯加二术黃柏牛膝木瓜月餘而愈一婦人腳脛腫痛發寒熱脉浮數此三陽經濕熱下注為患尚在表用加味敗毒散治之不應乃瘀血凝結藥不能及也於患處砭去瘀血乃用前藥二劑頓退以當歸拈痛湯四劑而愈楊大受云腳氣是為壅疾治法宜宣通之使氣不能成壅也壅既成而甚者砭去惡血而去其重勢經云畜則腫熱砭射之後以藥治之一婦人兩腿痛遇寒則筋攣脉弦而緊此寒邪之症以五積散對四物湯數劑痛止更以四物湯加木瓜牛膝枳殼月餘而愈一男子腿腫筋攣不能動履以交加散二劑而愈一婦人患腿痛不能伸屈遇風寒痛益甚諸藥不應甚苦先以活絡丹一丸頓退又服而瘳次年復痛仍服一丸亦退大半更以獨活寄生湯四劑而愈一男子素有腳氣又患附骨疽作痛服活絡丹一丸二症並瘥上舍俞魯用素有疝不能愈因患腿痛亦用一丸不惟腿患有效而疝亦得愈矣夫病深伏在內非此藥不能通達但近代始云此藥引風入骨如油入麵之說故後人多不肯服大抵有是病宜用是藥豈可泥于此以致難瘥一男子素有腿痛飲酒過傷痛益甚倦怠脉弱以六君子湯加山查神麴蒼术芎歸升柴而愈一老人素善飲腿常腫痛脉洪而緩先以當歸拈痛湯候濕熱少退後用六君子湯加蒼术黃柏澤㵼治之而痊一男子每飲食少過胸膈痞悶或吞酸兩腿作痛用導引丸二服頓愈更以六君子湯加神麴麥芽蒼术二十餘劑遂不復作河間云若飲食自倍脾胃乃傷則胃氣不能施行脾氣不能四布故下流乘其肝腎之虛以致足腫加之房事不節陽虛隂盛遂成腳氣亦有內傷飲食脾胃之氣有虧不能上升則下注為腳氣者宜用東垣開結導引丸開導引水運化脾氣如脾虛濕氣壅遏不通致面目發腫或痛者宜用導滯通經湯以踈導之一婦人患腿痛兼足脛攣痛服發散藥愈甚脉弦緊此肝腎虛弱風濕內侵也以獨活寄生湯治之痛止更以神應養真丹而弗攣矣以獨活寄生丹熟四物加羌活天麻兔絲木瓜王執中舊有腳氣疾遇春則足稍腫夏中尤甚至冬腫漸消偶夏間依素問注所說三里穴之所在以溫針微刺之翌日腫消其神效有如此者繆刺且爾況于灸乎有此疾者不可不知千金謂腳氣宜針灸藥三者並用史載之謂不許其灸熱指迷方云若覺悶不得灸之凡灸腳氣三里絶骨為要而以愛護為第一王舊有此疾不履濕則數歲不作若履濕則頻作自後嘗忌履濕凡有水濕不敢著鞋踐之或立潤地亦不敢久須頻移足而後無患此亦愛護之第二義也有達官久患腳氣多服八味丸愈亦以腳氣衝心惟此藥能治有人舊患腳弱且瘦削後灸三里絶骨而腳如故益知黃君針灸圖所謂絶骨治腳疾神效信然也同官以腳腫灸承山一穴瘡即乾一穴數月不愈不曉所謂豈亦將攝失宜耶是未可知也執中母氏常久病夏中腳忽腫舊傳夏不理足不敢著艾漫以針置火中令熱于三里穴刺之微見血凡數次其腫如失去執中素患腳腫見此竒效亦以火針刺之翌日腫亦消後常炙之凡治此當先三里而後陽蹻等穴也王執中患腳氣指縫爛每以茶末糝之愈他日復腫而爛用茶末不效漸腫至腳背上以為腳氣使然竊憂之䇿杖而後敢行偶賣藥僧者見之云可取牀薦下塵糝之如其言而愈此物不值一錢而能愈可憂之疾其可忽哉一人筋動于足大指漸漸上來至大腿近腰結了奉養且厚因酒食作此是熱傷血四物湯加酒黃芩紅花蒼术南星愈宜是丹溪忠州太守陳逢原傳云渠前知坊州因暑中取涼食瓜至秋忽然右腰腿間疼痛連及膝脛曲折不能經月右腳艱于舉動凡治腰腳藥服之無效兒子雲安刑曹偶在商熙助教處得養胃散方服之才一服移刻舉身麻痺不數刻間腳遂屈伸再一服即康寧又坊州監酒某年幾四十虛損兩腳不能行步試與此藥初進二錢大腿麻木遂能起立再服二錢大小指拇皆麻迤邐可行三服馳走如舊太室居士得此方乾道己丑嵗在鄂州都幕府日宋判院審言久病腳膝緩弱不能行步試與此藥初進二錢大腿麻木遂能起立再服二錢大小指拇皆麻迤邐可行三服馳走如舊數日來謝此疾經年無藥不服得方次日即合二服見效五服良愈今有力能拜起矣後數日又云因浴遍身去薄皮如糊肌骨遂瑩其效如神其方用全蝎半兩天麻三錢蒼木一兩去黑皮草烏頭二錢去皮腳生用黑附子二錢炮去皮臍右為細末拌勻如腎氣豆淋酒調一大錢豆用黑大豆能除去腰腳筋骨疼痛其效如神藥氣所至麻痺少時須臾疾隨藥氣頓愈金山長老於張顯學甘露寺齊㑹上說此方渠舊患腳氣曽於天台一僧處傳方用木瓜蒸艾服之漸安後來住金山日日登陟腳復痠重又一堂衆處得此方合服頗覺輕健勝前日方云破故紙炒舶上茴香酒浸一宿炒葫蘆巴炒牛膝酒浸一宿肉蓯蓉酒浸一宿川續斷揀淨生用杜仲去粗皮薑汁製一晝夜炒令絲斷黃色用各四兩同為細末右用艾四兩去枝梗稱以大木瓜四個切作合子去盡瓤以艾實之用麻線札定蒸三次爛研和藥為丸如梧桐子大每服五七十丸溫酒鹽湯食後服申屠府判傳腳氣流注四肢手指腫痛不可屈伸四物湯去地黃加附子入薑煎服如常法遇疾作時服之必愈是齊云腳氣上攻流注四肢結成腫核不散赤熱焮痛及治一切腫毒用甘遂為細末以水調傅腫處又濃煎甘草一味服之其腫即散二物本相反須兩人買各處安頓切不可相和清流㕔子韓詠苦此一服病去七八再服而愈云得之牛馬牙人醫者之意正取其相反故以甘遂傅其外而以甘草引於內所以作效如磁石引針之義也並集成立齊治余舉人弟及二十腿膝腫痛不能伸屈服托裏藥反甚以人參敗毒散加檳榔木瓜柴胡紫蘇蒼术黃柏而愈施沛然治張侗初足脛痛三年矣診之兩尺沈細而澀此下焦元氣不足不能榮養筋骨宜用滋補舒筋之劑不數服病少間㑹勞病復作且甚再診則脉兼浮數元氣愈耗矣為製人參膏及河車天乙丸間服元氣漸壯獨兩脛作楚足跟瘡腫薛立齊治一婦人素血虛因大勞兩足發熱晡熱月經過期或用四物芩連飲食少思胸痞吐痰用二陳枳實黃連大便不實吐痰無度足跟作痛曰足熱晡熱月經過期肝脾血虛也胸痞吐痰飲食少思脾胃氣虛也蓋胃為五臟之根本胃氣一虛諸病悉至先用補中益氣加茯苓半夏脾胃漸健乃佐以六味丸補脾腎不兩月而痊一婦人經候不調發熱晡熱胸膈不利飲食少思服清熱寬中消導之劑前症益甚更兼肢體痠痛服除濕化痰等藥經候兩三月一至服通經降火之劑足跟足趾作痛其熱如炙此足三隂虧損用補中益氣六味地黃兩月諸症漸退又用前湯并八珍湯兩月而康一婦人勞則足跟熱痛作隂血虛用八珍而痊後遍身騷癢服風藥發熱抽搐肝脉洪數此肝家血虛火盛生風以天竺膽星為丸用四物麥冬五味芩連炙草山梔柴胡煎送而愈一婦人兩足發熱足跟作痛日晡熱甚此腎肝血虛用逍遙散六味丸五十餘劑諸症悉愈朱丹溪治一人足跟痛疾有血熱用四物湯加黃柏知母牛膝之類治法治腳汗用楊花著鞋中或如綿絮入在襪內尤佳百一方不能除為製萬靈膏去樟冰加韶粉蘇合油麝香以軟帛緊兩脛仍令飲甘草湯不頃刻而痛若失先是兩股傍亦傷痛用膏後并愈其方載本草綱目以意增損之後用黃耆建中湯加歸參滋養全瘳吳橋治周千户孫幼得軟腳疾治者以為痺也百治亡功橋診之六脉沈滑有力曰病由多服燥藥而傷脾氣脾氣不運故積濕痰氣下陷而痰從之故足重而軟耳劑以補中去濕加萆薢木瓜寄生半夏二劑減半四劑復初太函集聶久吾甥年十九初患吐血用滋養清涼之劑而愈後因體虛兩足感冒風寒遍身發熱初以為內熱也仍服清火化痰藥而未經發汗散數日後遂成腳氣兩足脛及腳背腫痛又二日則兩膝痛甚不能屈伸因而遍身作熱絶似傷感且小便黃而大便澀豫知其腳氣初發也用酒大黃二錢五分赤苓黃芩防己茵陳各一錢乾葛一錢二分枳殼炒製蒼术木瓜各七分厚朴前胡羌活防風牛膝各六分甘草二分水煎空心或飢時服足跟瘡薛立齊治通府黃廷用飲食起居失宜兩足發熱口乾吐痰自用二陳四物益甚兩尺數而無力此腎虛之症也不信仍服前藥足跟熱癢以為瘡毒又服導濕之劑赤腫大熱外用敷藥破而出水久而不愈及用追毒丹瘡實如桃始信薛言滋其化源半載得瘥一男子素不慎起居內熱引飲作渴體倦兩足發熱後足跟作痛或用清熱除濕之劑更加發腫又服敗毒之藥焮赤痛甚却用袪毒清熱潰裂翻張狀如赤榴熱痛如錐內熱晡熱此因足三隂虧損朝用十全大補夕用加減八味丸外敷當歸膏兩月餘而愈其服消毒等藥而殁者不能枚舉一膏粱之人兩腳發熱作渴左尺脉數而無力謂此足三隂虧損防患疽不信反服清熱化痰之藥更加晡熱頭暈又服四物知柏日晡熱甚飲食漸少而發疽乃用補中益氣六味地黃百餘而愈其不信以致不起者多矣治逺行腳腫痛方用之可行千里輕便甚妙防風細辛草烏等各為細末糝藥一法以蚯蚓塗腫處高閣起腳一夕即愈醫說續編立齊治楊錦衣腳跟生瘡如豆許痛甚狀似傷寒謂獵人被兔咬腳跟成瘡淫蝕為終身之疾若人腳跟患瘡亦終不愈因名兔囓也遂以還少丹內塞散治之少可次因納寵作痛反服攻毒藥致血氣愈弱腿膝痿軟而死蓋足跟乃二蹻發源之處腎經所由之地若瘡口不合則蹻氣不能發生腎氣由此而泄故為終身之疾況彼瘡先得于虛復不知戒雖大補氣血猶恐不及況服攻毒暴悍藥以戕賊之乎王大國治南昌司理胡慎三左足患癰直穿腳底醫已數易日甚一日痛楚幾絶國至命急去敷藥止服湯劑司理曰湯劑豈能生肌耶國曰願限半月全愈服至三四日瘡口漸合司理大喜才二十日肌肉已滿江西通志柴嶼青治陳學士向山長男孝亷忽患兩足涌泉穴中俱有隱隱一青圈旋即破口出水疼痛異常延醫治之俱不識其症診之兩尺極微弱症屬少隂不足所致遂定十全大補湯乃以年少畏服力勸之服二十餘劑而愈續名醫類案卷二十五
