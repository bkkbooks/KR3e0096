body:
  text: 續名醫類案卷四十四錢塘魏之琇撰小兒傷寒喻嘉言治袁仲卿子因捉蟛蜞仆水中家人救出少頃大熱呻吟或與鎮驚清熱丸散二日遂昏迷不醒胸髙三寸頸軟頭傾氣垂絶無生理矣診其脈止存蛛絲過指全無以湯二匙入口微有吞意曰外症之重不懼但脈已無根不可救也一醫曰鼻如煙煤肺氣已絶縱有神丹亦將奈何因思此兒受症何至此極請主人及客稍逺待某一人獨坐靜籌其故病危之家親賓滿座議論紛紜徒亂人意不可不知良久曰得之矣凡驚風一症乃前人鑿空妄談後之小兒受其害者不知凡幾昔與幼科爭論殊無證據後見方中行傷寒條辨後附痙書一册顓言其事始知昔賢先得我心如此症因驚而得其實跌仆水中感冷濕之氣為外感發熱之病其食物在胃中者因而不化當比夾食傷寒例用五積散治之醫者不明以金石冷藥鎮墜外邪深入臟腑神識因而不清其食停胃中者得寒涼而不運所進之藥皆在胃口之上不能透入何以上云鎮墜深入臟腑轉積轉多以致胸髙而突宜以理中藥運轉前藥倘得症減脈出再用傷寒藥尚有生理或謂鼻如煙煤肺氣已絶而用理中得毋重其絶乎曰所以獨坐沈思者正為此耳蓋煙煤不過大腸燥結之徴若果肺絶當汗出大喘何得身熱無汗又何得胸髙而氣不逼且鼻準有微潤耶此所以望其生也遂以理中湯一盞灌入喉中大爆一口前藥一齊俱出胸突頃平頸亦稍硬但脈仍不出人亦不蘇此食尚未動關竅阻塞之故再灌前藥些少熱漸退症漸減乃從傷寒下例以元明粉一味化水連灌三次是夜下黑矢甚多次早忽言一聲云我要酒喫此後尚不知人事以生津藥頻灌一日而蘇龔子才治一小兒八嵗患傷寒頭痛身疼發熱口乾面赤無汗或以傷寒治之不效已旬日與龍腦安神丸一服其汗如雨即安一小兒沈默昏倦肢冷驚悸其紋如弓之向裡此屬胃氣虛而外感寒邪也先用惺惺散以解外邪諸症悉愈但手足逆冷又用六君子調補元氣而安一小兒傷寒嘔吐發熱面赤白消導清熱之劑飲食已消熱未退用六君升麻柴胡四劑而痊髙鼓峰治吳維師子甫十嵗發熱口渴胸腹悶痛曰少陽陽明症也用加味小柴胡湯是夜發暈逾一二時吳驚甚曰無傷也但此病不傳瘧不傳痢逾三日熱退果小腹痛先解黑矢無數隨後便膿血而痢矣連用當歸解毒湯五六劑而痢除繼以六君子湯調理而安馬元儀治張伯卿子年十二患傷寒譫語發熱不知人事已五六日幼科屢治不應漸至目直神昏診之兩脈弦急拒指因驚後飲食與痰留結不解壅遏為病胃氣生熱津液內亡而讝語陽明之脈絡於目經盛則絡亦盛故目直視也實熱在胃惟用承氣以調之使壅滯之氣悉反沖和則津液存得而病自去矣加服抱龍丸以豁痰治驚服後便行二三次熱勢大減明日全愈蔣仲芳治陳受伯弟年十一嵗傷寒病起幾至二百日粒米不入食即脹滿諸藥不愈惟日以人參三錢煎飲而已視之骨瘦如柴六脈沈細似宜參术然按其心胸小腹硬塊已滿著手即痛曰憑脈則難以下藥不下亦無生理遂用當歸元明粉各三錢酒蒸大黃二錢杏仁麻仁蘇子桃仁俱炒為末各一錢白芍川芎桔梗各七分水煎服服後即去黑塊二三十中脘硬處下有寸許然已虛極明日去大黃元明粉加人參二錢服一劑後日復用首方又去黑塊一二十二方間服半月黑塊始盡而愈小兒感症總制石公子年甫十齡丁丑六月患感冒風暑寒熱頭疼幼科已用葛根加羌防解表矣後復寒熱不減氣喘腹脹醫者用消導加小柴胡湯不應神昏喘急時或泄瀉似痢腹痛不知名為何疾也診之已二十餘日脈數無力神氣昏亂按其腹時痛時脹觀其神時靜時躁手足或冷或熱虛汗不已此外邪初感者為藥而解久積者未曽清理加之飲食失調元氣欲脫致外邪內陷今以救本為急用理中湯加桂附痛瀉頓減手足亦溫然熱不退小便赤澀用金匱腎氣湯二服小便方利而寒熱愈加此元氣漸因症候復現也朝用六君子湯加柴葛神麴乾薑夜用六味湯加參桂旬日後寒冷拘攣目上竄咬牙呻吟咸以為無救矣陳曰此名寒戰正氣將回積邪欲出乃吉兆也自未至酉始大汗如雨手足軟怠不語熟睡天明方能言然虛症日出湖熱汗多則用補中湯合建中加附子不寐則用歸脾湯元氣弱則用十全大補湯腹痛滑瀉則用理中六君湯如是調理三月方瘳蔣仲芳治一小兒在水閣風雨率至又驚又寒後四肢厥冷漸至遍身惟心口稍暖此冷風入骨症也冷至心窩則死用理中湯加附子一錢數服而寒始退聶久吾治司理毛具次子年十一夜間忽發大熱頭痛身又痛咸以為病暑也及問其由細察其脈乃感寒耳謂必須發汗其家以現在多汗為疑曰此汗不當數必用藥發汗方可除病遂與一大劑令其熱服出汗至天明諸症盡退再與清解數服而安羌防各六分陳草各三分芎芷各四錢赤芍五分香薷乾葛各一錢二分蒼术蘇葉香附各八分薑三片小兒傷風薛立齋治一小兒傷風咳嗽發熱服解表之劑更加喘促出汗以為脾肺氣虛欲用補中益氣湯加五味子補之不信乃服二陳桑皮杏仁枳桔之劑前症益甚又加發搐痰壅仍用前方加釣藤鉤而痊陳文中治太師賈平章子宣機三嵗頭熱目赤痰齁不已一醫言風熱盛痰涎作陳曰因脾肺虛而風冷寒痰所作又一醫言熱即生風冷即生氣陳曰不然三冬盛寒冷則生風九夏炎熱熱則生氣蓋風者百病之長也若寒得之而謂之風寒若熱得之而謂之風熱若燥得之而謂之風燥若濕得之而謂之風濕此非獨熱而生風也如暗風破傷風臍風慢驚風及風癎驚癎食癎等症而皆作搐非但熱而生風也宣機病始於頭熱目赤便以涼藥餌之致寒涼氣客於喉厭之間與津液相摶又生痰齁症其喉厭寒痰冷氣壅塞不通故頭熱目赤無由得愈治法當斡去喉厭間寒痰令氣得通其病可愈遂投芎蝎散一服用手斡去寒痰冷涎四五口次以油珠膏一服而愈病源方論曽世榮治衡州萬户張侯寓屯田日長子三嵗六月得患不語手足􅭩縮已經二旬曽至諸醫議論不一觀外形面垢有熱氣促流涎口眼喎斜不省人事次則手足俱冷而􅭩縮身背反張診六脈沈按而緊獨心肝脈虛而細數餘脈緩弱曰面垢色脈細數此因中暑感風前賢所謂暑風者是也手足冷縮而不伸或服涼劑太過寒之使然若手足溫其效自速乃以治暑法分隂陽順中氣玉芩散加寬氣飲薑汁沸湯調下三服其症稍慢次疏風和榮衛百解散加荆芥人參當歸水薑煎投隨以溫灰湯澆洗手足藥一服洗一次至八九次手足溫則血活活則筋舒舒則手足運動如常餘熱未除消暑清心飲主之聲音不全二聖散取效調理惟用萬安飲恰九日前症俱減張侯曰此子更生端藉藥力不敢忘也因筆漫記後有是症仿此活人亦方便心矣立齋治一小兒傷風鼻塞流涕服藥過重發搐呵欠頓悶汗出氣喘久不愈其母因勞役發熱用補中益氣湯時以五七滴與兒飲之母子並愈一小兒傷風發搐痰盛喘急謂此脾肺氣虛腠理不密而外邪所乘用六君加柴胡升麻桑皮杏仁一劑痰喘悉退又一劑去桑杏加鈎藤而安乃用異功散數劑不復發此症若不補脾胃實腠理專治痰邪鮮有不誤小兒暑繆仲淳治髙存之次子童時夏月身熱十晝夜止飲白湯諸醫汗之不解以麻仁丸下之熱如故繆診曰此傷暑也白虎湯是其本方因誤汗下虛甚加人參三錢一劑微汗瞑眩少頃熱解更疏一方防其瘧痢仍用人參二錢兼健脾清暑導滯之劑未幾瘧作如方飲之瘧止痢又作存之不得已於生脈散中加益元散飲之兒尫羸甚謂數日後死矣仲淳復至語之故曰生脈益元散得之矣不診而諦視兒問糜甘否曰甘大呼曰病去矣存之問故曰視兒目光炯炯且飲食味甘是精神已王胃氣轉矣尋果脫然起臧玉涵子嵗半盛夏咳嗽七日因浴受驚又傷食大熱倦頓三日不敢與藥目翳唇繭舌乾仲淳曰此暑病也當與白虎湯曰腹瀉石膏無害乎曰先以天水散探之服二錢少頃藥夾痰而吐微汗身涼黃昏復熱又以天水散二錢不效仲淳曰其為暑症無疑當以白虎湯加人參因兒患肺熱且止再診之曰暑邪客於皮膚分內有熱無寒是為疸瘧斷當用白虎湯連服二劑不效鼻露眼開口不納氣勢甚危曰此正氣不足勝邪也刺瘧論云凡瘧先時一食頃乃可治過時則失之也又云無刺熇熇之熱無刺渾渾之脈無刺漉漉之汗意者服藥不得時耶將前藥并劑煎露一宿雞鳴溫服之病頓失不須調補精神漸復以此知察病望氣及服藥之貴及時也蔣于宫第五子一嵗傷暑發熱服此藥驚風之劑十餘日驚搐幾殆又進蠟丸等死去矣豫察其誤中於藥以補脾湯加減治之立愈慈幼篾小兒傷食陸道先治一兒多食果腹脹醫罔效光取桂麝瑞香三味為丸服之立愈平湖縣志龔子才治一小兒食粽後咬牙欲吐頃間腹脹昏憒鼻青黃赤此脾土傷而心肝動食積發厥也先令雞翎探吐出酸物頓醒節其飲食勿藥而愈一小兒好喫粽成腹脹痛用白酒麴末同黃連末為丸服之而愈一小兒因停食脹痛服峻利藥後患瘧日晡而作此元氣下陷以補中益氣湯治之愈髙鼓峰治吳章成弟八嵗發熱悶亂大便不通醫作感冒治髙曰此得之傷食因發散太過遂成虛熱兼風藥燥血故不便耳名言當玩先以六味飲加肉從蓉三錢飲之下黑矢數十枚繼以補中益氣湯數劑而諸症悉除薛立齋治一小兒傷食發熱面赤或用養胃湯枳實黃連山查治之更加腹脹午後發熱按其腹不痛此飲食雖化脾胃復傷用六君子湯數劑而愈一小兒傷食發熱嘔吐面赤服消導清熱之劑飲食已消熱赤如故曰此胃經虛熱耳用四君子湯加升麻柴胡各二分四劑而痊一小兒傷食發熱面赤抽搐嘔吐氣喘吐痰以飲食傷脾發熱肺氣虛弱所致耳用六君子湯加炒黑黃連山梔各二分四劑而痊一小兒飲食停滯服消導之劑曰此脾胃氣虛不能剋化也法當調補為善若數用剋伐之劑脾氣益傷飲食愈停矣已而腹內人結一塊寒熱潮熱食少作惡大便不實用四君子湯飲食漸增又用補中益氣湯而愈萬密齋治孫監司女病後誤食菱角傷脾面腫而喘用錢氏異功散加藿香葉以去脾經之濕紫蘇葉以去肺經之風一劑而安外甥女有食積脾虛病痘後又傷食甚瘦腹脹不喜食用胃苓丸方加枳實炒神麯麥芽青皮作丸服之一兒因傷食腹痛脹醫下之而愈又傷食腹脹醫再下之曰非其治也誤殺此兒果半年而死或問故曰凡飽食傷胃而脹宜消導之脾虛不能消食而脹宜補之以助其傳化醫者不察乃一下再下致腹大無紋臍突背平脾腎皆傷不死何待王間一子周嵗因食豬肉受傷肢體瘦削使人求藥問其詳乃食積疳此有餘病也與脾積丸五粒教以豬肉湯吞之果下一塊如小指大涎沫裹之而出頓安馬銘鞠治華氏子連食冷鴨子二枚午間又縱恣飲食更餘病發上不吐下不瀉胸腹脹滿目閉氣喘身熱按其胸腹則雙手來護曰食也鴨子黃閉氣得水則化今尚在胃口急索大棗數枚煎湯入砂仁錢許以通其氣兒渴頓飲碗許氣漸通目開手足亦漸流動再煎飲之夜半吐瀉交作次日勿藥而愈立齋治楊錦衣子十嵗腹脹痛服消導藥不應彼以為毒請診其脈右關沈伏此食積也河間云食入即吐胃脘痛更兼身體痛難移腹脹善噫舌本強得後與氣快然衰皆脾病也審之果因食粽得此以白酒麴熱酒服而愈張子和曰舞水一富家有二子長者年十三幼者年十一好頓食紫櫻一二斤每嵗須食半月後一二年幼者發肺癰長者發肺痿相繼而死張常歎曰人之死生命耶天耶古人有詩爽口味多終作疾真格言也天生百果所以養人非欲害人然富貴之家失教縱欲遂至於是吳振公次女四嵗傷食吐瀉發熱發顫豫謂此女多食瓜果致藏氣不行釀成濕熱既經吐瀉濕去熱留藏府之中無隂相養故變成風象為定參术半夏砂仁乾薑厚朴歸苓一方某醫謂弱齡女子豈得服參术遂易他藥服至五日人事昏沈頭遍睛露復延治以溫中補脾救之立蘇慈幼篾小兒受驚竇材治一小兒因觀神戲受驚時時悲啼不食如醉已九十日危甚令灸巨闕穴五十壯即知人事曰適間心上有如火滚下即好服鎮心丸而愈萬密齋治一小兒年五嵗夢中驚哭抱其母叫怕此因被驚嚇得之為製一方用人參麥冬茯神黃連棗仁柏子仁炙甘草為末山藥粉糊丸黍米大每服二十五丸燈草湯下未盡劑而安龔子才治一小兒五嵗因看會見裝鬼臉被驚嚇兩眼黑睛翻向裡白睛翻向外視物微覺一線諸醫束手龔視之曰此兒曽出痘疹否對曰未曰俟出痘疹可治逾月痘疹盛行其兒似有將出之機因延治以綿胭脂水泡出汁慢火熬成膏塗兒兩眼胞上下一日塗兩次直致痘疹靨後其眼復舊未曽發明其故吳孚先治一小兒先天薄弱膽氣甚小六嵗時在孰中見師以戒方在渠背後責同學生驚而受病不時驚叫叫必左腳提起震地一聲五六年矣百治不效吳曰肝喜驚呼肝氣虧損極矣然腎為肝母心為肝子用補肝腎并鎮心安神之藥五十餘劑丸藥三料而愈楊士瀛云小兒口噤不開豬乳飲之良月內胎驚用硃砂牛乳少許抹口中甚妙此法諸家方書未知用豫傳之東宫吳觀察子病此用之有效本草綱目馮楚贍治張氏兒周嵗卧低炕睡中墜下毫無傷損嘻笑如故但自後右手足攤軟不舉手不能握足不能立脈則洪大久按無力知為先天不足復於睡中驚觸氣血不周行之故與熟地四錢麥冬一錢五分炒白术二錢四分牛膝二錢五味子四分製附子五分煎小半鍾入人參汁二三分沖服六劑手足輕強精神更倍陸養愚治陳雲谷子年十四四月終自館中歸偶戲水旁一人在後曰師來也因驚仆水頭面俱濕回家夜間身熱頭痛至晨煩躁不安胡言亂語及問之欲言而不能出聲或謂六脈浮緊此傷寒也表氣鬱冒致裡氣不舒故煩亂宜大汗之用五積散令密室重覆汗出透衾明日手足搐搦項背強直氣出不納自汗不語又投抱龍丸鈎藤散不效脈之兩寸浮數而散關尺沈弱而澀此因驚恐肝腎受傷經曰驚則氣亂胡言亂語氣亂故也語不能出者氣下故也初時以平肝鎮心之中少佐以壯氣血之品病當自愈乃誤為傷寒大發其汗汗多則亡陽變而為痙強直搐搦蓋痙症也經曰陽氣者精則養神柔則養筋今陽氣竭血無所附以養筋故不柔和也陽氣盡浮於外故氣不納而自汗不語急用大料參芪為君以救垂絶之陽四物為臣入天麻以養肝經之血棗仁五味為佐以收耗散之神甘草麥冬為使以徹浮遊之火二劑頓減復以硃砂安神丸間服旬日而安萬密齋治胡鳯崖子痘後傷食成疳肌瘦髮穗一醫治之已效别生一病似癎非癎晝則安靜夜則夢寐間抱其乳母叫云我怕我怕如人捕之之狀詢其由兒性畏藥醫來灌服必將針火恐嚇之蓋恐則傷腎又腎藏志虛則神志不寧而生驚寤則神栖於心寐則神栖於腎脾為往來出入之門户以補脾為主安神次之補脾肥兒丸安神丸調理半年而安英山大尹吳清溪子病驚風皆作風治之不效曰非風也乃因驚得之風從肝治驚從心治不識病原如何有效乃取至聖保命丹治之搐止矣馬元儀治一童子讀書見其師因恐致病從朔日起昏憒不知人事七日乃蘇羣作驚治延久不瘥曰此恐也非驚也或問驚恐何以别之曰驚從外來恐從內驚則傷心恐則傷腎腎傷於恐真水受虧龍火泛越擾亂神明復遇朔日謂之重陽其隂更為之困至七日而隂氣來復然後龍歸窟宅如風雲散而天氣清明也治宜壯水之主以鎮陽先以六味地黃湯補其真隂加逺志以通神明肉桂導龍火歸源服此後竟不作小兒驚風萬密齋治徐道淑子病驚風先請張醫治之不效萬至病已七日發搐無時痰鳴氣急勢甚危按治驚之法先降其痰次止其搐後補其虛一言以蔽之惟治其火而已乃用河間涼膈散改朴硝為馬牙硝水煎成湯入青礞石末調服之痰下喘止隨用瀉青丸導赤散二方相合作湯服之而搐止餘熱未除張主小柴胡湯竹葉湯涼驚丸皆不然之乃用四君子湯加炒黑乾薑一服身涼徐問故曰大凡小兒肝常有餘脾常不足肝主風搐搦氣逆皆屬於肝經曰太過則乘其所勝而侮所不勝故肝木旺則乘脾土侮肺金夫肝火名曰龍雷水不能制寒不能勝故以炒乾薑合參术甘草之甘溫以補為瀉而愈也按治法仍以寒涼折其標以甘溫固其本若據後半云云豈不打成兩橛汪元津子年五嵗傷食成瘧瘧後發搐乃脾虛病也萬曰凡治驚風必用瀉青丸導赤散雖良工不能廢其繩墨也今此症不可瀉宜用調元湯琥珀抱龍丸如言服之而搐止但目不能開昏昏喜睡蓋脾虛極矣脾主困故喜睡目之上下胞屬脾脾虛故不能開也仍以調元湯補其虛琥珀抱龍丸安其神脾喜樂命平日所與作伴嬉戲者環列牀前取鼓鈸諸器擊之或歌或舞以引之設法亦善病貌之目乍開乍閉以漸而蘇不喜睡矣羅田令朱女未周嵗病驚風萬用瀉青丸是丸治驚風之祕方也服之不效而搐轉甚蓋喉間有痰藥末頗粗為頑痰裹住黏滯不行之故乃煎作湯用薄綿紙濾去滓一服而愈羅田曽教諭子病驚風先請一醫繼召萬同治醫主小續命湯多辛燥之藥必反助火邪而病益甚不如通聖散為愈服未盡劑而安治風病者宜三復此張世魯子病驚風已十七日矣目右視而眨音劄目動也口右張而動手足向右掣引舌上黑胎勢甚危急令急取薄荷濃煎湯洗其舌謂之曰若黑胎去而舌紅則病可治否則不可治也洗之黑胎盡去以瀉青湯作大劑服之口眼俱定手口不掣以涼驚丸至聖保命丹調理十日而安聞氏子六嵗病驚風延萬至則悶死治凶具矣視其形色未變與神仙太乙丹半粒穵口灌之並蘇方見蠱門留都金二守女患驚風甚危諸醫皆勿救自用活絡丹一丸即愈外科蘆揮陳三農治一小兒急驚雙眸突出舌吐三寸角弓反張兒科望而却走曰此風火相扇風痰上涌而然用稀涎散薺汁調服吐痰涎數目舌俱收後三日復如前症以腸胃膠痰尚在下也以神效丸薑湯化下去膠痰二三升愈曽世榮治總管楊侯幼子四嵗臘月得患驚風搐掣諸醫調治前症俱解但神昏不食四肢微冷已五日矣前醫用醒脾治陽之藥不一而召曽診六脈獨脾脈沉滑餘脈微緩脾脈沈而滑者此積藴在脾乃為脾約當主大便不利非隂厥也彼曰然遂用瀉黃散加大黃水煎併三服大補一隂厥也神氣清而飲食進隨獲安此隆冬用大黃之功也用藥如用兵當用豈容自己如五月渡瀘雪夜平蔡何待秋髙馬肥而後為之若拘以四時取用則兵藥無成功矣幼幼心書大德戊戌夏曽因幹出郭至五里外有夫婦二人抱子而哭於道旁問之答曰入城探親三嵗孩兒忽得驚風不省人事觀其面色青黯目閉神昏診之六脈全無按太衝脈沈而微有曽顧謂曰毋慮此子可救且左右竟無人家遂於路側拾得破碗半邊有薑小塊細嚼捻汁碗中用五苓散蘇合香丸寬氣飲澆水調和灌下十數次漸覺氣回聲出目開自此蘇同上衡州同知胡省齋因其子驚風曽治之愈問曰五苓散何以愈斯疾乎曰此劑內用茯苓可以安心神用澤瀉導小便小腸利而心氣通木得桂而枮以抑肝氣而風止故多主驚風施之他症又有説胡深然之同上薛立齋治舉人杜克宏子發熱抽搐口噤痰涌此肝膽經實火之症即急驚風也先用㵼青丸一服又用六味丸二服諸症頓退乃以小柴胡湯加芎歸山梔釣藤而安却用補中益氣湯而愈冬官朱小溪子項間結核面色痿黃肌體消瘦咬牙抽搐頭搖目眨此肝木剋脾土也用六君子湯九味蘆薈丸治之而愈儒者王文逺子患瘰癧痰盛發搐服金石香燥之藥手足筋攣此肝血復傷而致急驚風也遂用加味小柴胡加鈎藤山梔芎歸一劑又以六味丸料加五味麥冬煎服而安奚氏女六嵗忽然發驚目動咬牙或睡中驚搐痰涎涌盛乃肝木剋制脾土不能攝涎而上涌也當滋腎水生肝血則風自去而痰自消矣遂用六味丸而愈薛鎧立齋父治一小兒七嵗患急驚將愈而發熱驚悸或用祛風化痰之劑更加驚搐吐痰喘嗽腹膨少食惡寒又用抱龍丸等更加大便似痢寒熱往來殊類風症視之以為脾氣虧損諸經無所資養而然用四君子湯少用升麻柴胡以升補陽氣而愈萬密齋曰一小兒驚風後右手強硬五指拳曲不能舉物兼口角流涎語言蹇澀此脾有濕痰脾不足而肝木乘之不可治也陳自明治一小兒昏憒六日不省一小兒驚風發搐諸藥不效手足尚溫謂其父母曰吾能活之與之針涌泉二穴足心良久而蘇喜而稱謝萬曰此病得之傷食宿食成痰痰壅作搐今病雖愈宿痰未去恐他日再作當制丸藥以除其根不然神氣漸昏必成癇也乃謂為牟利不信次年八月果成痰迷之病二便不知水火不避復求治因制一方以黃連山梔瀉其浮越之火膽星白附子炮以去其壅積之痰茯神逺志石菖蒲硃砂以安其神麝香以利其心竅用獖豬心中血和神麴糊為丸如黍米大燈心湯下調理半年不復發矣人與之灸風池腦後風府兩旁曲池兩肘外曲處三里曲池之下六穴而安因驚風成癎龔子才治一兒瘛瘲啼叫額間青黑此驚風肝木乘脾腹中作痛也先用六君子湯加木香柴胡鈎藤鉤啼叫漸緩更加當歸二劑而安一小兒沈困發熱驚搐不乳視其脈紋如亂魚骨此風熱急驚之症也先用抱龍丸少許祛風化痰後用六君子湯加柴胡壯脾平肝遂熱退驚定而愈周必大二老堂雜志云開元錢最治小兒急驚以水磨服少許神效余意小兒心受熱而發驚肝生風而發搐蓋木邪侮土用金制木之義耳似亦有理續醫説髙鼓峰治吕坦人子生甫數月忽急驚風抽搐直視發熱不乳醫以抱龍丸及羌活防風薄荷僵蠶等作煎調服坦人商於髙髙曰誤矣此脾土虛而肝木盛也急用五味異功散補脾加煨薑制肝進之少頃熟睡微汗熱退而乳馮楚瞻治黃氏兒甫五月忽發抽掣竄引角弓反張一夜五次發則二便併出額汗如雨勢甚危篤馮視之亡陽之勢俱備矣詢其由因常生重舌屢服五福化毒丹服後必瀉數次即愈蓋陽虛肆進苦寒脾傷下元虧極肝木無養挾火上乘脾土益傷虛風乃發以人參白术各一錢熟附四分煎服服後安然靜睡下午復發隨服隨安數劑而愈吳孚先治一小兒吐瀉後失於調治忽痰涎上涌面色青白似搐不搐右手脈沈遲而弱關紋隱隱手足尖微冷此慢驚也不速治即成慢脾莫救用白术人參甘草黃芪半夏炒冬瓜仁炮薑製附而安龔子才治一兒目內色青發搐目上視叫哭不已或用牛黃清心丸不愈反咬牙頓悶小便自遺此肝經血虛甚故耳用補中益氣湯及六味丸而瘥一小兒潮熱手足發搐痰涎上涌手足指冷左腮自申酉時青中隱白此肝經虛弱肺金所勝而潮搐脾土虛弱而足冷也用補中益氣湯以補脾肺六味丸以治肝腎而愈蓋病氣有餘當認為元氣不足若用瀉金伐肝清熱化痰則誤矣一小兒嘔吐不食手足搐搦痰涎上涌手足指冷額黑唇青此腎水勝心火也用五味異功散加木香炮薑頓安乃去炮薑再劑而愈立齋治太平王職坊子患瘧疾恪用化痰之劑虛症悉至殊類驚風曰小便頻數肝經隂虛也兩目連眨肝經風熱也作嘔懶食胃氣虛弱也泄㵼後重脾氣虛弱也用補中益氣湯六味地黃丸而痊劉應昌子患瘰癧恪用化痰之劑致與前症同亦用二方而愈汪表聖次子兩嵗偶感風邪發熱身顫角弓反張日服此藥蓋驚風金石風痰之品及羌防膽星全蠍之品昏沈欲絶蓋不知小兒氣血未壯不耐風寒才犯之即發痙病但助其氣血即風除神爽一用此等藥治則風門大開榮衛無主舊病未去新病益增安望生理豫與五味異功散加柴胡二分桂枝一分附子一分連服二劑而瘥慈幼篾之此與喻嘉言論同小兒慢驚孫文垣治姪孫女周嵗發慢驚眼開手拳目不動移腳指微動自囟門後遍身如火喉中痰聲口中痰沫腹脹下氣大便亦行先以牛黃丸蘇合丸進之不效後與藥皆從痰沫流出通關散吹鼻無嚏自申至戌不醒面色素青白氣稟甚弱因婢女抱之失跌受驚發熱此驚氣乘虛而入在法不治姑以人參三錢薑汁拌炒煎湯頻頻用匙挑入口中初三四匙皆不受又與五六匙得一二匙下咽便覺痰聲少緩因頻頻與之喉中氣轉目能動再以六君子湯加天麻石菖蒲僵蠶澤瀉薄荷煎服乃略啼吮乳次日咳嗽語聲不出小水短少以辰砂益元散一錢燈心湯調下熱退聲出改以四君子加陳皮五味麥冬桑白皮桔梗杏仁薄荷一帖全愈王叔權云澧陽有士人之子驚風後頂腫諸藥治之不效舉家驚惶至十分危急忽遇友人薦一醫士素無名稱者至則以半夏南星為細末新水調傅不至一時而其腫消人異而問之曰此古方也又此症若灸則宜灸前項等穴資生經葉𢎞士之子嵗半慢驚服金藥及風痰之劑昏悶七日指紋直抵三關醫辭不治豫投以加減補脾湯立愈慈幼篾搐搦陳文中治尚書洪端明子始生未及三個月腹脹滿足肚冷囟門髙急上氣涎潮四肢搐搦同坐衆官皆言死症洪公曰我在前死了七八個兒子皆是這般症候此兒子足見難醫枉廢生受亦不召醫視之或告陳因往視而謂之曰小官人此症候不死尚可救活運使曰此兒必死毋勞用計衆官聞文中之言皆喜遂從旁勸曰陳君髙明既有救療之心豈無起死之䇿從其言而治之以觀效否何如運使從説乃用油珠膏一服次用長生丸一服便下黃稠粘涎約半盞內有白妳塊如小豆大十餘塊是風痰結聚乳妳一併便下後用前胡厚朴散加附子兩片二服而愈病源方論淮西戴運使小娘子始生周嵗腹中氣響痰涎壅閉手足抽掣欲與芎蠍散斡取痰涎運使曰兒子小難依此施治陳曰前制參劉菊坡小兒始生五個月因作搐乃服芎蠍散斡去痰涎次服油珠膏即愈菊坡贈一跋於卷末今運使小娘子因驚嚇畜冷氣於喉厭間傳入肝膽其氣上不能升下不能降血氣不能流轉故痰涎壅閉而作搐也若不依此施治必不起遂以芎蠍散一服用手法斡去喉厭寒痰約半盞次用油珠膏二服後用補脾益真湯三服再用前胡厚朴散長生丸各二服而愈同上小兒發搐即瘛瘲萬密齋治一小兒二嵗發搐已死家人痛哭乃阻之曰此兒面色未脫手足未冷乃氣結痰涌而悶絶非真死也取艾作小炷灸兩手中衝穴火方及肉而醒大哭父母皆喜遂用家傳治驚方以雄黃解毒丸十五丸利其痰涼驚丸二十五丸去其熱合之煎薄荷湯送下須臾利下黃涎搐止矣一兒發搐痰涌有醫用白餅子下之不退凡三下病益深合目昏睡不哭不乳喉中氣嗚上氣喘促大便時下萬曰五臟氣絶不可治轉下之過也彼醫曰白餅子錢氏下痰神方也萬曰盡信書不如無書錢氏小兒皆出於門人附會之事也虞天民謂錢乙書出於門人閻孝忠所集非錢氏本意也蓋人之有痰猶木之有津時令大熱草木流津痰自熱生此明驗也痰猶水也附氣自行過顙在山豈水之性哉乃博激使之也今痰隨火上不知降火而反下之損其胃氣胃氣既敗五臟俱損故目不開者肝絶也昏睡不語脾絶也啼聲不出者心絶也喘促痰響者肺絶也便尿遺失者腎絶也果不可治而死一小兒周嵗發熱而搐以瀉青丸投之不效乃問其發搐之狀其母曰搐過後只好睡以乳與之則飲不與則不思醒時則戲作貓兒聲見人則笑不發搐便是好了萬曰醫要識症藥要對症怪底前藥之不效也以導赤散服之一劑而安其父問故曰心臟屬火其聲為笑火生於寅屬虎貓者虎之類也貓聲而笑知非肝病乃心病也故以導赤散瀉其心火而安一兒發搐五日不醒藥石難入萬針其三里合谷人中而醒父母喜曰吾兒未出痘疹願結拜為父乞調養之萬曰曩用針時針下無氣此稟賦不足也如調理數年後出痘可保無事若在近年不敢許次年果以痘疹死張子和治李一小兒病手足搐搦張曰心火盛也勿持其手當聽之此由乳母保抱太極所致乃令掃淨地以水灑之水既乾令復灑之令極濕俯卧兒於地上良久渾身轉側泥涴皆滿仍以水洗之少頃而瘥子和曰小兒風熱驚搐乃常病也當搦時切戒把捉手足握持太急必半身不遂也氣血偏勝必痺其一臂漸成細瘦至老難治當其搐時置一竹簟鋪之涼地使兒寢其上待其搐風力行遍經絡茂極自止不至傷人豫嘗診一兒見其左掌拳曲詢其由乃小時患驚搐為母抱持太急病愈手遂不能伸舒按此症若初得以大劑肝腎隂劑與之必能伸舒如故惜世無知者葛茂林治少師楊公子當暑而驚眩已絶且移之木矣葛趨而入曰無傷也亟出之公曰兒已噤矣奈何劑也葛曰豫無劑也所恃者天上雲耳雲生而凄凄欲雨隂氣舒而陽鬱消吾以清利物煮水而蒸於下其可瘳乎果如其法而疾愈逮至日暮則其子已戲於庭矣杭州府志一兒發搐先取善推法推之止向後發病益危甚萬曰推法者乃針灸按摩之遺意也經曰無刺大虛人推搯之法壯實者可用之如怯弱者其氣不行推則有汗反傷元氣也其家不信萬曰不死必成癇半月後果死一兒發搐因用推法萬曰病成癎矣可奈何蓋壯實之兒可用之若怯弱者其氣反不行矣推法者乃發表之意痰聚在心不得出也幸初成癇當可治若久則為終身錮疾不可治也立方用黃連五錢硃砂二錢五分白甘遂三分膽星一錢為末米糊為丸獖豬心血杵勻丸芡實大每服一丸燈草煎湯化下夜服三日服一遂安一兒發搐醫以二陳湯薑汁竹瀝治之不效萬視其外侯三關青氣兩頰赤色目常直視指如撚物曰此得之外感未與發散熱入於裏錢氏曰肝有熱則目直視得心熱則發搐又曰兩頰赤而目直視必作驚風小兒肝常有餘又乘木旺之時當與瀉肝若二陳湯陳皮半夏生薑之辛皆助肝之物經曰以辛補之所以無效乃用瀉青丸瀉肝木之有餘導赤散以瀉心之火一服而搐即止因其胎稟素怯脾胃且弱恐後作搐便成癇疾又與琥珀丸常服而安邑中有儒醫治病多良方惟性太執不知變通時有兩小兒發搐萬謂急驚當用涼瀉導赤散瀉青丸是也彼謂驚風者肝火鬱遏而成火鬱則發之論極是小續命湯是也方大謬人從而兩治之萬治者生彼治者死薛立齋治一小兒三嵗因驚搐搦發熱痰盛久服抱龍丸等藥反致面色或赤或青此心肝二經血虛風熱生痰不足之象也用六味丸滋腎生肝血用六君柴胡升麻調補脾胃而安髙鼓峰治徐彥為子甫四嵗盛夏發熱驚搐不已腰曲目直小便短赤面無神色醫作傷寒不應髙視之曰火燥生風風淫末疾非傷寒也用滋水清肝飲盡一劑而汗解便利熱退髙曰瘧至矣立用五味異功散補脾加麥冬五味生脈清暑十餘劑而愈陸肖愚治鞠氏子年十一向因水土不便泄瀉瘦弱四月終旬蒸熱淫雨忽患頭面大腫手足身體亦微腫或謂風熱與蘇葉羌防升麻柴葛等汗大泄既而痰涌吐逆語言不倫身強直手足振掉又謂急驚風用抱龍鎮心等丸不效脈之浮緩而弱此因脾虛土不勝水值濕氣盛行內濕與外濕相感而作腫治宜健脾滲濕乃反發汗致升動其臟腑之痰涎漏泄其經絡之津液宜其變症若此也因用六君子湯加歸芍投之一劑而吐止數劑而僵直振掉除又數劑精神復加澤瀉倍茯苓數十劑而腫消瀉止薛立齋治憲幕顧斐齋元孫二周項結核兩臂仄張素敗毒果係前症遂與六味丸一服侵晨灌之午後肢體如常一兒兩目眨動手足發搐數服天麻防風丸之類以祛風化痰前症不愈其痰益甚得飲食諸症稍愈視其準頭及左頰色青黃曰脾主涎此肝木制脾土不能統攝其涎非痰盛也遂用六君子湯加升麻柴胡鈎藤二劑飲食漸進諸症漸愈又用補中益氣而安萬密齋治一小兒痰壅發搐氣促而喘用礞石滚痰丸桑白皮煎湯碾碎調服之喘定痰下搐亦止矣一小兒七月發搐無時昏睡不醒不哭不乳搯之劄之不痛嗅之鼻不嚏灌藥不入曰此真搐也不可治矣密齋父治一兒滿月後發搐以至聖保命丹治之而安小兒慢脾風喻嘉言治門人王生表兄沙無翼之子縱啖生硬冷物一夕吐食暴僵不省人事醫以驚風藥治之渾身壯熱面若裝硃眼弔唇掀下利沾汚診畢謂曰此慢脾風候也脾氣素傷更以金石藥重傷今已將絶故顯若干危症須用起死回生之法解盡前藥復用補劑庶可挽回但非一朝夕之功須七日方醒恐信不篤而更醫無識反得諉罪生謗王生堅請監督其家且以代勞且以壯膽於是用烏蠍四君子湯每日灌一大劑每劑用人參一錢渠家雖暗慌然見面赤退而色轉明潤便瀉止而動移輕活似有欲言不言之意亦自隱忍至第六晚忽覺手足不寧揭去衣被始極詆人參之害王生先自張皇任其轉請他醫才用牛黃少許從前危症復出面上一團死氣但大便不瀉耳重服理脾藥又五日方蘇楊乘六治孫氏子慢脾症痰涎涌盛咳嗽身熱抽搐自汗嗜卧露睛撮空手振屢進補脾逐風消痰之劑不應楊曰此症風自內出本無可逐痰因虛動亦不必消只補脾土諸症自退今面白睛散舌滑白天柱已倒虛上加寒非炮薑桂附何以追已去之陽而蘇垂絶之氣哉乃寫參附養榮方與之且囑之曰如以稚幼純陽無補陽之法無挽回矣一劑症減三劑全除次用五味異功散加煨薑白芍而痊薛立齋云一小兒常患停滯數服剋伐消導之劑以致脾胃虛甚患吐瀉慢脾風而卒萬密齋治一兒脾胃素弱病瀉以理中丸服之瀉未止口內生瘡或謂前藥性熱助火復以冷藥投之身微熱睡則揚睛曰此慢脾風矣脾胃本虛瀉則益虛口中生瘡者脾虛熱也誤服冷藥則中氣益損昏睡不乳虛損之極也當急作調元湯倍加人參服之調理半月而愈馬銘鞠治華叔蟾乃郎慢脾風五六日愈愈甫三四日即過乳食不進角弓反張二便交祕有欲進以牛黃丸者曰下咽死矣此病後虛症也然參且勿用用麥冬三錢枇杷葉三片貝母二錢半桑皮錢半杏仁一錢藿香一錢鮮糖球一枚蒼术人乳炒八分橘紅一錢二分加燈心煎入薑汁服逾時小便隨利即腹寬諸症悉退盡劑竟愈廣筆記小兒風前萬密齋治汪前川子年四嵗七月病驚搐醫以拿法搯止之八月連發二次仍用搯法九月又發萬曰痰聚成驚驚久成癇幼科拿法即古之按摩法也病在營衛者可用之使營衛之氣行亦發散之意病在臟腑則不能去矣久則痰塞心竅不亟治必成痼疾古所謂五癎者自此得之因立方以黃連瀉心中之邪熱為君枳實半夏去胸中之積痰為臣硃砂寒水石之墜以安其神為佐甘遂逐上焦之痰飲麝香以利竅為使神麴作糊丸如龍眼大每服一丸用獖豬心銅刀批開納丸其中縛煮待心熟取丸和心服之并飲其湯名曰斷癇丸服豬心五個乃愈陳氏子二嵗病驚風失治成癇少月一發來求藥萬用六一散末分三色巧於點染一色青黛相和名安魂散青入肝肝藏魂寅卯時屬木竹葉煎湯下一色硃砂相和名寧神散赤入心心藏神巳午時屬火燈心煎湯下一色入輕粉少許名定魄散白入肺肺藏魄申酉時屬金薄荷煎湯下調理半年而安大凡癇病初得之者十療八九如過二三年後者不可治矣時醫有用吐法者有用滚痰丸下之者徒損胃氣百無一效有以夀星丸治者一杯之水豈能滅車薪之火哉萬壻李中菴九嵗時得癇病常昏仆口眼俱合手足不動喉無痰聲但僵卧如醉人知其為心病也乃用東垣安神丸去地黃加茯神逺志石菖蒲以通其心竅南星珍珠末鐵華粉以墜其痰湯浸蒸餅丸如黍米大凡用鎮墜藥及治上焦病者丸皆宜細燈心湯下調治一年而愈萬之季男七八嵗時得癇病發則面先青慘目定口中有痰如嚼物狀昏仆一食頃乃蘇因教其母但見面青目定時即以鵝翎探吐其痰亦是一法如法而行前後吐痰二升許癇竟不發如此調理三年而安大抵癇病皆痰也雖有五獸之名豬羊雞犬牛是也巢氏之説後人多非之各隨其臟詳見錢氏方中凡氣實者控涎丹氣虛者斷癇丸愈後以琥珀抱龍丹調之未有不安者但年深者不可治也薛立齋治一小兒患驚癇吐痰困倦半餉而蘇諸藥不效年至十三而頻發用肥厚紫河車生研爛入人參當歸末搗丸桐子大每服三十五丸日進三五服乳化下一月漸愈又佐以八珍湯全愈一兒七嵗發驚癇令其恣食人乳後發漸疏而輕至十四復發用乳不效亦用河車丸數具而愈常用加減八味丸而安後至二十三嵗復發而手足厥冷仍用前法佐以八味丸十全大補湯而痊又治數小兒皆以補中益氣湯六君子湯六味八味等丸相間用之皆得全愈馮楚瞻治汪氏兒九嵗因驚癇屢發抽掣語言不清勢甚危篤脈之堅強久按無力詢其由痘後跣足行走忽腳面浮腫疑為草露之毒服清涼解毒數劑漸腫至腿又服五子五皮飲數劑忽一日僵仆卒倒乃成驚癇之疾曰此痘後氣血大虛所以腳腫誤服清涼乃腫至腿復加滲利削伐致虛火上乘無故卒倒猶大人中風症也惟宜峻補氣血佐以舒筋活絡之藥乃用當歸白术白芍煨天麻熟地茯苓牛膝銀花秦芁熟附子之類三四劑後其勢稍緩以前方沖人參湯調理一月而安萬密齋治一兒四嵗病驚已絶針其涌泉穴而醒自後不發謂曰未服豁痰之藥恐發癇也不信未半年似痰迷飲食便溺皆不知時復昏倒果成癇矣問其發時能自知乎曰欲昏則發乃與錢氏安神丸加膽草服之教其父曰病將發時急搯兩手合谷如此調理一月而安一小兒十嵗餘得癇疾診之兩目渾白無有睛光語言蹇澀舉動癡迷辭不可治另延醫治之竟無成功黃州守萬魯庵子病癇見其容貌俊偉性格聰明謂曰可治乃與琥珀抱龍丸方使自製服之續名醫類案卷四十四
