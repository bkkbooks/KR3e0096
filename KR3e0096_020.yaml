body:
  text: 續名醫類案卷二十錢塘魏之琇撰咳嗽徽宗寵妃苦痰嗽終夕不寐面浮如盤詔內醫李防禦用藥令供伏三日不效當誅李憂撓技窮與妻對泣忽聞外間叫云咳嗽藥一文一帖喫了今夜得睡李使人市藥十帖其色淺碧用淡虀水滴麻油數㸃調服李疑草藥性獷或使臟腑成滑泄併三為一自試之既而無他於是取三帖合為一携入禁庭授妃請分兩服以餌是夕嗽止比曉面腫亦消上喜賜金帛直萬緡李念病即安倘索方無以為對令僕俟前賣藥人過邀飲以百金賂其方乃蚌粉一物新瓦炒令通紅拌青黛少許耳叩其從來曰壯而從軍老而停汰頃見主帥有此故剽得之以其易辦姑藉以度餘生無他長也李給之終身槎菴小乘潘塤曰豫夏秋之交火嗽月餘晝夜不輟聲不能伏枕幾殆羣醫皆主故常曰西方金司令肺氣盛耳當㵼或曰久嗽肺虛當補或曰斂之愈豫曰金初司令稚金也火尚未伏壯火也壯火能爍稚金㵼肺金愈弱火愈熾此嗽所以不能止也經曰無違時無伐化又曰無伐生生之氣今氣初生而㵼之伐化也殆于不可况五火相煽肺失清化之令補之恐反助火斂之恐不能散火請更思之醫不聽各主所見饋藥不敢嘗日飲解毒凉膈散去硝黃加白术以助胃氣晨服童便不時服梨汁瓜漿各十數杯醫乃暗投人參五味煎以飲豫而豫不知也飲之則愈嗽加喘乃專主已見飲前藥數日火退嗽止而病瘳矣楮記室漢陽庫兵王六病痰嗽并喘百藥不效于嶽陽遇一道人教用五味子白礬等分為未每服三錢以生猪肺炙熟蘸末細嚼白湯下兩服病遂不發本草綱目久病乃可服此張子和治東門髙三郎病嗽一年半耳鳴三月矣嗽膿血面多黑㸃身表俱熱喉中不能發聲曰嗽之源心火之盛也秋傷于濕冬生咳嗽冬水既旺水濕相接隔絶于心火火不下降反而炎上肺金被爍發而為嗽金煅既久聲反不發醫補肺腎皆非也令先備西瓜氷雪等物其次用涌泄之法又服去濕之藥病日已矣劉氏一男子年二十餘病勞嗽咯血吐唾粘臭不可聞秋冬少緩春夏則甚寒熱往來日晡發作狀如㾬瘧寢汗如水纍服麻黃根敗蒲扇止汗汗自若也又服寧神散寧肺散止嗽嗽自若也張先以獨聖散吐其痰狀如雞黃汗隨涌出昏憒三日不省時時飲以凉水精神稍開飲食加進又與人參半夏丸桂苓甘露散服之不數日乃愈趙君玉妻病嗽時已十月矣張處方用陳皮歸身甘草白术枳殼桔梗趙以其不類嗽藥張笑曰君怪無烏梅瞿粟囊乎夫冬嗽乃秋之濕也濕上逆而為嗽此方皆散氣除濕解結和經三服而愈竇材治一人病咳嗽盜汗發熱困倦减食四肢逆冷六脈弦急乃腎氣虛也先灸關元五百壯保命延夀丹二十丸鐘乳粉二錢間日服金丹百丸一月全安一人病咳嗽脈症與上條同但病人怕灸止服延夀丹五十粒金液丹百粒鐘乳粉二兩五日减可十日脈沈緩乃真氣復也仍服前藥一月全安蓋此病早不灸亦可遲必加灸否則難治凌漢章治里人病嗽絶食五日衆投以補劑益盛凌曰此寒濕積也穴在頂針之必暈絶逾時始蘇命四人分牽其髮使勿傾側乃針果暈絶家人皆哭凌言笑自如頃之氣漸蘇復加補始出針嘔積痰斗許病即除明史一中年婦人乾咳寸脈滑動似豆狀餘皆散大不浮左大于右每五更心躁熱有汗但怒氣則甚與桔梗不開諸藥不效遂以石膏香附為君芩連青黛門冬瓜蔞仁陳皮炒柏歸梗為臣五味砂仁川芎紫菀為佐凡二十餘帖而安醫學網目崔某療久嗽熏法每旦取欵冬花如雞子大少許蜜拌花使潤納一升鐵器鐺中又用一瓦碗鑽一孔內安小竹筒或筆管亦得其筒少長置碗鐺相合及插筒處皆麵糊塗之勿令泄氣鐺下著炭火少時欵冬烟自竹管出以口含筒吸取咽之如胸中稍悶須舉頭即將指頭捻竹筒頭勿令漏烟出氣及烟盡止凡如是五日一為之至六日則飽食羊肉餛飩一頓永瘥一法不用鐺碗用有嘴瓦瓶燒藥蓋住瓶口却以口于瓶嘴吸烟咽之尤捷侍御談希曽咳嗽吐痰手足時冷以為脾肺虛寒用補中益氣加炮薑而愈竇材以肢冷為腎氣虛一婦人患咳嗽脅痛發熱日晡益甚用加味逍遙散熟地治之而愈年餘因怒氣勞役前症仍作又太陽痛或寒熱往來或咳嗽遺尿此肺氣虛肝火盛而尿脬失制也用前散及地黃丸月餘而瘥表弟婦咳嗽發熱嘔吐痰涎日夜約五六碗喘咳不寧胸痞燥渴飲食不進崩血如涌此命門火衰脾土虛寒用八味丸及附子理中湯加减治之而愈一婦人久咳嗽面色痿黃或時㿠白肢體倦怠飲食少思稍多則㵼此脾土虛而不能生肺金朝用補中益氣湯夕用六君子湯為主間佐以八珍湯三月餘漸愈後感寒邪喘嗽胸腹作脹飲食不入四肢逆冷此中氣尚虛不能充皮毛腠理司開闔之所致也遂用六君加生薑及桔梗而愈一婦人患勞嗽晡熱內熱寒熱往來作渴盜汗小便頻數其經兩三月一行此肝脾氣血虛損用八珍湯六味丸六十餘劑諸症漸愈其經兩月一行仍用前二藥間以加味逍遙散各三十餘劑後恚怒適經行去血過多諸症悉至飲食少思腹脹氣促用十全大補湯數劑漸愈仍用前藥調補復因喪子胸腹不利食少內熱盜汗便血無寐用加味歸脾湯仍兼前藥而愈錦衣李大用素不慎起居吐痰自汗咳嗽發熱服二陳芩連枳殼山梔之類前症不减飲食少思用四物二陳芩連元參知柏之類前症愈甚更加胸腹不利飲食亦少內熱晡熱加桑皮紫蘇杏仁紫菀桔梗之類胸膈膨脹小便短少用猪苓澤㵼白术茯苓枳殼青皮半夏黃連蘇子胸膈痞滿脅肋膨脹小便不通加茵陳葶藶喘促不卧飲食不進診之六脈洪數肺腎二部尤甚曰脾土既不能生肺金而心火又乘之此肺癰之作也當滋化源緩則不救不信後唾膿痰復求治胸膈痞滿脾土敗也喘促不卧肺金敗也小便不通腎水敗也脅肋膨脹肝木敗也飲食不化心火敗也此化源既絶五臟已敗藥豈能生已而果然絲客姚荃者素鬱怒年近六十脾胃不健服香燥行氣飲食少思兩脅脹悶服行氣破血飲食不入右脅脹痛喜用手按彼疑為膈氣痰飲內傷曰肝木尅脾土而脾土不能生肺金也若內有瘀血雖單衣亦不敢著肉用滋化源之藥四劑諸症頓退彼以為愈曰火令在邇當補脾土以保肺金彼不信後復作另用痰火之劑益甚求治左關右寸滑數此肺內潰矣仍不信服前藥果吐穢膿而殁嘉興周上舍每至夏患咳嗽服降火化痰之劑咳嗽益甚脾肺腎脈皆浮而洪按之微細此脾土虛不能生肺金肺金不能生腎水而虛火上炎也朝用補中益氣湯夕用六味地黃丸而痊後至夏遂不再發一婦人不得于姑患咳嗽胸膈不利飲食無味此脾肺俱傷痰鬱于中先用歸脾湯加山梔川芎貝母桔梗諸症漸愈後以六君加川芎桔梗間服全愈一婦人咳嗽脅痛或用清氣化痰降火等劑久不愈更加內熱晡熱若兩脅或小腹內熱其嗽益甚小便自遺此屬肝經血虛火動用六味丸加五味子滋腎水以生肝血用補中益氣生脾土以滋肺金而尋愈上舍陳道復長子虧損腎經久患咳嗽午後益甚薛曰當補脾土滋化源使金水自能相生時孟春不信乃服黃柏知母之類至夏吐痰引飲小便頻數面目如緋薛以白术當歸茯苓陳皮麥冬五味丹皮澤㵼四劑乃以參芪熟地山茱為丸俾服之諸症頓退復請視以為信遂用前藥如常與之仍泥不服卒致不起陸養愚治吳氏妾寡居夜熱以煩勞感冒乾咳無疾醫與踈風藥反增嘔惡更以二陳症不减而夜不能寐若失神志煩亂不安脈之沈弦而數曰乾咳乃火鬱之甚最為難治况寡居多年其鬱可知雖有風寒但于調理養血開鬱清熱微加踈散若竟發其表升動隂火則病反甚重以二陳之燥宜其煩亂不寐神志若失也用清養榮湯加黃芩前胡薄荷杏仁蘇葉二劑咳嗽煩悶俱减第睡未安脈微浮而數去蘇葉前胡杏仁加貝母知母山梔棗仁竹茹大棗二劑諸症俱愈但四肢懈怠氣乏不足以息脈浮數而弱此虛火已平真氣衰乏之候仍用前湯加貝母棗仁更入人參一錢五分數劑而愈陳曙倉室咳嗽或時純血或時純痰或時痰血相半夜熱頭眩胸膈不舒腳膝無力服滋隂降火藥已半年矣飲食漸少精神漸羸脈之兩寸關沈數無力兩尺澀弱微浮此上盛下虛之症也上盛者心肺間有留飲瘀血下虛者肝腎之氣不足用人參固本丸令空腹服之日中用貝母蘇子山查丹皮桃仁紅花小薊以茅根煎汁入藥同煎十劑痰清血止後以清氣養榮湯與固本丸間服三日後病痊而孕陸肖愚治吳遜齊患咳嗽身熱脅痛日輕夜重寢食俱廢咸以年髙病重為慮脈之左手浮弦右手弦滑曰此病極輕何必憂疑特內有食積痰飲外感風邪所致也少為消導踈散即愈矣用蘇葉柴胡以解其表青皮白芥以治其脅桑皮前胡杏仁以治其肺嗽陳皮半夏以清其痰山查枳實以消其食二劑而减四劑脫然陸祖愚治費表母生平酒飲多而穀食少釀成痰火每至五更則疾作喘嗽頻併氣逆息粗不能伏枕由來久矣年近七旬其疾大作日夜昏暈數次四肢厥冷自汗如洗形容瘦削六脈如絲或與清火清痰毫不應乃用附子理中料千杵蜜丸淡鹽湯服以助下元另以知母貝母桑皮輩煎湯徐徐含咽清其上膈數劑嗽稀喘止肢溫汗斂再用十全大補湯料丸服數十年痼疾從此遂瘳陳三農之室遇夜嗽甚多痰作隂虛火動以四物換生地加知母貝母蔞仁杏仁麥冬五味二劑而愈孫文垣姪婦喉中掀癢咳嗽紅痰兩寸關洪大內熱生瘡山梔小薊生地丹皮滑石青皮麥冬甘草黃連蔞仁水煎服血止嗽除後遇勞心即咳嗽喉中血腥總由上焦熱甚而然以枇杷葉山梔生地白芍甘草丹皮地動蜂天花粉滑紫菀常服三五劑兩月而安溫天衢冬月病目醫與發太過至春間吐血碗餘及夏下午潮熱咳嗽胸膈脹疼早晨冷汗淋漓大便溏一日兩行飲食少肌肉消十之七脈數孫曰據症脈法在不治衆懇不能辭乃用㵼白散加五味白芍貝母馬兜鈴服下其夜帖然而卧不嗽唯大便溏前藥加扁豆山藥茯苓汗亦漸止復與㵼白散加石斛馬兜鈴貝母陳皮苡仁白芍山藥五味桔梗調理三月而痊琇按此與孫治吳肖峰內人注夏誤服參蘇飲成咳嗽同為發散所傷世俗謂傷風不醒變成勞者是也不知此等皆為市醫不知虛實恣用踈散輕病變重而病者至死猶曰傷風不醒哀哉吳案見痿門李士材治一人咳而上氣凡清火潤肺化痰理氣之劑幾無遺用而病不少衰診其腎脈大而軟此氣虛火不歸元用人參三錢煎湯送八味丸五錢一服而减後用補中益氣湯加桂一錢附子八分凡五十劑及八味丸二斤而痊一人經年咳嗽更醫數十人藥不絶口而病反增劇自謂必成虛勞李曰不然脈不數不虛惟右寸浮大而滑必多服酸收故久而彌甚用麻黃杏仁半夏前胡桔梗甘草橘紅蘇子五劑止十劑已馮楚瞻治李孝廉患咳嗽甚頻視其身長肥白頰色常紅知為表有餘而裏不足上假熱而下真寒病必當劇勸以重服藥餌時有通譜新貴甚精醫藥乃託其治所用乃山梔黃芩花粉橘紅貝母蘇子杏仁之類止之勿聽數劑後嗽轉甚煩躁喜冷倍常益信寒凉為對症倍用之轉劇再進煩躁更甚粒不下咽飲水無度更以為實熱以三黃丸下之利行不多漸喘促再劑夜半喘大作有出無入遍身麻木潰汗如雨神昏目直口禁不言委頓極矣亟邀馮診兩寸左關僅存時當六月欲與四逆理中主人畏懼改以人參一兩麥冬二錢五味六分肉桂錢許始允急煎服之喘减片刻奈病大藥小頃復大作乃不咎寒凉之誤反以參桂為罪矣因思盡吾之力方可以活若徇彼之見必死而已乃堅定一方勒令服之用炒白术三兩人參二兩炮薑三錢五味子一錢五分製附子三錢煎濃汁灌之下咽後病人張口大聲云心中如火烙欲死此不與冷服故旁觀疑怨交起不為動頃之又大聲曰臍間更疼更熱欲死矣乃竊喜其陽能下達未之絶也果少焉喘定汗收手足溫而神思清語言反甚無力此方术多參少者因中宫久困寒冷不先為理中則陽氣難下達也呂東莊治徐鸞和內病咳嗽醫以傷風治之益甚邀診則中虛脈也曰鼻塞垂涕痰急皆傷風實症何得云虛曰此虛實真假所辨在脈庸醫昧此誤人多矣彼不知脈請即以症辨之其人必晡時潮熱至夜半漸清至晨稍安然乎曰然然則中虛何疑乎所可喜者正此鼻塞垂涕耳乃投以人參白术當歸黃芪白芍各三錢軟柴胡升麻各一錢陳皮甘草五味各六分三劑而咳嗽立止再診謂之曰上症已去唯帶下殊甚近崩中耳驚應曰然即前方重用人參加補骨脂阿膠各二錢數劑兼服六味丸而愈柴嶼青治陳氏甥女咳嗽吐痰夜間發熱衆醫以為必成勞症診其脈雖稍洪尚有根柢並非細數何至不治純用滋隂之藥調養半年而愈同學蔡為章患痰嗽夜難就寢身不勝衣卧牀不能轉側診其六脈微弱氣血兩虧擬用參芪補劑蔡以痰嗽不宜用補為疑乃力任之先用六君子湯加炮薑桂附數帖而嗽减繼用養榮湯十數劑始能下牀行動調理月餘而康張惕中咳嗽吐痰醫誤認風寒服藥十數劑病增劇身熱喘嗽夜不能卧胸膈痞塞困于牀第小便短縮診得人迎脈緩絶非外感氣口空大左寸弱甚兩尺沈微此心腎不足的係內傷之症其小便不利者三焦之氣化不能運于州都也從東垣治內傷條師其意而變通之旬日而痊左中丞夫人年六十餘形體瘦弱痰喘息粗夜不能寐醫頻與消痰理肺愈委頓診其脈甚微細此氣虛也仲景云氣虛有痰腎氣丸補而逐之遂用六味湯加麥冬五味治之而愈惟夜間尚未熟睡再用養榮湯加茯神棗仁十數劑即加餐安睡漸得復元丙寅新正同鄉諱伊喇齊長郎賀節至寓云咳嗽求方診其兩脈細數右寸鬱結斷其難以收功勉用麻黃湯伊斷斷不可曰我患隂虧他醫熟地人參服過數兩柴曰隂虧誠然但風邪閉塞肺氣補劑又從而壅遏之非此不能去邪力爭不信早决其不起果然琇按凡損症脈見右寸厥厥然如豆按之梗指其病原屬不起以肺金敗也今以右寸鬱結斷為風邪閉塞然必見鼻塞聲重或頭痛痰濃或咳嗽連續方是其候王肯堂治一婦人咳嗽不已服諸藥不效漸成勞瘵診之六脈濡弱此血弱又因憂戚太過而成斯疾合用當歸等藥治之必愈遂先古今録驗橘皮湯空心服蘇子降氣湯徐用金叉煎熟地黃丸當歸丸調理而安未入選張路玉治吳江郭邑侯喘嗽逆氣診之兩尺左關弦數兩寸右關澀數弦者腎之虛澀者肺之燥夏暑內伏肺絡遇秋燥收之令發為咳嗽也自言每嵗交秋連發四載屢咳痰不得出則喘至夜不能卧咳劇則大便枯燥有血曽服越脾湯嗽即稍可張曰公腎氣數强因水虧火旺隂火上爍肺金肺燥不能生水咳甚則便燥有血者肺移熱于大腸也賴有此耳合用千金麥門冬方除去半夏生薑之辛燥易以葳㽔白蜜之甘潤藉麻黃以鼓舞麥冬生地之力與越脾湯中麻黃石膏分解互結之燥熱同一義也郭曰諸醫咸詆麻黃為發汗重劑不可輕試僅用杏仁蘇子甘梗前等藥服之其咳轉甚何也曰麻黃雖云主表今在麥門冬湯中不過借以開發肺氣原非發汗之謂麻黃在大青龍湯麻黃湯麻杏甘石湯方其力便峻以其中皆有杏仁也杏仁雖舉世視為治嗽通藥虛實混然辛溫走肺最不純良耗氣動血莫此為甚熬黑入大陷胸丸佐甘遂等搜逐結垢性味可知遂用前方連進二劑是夜便得安睡脈弦雖未退按之稍耎氣口則虛濡乏力與六味生脈加葳㽔白蜜作湯四服嗽頓减即以此方製丸恆服至秋無復嗽之虞何督學媳素常咳嗽不已痰中間有血㸃恆服童真丸不徹以父歿哀痛迫切咳逆倍常痰中雜見鮮血因與瑞金丹四服仍以童真丸烏骨雞丸調補而安勞太夫人年五十餘素禀氣虛多痰數日來患風熱咳逆咳甚則厄厄欲吐且宿有崩淋近幸向安法當治其咳以桔梗湯加葳㽔白微丹皮橘紅蜜煎生薑四劑撤其標症次與六君子加葳蕤以安胃氣繼進烏骨雞丸方療其固疾以久不茹葷不忍傷殘物命改用大溫經湯加鹿茸角腮乍丸藥雖異而功則一也陳三農治一婦咳嗽痰喘飽脹水火不通眠食俱廢以人參白芍為君蘇子炒研細為佐枇杷葉三大片白茯苓佐之二服得眠大小便通東坡蓋公堂記云始吾居鄉有病寒而咳者問諸醫醫以為蠱不治且殺人取其百金而治之飲以蠱藥攻伐其腎腸燒灼其體膚禁切其飲食之美者期月而百病作內熱惡寒而咳不已纍然真蠱者也又求于醫醫以為熱授之以寒藥旦夕吐之暮夜下之于是始不能食懼而反之則鍾乳烏喙雜然並進而漂疽癰疥眩瞀之狀無所不至三易醫而病愈甚里老父教之曰是醫之罪藥之過也子何疾之有人之生也以氣為主食為輔今子終日藥不釋口臭味亂于外而百毒戰于內勞其主隔其輔是以病也子退而休之謝醫却藥而進所嗜氣全而食美矣可以一飲而效從之期月而病良已容齊五筆後文節薛立齊治甥范允迪咳嗽痰盛胸腹不利飲食少思肢體倦怠脈浮大按之微弱服二陳枳殼等藥愈盛脾肺腎虛也用補中益氣湯六味丸而愈萬密齊治監生胡篤菴咳久不止汗之不可下之不可因表裏之邪俱甚也為製方用蘇葉薄荷葉桑白皮杏仁霜瓜蔞霜桔梗甘草等分為末虛者阿膠蜜丸白湯下或口中噙化五日而安後以治人多效立齊治一癧婦咳而無痰日晡發熱脈浮數先以甘桔湯少愈後以地骨皮散而熱退更以腎氣丸及八珍湯加柴胡地骨皮丹皮而愈丹溪云咳而無痰者此係火鬱之症及痰鬱火邪在中用苦梗開之下用補隂降火之劑不已則成勞嗽此症不得志者多有之又原病式曰人瘦者腠理疏通而多汗血液衰少而為燥故為勞嗽之疾也一男子咳嗽氣急胸膈脹滿睡卧不安以葶藶散二服少愈更以桔梗湯而瘥一男子咳嗽項强氣促脈浮而緊以參蘇飲二劑少愈更以桔梗湯四劑而痊馬元儀治楊咸時咳嗽多痰氣逆作喘自汗不食已兩月脈之虛微無神此勞惓致傷脾肺也經云勞則氣耗氣與隂火勢不兩立氣衰則火自勝土虛既不能生金隂火又從而尅之故喘嗽自汗作矣若行疏泄以定喘止嗽是重耗其氣也用人參二錢黃芪五錢炙草五分貝母一錢杏仁蘇子各二錢紫菀桔梗防風以佐之兼進七味丸以培土母歸脾大造膏以實脾肺而愈來天培治一婦年六旬餘季夏酷熱患咳嗽頭疼發熱胸膈不舒或以蘇杏前貝生地黃芩治之轉甚視其面色浮腫懶言氣怯咳嗽聲微胸膈脹滿飲食不下六脈微弱此風寒內伏裏虛致感也始宜以參蘇飲倍薑棗一二劑可已今增虛矣非薑附不能瘳也以補中益氣湯去升柴加川芎炮薑附子各一劑汗出遍身腫脹漸消再劑熱退改用八珍加桂附二劑而咳嗽除終以歸脾加熟地炮薑四劑聲髙食進矣彼云舊有風症兩手不能舉今服藥乃能舉于頭矣此治病必求其本之謂歟沈明生治金斐文夏患咳嗽清痰續續不絶時風熱嗽甚多金謂所投之劑非踈風化痰即清金滌熱及診曰是非溫補不痊金駭愕問故曰君以外感盛行之際必無內因者耶初得之症必無屬虛者耶是則時有一定之方症有一定之藥人皆可以為醫矣夫嗽屬外因必肺氣脹滿咳喘相屬或兼頭疼鼻塞涕唾稠濃聲壯氣壅脈浮數有力或人迎脈大此為外因今脈不浮而沉非風也不數而緩非熱也按之不鼓非有餘也嗽雖頻而氣短不續痰雖多而清薄不濃若踈解則徒耗肺家之金清凉則轉瘠中州之土是欲去病而反重病也宜用補中益氣與六君子參合服方藉參苓术以補肺之母使痰無由生藉橘半升柴以升清降濁則嗽可不作一二劑嗽微减再服浹旬而愈吳橋治鄱陽王令領邑甫及期病咳嗽唾痰稠黏而臭且雜以血久之潮熱失聲食少肉消閉户踰月將乞骸骨歸幸橋至診之橋獨任其無害令為欣然且問橋橋曰此肝氣凌脾治者謬以為隂虛火動劑凉則脾益滯津液不通肝愈熾而無所制矣法當扶脾抑肝三劑如脫七劑而出視事太函集續名醫類案卷二十
