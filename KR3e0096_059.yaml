body:
  text: 續名醫類案卷五十九錢塘魏之琇撰跌撲一字散治一切打撲傷損筋骨折宗子趙叔恭名公寅以善鐵錘著名其父宰嵊縣日因與族人聚飲超化寺醉酒墜懸崖之下亟視之昏不醒人手臂已折舁得此二藥治之遂愈其後運錘如故叔恭嘗知大寧監云韓希道知府𫝊五靈脂沒藥别研川烏頭草烏頭俱去皮臍生用各四兩地龍乳香各半兩别研麝香半錢别研白膠香一兩後四味加減些不妨右為細末每服一字溫酒調下丸如梧桐子大加減自少至多服之亦可若腰已上損食後服腰已下損食前服覺麻為驗未麻加藥麻甚即減百一方福州長樂縣一盜囚被笞捶身無全膚以情告獄吏求買胡孫薑爛研取汁以酒煎或調服留滓以傅瘡不數日平復如故同上濠梁靈泉寺僧傳治打撲傷損用半兩古文錢不拘多少以鐡線貫之用鐵匣盛以炭火煆通紅碗盛好酒米醋各半升鐵鉗開匣取錢于酒醋中淬再煆再淬候蘇落盡如酒醋少再添候錢淬盡澄去酒醋以溫水淘洗如此三次淘洗數多尤妙火毒不盡令人患啞既净焙乾研極細入乳香沒藥水蛵等分同為細末每服半字或一字生薑自然汁先調藥次用溫酒浸平服若不傷折即時嘔出若損折則藥徑下纒繳如金絲如弓上之筋神驗初服忌酒三日劉諒縣尉傳王丞相在東府時施一接骨藥云用半兩錢極有效驗恐即是此方也同上治打撲損腫痛不止用生薑自然汁米醋牛皮膠同熬溶入馬屁勃末不拘多少攪勻如膏藥以紙花攤傅腫處痛即止以多傅為妙紹興倅㕔二人每用之得效同上南臺掾梁彥思使閩而足不能履醫以風論或以腳氣治經年不瘳項彥章診之六脉僅微數而他無所病即探患處乃骨出不入肯綮耳施以按摩即愈九靈山房集南臺治書某公因趨走足失履而傷腕骨掌反于後者六閲月矣衆醫不能治公知抱一翁精按摩曰幸豫治也翁令壯士更相摩從辰至申而筋肉盡腐遂引其掌以揉之覺喋喋然有聲藥以兩月其足如常時同上瘀血腹痛立齊曰豫于壬申年被重車碾傷悶瞀良久復蘇胸滿如築氣息不通隨飲熱童便一碗胸寬氣利惟小腹作痛吾鄉徐銀臺東濠先生與復元活血湯一劑便血數升許痛腫悉退更服養氣血藥而痊大凡損傷不問壯弱及有無瘀血停積俱宜服熱童便以酒佐之推陳致新其功甚大若脅脹或作痛或發熱煩躁口乾喜冷惟飲熱童便一甌勝服他藥不動臟腑不傷氣血萬無一失嘗詢諸營操軍常有墜馬傷者何以愈之俱曰惟服熱童便即愈此其屢試之驗亦明矣戊辰年公事居庸關見覆車被傷者七人仆地呻吟一人未蘇俱令以熱童便灌之皆得無事又凡腫或傷損者以葱搗爛熱罨之尤妙治一人仲秋夜歸墜馬腹內作痛飲酒數杯翌早大便自下瘀血即安此元氣充實挾酒勢而行散也一男子跌傷腹痛作渴食梨子二枚益甚大便不通血欲逆上用當歸承氣湯加桃仁瘀血下而瘥此因元氣不足瘀血得寒而凝聚也故産婦金瘡不宜食此一男子失足墜梯腹停瘀血用大黃等藥其血不下更加胸膈脹痛喘促短氣用肉桂木香末各二錢溫酒調服即下黑血及前所服之藥而蘇此因寒藥凝滯而不行故用辛溫之劑散之一老人墜馬腹作痛以復元通氣散用童便調進二服少愈更以四物湯加柴胡桃仁紅花四劑而安一男子墜馬腸作痛以桃仁承氣湯加蘇木紅花下之頓愈更以四物湯加花粉柴胡二劑而愈脾傷腹痛陳侍御墜馬腿痛作嘔服下藥一劑胸腹脹痛按之即止惟倦怠少氣診其脉細而澀曰非瘀血也乃痛傷氣血復因藥損脾氣而然耳投養脾胃生氣血之藥而愈血虛脅脹李進士季夏傷手出血不止發熱作渴兩脅作脹按之即止此血虛也用八珍加軟柴胡花粉治之而愈更用養氣血之藥調理而痊血瘀脅脹孫文恆治桂亭兄壯年原有濕熱痰積年逾艾偶墜轎跌傷背脅外敷內攻而愈越十五年左脅痛手不可近左脉弦數堅徑搏指小腹赤痛知為舊瘀及痰積作祟以青皮赤芍黃連當歸尾各一錢桃仁錢半大黃二錢滑石三錢臨服調元明粉一錢服下吐痰碗餘大便僅行一次左胯及腿膝皆痛卧不安小腹痛甚此瘀血欲行而未能也再與前方加減便三次皆沉香色稠黏瘀物腹痛除胯痛仍在再與加減便行四次所下紫黑如筋膜者甚夥諸症悉減因食雞湯牛肉腹痛後重此餘積未盡欲再下之恐年髙不任曰藥力已到積已動行而後補庶無反顧之憂仍以前藥去大黃調元明粉下二次瘀物如前之半諸痛俱平用人參白芍甘草陳皮山查桂心當歸半夏調理半月而愈一男子跌仆皮膚不破兩脅作脹發熱口乾自汗類風症令先飲童便一甌煩渴頓止隨進復元活血湯倍用柴胡青皮一劑脹痛悉愈再劑而安發明經云凡從髙墜下惡血流于內不分十二經絡聖人俱作風中肝經留于脅下以中風療之血者皆肝之所主惡血必歸于肝不問何經之傷必留于脅下蓋肝主血故也痛甚則必有自汗但人汗出皆為風症諸痛皆屬于肝木况敗血凝滯從其所屬入于肝也從髙墜下逆其所行之血氣非肝而何以破血行經藥治之一男子墜馬兩脅作痛以復元活血湯二劑頓止更以小柴胡加當歸桃仁二劑而安血虛煩躁吳給事墜馬傷首出血過多發熱煩躁肉瞤筋惕或欲投破傷風藥曰此血虛火動所致當峻補其血為善遂用聖愈湯二劑即安又養氣血而瘥一男子損臂出血過多又下之致煩熱不止瘀肉不腐以聖愈湯四劑少安以八珍湯加五味麥冬而安更以六君子湯加芎歸黃茋數劑而潰又二十餘劑而斂大抵此症須分所患輕重有無瘀血及元氣虛實不可概下蓋恐有傷氣血難以潰斂常治先以童便和酒飲之或加紅花蘇木其功甚捷若概用攻利之劑鮮有不誤凡瘡愈之遲速在血氣之虛實故也亡血出汗張進士季秋墜馬亡血過多出汗煩躁翌日其汗自止熱躁益甚口噤手顫此隂血虛陽火乘之而汗出為寒氣收斂腠理故汗不得出火不得泄怫鬱內甚而益增他症也凡一切病火盛而汗出者若驟斂之反增他症及用四物加柴胡黃芩山梔四劑少止又用四物參茋軟柴胡五味麥冬治之而痊亡血昏憒一婦人孟冬傷足亡血頭汗內熱作渴短氣煩躁不時昏憒其脉洪大按之微弱此隂血虛于下孤陽炎于上故發厥而頭出汗也以四物合小柴胡湯一劑汗即止以四物去川芎加參蓍麥冬五味炙草少用肉桂四劑諸症悉去又三十餘劑血氣復而愈一男子孟夏折腿出血過多其初眩暈眼花後則昏憒此隂血傷損陽火熾甚制金不能平木木旺生風所致急灌童便更用人參當歸各五錢荆芥川芎柴胡白芍白术各二錢山梔黃芩桔梗各一錢甘草五分服之隨爽又用四物參蓍各三錢生地柴胡各一錢四劑煩躁悉去濕痰作痛大宗伯沈立齊孟冬閃腰作痛胸間痰氣不利以枳殼青皮柴胡升麻木香茴香當歸川芎赤芍神麯紅花四劑而瘥但飲食不甘微有潮熱以參蓍白术陳皮白芍各一錢歸身二錢川芎八錢軟柴胡地骨皮炙草各五分十餘劑而康劉尚寶體臂閃作痛服透骨丹反致肢節俱痛下體益甚以二陳南星羌活防風牛膝木瓜蒼术黃芩黃柏治之身痛遂安以前藥再加歸尾赤芍桔梗治之而痊鄭吏部素有濕痰孟冬墜馬服辛熱破血之藥遍身作痛發熱口乾脉大而滑此熱劑激動痰火為患耳治以清燥湯去人參當歸黃茋加黃芩山梔半夏黃柏熱痛頓去患處少愈更用二陳羌活桔梗蒼术黃柏薑製生地當歸遂痊肝火作痛楊司天骨已入絡患處仍痛服藥不應肝脉洪大而急此肝火盛而作痛也用小柴胡湯加山梔黃連二劑痛止用四物山梔知柏調理而康血虛作痛一婦人磕臂出血骨痛熱渴煩悶頭暈日晡益甚此隂虛內熱之症用八珍加丹皮麥冬五味骨碎補肉桂及地黃丸治之瘡愈却去桂加牛膝續斷二十餘劑而悉愈骨傷作痛一小兒足傷作痛肉色不變傷在骨也頻用炒葱尉之五更用和血定痛丸日間用健脾胃生氣血之劑數日後服地黃丸三月餘而瘥一小兒臂骨出絡接入腫痛發熱服流氣等藥益甚飲食少思以葱尉之其痛即止以六君黃茋柴胡桔梗續斷骨碎補治之飲食進而腫痛消又用補中益氣加麥冬五味治之氣血和而熱退愈矣氣虛血滯戴給事墜馬腿腫痛而色黯食少倦怠此元氣虛弱不能運散瘀血而然耳遂用補中益氣去升麻柴胡加木瓜茯苓白芍白术治之而痊氣虛不潰少宗伯劉五清臁傷一塊微痛少食用六君子湯倍加當歸黃蓍其痛漸止月餘瘀血內涸而不潰彼以為痊此陽氣虛極須用調補不從至來春頭暈痰涎壅塞服清氣化痰病勢愈盛脉洪大而微細此或輕取重取之分欲以參茋歸术附子之類補之不信至秋初旬因怒昏憒而厥氣虛壅腫一婦人腫臂腕腫大已三月手臂日細肌瘦惡寒食少短氣脉息微細此氣血兩虛也遂投補中益氣加肉桂引諸藥以行至臂再加貝母香附以解久病之鬱間服和血定痛丸以葱尉之腫消二三因怒患處仍脹胸膈兩脅微痛以前湯更加木香山梔半夏桔梗服之少可復因驚不寐少食盜汗以歸脾湯加五味麥冬二十餘劑而安腫消三四手臂漸肥但經水過期而少此心脾之血未充足而然也乃用八珍加五味麥冬丹皮逺志香附貝母桔梗四十餘劑諸症悉愈後因怒發熱譫語經水如涌此怒動肝火以小柴胡湯加生地二錢一劑遂止以四物加柴胡調理而康州守陳克明子閃右臂腕腫痛肉色不變久服流氣等藥加寒熱少食舌乾作渴曰傷損等症腫不消色不變此由氣虛而不能運當助脾胃壯氣血為主遂如法治之不二月形氣漸充腫熱漸消半載諸症悉退體臂如常一小兒閃腿腕壅腫形氣怯弱欲治以補氣血為主佐以行散之劑不信乃內服流氣飲外敷寒凉藥加寒熱體倦日夜發熱脉息洪大氣血虛極也治之無功後肉潰瀝盡氣血而亡瘀血腫痛一男子閃傷右腿壅腫作痛謂急砭去滯血以補元氣庶無後患不信乃外敷大黃等藥內服流氣飲後涌出穢膿碗許其膿不止乃復請治視其腿細而脉大作渴發熱辭不治後果歿窗友王汝道環跳穴處閃傷瘀血腫痛發熱作渴遂砭去瘀血知其下焦素有虛火用八珍加知柏牛膝骨碎補四劑頓止用十全大補少加黃柏麥冬五味三十餘劑而愈筋傷壅腫李考功子十四嵗腳腕閃傷腫而色夭日出清膿少許肝脉微澀此肝經受傷氣血虛而不能潰難消之症也急止剋伐之劑不信乃雜用流氣等藥後果出爛筋而死肺火衄血張地官墜馬傷腿服草烏等藥致衄血咳嗽臂痛目黃口渴齒痛小便短少此因燥劑傷肺與大腸而致用生地黃芩連知柏山梔山藥甘草以潤肺燥而生腎水小便頓長諸症並止以山藥五味麥冬參蓍芎歸知柏黃芩炙草以滋隂血養元氣而瘡斂肝火出血俞進士折腿骨已接三月尚發熱出汗不止諸般醫治不應左關脉洪數此肝火熾甚血得熱而妄行也遂投小柴胡湯加山梔白芍生地防風血止熱退又用八珍五味麥冬治之瘡口即愈田宗伯姪仲秋因怒跌仆遍身作痛發熱衄血肝脉弦洪曰久衄脉弦洪乃肝火盛而制金也至春則肝木茂盛而自焚或戕賊脾土非易治之症當滋腎水以生肝木益脾土以生肺金乃雜用瀉肝火等劑歿于仲春之月一婦人因怒仆地傷面出血痰盛昏憒牙關緊急曰此怒動肝火氣逆拂鬱神明昏冒而卒倒也兩手脉洪大而無倫次以小柴胡湯加黃連山梔芎歸橘紅茯苓薑汁而蘇胃火作嘔一膏粱之人跌腿青腫作痛服辛熱之藥反發熱作喘患處益痛口乾唇渴此膏粱之人內多積熱更服辛熱之劑益其胃火而使然也頻飲童便以清胃散加山梔黃芩甘草治之頓止患處以葱尉之腫即消散隂虛作喘舉人杜克宏墜馬服下血藥反作喘日晡益甚此血虛所致耳非瘀血為患遂以四物加參蓍五味麥冬治之其喘頓止又用補中益氣加五味麥冬而愈此症果係瘀血蒸熏于肺而喘宜活血行血亦不可下若面黑胸脹或膈痛作喘當用人參一兩蘇木二兩作一劑水煎急服緩則不治産婦多有此疾隂虛發熱楊進士傷手指焮痛發熱服寒凉之藥致飲食頓減患處不潰用托裏養血之藥食進而潰後因勞每日晡發熱此隂虛而內熱也以四物軟柴胡地骨皮乃退更用養血氣之藥而瘡斂氣血虛熱一男子墜馬腹有瘀血服藥下之致發熱盜汗自汗脉浮澀以為重劑過傷氣血所致投以十全大補湯益甚時或譫語此藥力未及而然也以前藥加炮附子五分服之即睡覺來頓安再劑而痊陽氣脫陷梁閣老姪跌傷腿外敷大黃等藥內服破血之劑遂致內潰為針出穢膿三碗許虛症悉具用大補之劑兩月餘稍能步履因勞心手撒眼閉汗出如水或欲用袪風之劑曰此氣血尚未充足而然也急以艾炒熱頻尉肚臍此本法羅謙父當用之并氣海穴處以人參四兩炮附子五錢煎灌良久臂少動又灌一劑眼開能言但氣不能接續乃以參蓍歸术四味共一斤附子五錢水煎徐徐服之元氣漸復飲食已進乃去附子服之而瘡愈膽經血少一女子年十七閃右臂微腫作痛寅申時發熱决其膽經血虛火盛經水果先期而至先以四物合小柴胡湯四劑熱退更以加味四物湯加香附地骨皮山梔各五分芩連炙草各二分二十餘劑其腫亦消乃去黃連山梔又五十餘劑經水調而元氣充矣腎經虛怯儒者王清之跌腰作痛用定痛等藥不愈氣血日衰面耳黧色曰腰為腎之府雖曰閃傷實腎經虛弱所致遂用杜仲補骨脂五味山茰蓯蓉山藥空心服又以六君當歸白术神麴各二錢食後服不月而瘥一三嵗兒閃腰作痛服流氣等藥半載不愈此禀腎氣不足不治之症也後果歿痛傷胃嘔一婦人傷指手背俱腫微嘔少食彼以為毒氣內攻診其脉沉細此痛傷胃氣所致也遂刺出膿碗許先以六君子藿香當歸而食進繼以八珍黃茋白芷桔梗月餘而愈氣遏肉死一男子修傷足指色黑不痛而欲脫此因陽氣虛不能運逹于患處也急去之速服補劑以壯元氣否則死肉延足必不救矣不信果黑爛上脛而死一女子數嵗嚴寒上京兩足受凍不仁用湯泡潰至春十指俱爛牽連未落先用托裏之劑助其陽氣自潰脫得保其生此因寒邪遏絶運氣不至又加熱湯泡潰故死而不痛也嘗見人嚴寒而出凍傷其耳不知痛癢若以手觸之其耳即落當以暖處良久或熱手慰之無恙若以火烘湯泡其耳即死至春必潰脫落矣北方寒氣損人若此可不察之凉藥遏經雲間曹子容為室人中風灌藥誤咬去指半節焮痛寒熱外敷大黃等藥內服清熱攻毒患處不痛不潰膿清寒熱愈甚此因凉藥遏絶隧道而然也遂敷玉龍膏以散寒氣更服六君子湯以壯脾胃數日後患處微痛腫處漸消此陽氣運逹患處也果出稠膿不數日半指潰脫更服托裏藥而斂上舍王天爵傷足焮腫內熱作渴外敷內服皆寒凉敗毒患處益腫而不潰且惡寒少食欲作嘔吐此氣血俱虛又因寒藥凝結墜道損傷胃氣以致前症耳遂用香砂六君子芎歸炮薑外症悉退惟體倦晡熱飲食不甘以補中益氣湯加地骨皮五味麥冬治之而愈州守王廷用傷指即用帛褁之瘀血內潰焮腫至手謂宜解患處以出瘀血更用推陳致新之劑不信乃敷凉藥痛雖少止次日復作又敷之數日後手心背俱潰出瘀穢膿水尚服敗毒之劑氣血益虛色黯膿清飲食少思仍請治投以壯脾胃氣血之劑由是膿水漸稠而愈錢國賔曰甲子春余舟泊清江浦時征遼官兵沙船兩岸打閘水急索斷頭目王元跌倒頭向地腳朝天正對石椿腦蓋骨圓圓如鍾大竟離頭墜地去人丈許衆兵圍看余見而呼曰某知接骨今病者破腦魂魄驚散怕人不敢歸竅汝等在此此人立死矣且暫散診其脉洪浮腦骨雖墜腦膜未破可救先安腦骨急取舟中接骨藥散于周圍內用四物湯加桃仁大黃各一錢紅花五分恐血攻心移病者于無風之室令倚勿睡睡則血上至半日始蘇醒次日飲食日日與接骨藥一服十日而痊接骨神方土鱉蟲四十九個酒炙黃暴死人骨一兩螃蟹煆黃五錢象虱十個半兩錢十個煆紅醋淬取末自然銅三錢煆紅醋淬乳香沒藥各三錢木香二錢麝香五分為末再服七分熱酒調下照量加酒以行藥力服後骨中自響輕者數服重者十餘服接骨如故續名醫類案卷五十九
