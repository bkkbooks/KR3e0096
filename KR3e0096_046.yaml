body:
  text: 續名醫類案卷四十六錢塘魏之琇撰小兒瘧疾萬密齊治一兒嵗半病瘧二日發久不愈黃瘦面浮腫腹脹用平瘧養脾丸治之愈人參白术茯苓甘草當歸川芎陳皮夏麴蒼米厚朴柴胡黃芩猪苓澤㵼草果常山青皮辣桂鱉甲各等分於五日或三元八節天月德要安普護福生除開破日修合酒煮麴糊丸麻子大陳米湯下一兒病瘧醫用截瘧藥內有砒丹三截之遂成疳瘧其父懊恨前藥之誤萬用平瘧養脾丸治瘧集聖丸治疳調理一月而愈一兒病瘧一日一發萬用家𫝊斬鬼丹截之止三日後一發再截之俱三四日又發其父怪而問之時六七月棗熟疑其必啖生棗故止而復發也問之果然乃禁之先用胃苓丸調理三日更以斬鬼截之遂愈五月五日午時用黃丹研獨頭大蒜研如泥同杵衆手為丸隨人大小發日五更取長流水面東下汪氏子七嵗病瘧三年諸醫不效萬視其外候面色黃白山根帶青腹大而堅此久瘧成癖癖為潮熱當與補脾消癖瘧熱自除恨無九肋鱉甲耳汪求得之因立一方用人參白术青皮陳皮三稜莪术木香砂仁當歸川芎黃連柴胡鱉為末神麴糊丸炒米煎水日三服調理五十餘日而安李氏女七嵗先患外感後變瘧因用截藥變作痢至冬痢雖止瘧益甚萬視其外候大骨髙起大肉陷下髮稀目陷面黃鼻燥不思飲食唯啖蓮肉乃內傷脾虛疳勞症也醫皆謂不可治萬云可治也至春必愈用集聖丸一料次年二月果安王氏子病瘧三日一發用胃苓丸合小柴胡湯方作丸服之初三日一發又間日一發後一日一發初發於午後漸移於辰刻問曰連日服藥瘧發轉頻何也曰此瘧將退之漸也蓋瘧三日一發者邪氣深難已一日一發者瘧氣淺易愈午後發者邪在陰分難巳午前發者邪在陽分易愈今自三日移至一日自陰分移至陽分故云將退之漸也時有丁醫聞其說笑曰那得許多議論吾有祕方治瘧如神遂求治之不知其所用何物自此仍三日一發發以酉時至次日已後始退萬仍為調理一月而愈孫文垣治丁氏子才二嵗患瘧母上壅咳嗽每午後發熱至子丑時乃退終日啼哭不止鵝口白屑神氣大弱又痘後遍身瘡疥未愈諸醫有灸之者有剚之者有以膏藥貼之者種種施之不應孫曰乳下嬰孩臟腑脆薄不可亂攻亂補參芪足以增其咳灸剚適以驚其神安能取效教以白术鱉甲各一錢五分青蒿麥芽陳皮各八分烏梅一個貝母知母各六分甘草三分八帖全愈水鑑仙人治百日兒瘧歌云瘧是邪風寒熱攻直須術治免成空常山刻作人形狀釘在孩兒生氣宫如金生人金生在巳即釘巳上木生人釘亥上火生人釘寅上水生人釘申上也常山乃截瘧之藥樵書初編萬密齊外孫未周嵗因傷食發間日瘧在子丑時發則搐咬牙呻喚大便黃緑努而出以口吮母口得乳即止瘧後汗出心下跳腹中鳴頂微熱未十日成疳矣面色㿠白𩕄陷髮疏見漸羸瘦此先受暑濕暑則為瘧濕則為痰又傷飲食脾土衰而肝木旺瘧曰食瘧疳曰食疳用加減當歸龍薈丸加味參苓白术散其母服四物湯加柴胡升麻麥冬木通酒芩桔梗各五分薄荷七分燈草水煎服而愈一兒病瘧醫以柴苓湯投之二三日不效乃用平瘧養脾丸而愈一女先驚後瘧瘧久成疳用集聖丸調理一月而安一兒先瘧後驚用調元湯琥珀抱龍而痊一兒久瘧成癖因癖生熱或三五日一發發則餘日不止常在申酉時但不寒顫又微惡寒即發熱熱亦不甚發過不渴不頭痛用消癖丸平瘧養脾丸間服半年而愈馬元儀治金氏子寒熱如瘧兩脉弦虛無力脉弦為風發脉虛為氣少正虛則外風得襲入乃為寒熱不當與氣實有餘者同治乃用補正散邪一法用人參桂枝乾薑肉桂半夏廣皮炙草等調理數日而安小兒痢萬密齊姪七嵗久痢不已為製丸劑治之丸者緩也以治久病也用錢氏異功散合香連丸為主加猪苓澤㵼車前子以利其小便神麴麥芽以消其積滯訶子肉豆䓻炒乾薑以止痢合之曰和中丸約二兩許服之未盡而痢止此為家祕治久痢不止方也汪某年六十生一子三嵗病痢醫下之太過脾胃受傷中氣下陷又一醫以豆䓻香連合粟殼等止之痢益甚後重而少物萬視之曰老年之子胎禀已弱下之太過而下陷法當舉之陳莖未盡劫澀之劑亦不可用也乃以錢氏異功散加香連歸芍山藥蓮肉神麴糊丸服之旬日痢止元氣未復也令前藥調之適有人曰吾有阿魏治痢甚效即以五分作丸五粒令兒服之此不可服也汪曰今早服一丸飯後服一丸服後熟睡未醒萬曰痢止矣何必服藥此藥太峻元氣被傷恐非正睡也試呼之應推之不知入視白眼張露氣已絶矣詳記之以為輕妄用藥之戒聶久吾兒周嵗餘因乳少粥飯成積又多麵食致積痢先水㵼後濃血時已斷乳飲食少進睡不閉目肛如竹筒指紋已過命關症極重乃用清熱消積等藥以茶匙緩緩灌灌覺精神極困時另以人參麥冬煎湯少少與之以保元氣如是數日痢漸止但其肉削加柴調養半年始復舊小兒痢疾萬密齊治孫撫軍女五月病痢至七月未愈萬至病亟矣用人參茯苓甘草當歸白芍黃苓車前陳皮各等分炒乾薑少許煎服略差五日大安孫問諸醫皆用木香黃連今乃不用所用皆非治痢之藥而效者何也曰此乃河間黃苓芍藥湯方也所謂調其氣則後重除養其血而痢止之法也祝道士子長七嵗病痢半年不愈萬與一方用人參白术茯苓甘草黃芪桔梗木香黃連訶子肉豆䓻車前炒乾薑澤㵼神麴當歸麥芽白芍為未水麵丸米飲下一月而安名和中丸一女十嵗患痢久不止脉洪數或曰下痢脉宜小今脉洪數恐難治萬曰無妨玉函經曰欲識童男并童女决在寸關并尺裡自然緊數甚分明都緣未喪精華氣此童女脉宜如是胃氣尚强不久自愈果數日痢漸止張縣尹女半嵗病赤白痢甚苦萬用黃連一錢木香五分石蓮肉五分陳皮七分炒乾薑二分為末神麴丸黍米大陳米湯下而安張景嶽治都閫錢旭陽長男年及兩周季夏間以生果傷脾先㵼後痢自善醫知其生冷所傷乃與參术薑桂溫脾等藥不效漸至唇生瘡乃謀之張曰此兒明為生冷所傷而不利溫藥奈何張曰此因㵼傷隂兼之辛辣遽入而虛火上炎耳非易以附子不能令火歸元也因用二劑而唇口瘡痛咽腫倍甚外見於頭面之間病更劇復詢曰用藥不投如此豈真因濕生熱耶張診之曰上之脉息下之所出皆非真熱本屬陰虛今熱之不效雖在可疑然究其所歸意者藥猶未及乎錢曰尚有一證大喜熱飲人所不能入口者彼安然吞之雖喉中腫痛若此弗顧也此逮真寒之驗乎張曰是矣是矣遂復增附子一錢五分及薑桂肉果人參熟地之屬其㵼漸止其喉口等症亦不日全收矣疑似之間難辨如此治者可不慎哉喻嘉言治葉氏幼男病痢噤口發熱嘔噦連聲診其關脉上涌而無根再診其足脉亦上涌而無根曰此非噤口痢症乃胃氣將絶之症也噤口痢者虛熱在胃壅遏不宣故不思食治宜補虛清熱兩法此因苦寒之藥所傷不能容食唯有溫補一法而已以理中湯連進二劑不一時下十餘行乃恐誤求更方曰吾意在先救胃氣之絶原不治痢即治痢人之大小腸盤叠腹中甚逺雖神丹不能遽變其糞今藉藥力催之速下正為美事為可疑之遂與前藥連服二日人事大轉思食不噦四日後只便糟粕以補中益氣調理旬日全安此可見小兒之痢縱啖傷胃者多內有積熱者少尤不宜用痢疾門中通套治法也陳慶長知縣名祖永云頃守官南康其子年十嵗患噤口痢水漿不入者數日惟能進藥同官家有方書載一治法試用之一服而痢稍疏三服遂索粥飲頓食半盞許自是痢止而安其法用乾山藥一半炒黃也一半生用研為細末米飲調下一人有小女患痢脫肛叔權傳得一方用草茶葉一握薑七片煎令服而愈然不知其方所自來也後閲蘇文始知生薑咬咀煎茶乃東坡治文潞公痢方也資生徑陳良甫云甲子夏秋間僕處一趙經略㕔有姪孫年九嵗病痢甚重召小方脉未至遂令僕診之六脉平細以證觀之是血痢其實非也只是血水而已僕云記得調中湯治狀云夏月初秋忽有暴寒折於盛熱結於四肢則壯熱頭痛寒傷於胃則下痢或血或水或赤壯熱冥悶脉數宜服此遂合之去大黃服之而愈良方姚公逺幼子病痢一醫誤下之遂下純血氣喘身熱不思食仲淳至亟以人參四五錢石蓮子白芍升麻橘紅草石蠶扁豆滑石炙草一劑喘平血止又數劑痢止臨别囑公逺曰兒百日內不出痘則生以下多元氣未復故也未幾即痘果殤家弟稚端幼病痢甚日夜數十次服數劑即愈人參三錢吳茱茰泡七次一錢川黃蓮薑汁炒一錢後二味飯上蒸水煎至八分溫服如不受以藥一匙間米湯一匙漸漸飲之胃氣漸復如頭痛發熱加石膏六錢乾薑一錢别調六益散四錢冷水服小兒瘧痢陸祖愚治張登之男年十四患瘧截早變成痢疾否滿晡熱眼胞紅腫而痛所下紅白相間日夜三四十次或與消積溫補斂澀俱不效而轉劇脉之左手弦數右關沈實右寸浮滑此瘧疾失表又內傷飲食風熱泊於腸胃而為病也先用山查枳實苓連木通澤㵼小柴胡甘草并下香連丸服丸藥兩許煎藥四劑遂積減胃開調理旬日但下淡白積一二次又數日大更實矣忽一日仍不思飲食日行二三次十餘粒米不進計大更數十行蓋連日粥食過多而復傷也今積滯已行腸中潤滑無所慮矣仍用小柴胡歸芍知苓查橘之類宿垢盡行胃氣仍復乃加減前方入參术調理而安萬密齊治李氏女初病瘧又病痢瘦發熱少食日啖蓮肉五六枚乃與集聖丸而愈小兒嗽張子和曰鹿子春一小兒八嵗夏月病嗽羸甚余欲涌之子春以為兒幼弱懼其不勝少難之一日因飲酒家人與之酒傷多大吐吐定而嗽止蓋酒味苦苦屬通劑乃大悟余之言也萬密齊治胡元溪子五嵗春病嗽醫用葶藶丸乍止乍作至夏轉作又一醫用五拗湯不效或以葶藶或以五拗發表攻裏其嗽蓋加至百十聲不止面青氣促口鼻出血勢急矣曰自春至秋病已半年治之不易乃用二冬二母巵苓甘桔蘇子茯苓陳皮去白連進三劑咳只二三十聲一醫以二陳加防風百部杏仁紫莞桑皮萬曰肝氣已逆吾方降之其咳稍罷防風百部升發之品似不可用彼云防風百部乃咳嗽聖藥也服之氣上逆而咳百十聲不止口鼻血復來再求治仍用前方取生茅根搗自然汁和藥與之五日而血止去茅根或加欵冬杏仁以止其咳或去黃苓梔子加人參白术以補其脾或加阿膠以補其肺調理二旬而安蓋方春時多上升之氣肺感風寒當與發散葶藶丸乃攻裡之劑肺金本虛而反㵼之此一逆也夏天火旺肺金受剋當用清金㵼火之劑五拗湯乃發散藥也用熱犯熱此二逆也一汗一下肺金大虛矣方秋時氣應降而不降反用生發之劑此三逆也今用收斂清降之藥以平其浮游之火火衰於戌時值九月故病易已許氏子病嗽痰中帶血或用茅根湯竟不效延萬治因問先生治胡元溪子用茅根此亦用茅根然不愈何也曰彼病於秋肺旺肝燥此病於冬血衰時也且彼乃口鼻出血屬陽明胃此是痰中有血屬太陰肺病既不同治亦有别乃用阿膠為君杏霜瓜蔞霜貝母為臣蘇葉桔梗甘草為佐煉密作丸薄荷煎湯化服而愈萬石泉女病久嗽不止胸髙氣急曰此龜胸病也胸者肺之腑也肺脹則胸骨髙起狀而如龜殼吾聞其病未曽治之故無方也或者不可治乎石泉曰氣脹者肺實也當服葶藶丸曰病有新久症有虛實知為虛何不投補再服葶藶㵼肺之劑恐有虛虛之禍不聽竟以是卒吳孚先治一小兒咳嗽動便作痰聲喉如曳鋸脉數洪滑紋如魚刺用加減二陳湯兼服神仙玉露散而痊萬密齊舉人蔡沙江子病咳久不止其咳連聲不絶咳時面青右手常自擺動曰不可治也問何故曰咳者肺病也肺屬金而青者肝之色也肝屬木手擺者肝風欲發之狀木來侮金寡乎畏也今十月金病木生之時四時之序將來者進成功者退木生而進金病而退必發搐甲乙日劇果甲乙日搐而死曽藝塘子九嵗病咳半夜甚乃胎禀不足腎虛嗽也用人參固本丸加阿膠桑皮盡而安又汪元津子病腎虛嗽與上症同亦用人參固本丸加茯苓知母貝母山藥各等分為丸服之而安蔣仲芳治盛氏女十餘嵗患內熱乾咳特甚醫與清火滋陰麥黃苓之品服之不效脉得弦數脉症湯藥甚相合也因何不愈沈思間忽聞女衣有烟火氣詢其曽卧火箱中乎曰然即以前方與之令其遷卧牀上遂不終劑而愈問故曰咳嗽火熱爍金以清火潤肺之品治之甚當其如外火復逼一杯水其能救車薪之火乎今離却外火而病自愈耳小兒喘嗽萬密齊治一兒四嵗忽作喘氣逆痰壅鼻孔開張萬曰此馬脾風也以鼻煽命名也如胸髙肩聳汗出髮潤皆下脫也則不可治須急治之以葶藶丸去防已加大黃除肺之熱合小陷胸湯除肺之痰碾為細末竹瀝調服作實治一兒病兩腮紅上氣喘急脉浮緩而濡此得之傷食食傷脾脾虛則不能養肺母病子亦病也兩腮紅者虛熱也上氣喘急者肺虛也脉浮緩而濡氣虛也時醫咸以驚風為治用抱龍丸牛黃丸蘇合丸不效聞其言皆匿笑乃以阿膠炒成珠煎蘇葉烏梅湯化服三劑而瘳方却妙一小兒痰壅氣促而喘且發搐萬以礞石滚痰丸桑白皮湯碾碎調服之喘定痰下搐亦止矣一富小兒先病㵼醫以藥服之乃作喘歸咎於醫萬曰非醫之誤乃冷傷脾作㵼脾傳肺作喘脾為母肺為子傳其所生也用陳氏芎蝎散一服喘止而安後用此方治㵼後喘者良驗一女子素有喘病發則多痰用補腎地黃丸或曰喘者肺病也今補腎何也曰肺主氣腎則納而藏之痰涎者腎之津液所生也哮喘吐痰乃氣不歸元津液無所受也果服此而安朱丹溪治一女年十二自小喘嗽白术陳皮青皮各五錢麻黃茯苓木通片苓各三錢蒼术桔梗各二錢乾薑一錢甘草五分每貼一錢半煎服龔子才治一小兒外感風邪服表散之劑汗出作喘此邪氣去而脾虛也用異攻散而汗喘止再劑而乳食進馮楚瞻治同姓子三嵗平時面色㿠白𩕄門寬大顱骨開解一夕忽發微喘不能睡倒抱起稍可至三二日雖抱起而喘急不減出多入少兩眼逆急肝腎大虧理宜用上病療下之法恐不肯輕服乃設詞曰喘已多日肺氣虛矣當以人參錢許配生脉飲作湯化服啓脾丸乃愈也急歸寓以八味丸杵作大丸代之服下喘日減四五日後本症悉平精神倍長屢索啓脾丸而𩕄門顱骨俱長滿矣吳孚先治一小兒氣急而喘喉中聲如水雞叫用五拗湯而愈錢國賓治中翰陸登之次子自幼吼喘日夜不絶今八嵗莫愈身體無病診右寸浮滑主肺竅有痰喘吼三白丸煅白批貝母桔梗各三分飯丸黍米大每睡冷茶送下五丸至五日此子索物厭其母嗔之猛然一嗆吐出黑痰一塊如圓眼大其臭滿室剖開內色大黑瓜子一枚尖少破從此吼喘即止舉家感激除此子一生之患矣及問其故曰肺有六葉兩耳四垂如蓋清虛之臟纖塵不染因乳子誤吞瓜子入於肺縫久則痰膠阻礙呼吸之氣作吼喘聲也今藥力攻出肺清而金不鳴則無聲痰出而呼吸利則無吼喘症矣小兒哮萬密齊治胡三溪女素有哮病遇天欲雨則發發則多痰服五虎湯九寶湯即止不能斷根曰是益痰聚則作喘痰去則止痰者水液之渾濁者也難經云腎主液液者水所化也腎為水臟入心為汗入肝為淚入肺為涕入脾為涎此腎水泛為痰而喘也乃以六味地黃丸服之不復發矣陳三農治一小兒鹽哮遇隂雨即發聲如曳鋸以白砒一錢入精猪肉四兩內以鹽泥固濟火煅出清烟取出研細入江西豆豉一兩搗和為丸如黍米大白水下二三十丸忌油膩葷腥一月而愈朱丹溪治一男子年十四嵗哮十日則發一遍此痰在上焦不得汗泄正當九月十月之交宜溫散仍與小胃丹佐之溫散如麻黃黃苓每帖用一錢半入薑汁研細末以水盞半煎去查飲之每夜臨卧時與小胃丹十二粒津下之楚瞻治朱姓兒三嵗哮喘大作數日身熱汗出或以滚痰丸利之益甚脉洪數胸脅扇動扶肚肩頭汗如雨不食不眠曰久喘下元已傷復以峻利傷之故見諸惡候也以人參麥冬各五錢五味三粒肉桂二分煎服日二三劑喘頓減至夜復作此氣少復而陰未有以配之也以八味之加牛膝麥冬五味者內熟地六錢桂附各四分水煎冷服午前後各一劑睡醒食進喘止但勞動則喘聲微有此未復元之故以生脉飲調理三四日全安小兒虛損竇材治一幼女病咳嗽發熱咯血減食先灸臍下百壯服延壽丹黃芪建中湯而愈戒其不可出嫁犯房事必死過四年而適人前病復作竇曰此女禀賦素弱只宜固守終老不信余言破損天真元氣將脫不可救矣强余丹服之竟死李士材治汪氏兒年方舞象太文發熱咳嗽羸弱頭眩二冬二母知柏黃苓不啻百劑病勢轉增脉之右虛軟乃脾肺氣虛火不生土之候也用補中益氣加五味子苡仁薑桂至三錢必因苦寒過傷乃可十劑而減兩月乃安春初又發令其服補中丸一錢諸症永不作矣柴嶼青曰六兒身熱懶食脉細而無力屬陰虛血少服逍遙二劑未效內人力請延醫及診視云脉弦為脾瘧余固爭脉並不弦醫不服强令服二劑身熱更甚遂立意服壯水之劑二十帖始愈至乙丑復患身熱服六味湯四十日始霍然因歎曰幸是自家小兒故得自主倘他人延治四五劑未效必更醫矣能保其不誤事哉馮楚瞻治張氏子年十三忽患腿癰外科云勢難消散出膿得兩月收功視其體浮胖色㿠白知為先天不足矣再診其脉六部沈細而微復視其腫則右腿為甚色白而氷冷經曰血氣不知留結為癰今但使血氣和而無留結癰何由成與八味湯加牛膝杜仲各二錢食前服之一劑腿溫痛減半三四劑全瘳薛立齊治一小兒九嵗解顱足軟兩膝漸大不能行履此腎禀不足用六味丸加鹿茸三月而能步履一小兒年十四肢體倦怠發熱晡熱口乾作渴吐痰如涌小便淋瀝或面目赤色身不欲衣此亦禀賦不足也用補中益氣湯及前丸而愈一小兒十五嵗而御女大小便道牽痛服五苓散之類虛症蜂起與死為鄰用補中益氣湯加減八味丸而愈一小兒十三嵗內熱晡熱形體倦怠食少作渴或用清熱等藥治之虛症悉具以為所禀怯弱用六味丸加鹿茸補之不越而痊萬密齊治一兒四嵗出痘時頸軟頭傾曰此兒胎禀不足瘡毒正發壯火食氣亟補元氣使痘易發易靨幸而保全再補其陰不然恐難出二八數也乃大作調元湯連進之獲安江蘭峯子七嵗頭面汗出如流用人參當歸二味同獖猪心煮湯服之安一女嗜卧發熱項軟頭傾欲作風治持疑未决萬曰此陽虛病也蓋頭者諸陽之首胃者諸陽之㑹此女必乳食傷胃胃氣不足故清陽不升而頸軟不能任元也可服調元湯一劑而愈一小兒脫肛半載恪服升補元氣之藥而愈繆仲淳治里中一童子年十五患寒熱咳嗽面赤鼻塞夜劇家人以為傷風繆視之曰陰虛也蓋傷風之症面色宜黯今反赤而明傷風發熱必晝夜無間今夜劇鼻塞者隂虛則火上升壅肺故鼻塞以是知其陰虛也投以麥冬五味桑皮貝母百部生地鱉甲黃沙參不四劑而瘳廣筆記立齊曰一小兒十四嵗解顱自覺頭大視物皆大畏日差明先兄以謂腎禀怯弱用六味丸加五味鹿茸及補中益氣加山藥山茰半載漸愈二載而𩕄合後畢姻覺𩕄門開解足心如炙喜其斷色欲戒厚味日服前藥二劑三載而愈一小兒白睛多黑睛少吐㵼後喉瘖口渴大便不實朝夕悉服地黃丸而痊後患㵼其喉復瘖仍服前丸遂愈續名醫類案卷四十六
