body:
  text: 續名醫類案卷三十六錢塘魏之琇撰産後類風薛立齊治一産婦患虛極生風或用諸補劑四肢逆冷自汗泄㵼腸鳴腹痛薛以陽氣虛寒用六君子薑附各加至五錢不應以參附各一兩始應良久不服仍腸鳴腹痛后灸關元百餘壯及服十全大補湯方效一産婦患中風盜汗自汗發熱晡熱面色黃白四肢畏冷此氣血俱虛用八珍湯不應更用十全大補加味歸脾二湯始應后因勞怒發厥昏憒左目牽緊兩唇抽動小便自遺薛為肝火熾盛用十全大補加鈎藤山梔而安再用十全大補湯辰砂逺志丸而愈一婦人産后睡久及醒則昏昏如醉不省人事用荆芥穗微焙為末每服三錢豆淋酒調服或童便服此華他愈風散也又名舉卿古拜散醫用此及交解散當歸荆芥穗等分每服三錢水酒煎云服后當睡必以左手搔頭用之果然此病多因怒極傷肝或憂氣內鬱或坐草受風而成急宜服此愈可立待本草綱目王肯堂治一婦産后七日為將息失宜腠理不密偶因風寒所侵身熱頭痛兩眼反視手足瘛瘲名曰蓐風用前方其疾即愈古人珍祕此方隱括其名曰舉卿古拜散蓋用韻之切語舉卿為荆古拜為芥曽公談録謂之再生丹亦神之也續醫說薛氏謂前症用此如不應者急用大補氣血為主吳交山治一婦産后因虛牙關緊急半身不遂失音以續命湯煮飲數服而安醫宗粹言薛立齊治一産婦中風不省人事言語妄甚惡風寒喜熱飲形氣倦怠脈虛浮無力薛謂氣血虛寒用十全大補湯二十餘劑不應又二十餘劑稍緩乃漸加附子至一錢服數劑諸症減一二又二十餘劑十退三四乃去附子五分數劑諸症頓退而安后又發仍服前藥加附子三五分而愈一産婦不語用七珍散而愈后復不語內熱晡熱肢體倦怠飲食不進用加味歸脾湯為主佐以七珍散而愈后因怒不語口禁腰背反張手足發搐或小便見血面色或青或黃或時兼赤曰面青肝之本色也黃者脾氣虛也赤者心血虛也用八珍湯加鈎藤鈎茯苓逺志漸愈又用加味歸脾湯而痊一産婦狀如腳氣發熱瞀悶搐掣驚悸或用獨活寄生湯而痊后復作服之其汗如水更加口禁吐痰乃用十全大補湯培養血氣漸愈后飲食日少肌體日瘦吐痰如涌此命門火衰脾土虛寒用八味丸及歸脾湯諸症漸退肌肉漸生蕭萬輿治陳昌之內首胎恃壯當風澡體即病發熱如燎口眼喎邪喘嘔有沫面目青黃心腹膨脹揚手舞足脈見弦數不鼓曰此肝虛自招風也非表病也急以薑附丸灌下仍用當歸四逆湯加人參茱萸兩劑而諸症失來天培治馬氏婦二十餘嵗産后九日患腹痛筋攣抽掣不可忍惡露不絶脈沉細而緊視其面色青黃不澤此肝經血少而兼寒也與歸芍六君加炮薑一劑腹痛雖未止而筋攣稍緩另延専科以廣半鈎藤木香威靈仙等腹痛益甚且血崩不止更加發熱神昏再求治以茋术歸地山藥苓草艾葉阿膠薑附內茋术地俱至兩外一劑而腹痛抽掣止再劑而崩亦痊用婦脾調理而愈産後痙薛立齊治一産婦勤于女工忽撲地牙關緊急痰喘氣粗四肢不遂此氣血虛而發痙朝用補中益氣湯加茯苓半夏夕用八珍湯加半夏各三十餘劑不應此氣血之未復藥之未及也仍用前二湯又五十餘劑尋愈一婦産后惡寒發熱他治以小柴胡湯致汗出譫語煩熱作渴四肢抽搐用十全大補湯二劑益甚其脈洪大重按則無此藥力未及也遂加附子服四劑愈一産婦筋攣臂軟肌肉掣動此氣血俱虛而自熱也用十全大補湯而安一産婦因勞兩臂不能屈服蘇合香丸肢體軟痿汗出如水薛謂前藥辛香耗散真氣腠理虛而津液妄泄也先用十全大補湯加五味子補實腠理收斂真氣汗頓止又佐以四君子調補元氣漸愈用逍遙散大補湯調理而痊一産婦先胸脅乳脹痛痛后因怒口噤吐痰臂不能伸小便自遺左三部脈弦此肝經血虛而風火所致不能養筋先用加味逍遙散治之臂能屈伸又以補肝散六味丸諸症悉愈一産婦患兒枕腹痛或用驅逐之劑昏憒口噤手足發搐此血氣極之變症也用八珍湯加炮薑二錢四劑未應又以十全大補湯加炮薑一錢二劑而蘇産後痛痺張三錫治一婦月中著惱素體厚多痰臂病移走兩足且腫以為虛治服參歸痛益甚惡心迷悶作鬱痰治二陳越鞠秦艽丹皮二服稍減大便四五日不去矣投搜風丸后用化痰舒氣二陳二术酒芩柏木通澤㵼香附調理而愈陸養愚治凌繹泉夫人妊將七月忽兩足軟痿不能履地分娩后頓愈一月后仍作且胸脅痛夜分發熱或以四物入牛膝木瓜虎骨鹿膠或作或止后以脾主四肢與參术脹痛悶絶仍用養血之品無進退經年餘診之詢其飲食如常肌肉如故足脛浮腫胸脅揉按則微痛否則痞悶其脈沉緩而滑此濕痰積于胸脅流于四肢故痛而軟宜乎滋陰不減補氣增劇也用二陳湯加蒼术威靈仙黃柏白芥子數劑痛定熱除加苡仁十劑步履如故薛立齊治一産婦身腹作痛發熱不食煩躁不寐盜汗脅痛服解散祛血之藥不時昏憒六脈洪大如無用補中益氣加炮薑半夏一劑頓退二三又劑寢食甘美但背强而痛用八珍散十全大補湯調理而安一産婦遍身頭項作痛惡寒拘急脈浮緊此風寒之症也用五積散一劑汗出而愈但倦怠發熱此邪氣去而真氣虛也用八珍湯調補而痊周慎齊治一婦産后受濕遍身疼痛衆以風藥治之遂致卧牀不起手足漸細此産后氣血虛而風藥愈損氣故也治宜大補氣血用參茋各錢半防己五分煎服愈大還一産婦遍身痛坐不得卧已經二月痰多食減衆治不效以參歸各一兩木香一錢為末酒煎分為九次服之愈馬元儀治卜氏妾産后胸中作痛痛甚則迫切不能支至欲求死諸治不效延至五月病轉危急診其脈兩手弦澀少神不能轉側不得言語曰胸中者陽氣所治之部今為陰邪所入陰與陽摶所以作痛前醫破氣不應轉而和血又轉而溫補又轉而鎮逆不知陰陽相結補之則無益攻之則愈結若鎮墜之益足以抑遏生陽而阻滯邪氣惟交通一法足盡開陽入陰通上徹下之妙使陰歸于下陽治于上太虛之府曠然何胸痛之有哉用人參三錢肉桂一錢合仲景黃連湯一劑痛減二三三劑頓釋次進加桂理中湯數劑全愈按是症即胸脾痺是也故入痛痺門繆仲淳治王善長夫人産后腿疼不能行立久之飲食不進因憊之極診之曰此脾陰不足之候脾主四肢陰不足故病下體向所飲藥雖多皆苦燥之劑不能益陰用石斛木瓜牛膝白芍棗仁為主生地枸杞茯苓黃柏為臣甘草車前為使一劑輒效四劑而起來天培治潘履端內年約四旬患頭身手足麻木疼痛步履艱難發熱胸滿不食脈之沉細而澀曰此屬産后感風不能節勞致風入經絡而成痛風之症也詢之果以前嵗産后而起以歸身紅花養血風藤鈎藤秦艽通經絡黃芥銀花清火羌活走百節川芎理頭痛菖蒲利膈消滿甘草緩痛薑皮達肌膚通腠理服二劑而頭痛愈腹脹減惟發熱身痛未除更心神恍惚不寐脈稍和此表症稍退裡熱未清改用生地婦芍柴胡地骨皮續斷鈎藤夏麴枳壳棗仁建蓮二劑而諸症痊惟兩膝內腫痛扶杖而行此風入三陰而將愈矣前方減柴胡地骨夏麴枳壳加丹皮赤芍紅花威靈仙風藤防己牛膝五加皮生甘草又三四劑全愈薛立齊治一産婦六月多汗人倦不敢袒被故汗出被裡冷則浸漬得風濕身疼痛遂以羌活續斷湯數服愈未選入産後頭痛薛立齊治一産婦頭痛日用補中益氣湯不缺已三年矣稍勞則惡寒內熱為陽氣虛以前湯加附子一錢數劑遂不發一婦人産后頭痛面青二年矣日服四物等藥薛謂腎水不能生肝木而血虛用六味丸加五味子兩月而痊繆仲淳治黃桂峯乃正産后頭痛大便閉用生料五積散一劑不效令加歸身一兩一服大便通頭疼立止薛立齊治一膏粱之婦産后月經不調唇裂內熱每焮作服寒涼之劑后不時出水薛用加味清胃散而愈后值春令兼怒唇白腫脹寒熱作嘔痰甚少食用小柴胡加山梔茯苓桔梗諸症頓退但內熱仍作乃以加味逍遙散調理而安産後瘖沈明生治袁令默女素禀不足分娩后體倦發熱醫者以其弱齡廋質且遵丹溪産后當大補之法遂以參茋進之病益甚診之脈浮而澀此不惟有餘血且有風寒在內夫瘀血未盡外邪初感均有用參之誡是以補之無功耳遂用解表散瘀之劑三四服后熱除胸爽然倦怠如故曰參茋之用此其時矣而袁懲噎廢食因循勿與越四五日忽舌瘖不語或用茯神棗仁或用南半薑橘或用芥連皆不效復延治察其神情雖不能語然每對食物輒注目以視得食則神稍旺更衣則神即疲且脈空而大經云脾之脈連舌本散舌下心之别脈絲舌本今火土兩虛醫藥雜亂經又云言而微終日乃復言者此奪氣也况經月不語乎不惟用參且應用附矣服五六日諸症悉愈夫病機者間不容髮有昨宜用攻而今宜用補旦宜用熱而夕宜用涼惟視其機之所在以發合病耳故是症不用補之害與驟補之害同失其機甚矣醫之難也産後病乳薛立齊治一婦産后勞役忽乳汁如涌昏昧吐痰此陽氣虛而厥也灌以獨參湯而蘇更以十全大補湯數劑而安若婦人氣血方甚乳房作脹或無兒飲脹痛增寒發熱用麥芽二三兩炒熟水煎服立稍其耗散氣血如此何脾胃虛弱飲食不消方中多用之耶張隱菴治一婦産后乳上發壅腫脹將半月周身如針刺飲食不進診之六脈沉緊有力左乳則腫連胸脅用麻黃葛根荆芥防風杏仁甘草石膏溫服取汗遂愈金匱云産后婦人喜中風經云開闔不得寒氣從之榮氣不從逆于肉理乃生癰腫此係風寒內壅火熱內閉榮衛不調所致衆以涼藥治熱不知開闔故甚令毛竅一開氣機旋轉榮衛流行而腫痛解矣經云食氣入胃散精于肝病屬陽明厥陰二經是以飲食不進今經氣疏通自能食矣孰謂瘍醫可不知經乎薛立齊治一婦人産次子而無乳服下乳藥但作脹曰人乳氣血所化今脹而無乳是氣血竭而津液亡也當補其氣血自然有乳乃與八珍湯倍參术少加肉桂二十餘劑乳遂生后因勞役復竭夫其初産有乳再産而無其氣血秪給一産耳其衰可知王肯堂治一娠婦患乳腫不散八月用火針取膿服十全大補湯外敷鐵箍散不效反加喘悶九月産一女潰勢愈大兩乳房爛盡延其胸腋膿水稠粘出膿六七升略無斂勢十一月乃用解毒和中平劑外滲生肌散龍骨寒水石等膿出不止流濺所及即腫泡潰膿兩旁紫黑瘡口十數胸前脅下皆腫潰不可動側其勢可畏此産后毒氣乘虛而熾令服黃茋解毒補血生肌醫不敢用十二月中旬后益甚始改用王藥時膿穢粘滯煎楮葉猪蹄湯沃之頓爽一制一方名黃茋托裏湯黃茋之甘溫以排膿益氣生肌為君甘草補胃解毒歸身和血生血為臣升麻葛根漏盧為足陽明本經藥連翹防風散結疏經蔞仁蒡子解毒去腫角刺引膿白芷敗膿長肌川芎桂炒黃柏為引用每劑入酒一杯送白玉霜丸疏膿解毒時膿水稠粘不可遽用收澀之劑理宜追之乃制青霞散外糝明日膿水頓稀痛定穢解始有向安之勢至正月皆生新血有紫腫處俱用葱尉法隨手消散但近脅足少陽分尚未斂乃加柴胡一錢青皮三分及倍川芎膿水將淨即用搜膿散糝之元宵后遂全安凡治癰疽須審經絡部分今所患正在足陽明之分少侵足少陽經分俗醫不復省别一概用藥藥無向導終歸罔功甚可歎也是症得生全在膿水稠粘其人必能食故可治也琇按乳病全是肝火上逆入胃大絡不降而成即肝木侮胃之病近治鮑緑飲夫人素有血虛肝病忽一日增寒壯熱頭痛口苦乳腫痛不任尉吮俱無效豫用生地杞子當歸各五錢麥冬蔞仁各二錢丹皮赤芍各一錢五分蒂丁銀花各三錢二劑即愈凡此方取效者不可枚舉矣朱丹溪治一婦人産后患乳癰用香白芷連翹甘草節當歸鬚赤芍青皮荆芥穗各半兩貝母花粉桔梗各一錢瓜蔞半個作一貼水煎半飢半飽服細細呷之有熱加柴胡黃芩忌酒肉椒料敷藥用南星寒水石皂角貝母白芷草烏大黃七味為膏醋調鵝翎掃敷腫痛效治法陳良甫曰余荆布因産前食素得疾瘦弱産后乳脈不行已七十日服諸藥無效嬰兒甚苦偶有人送赤豆一斗遂如常煮赤豆粥食之當夜乳脈通行因閲本草赤小豆能通妳乳漫載之良方産後腰脅痛薛立齊治一産婦腰痛腹脹善噫諸藥皆嘔薛以為脾虛血弱用白术一味炒黃每劑一兩米泔浸時飲匙許四劑漸安服百餘劑而愈一産婦因怒兩脅脹痛吐血甚多發熱惡寒胸脅脹痛此氣血俱虛用八珍湯加柴胡丹皮炮薑而血頓止又用十全大補湯而寒熱漸退此病苟非用薑桂辛溫助脾肺以行藥勢不惟無以施其功而反補其脹耳王時享室産后腰間腫痛兩脅尤甚此由瘀血滯于經絡而然也不早治必作骨疽遂與桃仁湯二劑稍愈更以沒藥丸藥劑而痊亦有惡血未盡臍腹刺痛或流注于四肢或注股內疼痛如錐或兩股腫痛此由冷熱不調或思慮動作氣所擁遏血畜經絡而然宜沒藥丸治之亦有經血不行而腫痛者宜當歸丸治之凡惡血停滯為患匪輕治之稍緩則流注而為骨疽多致不救産後腹痛衍義治一婦人産當寒月臍腹脹滿痛不可按百治不效或作瘀血將用抵當湯曰非其治也此脾虛寒邪客于子門也以羊肉四兩當歸川芎陳皮各五錢薑一兩煎服二三次而安周慎齊治一産婦腹脹痛服敗血去瘀之藥致小腹脹痛硬入大腹用薑吳茱萸蓽撥數劑而愈同上一産婦患小腹痛或作嘔或昏瞶此脾氣虛寒用人參理中湯漸愈又以補中益氣湯加茯苓半夏全愈後復作痛而兼喘仍用補中益氣湯培補脾肺而瘥良方一産婦小腹作痛小便不利內熱晡熱形體倦怠用加味逍遙散以清肝火生肝血用補中益氣湯補脾胃升陽氣而痊同上朱丹溪治馮宅婦産后發熱腹中痛有塊自汗惡寒曽服黑神散用白术白芍各三錢滑石五錢黃芩丹皮各二錢五分人參川芎歸尾陳皮荆芥乾薑各一錢甘草些須薛立齊治一婦産后小腹作痛有塊脈芤而澀以四物加元胡紅花桃仁牛膝木香治之而愈周于文母産后月餘腹中作痛不已甚至惡心不食惡寒流涎雜症不一有人教用荔枝四兩連核殼敲碎加以老薑四兩好酒煮服或作幾次服下亦可果效此溫州平陽事也其地産后每食老薑湯七八斤為凖蓋山水寒冷故也如少飲則為患不淺沈效兄抄本産後浮腫薛立齊治一産婦飲食少思服消導之劑四肢浮腫薛謂中氣不足朝用補中益氣湯夕用六君子湯而愈后因怒腹脹誤服沉香化氣丸吐㵼不止飲食不進小便不利肚腹四肢浮腫用金匱加減腎氣丸而愈一産婦泄㵼四肢面目浮腫喘促惡寒此脾氣虛寒用六君加薑而泄㵼愈又用補中益氣而脾胃健杜壬治一婦産后忽患浮腫衆作水氣治不效曰水氣必咳嗽小便不利今便利而不作嗽獨手足寒乃血臟虛寒氣塞不通故生浮腫也治宜益和血氣靈苑牡丹皮散愈張子和治曹典史妻産后憂恚抱氣渾身腫繞陰器皆腫肝經所絡大小便如常其脈浮而大此風水腫也先以􅐽水撩其疾以火助之發汗次以舟車丸濬川散㵼數行后四五日方用苦劑涌訖用舟車丸通經散過十餘行又六日舟車濬川復下之末后用水煮桃紅丸四十餘丸不一月如故前后涌者二㵼皆四通約百餘行當時議者以為倒布袋法耳病再來則必死不知此乃內經治鬱之𤣥但愈后慎房室等事况風水不同水無復來之理産後虛汗薛立齊治一産婦略聞音響其汗如水而昏憒諸藥到口即嘔薛以為脾氣虛敗用參附末為細丸時噙三五粒隨液咽下乃漸加至錢許却服參附湯而安一産婦盜汗不止遂致廢寐神思疲甚口乾引飲薛謂血虛有熱用當歸補血湯以代茶又以當歸六黃湯內黃芥連柏炒黑倍加人參五味子二劑而愈繆仲淳治于中甫夫人産后氣喘投以人參蘇木麥冬各五錢一劑愈五日后忽自汗無間晝夜聞響聲乃飲熱茶湯即汗遍體投以人參黃茋各五錢加歸身生地二劑不效即令停藥金壇俗忌未彌月不得診視乃遍檢方書至證治要訣治汗門內有凡服固表藥不效者法當補心汗者心之液也灑然曰是矣病人素稟有火氣非不足也産后陰血暴亡故心無所養而病肝亟以棗仁一兩炒為君生地白芍麥冬五味枸杞牛膝杜仲歸身阿膠牡蠣龍眼肉大劑與之至三十二劑罔效于懼曰得無不起乎或藥應更改乎曰非也前投參茋不應而遽止之者以參茋為氣分藥劑且大其不應者必與症不合也滋得其情復何惑乎蓋陰血者難成易虧者也不可責效旦夕仍投前劑至四十二帖忽得睡汗漸收睡愈熟至四日夜醒而霍然顔色逾常血足則色華也琇謂能于方中炒焦黃連三五分則數劑可愈馮楚瞻治一産婦因頭汗甚多延診餘無他苦脈之雖洪而緩曰頭過多諸症謂之亡陽然産后陰氣大虛正喜其亡陽與陰齊等此薛氏之論可勿藥而愈也病家疑另延一醫峻用參茋溫補遂暴注下㵼完榖不化益認陽虛重用參附炮薑其㵼愈甚不數日其肉盡削精神困頓復延診六脈洪弦甚數此真陰竭矣何能挽救蓋産后頭汗乃陰虛虛火上蒸孤陽上迫津液不能閉藏誤作腸虛重加溫補燥熱之氣暴注下趨而先完榖不化乃火性急速不及變化而出也重以溫熱焚灼勢必窮竭尚何藥之可救哉案中正喜亡陽與陰齊等薛氏謂可勿藥而愈此正薛氏生平不能峻用養陰之缺處也豫常遇此症以重劑生熟地白芍杞子麥冬棗仁察其有火則少加芩連不過二三劑愈矣馮君論此症雖了了而不與藥致病家屬之庸手而敗亦守而未化之過也産後虛損薛立齊治大尹俞君之內産后發熱晡熱吐血便血兼盜汗小便頻數胸脅脹痛肚腹痞悶此諸臟虛損也症當固本為善自恃知醫用降火之劑更加㵼利腸鳴嘔吐不食腹痛足冷始信薛言診其脈或浮洪或沉細或如無大虛之脈內多如此其面或青黃或赤白此虛寒假熱之伏時雖仲夏當捨時從症先用六君子加炮薑肉桂數劑胃氣漸復諸症漸退更佐以十全大補湯半載而愈儒者楊敬之內人患症同前但唾痰涎或用溫補化痰之劑不應面色黧黑兩尺浮大按之微細此因命門火衰不能生脾土脾土不能生諸臟而為患也用八味丸補土之母而痊一婦人産后血竭朝寒暮熱肚腹作脹而痛按之不痛以為血氣俱虛用八珍之類治彼反行更加發熱煩躁乃用當歸補血湯熱躁漸止用八珍麥冬五味子氣血漸復一産婦朝寒夕熱或不時寒熱久不愈用六君補中益氣兼服百餘劑而安産後驚悸薛立齊治一産婦驚悸二度服琥珀地黃丸局方妙香散隨效再患服之其症益甚而脈浮大按之如無發熱惡寒此血氣俱虛薛用十全大補湯加味歸脾二湯各百餘劑而愈后遇驚恐勞怒復作仍服前藥而安吳孚先治王氏婦産后數日惡露已盡身體虛弱遇回祿舁出神驚散亂身翩翩如在雲端専科用元胡紅花等味反增煩劇汗㵼交作六脈虛弱如無用六君子加黃茋炮薑製附棗仁鈎藤龍骨川斷五味始服症減繼則神清每日參或一兩或二兩二十劑而安髙鼓峯治用晦室人患産后驚悸初起時見筐中綿絮念將所生兒入綿絮中不幾悶死即作驚恐憂患之狀后凡有所觸意中以為不耐即憂患不止或一端熱想數日才已飲食不進面少精采服諸補心養血藥無一效髙診之曰孩時得母因齒病致大驚否用晦向室人問之曰十嵗時果曽病齒治齒者用刀鉗之幾受驚而死子何能識之也解曰脈法當如是耳不精于象數鈐法之學者不能也此語不必少時以驚受損傷其君火心色氣散痰得留之今産后大虛痰因虛動病端見矣夫心為君主主明則下安國乃大昌故凡七情皆由心起今心虛甚痰邪侵擾思慮亦因之多變况喜樂氣之陽也憂患驚恐氣之陰也陽虛則陰得乘之又兒為其所愛氣虛痰入則愛不得正因愛而過為防護之惟恐不至遂因而生憂矣今先用歸脾養榮八味等類五十大劑待其氣血完備然后攻之痰可得而去而病不再發矣先補后攻法如言治之果愈張路玉治汪督學媳産后病虛無氣灑灑然如驚時咳青黑結痰欲咳則心中憺憺大動渾身麻木心神不知所之偶聞聲響則頭面閧熱微汗神魂如飛越狀屢用補養心血之劑罔效虛羸轉劇診之脈浮微弦而芤獨左寸厥厥動搖此必胎前先傷風熱坐草時迸力過甚痰血隨氣上逆衝過膜膈而流入心色也朝用異功散加童便煅淬蛤粉以清理痰氣夕用大劑獨參湯下來復丹以搜滌痰積蓋痰在膈膜之上非焰硝無以透之血在膈膜之上非五靈脂無以濬之然非藉人參相之性不能激之使出也服數日神識漸寧形神漸旺改用歸脾湯加龍齒沉香調理而愈薛立齊治一産婦惡露淋瀝體倦面黃食少惡寒晝夜不寐驚悸汗出此脾經虛熱用加味歸脾湯而痊后因怒脅脹作嘔少食用六君加柴胡治之而痊繆仲淳治王六息乃正産后驚悸聞聲輒死非用力抱持則虛煩欲絶如是纍月曰此心脾肝三經俱虛也用人參棗仁茯神逺志白芍石斛甘草麥冬五味丹砂為丸以龍眼湯吞彌月而愈産後顛狂薛立齊治一産婦患顛狂或用大澤蘭湯而愈后又怔忡妄言其痰甚多用茯苓散補其心虛頓愈又用八珍散加逺志茯神養其氣而瘥一産婦亦患此用化痰安神等藥病益甚神思消鑠薛以為心脾氣血不足用大劑參术芎歸茯神棗仁四斤餘而安乃以歸脾湯五十劑而愈一産婦形體甚倦時發譫語用柏子仁散稍愈又用加味歸脾湯而愈又因怒狂言脅痛小便下血用加味逍遙散以清肝火養肝血頓瘥又佐以加味歸脾湯而安魏玉橫治一婦産后數日日晡壯熱大汗狂言妄語不可禁制晨則了了診之六脈弦長不便不食此臨盆去血過多肝失其養燥而生火逆入胃之大絡非如敗血上衝之候也若屬敗血則晝夜熱狂矣與生熟地甘杞子各一兩麥冬五錢一劑減二劑瘥丁潤兄室數有吞酸症孕八九月心腹大痛時時眩暈欲絶與大補益氣湯十餘劑全愈臨盆胞水先去三日而后産自汗譫妄専科與炮薑附子數劑遂發狂耳聾更醫以茯苓車前半夏浮麥等多劑無效診時已彌月脈弦急如蛇行此精血皆奪之候亟與地黃杞子麥冬沙參一劑脈稍和症稍減仍召前醫謂不必服湯劑矣與丸子令服二三日發厥而終此與前症大同一生一死謂誤治可乎繆仲淳治張璇浦乃正産六朝發狂持刀殺人陰血暴崩肝火炎故也令先飲童便一甌少止再服龍齒澤蘭生地歸身牛膝茯神逺志棗仁大劑仍加童便頓服而止施笠澤治庠友唐仲宜乃正産后驚悸恍惚語言錯亂此産后心虛敗血停積上干包絡致病若此先用佛手散加石菖蒲五靈脂劉寄奴薑黃等藥以除敗血後以歸脾調理而痊至明年五月復産復病前症遍延諸醫施仍書前方一醫訝曰寄奴蒲黃等藥從何來耶仲宣疑不復用至是冬施偶同學士材過大洪橋忽遇仲宣喜而迎曰內人自乳子后或歌哭嗔笑狂妄不常向服安神清心之劑不效夜來幾自縊矣今偶值二子豈天賜耶幸為診之遂偕往診之六脈沉澀曰瘀血挾痰久且益堅非前藥所能療用歸尾桃仁煎濃下滚痰丸二服每服三錢下去惡物后用鎮驚鎮肝調理而愈馮楚瞻治一婦産后兩月忽患癲疾久不愈或連日不食或一食倍進或數日不寐或間宿一寐脈乍洪乍小左寸兩尺常弱消痰鎮心俱不效夫諸躁狂擾火之病也二陰一陽火之原也主智閉藏腎之用也産后未久少陰虛也以八味加牛膝五味大劑冷服其所食鴨肉猪肘入肉桂同煮調治數日乃一日稍輕一日如故此心脾亦不足主信而為病也朝服加味八味湯夕服歸脾湯去黃茋木香加白芍麥冬五味肉桂服后漸安月餘全愈未選入産後見鬼薛立齊治一産婦乍見鬼神或用調經散愈而復作仍服前散益甚痰涎上涌朝寒暮熱乃朝用八珍散夕用加味歸脾湯各五十餘劑而愈盛用敬治金棠妻半産病數月日厥者數四見鬼自頂而出自口而入盛曰脈澀而弦血少有痰鬼自頂門出此原神出也出而不進者死出而復入可活也藥之去痰碗許尋愈吳江縣志用敬即啓東之孫陳良甫治五羊洪運使天錫子舍孺人産后語言顛倒譫語不已如有神靈服諸藥無效召診之六脈和平以奪命散兩服而愈續名醫類案卷三十六
