body:
  text: 續名醫類案卷三十八錢塘魏之琇撰痘順症萬密齋治羅野松年十六出痘或曰凡出痘者春夏為順秋冬為逆今冬出時逆也痘起發頭面要腫今被寒氣遏抑毒不得出故頭面不腫症逆也曰不然春夏為順秋冬為逆非以時言以症言也蓋春夏者發生長養之令也秋冬者收斂閉藏之令也痘本陽毒自出現而起發自起發而成膿如苖而秀秀而實故曰春夏為順如應出不出應發不發謂之陷伏故曰秋冬為逆頭面不腫順痘也頭浮腫者險症也頭面預腫者逆痘也今痘本磊落尖圓堅實其毒輕微故不腫若頂平根濶肌肉鮮紅此為毒盛不待起發而頭面先腫矣或又曰起發太遲宜服溫補曰痘無病不須服藥此症紅潤鮮明表氣足也大小便調理氣充也無熱無渴無他病也若補之謂之實實此症不十數日必收靨矣果不藥而安吳氏子五嵗出痘起發時頂順而陷曰順痘也凡出頭以氣血和平為主尖圓堅實者氣也紅活明潤者血也紅活平陷者血至而氣不足也圓實而色白者氣至而血不足也平塌灰白者氣血俱不足也掀腫紅綻氣血俱有熱也今痘出即密時日未到氣血未周以漸起發得其常也故曰順痘不須服藥已果然小兒痘氣虛徐仲光治一兒痘初標於下頰腎部也形平陷氣不足也少神血不足也六脈沉弱五朝尚暗色不起兩腿作痛便溏有氣凝血滯之象此乃氣虛脾弱之症宜大補中氣以補中益氣湯加蟬蛻肉桂羌活二劑而起脹繼以保元湯加肉桂陳皮調理八朝溏泄不已加木香訶䓻治之而愈一兒痘起脹頂平而色淡白渴㵼肢冷喜熱飲經曰隂甚者飲沸湯而不知熱又曰大寒而盛熱之不熱是無火也治之宜益火之原以消隂翳用陳皮散異功散又八味丸治之而愈一兒痘六日稠密形平塌色黑滯有擬雲掩天庭者有擬鎖項鎖胸者然形色雖逆而四肢紅活綻突唇白紅潤起止安寧飲食如常二便調適雖毒盛氣血不足幸脾胃尚強宜補養而兼保固以補中益氣加紫草蟬退牛蒡等劑其逆痘俱平漿破漏結痂發疔癰數處而愈費養恆治一兒因內傷而吐次日見痘甚密一日絶無起勢鬆肌透表二劑不應次日以保元湯加薑桂少許二劑亦不應三日加參茋至三錢至四五日略起終頂陷囊薄七日加參茋五錢鹿茸膏半杯仍無沛然之熱或邪得補而愈盛曰果爾則煩熱躁渴色蒼老􅈨紅矣今皮薄色白頭溫足冷症可知也乃以參茋各一兩鹿茸膏大半盞一劑即綻突如珠根紅頂白不一日漿即肥膿其後收功不假餘力是以補為㵼之一驗也今無是症矣二句乃建中之言梟毒費建中治故友孫貞老子四嵗庚寅暮春痘甚勻朗稀疏而綻突其熱宜和其神宜爽乃躁亂乾熱頭汗如雨蓋梟熱內擾邪火外爍也頭為諸陽之首先賢謂毒參陽位者死幸初見勢雖騰涌而毒尚未有定位耳大黃二錢黃連六分石膏生地各三錢佐以蒂丁青皮荆芥蟬蛻木通山查三劑頭汗收熱勢減減石膏黃連加丹皮滑石牛蒡四劑五朝仍壯熱紅暈如珠此痘起齊毒火盡發也躁亂如前而更渴大便三四次前方復用石膏黃連倍加生地至九朝漿甚老而乏滋潤紅暈未淡胃氣不開熱亦未減寢亦未安再服十二朝漸愈救偏碩言嚴氏子一周痘稀朗且紅潤乃身熱如烙愁楚不堪兼顆粒不鬆此內有伏毒也以大黃六分石膏生地各一錢半荆芥丹皮山查蟬退葛根青皮二劑大便三四次又二劑熱和神定根窠亦鬆宛然順症矣有阻之者遂勿藥至八朝仍熱叫哭失音頭面擦破身上紫滯幸未焦隱前方倍大黃生地黃連減葛根入大桑蟲日二劑以化毒丹調油胭脂如膏藥貼之次日癢止紅活又二劑漿足熱和十二朝用紅花地丁生地牛蒡荆芥木通甘草連翹山查漸愈矣痘初似順一有伏毒便至如此餘可知矣臧氏子八嵗患痘疳僅存皮骨庚寅仲春見痘羸憊如此似宜培補矣乃身熱如炮目紅如火躁渴不已溺血如膏椒紅黯滯此梟毒挾烈火發即內攻若不通變七日當內潰也以大黃四錢石膏七錢生地兩許佐以桃仁赤芍荆芥牛蒡木通臨服和豬尾血一盞日二劑或三劑六日加黃連自始至終一方而已約用大黃斤餘生地石膏二十餘兩豬尾十餘碗良以毒猛熾苟不滌除淨盡功虧一簣矣痘後精神煥發飲食大進肥肉生長是以㵼為補之一驗也張仲文子癸未仲冬忽身熱如火神即昏憒舌刺如煤唇口焦黑血㿀無數溺紅鮮肉瞤筋惕有如驚悸宛然悶痘斷非輕劑可挽即用石膏一兩大黃五錢黃連三錢生地一兩佐以青皮荆芥地丁丹皮天寒稍配蜜炒麻黃三分薑一片以行之灌下即嘔費曰毒火上衝水火搏激兩不相下故耳乃全受十餘劑方見痘及見則以數記唇猶黑溺血依然至九日後黑退津生神氣漸省十二日溺血始淡胃氣日開十六日全愈服過大黃十餘兩石膏生地約二斤是早圖之驗也小兒痘毒壅附穢觸徐仲光治一兒痘紫色而不起脹乃毒盛擁遏也以紫草紅花蟬退煎酒調獨聖散服之又以犀角地黃治之紅潤起脹而愈一兒痘六日稠密紫滯平陷不起脹煩躁悶亂亦毒盛擁遏也但分珠腳斂可治以人中黃每服三分酒調漿連二服色漸紅活又犀角地黃湯加牛蒡蟬退痘綻突起脹而愈一兒痘血熱重初時純與涼血解毒犀角服過二兩石膏五錢一劑者服過五劑至十朝略用參三分托漿十二朝外漿清痂薄用助托藥加綿繭𢃄蛾者七枚糯米乙合渴時即以麥冬糯米綿繭煎湯飲之又發水泡數個漿疤暗長灌爛遍身復用茯苓苡仁白芍黃連銀花甘草生地骨皮山藥蓮肉木通連翹牛蒡荆芥而愈萬世用云庚申春家有頑童僅十嵗患痘瘡症適僕寓鄉之故廬走報急歸視其疾不為不緊且傍有煎炒油膩欲避莫能荷育溪曽世榮也療之恰七日瘡脹而光澤偶因舍又有動厠穢觸覺色黯而神昏大為驚懼育溪曰毋慮吾有除穢藥投之必安不數日果如其言遂拜更生用扣其所用何劑曰中和湯即十竒散加沉檀等劑而已餘無他巧幼幼心書小兒痘血熱施季泉治臧玉涵次郎年十六因新婚兼酒食忽感痘咸以為不可治至八日漿清寒戰咬牙譫語神思恍惚咸欲進保元湯大補之施季泉以為不然改用犀角地黃湯得脫痂後忽嘔吐大便燥結淹延一年繆仲淳視其舌有裂文曰必當時未曾解陽之毒故有是症以石膏一兩人參一兩麥冬五錢枇杷葉橘紅竹茹童便為佐一劑即安再劑膈中如冷物隔定只以人參投之服兩許即索粥食晚得大便夙疾頓愈孫生東治鄭黃門子痘血熱大盛初起即以犀角地黃治之不效至用白芍八錢一泄毒解徐補收功同上家弟元著一發熱即譫語唇腫齒黑痘欲出不出醫者以為發㿀傷寒也延仲淳季泉不至豫曰事急矣以生地八錢白芍及芩連各二錢稍加發藥日三劑勢稍定痘漸次而出又減地黃白芍之半復於助漿藥中兼清涼之劑九十朝漿始足卒傷一目靨後方大便此真血熱也若重用解毒輕於補劑則目亦可以不眇矣同上黃綺雲治一兒痘初血熱盛用生地三兩煎膿汁頻飲其痘紫立轉紅色同上一兒痘毒盛又遇火令用白花地丁汁和淡白酒少許服之立解一兒痘稠密綻突但色紫暗壯熱煩渴譫語目赤便祕乃毒火亢極也以四順清涼飲加大黃六錢微利二度其勢稍減再劑服之又利二次病去其半再以煎方加人參三錢前症悉平色見淡白精神疲倦邪雖去而正氣不足宜大補之又以保元湯加芎歸芍术而愈一兒痘出夏月起脹而乾紅壯熱煩渴舌燥不眠弱赤此內外熱極也以黃連解毒湯合化斑湯而愈一兒痘值六月六朝痘痛煩渴氣急便祕乃心肺實熱也恣與涼水梨汁飲之前症悉平一兒痘出勻朗綻突但枯燥而不能肥澤皮膚皺揭皆屬於燥經曰燥勝則乾治以養血清金潤燥之劑又保元合四物加麥冬治之而愈萬密齋治鄒氏之子五嵗出痘或與保元湯熱益甚或以為險曰此順症也期十八日安不須服藥蓋痘不可以日期算出已盡發已透膿已滿而后收靨可期也今痘出而熱轉盛者出未盡也由服保元湯犯實實之戒故令出遲靨亦遲也夫善攻不如善守無他病何以藥為已而果愈萬子婦患痘大熱大渴眼紅唇裂自利清水妄見妄語循衣摸牀遍身紅斑如蚊迹皆逆症也此毒在三焦表裡俱熱非大發大下之劑不可救也乃以通聖散全料大劑與之一服而前症悉去痘出其密復用十全大補湯去桂加防風銀花連翹桔梗調理而愈其痘自下收起亦竒事也一小兒痘後發熱大小便難瘡瘢𢃄赤或言虛欲用保元湯曰不可此實熱也因食辛熱之物得之果因食雞而得以三黃丸而愈痘諸熱徐仲光治一兒痘後午餘發熱臉赤色譫妄狂顛乃火從虛發也以保元湯加歸芍川連而愈一兒痘後身熱減食面黃肌瘦右脈沉滑雖係內傷而胃脾則虛宜先調而後消之六君子加山查青皮而愈一兒痂後能食便祕身熱口渴乃胃有藴熱也遲則變生三黃丸清胃湯利之而愈一兒痘後夏令痞滿燥熱用巴豆下之心痞少解腸燥腹痛利之如爛魚腦強食即嘔痞噯不已足胕痛舌赤溺澀此暑傷元氣熱藥又傷之隂亡而陽獨存也一兒痘後身熱頭痛惡寒拘急腹脹內外俱傷感也以參蘇丸香砂丸而愈一痘後大熱無汗乃時行疫症也服截瘟丹五瘟丹而愈一痘後身熱頭疼過用發散二劑其熱愈甚乃內虛症用補中益氣湯而愈一痘後傷食過用剋伐致面黃少食午後潮熱用清熱劑更加泄㵼此中氣不足用六君補中益氣即愈一痘後身熱煩躁面紅唇赤驚掣此熱傷風也由於衣被太暖或近火積溫成熱熱極生風以犀角地黃湯合導赤散而愈一痘後傷於風寒筋骨疼痛鼻流清涕川歸散加羌防而愈一痘後身熱惡寒右脈浮弱由飲食勞役內傷脾胃無陽以外護但見風寒即惡發熱頭微疼補中益氣而愈萬密齋治徐氏子痘後發熱或用小柴胡湯竹葉湯黃連解毒湯皆不效乃與保元湯加當歸炒黑乾薑一服熱去費建中治沈氏女周嵗身熱如焚汗出如雨兩目倣徨如畏刀鋸以大黃四分黃連三分石膏二錢佐以丹皮木通山查青皮蟬退連二劑次日神色定放標數點磊落分明又二劑熱和神爽稀疏頗潤更以中和之劑八日愈吳橋治汪一龍幼兒患痘方七日痘多而不起四肢皆涼痘色如浮萍乾紅枯紫渴甚啜茶水日數十升水㵼不禁諸醫皆以為寒也遞以木香異功散獨參湯補之既而下結血數枚諸醫辭去橋至則以為火症衆皆不然比日身涼飲水多且水㵼不止即有熱無傷矣橋曰水㵼者挾熱也身涼者熱厥也視其口則舌有紅斑三語衆曰此非熱而何遂用大補寒涼之劑投之一服得寐而㵼止詰朝四服痘色微紅活有神九日而起太函集痘汗徐仲光治一痘漿足盜汗此隂虛也保元湯加浮小麥治之愈一痘後盜汗肌瘦煩躁此陽虛也補中益氣湯倍茋加麥冬而愈中暑出痘曽世榮治衡陽侯自牧次子五嵗盛夏泄㵼面垢煩渴耳尻冷驚悸診其心肝脈浮而洪大脾肺脈虛而細數口面垢渴㵼脈虛細數者此中暑也驚悸發熱耳尻俱冷肝心脈洪大者此痘瘡欲出也先服黃連香薷散解利暑毒續投陳氏異功散再加附子與之實脾二日㵼止三日瘡見不旬餘而全功此隆暑用附子之效也幼幼心書費建中治鍾氏小女痘值炎天受暑煩擾非常壯熱如焚痘色乾紅纍日不起渴思井水僅與碗許便覺爽朗求之不止竟飲及一斗通身微汗神情始快痘頓起色亦紅活終以清火解毒收功徐仲光治一痘漿足漸蒼老宜靜以養之有謂脾主結痂用異功散加山藥白芍喘渴身熱此實症而用補劑內外皆熱也治以寬中湯又口齦發疳以清解毒湯而愈一痘八朝漿滿身熱而渴咳有痰涎火盛津液涸也用白虎湯愈一痘起脹煩渴不已寒之不寒是無水也宜壯水之主以制陽光六味地黃丸料加麥冬五味多服而愈一人十九嵗痘六朝勻朗綻突淡白少神渴甚不已此虛弱而津液竭以人參二兩麥冬五錢水煎漸服又以補中益氣湯加枸杞二劑保元湯加冬芍歸杞九朝漿足渴止用人參一斤而愈一痘起脹乾紅焦紫根窠堅實便結煩渴黃連解毒湯而愈一痘六日起脹形色順不食引飲此胃弱也調脾內托散治之即愈亦有毒壅而不食引飲者不可不辨痘發渴徐仲光治一痘八日漿半足熱甚引飲有用保元湯而渴益甚徐用加倍人參用人參二兩麥冬兩半煎成頻飲而渴止此渴甚藥輕不能生津以自救也一痘九日空殼無漿根血乾紅壯熱口渴與保元湯而渴愈甚此腎水枯涸不能生火宜壯水之主六味地黃丸料加人參當歸知母麥冬枸杞子兔絲子而愈一新婚後出痘躁熱而渴與冷飲即睡醒則復索飲不已時大冷大寒此亦腎水涸不能制火乃孤陽絶隂後雖行漿二三日而卒無隂則陽無以化正謂此也一新婚後出痘躁熱引飲亦宜壯水制火用八味地黃丸料加人參麥冬五味子又用補中益氣湯而渴止熱減一痘七朝潮熱口渴自利下臭穢陳積此脾胃熱蒸而下也雖虛而無寒以保元固中之劑而愈若用躁熱之劑如木香散禍不旋踵一痘漿期壯熱煩渴舌乾口躁或疑津液不足與保元湯如麥冬而熱渴愈甚痘色焦紫此症本熱而衣被火爐過暖用補反助其熱宜清涼以黃連解毒湯加牛蒡而愈一痘後熱渴能食便祕赤咽乾口燥此心胃二經受邪也用白虎湯而愈一痘後口乾舌燥咽乾食少便調此脾胃虛津液不足也用參苓白术散及參冬甘术升葛麥冬花粉五味粳米而愈一痘後口渴食少小便數此食傷胃氣津液不生故渴而溺數也補中益氣湯加麥冬五味而愈一痘黑陷黃色不食性好飲酒順其性與飲紅綻而愈一冬月出痘頂陷紫黑飲食藥餌俱不用以當歸浸酒與之而痘起脹收功一痘火毒閉而形若死移棄外庭過暴雨而疏蘇解此以水制其火也一險痘熱壅索飲不已連與井水數升渴止而痘起萬密齋治鄒氏子痘養膿時大渴不止議用人參麥冬散彼即依本方修合曰瘡太甚津液不足之症白术燥津液茯苓滲津液皆所禁也乃以本方去茯苓白术加升麻生地花粉知母淡竹葉一服渴止萬氏子痘養膿時大渴不止即用前加減方作大劑代湯飲之一帖而止痘痛一痘半出遍身作痛乃熱毒壅滯未盡外出故也活命飲加蟬蛻而愈一痘漿足而痛不已此諸痛為實也白芷陳皮甘草牛蒡連翹山查一痘六七痛不已此毒未化止鬱而作痛也非虛非實不須治之俟毒從膿化其痛自止痘癢徐仲治一痘初起作癢風寒外滯也升麻葛根湯焙荆芥穗尉而愈一痘起脹淡白神少泄㵼口渴而癢此脾胃氣虛也補中益氣湯去歸加桂附糯米而愈一痘成漿癢破是衛氣暴㵼津液不榮幸能食便潤四君子湯加芎芍橘復腫灌成痂而愈一痘成漿癢破潰爛乃濕火并至也調脾滲濕而愈一痘九日漿清作癢大補氣血而愈一痘見七日至十三日癢塌木香散加丁桂固表裡而愈萬密齋治鄭氏子痘將見形作癢不能禁曰起發時作癢者逆也貫膿時作癢者逆也將靨時作癢者險也險者可治逆者不可治才見便癢書無此症因思仲景傷寒正理論云病身癢此邪在表欲出而不得出也桂枝麻黃各半湯陽明經病皮中如蟲行者此肌肉虛也建中湯今此身癢正是痘欲出不得出與太陽症同非陽明肌肉虛也乃以各半湯去桂杏加升麻葛根牛蒡一服庠止痘出甚密調治半月而安屠家子出痘貫膿時請一巫誦呪噀水解厭後忽如瘙癢痘形平塌其色青白而氣腥臭曰犯房室穢氣也急令買膠棗一斤燒煙薰之痘轉紅活而癢亦止問其故老巫他往而子代之有房事胡氏女七嵗痘初發熱兩手如撚物狀曰此肝病也經云其為病也握宜平其肝以㵼青丸去大黃加甘草柴胡青皮一帖而握止欲再進一帖不聼曰凡肝病者多水泡而作癢宜止之未發之前既不信七日後再議至六日盡􅎲破矣乃用保元湯加防風白芷一帖癢止再服著痂而安施季泉治臧玉函幼兒甫半周身熱一日即見痘專門云樹小花多頂平腳塌根窠薄百死一生之症也五朝固辭去藥以保元湯為主擬六朝多用人參加附子疑慮間施至曰此險症且戒云必發癢異常須看守嚴密藥用涼劑與前治大别七朝大發癢作㵼一日夜二十餘行或藥水或乳或湯飲俱傾注不變色咸謂必無幸矣施怡然自若因強之用參必不許乃加炒黑黃連㵼止十三朝復發癢口渴唇燥舌生白胎又加炒黃連白胎去到底不用參十九朝而别又戒曰慎防痘疔口疳疔之發也必在腦後枕骨間當以收口膏貼之禁用滲藥口疳惟君家人中白散為妙不數日發疔口生疳如其言治之輒效廣筆記痘後疥癬一痘感暑毒靨後頭發珠子因用香薷飲合犀角地黃湯加荆蒡服而愈一痘後遍身肥瘡失於清解到瘀毒內攻而死一痘後遍身生瘡忽自愈而喘脹搐搦此同倒陷論先用升發使再作後用犀角解毒湯加人參而愈亦有用百解散發為腫者一痘遍身膿瘡久而肌瘦潮熱此毒已外泄宜固正氣為主補中益氣湯加苡芍茯防銀花石斛外治水銀膏一女十七痘後膿疥逢時即發苦參四兩歸芍芎防荆芥白芷牛蒡枸杞連翹蔓荆薄蒺蔞丹胡麻首烏各一兩黃米糊丸盡劑而愈一女痘順十二朝成膿疥身熱煩燥此毒擁失解也幸正不容邪以歸芍蒿蒡芷防苡銀花治愈若失於解散多有損其肢目者矣痘疔徐仲光治一痘清漿結疤四肢發疔數處能食便調見其脾胃實強以內托解毒散治之潰出疔根用生肌散敷愈一痘清漿結疤便泄減食疔發二十餘處因脾胃虛弱正不勝邪毒仄內攻解毒無效于十四日陷而死愚按解毒中兼補托藥未必無效一痘漿足發疔數處壯熱煩渴便祕能食此有餘之毒未盡以四順清涼飲治之而愈萬密齋治朱大尹子痘至起發時頂後手背有二痘變黑者摸之則痛此痘疔也急取胭脂數帖水浸取汁塗之盡汁而止次日紅潤起發汪氏子痘起發時有變黑者以朱公子事語之教取胭脂汁塗不聼後一身盡成黑痘而塌復出一層又塌如此者三而卒汪氏子八嵗痘起發時有黑枯者此痘疔也用四聖散胭脂汁調銀針撥開瘡頭塗之即轉紅活亦不蔓延數日後應收不收問之不便七日矣知其傷內燥結取豬肉爛煮和汁與食腸潤便通旋收靨鄭氏子症同以前法治之而愈此病皮肉不活根腳不腫者死若起發有水頂平而黑內服涼血解毒加燒人矢外用胭脂塗法若便祕得之裡熱內服四物三黃湯外用膽導法若泄㵼此虛寒也用保元湯加木香桂如盡乾枯煩燥悶亂者不治痘水泡附膿泡萬密齋治李氏子一嵗出痘起發時都似水痘曰痘乃胎毒五臟各具一症肝為水泡肺為膿泡心為斑脾為疹腎為黑陷此乃肝臟之症喜皮肉厚堅而色蒼臘若皮薄色嬌不可治也乃以四君子湯加黃茋防風牛蒡母子同服十三日安梁大尹公子出痘起發時多成膿泡曰此險症也治晚矣越二日癢作而殞鄭氏子九嵗出痘起發時額上兩頰皆成膿泡曰逆痘不可治也痘症自有次序初出一點血化為水水化為膿膿成而毒解矣如苖而秀秀而實今方苖而秀恐早發還先萎也七日後更論未及期大癢而死痘夾斑痘一兒發斑身熱口燥舌乾化斑湯及小柴胡湯加黃連而愈一兒發斑嘔吐利下目赤口瘡黃連橘皮湯治愈一兒發斑狂煩面赤咽痛梔子仁湯治愈一痘後發斑紫色身熱便祕過於溫補也四順清涼飲及解毒化斑之劑而愈一夏月發斑咽痛升麻葛根元參甘草桔梗牛蒡子治愈一發斑因於胎毒治以犀角地黃湯砭去惡血而愈有用犀角大青犀角解毒湯一發斑紫色煩燥便祕溺赤此毒盛也用黑收丸而愈一發斑赤色腹脹便祕此內傷也調胃承氣湯下之反肢厥脈沉附子理中湯六君子湯治愈一夏月發斑由於暑毒用化斑湯合香薷飲而愈一夏月發斑勢盛狂煩此瘟毒也用五瘟丹黃連陳皮湯治之而愈一發斑身熱頭疼咳嗽由於風熱芎蘇散葛根湯愈一症出津如錦紋而間有顆粒色赤壯熱煩燥舌胎便祕此斑疹並出調胃承氣湯又用白虎湯合葛根湯而愈萬密齋治羅氏婦年二十七出痘遍身紅斑如蚊迹咸謂不治視其神識精明語言清亮診其六脈調勻問其飲食如常大小便調不煩不渴但遍身紅斑稠密無縫色且艷曰此夾斑痘也解去其斑則痘自見以荆防敗毒散加元參升麻作大劑一服次早斑退痘顯再一服痘起發調理半月而愈本邑各衙出痘先二衙一子一女長子後發熱見紅斑疑是夾斑症三四日後其斑盡收熱退身涼痘不出又四衙家出痘一子發熱亦出紅斑亦亡恙乃信人言有不出痘者或發斑或發疹或發水痘皆可折過也必在正出痘時方論以上皆徐仲光所治而言之者痘夾疹一疹後報痘不易長大乾咳連聲不續此過於發散也保元湯加貝味甘桔橘紅而愈一疹後出痘失於解散咽喉腫痛聲啞水嗆飲食不進倒靨而死一疹後痘出三日痰咳喘急亦失於解散甘桔蒡蒿陳枳殼蟬蛻蘇子疏邪解毒清金而愈一兒身熱咳嗽疹出隱隱以藥發之而不見不沒此風寒鬱而不散此癮疹也非正疹論芎蘇散治愈一兒痘出數顆而夾疹遍身圓朗紅活兩日盡沒有識者曰痘沒者必悶亂煩躁此却安靜且正痘宛在乃疹沒非痘伏也以劑調之而愈一痘報點粗肥有紅盤間有細密隱隱者此水痘夾疹也內症安寧但表邪宜散葛根湯加荆防翹芷二劑而愈一水痘不膿而乾枯身熱煩躁此失解同於倒陷也治以葛根湯加荆芥防風連翹牛蒡子木通蟬蛻遍身發紅點此餘毒散也又用荆防解毒湯而愈萬密齋治一女二嵗出痘遍身紅點大小相雜無空處此夾疹夾斑痘也以升麻葛根湯加荆防元參翹蒡淡竹葉木通一服減再服再減三服痘顯而愈痘夾丹徐仲光治一痘勻朗而甚肥大淡白少神煩躁不寧因頭上素患肥瘡太甚耗泄真氣故也先用白芨膏紙封頭瘡後用保元湯而愈一痘正面勻朗綻突少神身肢平塌色時因手足膿疥腫痛泄氣故也恐漿雖滿不能收功用保元湯加芎蒡茋芍歸甘陳防桂术調理而愈此症雖補而不保脾則必致泄瀉而不能收功一痘靨後手搯瘙癢遂發血風瘡用苦參梔翹防風獨活苡仁黃芩蜜丸服并灸風池三里二穴各五七壯愈一痘出膿疥後見其疤痕黑大有似痘疔須審頭面痘顆明初起疏散涼血七八日後根窠紅黑不消亦宜涼血解毒十一二日根窠淡紅宜生血補劑愈一兒痘三日耳前紅腫如桃用葛根湯加荆芥防風桔梗牛蒡而愈一痘勻朗紅潤左腮腫塊青紫熱甚煩躁此痘先塊後名鬼揑真惡候也急與紫金救焚散而愈此症若治遲必毒攻於心發驚竄而死痘失血徐仲光治一痘發熱時衄血宜發之升麻葛根湯加荆蒡而愈一痘四朝吐血痘陷淡白煩躁譫語妄言肢冷身涼此本血熱毒壅未盡即服涼藥攻伐之故今血脫毒解而虛矣宜先益氣保元湯加薑附芎歸蟬芍糯米而愈一痘正起發而便血怠惰減食作渴肢冷此皆脾虛也四君子湯加升橘炮薑而愈一痘八日根窠赤腫脹滿痛煩渴飲冷便下黑血此熱毒內藴也犀角地黃治愈一痘收靨便下紫血此脾弱而熱傷陰絡也歸芍六君子湯加炒黑荆芎又獨參湯治愈一痘收靨身熱咳嗽血痰聲啞鼻衄此火刑肺金黃連解毒湯加麥冬犀角丹皮知母牛蒡而愈一痘靨後咳血不已此毒鬱於肺清金開鬱解毒而愈一痘靨後便下紫血此毒鬱滯下鬱金五錢牛蒡一錢每服五分燈心湯下一痘後溏泄屎後下血此脾弱也小異功散加升麻地榆黃連小柴胡湯而愈一痘後血淋乃熱結丁焦也柏知通地小薊根藕節歸滑甘草稍竹葉服愈一女六嵗標點吐紫黑血甚多然而唇舌滋潤形色俱順神寧氣旺竟無恙因女之父素有血症乃遺稟非毒也故不解毒不補脾而收全症雖險而症與神自順也未可以見點吐血紫黑為死也萬密齋曰里中林霄年二十餘染痘初發熱小便血豫聞之曰不可為矣或問故曰乙未春祁水桃村坳徐氏出痘死者十八人皆小便血也霄越三月殞痘傷食萬密齋治李氏女痘膿成將靨忽腹脹且痛氣喘呻吟曰瘡既胖壯膿又飽滿其脈弦滑此非痘毒乃傷食也詢之因食雞肉糯米飯曰宜急下之或謂痘瘡首尾不可下恐虛其裡不靨也曰病不執方藥貴對症有是病則有是藥下之無妨遂以原物作湯吞丁香脾積丸得利而安金氏子痘成膿時忽腹脹作痛氣喘煩悶其痘光壯飽滿非毒也必曽傷食果因麵食過飽亦用前方法得利病稍定再用錢氏異功散加青皮山查一服愈費建中治嚴孝亷子六嵗丙戌仲夏見痘乾紅色滯頂陷不鬆身熱如烙煩躁不寧按其腹膈愁痛口噯腐氣此毒火內伏中宫停滯也以大黃二錢青皮錢許蟬退荆芥赤芍紅花地丁用山查一兩煎湯代水連二劑下宿物甚多痘頓起色焮赤前方加黃連生地漸放白成漿第熱未和前方服至十二朝始收效費見中子二嵗孟夏見痘壯熱昏迷乾紅稠密然得分珠亦不腳塌至三日絶無起勢氣粗煩悶轉矢氣極臭因痘前食一苧頭圓子重以枳實山查桔梗前胡廣皮麥芽赤芍蟬退牛蒡去結屎甚多即起發紅潤後雖甚密幸獲收功施氏子痘始事者極其升發四日不起狂煩叫喊至啞目時上竄視其根窠尚在但稠密礬紅頂陷乾滯身反涼按其胸膈手足皆起診其右手寸關洪滑而實此內積重而閉塞也以枳實五錢青皮前胡各三錢桔梗五分佐以荆芥蟬退用山查二兩煎湯代水連夜進兩頭汁次午又進一劑下午去宿垢極多猶有雞肉未化者將晚又行一次仍多即頓然起發神安身大熱色未轉以得通達火毒發見於外也改用涼血清解色漸紅活漿漸肥膿而收效續名醫類案卷三十八
