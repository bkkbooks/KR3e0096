body:
  text: 續名醫類案卷二十一錢塘魏之琇撰痰洞虛子曰痰之為病成偏頭風成雷頭風成太陽頭痛眩暈如坐舟車精神恍惚或口眼瞤動或眉稜耳輪俱癢或頷腮四肢遊風腫硬似疼非疼或渾身燥癢搔之則隂疹隨生皮毛烘熱色如錦斑或齒頰似癢似痛而疼無定所滿口牙浮痛癢不一或噯氣吞酸鼻聞焦臭喉間豆腥氣心煩鼻塞咽嗌不利咯之不出咽之不下或因噴嚏而出或因舉動而吐其痰如墨又如破絮或如桃膠或如蜆肉或心下如停冰鐵閉滯妨悶噯嚏連聲狀如隔氣或寢夢刑戮刀兵劍戟或夢入人家四壁圍繞暫得一竇百計得出則不知何所或夢在燒人地上四面煙火枯骨焦氣撲鼻無路可出或因觸發忿怒悲啼兩淚而寤或時郊行忽見天邉兩月交輝或見金光數道回頭無有或足膝痠軟或骨節腰腎疼痛呼吸難任或四肢肌骨間痛如擊戮乍起乍止並無常所或不時手臂麻疼狀如風濕或卧如芒刺小安或如毛蟲所螫或四肢不舉或手足重滯或眼如薑蜇膠粘癢澀開闔甚難或隂晴交變之時胸痞氣結閉而不發則齒癢咽痛口糜舌爛及其奮然而發則噴嚏連聲初則涕唾稠粘次則清水如注或眼前黑暗腦後風聲耳內蟬鳴眼瞤肉惕治之者或曰腠理不密風府受邪或曰上盛下虛或曰虛或曰寒或曰發邪惟洞虛子備此疾苦乃能治療病勢之來則胸腹間如有二氣交紐噎塞煩鬱有如煙火上沖頭面烘熱眼花耳鳴痰涎涕淚並從肺胃間涌起凛然毛竪噴嚏千百然後遍身煩躁則去衣凍體稍止片時或春秋乍涼之時多加衣衾亦得暫緩或頓飲氷水而定或痛飲一醉而寧終不能逐去病根乃得神祕沉香丸屢獲大效愈人數萬但不欲輕傳匪人故以隱括之詩曰甑裏翻缺甲帶金于今頭戴草堂深相逢二八求斤正硝煅青礞倍若沉十七兩中沉半兩水丸梧子意須斟驅除怪病安心志水㵼雙身却不任大黃蒸八兩黃芩八兩青礞石一兩硝煨如金色沉香半兩孫兆治綵帛鋪劉員外患傷寒六七日晝夜不得眠方眠即起方起即倒未嘗少息看得厭倦召孫孫曰若言是氣必作今無此症非氣也時復身上冷出汗尺寸脈皆沉關中亦沈重診之鼓擊于指上此痰積寒聚于胸中也遂用陳皮半夏乾薑三物各一兩為飲薑半兩槌碎以水兩碗煎七分去渣分二服服藥經時遂睡經一晝夜不蘇既覺下痰一塊如雞子大其病遂愈凡痰皆有冷汗其症明矣張子和治一婦人心臍上結硬如斗按之如石人皆作病胎針灸毒藥禱祈無數如捕風然一日張見之曰此寒痰診其兩手寸關皆沉非寒痰而何以瓜蒂散吐之連吐六七升其塊立消過半俟數日後再吐之其涎沫類雞黃腥臭特殊約二三升凡如此者三後以人參調中湯五苓散調服已平矣朱丹溪治白雲許先生始因飲食作痰成脾疼後纍因觸冒風雪腿骨作疼衆皆以脾疼骨疼以為寒雜進黃牙等藥雜治十餘年間艾灸數萬計或似有效及至病再作反覺加重至五十一嵗時又冒雪乘船而病愈加至坐則不能起扶起亦不能行兩胯骨不能開合若脾疼作時則兩胯骨痛處似覺稍輕若飲食甘美脾疼不作則胯骨重疼增諸老袖手計無所出朱謂此初因中腕有食積痰雜以胃寒濕抑遏經絡血氣津液不行痰飲注入骨節往來如潮其涌而上則為脾疼降而下則為胯痛非涌泄之法不足以治之時七月二十四日遂以甘遂末一錢入豬腰子內煨以食之連㵼七行至次日兩足便能行步至八月初三日嘔吐大作不能起牀顆粒不食但時煩燥氣弱不能言語諸老皆歸罪于七月之㵼而又知纍年之熱補悮皆不敢用藥朱嘗記金匱云病人無寒熱而短氣不足以息者此實也其病多年鬱結一旦以刀圭之劑泄之徒動猖狂之勢他未有制御之藥所以如此仍以吐劑達其上焦以次第治及其中下二焦於初三日用瓜蒂吐不透初六日用梔子又吐不透初九日用附子尖三枚和漿水與之始得大吐其嘔噦終止前後所吐共得膏痰沫液一大水桶初十日遂以朴硝滑石黃芩石膏連翹等涼藥㕮咀一斤蒸煎濃汁放井水中極冷飲之十一日十二日十三日十四日每日食上件藥一斤十五日腹微滿大小便皆祕悶朱欲用大承氣湯下之諸老皆以為不可十六日六脈皆歇至朱診其脈獨歇至卯酉二時其餘時刻平勻如舊朱曰卯酉為手足隂陽之應此大腸與胃有積滯不行所致當速㵼之爭論不已至十八日遂作紫雪半斤十九日早紫雪成每用一匙頭以新汲井水化下至二十日天未明已服紫雪五兩神思少安腹滿亦減遂收起紫雪不與二十一日大為小便閉作痛所苦遂飲以蘿蔔汁半茶鍾隨手痛止小便立通二十二日小腹滿痛不可捫摸神思不佳遂以大黃牽牛作丸服至三百丸至二十三日巳時小大便併通如爛魚腸三碗許臭惡可畏是日神思少安診其脈不歇至矣二十四日腹大絞痛殆不能勝者約一時許腰胯沉重且墜兩時不出聲不能言㵼下穢物如桕油條者一尺餘腹中如燒片時方定至二十五日神思漸安夜間得睡二十六日漸出聲言語自初二日至此並顆粒不曽入口語言並不出聲至二十七日方啜半盞稀粥者四次似有生意至次月初四日方平安其脈自嘔吐至病安日皆平常弦大之脈唯有中間數日歇至少異耳至次年四月復行倒倉法方步履如初徐東臯治匡掌科夫人三十餘病胃腕連胸脅痛日輕夜重兩寸關脈弦滑有力諸醫積滯凝寒用發散及攻下藥繼用鐵刷散四磨飲等方俱不效後用湯水皆吐而不納經月不食痛且日甚徐謂其為痰鬱明矣但痛久弱甚不敢行吐法奈何偶一醫謂五靈脂末藥素用有效衆皆哂之曰此藥用之多矣徐謂再用亦無妨何哂之有俾用酒調病者到口便吐隨吐緑痰兩碗許痛即止遂納飲食此蓋痰在膈上攻下之亦不去必得吐法而後愈經曰有故無殞此之謂歟全書孟望湖淮安人耳中聞人聲悉是祖考談其家事擾擾不休邀劉春齋醫治診之曰暴病之謂火怪病之謂痰用滾痰丸下之而痊續金陵瑣事一男子吐痰胸膈不利飲食少思服海石瓜蔞之類不應曰此脾氣虛弱不能消導而為痰當健脾為主彼不信又服驅逐之劑其痰如涌四肢浮腫小腹腫脹小便澀滯曰此復損脾腎所致也先用金匱加減腎氣丸補中益氣湯治之諸症漸減又用八味丸兼前湯而愈一男子素吐痰遇怒其痰益甚胸膈痞滿此肝木制脾土也用六君子湯加木香治之而愈一婦人吐痰頭暈𢃄下青黃用四七湯送白丸子小柴胡加白术茯苓治之而安舊僚錢可久素善飲面赤痰盛大便不實薛以為胃痰壅滯用二陳芩連山梔枳實乾薑澤㵼升麻一劑吐痰甚多大便始實此後日以黃連三錢泡湯飲之而安一婦咳嗽其痰上壅日去五六碗作氣虛水泛為痰用六味丸料及四君子各一劑而愈陳三農治一人痰出盈盆不止脈豁大無力此內傷不足之症用人參附子各五錢乾薑蓽橃檳榔枳殼一劑而愈一人滿口痰珠至舌尖則成大泡綿綿不絶此火熱在胃大寒在肺也用參附湯保定肺氣後以砂仁益元散㵼胃火而安一人痰涎壅盛汗出不止此脾虛不能攝痰而肺失所養切不可作痰治只補脾胃為主用參术煨薑各二錢半夏一錢煎服愈陸養愚治董潯陽夫人稟氣怯弱性情沉鬱年三十餘得一病晚間發熱天明始止飲食漸減煩躁不安初服補血養隂年餘轉羸瘦又服參芪補氣不效醫謂脈已歇至恐不能久診之右手果然左手但微弱而數詢其月事則先期而少曰先期是血熱應左脈之數少是血虛應左脈之微脈症相應右手歇至此必鬱痰伏在氣分故脈結不至非死脈也第發熱必有所起之處令詢之則曰右脅一團熱起漸延遍身再問熱起處必成形者按之果有柔塊如碗狀曰不足憂也攻去其塊諸症自愈矣為製一方香附一斤醋製與巴豆一兩同炒至巴豆黑色去之醋打麵糊為丸梧子大米飲下五十丸日三服又用四物湯加山梔貝母豆仁木香薑棗煎日一帖半月塊消肌肉漸長一月精神爽健矣陸肖愚治李安吾正室不育及納妾則俱孕生子出痘正者死而妾者生悲愁彌月遂胸脅脹痛每卧必令人背上捶之良久方得就枕片時卧不能仰仰則氣涌而喘食減肌消月事數月不行脈之寸沈而數關沈而滑尺沈而弱脈與病應此鬱火成痰之症也用調理養榮湯加白芥子倍霞天麯數劑胸脅少寬可仰卧矣第大便五日不行小腹脹急與滾痰丸二錢又慮元氣不足改用補氣養榮湯二劑大便去燥矢數枚後出皆痰積脹痛減後與補藥間服月餘而安吳遜齋體肥素有酒積胃脘作疼近又肢節痛而下體更甚或以為風用史國公藥酒療之時作時止改用虎潛河車等丸則痛處且腫脈之六部皆緩滑而關稍𢃄弦此濕痰流注關節而痛非風亦非虛也治法宜先用丸劑清中宫之積痰繼用煎劑疏筋絡之壅滯則肢節之痛除而胃脘之疼亦愈矣依法服之果然丸方霞天麯山查橘紅白术茯苓枳實神麯竹瀝打糊為丸食遠白湯送下煎方蒼术苡仁半夏南星白芥子葳靈仙秦艽炙甘草青木香煎成入酒一小杯半飽時服潘元石怒後縱飲遂患吐逆飲食半留半出甚則嘔物如褐色胸脅脹痛徹背或以翻胃治之反潮熱煩躁又以肺癰治之飲食減而嘔脹益甚或見吐出之物謂肺爛矣診之見其肌肉未消聲音不改兩寸滑數左關弦右關滑兩尺平曰此非肺壞也第為鬱怒所致耳怒則血菀于上與痰膠結濁隂不降而䐜脹生焉法當涌之用常山五錢紅花五錢酒一碗煎一碗令通口服之一涌而出初見褐色痰塊後多紫黑約有盆許胸膈頓寬背亦不痛不作嘔矣再以清氣養榮湯調理陸祖愚治沈振宇妾患鬱痰鬱火症醫咸謂不起矣診之形容枯稿咳咯涎沫六脈沈滯隱隱似有似無重按至骨或有力或無根或遲或數已飲食不進似胃氣將絶者但自能起坐聲音響亮知為痰涎壅隔血氣凝塞故脈亦不流通耳用二陳加豆仁蘇子黃連白芥子貝母石菖蒲等味一劑未效再診聞病人喜聞爆竹硝黃之氣遂于前方加薑汁竹瀝每劑入牛黃半分調服症脈漸起再與加減五六日後進蘇合丸一丸能糊粥再與六君子加減調理月餘而安李江州因下第歸飲食不思精神倦困醫謂遠歸久曠投以補劑胸膈痞塞大便艱難不寐又與養血安神煩躁而小腹脹滿診之見其面容昏滯六脈沈滑乃以枳實黃連爪蔞陳皮貝母檳榔元明粉兼服字丸三錢半日未應又以前丸二錢催之良久腹中鳴轉下矢氣去稠粘臭穢五色錯雜約半桶頓快繼以前湯丸少少與之兩三日間糞微黃改用參术歸芍健脾養血調理而安費表嫂患脅之下臍之上溫溫作痛可揉可按凡溫中消導清火歷試不效診之六脈沈弦而滑以痰治之數劑而痛止精神未復而勞于女工且患血崩食入不化遷延數日胸腹脹滿其熱如火湯藥雜投致呻吟不絶人事不省脈之寸關沈伏不見而尺尚沈滑有神曰此沈痰之為祟也元氣雖弱痰結不得不通用滾痰丸徐徐投之至半夜胸前隱隱有聲五更下稠痰盆許神氣頓蘇胸膈少利再以養榮合二陳調理半月而愈張宇清少時體羸多病專主溫補病愈而火症時發乃滋水制火其疾如失六味之力也逮壯年肥盛濕痰醖釀于中仍滋隂不徹六旬外痰症陡發復六味加二母歸芍麥冬服後痰涎壅塞四肢厥冷口開眼合人事昏沈診之六脈洪滑而數遂用加味導痰湯繼之蘇合丸兩劑才覺神清問用何藥以前方告乃怒曰我生平最忌燥劑豈可服此今後斷不可用乃郎心知父言之非每日以地黃湯一劑與驗過暗煎導痰之藥以進病愈後洞悉前情不勝歉仄孫文垣治李古愚每食後即大便腹皮稍脹急胸膈飽悶服參术則痞悶愈甚小水清長脈之左寸澀右寸滑按之如黃豆大且鼓指關尺皆弦小左尺迢迢有神據按乃積痰鬱于肺莫能出以致大便之氣不固也當效丹溪治乃叔用吐法吐去上焦痰積大便自實矣先用苦梗蘿蔔子各三錢白豆仁橘紅山梔各一錢以川芎五分生薑三片蔥三根水煎服之取吐服半時許吐出清痰惡心未已乃痰積膠固不易出也又蘿蔔一合擂漿水加蜂蜜與半碗飲之始吐膠痰二碗餘平日每小水則大便並行吐後小水始能單去連三四次胸腹寬舒初亦以吐為懼至是豁然稱快大便五日一行再以二陳加白术旋覆花麥芽調理全愈李士材治章給諫暑月心中大痛醫與香薷飲痛轉增而寸口弦急痰食交結也服香砂二陳二帖痛雖略減困苦煩悶更以胃苓湯加半夏二錢大黃三錢下黑矢數枚痛減三四仍以前湯用大黃四錢下膠痰十餘碗始安徐主政勞且怒後神氣昏倦汗出如浴語言錯亂危困之極脈之大而滑且軟此氣虛有痰也用補中益氣湯料併四帖為一劑用參至一兩加熟附子一錢熟半夏三錢四日稍蘇更以六君加薑汁一鍾服數日兼進八味丸兩月而安王郡侯患痰嗽輒服清氣化痰丸漸至氣促不能食李曰髙年脾土不足故有是症若服前丸則脾土益弱矣投以六君子湯加煨薑三錢益智仁一錢五分十劑而痰清更以前方煉蜜為丸約服一斤飲食乃進朱文學遍體如蟲螫口舌糜爛朝起必見二鬼執盤食以獻向李泣曰某年未三十髙堂有垂白之親二鬼旦暮相侵必無生理診其寸脈乍大乍小意其為鬼祟細察兩關弦滑且大遂斷以痰投滾痰丸三錢雖微有所下而病患如舊更以小胃丹二錢與之復下痰積及水十餘碗遍體之痛減半至明早鬼亦不見矣更以人參三錢白术二錢煎湯服小胃丹三錢大㵼十餘行約二十碗許病若失矣乃以六君子為丸服四斤而愈張路玉治一燕人體肥痰盛善肉善飲患痰鳴喘嗽數年食傷恆發發則六脈遲滑時見歇至聲如拽鋸遍地皆痰每嵗或一二發或三五發深秋初冬尤甚遂用倒倉法自言肢體皆輕症遂愈二年後因不禁牛肉復發然其勢較前不過十一是亦不慎口腹所致耳郭邑侯夫人素有敗痰失道左右兩脅俱有結塊大如覆杯發則咳嗽喘逆腹脅掣痛六脈止促按之少力用六君子湯加膽星枳實香附沈香二劑服之大吐稠痰結垢一二升因嘔勢太甚促往診之至則嘔止嗽寧脈息調勻不必更藥矣黃履素曰立齋治痰每言腎虛水泛為痰法當補腎豫壬申秋咳嗽多痰自知因于色遵先生法恪服六味丸更不治痰嗽月餘竟愈時師治痰最忌熟地以為膩膈是烏知箇中妙理哉龔子才治周藩海陽王患痰嗽喘熱左足腫痛日輕夜重每年發一二次已三十年遍治勿效診之左微數右弦數此血虛有濕痰也以四物湯加蒼术黃柏木瓜檳榔木通澤㵼空心服以治下元茯苓補心湯卧時服以治上焦各三服而愈後以神仙飛步丸空心服清氣化痰丸臨卧服各一料全瘳張三錫治一中年婦每夜發熱天明方止症兼惡心不食肢倦且云體素肥今漸消瘦因憶古人有言昔肥而今瘦者痰也痰滯中宫阻礙升降宜乎不食且作惡心痞悶血無所滋因而不足故夜熱乃以二陳治痰參术補中氣枳實麥芽寬中香附炒梔子清火柴胡退熱凡二十劑間服橘半枳术丸一月愈後進人參湯體漸復舊一人素肥盛半年漸瘦兩膝與背互痛內尺沈滑古人有言昔肥而今瘦者痰也遂以加減豁痰湯連進數服一日食後或作惡心乃以瓜蒂散一錢投之吐稠痰半升而愈朱丹溪治一人項強痛不可忍不可以回顧作痰客太陽經之法治之用二陳湯加酒芩羌活紅花服後二日而愈治法彚張路玉治吳别駕夫人患痞眩嘔逆向因下體畏寒肢體麻木久服八味參附不徹六脈弦滑按之則濡此中焦數藴痰濕陽氣不能周于四末之象得桂附辛熱之力有時雖可暫用究非真陽之虛且有地黃之滯所以痞暈漫無止期遂與局方七氣湯加沈香一服豁然再劑神爽食進而安薛立齋治一儒者脾腎素虛而有痰或用導痰之法痰甚作渴頭暈煩熱謂中氣虛弱而變症用補中益氣湯而愈後勞役發熱此氣虛不能上升也用前湯加蔓荆子而愈後又勞神畏見風寒四肢逆冷口沃痰涎此脾氣虛寒真病以六君子加炮薑肉桂而愈一男子素腎氣虛而咳痰亦用導痰之法虛症悉具痰涎之涌小便頻數謂足三隂虛而復損也朝用補養脾氣湯培養脾肺之虛氣夕用六味丸加五味子收斂耗散之精而愈大尹陳克明導痰後痰益多大便不實喜極熱飲食手足逆冷謂命門火衰而脾肺虛寒不能攝涎歸源用八味丸而愈進士張禹功飲食停滯胸滿吐痰或用藥導之痰涎上涌眩暈熱渴大便祕結喜冷飲食手足發熱謂腎水虛弱津液難降敗液為痰用六味丸而愈儒者楊文魁素唾痰諸藥不應服牛黃清心丸吐痰甚多或頭暈或熱從脅起左脈洪大有力右脈浮大而無力薛曰此三隂虧損火不能歸源用補中益氣加麥冬五味及加減八味丸補其化源而愈秋官張碧崖面赤作渴痰甚頭暈此腎虛水泛為痰用地黃丸而愈儀制賀朝卿吞酸胸滿痰盛作㵼飲食少思用清氣化痰等藥前症益甚兩膝漸腫寒熱往來謂脾胃虛濕熱下注用補中益氣倍參术加茯苓半夏炮薑而愈考功楊朴菴嘔吐痰涎胸腹脹腫飲食少思左關脈弦長按之微弱此木尅土用六君子加柴胡山梔木香而愈二守陳子忠飲食少思吐痰口乾常服二陳枳實黃連之類脾胃受傷乃問于薛薛述東垣先生云脾胃之症實則枳實黃連㵼之虛則白术陳皮補之彼遂以二味等分為丸常服由是多食而不傷過時而不飢趙以德云豫近治一男子肩井後腫痛身熱且嗽其腫按之不堅此乃酒痰流結者遂用南星半夏瓜蔞葛根芩連竹瀝作煎飲燒蔥根熁腫處另用芥子白礬作小丸就煎藥吞二十丸須臾痰隨嗽出半日約去三四碗病即愈同上羅成之既得丹溪之學歸隱崇明三沙張太尉士誠患痰氣怔忡諸名醫治療不效迎成之診之主以倒倉法張卒用其方諸病悉除賜勞甚厚醫史同上陸祖愚治孫景陽室年近五旬向患痰火發則頭空眩暈飲食減少旋發旋愈蓋有年矣近發轉甚將及月餘診之六脈洪滑而數按之有力肢冷面赤肌肉黃瘦不時眩暈甚則昏不知人水穀不進其症似不可攻然其脈來有神當棄症慿脈乃用枳實瓜蔞膽星貝母芩連橘紅牙皂入薑汁竹瀝服之吐痰數碗四肢漸溫再用川牛黃五分配以蠟丸頓服三丸徐徐頻飲竹瀝催之腹鳴響後服潤字丸三錢便垢穢若干病頓減後以清火消痰健脾養血調而安吳淑止室軀體壯盛自來有痰初出口時稀白澄清唾地良久反極稠膩遇勞即暈眩昏冒近則兩三日一發始則叫號既而昏憒角弓反張食頃乃蘇四肢厥冷胸腹滿硬六脈如絲細而且澀以為寒痰凝滯中焦用二陳導痰湯半夏與四五錢服後一夜不安痰壅愈甚口舌燥渴因想脈症不同此當棄脈從症改用貝母芩連桔梗花粉前胡膽星瓜蔞竹瀝薑汁煎湯吞潤字丸五分數服後胸膈柔軟昏暈已除大便數日不行用滾痰丸三錢不應又以潤字丸三四錢催之始得更衣症減半兩旬後遂晡熱脣紅面赤乾咳無痰胸膈不暢竟似弱症乃清晨服丸藥生地麥冬銀柴胡黃連知母鱉甲秋石歸芍杜仲食後服煎藥貝母黃連查橘枳术前胡花粉豆仁如是出入增損養血順氣清火消痰兩月全愈薛立齋治一男子素厚味胸滿痰盛此膏粱之人內多積熱與法製清氣化痰丸而愈彼為有驗修合餽送脾胃虛者無不受害一婦人元氣素弱痰氣時作或咽間不利或胸痞等症以為鬱結傷脾加味歸脾湯治之而愈後遇恚怒前症仍作惑于衆言以為痰飲妄用祛痰之劑吐㵼數次變諸異症口噤不省以為脾胃復傷日用六君子一劑米飲濃煎常服匙許至四日漸進粥食乃服前藥間以歸脾喜其胃調養兩月餘諸症悉愈傅青主治一老人患痰涌喉間氣不得出入其間具棺待殮先生診之曰不死令搗蒜汁灌之吐痰數升而蘇劉紹攽九疇古文王肯堂曰余初喜唾痰愈唾愈多已而戒之喉間梗梗不可耐輒呷白礬湯數口咯入口中用舌攪研令碎因而潄之百餘津液滿口即從鼻中吸氣咽下以意送至丹田默存少頃咽間清泰如未清再漱再咽以化盡為度方咯出時其味甚鹹漱久則甘世人乃謂瘀濁之物無澄而復清之理何其謬哉吾嘗渡河見舟人掬濁流而入之甕糝入礬末數分即時澄清此可悟治痰之法也丹陽賀魯菴年七十餘膈間有不快飲食少思初無大害就醫京口投以越鞠丸清氣化痰丸胸次少寬日日吞之遂不輟口年餘困頓不堪僦舟來訪問脈于王則大肉已脫兩手脈如遊絲太溪絶不至矣見王有難色因曰吾亦自問必死但膈滿太甚大便祕結不通殊以為苦但得少寬即瞑目無憾也因強王疏方以至親難辭教用人參白术之類大劑進之少頃如厠下積痰升許胸膈少寬更數日而歿蓋二丸乃時師常用之物本欲舒鬱適增其痞本欲清痰適速其斃豈可悖哉薛立齋治一人胃弱痰盛口舌生瘡彼食滾痰丸愈盛反㵼不止惡食倦怠此胃氣被傷也以香砂六君子湯數劑少可再以補中益氣湯加茯苓半夏二十餘劑而愈夫胃氣不足飲食不化亦能為痰補中益氣乃治痰之法也苟虛症而用峻利之劑鮮不危矣施浩然治莫進士公謨患痰嗽日吐痰數盂形體瘦削僉曰火症純用柔劑診之曰此肝木乘脾也脈浮而關弦面黃而鼻青補之則瘳㵼之則劇用六君子加炒芍薑汁製連二劑不信仍用山梔黃柏之類更教以神首佐饔飱施曰三日後大㵼絶粒奈何經云隂劑柔勝積凝氷為洞泄寒中之屬則真火微而衛散至三日果大㵼脈脫鼻息如氷口不能言彼醫曰脈脫矣大勢其在今日乎急投附子或可救也曰無庸昨梔柏而今烏附何氷炭反掌郎寒涼過劑脾氣大傷食復滯之按之則楚先取山查作液少服旋進獨參湯病雖劇無慮也用異功散出入調理而痊沈明生治玉峰李嘏侯苦志士也病萌于己亥夏風鶴之驚至九月間夜讀忽覺神思昏沈中心若墜嗣後怔忡不已一友見其素稟清弱勤于鉛槧虛症昭然勸令服參越兩月困怠轉加眩暈特甚則以為參少力薄故益至五錢一劑約三四兩後見病日深輟參勿服歷叩醫或以為隂火亢盛當成勞瘵者或謂其冬得春脈當春不能再見者或斷之終至癲癎者醫更藥雜嵗將暮延診曰從前所議皆不悮也所以不即愈者未治痰也今當專事豁痰徐議其虛可耳遂用二陳湯加鈎藤菖蒲等味漸進煎劑書一案云思慮傷神痰乘包絡以致虛靈之宰不獲自持時覺心繞千絲時覺腹空無物獨處則萬慮紛紜臨事則五色眩瞀痰上逆也痰為火擾夜卧難寧痰助陽明多食不飽流于精道則夢失見之脈候則滑弦治宜先標後本驅其壅閉俾神明之官仍安厥位繼以補血養心庶滋潤之品不致泥隔而餘疴不治自瘳矣歸致寧神至寶丹一料送服入春全愈錢國賔治無錫劉元女咳嗽吐痰氣短經閉骨瘦如柴但不夜熱以新壻不相顧病益劇劉延診以決死生六脈結滯或五七至中一止十餘至中一止兩關更實凡勞症脈當芤細弦牢短促今見痰脈非勞脈也以導痰湯枳實半夏膽星蒼术茯苓陳皮白芥子各一錢甘草三分加熟大黃二錢二三帖下痰少許身體困極以參湯調理漸安令服八珍湯而别劉雲密曰愚于戊戌嵗冬深終之氣主氣寒水既與司天相合而客氣濕土又與在泉相合更加于主氣寒水之上其病于陽氣甚矣氣乃肺主之故肺易受寒邪既病于主氣之肺則陽氣益不得施化而水中之陽化更微致濕淫滋患故濕痰生聚于胃而不行是濕痰愈覆其陽則肺之鬱熱遂口舌為燥而肺所治之上焦亦俱不爽且移于所合之大腸而化風矣治之者宜麻黃杏仁輩以散寒炒乾薑製白术以除濕第所鬱之熱驟以薑术投之適益其勢耳乃散寒以麻杏而除濕暫用二陳加南星乃入蛤粉于中以歸隂僭而散陽鬱其痰漸化而熱亦行徐以乾薑白术枳實輩理中乃得全愈飲孫兆治俞伯道忽患微熱心下滿頭有汗不能解衆醫以為濕病用表藥有謂食在膈者治之皆不效召孫至曰用半夏茯苓湯遂瘥衆問故曰頭有汗心下滿非濕症乃水結胸膈也水既去其病乃愈且如濕氣心下滿自當遍身汗若有食心滿頭豈得有汗若言是表心又不疼不惡寒表症何在故凡水結胸脅頭必有汗耳張子和曰有一婦人年三十餘病滑泄經年皆云虛中有積以無憂散五七日一服至二十服不效又服纒積丹軟金丸諸藥皆不效其人服藥愈速病勢愈甚飲食日減人或謂曰此休息痢也宜灸中腕及左右穴臍下氣海及膀胱穴以三里引之每年當冬至日夏至日灸之前後計萬餘壯忽門外或者曰此病我屢識蓋傷飲之故即日桃花正開俟其落時以長棘針刺之得數十萼勿犯人手以白麵和作餅子文武火燒令熟嚼爛以米引湯下之病人如言服之不一二時㵼如傾前後六七日計數百行昏困無所知覺惟索冷水徐徐而飲至六七日少省爾後食日進神日昌氣血日和不數年生二子子和治郭敬之留飲四日浮腫不能食腳腫連腎囊痛先以苦劑涌之後以舟車丸濬川散㵼之病去如拾遺又一田嫂姓楊其病嘔酸水十餘年本留飲諸醫皆以燥劑燥之中腕臍胻以火艾燔針刺之瘡未嘗合張以苦劑越之其涎如膠乃出二三升談笑而愈李七老病涌水症面黃而喘兩足皆腫按之陷而復起行則濯濯有聲常欲飲水不能睡卧張令上涌去痰而汗之次以舟車丸濬川散下之以益腎散復下之以分隂陽利水道之劑下之水盡瘥一婦從少年時因大哭罷飲氷水困卧水停心下漸發痛悶咸以為冷積治以溫熱劑及禁食冷物一聞氣輒內作如此數年燎灸燒艾瘡孔數千十餘年後小便赤黃大便祕悶兩目加昏積水轉甚流于兩脅世謂水癖或謂支飲􅗠漆稜茂攻磨之藥竟施之矣食日衰積日茂上至鳩尾旁至兩脅及臍下但發之時按之如水聲心腹結硬手不可近者月發五次甚則欲死已二十餘年張診其脈寸口獨沈而遲此胸中有痰先以瓜蒂散涌痰五七升不數日再越痰水及斗數日上涌數升凡三涌三下汗如水者亦三其積皆去以流濕飲調之月餘大瘥中丞常子正苦痰飲每食飽或隂晴節變率同十日一發頭痛背寒嘔吐酸汁即數日伏枕不食服藥罔效宣和初為順昌司録于太守蔡達道席上得吳仙丹方服之遂不再作每遇飲食過多腹滿服五七十丸便已少頃小便作茱萸氣酒飲皆隨小水而去前後痰藥甚衆無及此者用吳茱萸湯泡七次茯苓等分為末煉蜜丸梧子大每熟水下五十丸朱氏集驗方本草綱目陸養愚治施南石二十九嵗患晡熱至天明方解夜熱尤甚咳嗽無痰咳則痛引胸脅熱甚則咳亦甚咳甚則痛亦甚初服芎蘇散喘急殊甚易以前胡杏仁桑皮蘇子輩亦不效後以隂虛治之二冬二母服數月飲食漸減肌肉羸瘦咸謂勞療已成不可療矣最後一醫診得脈弦數左關尤甚此肝火也用柴胡青皮黃連赤芍山梔白芥子數劑亦無驗于是苦于藥餌不延醫已二月診之六脈沉數而滑右關尺更有力其脅痛若從右而應乎左因思仲景云飲在脅下咳則引痛謂之懸飲今咳則痛明是其症第十棗湯非常用之方且病人狼狽已極亦必不肯服乃以潤字丸料加入甘遂和丸令一二分一服日二服每日加一分加至五分一服便出稠痰碗許中有一塊半軟半硬如雞子大脅痛如失熱嗽減十之六七又用人參白术歸芍茯苓貝母甘草作煎劑與丸藥間服丸藥仍日減一分直待便中無痰始止丸藥用前煎劑日一帖調月餘全安陳三農治一婦患眩暈腰痛過寅卯二時則日夜昏迷不省人事身如浮雲中脈細數弦滑細為濕數為熱弦為飲濕熱痰飲留滯胸膈隨氣升降上涌則為眩暈下墜則腰痛沃心包致竅不通故昏不省人事至己午時心火助其濕熱鼓擊痰涎故昏癡益甚也此必痛飲所致叩之果然遂以稀涎散涌酸臭痰數升仍以舟車丸泄如屋漏水者五六次諸症頓愈繼以解醒湯數服而愈一貴婦患溢飲遍身虛腫用金沸草散一劑汗出腫減繼以澤㵼湯加枳實旋覆花前胡四劑安一婦時疫飲水過多胸膈堅痞咳逆倚息短氣不卧湯飲入而吐出諸藥罔效作停飲治以五苓散一劑愈一婦患霍亂飲隂陽水左腹堅硬痛極作留飲治以半夏旋覆花各三錢澤㵼枳實青皮白术乾薑各一錢吳茱萸二分一劑愈李士材治秦景明素有痰飲每嵗必四五發發即嘔吐不能食此病久結成窠囊非大涌之弗愈也須先進補中益氣十日後以瓜蒂散頻投涌如赤豆沙者數升已而復得水晶色者升許如是者七補之七涌之百日而窠囊始盡專服六君子八味丸經年不輟吳乎先治西商王某氣體甚厚病留飲得利反快心下續堅滿鼻色鮮明脈沈此留飲欲去而不能盡去也用甘遂甘草半夏白芍加白蜜五匙頓服前症悉痊或問甘遂與甘草其性相反用之無害而反奏效何也曰正取其性之相反使自相攻擊以成疏瀹決排之功西人賦性厚尤當用此張景嶽尊人早年善飲後及四旬遂得痰飲之疾嘔酸脹滿飲食日減眩暈不支驚惕恍惚痰瘧等症相繼迭出百方治痰無效因慕張子和吐法之妙遵而用之初用獨聖散茶調散及虀汁之類一吐稍效再吐再效自此屢用不止雖諸症漸退而元氣勿復也如此年餘漸覺純熟忽悟其理遂全不用藥但于五鼓睡醒時仰卧用噯提氣氣有不充則咽氣為噯隨咽隨提痰涎必隨氣至雖最深之痰無不可取其最後出者形色臭味紫氣酸惡不堪言狀每吐後或至唇咽腫痛但以涼水一二口漱咽解之吐畢早膳悉屏五味用薄粥一二碗以養胃氣自四旬後絶不用酒行吐法四十餘年自六旬外則一月或半月必行一次凡吐後神氣必倍王陽道必勃然一切內傷外感無不盡却蓋道家用督此則用任所用不同所歸一也不惟却病而且延年後至八旬外猶能登山及燈下抄録古書無病而卒張三錫治一人肩背與膝相引而痛寸脈弦知痰飲為患也投小胃丹一服吐痰半升間日再進一服㵼痰水有如膠者一升許病良已張子和治一人病留飲者數十年不愈診之左手脈三部皆微而小右手脈三部皆滑而大微小為寒滑大為燥以瓜蒂散涌其寒痰數升汗出如沃次以導水禹功去腸中燥垢亦數升其人半愈然後以痰劑流其餘藴以降火之劑開其胃口不踰月而痊朱丹溪治一人素耽于酒患遍身關節腫痛此愈彼劇胸膈不寬此酒濕痰飲在胃流主經絡即流飲症也用二陳湯加酒芩蒼术羌活威靈仙澤㵼倍葛根而愈許叔微自患飲澼三十年始因少年夜坐寫文左向伏几是以飲食多墜左邉中夜必飲酒數杯又向左卧壯時不覺三五年後覺酒從左下有聲脅痛食減嘈雜飲酒半盞即止十數日必嘔酸水數升暑月止右邉有汗左邉絶無遍訪名醫及海上方間或中病止得月餘復作其補如天雄附子礬石利如牽牛甘遂大戟備嘗之矣自揣必有澼囊如水之有科臼不盈科不行但清者可行而濁者停滯無路以決之故積至五七日必嘔而去脾土惡濕而水則流濕莫若燥脾以去濕崇土以填科臼乃製蒼术丸服三月而疾除蒼术一斤去皮切末之用白芝麻半兩水盞研濾取汁大棗十五枚爛煮去皮核以麻汁勻研成稀膏搜和入臼熟杵丸如桐子大乾之每日空腹溫湯吞下五十丸加至百丸忌桃李雀鴿初服時必膈微燥且以茅术制之覺燥甚再進山梔散一服久之不燥也山梔散用山梔一味乾之為末沸湯點服馬元儀治沈表姪因悲哀勞役面色枯白形體憔悴右脅有塊凝結作痛痛甚則嘔手足厥逆飲食不思大便時溏時結吐出痰飲動輒盈盆或一日一發或間日一發苦楚萬狀疹其脈左三部弦而徑急右三部虛微無力方用桂枝理中加桂湯稍安越三日又發與前方不應乃倍加附子甚安後復發前方又不應因思仲景傷寒治法有用真武湯一法者原以真陽飛越水氣上逆故用此以復陽收隂坐鎮少隂北方之位究其功用全在行水醒脾之妙今因勞鬱所傷中氣損盛由是所勝之木乘脾所不勝之水侮之而上逆木橫則痞結作嘔水逆則痰飲泛溢若非真武何以攝元陽而鎮隂邪耶遂用此方倍加分兩多用人參連進三十餘劑嘔漸已痰漸少令早服八味丸晚服附桂理中丸調理諸症悉平惟結塊不除則以久積隂寒難解恐成痼疾也繆仲淳治丹陽葛文學宇十內人因作家勞鬱患飲症每發吐嘔不已腸如欲出所吐俱清水動以盆桶計日夜不止不思飲食就醫金壇諸醫以健脾行氣理鬱清痰藥投之愈劇困頓待斃計無復之矣繆視脈審病知為飲無疑乃用半夏廣皮茯苓豬苓澤㵼旋覆花厚朴白术枳實川連木香加人參三錢一劑吐止再劑霍然隨啖粥糜脾氣漸復至今每病作檢方服之即平雲門康孟修患寒熱不食久之勢甚危以治寒熱劑投不應遍檢方書與王宇泰議投五飲丸立瘥蓋飲症原有作寒熱之條故治飲病自去矣廣筆記同上吳橋治汪鐄始壯輒患嘔逆胸膈痛諸醫悉以膈治骨立而羸久之隨絶而汗如流水漿不能入口診其脈即浮濡不任按無他端曰此停飲爾悮以膈治病者心悸則氣澀于胸中血從氣行氣阻則血亦阻矣此二缶鐘惑也第先屏二缶而後治之瘀血當下病者憮然為間曰敬如公言遂修行氣一劑飲之飲未畢而痛止徐下黑糞瘀血畢行乃平太亟集程氏有少婦病小腹痛吐痰多嘔清水發熱泄㵼肌削而屏饔飱乃逆橋六脈沈細弦數曰此積飲也法當發其積而病可除第病久而孱毋伐太過劑以補中去濕小腹大痛而惛既則嘔盈盤沈沈皆緑水衆異曰何為有此橋曰吾固以為濕熱也地下濕則生苔其緑同尋無恙同上羅鍊年近壯病中腕病痛連背脅及心間吐清水久之痛甚如剚刃再信惛惛族醫技窮謂六脈絶矣橋後至則曰此停飲也痛甚故脈伏非絶也遂以溫補之劑投之一服而脈見再服而愈太亟集潘塤曰余昔年脾胃受病每日申未時飯至二鼓食消方寢夜半睡醒噯氣吞酸糟粕乘氣浮上起坐摩娑久之復寢漫服枳术平胃散或分消或疏導久不效自思年六旬外恐脾胃弱不能運化却去晚餐凡粘硬果物及濕熱酒麵一切不入口不知何以致此因讀東垣脾胃論乃知陽氣下陷隂火上衝脾胃不實故耳得一方曰補脾胃㵼隂火升陽湯藥品主佐在本方并服藥時日所宜所忌切中病情又讀至調理脾胃治驗謂不可淡滲之劑抑遏陽氣反惹隂邪必加升陽風藥以羌獨活升麻防風炙甘草根皆入前藥水煎服乃依方服之片時後陽氣漸升而上不數日隂火漸伏脾胃實而愈髙鼓峰治杭人沈孟嘉妻患吞酸膈痛屢年矣肌肉枯削幾于絶粒診之六脈細數此木乘脾土也先投六君子湯加炮薑十餘劑覺吞酸減半繼用補中益氣湯加半夏炮薑十餘劑而吞酸盡去膈痛亦除次用歸脾湯倍木香加炮薑吞八味丸而愈吞酸嘈雜薛立齋治一婦人飲食後或腹脹或吞酸自服枳术丸飲食日少胸膈痞滿腿肉疼痛畏見風寒或用養胃湯腿痛浮腫益甚月經不行此鬱結所傷脾虛濕熱下注清晨用四君子湯芎歸二陳午後以前湯送越鞠丸諸症漸愈又用歸脾八珍二湯兼服兩月餘而經行一婦人胸滿少食或腹脹吞酸或經候不調此中氣虛不能施化也用補中益氣加砂仁香附炮薑而飲食進更以六君芎歸貝母桔梗而經自調一婦人飲食少思胸中嘈雜頭暈吐痰此中氣虛而有熱用六君子湯加黑山梔桔梗而愈後因勞碌頭暈發熱吐痰不食用補中益氣加半夏茯苓天麻而痊一婦人中腕嘈雜口中辛辣或咳嗽吐痰發喘面色或白或赤此脾氣虛而肺中伏火也用六君子加山梔桔梗柴胡及炒黑片芩治之尋愈一婦人嘈雜吞酸飲食少思大便不實此脾氣虛寒而下陷用補中益氣湯加茯苓半夏炮薑漸愈又常服人參理中丸則安一婦人飲食後嘈雜吞酸此熱鬱為痰用六君子湯送越鞠丸漸愈又用加味歸脾湯而痊後因怒兩脅脹痛中脘作酸用四君子湯送左金丸漸安仍用六君子湯送越鞠丸而瘥朱丹溪治一人因濕熱病嘔吐酸水如醋用二陳湯加薑炒芩連蒼术白术梔子藿香香附砂仁而愈陳三農治一婦每食止碗許稍加非大便泄㵼即噎腐吞酸腹脹痞悶此脾虛寒不能化也用六君子加茱連藿香香附砂仁神麯煨薑而愈薛立齋治一婦人飲食每碗許稍加非大便不實必吞酸噯腐或以為胃火用二陳黃連枳實加內熱作嘔曰水傳寒中故噯氣吞酸脹滿痞悶不信仍作火治虛症並至月經不止始信以六君子加炮薑木香數劑元氣漸復飲食漸進又以補中益氣加炮薑木香茯苓半夏數劑全愈後因飲食勞倦兼之怒氣飲食頓少元氣頓怯用前藥便加發熱試似實火脈洪大按之而虛兩尺如無此命門火衰用補中益氣加薑桂及八味丸兼服兩月餘諸症悉愈此症若因中氣虛弱者用人參理中湯或六君子加木香炮薑不應用左金丸或越鞠丸虛寒者加附子或附子理中湯無有不愈一男子虛弱惡寒食雖熱食亦少作脹吞酸日消瘦服參苓等藥及灸脾俞等穴不應用八味丸治之而愈此真氣不足不能生土虛火上炎之症也一婦人年二十餘飲食後每因怒氣吞酸噯腐或兼腿根焮服越鞠丸等藥不應此脾氣虛濕氣下注而然以六君子湯香附砂仁藿香炮薑數劑少愈更以六君湯數劑而愈一男子瘰癧已愈患吞酸服參术藥不應彼謂餘毒薛治以附子理中丸而愈張景嶽曰豫向在都中治一縉紳病吞酸告以為寒彼執為熱堅持造酒之説以相問難莫能與辨竟為芩連之屬所斃此見理不真而固執以致釀成大害者未選入續名醫類案卷二十一
