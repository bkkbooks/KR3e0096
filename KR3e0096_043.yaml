body:
  text: 續名醫類案卷四十三錢塘魏之琇撰小兒初生程世光治憲王誕長子初生時不知吮乳程曰此因難産兒傷氣也持人參煎湯灌半匙即吮江西通志一舟工生子脆而無皮程令取土數升糝其體即成肌同上太原王相公始生冷無氣母驚謂已死有鄰嫗徐氏者反覆諦視良久笑曰此俗名卧胞生吾能治之當活活則當貴但不免多病纍阿母耳趣使治之其法用左手掬兒右手摑其背百餘逾時嚏下而醒後六嵗中痘公母嘗下樓謁巫見一白衣人長丈餘間立凝視若有所言母驚仆樓下以為不祥然竟無恙眉公見聞録兒生墮地不啼擊水瓢迫貓令叫即啼又俗稱不啼兒為悶寂生旁人呼其父名父應兒即啼物理小識有舟人生子無皮人莫能曉適吳門葛可久出醫衆告之可久就岸畔令作一坎置兒其中以細土隔衾覆之且戒勿動久之可久回啓衾視之己生膚矣蓋其母懷娠舟中久不登岸失受土氣故也與前程世光案同按危氏得效方云宜速用白早米粉乾撲候生皮方止小兒初生不飲乳及不小便用蔥白一寸四破之以乳汁銀石器煎灌之立效得方小兒初生下遍身如魚泡又如水晶碎則成水流滲用蜜陀僧研絹羅內羅過乾糝仍服蘇合香丸同上小兒走馬牙疳萬密齋孫周嵗生走馬疳用尿桶底白垽刮下新瓦上火焙乾五分五倍子內蟲灰三分鼠婦焙乾三分枯白􅈨一錢共研末先用臘茶葉浸米泔水洗淨以藥傅之神效名曰不二散朱丹溪治走馬牙疳蠶退紙燒灰存性入麝香少許蜜和敷患處加白􅈨尤妙治法小兒臍風萬密齋治鄭斗門子初生五日不乳噴嚏昏睡萬視之曰此臍風病也一名馬牙疳小兒一臘當是一旬之內尤急乃視其口中上腭有白泡如珠大者三四個用銀針挑去之斗門憐惜之情見於面去之未盡次日猶不乳有老嫗語以臍風之害乃速萬再治且問臍風之病云何萬曰其病不可治者三臍腹腫脹大小便不通者名曰鎖肚口緊不開不乳不啼而時作搐者名曰禁風環口青色口唇緊撮名曰撮口令郎初病未至困也復以手法去其白泡而安又曰當何用藥萬曰數日之兒安能任藥雖有古方不敢用也曰然則奈何萬曰無害矣此病蓋初生時洗浴之後臍乾未落不謹視之為兒尿所浸及為風寒濕熱所侵之故宜急治之但見噴嚏多啼少乳即視其口中上腭有白泡子成聚是其候也隨以手法刮去之以軟帛拭淨其血則臍風不發矣若不知此則其泡流入腹中或為鎖肚為禁風為撮口雖有神丹不能救也鄭請詳記之以為育嬰之訓小兒赤丹即遊風薛立齋治一小兒腿如霞遊走不定先以麻油塗患處砭出惡血其毒即散用九味解毒散一劑而愈一小兒患之外勢雖輕內苦便祕此患在臟也服大連翹飲敷神功散而瘥萬密齋曰一小兒丹發於臉眼中紅腫手不可近三日死立齋治一小兒遍身皆赤砭之投解毒藥即愈一小兒遍身亦赤不從砭治致毒氣入腹遂不救此症乃惡毒熱血藴畜於命門遇相火而合起也如霞片者須砭去惡血為善如腫起赤色遊走不定者宜先以生麻油塗患處砭之以泄其毒凡從四肢起入腹者不治雖云丹有數種治有數法無如砭之為善常見患稍重者不用砭法俱不救也莊斂之子未及三月乳母不善於養盛暑中擁衾令卧忽患丹毒遍遊四肢漸延腹背倉皇來告豫曰兒方數月奈何苦之以藥急以犀角絞鮮梨汁磨服問故曰犀角能解心熱而梨汁更能豁痰且味甘則兒易服别疏方用荆芥穗牛蒡生地丹皮元參花粉薄荷竹葉麥冬生甘草連翹貝母生蒲黃令煎與乳母服之乳汁即湯液矣依法治之一日夜赤漸淡越日丹盡退後率以乳母不戒患驚風而殤廣筆記馬銘鞠傳治下部火丹用蠶砂山梔黃連黃芩黃蘗大黃石膏共末水調敷上立效切勿用芭蕉根又方用黃連末密和雞子清調服馬云若遇抱頭火丹必砭去惡血方效每用此法治人其不肯砭者多誤事同上立齋治吳刑部靜之子甫周嵗患丹毒延及遍身如血染用磁鋒擊刺遍身出黑血以神功散塗之查春田用大連翹飲而愈王國戚子未彌月隂囊患此如前治之而愈金氏子不欲刺毒入腹而死河間云丹從四肢起入腹者不治豫嘗刺毒未入腹者無不效一小兒患赤遊風先用羌活白芷散二劑又用加味逍遙散而愈後傷風熱起疙瘩搔破出水或用大麻風藥十指拳攣膿水津淫先用秦艽地黃湯手指如常又用易老祛風丸而瘡亦愈小兒胎毒萬密齋長孫生下遍身生瘡疥因製一方用烏稍蛇酒浸去皮骨取淨肉焙乾一錢苦參酒浸切片晒乾取末一錢半白蒺藜炒去刺一錢半三味為末酒糊丸如粟米大每服十五丸竹葉煎湯下蟲疥滅迹不再發矣一小兒身生蟲疥醫用藥搽之瘡盡沒腹脹而喘求藥於萬曰幸未發搐尚可治也乃與雄黃解毒丸竹葉燈心煎湯下利黃涎瘡復出而安或問曰蟲疥不可搽乎曰蟲疥者胎毒也宜用解毒之藥使毒散於外不可妄用搽藥逼之使反於內也搽瘡之藥必用砒礵水銀以殺蟲藥毒之氣乘虛入裡誤兒性命切宜慎之一彌月小兒先於口內生瘡後延於身年餘不愈以土茯苓為末乳汁調服毋以白湯調服月餘而愈一兒生下一月後遍身蟲疥浸淫濕爛其皮如脫日夜啼忽一日其瘡盡隱發搐而死馮楚瞻治其孫因母久患隂虛夜熱之症生下百餘日遍體癩瘡未必非其母妊時久服八味所致案見産難門以生地當歸丹皮赤芍萆薢首烏銀花連翹土貝甘草鱉虱胡麻土茯苓木通節大劑乳母日夜進服數十劑後濕熱下趨兩足潰爛清水淋漓指甲皆脫乳母傍人近者莫不傳染此先天熱毒之氣已盡出外矣後於耳後結一大毒此隂虛無根之火凝聚也以八味加牛膝五味煎湯數劑髙腫潰膿而愈自後津液衰涸瘡靨乾枯或愈或發防其內攻乃以羊肉四兩煎湯入生黃芪四錢當歸二錢銀花三錢炒升麻四分薑三片棗二枚煎與服不及十劑足瘡全愈升於頭項再服頭瘡亦痊劉禹錫傳信方云頃在武陵生子蓐內便有熱瘡塗諸藥無益而日益劇蔓延半身號啼不乳不睡用雞子五枚煮熟去白取黃置髮中乃有液出旋取置碗中以液盡為度取塗瘡上即以苦參末糝之果神效本草綱目孫文垣治一兒耳後生一毒腫痛遍身生大疱瘡增寒發熱與金銀花當歸尾甘草赤芍連翹僵蠶牛蒡元參兩劑而消薛立齋治一小兒自脫胎時兩目赤腫或作癢或生翳此胎內之肝火也用蘆薈六味二丸而愈萬密齋治一兒五嵗每至春時則遍身生膿泡瘡此胎毒也戒用搽藥恐粉砒之毒乘虛入腹以胡麻服之而愈黃州李四守生子五月遍身濕疥一旦盡乾萬曰瘡出驚止始無憂也連更數醫不能治立齋治梁閣老孫甫周嵗項患胎毒俟其有膿刺之膿出碗許乳食如常用托裡藥月餘而愈靳閣老子亦患此待膿自出幾至不救吾鄉徐內翰子患痘者及時針刺毒不內侵數日而愈小兒氣血弱膿成不針鮮不斃矣小兒乳病張子和治一小兒寐而不寤諸醫作睡驚治之或欲以艾火灸之或以大驚丸及水銀餅子治之其父曰此子平日無疾何驟有驚乎以問張張診其兩手脈皆平和曰若驚風之脈當洪大而強今則平和非驚風也乃竊訊其乳母爾三日前曽飲醉酒否遽然笑曰夫人以煮酒見餉酒味甚美三飲一罌而睡陳酒味甘而戀膈酒氣滿乳兒亦醉也乃銼甘草葛花砂仁貫仲煎汁飲之立醒萬密齋治本縣胡正衢子二月發熱不乳萬視之雖似變蒸非變症也時乳母皆肥健者必因傷乳發熱也令損之次日熱退而安李立之治一嬰兒忽患瘖求治立之令以衾裹小兒乘髙投之地兒不覺大驚遂發聲能言問之曰此乳搐心也非藥石所能療其術之髙大率類此杭州府志一小兒九疑誤嵗吐乳便黃身有微熱萬曰此傷熱乳也吐作腥氣今已成積母曰未食熱物乃密語其父曰必傷交嬭得之問何為交嬭曰父母交感之後以乳哺兒此淫火之邪忤兒脾胃正氣也不治之必成癖矣蓋淫火者肝火也病則發搐癖者脾病也積不消則為癖矣宜瀉肝補脾乃與瀉火胃苓丸服之而愈御史陳公忽小兒閉目口不出聲手足俱軟急延醫治之獨孟友荆一見便云公子無病乃飲酒乳過多沈醉耳濃煎六安茶飲數匙便醒御史撫掌大笑曰得之矣可謂良醫續金陵瑣事王三峯子二嵗多病萬視之曰此乳少病也王曰兒乳極多萬不應遂行既而其母驗其乳媪果無乳也詢之晝則嚼飯以哺之或啖以粑果夜則貯水以飲之復求治曰欲使即換乳母則兒認慣不可換也若不使有乳婦人哺之則疾終難治也不若仍與舊母養之擇一少壯有乳者夜則相伴以乳補之久而慣熟自相親矣王曰有乳無乳治法異乎曰有乳之疳得之傷乳乃飽病也宜集勝丸無乳之疳得之失乳乃飢病也宜肥兒丸調理一月而安陸養愚治姚明水兒甫一嵗其母無乳乃以糕餅棗柿哺之遂患疳積痢上則口舌腐爛下則膿血相雜治療半載肉削如柴飲食少進醫謂上疳下痢睡不閉目肛門如竹筒指絞已過命關不可為矣診之形脫而神在以一指按其脈上浮數而微下沈微而數其肛似外脫而非竹筒也比上越者不降下陷者不升若升其元陽降其邪火猶可生也先與補中益氣湯二盞以提其不足之陽又濃煎生脈散俟冷時時以匙挑灌之間以孩兒茶氷片青黛人中白吹之二日而減旬日全安薛立齋治一小兒目睛緩視大便臭穢乃飲交感時乳所致用四君子加木香藿香治之而安小兒變蒸萬密齋治楚臬之子九月發熱恐是痘疹召萬往視之非痘乃變蒸也曰何以辨之萬曰以日計之又當有變蒸之期以症察之亦無痘疹之候曰痘症云何萬曰痘者五臟之液毒也故每臟各見一症呵欠驚悸心也項急頓悶肝也咳嗽噴嚏肺也吐瀉昏睡脾也身體皆涼腎也今公子無之知非痘乃變蒸將退也次日果安小兒喉舌滯頥吳孚先治一小兒咽喉忽腫脹痛甚米飲湯水不下危甚吳曰此名鎖喉風以銀針刺少商然二穴出血其喉即寬與之茶即下咽無苦飲食遂進一小兒不時舌出以清涼藥治之不愈吳曰此名弄舌與吐舌不同薛新甫云吐舌者脾經實熱而舌長出也弄舌者脾經虛熱時舒時斂也照新甫成方用異功散加釣藤鉤而愈巢氏云小兒滯頥者涎流出而漬於頥間也此由脾冷涎多故也脾之液為涎脾胃虛冷不能收制其津液故流出於頥也張氏溫脾丹主之一法百藥煎含咽其涎自不出亦截法也益黃散亦治此症溫脾散亦可東垣十書萬密齋外孫滿口生瘡咽喉唇舌皆是為製方用蘗連一錢朱砂白􅈨五分鼠婦焙乾三分共研細敷之立效乃竒方也一兒患口舌生瘡所搽所服皆苓連知蘗之類無效曰心熱所作苦入心反助其熱宜無效乃作洗心散與之一服而安大黃麻黃白术當歸白芍荆芥薄荷甘草等分水煎服更用蘗連散搽之仍用苦矣一小兒舌上生瘡口唇破裂吮乳不得日夜啼哭求治用洗心散入竹葉煎服以解其裡熱外用蘗連散搽之效小兒舌蔣仲芳治一小兒初患舌碎既而遍身發熱或謂傷風停食與發散消導曰無益也服後果熱愈而湯水難入乃以黃連五錢疑是分煎湯徐徐與之終劑而愈問故曰若先身熱而微舌碎則因風食發熱所致今先舌碎知其心火亢甚加之身熱是內熱極而火外行耳小兒瘖蔣仲芳治一小兒二三嵗身熱驚悸易醫六七俱無寸效一日忽作鴉聲少頃其音已啞魚口開張視之欲哭狀惟眉頭稍皺終無音因以指探其口中唇乾舌燥曰心熱欲言而不能果有之乎即以黃連黃芩石膏麥冬五味山梔元參花粉知母甘草薄荷燈心竹葉等銼一大劑煎成薄膏頻頻與之一晝夜而鴉聲復出又一日而音始全而愈自後此法活人無數大便三四日不行者加元明粉二三錢尤驗驚悸者加金子同煎嗟乎世遇啞驚風俱棄之而不治孰知唇乾舌燥終屬陽症此法甚善故記之續名醫類案卷四十三
