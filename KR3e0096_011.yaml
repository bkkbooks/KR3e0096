body:
  text: 續名醫類案卷十一錢塘魏之琇撰瘧竇材治一人病瘧月餘發熱未退一醫與白虎湯熱愈甚竇曰公病脾氣大虛而服寒凉恐傷脾胃病人曰不服凉藥病何時得退竇曰內經云瘧之始發其寒也烈火不能止其熱也冰水不能遏當是時良工不能措其手且扶元氣待其自衰公元氣大虛服凉藥退火吾恐熱未去而元氣脫矣因為之炙命關才五七壯脅中有氣下降三十壯全愈張子和曰有一書生瘧間日一發將秋試及試之日乃瘧之期書生憂甚誤以葱蜜合食大吐涎數升瘀血宿痰皆盡同室驚畏至來日入院瘧亦不發亦偶得吐法耳子和治陳下一人病瘧三年不愈止服溫熱之劑漸至衰羸求張治張見其羸亦不敢便投寒凉之劑張公原自細心乃取內經刺瘧論詳之曰諸瘧不已刺十指間出血正當發時令刺其十指出血血止而寒熱立止咸駭其神故息城一男子病瘧求治診之兩手脉皆沈伏而有力內有積也此是肥氣病者曰左脅下有肥氣腸中作痛積亦痛形如覆杯間發止今已三年祈禳避匿無所不至終不能療張曰此㾬瘧也以三花神祐丸五七十丸以冷水送過五六行次以冷水止之冷主收斂故也濕水既盡一二日煎白虎湯作頓啜之瘧猶不愈候五六日吐之以常山散去冷痰涎水六七次若翻漿次柴胡湯和之間用妙功丸磨之瘧悉除吳升內翰致和丁酉居全椒縣嵗瘧大作遇寒多熱少飲食不思者用髙良薑麻油炒乾薑炮各一兩為末每服五錢用猪膽汁調成膏子臨發時熱酒調服以膽汁和丸每服四十丸酒下亦佳凡救人以百計張大亨病此甚欲致仕亦服之而愈大抵寒發於膽用猪引二薑入膽去寒而燥脾胃一寒一熱所以效也朱氏集驗方本草綱目野史云盧絳中病痁瘧疲瘵忽夢白衣婦人曰食蔗可愈及旦買蔗數挺食之翌日疾愈夔州潭逺病瘧半年故人竇藏叟授方用真阿魏好丹砂各一兩研勻米糊和丸皂子大每空心人參湯化服一丸即愈世人治瘧惟用常山砒霜毒物多有所損此方平易人所不知草忩周密云此方治瘧以無根水下治痢以黃連木香湯下瘧痢多起於積滯故耳顧寶光善畫陸溉病風瘧久不療寶光嘗詣溉遂命筆圖一獅子像於户外云旦夕當有驗至夜聞窸窣之聲明日視獅子口有血淋漓溉病遂愈姑蘇志張守淳冬月患三瘧骫骫一月延王孝先診王搖首曰更十日則不治矣必用參附乃可小减其父瞿然縮舌不敢應王力持前說服參附各一錢乃至二錢瘧粗損六七明年初夏始愈孫文垣族子應章三陰瘧發於子午卯酉日昔人謂少陰瘧已四越月矣每發於夜熱多寒少左脉微弦右關滑大以二陳湯加柴胡黃柏川芎當歸黃連兩帖熱少輕飲食不進四肢懶倦脾氣太虛以白术何首烏各三錢鱉甲二錢青皮七分烏梅一個一帖而截應章之弟十月發三陰瘧至次年仲春未止每發於辰戌丑未日昔人為太陰瘧午後寒多熱少夜有盜汗左脉軟弱右關尺弦數有力用白芍當歸各一錢白术二錢柴胡川芎甘草砂仁桂枝酒芩各三錢生薑三片水煎服再以首烏鱉甲白术各三錢柴胡一錢青皮酒芩各五分烏梅一個生薑三片臨發五更服兩帖而止後半月下身大發瘡癤伏暑未盡方中缺用黃連之故江省吾暮秋患瘧三日一次發於夜次年仲春猶未止遍身疼痛背脊疼灸之僅止一日後仍發面青肌瘦此邪在足太陽經以遍身及背脊痰也用麻黃一錢五分人參桂枝白芍甘草知母各一錢陳皮貝母各七分薑棗煎服痛减半瘧未止以首烏白术各五錢青蒿一錢烏梅一個陳皮二錢薑三片水煎臨發之日五更服尋常以六君子加黃耆五味烏梅草果調理而愈姪孫二水年三十體肥夏月常浸溪中卧松陰下至八月大發寒熱自己午至天明乃退飲食不進嘔吐黃膽汁胸膈脹悶舌上乾燥生芒刺沈香色强硬以冷水頻潄乃能語言惟啖西瓜生藕先發熱之日吐血一口今則大便下血且咳嗽此溫瘧症也由醫解散遽用黃耆以閉邪氣致成大困用柴胡知母各三錢石膏七錢葛根三錢橘紅竹茹各一錢五分酒芩枳實各二錢甘草貝母各五分三帖吐止改用二陳湯加柴胡枳實黃芩黃連花粉鱉甲白术首烏調理而愈喻嘉言治袁繼明素有房勞內傷偶因小感自煎薑葱湯表汗因而發熱三日變成瘧疾脉之豁大空虛且寒不成寒熱不成熱氣急神揚知為元陽衰脫之候因謂來日瘧發慮大汗不止難於救藥防危不以為意次日五鼓時病人精神更覺恍惚扣門請救及覓參至瘧已先發矣又恐人參補住瘧邪雖急救無益也此語未善瘧未發時豈無邪耶要之發時不當藥耳姑俟瘧勢稍退方與服之服時已汗出沾濡頃之果大汗不止昏不知人口流白沫灌藥難入直至日暮白沫轉從大孔遺出乃喜曰白沫下行可無恐矣但內虛腸滑獨參不能勝任急以附子理中湯連進四小劑人事方蘇能言但對面談事不清門外有探病客至渠忽先知家人驚以為祟曰此正神魂之離舍耳今以獨參及附子理中駟馬之力追之尚在半返未返之界以故能知宅外之事再與前二帖而安裕民坊民家淘井得一瓦枕枕上有一符符下有驅瘧二篆字相傳為諸葛武侯所製病瘧者枕之即愈彼此轉相借用遂為鄰人所匿因訟於官亦不能得續金陵瑣事陸養愚治崔鹽院八月間患瘧日一發治療十日不愈崔曰此病或煎藥一二劑或丸藥一服未有不止者今服藥一二十劑而病發轉劇何醫之無良也醫者承風進診間曰前日內外之邪尚重未敢即截今邪已去可以截矣因進丸藥一服服之嘔惡移時明日果愈但飲食無味口每苦乾甫三日而復作陸診時正值寒戰床帷俱動面未載陽載陽二字缺妥汗泄不止身熱如火其脉洪數無倫沈按則駛瘧發時脉亦難慿曰此熱瘧也與三黃石膏湯乃謂瘧門不載仍進前丸一服嘔吐不止至己午時瘧發更甚熱竟日不退再召診因思兩畨丸藥胃氣重傷且脉較前更弱不可純作實熱治矣以白虎湯合建中生脉之半投之一夜二劑嘔噦即止明日瘧不發矣以清氣養榮湯調理而安按面載陽而脉無倫次則似理中症矣乃作實熱而與三黃石膏其說不無可議朱逺齊醫名藉甚與陸莫逆交歸安令聞其名屢召不赴借事繫之獄欲斃之杖下邑紳十餘輩為請竟不釋其妻奔號求救陸亦無計可施適按臺巡湖患瘧醫治無效召陸診陸喜曰機在是矣視其脉兩寸關浮數微弦按之極弱兩尺沈按緊小其症不發時亦倦怠身常熱有汗饑而否悶不敢食小腹脹急大便欲行不行者已七八日發時戰栗身極熱煩渴躁擾且喘急甚前醫初與發表後以否悶用二陳青皮草果燥熱之品常山亦私用而不應審其平日極喜厚味病後禁絶惟日啖乾糕數枚夫滋潤不進腸胃已乾重以風熱燥削之劑安得不否滿燥結乎因思此症乃腸實胃虛若以丸劑通其下結以煎劑補其中虛可立已然必徐為之方可為逺齊地乃曰病無大害苐勢正猖獗必數日方可衰其半十日則全愈矣促進藥曰此時病將發經云無刺熇熇之熱無刺渾渾之脉無刺漉漉之汗為其病逆未可治也既定以清氣養榮湯進之令以火肉進粥二碗大便未行以蜜𨗳出燥屎數枚次日瘧减十之三再進前湯二劑已减十之六七因乘間曰症雖减而脉似未减此餘邪未盡恐後時有變某有師兄朱如玉術髙某百倍若得此人商治百無一失奈渠得罪縣尊現在監禁按臺隨令捕官著歸安縣請朱朱得免及進視論病如見因用潤字丸三錢先服隨以前湯方加生脉散是夜下宿垢極多明日瘧止矣陸肖愚治沈後菴年五十七月間患瘧日一發或兩發服藥不效用丸藥截之嘔吐竟日次日瘧不作矣然飲食日减倦怠嗜卧至八月中復發寒熱一二日仍以丸藥截之遂嘔㵼數日不止飲食不進即湯水亦盡吐出身熱載陽語多譫妄醫尚擬二陳五苓及其診脉浮而微細如絲乃謂曰疾亟矣兄藥寬緩恐無濟今當用附子理中以冀萬一耳彼醫心不然之又病家見用附子大駭陸遂辭去彼醫療治兩日而殂陸祖愚治朱明宇因暑月多飲水又繁勞過度飲食失節常徹夜不眠偶赴酌歸感寒頭疼身熱胸膈不快自用葱薑表汗轉成瘧疾間日一發醫用檳榔柴胡草果青皮乾葛羌活之類投之輒吐及瘧發呻吟煩躁益甚日久漸危脉之氣口沈實有力臍之上下手不可按六七日不大便口乾燥渴極欲西瓜冷水曰可立起也因投其所喜用嫩蘇葉嫩薄荷搗汁和勻井水中與飲吐止而有微汗甚覺爽利隨以順下丸四錢投之渴則以前水飲之薄暮沈睡至四鼓腹中響微微作痛下燥屎七八枚後又連行三次去稠膩甚多是日微發熱懈怠乃用歸芍茯苓知母貝母前胡花粉人參甘草等味調理數日而安吳抑之少年稟弱多繁勞患瘧間日一作醫峻以參术大補家人又以參粥食之遂否悶發狂煩燥不寐脉之左三部弦細而數右寸關浮弦按之有力右尺似有似無其氣血固虛而風寒積滯則實也用柴胡乾葛黃芩山查厚朴青皮陳皮半夏一劑胸膈略舒數劑譫妄煩躁悉除瘧發於陽分矣其鼻乾唇裂不眠腹中梗塊作痛皆陽明大腑未清也改用枳實熟黃山查甘草加鐵鏽水一服即下宿垢十餘枚諸症頓减但真元衰弱瘧猶未己以當歸人參白术茯苓甘草柴芩麥冬二母數劑而愈李士材治楊太史瘧發間脉見弦緊兩發後苦不可支且不能忌口便求截之曰邪未盡而强截之未必獲效即使截住必變他症不若治法得所一二劑間令其自止升麻柴胡各二錢提陽氣上升使逺於陰而寒可止黃芩知母各一錢五分引陰氣下降使逺於陽而熱自己以生薑三錢却邪歸正甘草五分和其陰陽一劑而减半再劑而竟止程武修患瘧每日一發自己午時起直至次日寅卯而熱退不逾一時則又發矣已及一月困頓哀苦求速愈曰頭痛惡寒脉浮而大表症方張此非失汗必誤截也果服截瘧丸而增劇此邪未解而遽止之邪不能伏教以八劑四日服盡决效矣石膏黃芩各三錢抑陽明之熱使其退就陽明脾胃為夫妻使之和合則無陰陽舛亂之愆半夏檳榔各一錢五分去胸中之痰蘇葉二錢發越太陽之邪葛根一錢斷入陽明之路甫三劑而瘧止改用小柴胡倍人參服四劑補中益氣湯服十劑而痊沈相國患瘧吐蛔悶不思食六脉沈細李曰瘧傷太陰中寒蛔動也用理中湯加烏梅三個黃連五分進四劑後胸中豁然寒熱亦减蛔亦不吐去黃連加黃耆二錢生薑五錢五劑而瘧止蓋病人素有寒中之痰雖盛暑寒冷不敢沾唇故瘧發而蛔動也陳眉公三日瘧浹嵗未瘥素畏藥餌尤不喜人參其脉浮之則濡沈之弱營衛俱衰故遷延不已因固請曰素不服參天畀之豐也今不可缺者病魔之久也先服人參錢許口有津生腹無煩滿遂以人參一兩何首烏一兩煎成入薑汁鍾許一劑勢减七八再劑瘧遂截與景嶽何人飲意同醫通一士人病瘧久不愈有道士來以棗一枚按病人口上咒曰我從東方來路逢一池水水內一尊龍九頭十八尾問他喫甚麼專喫瘧疾鬼太上老君急急如律令敕連咒三遍將棗納病人口中令嚼食之遂愈二酉餘談皆一日七遍又凡他果可不特棗也馮楚瞻治徐六御患瘧不已熱時惡心胸脹倍甚醫用柴胡湯加草豆蔲意其痰食為患耳乃徐素有鼻衄之症今當壯熱之時忽遇卒熱之藥迫血妄行潰涌數斗昏暈不省冷汗如珠四肢皆冷脉微欲絶令以獨參兩餘煎汁半鍾灌之始能吞咽再煎再灌次日稍蘇但厄逆不止乃以溫補之劑重用人參冲服諸症漸平但人參略少厄逆便甚八味十全早晚服兩月全愈韓老夫人患瘧甚重壯熱無汗六脉洪大而空馮曰汗生於陰腎主五液今六脉有陽無陰豈可更汗以促其孤陽亡越乎凡治傷寒感症均宜達此不惟瘧疾為然然必用于誤表之後斯為合法以八味加牛膝五味子每劑納熟地二兩煎碗餘浩飲之滋水即所以發汗也果大汗而愈趙某形甚肥壯而中氣甚虛下元不足夏月患瘧醫以發散和解不愈復以補中益氣調之亦不應發時寒熱大作喉如齁鼾臉紅喘促出多入少脉之寸關豁大兩尺甚微勢甚危困諺云少不可弱老不可瘧老年氣血衰微大寒大熱非所堪也故常多出不意一時暴絶理宜大補真陽真陽仍佐下歸斂納封藏之劑如八味加五味牛膝為穩若補中益氣恐益令孤陽上浮陽亡於上陰絶於下便有不測之患觀此則知補中益氣不可漫用也况以陰虧陽損之軀而犯陰竭陽浮之病復當陽浮陰耗之時升浮之藥斷非所宜奈病家醫者均以熱天熱病畏投桂附補中益氣先哲良方必欲進之果喘促愈加夜半而逝可以為戒徐氏婦七十餘患瘧上則咳嗽吐血下則泄㵼粒米不進人事不省胸膈脹悶脉則兩寸細數左關弦大右關甚微兩尺重按不起勢甚危篤知為陰虛內熱外寒肝無血養而强脾無氣充而弱血無所統而吐榖無所運而㵼氣無所納而脹悉屬本源為病用重劑熟地白术麥冬五味牛膝製附子參湯冲服瘧止神清既而病人自謂胸膈有停滯不肯用補乃詭以八味丸為消食丸參湯送下遂諸症悉痊謝登之年七十餘偶途中遇雨疾趨而歸繼發瘧疾甚危每發輒大便便必昏暈欲絶醫以踈散勢愈劇馮曰冒雨受寒踈散宜矣獨不思經曰驚而奪精汗出於心持重逺行汗出于腎痰走恐懼汗出於肝搖體勞苦汗出於脾皆傷臟也凡入者為實出者為虛大便出而昏暈元氣欲脫矣尚可以既散之微寒為重而垂絶之元氣為輕耶急以附子理中湯加五味投之而愈黃履素曰立齊云大凡久瘧乃屬元氣虛寒蓋氣虛則寒血虛則熱胃虛則惡寒脾虛則發熱陰火下流則寒熱交作或涎吐不食泄㵼手足厥冷寒戰如栗若誤投以清脾截瘧二飲多致不起按嵐瘧久不止者多成壞症想不遵此治法而醫藥亂投之故豫表兄沈鴻生孝亷精神素王自閩遊歸患山瘧幾一載元氣都耗後瘧雖止而面黑眼黃見者驚異如是又二載卒以鼓脹亡先生指久瘧為元氣虛寒信為確論余少時曽患此雖不敢服清脾截瘧等藥而所進皆柴胡黃芩之劑十四五發得止亦甚狼狽矣此病最忌生冷葷腥使滋味泊邪氣自衰豫病時守戒甚嚴瘧止後茹素者半月饞極乃葷是以脾胃頓開飲食較未病前培增精神始王黃之姪倩孫培之得胡與辰金鉛丸有一比邱患嵐瘧久不止與一丸服之减半蓋嵐瘧屬元氣虛寒金鉛丸能助陽氣故兩丸而竟愈也張路玉治張怡泉恆服參附鹿角膠等陽藥而真陰向耗年七十五七月病瘧誤進常山截瘧一劑遂人事不省六脉止歇按之則二至一止舉之則三五至一止惟在寒熱之際診之則不止熱退則如前此真氣衰微不能貫通于脉及寒熱時邪氣衝激經脉反得開通此虛中伏邪之象為製方用常山一錢酒拌同人參五錢焙乾去常山但用人參以助胸中大氣而祛逐之因常山傷犯中氣而變劇故仍用之為嚮𨗳耳晝夜連進二服遂得寢但寒熱不止脉止如前乃令日進人參一兩二次服并與稀粥助其胃氣數日寒熱止脉微續而安顧玉書瘧發即昏睡囈語痞脹嘔逆切其氣口獨見短滑乃有宿滯之象與凉膈散易人中黃加草果仁一劑而霍然金氏子八月間患瘧發於辰戌丑未至春子午卯酉每增小寒熱直至初夏診其六脉如絲面青唇白乃與六君子加桂附四服不應每服加人參至一兩桂附各三錢而辰戌丑未之寒熱頓止子午卯酉之寒熱更甚此中土有權而邪併至陰也仍與前藥四服面色榮食進寒熱悉除後與獨參湯送八味丸調理而安顧文學年逾八旬初秋患疸瘧昏熱讝語喘乏遺溺或以為傷寒讝語或以為中風遺溺危疑莫定張曰無慮此三陽合病目不仁而面垢仲景暑症原有是例遂以白虎加人參三啜而安同時顧文學夫人朔客祈連山皆患是症一者兼風用白虎加桂枝一者兼濕用白虎加蒼术俱隨手而瘥張飛疇治沈子嘉平昔夏間臍一著扇風則腹痛且不時作㵼六脉俱微數此腎臟本寒閉藏不蜜易於招風也下寒則虗火上僭故脉數與六味去澤瀉加肉桂肉果五味白蒺藜作丸服由是臍不畏風脾胃亦實明秋患瘧醫用白虎竹葉石膏等瘧寒甚而不甚熱面青足冷六脉弦細而數用八味丸三倍桂附作湯更以四君合保元早暮間進二日瘧退調理而愈髙鼓峰治曺獻扆室人十一月病瘧發則頭重腰痛寒從背起頃之壯熱烙手汗出不止曰此太陽經瘧也用大青龍湯曺曰病來五六日委頓甚矣且病者稟素怯弱又他醫言有汗要無汗帶補為主今汗如此而復用此藥恐不能當髙笑曰苐服此其病自除當晚汗猶未止進一大劑即熟睡次日不發逾日以補中益氣調理而痊全在認症明白故能談笑徐方虎病三陰瘧已四年矣幸所治皆武林名醫服藥得法不致潰敗刻薄而善占地步用人參幾十餘斤然年久病深至是遂不能支形肉盡脫飲食不進每覺有氣從左脅上冲即煩亂欲脫奄奄幾殆乃重用桂附白芍地黃加以養榮逐醫之藥冬至日正發期是日遂不至豫從姪藻明業醫患此治不效偶端午大哭黃魚竟愈又數人患此遇朔日亦痊用何首烏五錢陳皮二錢青皮三錢酒一碗河水一碗煎至一碗溫服治瘧不論久近即愈張三錫治翁氏婦久瘧食少許多用六君子加黃連枳實月餘不應因悟連枳之過純用補劑又令粥多於藥而食進再加附子三分半一服而痊張三錫云凖繩載一孺人夏患瘧用柴胡升麻葛根羌活防風之甘辛氣清以升陽氣使離於陰而寒自己以知母石膏黃芩之苦甘寒引陰氣下降使離於陽而熱自己以猪苓之淡滲分利陰陽使不得交併以穿山甲引之以甘草和之一劑而止有人患久瘧諸藥不效或教之以灸脾俞即愈更一人亦久患瘧聞之亦灸此穴而愈蓋瘧多因飲食得之故灸脾俞即效陸祖愚治朱襟湖六旬外肩上忽生癤毒因褪衣敷藥致感冒成瘧要知癤毒本由伏暑又因遇寒遂發瘧耳其脉浮虛乃於補氣血藥中加踈表之味數劑後膿潰而精神愈憊遂加參耆兩許六七日後瘧雖輕而未止有人謂斬鬼丹之妙不可勝言次早水吞一服少頃寒熱愈熾嘔吐不止昏暈異常喘氣不定乃用甘草為君黃連為臣佐以金銀花藿香開胃解毒暈吐止乃用大劑人參何首烏數服瘧止再用養血補托收斂生肌腫毒消而全愈陳雅初四月初過仙霞嶺陡遇狂風驟雨兩具徒施遍身俱濕宿店又無火焙兼長途勞頓水土不服飲食失宜遂患瘧閩醫用藥與浙逈殊即柴胡一味惟以前胡代之名曰香柴胡陳君之療發散為主得汗而病轉甚陸適在閩診之面色槁而黑自汗神昏懶於言語疲憊已極此風去而溫存之候其脉左手弦細而滑氣口緩弱知其勞頓之後重加發散乃與養血健脾寬中和解之劑去病猶反掌云嚴力暗豫之至友也以在閩病瘧數月歸及兩旬而殁因録是案不覺惘然天耶人耶時己丑長至後一日薛立齊治大尹曺時用患瘧寒熱用止截之劑反發熱惡寒飲食少思神思甚倦其脉或浮洪或微細此陽氣虛寒用補中益氣內參耆歸术各加三錢甘草一錢五分加炮薑附子各一錢一劑而寒熱止數劑而元氣復又治東洞庭馬志卿與此同但去附子加炮薑一錢一婦人勞役傷食患瘧或用消𨗳止截飲食少思體瘦腹脹以補中益氣倍參耆术草當歸加茯苓半夏各一錢五分炮薑五分一劑頓安前藥炮薑用一錢不數劑全愈朱丹溪治浦江洪宅一婦人病瘧間兩日而發飲食絶少經脉不行已三月矣診其脉兩手並無時正臘月極寒議作虛寒治之遂以四物湯加吳茱萸附子神麯為丸與之朱自以處方未當次早再求診之見其梳粧無異平時言語行步並無倦怠朱驚曰前藥誤矣經不行者非無血也為痰所礙而不行也無脉者非血衰少而脉絶實乃積痰生熱結伏而脉不見爾當作實熱治之遂以三花神佑丸與之旬日後食稍進脉亦稍出一日後六脉俱出但帶微弦瘧尚未愈因謂胃氣既全春深經血自旺便自可愈不必服藥教以淡滋味節飲食之法半月而瘧愈經亦行矣一男子患瘧久而腹脹脉不數而微弦重取則來不滑利輕又皆無力遂與三和湯索氏者三倍加白术入薑汁服之數服而小便利一二行腹稍减隨又小便短少作血氣兩虛於前藥中入人參牛膝當歸身作大劑服四十餘帖而愈一人久瘧先間日後一日一來早晚不定此腎不納氣故也用人參茯苓半夏各一錢丁香五味各五分益智甘草各三分薑水煎服王宇泰治蔣先生牝瘧衆醫因身疼寒甚欲用桂附曰溽暑未衰明係熱邪安可溫也經曰陽并於陰則陰實而陽虛陽明虛則寒栗鼓頷巨陽虛則腰背頭項疼三陽俱虛則陰氣勝則骨寒而痛寒生於內則中外皆寒此寒乃陰陽交爭非真寒也遂以柴胡羌活防風升麻葛根以升接三陽以桃仁紅花引入陰分而取陽以出還於陽分以猪苓分隔之使不復下一服而愈又治劉令尹患瘧而洞泄不止以交加飲子一劑而愈一人患三日瘧久而不愈飲食不貪口不知味熱多寒少用人參黃耆柴胡半夏茯苓當歸各一錢黃芩七分甘草青皮各五分薑棗煎服又治一老嫗患瘧因年髙懼其再發欲截曰一劑而已亦甚易焉用截為遂以羌防柴葛升麻升陽氣便離於陰知母石膏黃芩引陰氣下降使離於陽以猪苓之淡滲分利陰陽勿使交并以山甲引之甘草和之一劑而愈此與李士材治楊太史一案合輒其方大同小異治一老婦夜瘧瘧作時大小便俱下血飲食不進危甚邪熱在於血分故夜發血得熱而妄行故便血以桂枝桃仁湯去血中之邪一劑而愈薛立齊治一婦人因怒舉發無期久而不已胸腹不利飲食少思吞酸吐痰用六君子加柴胡山梔二十餘劑尋愈但晡熱少食又用四君子加柴胡升麻為主佐以逍遙散而痊馮楚瞻治張子芳年將六旬無發熱頭疼等候但飲食日少大便甚細而難小便甚赤而澀凡間三日則夜必氣逆上壅欲死通夕不寐形容枯槁神氣漸瘦六脉洪數惟右關尺稍緩無力此陰道虧極孤陽無根但三日一甚此兼脾主信而為病也凡病之難名者悉由本氣但從根本治之自無可藏匿而外見矣此千古不傳之祕乃以熟地一兩六錢麥冬三錢炒白术六錢牛膝三錢五味附子各一錢參湯冲服數劑後每至期則寒熱如三瘧狀此邪外達也照方再服十餘劑諸症全安立齊治洞庭馬志卿母瘧後形體骨立發熱惡寒自汗盜汗胸膈痞滿日飲米飲盞許服參术藥益脹卧床半年矣以為陽氣虛寒用大劑補中益氣加附子一錢二劑諸症漸退飲食漸進又二劑而愈一婦人久瘧寒熱服清脾飲之類胸膈飽脹飲食减少用補中益氣湯加茯苓半夏炮薑各一錢而痊朱丹溪治義一姪婦瘧疾初安因衝風又發腰痛白濁已與參术檳榔半夏補方治瘧又教以煅牡蠣一錢木通五分炒柏三分治濁入蓽薢杜仲枸杞根治腰痛粗末同立馬元儀治宋初臣年四十患瘧寒則戰栗熱則躁煩脉之兩關尺空大按之豁然若在熱發時見此未可便斷為參附症也所服不過汗下溫和之劑曰此症得之內虛所感其受傷在少陰腎之一經也與風暑痰熱發瘧者有天淵之别法宜大振陽氣以敵虛邪時一醫極力排阻言之不入因思此症一誤不堪再誤乃謂所親曰病勢甚危今晚可蜜煎人參一兩附子三錢與服庶可逆挽如言服之便得大睡寒熱頓止再劑而安一月後復見嘔吐徹夜不眠兩脉空大洵其故有穿窬者至因恐而得夫恐則傷腎火隨上逆况大病後元氣初復虛陽易於上越遂投以真武湯一劑而安母舅沈青城自金陵歸途中忽染瘧疾三發困甚診之兩脉浮弦滑實得之風暑痰滯表裡俱實陰陽俱病也脉證有餘可任攻達以柴胡三錢以袪少陽之邪黃芩二錢以清少陽之熱乾葛二錢白並一錢以越陽明之表知母二錢石膏五錢以清陽明之裡蘇葉三錢生薑五錢以散太陽之寒白豆蔲厚朴橘紅半夏檳榔各二錢以踈太陰之滯二劑寒熱大减三日而安黃氏姑患三日瘧發陰分用何首烏一兩牛膝一兩當歸五錢鱉甲醋炙一兩橘紅三錢水三鍾煎一鍾空心服立愈虛極者加人參一兩廣筆記于中父病三日瘧初服人參一兩生薑皮五錢水煎空心服不服仲淳堅持此方加參至三兩生薑皮至一兩五錢二服即起繆仲淳年十七時為瘧所苦凡湯液丸飲巫祝靡不備嘗終無救於病遍檢方書乃知瘧之為病暑邪所致經曰夏傷於暑秋必痎瘧遂從暑治不旬日瘳後數以意消息散邪之外專養胃氣痰多者消痰氣虛者補氣血虛者補血又分藏府經絡各從其類以施向𨗳即經年不愈者竟霍然起矣同上沈少卿中丞請告時苦瘧仲淳往診之憊甚曰再一發死矣先生何方立止之仲淳曰何言之易疏三方作五劑一日夜飲盡次早瘧止先二劑清暑用大劑竹葉石膏湯加桂枝以其渴而多汗也次二劑健脾去積滯用橘紅白豆蔲白术茯苓榖蘖烏梅扁豆山查麥芽最後一劑人參一兩生薑皮一兩水煎露一宿五更溫服盡劑而效同上顧伯欽患瘧仲淳之門人疏方以白虎湯加人參一兩一庸工云豈有用參至兩數者乎改用清脾飲二十餘劑而瘧不止體尫弱仲淳至笑曰此虛甚非參不可吾徒不謬也投以大劑參耆一劑而瘥人參一兩黃耆蜜炙一兩知母蜜炙五錢陳皮二錢乾葛二錢甘草八分石膏五錢同上莊斂之妾患瘧寒少熱甚汗少頭痛不嗜飲食余為診脉洪數而實用麥冬五錢知母三錢五分石膏一兩五錢竹葉六十片粳米一撮橘紅二錢牛膝一兩乾葛茯苓扁豆各三錢三劑不應忽一日凡寒熱者再昏迷沈困不省人事熱甚危急斂之過余云恐是虛瘧前方石膏知母竹葉似近寒凉非其治也余心亦疑為去石膏等而加人參二錢已别矣余追想前脉的非屬虛急令人往祝令其將參煎好勿輕與服待按脉加斟酌焉次早往視其脉洪數如初急止人參勿服惟仍用前方而加石膏至二兩何首烏五錢令其日進二劑瘧遂止莊斂之前患瘧妾越一載忽頭痛如裂心內雜亂不清喉作痛失音舌破咳嗽有痰胸膈飽脹惡心不思飲食熱後頻出汗方解平時有心口痛症并作下元無力如腳氣狀斂之疑為傷食余曰此受暑之症即前年所患瘧而勢加劇耳法當先去其標令以石膏二兩麥冬牛膝各五錢知母貝母花粉各三錢橘紅二錢半鱉甲四錢竹葉一百五十片河水煎服三四劑心內清頭疼喉痛失音舌破飽脹寒熱俱愈但惡心不思食如故而心口痛下元無力不减為去石膏知母竹葉鱉甲貝母花粉而加延胡索木瓜竹茹各二錢五靈脂七分生蒲黃黃芩錢半苡仁八錢石斛扁豆白芍各三錢枇杷葉三片炙草四分幾十劑而愈同上髙存之甥女嫁後患胎瘧久不止仲淳云病在陰分以人參五錢牛膝一兩兼健脾清暑一劑而止同上章衡陽子室患瘧後失音寒熱愈甚告急仲淳仲淳云此必瘧時不遇明眼人妄投半夏故也投以大劑麥冬茯苓炙甘草鱉甲知母貝母數劑而瘳同上來天培治潘康侯季秋患瘧惡寒發熱頭疼身痛嘔吐無汗腰重腿痠間日而發脉之沈而弦此寒邪閉伏募原不能外解也以柴葛解肌羌芎止頭痛藿香廣半止嘔吐枳桔利肺氣白豆仁溫胃桂枝達募原領邪外出不使復入茯苓淡滲利竅加薑棗和營衛一劑諸症已瘳沈明生治丁又銘食後動怒復受風邪惡寒發熱連日委頓咸謂停食感冒耳曰寒以時而來熱得汗而解脉弦且數雖素未患瘧瘧從此開已而果然與清脾飲加减寒熱漸輕但莖卵日縮有類陽痿甚憂曰無慮也此非傷寒厥陰危症亦非陽衰者比乃陽明熱極不潤宗筋所謂諸痿生於肺熱熱極反兼寒化也若謂虛而補之誤矣乃用芩梔等劑火而莖卵如故瘧亦止惟便祕日久然不脹不疼此瘧時多汗汗多則津液燥而腸胃涸俟飲食漸進參术滋補氣血充而便自行勿亟也或診之謂邪氣方實安得用補及今下之尚可為也與承氣湯服半日許便不行而莖縮再延診仍與調補數日進參二兩餘去宿垢甚多而全愈鼒于是症得三益焉於其初也可驗瘧於受邪之始於其中也知痿不盡由陽事之瘧王節齊言之詳矣其末也知便祕有服參术乃通不可遽然攻下若下之不當雖硝黃亦不能蕩滌徒令真元耗損在經固有明訓而世但知堅者削之未詳塞因塞用之法耳錢國賔治大同右營把總張道患瘧七年奄奄一息診之六脉弦長尚有胃氣乃足太陰脾經痰結腹右名瘧母也且久病血凝經絡不攻痰血病不愈也內經曰瘧之間日作者邪氣深入薄於陰陽氣獨發陰邪內著陰與陽爭不得出是以間日而作先以四物湯加桃仁紅花牛膝人參蒼白术服十餘帖經絡方活瘧轉陽分又以八珍湯加黃耆一錢何首烏一兩服十帖補養正氣瘧輕漸早又以常山三錢酒鈔七次陳皮甘草各一錢五分葱三段薑五片煎露空心熱服瘧止又以雞蛋上透一孔用簪攪勻清黃入畨錢木鱉一個真麝四厘紙封頭飯上蒸熟去殼去木鱉不用熱酒喫雞蛋日日空心一個月餘瘧母消盡凡遇久瘧不如此法不起也施渙之豫至交也夏秋間自都至吳門就婚橫塘初冬以彌月親戚㑹飲飲散而病寒熱頭痛自服芎蘇飲一劑不愈即進理中湯轉甚蓋以新婚故自疑為陰症也自是所延醫咸以溫補進日益困亟使詣杭招豫比至已十餘日矣入門見煮藥未進診之脉沈弦而數且六七至舌强胎黑而燥自言服溫補後寒熱已退唯大便不行小便頻數夜間尤甚幾五六十次鬲間時有冷氣上冲日唯進粥甌許奄奄危殆未嘗何症曰此伏氣為瘧也小便頻數者內熱下迫也其出必㸃滴其色必赤濁驗之果然至冷氣上冲乃熱鬱中宫猶火熖之上必有冷氣也其大便不行則內熱而燥結不待言矣夫邪伏既深其發乃遲何得遽用溫補幸壯年臟陰未竭急投凉解得寒熱再作乃可無虞叩所煎藥則人參白术薑附桂萸棗仁五味等云昨已服一劑病勢不减今用參三錢桂附俱用錢半及考前方皆二陳四君丁桂薑萸之屬曰今日再進參术桂附則不可為矣以小柴胡小陷胸合白虎作一劑與之其友壻惶惑無錯堅不肯從蓋洞庭醫者主於其家就中為難耳曰既不相信請即原舟告辭雖誼屬至友來為治病非送殮也涣之聞乃懇留治乃令以藥具相付親與調煎服後小便遂不頻數次日粥加進再與前方則寒熱大作而舌黑漸退神氣漸爽又去白虎二劑寒熱减小便長又二日大便去黑燥甚多改用甘露飲加减數劑而安許民懷年近三十患胎瘧適禾中名醫寓杭延視見其舌胎如爛鐵之剝蝕有胎處淡黃無胎處則深紫如猪腰三四發即困憊不堪杖而後起飲食驟减日啜薄粥兩甌遂不敢與藥診之脉虛數而弦左寸鼓而上溢右尺微弱曰此手足兩少陰素虛因受暑邪入包絡經云暑傷心舌乃心之竅故見症如是初與黃連香薷飲一劑即思食繼與𨗳赤散合益元舌紫退再與人參小柴胡寒熱愈愈後乃告曰其戚友同於是日發瘧者共三人又皆胎瘧其二人死矣一葉姓一周也痢陳良甫治一婦人病痢疾越四十日服諸藥不愈召診之六脉沈弱大凡下痢之脉冝沈冝弱但服十全大補湯薑棗煎成加白蜜半匙再煎數沸服之愈良方醫說續編一婦人泄㵼不止似痢非痢似血非血其色如濁酒診之則六脉沈絶衆醫用熱藥及丹藥服之則發煩悶乃先用敗毒散加陳米煎次用胃風湯加粟米煎愈泊宅編云姚祐自殿監遷八座母夫人病痢諸藥不效令李昂筮軌草有真人指靈草之語一日登對上訝其色瘁具以實奏詔賜一散子數服而愈仍喻只炒椿子熟末之飲下薛立齊治司馬王荆山患痢後重服枳殼檳榔之類後重益甚食少腹痛此脾胃傷而虛寒也用六君子加木香炮薑而愈祠部李宜散患血痢胸腹膨脹大便欲去不去肢體殊倦以為脾氣虛弱不能攝血歸源用補中益氣湯加茯苓半夏治之漸愈後因怒前症復作左關脉弦浮按之微弱此肝氣虛不能藏血用六味丸治之而愈朱丹溪治一老人年七十面白脉弦數獨胃脉沈滑因飲白酒作痢下血淡水膿後腹痛小便不利裡急後重參术為君甘草滑石檳榔木香蒼术最少下保和丸二十五丸次日前症俱减獨小便不利以益元散服平治㑹草寧皇患痢召曾醫不記名入視曽診御畢方奏病症未有所處慈明立御榻後有㫖呼曽防禦官家喫得感應丸否曽連稱喫得喫得慈明又諭須是多把與官家曾承教㫖對以須進二百丸遂止曽時坐韓黨被譴止亦遂於元降秩上更增三秩後寧皇不豫久謂左右曰惟曾某知我性急召入診訖鳴咽不勝上曰想是脉兒不好也曾出自診其脉謂家人曰我脉亦不好先寧皇一夕而逝四朝聞見録葉紹翁竇材治一人休息痢已半年元氣將脫六脉將絶十分危篤為炙命關三百壯關元三百壯六脉已平痢已止兩脅刺痛再服草神丹霹靂湯方愈一月後大便二日一次矣一人病休息痢竇令炙命關二百壯病愈二日變注下一時五七次命服霹靂湯二服立止後四肢浮腫乃脾虛欲成水脹也又炙關元二百壯服金液丹十兩一月而愈曾魯公痢血百餘日國醫不能療陳應之用鹽水梅肉一枚研爛合蠟茶入酸服之一啜而安大丞梁莊肅公亦痢血應之用烏梅胡黃連灶下土等分為末茶調服亦效蓋血得酸則斂得寒則止得苦則澀故也醫說本草綱目宋張叔濳知劔州時其閣下病血痢一醫用平胃散一兩入川斷末二錢水煎服即愈紹興壬子㑹稽時行痢疾叔濳之子以方傳人往往有驗小兒痢尤效本草綱目劉禹錫傳信方云豫曽苦赤白下諸藥服遍久不瘥惟久痢故可用後方轉為白膿令狐將軍傳方用訶黎勒三枚兩炮一生並取皮末之以沸漿水一合服之若止水痢加一錢七甘草末謂加甘草末一錢也若微有膿血及血多加三七亦加甘草本草胡大卿一僕患痢五色已半年遇杭州一道人教用大熟瓜蔞一個煅存性出火毒為末作一服溫酒服之遂愈本事方同上張子和曰一男子病膿血惡痢痛不可忍有實熱之毒忽見水浸甜瓜心酷喜之連皮食數枚膿血皆已人言下痢無正形是何言也止知痢是虛冷溫之澀之截之此外無術矣豈知風暑火濕燥寒六者皆為痢此氷蜜甜瓜所以效也潘塤曰豫蔓孫年十二一日內外熱如火頭眩醫以為外感汗之不解既而腹痛小水不行又以為內傷下之不愈後四五日變赤痢晝夜無度小水㸃滴腹連膀胱脹悶醫乃專用痢藥而病益劇心切憂之詢之家人曽食何物以曽飲冰水告豫曰病坐此矣醫投四苓六一不應豫曰陰氣結於上陽氣陷於下膀胱有上口無下口氣不能化而出也須用膀胱本經藥溫以散之升以舉之衆醫不敢豫用溫六丸作散主天水散加乾薑茴香升柴煎服一二帖小便行三帖痢止而愈楮記室李時珍治華老年五十餘病下痢腹痛垂絶已備棺木用延胡索三錢為末米飲服之病即减十之五調理而安本草綱目薛立齊治一人利後嘔噦脉洪大按之虛細作渴引飲諸藥到口不納作脾胃虛寒不能司納以參术炮薑等分飯丸米飲不時送下服至三兩聞藥不嘔以六君子加炮薑調理而安王嶦如治一人痢如豆汁日夜百餘次羣醫投以清凉下墜之藥愈危六脉沈弱此脾虛受濕也以補中益氣湯加羌防蒼术二三劑愈王又逸治一人痢後腳軟難行曰久痢傷氣下多亡陰氣血俱虛不能榮養其筋骨也用八珍湯加牛膝杜仲木瓜薏仁而愈陳三農治一婦患痢所服皆清凉剋伐之藥致脾胃虛弱血無所統日下數升遇有所觸其下益甚欲補血恐脾愈寒欲引歸經血去殆盡遂用陽生陰長之義以益氣湯溫養中氣而漸安一士勤於舉業夏末患裡急泄白膿衆以痢治曰非也此積勞傷脾脾氣下陷即東垣所謂飲食不節起居不時上升精華之氣反下陷云云也用補中益氣湯二劑而安龔子才治劉司寇年近七十患痢膿血腹痛諸醫弗效診之六脉微數此肥甘太過內有積熱當服酒蒸大黃一兩清利之劉曰吾衰老恐不勝惟滋補平和乃可因再四引喻始勉從之逾日而愈一人下痢小腹急痛大便欲去不去以脾胃氣虛而下陷也用補中益氣湯送八味丸二劑而愈此等症候因利藥致損元氣肢體腫脹而死者不可枚舉一人患痢後重自知醫用黃芩芍藥湯後重益甚飲食少思腹寒肢冷龔以為脾胃虧損用六君子湯加木香炮薑二劑而愈趙養葵治四明徐陽泰體素豐多火善渴雖盛寒牀頭必置茗碗或一夕盡數甌又時苦喘急質之趙趙言此屬鬱火症常令服茱連丸無恙也丁巳夏徐避暑檀州酷甚朝夕坐冰盤間或飲冷香薷湯自負清暑良劑孟秋痢大作始三晝夜下百許次紅白相雜絶無渣滓腹脹悶絞痛不可言或謂宜下以大黃趙勿顧也竟用參术薑桂漸愈猶白積不止服感應丸而痊後少嘗蟹復㵼下委頓仍服八味湯及補中重加薑桂而愈夫一人之身厯一嵗之間耳黃連苦茗不輟口而今病以純熱瘥向若投大黃下之不知何狀又病室厚時喘逆不眠用逍遙立安又患便血不止服補中黑薑立斷不再劑喻嘉言治張仲儀初得痢疾三五行即診之行動如常然得內傷之脉而挾少陰之邪曰此症宜一表一裡但表藥中多用人參裡藥中多用附子方可無患若用痢疾門諸藥必危之道也張以平日深信經取前藥不疑然病勢尚未著也及日西忽發大勢身重如巨石頭在枕上兩人始能扶動人事沈困急服完表二劑次早診視即能起身出房再與參附二帖全愈若不辨症用藥痢疾門中幾曽有此等治法乎周信川年七十三平素體堅秋月病痢久而不愈至冬月成休息痢一日夜十餘行面目浮腫肌膚晦黑脉之沈數有力謂曰此陽邪陷入於陰也吾以法治之可愈以人參敗毒散煎好用厚被圍褥上殿定肛門使內氣不得下走內氣提掇在上豈可以物塞定其說未免荒謬然後以前藥滚熱與服良久又進前藥遂覺皮間有津津微汗再溉以滚湯教令努力忍便此却有理不得移身如此約二時之久皮間津潤總未乾病者心躁畏熱忍不可忍始令連被卧於牀上是晚止下痢二次後用補中益氣湯一日夜止三次不旬日全愈蓋內陷之邪欲提之轉從表出不以急流挽舟之法施之其趨下之勢何所底哉聞王星宰患久痢諸藥不效蘇郡老醫進以人參敗毒散其勢差减大有生機但少此一段幹旋之法竟無成功故凡遇陽邪陷入陰分如久瘧久痢久熱等症皆當識此意使其緩緩久久透出表外方為合法若急而速則恐才出又入徒傷其正耳按休息痢多緣誤治而成或兜澀太早或有表症而驟下之古人多以感應丸為治法至良也兹以人參敗毒治其理者至以布蛋殿其肛謂內氣不下走亦好奇之過耳朱孔陽年二十五形體清瘦素享安逸夏月因搆訟奔走日中暑濕合內鬱之火而成痢疾日夜一二百次不能起牀以粗紙鋪茵上頻頻易置但飲水而不進食其痛甚屬肛門如火烙揚手擲足躁擾無奈脉之弦徑緊急不為指撓曰此症一團毒火藴結陽胃其勢如焚救焚須在傾刻若二三日外腸胃朽腐矣乃用大黃四兩黃連甘草各二兩入大砂鍋內煎隨滚隨服服下人事少寧片時少頃仍前躁擾一日夜服至二十餘碗大黃俱已煎化黃連甘草俱至無汁次脉勢少和知病可愈但用急法不用急藥改用生地麥冬各四兩另研生汁以花粉丹皮赤芍甘草各一兩煎成和汁大碗咽之以其來勢暴烈一身津液從之奔竭待利止生津則枯槁難回矣今脉既减則火邪已退不治痢而痢自止豈可泥泥滯之藥而不急用乎服之果痢止但遺些少氣沫略進腐漿米汁調養旬餘始能消榖亦見胃氣之存留一線者不可少此焦頭爛額之客也浦君藝病痢初起有表邪未散誤用參术固表使邪氣深入又誤服黃連凉解大黃推蕩治經月餘胃氣不運下痢日夜百餘行一夕嘔出從前黃連藥汁三五碗嘔至二三次後胃與腸遂打成一家內中幽門闌門洞開無阻不但粥飲直出即人參濃膏才吞入喉已汨汨從腸奔下用大劑四君子湯煎調赤石脂禹餘糧二末連連與服服後勢少衰但腹中痛不可忍浦曰前此痢雖多然尚不痛服此藥而痛增未可服矣喻曰此正所謂通則不痛痛則不通之說也不痛則危痛則安何樂而不痛耶仍以前藥再進俟勢已大减才用四君子倍茯苓十餘劑全安李士材治孫瀟湘夫人下痢四十日口乾發熱飲食不進腹中脹悶完榖不化尚有謂邪熱不殺榖者計服香蓮枳殼豆蔲厚朴等三十餘劑絶粒五日命在須臾診之脉大而數按之豁然詢得腹痛而喜手按小便清利此火衰不能生土內真寒而外假熱也亟煎服附子理中湯冰冷與服一劑而痛止六劑而熱退食進兼服八味丸二十餘日霍然起矣許郡侯女痢疾腹痛脉微而軟李曰此氣虛不能運化精微其窘迫後重者乃下陷耳用升陽散火湯二劑繼用補中益氣湯十劑而愈一婦人痢疾一月諸藥無功李診之曰氣血兩虛但當大補痢門藥品一切停廢以十全大補連投十劑兼進補中益氣加薑桂二十餘劑而安張兵尊秋間患痢凡香連枳朴等劑用之兩月而病不衰李脉之滑而有力失下故也用香連歸芍陳皮枳殼加大黃三錢下穢物頗多診其脉尚有力仍用前方出積滯如魚腸者約數碗調理十餘日而痊毛撫軍痢如魚腦腸鳴切痛聞食則嘔所服皆芩連木香菖蒲藿香橘紅芍藥而已後有進四君子湯者疑而未果診得脉雖洪大按之無力候至左尺倍覺濡軟此命門火衰不能生土亟須參附可以回陽因問但用參术可得愈否李曰若無桂附雖進參术無益於病且脾土大虛虛則補母非補火乎遂用人參五錢熟附一錢五分炮薑一錢白术三錢連進三劑吐止食粥再以補中益氣加薑附四劑後即能視事吳又可治張德甫年二十患噤口痢晝夜無度肢體僅有皮骨痢雖减毫不進榖食以人參二錢煎湯入口不一時身忽浮腫如吹氣毬自後飲食漸進浮腫漸消腫間已生肌肉矣髙鼓峰治朱殿臣病痢日踰百餘次身發熱飲食不進所用皆檳榔大黃之屬髙曰此破氣利血藥也治滯下當調氣不當破氣當和血不當利血以當歸白芍生地黃芩木香等數大劑飲之三日而愈馮楚瞻治王姓人久患重痢延診時當六月自腹至陰囊皆重綿厚裏稍薄則痛甚其兩足心又覺熱甚必重扇始可飲食不思甚危困脉之寸强關尺並弱曰此中氣久虛氣不升降陰陽阻隔似痢非痢誤用香連苦寒之劑以致抑遏陽氣於九地之下而中宮藏納氣之所反已空虛且久痢陰陽兩亡故足心之熱陰虛所致腹中之寒陽虛所由中宮之陽宜溫而補下陷之陽宜清而升理難並行今但先去其中寒之阻隔則鬱遏下極之火自能上升大用附子理中湯加五味子以斂之二三劑後腹寒足熱俱减六七乃以歸脾湯加肉桂五味煎湯送八味丸而愈陳秀才患白痢甚密診之兩寸略洪兩尺左關甚弱舌有黑胎此肝不能踈泄腎不能閉藏宜痢之重密矣且真陰虧極於下真津燥槁於上水乘火位故赤舌變黑也若服黃連適堪其害乃果有以香連進者服後痢更無度復延馮與八味湯大料用人參冲服漸得輕可調理月餘而安楊乘六治沈某病痢裡急後重日夜百餘次發熱口渴體倦懶言倦卧少食小便不利或用痢門清熱消滯套藥數劑轉甚脉之緩大無力面色嫩白舌胎微黃此挾虛感寒不可以痢疾正治之也乃用補中益氣加白芍炮薑一劑而愈急重漸緩痛痢隨减再劑身凉食進諸症悉愈蔡某病痢臍腹絞痛裡急後重日夜無度自知醫所服皆培腎燥脾之劑補澀太早遂成休息幸不誤事但病根不斷每周時或五七次遷延三載形肉漸脫力不能支楊診之脉附骨而緊左尺尤甚面晃白舌淡嫩且胖且滑此寒積在大腸底諸藥不能到故經年纍月痢無止息也今脾腎大虧須服養榮八味各數十帖待其氣血充足然後蠟丸巴豆一枚大如龍眼空服以熱水送之則藥到積所乃化其積自除矣如法治之果不再發姚某痢疾腹痛後重膿血並見日夜無度或用利氣凉血清火解毒一切消尅之劑病不减而解出斷腸一段長半尺許延楊診述病情用藥次第并詢斷腸之故思之良久曰决無此事夫腸者起自胃之下口厯幽門䦨門以至肛門大小相連若中既斷矣何能自出肛門耶且腸既出於昨日則上下斷絶已久何至今日便中膿血仍相續不絶耳蓋腸中滑膩稠粘如脂如膏粘貼腸上之一層其形外圓中空有似乎腸而實非腸也試撥之必腐矣果然診其脉細數而弦按之勒指舌如鏡而面無神此木氣太甚胃氣將絶無救矣數日果歿易思蘭治省亭殿下七月病痢始服清次行和解又次滋補月餘轉甚每日行數次肚腹絞痛但泄氣而便不多起則腰痛屈曲難伸胸膈脹滿若有物礙噯氣連聲四肢厥逆喘息不定診之兩寸沈大右寸更有力右關沈緊左關弦長而洪喜兩尺沈微來去一樣曰此神勞氣滯之病也以暢中湯進之製香附八分蒼术一錢神麴三錢五分撫芎七分黃芩八分枳殼三分蘇梗五分甘草三分薑一片棗二個服後兀兀欲吐冷氣上升噯氣數十口即大便去穢汚頗多胸次舒暢腹中覺饑自午至酉止去一次四肢不厥肩背輕快六脉平復但心肉怔忡頭目昏眩飲食無味用六君子湯加香附砂仁二劑胃氣漸復眩暈怔忡乍止乍作又以補中益氣加蔓荆子茯神棗仁黃柏半月乃全愈張路玉治項鳴先尊堂下痢血色如莧汁服消剋苦寒芩連大黃之類愈甚不時發熱痞悶六脉瞥瞥虛大右關獨顯弦象按之則芤此氣虛不能統血之候與補中益氣加炮薑肉桂四帖而安郭然明之室患五色痢日夜數十次兼帶下如崩誤服黃連大黃十餘遂隔塞不通口噤不食半月餘至夜必大發熱躁渴六脉弦細而疾此足三陰俱虛之候與理中加桂苓木香烏梅以調其胃次與加减八味湯𨗳其陰火而全安某刑部髙年久痢色如莧汁服芩連白芍之類二十餘劑漸加厄逆六脉弦細如絲與理中加丁香肉桂疑不服仍啜前藥數日病愈甚而驟然索粥諸醫皆以能食為慶張再診則脉至如循刃刃真臟脉也此中氣告竭求救於食除中症也與傷寒之例同不可為矣禇某尊堂深秋久痢口噤不食者半月餘但飲開水及瓜汁啜後必嘔脹腸鳴絞痛不已煩渴悶亂至夜轉劇所下皆膿血日夜百餘次小水涓滴不通六脉皆弦細乏力驗其積沫皆瘀淡色晦詢其所服皆芩連檳朴之類所見諸症俱逆幸久痢脉弱尚宜溫補用理中加桂苓紫菀調之服後小便即通得稍寐數日糜粥漸進痢亦漸减更與理中倍參伏龍肝湯泛丸調理而痊陳進士捷歸抵家即患河魚腹疾半月來攻尅不效噤口粒米不入且因都門久食煤火肩背發長不赤不疼陷伏不起發厄神昏診之六脉弦細欲絶面有戴陽之色所下瘀晦如爛魚腸腦症雖危幸脉無旺氣氣無喘促體無躁擾可進溫補但得補而癰腫焮發便可無虞遂疏保元湯每服人參三錢黃耆二錢甘草肉桂各一錢伏龍肝湯代水煎服一啜而稀糜稍進兩啜而後重稍輕三啜而癰毒墳起瘍醫敷治其外囑守前方十餘劑而安韓晉度春捷錦旋患腹痛泄㵼下血或用香連丸遂飲食艱進少腹急結雖小便癃閉而不喜湯飲面色痿黃日夜去血五十餘度診之氣口沈細而緊所下之血瘀晦如莧菜汁與理中湯加肉桂二錢一劑溺通小腹即寬再劑血减食進四劑泄㵼止三四次去後微有白膿與補中益氣加炮薑四劑而愈張飛疇治朱元臣子患五色痢二十餘日胸膈脹滿粥飲不進服藥罔效另延兩醫一用大黃一用人參不能决求診之曰用大黃者因其脹滿脉大也用人參者因其痢久不食也痢久不食大黃斷斷難施膈滿作脹人參亦難遽投擬伏龍肝為君專溫土藏用以濃煎代水煎焦术茯苓甘草廣藿木香炒烏梅一劑利减食進再劑而止遂不藥調理而安柴嶼青治解元周讓谷在安撫張西銘京寓時半年久痢不止或用參耆赤苓粟殼肉果不效夜起六七次日間不計其數膿血雜下己頻於殆始求治以久痢亡陰不宜再用赤苓利水亦非兜澀之所能止且久痢寒積在大腸底現今兩脉帶緊欲用蠟豆丸衆皆不敢不得已勉用補中益氣加茱萸製川附一劑而减後兼用八味丸而愈張三錫治一人患痢發寒熱頭痛左脉浮緊而右脉滑大乃內傷挾外感也先用敗毒散加薑葱一服表症悉除但中脘作脹悶後重不已以平胃散加枳殼木香檳榔山查二服脹悶移於小腹投木香檳榔丸三錢下粘硬之物而愈一婦病痢自投承氣湯二服不應診之左脉浮而帶弦右三部俱沈關脉略滑必鬱悶中食所致病家云素惱怒遂以厚朴蒼术香附撫芎舒鬱山查檳榔橘皮木香理氣白芍調中三服而愈一人痢初愈遂飲燒酒雜進肉麵胸口脹悶發寒熱右脉弦滑倍常知飲食酒毒為患也病後中氣未復火邪尚存多食自難傳化燒酒復助其毒勢在不救今食填胸中得吐乃有生意經云在上者因而越之是也不信自服巴豆丸藥下咽去血升許而殂一人夏月逺行飲酒致下痢皆純血日夜無度心下脹不食脉三部俱弦滑而數先與山查枳實檳榔橘紅香連以和其中次與木香檳榔丸以𨗳其滯脹悶已除下血愈甚遂以四物用生地條芩茱連丹皮二劑血止一半再加地榆三服已一人痢脹痛自服大黃丸一時痛轉甚手足俱冷脉沈伏知寒凉用早也投炮薑理中湯加厚朴蒼术山查一服外用炒鹽尉之下膈周時即定後用香連白芍厚朴枳殼等調理而痊一人患痢二月不愈穢汙在牀六脉弦而弱投補中益氣加酒炒白芍八貼始止二十貼而痊一人病痢日久不止四肢俱腫而脉細小尚可救與參苓白术散加肉豆䓻少許作湯服愈一婦病久痢食時身熱左脉浮數右脉滑數詢其飲食雖病未减至劇始不能食與倉廩湯先去其熱後以枳术人參陳皮查麯又二服腹中漸寬後重不止乃以調中益氣湯下木香檳榔丸二服下穢物碗許愈陸養愚治一人因路途感冒頭微痛身微熱飲食如故數日後患水泄小便赤澀自服胃苓湯二劑泄不止而反見積又服芩連白芍木香檳榔輩二劑亦不效診之兩手浮弦沈按澀數此因表氣不舒致令裡氣不順偶值脾胃不調而作泄也乃以五積散微加白豆仁木香二劑大汗而諸症悉愈董潯陽素有酒積因而患痢雖奉養豐而稟賦厚而清涼消𨗳過多今痢已少瘥而大便猶滯小便短數黃赤身時熱上壅頭面鼻塞耳聾眼昏口燥脉之浮大而數按之而駛或謂苓連滑石但可清下焦之火當以凉膈散清上焦以佐之且謂􅎃尚洪盛未可議補陸曰公平日脉頂指洪盛以今日較之已弱極矣凡九竅不利由於陽氣工盛而致則當清㵼若由於腸胃之所生則當補斂今㵼痢久數用清凉消𨗳之劑腸胃有不虛乎夫中焦氣血不足多致虛火上炎下迫用人參白术補氣為君當歸白芍養血為佐五味麥冬棗仁斂耗散之氣以為臣甘草茯苓緩以滲之以為使待上焦既清而後提其下陷之陽則便實溺清而通暢矣二劑後再以補中益氣湯加减服之全愈陸肖愚治吳南邱八月間醉飽後使內明日患痢晝夜百餘次赤白相間狀如爛肉腹中溫溫作痛四肢厥冷脉之緩大無力兩尺尤弱謂此症即冝補塞先書人參肉果二味其子大駭謂無積不成痢豈有一二日即用補塞者不得已始與調氣養榮湯無進退更醫投以芩連檳榔木香等藥腹痛如劙足厥如冰冷汗氣促食入即從大便而出色尚未變再亟診身體不能轉側大便如流幸脉與神氣未絶因用大料人參附子理中湯加肉桂肉果一劑痛减數劑足溫泄少止後用人參至二斤始起鬚髮盡落鞠二府九月間赤痢腹痛裡急後重或用芩連檳朴白芍滑石一劑痛覺增二劑痛更甚乃謂醫曰通則不痛汝為我用大黃下之醫唯唯其公子力爭不可診之面赤戴陽唇若塗硃舌白滑無胎所下有泥血如豆大者數十枚餘淡黃而溏其脉浮按微數而大沈按遲而無力曰此痛乃寒也當以溫熱解之蓋脉無熱大而無力者為虛寒痢赤為熱色晦而便溏者為虛寒用白芍五錢醇酒炒數次薑灰二錢炙甘草桂附各一錢木香五分棗二枚一劑痛减能即卧二劑痛止改加升麻參耆數劑而後重㵼痢並除矣朱丹溪治青田人肚痢紅紫血下墜逼迫不渴不熱用白术白芍各一兩陳皮枳殼歸身滑石各半兩甘草炙二錢桃仁三十六個分八帖下實腸丸三十粒許叔微曰陳侍郎經中庚戌秋過儀徴求診初不覺有疾及診視肝脉沈弦附骨取則牢豫曰病在左脅有血積必發痛陳曰誠如是前某守九江被召冒暑沙長江暨抵行朝血痢一塊大如杯旬日如碗大痛發則不可忍故急請公祠以歸耳奈何豫曰積痢不强止故積血結於臍脅下非抵當丸不可渠疑而不肯服次年竟以此終鄭奠一治江南臬司多公患噤口痢粒米不進令服牛乳久之而瘥陸祖愚診吳翺𤣥年近七旬秋初患痢起於醉飽房勞診之容顔黯滯六脉弦緊此形症不足脉候有餘明是陽亢陰微須用參附挽回否則不出三日滿座閧然醫者從而和之乃投以鼎串之藥燒爇草頭令病人聞吸以開胃氣次早痢果减六七漸進薄粥談笑吟詩大有起色閲二日而訃音至矣陳三農治一婦久痢不止口乾發熱飲食不進猶服香連等藥完榖不化尚謂邪熱不殺榖欲進芩連數日不食熱正危迫診之脉大而數按之極微詢之小便仍利腹痛喜手按此火衰不能生土內真寒而外假熱也小便利則不熱可知腹喜按則虛寒力辨亟進附子理中湯待冷與服一劑而痛止連服數劑而愈撫州銅客病痢甚危懸五十金酬醫太學生倪士實授一方用當歸末阿魏丸之白湯送下三服而愈續金陵瑣事胡竹亭授一治痢方採黃花地丁草搗取自然汁一酒杯加蜂蜜少許服之神驗薛立齊治崔司空年踰六旬患痢赤白裏急後重此濕熱壅滯用芍藥湯內加大黃二錢一劑减半又劑全愈惟急重未止此脾氣下陷用補中益氣湯送香連丸而愈馬儀元治一人年逾古稀下利膿血調治半年不愈脉之左見弦澀右關尺微濡按之則幾微欲絶此脾腎俱勞之候也脾主轉輸腎主二陰二臟不治將何恃為健運蟄藏之本耶病久年髙所喜發言清越神氣明爽雖危可治用人參三兩熟附三錢服後三四時許覺周身肌肉脹不可忍疑藥之過急召診則右關尺俱透按之有根曰脉透者氣充於內也肌脹者氣達於表也前方少减附子連進五劑利减半糞微溏再服症减七八但小便少而微渴與五苓散减桂加參小便如泉再以補中益氣調理兩月而安凌伯尹患痢兩月不止百治益甚診之右關尺虛而結滯胸中有塊􅊳起如拳水漿不得下咽是噤口矣曰此症屢經誤治邪未得除而胃氣已傷客邪乘虛結於心下與痰飲相搏而成痞水不得下咽者土虛不能勝水且以寒飲內格而不入也與半夏㵼心湯二劑結塊漸平再劑而症减七八漸進粥飲蓋外邪挾內飲相結其留連膠固有非一表一裏所能盡者攻之則正愈傷補之則痞益甚然舍此則治法何從而施乃用人參大棗以安胃氣之虛而加炮薑半夏黃芩黃連以滌痰治邪而成傾痞之用正如良吏治民威惠兼著而治功成矣包瑞溪學憲傳治血痢痛甚方白芍酒炒五錢此一味仲淳加入者枳殼槐花同炒去槐花五錢升麻醋炒七分真川連薑汁炒五錢滑石末三錢乳香沒藥各七分半山查肉三錢甘草五分試之神效廣筆記黃聚川年兄太夫人年八十餘偶患痢胸膈脹絶粒數日豫以升麻人參黃連蓮肉方投之參至一兩諸子駭甚再問豫豫曰遲則不救矣一劑啜粥再劑腹中響一泄痢即止今年九十餘尚健也同上陳赤石督學因校士遇勞感暑遂滯下純血醫皆難之陳刺史曰此非繆仲淳莫能療也使者旁午得之吳門一日夜馳之武陵診之其所由遂用人參五錢升麻七分炙甘草紅麴各錢半烏梅二枚川連三錢白芍二錢連肉四十粒煎調滑石末五錢二劑而愈督學曰痢止矣心搖搖不能閲卷奈何仲淳曰此勞心太過暑因客之故耳加竹葉乾葛棗仁一劑遂平庚子秋華氏妹歸寧忽痢日夜幾百行身熱發嘔一嘔數十聲不絶吳醫爭欲下之且曰補即死矣時仲淳以先王母病留湖濵憐其促治後事甚亟曰既已知危何不以藥試之服如金丸一味黃連薑汁和丸因思飲豫固守仲淳前方以人參炒白芍扁豆升麻滑石炙草橘紅煎下如金丸二劑勢稍定更數服愈華水部至今感服同上一少年貴介暑月中出外飲食失宜兼以暑熱遂患滯下途次無藥病偶自止歸家腹痛不已遍嘗諸醫之藥藥入口痛愈甚亦不思食仲淳視之曰此濕熱耳其父曰醫亦以濕熱治之而轉劇問投何藥曰蒼术黃連厚朴枳殼陳皮等仲淳曰誤也术性溫而燥善閉氣故滯下家忌之郎君陰虛人也尤非所宜更以滑石一兩為細末丹皮汁煮之别以白芍酒炒五錢炙草二錢炒黑乾薑五錢水煎調服右末服之須臾小便如注痛立止同上秦公藩病痢醫誤投澀藥一劑痢止濕熱無自而出遍攻肢體骨節間以致項弦目赤肩臂腕膝足脛俱發腫痛甚不能轉側仲淳疏方寄之用白芍石斛牛膝木瓜黃柏苡仁炙草車前茯苓痛雖止尚不能轉側更用蒺藜菊花首烏胡麻黃柏炙草復逾年愈其始病時一醫稍投參术痛極欲死此係本症陰虛有火又加濕熱暑濕交攻故現此症名痢風陰虛火多故不受補又不宜燥惟微寒清平之劑調之久之自愈立齊治一老人患痢驟用澀藥致大腸經分作痛此濕毒流於隧道而然以四物湯加桃仁酒芩紅花升麻枳殼陳皮甘草治漸愈因年髙胃弱竟至不起又一患者亦用澀藥環跳穴作痛與前藥去升麻陳皮甘草加蒼术黃柏柴胡青皮生薑十餘劑少可更刺委中出黑血而愈如手蘸熱水拍腿上有泡起去亦可不若刺穴尤速效也委中在膝腕中央橫紋中動脉便是韓户部左臂患一紫泡根畔赤腫大腸脉芤謂芤主失血或積血韓曰血痢未瘳以芍藥湯二劑更以人參敗毒散二劑瘡痢並愈沈明生治吳君一媳患痢四十餘日食少倦怠原醫以日久困憊當從補治無復可疑延診謂其染患以來膏粱未嘗一日去口則舊積徐新積復起旋生形雖虛而症固實也日雖久而積固新也治法應與初症同先進𨗳滯丸二服嗣用補消兼進仍囑其清虛調養後果全愈由此觀之初中末三法有難盡拘而望聞切之外不可廢問且吳俗有飽不死痢疾一語恣噉肥甘唯恐弗及何異藉冦兵而資盜糧耶蔓延日久馴致證實形虛欲補形則礙其證欲攻實則慮其虛始也求其多食而終至於不能食良可憫也因志之以戒夫世之患痢而不慎口腹者章素文母秋間患滯下脉與症本皆輕淺乃過於慎重泥髙年不可寒凉之說更醫至再亦惟將順主人情致令綿延不已最後延診力矯前非竟以黃連主治得瘥時有童鳴佩章石交也亦久痢亟以沈薦且言治此恙者莫過於沈而沈之善用亦莫過於黃連一味耳即診即告曰是症非附子弗痊章訝之謂童利下之色與夫作痛溺澀日期近逺頗與前症相類何用藥水火如是曰辨症不在多岐但須一矢破的童之滯下兼證皆似乎熱而詢其每欲圊時必先腰痛一語而得病根矣夫腰為腎府腎主二便乃胃家北門鎖鑰之司也虛則不能閉藏是以每欲更衣輒先作痛非與腹部之痛隨利减者可同日而語向皆用寒凉蕩滌主治疾何由平於是先以理中補中相合為劑嗣以八味丸益火之原果得奏績嗟夫症同治異孰謂可概施一法也哉吳有聲云壬寅秋豫病痢而劇郡治逾月氣息奄奄色毁骨瘠望者却走明生先生至診視之則曰是何中暑之深也家人疑之謂豫安坐書齊足不出户奚暑之乘先生决之於指斷之於心遂投以凉劑一服即有效不數日間而乃全愈蓋豫夏間曽製地黃以酒漬之每日必出諸酒而曝之烈日之中至夕仍還而漬之於酒如是者幾一月豫愚甚以為地黃之精神盡在酒也取而飲之而不知炎威之毒漸畜於酒者早已入余之肺腸此家人所不知即豫亦未悟逮病愈而推之始得而先生獨知其中暑之深則其視病可不謂神焉者哉聶久吾曰痢為險惡之症生死攸關然古今治法多罕十全豫以經驗既多病機漸悟乃自製此方所向輒效遂刋布廣施全活甚衆苐服者藥須道地尤不任意加减耳川黃連條芩生白芍查肉各五分陳枳殼炒檳榔厚朴薑汁炒青皮各八分當歸甘草地榆各五分紅花酒洗三分南木香二分桃仁泥一錢水二碗煎一碗空心溫服查再煎此方或紅或白或紅白相兼裡急後重身熱腹痛者俱可服其有便純紅便楊塵水大孔如竹筒等惡症古謂不治者急服此亦可救但遲緩毒壞臟腑為難救耳其有噤口者毒在胃口也此藥煎一劑分五六次緩緩服之令胃口毒氣漸開服完一劑後不惟藥可進而飲食亦漸可進矣不必另用他藥也單白無紅者去地榆桃仁加去白陳皮四分木香用三分滯澀甚者加酒炒大黃二錢服一二劑仍除之此方用之於三五日神效旬日內外亦效惟半月外則當加减如後黃連條芩白芍三味生用各四分酒炒各六分查肉一錢厚朴陳皮青皮檳榔各四分甘草生熟各二分半地榆醋炒當歸各五分桃仁泥六分紅花六分木香二分如延至月餘覺脾胃虛滑者用酒炒芩連白芍各六分陳皮厚朴木香各三分醋炒地榆四分紅花二分當歸人參白术熟甘草各五分以上方法用無不效間有不效者必其初投參术等補劑太早補塞邪熱在內久而正氣已虛邪氣猶盛欲補而澀之則助邪欲清而疏之則愈滑遂致不救豫當治一公子一仕官皆早投溫補不可挽回故表而出之以戒後張龍文年三十來九月患痢至十二月未瘥已無腹痛後重服補中益氣則不及至圊且下轉數延豫治與熟地杞子白芍棗仁米仁等初甚逆膈脹而利且五色幸彼能守藥弗更張再進而利遞减矣洎嵗暮已向愈脉之兩關滑大重按則弦戒之曰藥未可停恐立春後病再發己而果然其鄰醫就余方加補骨脂砂仁木香廣皮之類與之了不應且昏睡而多汗至四月中再求診則以前方加沙參麥冬蔞仁黃芩未二十劑而痊後環跳穴及趾腫疼痛流注無定所狀如痢後風仍前方加知柏川連數劑而安濮氏子住涌金門外甚貧窘患久痢脫肛諸治不效乃入城就豫診雖相去二三里途中必數登厠肛既不收行步殊苦與補中益氣湯加熟地一兩炮薑一錢服二劑竟愈范秀才年近七旬戊子二月患寒熱原有疝病至是胸脅少腹無不痛楚下利紅白一名醫治之有年其邀余診蓋乘便耳其脉弦數所喜者滑詢其小便短赤此純屬肝火下迫似痢而非痢也必多服香竄又值君火司天少陽當令於是乘其所勝而侮其所不勝所下皆太陰血津陽明脂膏也與生地女貞沙參麥冬川連蔞仁一劑已逾其半而名醫曰七十之年可服黃連之苦寒蔞仁之滑泄乎今下利而不與調氣健脾而反用滋陰潤肺此何治耶范乃拘儒復聽之治又一月將斃矣再延診仍前方加杞子白芍甘草數劑痢止痛除而愈瘧痢李易安金石録後序言其夫趙明誠因途中奔馳冒暑至行在旅邸病痁豫聞信驚怛念渠性素急病痁患熱必服寒凉藥疾可憂遂解舟下一日夜行三百里比至果大服柴胡黃芩瘧且痢遂以不起柴芩自是少陽藥用之不當便能為患然藥不對病雖甘草茯苓亦足以殺人也萬密齊治汪氏媳病瘧且痢用小柴胡合桂枝湯加當歸陳皮二十餘劑瘧愈隨以黃芩芍藥湯加人參治痢不效再思之悟曰此病得之內傷名為白蠱乃用升陽勝濕防風湯一劑而安陸肖愚治王笠雲八月間患瘧服藥已愈後復飲食不調大便㵼而變痢一日夜約一二十行皆積滯無糞腹疼後重身熱夜不安醫以芩連木香檳榔等藥投益甚脉之左手浮弦而弱右手沈數而微曰此瘧之餘邪也當先解經絡中邪熱則大便自固乃以機要防風芍藥黃芩湯加柴胡二劑身熱腹痛頓止後以調氣養榮湯數劑而精神如故孫文垣治董潯老家馬厨七月初旬患病二十餘日勢轉劇詢其症曰大發寒熱寒至不憚入灶熱至不憚入井痢兼紅白日夜八十餘行腹痛惡心汗多神氣倦甚問其脉曰脉不吉下痢脉洪大者死細微者生今洪大逆也孫曰痢固忌洪大寒熱亦非細微所宜其中必有故往診其脉察其症果如斯言面色微紅汗淋淋下䆒病所由起謂客來衆厨間躁熱食瓜果菱藕過多晚又過飲接內寢於擔下次日即寒熱腹痛因而下痢與人參白术石膏滑石各五錢知母炮薑各三錢大附子炙甘草各二錢大劑煎之飲訖即睡或問曰服後何狀為佳曰倘得一睡則陰陽和和則汗可斂寒熱嘔惡可止也夜來痢减半汗吐全無脉亦斂矣再用人參石膏白术白芍滑石各三錢炮薑肉桂知母各二錢炙甘草附子各一錢服後瘧止痢又减半飲食漸進神氣漸復改用酒芍五錢人參白术滑石各二錢甘草陳皮炮薑肉桂各一錢三劑痢全止而痊或問寒熱均投此何症而劑何名也笑曰此滑公所謂混沌湯也經云夏傷於暑秋必瘧痢白虎湯益元散又云瓜果寒涼傷其中氣酒後御內損其下元附子理中湯正所以溫中補氣下者經又云實者邪氣實也故以白虎益元應之虛者正氣虛也故以理中湯應之若以寒熱均用為疑則仲景附子甘草㵼心湯既用大黃黃連又用乾薑附子此何說哉蓋假真對真也臧茗泉脉左弦數右寸弱關大重按則滑右尺微原以瘧後復傷飲食大便㵼而變痢一日夜只五六行皆積滯無糞腹疼後重難堪午未後發熱天明始退此夏傷於暑秋成瘧痢也其熱仍瘧之餘邪當先解散然後以補劑之則利自愈矣與神授香連丸一服腹中腸鳴須臾大便行較前更多且有糞下改以白芍四錢澤㵼黃連各一錢滑石二錢甘草桂皮各四分山查七分兩日後與補中益氣湯加木香黃連白芍調理半月而瘥張路玉治故友子觸疫瘧之氣染患月餘不止左右乏人失於調理致愈而復發加以五液注下瘧痢兼并水榖不入者半月餘乃携歸齊中日與補中益氣兼理中六君萸桂之屬將養半月而愈李士材治一士冒暑勞苦患血痢危甚用黃連當歸烏梅滑石各五錢香薷三錢甘草一錢而愈症治大還此案可疑陸祖愚治姚可儀祖母年七十精力過人勤勞不倦忽於夏月怒後感冒風凉兼之飲食頭疼骨痛寒熱大作寒則重衾熱則冷飲或以其年髙病重攻補兼施遂腹痛讝語煩躁脉之洪弦而緊謂高年而脉乃如是病正進也須雙解表裡之邪遂用柴葛二陳枳桔查朴芩蘇加生薑二劑表症稍减腹仍痛下利紅白裡急後重日夜去積三十餘次亦脉未减乃用潤字丸一錢香連丸和服日夜三服兩日後痢减半惟臍之上下痞滿又用檳榔青皮木香澤㵼木通芩連滑石之類五六劑方得燥屎與積同去病又减二三仍用香連丸二錢日進二服數日積除痢止改投大補氣血之劑調理月餘而安韓延年長子初患咳嗽已久至七月患瘧復變痢瘧仍未止或以尺脉短澀投養陰清補之劑診之擬加參附前醫亦以為然後更數醫仍不外溫補止塞出入加减服參及四斤病雖减而元氣猶未如故髙麗醫人治疾用藥只一味兩味至三味則極多矣未有至數味者蓋藥性專則達二則濟三則調四則參與制再多則相牽而不能奏功矣偶傳瘧痢二方甚簡而驗今録於此治痢止二味色白者患寒其說未是用生薑一兩細茶五錢色赤者患熱用細茶一兩生薑五錢赤白雜者薑茶各五錢青皮三錢陳皮二錢酒一碗河水一碗煎至一碗溫服即愈李日華六研齊三筆痢後風孫文垣治程氏子年十五夏月患痢醫治彌月痢止而筋骨腫痛痛處發熱晝輕夜重肌肉消飲食减有作白虎厯節風治者有作鶴膝鼓槌風治者病愈甚診之脉皆細澀曰此痢後風也蓋由治痢不善以致寒濕穢瘀凝滯經絡日久血氣為痛所傷此症虛虛實實極難認處方亦不易欲補虛則腫愈劇欲疏通則痛愈甚唯局方大防風湯可用防風熟地黃耆人參白芍當歸杜仲各一錢白术一劑五分羌活牛膝甘草回陽各五分川芎七分加薑三片服三十貼而安陳三農治一士痢後腰腿攣痛不能俯仰此腎虛風寒濕所乘也用獨活寄生湯二劑愈汪紹兄室人年五十餘新秋患淋祕小愈即勿藥初冬先自汗兩日遂寒熱成胎瘧醫略與消散不效將半月復增滯下腹痛後重日一二十行因見其脉如蛛絲聲微氣乏疑屬虛寒乃用二陳湯香砂蒼朴溫胃燥脾之劑十餘日舌胎盡黑多汗不眠遂辭去診之脉果沈微語殊輕怯然小便熱短胸膈痞悶瘧則熱多於寒痢則紅少於白此伏氣所發陳莖鬱積大腑為病也在金匱法宜下之但其稟賦甚弱三陰素虧不可峻治且前所服類皆溫燥故令積滯不行宜以潤滑甘寒之品𨗳之用生地杞子麥冬蔞仁當歸木通白芍黃芩枳殼桔梗數劑覺去宿垢甚多又數劑而痢止瘧仍間日一作加痰嗽甚頻此腸胃既通餘熱挾虛火上竄也前方去枳桔當歸木通加沙參熟地地骨首烏之屬十餘劑黑胎始盡而寒熱除又數劑痰嗽亦止後因勞瘧復作用補中益氣去人參加熟地一兩一劑而愈愈後左關尺仍細弱向若峻下必生變矣當病甚時一專科與木香白术炮薑補骨脂等亦幸而未服續名醫類案卷十一
